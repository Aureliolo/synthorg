name: Release - Cut

on:
  push:
    branches: [main]

permissions: {}

env:
  # One owner for the model name: the request, the attribution line the
  # release note carries, and the dry-run's default all read this.
  #
  # The `-latest` alias is deliberate: it never hits a deprecation date.
  # A plan can withdraw a model without notice, and because this step is
  # best-effort that failure has no visible symptom, so the report-failure
  # job below is what surfaces a model that stops answering.
  HIGHLIGHTS_MODEL: mistral-medium-latest

  # Selects the Highlights sticky comment by AUTHOR as well as by marker.
  # The release PR is public and stays open for days, so a marker match alone
  # would let any account post a comment that this workflow then updates,
  # mirrors into the PR body and promotes into the published release, and
  # whose forged state line feeds the regeneration throttle. The comment is
  # posted with `github.token`, so `github-actions[bot]` is the only
  # legitimate author and is a login no third party can take.
  #
  # `flatten(1)` because `--paginate --slurp` yields one array per page; it is
  # a no-op on an already-flat array, so it is correct either way.
  STICKY_SELECT: 'flatten(1) | map(select(.user.login == "github-actions[bot]" and (.body | contains("<!-- HIGHLIGHTS_STICKY -->"))))'

# Serialise: every main push updates the SAME sticky release-please PR
# branch. Two overlapping runs racing the BSL Change Date Contents-API
# commit on that branch produced HTTP 409 "does not match" conflicts.
# Queue rather than cancel so an in-flight run always finishes creating
# the release PR and posting its required-check statuses. GitHub keeps
# only the newest queued run; dropping older ones is safe because each
# run reconciles full main state from scratch.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    # Fork gate: release-please needs the synthorg-repo-bot App token
    # to mint signed commits + bypass GITHUB_TOKEN's anti-recursion rule.
    # Forks don't have those env-scoped secrets; skip cleanly.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    # Bound total wall time. Every retry-wrapped gh call below carries the
    # gh_with_retry.sh ladder (~1m45s worst case each), and a black-holed
    # connection is not bounded by the ladder itself. Cap the job so a stuck
    # API call cannot hold a runner up to the 6h default and block the
    # cancel-in-progress:false concurrency group.
    #
    # This is a CEILING on a stuck job, not a budget every ladder fits
    # inside: enough of them exhausting at once exceeds it, and being killed
    # at 15 minutes is the wanted outcome when the API is out that long. The
    # call sites are deliberately not enumerated here, because a list in a
    # comment cannot be held to the job below it.
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      pull-requests: write
      # For the "Post CI Pass status on release PR" step below: the
      # statuses API needs `statuses: write` to mark the required
      # `CI Pass` check satisfied on the release PR's head SHA
      # without running verify-backend.yml. See the rationale on that step.
      statuses: write
    outputs:
      # Surfaced so the Highlights tracker job below can alert on a
      # generation that failed. The generate step is continue-on-error, so
      # the job result stays `success` and the existing release-please
      # tracker never fires on it.
      # Three separate outcomes, because generating the summary, rendering it
      # and publishing it fail independently. Reporting only the first meant a
      # render or publish failure left this reading `ok`, and the recovery job
      # below then closed the tracker asserting a success that never happened.
      highlights_status: ${{ steps.highlights.outputs.status }}
      # The digest fails BEFORE a model is ever called, and those paths exit 0
      # so the release still cuts. Without this output the tracker condition
      # below sees three empty statuses and stays quiet, so a sustained
      # `releases/latest` or `compare` outage would stop Highlights in exactly
      # the silence the tracker exists to end.
      highlights_digest_status: ${{ steps.digest.outputs.status }}
      highlights_render: ${{ steps.render.outputs.status }}
      highlights_publish: ${{ steps.publish.outputs.status }}
      highlights_skipped: ${{ steps.digest.outputs.skip }}
      highlights_throttled: ${{ steps.digest.outputs.regenerate }}
      # A digest cut short by the compare endpoint's 250-commit ceiling omits
      # the oldest work in the release without failing anything, which is the
      # same silent degradation the tracker exists to end.
      highlights_truncated: ${{ steps.digest.outputs.truncated }}
      highlights_commits: ${{ steps.digest.outputs.total_commits }}
    steps:
      # Minimal checkout of main required so `./.github/actions/...`
      # paths resolve on the runner disk. `fetch-depth: 1` is enough;
      # release-please works via REST API, not the local working tree.
      # The BSL-date step reads + writes LICENSE on the release branch
      # entirely through the Contents API, so no branch checkout is needed.
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Shared setup: validate ref is refs/heads/main and mint the
      # synthorg-repo-bot App installation token.
      - name: Release runner setup
        id: setup
        uses: ./.github/actions/release-runner-setup
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          # release-please creates/updates the release branch + release PR
          # under the App identity, so the token needs contents+PRs write.
          permission-contents: write
          permission-pull-requests: write

      # Retry-wrapped: with `force-tag-creation`, release-please mints the
      # tag and creates the release in two separate API calls, so a blip on
      # the second leaves a live tag with no release behind it. Rationale and
      # the output caveat live in the action's own description.
      - uses: ./.github/actions/release-please
        id: release
        with:
          token: ${{ steps.setup.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # The invariant the retry exists to protect, asserted directly: a tag
      # this repository releases under must have a release behind it. Runs on
      # every push to main, so it is level-triggered rather than tied to the
      # run that happened to cut the release, and `always()` because the
      # state worth naming is exactly the one release-please leaves when it
      # fails partway.
      - name: Assert the released tag has a release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # A shorter ladder than the helper's default, because this step is
          # level-triggered (the next push to main re-asks the same question)
          # and its exhaustion path already passes with a warning. Two
          # attempts still ride out a single blip while keeping the step's
          # contribution to the job's wall-time ceiling near zero.
          GH_RETRY_ATTEMPTS: "2"
        run: |
          set -euo pipefail
          # The manifest on the merge commit names the version being cut, so
          # on an ordinary push it names the last one released and both
          # halves are expected to exist.
          version=$(jq -re '."."' .github/.release-please-manifest.json)
          tag="v${version}"

          # `matching-refs` answers 200 with `[]` for an absent tag where
          # `git/ref/tags` answers 404, so both probes below always succeed
          # on a healthy API and a transient blip cannot be misread as an
          # absence. The prefix match is deliberately widened by an exact
          # comparison: `v0.9.4` also matches `v0.9.40`.
          rc=0
          refs=$(.github/scripts/gh_with_retry.sh "tag ref lookup for $tag" \
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq '.[].ref') || rc=$?
          # A read that never landed cannot decide the invariant either way.
          # EX_TEMPFAIL (75) is the one outcome this may pass on, because the
          # next push re-asks the same question; every other failure is real.
          if [ "$rc" -eq 75 ]; then
            echo "::warning::tag/release assertion skipped: tag ref lookup exhausted its retries"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          if ! printf '%s\n' "$refs" | grep -qxF "refs/tags/$tag"; then
            echo "No tag $tag yet; nothing to assert."
            exit 0
          fi

          # Releases are created as drafts here, and `releases/tags/{tag}`
          # does not serve drafts, so the release has to be found by scanning
          # the list.
          rc=0
          tags=$(.github/scripts/gh_with_retry.sh "release lookup for $tag" \
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[].tag_name') || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "::warning::tag/release assertion skipped: release lookup exhausted its retries"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          if printf '%s\n' "$tags" | grep -qxF "$tag"; then
            echo "Tag $tag has a release."
            exit 0
          fi

          echo "::error::Half-released: tag $tag exists but no release (draft or published) is attached to it. The tag has already triggered the tag-driven image and CLI workflows, which have no draft to upload assets to, and Release - Finalise has nothing to publish. Re-run this workflow to let release-please finish the release it started."
          exit 1

      # When Release Please creates/updates a release PR, update the BSL
      # Change Date to 3 years from today. The date update ships as part
      # of the release PR, so it goes through normal review + merge flow.
      - name: Update BSL Change Date (release + 3 years)
        if: steps.release.outputs.pr != ''
        env:
          # GITHUB_TOKEN (not the PAT) so the Contents API commit ships
          # with a GitHub-signed verification -- PAT-authored API commits
          # are unsigned, while GITHUB_TOKEN commits are signed by GitHub
          # and attributed to github-actions[bot]. Workflow recursion is
          # not a concern here because the commit lands on the release PR
          # branch, not main.
          GH_TOKEN: ${{ github.token }}
          BRANCH: release-please--branches--main--components--synthorg
        run: |
          set -euo pipefail
          new_date=$(LC_TIME=C date -d "+3 years" "+%B %-d, %Y")  # GNU date (ubuntu-24.04)
          echo "Updating Change Date to: $new_date"

          # Read LICENSE content + its blob sha from the single source the
          # PUT's optimistic-lock check consults -- the Contents API on the
          # release branch -- so the sha we send always matches the sha the
          # API holds. This is the canonical read-sha-then-conditional-write
          # pattern; no branch checkout is needed.
          api_json=$(.github/scripts/gh_with_retry.sh "LICENSE contents read" \
            gh api "repos/$GITHUB_REPOSITORY/contents/LICENSE?ref=$BRANCH")
          cur_sha=$(printf '%s' "$api_json" | jq -re '.sha')
          printf '%s' "$api_json" | jq -r '.content' | tr -d '\n' | base64 -d > LICENSE

          sed -i "s/^Change Date:          .*/Change Date:          $new_date/" LICENSE
          grep -q "^Change Date:.*$new_date" LICENSE || {
            echo "::error::sed pattern did not match; Change Date was not updated"
            exit 1
          }
          if [ "$(git hash-object --no-filters LICENSE)" = "$cur_sha" ]; then
            echo "Change Date already up to date -- skipping commit"
            exit 0
          fi

          # Commit via the GitHub Contents API with GITHUB_TOKEN. The
          # resulting commit is signed by GitHub and authored by
          # github-actions[bot], appearing as Verified in the release PR
          # UI. (The eventual squash-merge produces a separate GitHub-
          # signed commit on main regardless of this step's signature.)
          # Materialise the payload to a file (not a pipe) so each
          # gh_with_retry.sh attempt re-reads identical stdin -- a piped
          # `--input -` drains on the first attempt, leaving a retry with
          # empty input. The write is idempotent: the embedded blob `sha`
          # optimistic-locks it, so retrying a transient 5xx / timeout
          # cannot double-commit, and a real 409/422 sha conflict (a
          # concurrent push to the branch) fast-fails so the next main push
          # retriggers cleanly rather than looping on a stale sha.
          payload=$(mktemp)
          jq -n \
            --arg msg "chore: update BSL Change Date to $new_date" \
            --arg content "$(base64 -w0 LICENSE)" \
            --arg sha "$cur_sha" \
            --arg branch "$BRANCH" \
            '{message: $msg, content: $content, sha: $sha, branch: $branch}' > "$payload"
          .github/scripts/gh_with_retry.sh "BSL Change Date write" \
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/LICENSE" --input "$payload"

      # ── Release-notes tagline + Highlights ──
      # Generate a one-line tagline and a two-section Highlights summary,
      # publish both to a sticky comment on the release PR, and mirror them
      # into the PR body. Opt-out: a `No-Highlights:` trailer
      # (case-insensitive) anywhere in the PR body.
      #
      # The STICKY COMMENT is the source of truth and the body copy is a
      # convenience for whoever reviews the PR. release-please owns that body
      # and rewrites it whenever the changelog changes, so a body-only block
      # is deleted by the first rewrite after any failed generation, and
      # nothing puts it back.
      #
      # The digest comes from commit MESSAGES via the compare API rather than
      # from the PR body. The body carries subjects alone, and a subject names
      # a change without saying what it does, which is not enough to write a
      # summary from and nowhere near enough to write a tagline from.
      - name: Build changelog digest
        if: steps.release.outputs.pr != ''
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
          # Null-safe: env is evaluated before the step's `if` is checked, so
          # `fromJSON('')` would fail the workflow whenever release-please has
          # no PR to surface (typically the post-release-merge run, when no
          # commits sit past the freshly-tagged release).
          PR_NUMBER: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Digest construction is best-effort. A transient-exhaustion
          # (EX_TEMPFAIL, exit 75) on the body read must NOT abort the
          # release-please workflow -- skip Highlights and let the required
          # status posting proceed. Any other non-zero is a real failure.
          rc=0
          BODY=$(.github/scripts/gh_with_retry.sh "release PR body read" \
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body') || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "::warning::release PR body read deferred (transient GitHub API failure); skipping best-effort Highlights generation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            echo "::error::release PR body read failed (exit ${rc})"
            exit "$rc"
          fi

          # Skip if the PR body opts out.
          if printf '%s' "$BODY" | grep -qiE '^[[:space:]]*no-highlights:'; then
            echo "No-Highlights: trailer detected; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every API call below is retry-wrapped and its failure separated
          # from its legitimate empty answer. This step has no
          # `continue-on-error`, and the required-status posting that makes the
          # release PR mergeable runs AFTER it, so an unguarded call here would
          # let a transient 5xx on a cosmetic feature block a real release.
          #
          # `releases/latest` excludes drafts and prereleases, so it names the
          # last STABLE release. Dev tags ship as draft prereleases and must
          # not become the base, or the digest would cover a single push.
          rc=0
          BASE=$(.github/scripts/gh_with_retry.sh "latest release read" \
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name') || rc=$?
          if [ "$rc" -ne 0 ]; then
            # A read that FAILED is not the same as a repo with no release
            # yet, and must not be reported as a clean skip: the tracker
            # ignores skips, so conflating them hides a persistent outage.
            echo "::warning::could not read the latest release (exit ${rc}); skipping Highlights."
            echo "status=latest-release read failed (exit ${rc})" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE" ]; then
            echo "::notice::no stable release to compare against yet; skipping Highlights."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rc=0
          COMPARE=$(.github/scripts/gh_with_retry.sh "compare read" \
            gh api "repos/$GITHUB_REPOSITORY/compare/${BASE}...${HEAD_SHA}") || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::could not compare ${BASE}...${HEAD_SHA} (exit ${rc}); skipping Highlights."
            echo "status=compare read failed (exit ${rc})" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # build_release_digest.py drops the structural noise (issue refs,
          # headings, tables, fenced code, pre-PR review chatter), caps each
          # commit and wraps the result in its untrusted-content fence. Its
          # stderr carries the truncation warning the tracker below reads: a
          # digest cut short at the un-paginated compare ceiling silently omits
          # the OLDEST work in the release.
          TOTAL=$(printf '%s' "$COMPARE" | jq -r '.total_commits // 0')
          rc=0
          DIGEST=$(printf '%s' "$COMPARE" | python3 scripts/build_release_digest.py 2> digest-stderr.txt) || rc=$?
          cat digest-stderr.txt
          if grep -q 'digest is partial' digest-stderr.txt; then
            echo "truncated=true" >> "$GITHUB_OUTPUT"
          fi
          # A refused payload is a FAILURE, not a skip. Swallowing the exit
          # code let the empty-digest branch below write `skip=true`, and the
          # tracker excludes skipped runs, so a compare shape the script
          # rejects would drop Highlights with nothing raised anywhere.
          if [ "$rc" -ne 0 ]; then
            echo "::warning::digest builder rejected the compare payload (exit ${rc}); skipping Highlights."
            echo "status=digest builder failed (exit ${rc})" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${DIGEST//[[:space:]]/}" ]; then
            echo "::warning::digest for ${BASE}...${HEAD_SHA} came out empty; skipping Highlights"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Regeneration throttle ──
          # This workflow runs on every push to main, and the digest it builds
          # grows by one commit at a time. Regenerating per push would reroll
          # the tagline several times a day (so the line reviewed on the PR is
          # never the line that ships) and pay the full input cost each time
          # for a document that barely moved.
          #
          # The threshold scales with the release, because one commit means
          # something different at 10 commits than at 180. Below 30 it is 1, so
          # a young release regenerates on every push, which is right: every
          # commit is then a material fraction of it.
          if [ "$TOTAL" -lt 30 ]; then
            THRESHOLD=1
          else
            THRESHOLD=$((TOTAL / 30))
            [ "$THRESHOLD" -lt 2 ] && THRESHOLD=2
          fi

          # Prior state rides in the sticky comment, the same place the block
          # itself lives, so there is no second store to fall out of step.
          # Author-filtered and read with `first`, matching the write side: a
          # forged comment must not be able to feed the arithmetic below.
          # rc is captured rather than swallowed with `|| STATE=""`, which
          # cannot tell "no sticky comment yet" (the legitimate first run,
          # where jq and sed both exit 0 and STATE is correctly empty) from
          # "the read failed". Both degrade to a regeneration, which is the
          # harmless direction, but only one of them is worth knowing about:
          # a persistent failure silently pays the full model cost and
          # rerolls the tagline on every push, for as long as it lasts.
          # Matches the BASE and COMPARE reads above, whose status output the
          # tracker already reads.
          rc=0
          STATE=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate --slurp \
            | jq -r "$STICKY_SELECT | first | .body // empty" \
            | sed -n 's/.*HIGHLIGHTS_STATE base=\([^ ]*\) commits=\([0-9]*\).*/\1 \2/p') || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::could not read prior Highlights state (exit ${rc}); forcing regeneration."
            echo "status=sticky-state read failed (exit ${rc})" >> "$GITHUB_OUTPUT"
            STATE=""
          fi
          PREV_BASE=$(printf '%s' "$STATE" | cut -d' ' -f1)
          PREV_COUNT=$(printf '%s' "$STATE" | cut -d' ' -f2)

          # A digit string is not yet a safe operand: bash reads a leading zero
          # as octal, so `008` is a fatal arithmetic error under `set -e`, and
          # this step failing skips the required-status posting below. Anything
          # not a plain bounded integer degrades to a regeneration, which is
          # the harmless direction.
          case "$PREV_COUNT" in
            0 | [1-9][0-9][0-9][0-9][0-9] | [1-9][0-9][0-9][0-9] | [1-9][0-9][0-9] | [1-9][0-9] | [1-9]) ;;
            *) PREV_COUNT="" ;;
          esac

          REGENERATE=true
          REASON="no previous Highlights for this release"
          if [ -n "$PREV_COUNT" ] && [ "$PREV_BASE" = "$BASE" ]; then
            GROWTH=$((TOTAL - PREV_COUNT))
            if [ "$GROWTH" -lt "$THRESHOLD" ]; then
              REGENERATE=false
              REASON="only ${GROWTH} new commit(s) since the last run, threshold ${THRESHOLD}"
            else
              REASON="${GROWTH} new commit(s) since the last run, threshold ${THRESHOLD}"
            fi
          fi
          echo "regenerate=${REGENERATE} (${REASON})"
          {
            echo "regenerate=${REGENERATE}"
            echo "total_commits=${TOTAL}"
            echo "base=${BASE}"
          } >> "$GITHUB_OUTPUT"

          # Written to a file because GITHUB_OUTPUT does not handle multi-line
          # content well. The digest arrives already fenced: the script owns
          # the untrusted-content wrapper and its closing-tag escape, so the
          # workflow and the dry-run cannot hold two versions of one regex.
          printf '%s' "$DIGEST" > changelog-digest.txt
          echo "Digest for ${BASE}...${HEAD_SHA}: $(wc -c < changelog-digest.txt) bytes, ${TOTAL} commits"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Generate Highlights via Mistral
        if: steps.release.outputs.pr != '' && steps.digest.outputs.skip != 'true' && steps.digest.outputs.regenerate == 'true'
        id: highlights
        # Highlights are cosmetic release-note polish; Release Please has
        # already created / updated the release PR by the time this step
        # runs. A Mistral quota hit, model timeout, or transient service
        # error must NOT fail the release pipeline -- every failure path
        # below exits 0 with no `response` output, so the publish steps
        # simply skip and the release proceeds. `status` records WHICH of
        # those paths was taken, because a step that only ever succeeds is a
        # step nothing can alert on.
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ env.HIGHLIGHTS_MODEL }}
        run: |
          set -euo pipefail
          echo "status=unknown" >> "$GITHUB_OUTPUT"

          # The prompt lives in a file both this workflow and the dry-run
          # read, so there is exactly one place to keep it correct.
          #
          # reasoning_effort gives the model a real scratchpad to count
          # entries, form clusters and check them against the prompt's band
          # before writing anything: without it, "work internally" has
          # nowhere to happen, since a plain completion emits its answer in
          # one pass. Measured (dry-run, this exact prompt): 6-79 bullets
          # across four calls without reasoning; 12, 12 and 11 across three
          # calls with it. HIGHLIGHTS_MODEL must keep resolving to a model that
          # accepts this field; a future swap to one that rejects it fails
          # this step, which is best-effort and reported by the tracking job
          # below. max_tokens must leave headroom BEYOND the visible answer:
          # thinking and the final text draw from the same budget, and a
          # digest spanning many commits can let reasoning alone exhaust a
          # tight budget, producing empty content that the guards below then
          # correctly skip rather than publish truncated. Keep max_tokens
          # and reasoning_effort in sync with release-highlights-dryrun.yml's
          # default if either changes here.
          PAYLOAD=$(jq -n \
            --arg model "$MISTRAL_MODEL" \
            --rawfile sys .github/release-highlights-prompt.md \
            --rawfile digest changelog-digest.txt \
            '{model: $model, temperature: 0.4, max_tokens: 32000,
              reasoning_effort: "high",
              messages: [{role: "system", content: $sys},
                         {role: "user", content: $digest}]}')

          # curl retries transient 429 / 5xx (and transport errors) itself;
          # after exhaustion it returns non-zero, which we swallow (best-effort).
          # `--max-time` is load-bearing rather than tidy: retries only engage
          # once curl reports a failure, and a connection that opens then goes
          # silent has no deadline of its own, so it would ride this step to
          # the job timeout and take the release-blocking status posting with
          # it.
          rc=0
          RESP=$(printf '%s' "$PAYLOAD" | curl -sS \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            -w '\n%{http_code}' \
            -X POST https://api.mistral.ai/v1/chat/completions \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @-) || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Mistral request failed (transport, exit ${rc}); skipping best-effort Highlights."
            echo "status=transport error (curl exit ${rc})" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          if [ "$CODE" != "200" ]; then
            # The response BODY is the diagnosis and the code alone is not: a
            # 403 saying `tier_not_allowed` (the model left the plan) and a
            # 403 saying the key was revoked are the same number and different
            # jobs. Only the named error fields are echoed, not the raw body:
            # this log is public, and a third party's error text is not ours
            # to republish in full.
            DETAIL=$(printf '%s' "$BODY" \
              | jq -r '[.type // .object, .code, .message] | map(select(. != null)) | join(" ")' 2>/dev/null \
              | head -c 200 | tr -d '\n') || DETAIL=""
            echo "::warning::Mistral returned HTTP ${CODE}: ${DETAIL:-no parsable error fields}"
            echo "status=HTTP ${CODE}: ${DETAIL:-unparsable}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # reasoning_effort makes message.content a list of {type, ...}
          # chunks (thinking + text) instead of a plain string; keep only
          # the text chunks, which is what carries the TAGLINE/bullets
          # this step actually publishes.
          CONTENT=$(printf '%s' "$BODY" | jq -r '
            .choices[0].message.content as $c
            | if ($c | type) == "array"
              then [$c[] | select(.type == "text") | .text] | join("")
              else ($c // empty)
              end')
          if [ -z "$CONTENT" ]; then
            echo "::warning::Mistral returned empty content; skipping best-effort Highlights."
            echo "status=empty completion" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A thinking chunk competes with the visible answer for the same
          # max_tokens budget, so a response that ran out of room mid-answer
          # is no longer just a theoretical edge case. finish_reason "length"
          # names that outcome explicitly; the emptiness check above cannot
          # catch it, since a truncated answer is non-empty. Publishing a cut-
          # off summary is worse than skipping it, and letting it carry
          # status=ok would tell close-highlights-tracker (further down this
          # workflow) that generation recovered when it did not.
          FINISH_REASON=$(printf '%s' "$BODY" | jq -r '.choices[0].finish_reason // empty')
          if [ "$FINISH_REASON" = "length" ]; then
            echo "::warning::Mistral response truncated at max_tokens; skipping best-effort Highlights."
            echo "status=truncated at max_tokens" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The prompt tells the model to answer with this exact line when the
          # fenced changelog tries to redirect it. Publishing that as an
          # ordinary summary would make a detected injection attempt the one
          # outcome nothing reports, so it takes its own status and reaches
          # the tracker.
          if printf '%s' "$CONTENT" | grep -qF 'TAGLINE: Release notes unavailable.'; then
            echo "::warning::model refused: the changelog looks like it carries injected instructions."
            echo "status=model refused (possible prompt injection in a commit message)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Randomised heredoc delimiter: the model output derives from
          # untrusted commit prose, so a fixed marker could be smuggled in
          # to truncate the output value. openssl ships on ubuntu-24.04.
          DELIM="HIGHLIGHTS_RESPONSE_$(openssl rand -hex 12)"
          {
            printf 'response<<%s\n' "$DELIM"
            printf '%s\n' "$CONTENT"
            printf '%s\n' "$DELIM"
            printf 'status=ok\n'
          } >> "$GITHUB_OUTPUT"

      - name: Render Highlights block
        if: steps.highlights.outputs.status == 'ok' && steps.highlights.outputs.response != ''
        id: render
        continue-on-error: true
        env:
          HIGHLIGHTS: ${{ steps.highlights.outputs.response }}
          MISTRAL_MODEL: ${{ env.HIGHLIGHTS_MODEL }}
        run: |
          set -euo pipefail
          echo "status=unknown" >> "$GITHUB_OUTPUT"

          # Marker collision guard: the prompt already tells the model not to
          # emit the markers, but a prompt-injection payload that smuggled one
          # through would let the next run's sticky-strip delete
          # human-authored content between the forged markers. STATE is in the
          # list because a forged one is read back as the throttle's own
          # bookkeeping on the next run.
          SAFE=$(printf '%s' "$HIGHLIGHTS" \
            | sed -E 's/HIGHLIGHTS_(START|END|STATE)/HIGHLIGHTS_\1_escaped/g')

          # The tagline is the first NON-BLANK line behind a `TAGLINE: `
          # prefix. Reading line 1 alone meant one leading blank line from the
          # model published the raw `TAGLINE:` string to every surface.
          # Missing or empty is not a failure: the bullets are the substance
          # and a release note without a joke is still a release note.
          #
          # The `||` is what makes that true. A reply of only whitespace passes
          # the step's `response != ''` guard, and `grep` then matches nothing
          # and exits 1, which under `pipefail` aborts the whole render rather
          # than reaching the no-tagline path a few lines down.
          TAGLINE_LINE=$(printf '%s\n' "$SAFE" | grep -n -m1 '[^[:space:]]' | cut -d: -f1) \
            || TAGLINE_LINE=""
          TAGLINE=""
          HAS_MARKER=0
          if [ -n "$TAGLINE_LINE" ]; then
            # Whether the marker is THERE and what value it carries are two
            # questions. Keying the line removal on the VALUE answers only the
            # second, so a bare `TAGLINE:` kept its line and published the raw
            # marker into the release body as if it were prose.
            if printf '%s\n' "$SAFE" \
              | sed -n "${TAGLINE_LINE}p" \
              | grep -q '^[[:space:]]*TAGLINE:'; then
              HAS_MARKER=1
            fi
            TAGLINE=$(printf '%s\n' "$SAFE" \
              | sed -n "${TAGLINE_LINE}s/^[[:space:]]*TAGLINE:[[:space:]]*//p")
          fi

          # The marker line goes whenever it is present, valued or not; only
          # the tagline's own rendering below is conditional on the value.
          if [ "$HAS_MARKER" -eq 1 ]; then
            BULLETS=$(printf '%s\n' "$SAFE" | sed "${TAGLINE_LINE}d")
          else
            BULLETS="$SAFE"
          fi
          if [ -z "${TAGLINE//[[:space:]]/}" ]; then
            echo "::warning::model emitted no TAGLINE value; rendering Highlights without one."
          fi

          # Assembled with newlines written INSIDE each printf rather than
          # carried on a variable: `$(...)` strips every trailing newline, so
          # building the separator into a captured variable silently glued the
          # tagline and the disclaimer onto one line, where the CLI's
          # line-anchored strip could no longer see the disclaimer at all.
          #
          # Attribution sits above EVERY generated line, tagline included, so
          # a reader is told the whole block is AI-generated before reading
          # any of it rather than after the tagline has already landed the
          # joke. The model name is read from the same variable the request
          # used, so the two cannot drift.
          TRIMMED_BULLETS=$(printf '%s' "$BULLETS" | sed -e 's/^[[:space:]]*$//' -e '/./,$!d')
          {
            printf '<!-- HIGHLIGHTS_START -->\n## Highlights\n\n'
            # shellcheck disable=SC2016  # backticks in the printf format are literal markdown code spans
            printf '> _AI-generated summary (model: `%s` via Mistral). Commit-based changelog below._\n\n' "$MISTRAL_MODEL"
            if [ -n "${TAGLINE//[[:space:]]/}" ]; then
              printf '_%s_\n\n' "$TAGLINE"
            fi
            printf '%s\n\n' "$TRIMMED_BULLETS"
            printf '<!-- HIGHLIGHTS_END -->'
          } > highlights-block.md

          DELIM="HIGHLIGHTS_BLOCK_$(openssl rand -hex 12)"
          {
            printf 'block<<%s\n' "$DELIM"
            cat highlights-block.md
            printf '\n%s\n' "$DELIM"
            printf 'status=ok\n'
          } >> "$GITHUB_OUTPUT"

      - name: Publish Highlights sticky comment
        id: publish
        if: steps.render.outputs.block != ''
        # The sticky comment is the SOURCE OF TRUTH that release-finalize.yml
        # reads. release-please owns the PR body and rewrites it on every
        # changelog change; it does not touch comments, so a generation
        # failure leaves the summary already produced exactly where it is.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number || '' }}
          BLOCK: ${{ steps.render.outputs.block }}
          BASE: ${{ steps.digest.outputs.base }}
          TOTAL: ${{ steps.digest.outputs.total_commits }}
        run: |
          set -euo pipefail
          echo "status=unknown" >> "$GITHUB_OUTPUT"

          # The state marker rides on the comment rather than in a second
          # store, so the record of what was last summarised cannot drift from
          # the summary itself. It sits outside the HIGHLIGHTS markers so
          # release-finalize.yml's extraction never carries it to the release.
          STATE=$(printf '<!-- HIGHLIGHTS_STATE base=%s commits=%s -->' "$BASE" "$TOTAL")
          COMMENT_BODY=$(printf '%s\n%s\n\n%s\n' '<!-- HIGHLIGHTS_STICKY -->' "$STATE" "$BLOCK")

          # Selected by AUTHOR as well as content. The release PR is public and
          # stays open for days, so a marker match alone would let any account
          # hand us a comment to update, mirror into the PR body and promote
          # into the published release. `--slurp` because `--paginate --jq`
          # applies the filter per page, making `first` first-of-page; the
          # selection then runs in its OWN jq, because gh refuses `--slurp`
          # alongside `--jq` and exits 1 before making the request.
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate --slurp \
            | jq -r "$STICKY_SELECT | first | .id // empty")

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" \
              -f body="$COMMENT_BODY" --silent
            echo "Updated Highlights sticky comment $EXISTING on PR #$PR_NUMBER"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$COMMENT_BODY" --silent
            echo "Created Highlights sticky comment on PR #$PR_NUMBER"
          fi
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Mirror Highlights into release PR body
        if: steps.release.outputs.pr != '' && steps.digest.outputs.skip != 'true'
        # Reads the block back from the sticky comment rather than taking it
        # from the render step, so it runs on EVERY push including the ones
        # that skipped regeneration. That matters: release-please rewrites the
        # body whenever the changelog changes, and without an unconditional
        # mirror a throttled push would leave the body stripped until the next
        # regeneration.
        #
        # Convenience only: the comment holds the canonical copy, so a failure
        # here costs a reviewer some scrolling and nothing else.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number || '' }}
        run: |
          set -euo pipefail
          # Being convenience-only buys this step a `continue-on-error`, not
          # silence: without an rc capture a real failure leaves nothing but a
          # red X inside an otherwise-green job, while the legitimate
          # no-comment-yet path below logs. Every other degrade branch in this
          # file annotates, and a reader cannot tell the two apart otherwise.
          rc=0
          COMMENT=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate --slurp \
            | jq -r "$STICKY_SELECT | first | .body // empty") || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::could not read the sticky comment to mirror (exit ${rc}); PR body left as-is."
            exit 0
          fi
          if [ -z "$COMMENT" ]; then
            echo "No Highlights sticky comment yet; nothing to mirror."
            exit 0
          fi

          # Extract by explicit line numbers after confirming the pair is
          # present and ordered: `sed '/START/,/END/'` runs to EOF when the
          # end marker is missing, which would paste the whole comment.
          START_LINE=$(grep -nFx '<!-- HIGHLIGHTS_START -->' <<< "$COMMENT" | head -n1 | cut -d: -f1 || true)
          END_LINE=$(grep -nFx '<!-- HIGHLIGHTS_END -->' <<< "$COMMENT" | head -n1 | cut -d: -f1 || true)
          if [ -z "$START_LINE" ] || [ -z "$END_LINE" ] || [ "$START_LINE" -ge "$END_LINE" ]; then
            echo "::warning::sticky comment has no well-formed Highlights block; body left alone."
            exit 0
          fi
          BLOCK=$(sed -n "${START_LINE},${END_LINE}p" <<< "$COMMENT")

          # The old block is removed by line number for the same reason: an
          # unterminated start marker in the body would make a `/START/,/END/`
          # range delete everything after it, taking the changelog with it.
          CUR_BODY=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
          BODY_START=$(grep -nFx '<!-- HIGHLIGHTS_START -->' <<< "$CUR_BODY" | head -n1 | cut -d: -f1 || true)
          BODY_END=$(grep -nFx '<!-- HIGHLIGHTS_END -->' <<< "$CUR_BODY" | head -n1 | cut -d: -f1 || true)
          if [ -n "$BODY_START" ] && [ -n "$BODY_END" ] && [ "$BODY_START" -lt "$BODY_END" ]; then
            CLEANED=$(sed "${BODY_START},${BODY_END}d" <<< "$CUR_BODY")
          else
            if [ -n "$BODY_START" ] || [ -n "$BODY_END" ]; then
              echo "::warning::PR body carries an unpaired Highlights marker; leaving it in place."
            fi
            CLEANED="$CUR_BODY"
          fi
          # The range delete removes the marker lines and leaves the blank one
          # that followed the block, so CLEANED opens on an empty line and the
          # reassembly below adds one more than the body had. Unstripped, the
          # comparison never matches: `gh pr edit` would run on every push to
          # main and the stored body would gain a blank line each time.
          CLEANED=$(sed -e '/./,$!d' <<< "$CLEANED")
          NEW_BODY=$(printf '%s\n\n%s' "$BLOCK" "$CLEANED")
          if [ "$NEW_BODY" = "$CUR_BODY" ]; then
            echo "PR body already carries this block; no edit needed."
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$NEW_BODY"
          echo "Highlights mirrored into PR #$PR_NUMBER body"

      # ── Mark required status checks satisfied on the release PR ──
      # release-please opened / updated the PR using the
      # synthorg-repo-bot App installation token. GitHub's
      # anti-recursion rule blocks `pull_request` workflows for
      # events created by the workflow's own installation token,
      # so verify-backend.yml / perf-benchmarks.yml / perf-web-vitals.yml
      # never auto-fire on release PRs.
      #
      # An earlier attempt used `gh workflow run verify-backend.yml
      # --ref <release-branch>` to nudge verify-backend.yml via
      # workflow_dispatch -- but workflow_dispatch runs produce a
      # check_suite with empty `pull_requests`, so the resulting
      # check_run does NOT appear in the PR's status rollup.
      # Branch protection still saw the check on the SHA, but the
      # merge UI showed "<Check> -- Expected, waiting" forever
      # (visible to a human viewer; not a real check failure but
      # indistinguishable from one in the UI).
      #
      # Release PRs touch only CHANGELOG.md, version.txt, and the
      # manifest -- there is no source code that any of these
      # workflows could meaningfully test or benchmark. We
      # therefore post each required *commit status* (not
      # check_run) directly on the PR head SHA. Statuses are in
      # the rollup unconditionally, satisfy branch protection's
      # required-check evaluation, and don't require any workflow
      # run at all. verify-backend.yml's `is_release_please` skip stays in
      # place as defense-in-depth in case release-please's
      # identity ever changes.
      #
      # The required-context list MUST stay in sync with
      # `.github/branch_protection.yml` (the spec) and the live
      # `protect-main` ruleset. The branch-protection drift audit
      # in verify-backend.yml will surface the spec side; new required
      # contexts must be added here at the same time, or the
      # release PR will silently re-block.
      #
      # Resolves the head SHA AT THIS POINT (after the BSL Change
      # Date Contents-API commit) so the statuses post on the
      # final SHA the PR will be merged at, not the
      # release-please-action output captured before that commit.
      - name: Post required-check statuses on release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release-please--branches--main--components--synthorg
        run: |
          set -euo pipefail
          # Release-BLOCKING step: these statuses satisfy branch protection
          # on the release PR. Retry-wrap the head-SHA read AND each status
          # POST (idempotent) so a transient 401/5xx does not leave the PR
          # permanently un-mergeable with "Expected, waiting".
          HEAD_SHA=$(.github/scripts/gh_with_retry.sh "release-PR head-SHA read" \
            gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" --jq '.object.sha')
          DESCRIPTION="release-please PR -- auto-passes (no source changes to test)"
          # Keep in sync with .github/branch_protection.yml ::
          # rulesets[name=protect-main] :: required_status_checks.
          # check_ci_rollup_complete.py fails the build if this list drifts
          # from the spec, so the sync is enforced rather than remembered.
          for context in \
            "CI Pass" \
            "CLI Pass" \
            "Docker Pass" \
            "CodSpeed Python Pass" \
            "CodSpeed Web Pass" \
            "Lighthouse Pass"; do
            .github/scripts/gh_with_retry.sh "status post '$context'" \
              gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f "state=success" \
              -f "context=$context" \
              -f "description=$DESCRIPTION"
            echo "Posted '$context'=success on $HEAD_SHA"
          done

  report-failure:
    name: Open / update tracking issue on release-please failure
    needs: release-please
    if: >-
      always()
      && !github.event.repository.fork
      && needs.release-please.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/post-tracking-issue)
      issues: write     # gh issue create / comment / pin
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compose body
        id: body
        env:
          RESULT: ${{ needs.release-please.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo 'body<<TRACKING_ISSUE_BODY_EOF'
            cat <<EOF
          \`release-please\` workflow failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) with result \`$RESULT\` on $HEAD_SHA.

          Run: ${RUN_URL}

          Likely cause: release-please action failure (manifest drift,
          token mint failure, BSL-date generation), a half-released tag
          (the tag ref minted but the release call did not land, which the
          assertion step in this job names explicitly), or the post-CI-Pass
          status spoof failed. A failed Highlights generation does NOT
          reach here: it is best-effort and carries its own tracker.

          When this stays red, no new release PR is opened on main;
          dev tags continue to mint via release-dev.yml but no stable
          release ever lands. A half-released tag is worse than that: the
          tag is live and has already triggered the image and CLI builds,
          which have no draft release to upload their assets to.
          EOF
            echo 'TRACKING_ISSUE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/post-tracking-issue
        with:
          title: 'release-please regression'
          labels: 'automation:ci-health,type:ci,prio:high'
          body: ${{ steps.body.outputs.body }}
          pin: 'false'
          gh-token: ${{ github.token }}

  # ── Highlights generation tracker ──
  # The generate step is deliberately continue-on-error, so the release
  # never blocks on a summary. The cost of that is a failure with no
  # reader: `continue-on-error` lets a step fail while every check around it
  # stays green. This job is what makes that step observable, matching the
  # CI failure-surfacing policy every other workflow here follows.
  #
  # `skipped` is not a failure. A `No-Highlights:` trailer, a deferred body
  # read and the first release (no stable base to compare against) are all
  # deliberate outcomes and must not open a tracker. Neither is a throttled
  # run, which produces no status at all because it makes no call.
  #
  # Truncation is checked BEFORE the skip gate, not behind it: a compare that
  # returns fewer commits than it claims sets both flags, and letting `skipped`
  # suppress it would hide the one condition designed to always alert.
  report-highlights-failure:
    name: Open / update tracking issue on Highlights failure
    needs: release-please
    if: >-
      always()
      && !github.event.repository.fork
      && needs.release-please.result == 'success'
      && (
        needs.release-please.outputs.highlights_truncated == 'true'
        || needs.release-please.outputs.highlights_digest_status != ''
        || (
          needs.release-please.outputs.highlights_skipped != 'true'
          && (
            (
              needs.release-please.outputs.highlights_status != ''
              && needs.release-please.outputs.highlights_status != 'ok'
            )
            || needs.release-please.outputs.highlights_render == 'unknown'
            || needs.release-please.outputs.highlights_publish == 'unknown'
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/post-tracking-issue)
      issues: write     # gh issue create / comment / pin
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compose body
        id: body
        env:
          DIGEST: ${{ needs.release-please.outputs.highlights_digest_status }}
          STATUS: ${{ needs.release-please.outputs.highlights_status }}
          RENDER: ${{ needs.release-please.outputs.highlights_render }}
          PUBLISH: ${{ needs.release-please.outputs.highlights_publish }}
          TRUNCATED: ${{ needs.release-please.outputs.highlights_truncated }}
          COMMITS: ${{ needs.release-please.outputs.highlights_commits }}
          MODEL: ${{ env.HIGHLIGHTS_MODEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo 'body<<TRACKING_ISSUE_BODY_EOF'
            cat <<EOF
          Release-notes Highlights degraded at $(date -u +%Y-%m-%dT%H:%M:%SZ) on $HEAD_SHA.

          Model: \`${MODEL}\`
          Digest: \`${DIGEST:-ok}\`
          Generation: \`${STATUS:-not reached}\`
          Render: \`${RENDER:-not reached}\`
          Publish: \`${PUBLISH:-not reached}\`
          Digest truncated: \`${TRUNCATED:-false}\` (${COMMITS:-?} commits in range)

          Run: ${RUN_URL}

          The release is NOT blocked. What breaks is the summary: the release
          PR keeps whatever sticky comment a previous run produced, and if
          none exists the published release and \`synthorg update\` ship with
          no Highlights and no tagline at all.

          If the outcome above reads \`tier_not_allowed\`, the model has left
          the account's plan and \`HIGHLIGHTS_MODEL\` in release-cut.yml needs
          repointing. Run \`release-highlights-dryrun.yml\` to list the models
          the key can currently call.

          If truncation is \`true\`, the range has passed the compare
          endpoint's 250-commit ceiling, so the digest silently omits the
          OLDEST work in the release and the summary cannot mention it. Cut a
          release, or teach the digest step to paginate.
          EOF
            echo 'TRACKING_ISSUE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/post-tracking-issue
        with:
          title: 'Release Highlights generation is failing'
          labels: 'automation:ci-health,type:ci,prio:medium'
          body: ${{ steps.body.outputs.body }}
          pin: 'false'
          gh-token: ${{ github.token }}

  # Self-resolving counterpart: a recovered generation closes the tracker
  # rather than leaving a stale red issue for somebody to notice and tidy.
  close-highlights-tracker:
    name: Close Highlights tracker on recovery
    needs: release-please
    # Every stage must have succeeded. Closing on the generation status alone
    # announced a recovery whenever the model answered and the render or the
    # publish then failed, which is a worse signal than staying quiet.
    if: >-
      always()
      && !github.event.repository.fork
      && needs.release-please.outputs.highlights_digest_status == ''
      && needs.release-please.outputs.highlights_status == 'ok'
      && needs.release-please.outputs.highlights_render == 'ok'
      && needs.release-please.outputs.highlights_publish == 'ok'
      && needs.release-please.outputs.highlights_truncated != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/post-tracking-issue
        with:
          mode: 'close'
          title: 'Release Highlights generation is failing'
          body: 'Highlights generated successfully; closing. This tracker reopens automatically if generation regresses.'
          close-comment-sha: ${{ github.sha }}
          gh-token: ${{ github.token }}
