name: Build apko base image (scan)
description: >-
  Build an apko-composed base image and run vulnerability scans. Always uploads
  the built image as an artifact so the companion publish-apko-base action can
  push, sign, and attest it on non-PR events with elevated permissions. This
  composite is PR-safe: it needs only `contents: read` and `security-events:
  write` (for the Trivy SARIF upload).

inputs:
  image-name:
    description: "Image name suffix (e.g. backend, sandbox, sidecar, fine-tune)"
    required: true
  apko-yaml:
    description: "Path to apko.yaml relative to repo root"
    required: true
  apko-version:
    description: "apko version to install, including the leading `v` (e.g. `v1.2.9`). Used verbatim in the GitHub releases download URL."
    required: true
  trivy-version:
    description: "Trivy version, WITHOUT a leading `v` (e.g. `0.70.0`). The release download URL adds the `v` prefix; the tarball filename does not."
    required: true

outputs:
  tag:
    description: "Image tag (sha-based)"
    value: ${{ steps.image-ref.outputs.tag }}
  artifact-name:
    description: "Name of the uploaded base image tarball artifact"
    value: ${{ inputs.image-name }}-base-image
  tarball-name:
    description: "Filename of the uploaded tarball inside the artifact"
    value: ${{ inputs.image-name }}-base.tar

runs:
  using: composite
  steps:
    - name: Set up apko
      uses: ./.github/actions/setup-apko
      with:
        version: ${{ inputs.apko-version }}

    # The tag needs bash: `${GITHUB_SHA::7}` is a bash substring expansion and
    # the retry action's `command:` runs under sh. The lockfile path needs no
    # such workaround (`%.yaml` is POSIX suffix removal); it is derived here
    # only so the two cannot drift into separate steps. The extension is
    # asserted rather than assumed, because `foo.yml` would silently derive
    # `foo.yml.lock.json` and surface as a generic missing-file error from apko
    # instead of naming the actual mistake.
    - name: Compute image tag and lockfile path
      id: image-ref
      shell: bash
      env:
        APKO_YAML: ${{ inputs.apko-yaml }}
      run: |
        case "${APKO_YAML}" in
          *.yaml) ;;
          *)
            echo "::error::apko-yaml must end in .yaml, got: ${APKO_YAML}" >&2
            exit 1
            ;;
        esac
        echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        echo "lockfile=${APKO_YAML%.yaml}.lock.json" >> "$GITHUB_OUTPUT"

    # `apko build` pulls every package + signing key from the Wolfi mirror;
    # a single 5xx on packages.wolfi.dev fails the build. Retry the whole
    # invocation so a transient mirror blip doesn't kill base-image CI.
    #
    # `--lockfile` is what makes the weekly `apko lock` refresh mean anything:
    # the flag defaults to empty, which apko documents as "no additional
    # constraints", and it does NOT pick up a sibling lock on its own. Without
    # it every build re-resolves against whatever the mirror serves that
    # minute, so the committed versions pin nothing and two builds of one
    # commit can differ. Wolfi retains superseded versions, so a lock does not
    # rot between weekly refreshes; the failure this can produce is a checksum
    # mismatch, which apko names outright and which the pre-push gate catches
    # before it ever reaches CI.
    #
    # `--sbom-path` keeps apko's SBOMs out of the checkout: it writes them to
    # the working directory by default, and nothing here consumes them.
    - name: Build base image
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        APKO_YAML: ${{ inputs.apko-yaml }}
        APKO_LOCKFILE: ${{ steps.image-ref.outputs.lockfile }}
        IMAGE_NAME: ${{ inputs.image-name }}
        SBOM_DIR: ${{ runner.temp }}
        TAG: ${{ steps.image-ref.outputs.tag }}
      with:
        timeout_minutes: 20
        max_attempts: 3
        retry_wait_seconds: 30
        command: |
          apko build \
            --lockfile "${APKO_LOCKFILE}" \
            --sbom-path "${SBOM_DIR}" \
            "${APKO_YAML}" \
            "ghcr.io/aureliolo/synthorg-${IMAGE_NAME}-base:${TAG}" \
            "${IMAGE_NAME}-base.tar"

    - name: Load image for scanning
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        TAG="sha-${GITHUB_SHA::7}"
        docker load -i "${IMAGE_NAME}-base.tar"
        docker tag "ghcr.io/aureliolo/synthorg-${IMAGE_NAME}-base:${TAG}-amd64" "ghcr.io/aureliolo/synthorg-${IMAGE_NAME}-base:${TAG}" 2>/dev/null || true

    - name: Report image size
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        TAG="sha-${GITHUB_SHA::7}"
        scripts/report-image-size.sh "ghcr.io/aureliolo/synthorg-${IMAGE_NAME}-base:${TAG}" "${IMAGE_NAME} Base"

    # Upload the built .tar on every event. On PRs the downstream app build jobs
    # consume it directly; on push/tag the publish-apko-base action downloads it
    # from a companion job that carries the GHCR write permissions.
    - name: Upload base image artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with: # zizmor: ignore[template-injection] -- inputs.image-name is action input, not shell
        name: ${{ inputs.image-name }}-base-image
        path: ${{ inputs.image-name }}-base.tar
        retention-days: 2
        # Every downstream image builds FROM this tarball; an empty upload
        # must fail here rather than as a `docker load` error later.
        if-no-files-found: error

    - name: Install Trivy
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy-version }}
      run: |
        curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o "/tmp/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy_checksums.txt
        (cd /tmp && grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy_checksums.txt | sha256sum -c -)
        tar -xzf "/tmp/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -C /tmp trivy
        sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

    - name: Trivy scan
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        TAG="sha-${GITHUB_SHA::7}"
        IMAGE_REF="ghcr.io/aureliolo/synthorg-${IMAGE_NAME}-base:${TAG}"
        trivy image "${IMAGE_REF}" --format json --output "trivy-${IMAGE_NAME}-base.json" \
          --exit-code 0 --severity CRITICAL,HIGH --ignorefile .github/.trivyignore.yaml \
          --vex .github/vex/synthorg.openvex.json

    - name: Evaluate Trivy results
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
      run: scripts/evaluate-scan.sh "trivy-${IMAGE_NAME}-base.json" "${IMAGE_NAME} Base"

    - name: Trivy SARIF scan
      if: always()
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        IMAGE_TAG: ${{ steps.image-ref.outputs.tag }}
      run: |
        IMAGE_REF="ghcr.io/aureliolo/synthorg-${IMAGE_NAME}-base:${IMAGE_TAG}"
        trivy image "${IMAGE_REF}" --format sarif --output "trivy-${IMAGE_NAME}-base.sarif" \
          --exit-code 0 --severity CRITICAL,HIGH --ignorefile .github/.trivyignore.yaml \
          --vex .github/vex/synthorg.openvex.json

    - name: Upload SARIF to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with: # zizmor: ignore[template-injection]
        sarif_file: trivy-${{ inputs.image-name }}-base.sarif
        category: trivy-${{ inputs.image-name }}-base
