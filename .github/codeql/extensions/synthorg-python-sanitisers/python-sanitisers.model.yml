# SynthOrg Python sanitiser models.
#
# Each row uses the `barrierModel` extensible predicate so CodeQL treats the
# modelled return value as a taint barrier for the named query kind. This is
# the documented Models-as-Data pattern for sanitisers
# (https://codeql.github.com/docs/codeql-language-guides/customizing-library-models-for-python/).
#
# Per-rule scoping is documented in the comments above each block. Only the
# `py/path-injection` query exposes a `barrierNode("path-injection")` hook in
# CodeQL's standard library. Sanitisers for `py/clear-text-logging-sensitive-data`
# and `py/partial-ssrf` are implemented as custom queries under
# `.github/codeql/queries/` because their query modules use abstract
# `Sanitizer` classes with no Models-as-Data wiring upstream. See
# docs/reference/sec-prompt-safety.md#codeql-barrier-inventory for the full
# barrier inventory across both surfaces.

extensions:
  # py/path-injection
  # _resolve_root resolves a candidate against project_root and returns None
  # when the resolved path escapes the trust boundary (commonpath +
  # relative_to). The helper is duplicated across 7 scripts under scripts/;
  # we list each module explicitly because CodeQL MaD does not glob-match
  # package names. Keep this list in sync with `grep -l '^def _resolve_root'
  # scripts/*.py`.
  - addsTo:
      pack: codeql/python-all
      extensible: barrierModel
    data:
      - ["scripts.check_currency_aggregation_invariant", "Member[_resolve_root].ReturnValue", "path-injection"]
      - ["scripts.check_dependency_inversion", "Member[_resolve_root].ReturnValue", "path-injection"]
      - ["scripts.check_forbidden_literals", "Member[_resolve_root].ReturnValue", "path-injection"]
      - ["scripts.check_no_magic_numbers", "Member[_resolve_root].ReturnValue", "path-injection"]
      - ["scripts.check_no_migration_framing", "Member[_resolve_root].ReturnValue", "path-injection"]
      - ["scripts.check_no_review_origin_in_code", "Member[_resolve_root].ReturnValue", "path-injection"]
      - ["scripts.check_persistence_boundary", "Member[_resolve_root].ReturnValue", "path-injection"]
