name: Publish apko base image
description: >-
  Download a scanned apko base image tarball (produced by build-apko-base),
  push it as a multi-arch manifest to GHCR, sign it with cosign (keyless via
  GitHub OIDC), and attest SLSA Level 3 build provenance. Called from a
  companion job that carries `packages: write`, `id-token: write`, and
  `attestations: write` and only runs on non-PR events.

inputs:
  image-name:
    description: "Image name suffix (e.g. backend, sandbox, sidecar, fine-tune)"
    required: true
  tag:
    description: "Image tag produced by build-apko-base (e.g. sha-abcdef1)"
    required: true
  artifact-name:
    description: "Artifact name for the base image tarball produced by build-apko-base"
    required: true
  tarball-name:
    description: >-
      Filename of the tarball inside the downloaded artifact. Must match the
      `tarball-name` output of build-apko-base; making it an explicit input
      removes the implicit `${image-name}-base.tar` coupling.
    required: true
  architectures:
    description: "Comma-separated list of architectures to push (e.g. amd64,arm64)"
    required: false
    default: "amd64,arm64"
  ghcr-token:
    description: "GITHUB_TOKEN for GHCR"
    required: true

outputs:
  digest:
    description: "Pushed multi-arch manifest digest"
    value: ${{ steps.push.outputs.digest }}
  tag:
    description: "Echo of the input tag"
    value: ${{ inputs.tag }}

runs:
  using: composite
  steps:
    - name: Download base image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: .

    # GHCR's token endpoint occasionally exceeds the docker client's default
    # 30s deadline. Drive `docker login` through nick-fields/retry so the
    # login is re-attempted on `context deadline exceeded`. Token via env +
    # stdin so it never lands on a command line.
    - name: Log in to GHCR
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        GHCR_TOKEN: ${{ inputs.ghcr-token }}
        GHCR_USER: ${{ github.actor }}
      with:
        timeout_minutes: 2
        max_attempts: 4
        retry_wait_seconds: 15
        command: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

    - name: Load image from tarball
      shell: bash
      env:
        TARBALL_NAME: ${{ inputs.tarball-name }}
      run: |
        if [ ! -f "${TARBALL_NAME}" ]; then
          echo "::error::Tarball '${TARBALL_NAME}' not found in downloaded artifact"
          exit 1
        fi
        docker load -i "${TARBALL_NAME}"

    - name: Push base image (multi-arch manifest)
      id: push
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        TAG: ${{ inputs.tag }}
        ARCHITECTURES: ${{ inputs.architectures }}
      run: |
        set -euo pipefail
        REPO="ghcr.io/aureliolo/synthorg-${IMAGE_NAME}-base"
        IFS=',' read -ra ARCHS <<< "${ARCHITECTURES}"
        RETRY="${GITHUB_WORKSPACE}/.github/scripts/docker_push_with_retry.sh"

        # Push each per-arch image, capturing its manifest digest
        # directly from `docker push` stdout (`<tag>: digest:
        # sha256:<hex> size: <bytes>` per the Docker CLI reference).
        # Reference manifest list members by `@sha256:digest` rather
        # than the mutable per-arch tags so the manifest list bytes
        # are stable. Parsing the push output (instead of re-reading
        # the tag via `docker buildx imagetools inspect`) closes the
        # TOCTOU window where a parallel run could overwrite the tag
        # between push and inspect.
        #
        # Wrap each push in docker_push_with_retry.sh so transient GHCR
        # 5xx responses ("page is taking too long", "unknown blob", TLS
        # reset, etc.) are retried with exponential backoff. The push is
        # idempotent: re-pushing the same content yields the same digest,
        # so a retry never alters the published image.
        MANIFEST_ARGS=()
        for arch in "${ARCHS[@]}"; do
          if ! PUSH_OUTPUT="$(bash "$RETRY" "docker push ${REPO}:${TAG}-${arch}" docker push "${REPO}:${TAG}-${arch}")"; then
            printf '%s\n' "${PUSH_OUTPUT}"
            echo "::error::docker push failed for ${REPO}:${TAG}-${arch}"
            exit 1
          fi
          printf '%s\n' "${PUSH_OUTPUT}"
          ARCH_DIGEST="$(printf '%s\n' "${PUSH_OUTPUT}" | sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' | tail -n1)"
          if [ -z "$ARCH_DIGEST" ]; then
            echo "::error::Could not parse ${arch} digest from docker push output"
            exit 1
          fi
          MANIFEST_ARGS+=("${REPO}@${ARCH_DIGEST}")
        done
        # --amend keeps re-runs on the same SHA safe: a successful push on a
        # prior run leaves the manifest list present, and a plain `create` would
        # fail with "manifest already exists" before the idempotent push below.
        docker manifest create --amend "${REPO}:${TAG}" "${MANIFEST_ARGS[@]}"
        bash "$RETRY" "docker manifest push ${REPO}:${TAG}" docker manifest push "${REPO}:${TAG}"
        # Read the canonical manifest list digest back from the registry.
        # Stable across re-runs because the create above pins source
        # members by digest. GHCR is eventually consistent on the write
        # path: the tag we just pushed can 404 ("not found") for a short
        # window before it is readable, so retry the read-back with bounded
        # backoff rather than failing the whole publish (which would leave
        # the image unsigned). Mirrors the inspect retry in
        # publish-image-retag and publish-image-loaded.
        INSPECT_ATTEMPTS=5
        INSPECT_BACKOFF=2
        DIGEST=""
        for ((ia = 1; ia <= INSPECT_ATTEMPTS; ia++)); do
          if DIGEST="$(docker buildx imagetools inspect "${REPO}:${TAG}" --format '{{.Manifest.Digest}}' 2>/dev/null)" && [ -n "$DIGEST" ]; then
            break
          fi
          DIGEST=""
          if [ "$ia" -lt "$INSPECT_ATTEMPTS" ]; then
            echo "::warning::manifest ${REPO}:${TAG} not yet readable after push (attempt ${ia}/${INSPECT_ATTEMPTS}); GHCR read-after-write lag, retrying in ${INSPECT_BACKOFF}s"
            sleep "${INSPECT_BACKOFF}"
            INSPECT_BACKOFF=$((INSPECT_BACKOFF * 2))
          fi
        done
        if [ -z "$DIGEST" ]; then
          echo "::error::manifest ${REPO}:${TAG} not readable after ${INSPECT_ATTEMPTS} attempts -- cannot compute signing digest"
          exit 1
        fi
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

    # GitHub releases occasionally 5xx; cosign-installer's internal retry (3
    # attempts in ~7s) is not enough to ride out a longer outage. Wrap the
    # install in two continue-on-error attempts with backoff before the final
    # fail-hard attempt, so a single 10-20s burst of 500s doesn't kill the run.
    - name: Install cosign (attempt 1)
      id: cosign_1
      continue-on-error: true
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Back off before cosign retry 1
      if: steps.cosign_1.outcome == 'failure'
      shell: bash
      run: sleep 15

    - name: Install cosign (attempt 2)
      if: steps.cosign_1.outcome == 'failure'
      id: cosign_2
      continue-on-error: true
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Back off before cosign retry 2
      if: steps.cosign_2.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Install cosign (final attempt)
      if: steps.cosign_2.outcome == 'failure'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    # Wrap the cosign call in cosign_sign_with_retry.sh so a GHCR /
    # Rekor / Fulcio 5xx during signature upload retries on the same
    # budget every docker push already gets via docker_push_with_retry.sh.
    # The helper preserves the `createLogEntryConflict` idempotency
    # branch (already-signed digest -> success) and only retries on
    # the shared transient regex.
    - name: Sign image
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        set -euo pipefail
        if [ -z "$DIGEST" ]; then echo "::error::No digest"; exit 1; fi
        bash "${GITHUB_WORKSPACE}/.github/scripts/cosign_sign_with_retry.sh" \
          "ghcr.io/aureliolo/synthorg-${IMAGE_NAME}-base@${DIGEST}"

    # Confirm the input tag still resolves to the digest cosign just
    # signed and that the cosign signature artifact is reachable on
    # GHCR. Catches the "concurrent run overwrote our tag after we
    # signed" failure mode at CI time. See publish-image/action.yml
    # for the full rationale.
    - name: Verify pushed tag resolves to the signed digest
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        TAG: ${{ inputs.tag }}
        SIGNED_DIGEST: ${{ steps.push.outputs.digest }}
        GHCR_TOKEN: ${{ inputs.ghcr-token }}
      run: |
        set -euo pipefail
        REPO_PATH="aureliolo/synthorg-${IMAGE_NAME}-base"
        # `-L` follows redirects defensively; matches publish-image-loaded.
        # `--connect-timeout`/`--max-time` bound every curl (no default
        # deadline) so a black-holed connection can't stall to the job
        # timeout.
        # --retry rides out a transient GHCR token-endpoint 5xx / reset
        # (matches publish-image-loaded); --max-time 120 still bounds a
        # black-holed connection across the whole retry budget.
        REG_TOKEN="$(curl -sSL --connect-timeout 5 --max-time 120 \
          --retry 5 --retry-all-errors --retry-connrefused --retry-max-time 100 \
          -u "x-access-token:${GHCR_TOKEN}" \
          "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO_PATH}:pull" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
        if [ -z "${REG_TOKEN}" ]; then
          echo "::error::Failed to mint GHCR pull token for ${REPO_PATH}"
          exit 1
        fi

        ACTUAL="$(curl -sSL --connect-timeout 5 --max-time 15 -I \
          -H "Authorization: Bearer ${REG_TOKEN}" \
          -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json" \
          "https://ghcr.io/v2/${REPO_PATH}/manifests/${TAG}" \
          | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')"
        if [ "${ACTUAL}" != "${SIGNED_DIGEST}" ]; then
          echo "::error::Tag ${TAG} resolves to ${ACTUAL} but we signed ${SIGNED_DIGEST}"
          exit 1
        fi

        # cosign has just published the signature as an OCI referrer; GHCR
        # surfaces it as the `sha256-<hex>` referrer tag with EVENTUAL
        # consistency, so a check issued milliseconds after signing can 404
        # for a short window. Poll with bounded backoff (5 attempts,
        # 2s -> 4s -> 8s -> 16s, ~30s budget) so a propagation lag
        # self-heals while a genuinely-missing signature still fails after
        # the budget. Mirrors publish-image-loaded's post-sign check.
        # Validate the digest shape first so a malformed SIGNED_DIGEST
        # cannot build a bogus referrer URL.
        if ! [[ "${SIGNED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::SIGNED_DIGEST is not a valid sha256 digest: '${SIGNED_DIGEST}'"
          exit 1
        fi
        SIG_HEX="${SIGNED_DIGEST#sha256:}"
        SIG_ATTEMPTS=5
        SIG_BACKOFF=2
        SIG_STATUS=000
        for ((s = 1; s <= SIG_ATTEMPTS; s++)); do
          # `|| SIG_STATUS=000` on the ASSIGNMENT (not inside the command
          # substitution) so a curl network failure under `set -e` neither
          # aborts the step nor double-prints the sentinel: curl already
          # emits "000" to stdout on a connection failure, so an in-`$()`
          # `|| echo 000` would capture "000000" and miss the dedicated
          # network-error branch below. The `||` on the assignment suspends
          # `set -e` for the left side and overwrites with a clean "000".
          SIG_STATUS="$(curl -sSL --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${REG_TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${REPO_PATH}/manifests/sha256-${SIG_HEX}")" || SIG_STATUS=000
          [ "${SIG_STATUS}" = "200" ] && break
          if [ "$s" -lt "$SIG_ATTEMPTS" ]; then
            echo "::warning::signature referrer sha256-${SIG_HEX} not yet visible (HTTP ${SIG_STATUS}, attempt ${s}/${SIG_ATTEMPTS}); GHCR propagation lag, retrying in ${SIG_BACKOFF}s"
            sleep "${SIG_BACKOFF}"
            SIG_BACKOFF=$((SIG_BACKOFF * 2))
          fi
        done
        if [ "${SIG_STATUS}" = "000" ]; then
          echo "::error::cosign signature check could not reach GHCR (curl network error, not a registry response) for sha256-${SIG_HEX} after ${SIG_ATTEMPTS} attempts"
          exit 1
        elif [ "${SIG_STATUS}" != "200" ]; then
          echo "::error::cosign signature artifact missing (referrer tag sha256-${SIG_HEX} returned HTTP ${SIG_STATUS} after ${SIG_ATTEMPTS} attempts)"
          exit 1
        fi
        echo "✓ ghcr.io/${REPO_PATH}:${TAG} -> ${ACTUAL} (signed)"

    # Same Rekor retry ladder as the cosign-installer above: the
    # attestation writes a Rekor tlog entry against Sigstore's public-good
    # backend, which intermittently times out. Three attempts with backoff
    # before failing hard; attestation is idempotent (push-to-registry
    # re-uploads the same bundle), and the final attempt has no
    # continue-on-error so a terminal error still fails the job.
    #
    # The backoffs (30s, 90s) are also sized to ride out the GitHub
    # attestation API's per-installation secondary rate limit ("Failed to
    # persist attestation: API rate limit exceeded for installation"). The
    # ~nine attestation-bearing publish jobs fan out in parallel and, when two
    # main-push runs overlap, briefly exceed the secondary limit; that limit
    # clears within ~a minute, so a 15s/30s ladder retried too soon to help.
    - name: Attest build provenance (SLSA Level 3, attempt 1)
      id: attest_base_1
      continue-on-error: true
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
      with: # zizmor: ignore[template-injection]
        subject-name: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}-base
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

    - name: Back off before base-image attest retry 1
      if: steps.attest_base_1.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Attest build provenance (SLSA Level 3, attempt 2)
      if: steps.attest_base_1.outcome == 'failure'
      id: attest_base_2
      continue-on-error: true
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
      with: # zizmor: ignore[template-injection]
        subject-name: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}-base
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

    - name: Back off before base-image attest retry 2
      if: steps.attest_base_2.outcome == 'failure'
      shell: bash
      run: sleep 90

    - name: Attest build provenance (SLSA Level 3, final attempt)
      if: steps.attest_base_2.outcome == 'failure'
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
      with: # zizmor: ignore[template-injection]
        subject-name: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}-base
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

    # Emit the canonical (image, tag) inventory for the workflow-level
    # `verify-signatures` job. Base images push exactly one tag.
    - name: Write pushed-tag inventory
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        OUT="pushed-tags-${IMAGE_NAME}-base.txt"
        printf '%s-base:%s\n' "${IMAGE_NAME}" "${TAG}" > "$OUT"
        echo "wrote 1 tag entry to ${OUT}"

    - name: Upload pushed-tag inventory
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pushed-tags-${{ inputs.image-name }}-base
        path: pushed-tags-${{ inputs.image-name }}-base.txt
        # Match the publish-image action; see its rationale.
        retention-days: 7
