name: Python Audit

on:
  schedule:
    - cron: "0 2 * * 1"  # Weekly Monday 2am UTC
  workflow_dispatch:

permissions: {}

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    # pip-audit queries the PyPI / OSV advisory DB; 10 reaps a hung
    # request instead of the 6-hour default (and keeps a transient OSV
    # outage from looking like a stuck job).
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: pip-audit
        # Suppressed advisories are tracked for removal in #2202 (one ignore
        # maps to one removal owner). Only PYSEC-2022-42969 remains suppressed:
        # - PYSEC-2022-42969: regex DoS in py.path. py is unmaintained upstream
        #   with no fix version, pulled in only as a transitive of the
        #   modularity-gate dev tooling (interrogate). synthorg never imports py
        #   directly and the vulnerable py.path.svnurl / svnwc surfaces are not
        #   reachable through anything we ship. Remove when py leaves the
        #   dependency tree.
        run: |
          set -euo pipefail
          # pip-audit does not error when an --ignore-vuln target is absent
          # from the report, so the suppression can silently outlive the
          # package it covers. Fail loudly once py has left the lockfile.
          if ! grep -q '^name = "py"$' uv.lock; then
            echo "::error::PYSEC-2022-42969 is suppressed but 'py' is no longer in uv.lock; drop the --ignore-vuln." >&2
            exit 1
          fi
          uv run pip-audit \
            --ignore-vuln PYSEC-2022-42969

  report-failure:
    name: Open / update tracking issue on schedule failure
    needs: pip-audit
    # Only the schedule path gets the issue sink. Manual `workflow_dispatch`
    # failures from a debugging branch shouldn't open repo-wide CI-health
    # issues; the operator already sees the run output directly.
    if: >-
      always()
      && github.event_name == 'schedule'
      && needs.pip-audit.result != 'success'
      && needs.pip-audit.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/post-tracking-issue)
      issues: write     # gh issue create / comment / pin
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compose body
        id: body
        env:
          RESULT: ${{ needs.pip-audit.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo 'body<<TRACKING_ISSUE_BODY_EOF'
            cat <<EOF
          \`pip-audit\` failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) with result \`$RESULT\`.

          Run: ${RUN_URL}

          Likely cause: a new CVE landed against a pinned dependency. Check
          the run log for the offending package + advisory ID, then either
          bump the dependency, add it to the \`--ignore-vuln\` list (with
          a comment explaining why), or accept the risk explicitly.
          EOF
            echo 'TRACKING_ISSUE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/post-tracking-issue
        with:
          title: 'Python audit regression'
          labels: 'automation:ci-health,type:ci,prio:high'
          body: ${{ steps.body.outputs.body }}
          pin: 'false'
          gh-token: ${{ github.token }}
