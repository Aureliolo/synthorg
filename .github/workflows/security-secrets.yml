name: Security - Secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions: {}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    # Full-history scan (--log-opts=--all) plus the gitleaks binary
    # download; 15 reaps a stuck scan / download rather than the 6-hour
    # default on this PR-blocking check.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "${ARCHIVE}" --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 "${BASE_URL}/${ARCHIVE}"
          curl -fsSLo checksums.txt --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 "${BASE_URL}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${ARCHIVE}$" checksums.txt | sha256sum -c -
          tar xzf "${ARCHIVE}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gitleaks detect --source . -v --log-opts="origin/${BASE_REF}..HEAD"
          else
            # Push / schedule: scan EVERY commit reachable from ANY ref
            # (--log-opts=--all), not just HEAD's first-parent history, so
            # a secret introduced on a since-deleted branch or a tag is
            # still caught. Matches the "scans the full repo" claim the
            # report-failure issue body makes.
            gitleaks detect --source . -v --log-opts=--all
          fi

  report-failure:
    name: Open / update tracking issue on schedule failure
    needs: gitleaks
    # Only the schedule path gets the issue sink. Push runs already
    # surface as commit checks on main; PR runs surface as PR checks.
    #
    # `== 'failure'` and not the non-success complement: a cancelled or
    # timed-out scan found no secrets because it never looked, and this
    # title asserts one at prio:high. That outcome goes to report-stalled.
    if: >-
      always()
      && github.event_name == 'schedule'
      && needs.gitleaks.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/post-tracking-issue)
      issues: write     # gh issue create / comment / pin
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compose body
        id: body
        env:
          RESULT: ${{ needs.gitleaks.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo 'body<<TRACKING_ISSUE_BODY_EOF'
            cat <<EOF
          Scheduled gitleaks scan failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) with result \`$RESULT\`.

          Run: ${RUN_URL}

          Likely cause: a leaked secret was committed historically (the
          weekly schedule scans the full repo, unlike PR runs which only
          scan the diff), gitleaks released a new detector, or the
          gitleaks release-asset download flaked.
          EOF
            echo 'TRACKING_ISSUE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/post-tracking-issue
        with:
          title: 'Secret scan regression'
          labels: 'automation:ci-health,type:ci,prio:high'
          body: ${{ steps.body.outputs.body }}
          pin: 'false'
          gh-token: ${{ github.token }}

  report-stalled:
    name: Open / update tracking issue on an unfinished scan
    needs: gitleaks
    # The complement of the three settled results, so a result GitHub adds
    # later still lands somewhere rather than falling through both sinks.
    if: >-
      always()
      && github.event_name == 'schedule'
      && needs.gitleaks.result != 'success'
      && needs.gitleaks.result != 'failure'
      && needs.gitleaks.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/report-stalled-issue)
      issues: write     # gh issue create / comment / reopen
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/report-stalled-issue
        with:
          title: 'Secret scan not completing'
          labels: 'automation:ci-health,type:ci,prio:high'
          subject: 'The weekly gitleaks scan'
          not-measured: 'no history was scanned and no secret was ruled out'
          guidance: >-
            Check the run's step timings against the gitleaks job's 15-minute
            budget before raising it; a stalled full-history scan and a
            flaked release-asset download look the same from here.
          result: ${{ needs.gitleaks.result }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          gh-token: ${{ github.token }}
