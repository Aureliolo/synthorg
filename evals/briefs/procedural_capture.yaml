# Judged brief: procedural-memory capture from success.
#
# Exercises the procedural-memory success proposer: after the org succeeds at a
# tricky task, it must capture a procedural lesson general enough to transfer to
# a sibling task yet specific enough to be actionable. A degraded run captures
# nothing, or an over-narrow / over-broad rule. Judged against the
# ``procedural-capture`` anchor set.
brief_id: procedural-capture
schema_version: 1
kind: judged
title: "procedural capture"
description: >-
  After succeeding at a tricky task, capture a procedural lesson that is general
  enough to transfer to a sibling task but specific enough to act on.
priority: medium
estimated_complexity: 3
acceptance_criteria:
  - "A reusable procedural lesson is captured from the successful approach."
  - "The lesson is neither over-narrow to this task nor uselessly generic."
limits:
  max_total_cost_usd: 6.0
  max_wall_clock_seconds: 180
  max_turns: 8
rubric:
  rubric_id: procedural-capture
  reference_answer_path: "references/procedural-capture.md"
  dimensions:
    - name: lesson_reusability
      weight: 1.0
      grade_type: score
