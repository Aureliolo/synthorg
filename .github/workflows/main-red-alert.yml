name: Main Red Alert

# Surfaces a red `main` as a pinned tracking issue within minutes.
#
# A workflow whose failing half is gated off `pull_request` passes every PR
# and only breaks once merged, and nobody watches the Actions tab per push, so
# it can stay broken across further merges. Each watched workflow gets its own
# tracker (title is the dedup key), opened on the first red push and closed by
# the next green one.
#
# Scope is the three workflows whose failure means main is genuinely broken.
# Advisory / noise-prone ones (CodSpeed, Lighthouse, Scorecard) are excluded
# on purpose: a tracker that cries wolf gets ignored, which is the failure
# mode this exists to fix.
#
# Known blind spots, all deliberate:
#   - A workflow outside the `workflows:` list below. Nothing keeps that list
#     in sync with "workflows that run on push to main"; adding one is a
#     manual step.
#   - `cancelled`, which is overwhelmingly concurrency supersession rather
#     than a real failure. A run a human cancels because it is visibly broken
#     is indistinguishable from that here and is dropped with it.
#   - A tag push. `docker.yml` and `cli.yml` also run on `tags: v*`, where
#     `head_branch` is the tag, so a broken RELEASE build opens no tracker.
#     Release failures are watched directly by whoever cut the tag.
#
# `workflow_run` only ever runs the copy of this file on the default branch,
# so changes here take effect after merge, never on the PR that makes them.

on:
  # zizmor: ignore[dangerous-triggers] -- safe: `workflow_run` resolves
  # github.sha to the DEFAULT branch, so the checkout below is trusted main
  # code, never the triggering ref, and no code from the triggering run is
  # executed. Every payload field is read through `env:`. Fork PRs cannot
  # reach it: gated on head_repository == this repo and event == 'push'.
  workflow_run:
    workflows: ["CI", "Docker", "CLI"]
    types: [completed]

permissions: {}

# Serialise per watched workflow: two completions racing would both edit the
# same tracker body, and the loser's write would be lost.
concurrency:
  group: main-red-alert-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  report:
    name: Open / update tracker on red main
    # `timed_out` counts: an unfinished gate leaves main just as unverified
    # as a failed one. `cancelled` does not -- superseded runs cancel
    # routinely and are not a signal.
    if: >-
      github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.conclusion == 'failure'
        || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compose body
        id: body
        env:
          # Every workflow_run field is read through env rather than
          # interpolated into the script: a branch or workflow name is
          # attacker-influenceable and would otherwise be shell-injected.
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          {
            echo 'body<<TRACKING_ISSUE_BODY_EOF'
            cat <<EOF
          \`${WORKFLOW_NAME}\` is **${CONCLUSION}** on \`main\`.

          - First seen at: \`${HEAD_SHA}\` (${COMMIT_URL})
          - Run: ${RUN_URL}

          Main is unverified until this is green. Do not merge a release tag
          while this tracker is open: the retag jobs resolve
          \`<image>:sha-<short>\` from the main-push publish, so a tag cut now
          would ship whatever subset actually published.

          This issue closes itself on the next green \`${WORKFLOW_NAME}\` run
          on main, and reopens if it regresses.
          EOF
            echo 'TRACKING_ISSUE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      # Deliberately not freshness-guarded, unlike `resolve` below. A stale red
      # at worst re-reports a failure that is already tracked; a stale red that
      # went unreported is the outage this workflow exists to prevent.
      - uses: ./.github/actions/post-tracking-issue
        with:
          title: 'CI health: ${{ github.event.workflow_run.name }} is failing on main'
          labels: 'automation:ci-health,type:ci,prio:high'
          body: ${{ steps.body.outputs.body }}
          gh-token: ${{ github.token }}

      # Without this the alerting mechanism's OWN failure is visible only in
      # the Actions tab, which is the channel this workflow exists because
      # nobody watches. Deliberately the crudest call that can still land: no
      # search, no labels, no pinning, none of the machinery that just failed.
      # It can therefore duplicate on a repeat failure, which is the right
      # trade against reporting nothing.
      - name: Fall back to a bare issue when the tracker post fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          ALERT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "::error::post-tracking-issue failed; filing a bare fallback issue"
          gh issue create \
            --title "CI health: ${WORKFLOW_NAME} is failing on main (fallback)" \
            --body "\`${WORKFLOW_NAME}\` failed on main (${RUN_URL}) and the tracking-issue step itself failed (${ALERT_URL}). This is an unmanaged fallback report: triage and close it by hand."

  resolve:
    name: Close tracker on green main
    if: >-
      github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # A green run proves only that ITS commit is good. Re-running an older
      # failed run until it passes, or two pushes finishing out of order,
      # would otherwise close the tracker while main's actual tip is still
      # broken, and the body tells readers it is then safe to cut a release.
      - name: Check the green run is for main's current tip
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${GH_REPO}/commits/main" --jq '.sha')"
          if [ "${tip}" = "${RUN_SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::green run is for ${RUN_SHA} but main is at ${tip}; leaving any tracker open"
          fi

      # A no-op when no tracker exists, which is the common case on a
      # healthy main.
      - uses: ./.github/actions/post-tracking-issue
        if: steps.freshness.outputs.current == 'true'
        with:
          mode: 'close'
          title: 'CI health: ${{ github.event.workflow_run.name }} is failing on main'
          close-comment-sha: ${{ github.event.workflow_run.head_sha }}
          gh-token: ${{ github.token }}
