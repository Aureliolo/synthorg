name: Workflow Security

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "renovate.json"
      - ".github/.zizmor.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "renovate.json"
      - ".github/.zizmor.yml"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@b572f7b1a1c2d41efaab43d504f68d215c3cd727 # v0.5.4
        with:
          config: .github/.zizmor.yml
          advanced-security: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          # zizmor-action v0.5.4 defaults to zizmor v1.25.0, which has
          # a bug in the github-app audit: it checks for the YAML key
          # `repository` (singular) instead of `repositories` (plural),
          # so every actions/create-github-app-token call that uses the
          # correct plural key still gets flagged. Fixed in v1.25.2.
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          version: v1.25.2
