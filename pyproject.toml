[project]
name = "synthorg"
dynamic = ["version"]
description = "Framework for building synthetic organizations, autonomous AI agents orchestrated as a virtual company"
readme = "README.md"
license = "BUSL-1.1"
requires-python = ">=3.14"
authors = [{ name = "Aurelio" }]
keywords = ["ai", "agents", "llm", "orchestration", "synthetic-organization", "synthorg"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiodocker==0.27.0",
    "aiosqlite==0.22.1",
    "annotated-types==0.7.0",
    "argon2-cffi==25.1.0",
    "cryptography==48.0.0",
    "faker==40.19.1",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "litellm==1.86.2",
    "cedarpy==4.8.4",
    "lxml==6.1.1",
    "litestar[standard,structlog,pydantic,brotli,prometheus]==2.23.0",
    "mcp==1.27.2",
    "mem0ai==2.0.4",
    "mmh3==5.2.1",
    "packaging==26.2",
    "prometheus-client==0.25.0",
    "pydantic==2.13.4",
    "pyjwt[crypto]==2.13.0",
    "pyngrok==8.1.2",
    "pyyaml==6.0.3",
    "qdrant-client==1.18.0",
    "referencing==0.37.0",
    "structlog==25.5.0",
    "rfc3161-client==1.0.6",
    "opentelemetry-api==1.40.0",
    "opentelemetry-sdk==1.40.0",
    "opentelemetry-exporter-otlp-proto-http==1.40.0",
    "playwright==1.60.0",
    "scikit-image==0.26.0",
    "pillow==12.2.0",
    "numpy==2.4.6",
    "uvicorn==0.48.0",
    "yoyo-migrations==9.0.0",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project.optional-dependencies]
# Fine-tune variants. Both install the same package set; torch is routed to
# PyPI (CUDA bundled, ~2.5 GB) or the PyTorch CPU index (~200 MB) via
# [tool.uv.sources] below. The two extras are declared mutually exclusive in
# [tool.uv] via its `conflicts = [...]` setting so uv locks them independently.
fine-tune-gpu = ["torch==2.12.0", "sentence-transformers==5.5.1"]
fine-tune-cpu = ["torch==2.12.0", "sentence-transformers==5.5.1"]
telemetry = ["logfire==4.34.0"]
# Distributed runtime: first distributed MessageBus backend + task queue workers.
# Opt in with `pip install synthorg[distributed]`. See docs/design/distributed-runtime.md.
distributed = ["nats-py==2.14.0"]
postgres = ["psycopg[binary]==3.3.4", "psycopg_pool==3.3.1"]
# Knowledge + provenance substrate: structure-aware ingestion.
# Opt in with `pip install synthorg[knowledge]`. pdfplumber (MIT) gives
# per-page text + word bboxes; tree-sitter + language pack drive AST-aware
# code chunking. pymupdf is deliberately excluded (AGPL).
knowledge = [
    "pdfplumber==0.11.9",
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.8.1",
]

[tool.hatch.version]
path = "src/synthorg/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/synthorg"]
artifacts = ["src/synthorg/**/*.sql", "src/synthorg/**/*.yaml"]

[dependency-groups]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-codspeed==5.0.3",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-repeat==0.9.4",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    # Runtime type checking during pytest. ``--typeguard-packages=synthorg``
    # in [tool.pytest.ini_options].addopts instruments every function under
    # ``synthorg.*`` so argument and return types are checked against their
    # annotations at call time. Active at WARN across the full ``synthorg``
    # package; ERROR-policy hardening (the residual TYPE_CHECKING-only
    # signature-import migration) is the remaining follow-up.
    "typeguard==4.5.2",
    # CI matrix sharding of unit + integration test arms. Partitions tests by
    # recorded durations in `.test_durations.{unit,integration}` so each shard
    # ends within ~10% wall-clock of the slowest peer. Falls back to count-based
    # partition when the durations file is empty.
    "pytest-split==0.11.0",
    "polyfactory==3.3.0",
    "respx==0.23.1",
    "hypothesis==6.155.1",
    # Distributed runtime: dev envs always have these so mypy can type-check
    # bus/nats.py and workers/ without needing the optional extra installed.
    # Runtime users opt in via `pip install synthorg[distributed]`.
    "nats-py==2.14.0",
    "psycopg[binary]==3.3.4",
    "psycopg_pool==3.3.1",
    "testcontainers[postgres]==4.14.2",
    # Knowledge substrate: integration tests ingest a mixed PDF + repo +
    # ticket corpus end-to-end, so the tree-sitter AST chunker and the
    # pdfplumber loader must be installed alongside the test runner.
    # Runtime users opt in via `pip install synthorg[knowledge]`.
    "pdfplumber==0.11.9",
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.8.1",
]
docs = [
    "zensical==0.0.43",
    "mkdocstrings[python]==1.0.4",
    "griffe-pydantic==1.3.1",
    "mkdocs-d2-plugin==1.7.0",
    "mkdocs-redirects==1.2.3",
    # Used by scripts/patch_sitemap.py to safely parse the built sitemap.
    # Present as a transitive via py-serializable, but declared here so the
    # build script has a stable explicit dependency.
    "defusedxml==0.7.1",
]
fine-tune-gpu = [
    "torch==2.12.0",
    "sentence-transformers==5.5.1",
]
fine-tune-cpu = [
    "torch==2.12.0",
    "sentence-transformers==5.5.1",
]
dev = [
    "commitizen==4.16.3",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pip-audit==2.10.0",
    "pre-commit-uv==4.2.1",
    "ruff==0.15.15",
    "sqlglot==30.8.0",
    "types-pyyaml==6.0.12.20260518",
    "types-defusedxml==0.7.0.20260504",
    "bandit==1.9.4",
    "pytest-randomly==4.1.0",
    # Second type-checker. Runs as a CI artefact via
    # .github/workflows/pyright.yml (continue-on-error: true). No
    # pre-push gate. Mypy remains authoritative.
    "pyright==1.1.409",
    # Quality tools: dependency hygiene, dead-code, docstring coverage,
    # spelling, SQL and YAML lint. Each ships with a baseline absorbing
    # today's reality so existing code passes; baselines ratchet shrink.
    "deptry==0.25.1",
    "vulture==2.16",
    "interrogate==1.7.0",
    "codespell==2.4.2",
    "sqlfluff==4.2.1",
    "yamllint==1.38.0",
    "import-linter==2.11",
    {include-group = "test"},
    {include-group = "docs"},
]

# ---------------------------------------------------------------------------
# uv -- package resolution (torch CPU vs GPU split)
# ---------------------------------------------------------------------------
# The fine-tune container ships in two flavors:
#   - fine-tune-gpu   (GPU, default): torch 2.11.0 with bundled CUDA runtime
#                      (~2.5 GB of nvidia-* wheels). Needed for CUDA-accelerated
#                      fine-tuning on hosts with an NVIDIA GPU + driver.
#   - fine-tune-cpu   (CPU-only, ~200 MB torch): pulled from the PyTorch CPU
#                      index so no CUDA runtime is bundled. ~2.3 GB smaller.
#
# The two extras are declared mutually exclusive so uv can lock them
# independently; one resolution pins CUDA torch, the other pins CPU torch.
# Build-time: the Dockerfile picks the extra via the FINE_TUNE_EXTRA build-arg.
# Runtime: the CLI init flow prompts GPU vs CPU when fine-tuning is enabled.
[tool.uv]
# Lower bound is the security floor: 0.11.8 ships the wheel RECORD
# path-traversal fix (GHSA-pjjw-68hj-v9mw, originally landed in 0.11.6)
# and is the binary bundled by pre-commit-uv 4.2.1. The Docker images
# pull 0.11.9 because that release adds a Windows trampoline fix that
# stabilises pytest-xdist workers on Python 3.14 / Windows; the project
# floor stays one minor behind so contributors using pre-commit-uv can
# sync without waiting on its next release.
required-version = ">=0.11.8"
conflicts = [
    [
        { extra = "fine-tune-gpu" },
        { extra = "fine-tune-cpu" },
    ],
    [
        { group = "fine-tune-gpu" },
        { group = "fine-tune-cpu" },
    ],
]
# Override transitive `==` pins from upstream (primarily litellm 1.83.x, see
# BerriAI/litellm#25280 / #25210) that would otherwise force older versions
# into our resolution. Wide ranges so Renovate keeps driving project pins
# through `[project].dependencies` without ever touching this block; re-evaluate
# the whole list when the upstream issues close and `==` constraints relax.
override-dependencies = [
    "pydantic>=2.13",            # litellm pins ==2.12.5
    "jsonschema>=4.26",          # litellm pins ==4.23.0
    "aiohttp>=3.14.0",           # litellm pins ==3.13.4; 3.14.0 fixes CVE-2026-34993
    "click>=8.3",                # litellm pins ==8.1.8; 8.2 dropped 3.7/3.8/3.9 support
    "importlib-metadata>=9.0",   # litellm pins ==8.5.0; 9.0 raises MetadataNotFound on missing metadata
    "openai>=2.33",              # litellm pins ==2.24.0; 2.25-2.33 are additive
    "tokenizers>=0.23.1",        # litellm pins ==0.22.2; 0.23.x adds proper Python 3.14 support
    "typer>=0.25",               # transitive downgrade from litellm's click==8.1.8 + openai==2.24
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "fine-tune-cpu" },
    { index = "pytorch-cpu", group = "fine-tune-cpu" },
]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter (replaces flake8, isort, pyupgrade, etc.)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests", "evals"]

[tool.ruff.lint]
# preview + explicit-preview-rules: required to activate TID255 (added via
# extend-select below). Removing explicit-preview-rules would enable every
# ruff preview rule at once, not just TID255, surfacing hundreds of
# unintended violations across the codebase. Keep both flags together.
preview = true
explicit-preview-rules = true
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "C90",    # mccabe complexity
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "LOG",    # flake8-logging
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TC",     # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PERF",   # perflint
    "FURB",   # refurb
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit (security)
    # "FAST" removed: using Litestar, not FastAPI
    "ASYNC",  # flake8-async
    "FBT",    # flake8-boolean-trap
    "PL",     # pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "D",      # pydocstyle
    "BLE",    # flake8-blind-except
    "G",      # flake8-logging-format
    "ERA",    # flake8-eradicate (commented-out code)
    "INP",    # flake8-no-pep420 (implicit namespace packages)
]
ignore = [
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D107",   # missing docstring in __init__
    "ISC001", # conflicts with ruff formatter
    # TC001/2/3 ("move-to-TYPE_CHECKING") conflict with typeguard's
    # eager ``inspect.signature`` annotation evaluation. The project
    # wires typeguard via ``--typeguard-packages=synthorg`` (see ADR-0006
    # Section F); every type that appears in a function
    # signature, NamedTuple field, or Pydantic model annotation must be
    # importable at runtime so typeguard can resolve it. Other TC checks
    # (TC004 move-out-of-TYPE_CHECKING, TC005 empty block, TC006/7/8
    # quoted-annotation hygiene) remain active.
    "TC001",
    "TC002",
    "TC003",
    # TRY400: "use logger.exception instead of logger.error" -- conflicts
    # with the project-wide SEC-1 redaction rule (CLAUDE.md Logging
    # section). logger.exception attaches a traceback whose frame-locals
    # leak in-scope credentials; the redacted error= field via
    # safe_error_description carries the type taxonomy operators need
    # for triage without the leak. Enforced by
    # scripts/check_logger_exception_str_exc.py instead.
    "TRY400",
]
extend-select = [
    "TID255",  # lazy-import-immediately-resolved; pre-emptive gate for PEP 690 lazy imports
    # pydoclint extensions (preview). Selected by exact code so
    # ``explicit-preview-rules`` activates exactly these, not every preview
    # rule. Selecting the ``DOC`` prefix in ``select`` is inert under that
    # flag, so the codes must live here for the standard ``ruff check`` to
    # enforce them. Enforced across all of src/synthorg/ (the #2065 wave
    # backfill is complete); only tests, scripts, and the api god modules
    # awaiting #2077 decomposition carry per-file-ignores below.
    "DOC201",  # missing return docstring
    "DOC202",  # extraneous return docstring
    "DOC501",  # missing raises docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Pylint thresholds: defaults are too permissive for AI-generated code
# which trends toward god-functions when unbounded. Functions or methods
# exceeding these caps usually signal a missing decomposition into
# helpers or per-strategy variants.
[tool.ruff.lint.pylint]
max-args = 5
max-public-methods = 12
max-statements = 30
max-branches = 10
max-returns = 5
max-locals = 15
max-nested-blocks = 4

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert allowed in tests
    "S105",    # hardcoded passwords in test data
    "S106",    # hardcoded passwords as arguments in test data
    "ARG",     # unused arguments (fixtures)
    "FBT",     # boolean trap (parametrize)
    "D",       # no docstrings required in tests
    "PLR2004", # magic values in tests
    "SLF001",  # private member access in tests
    "PLC0415", # local imports in test functions
    "TC",      # type-checking imports (fixture type hints)
    # Tests carry parametrize values, fixtures, and scaffolding that the
    # tightened ruff rules don't fit; relaxations below.
    "BLE001",  # blind-except in tests (acceptable in test infra)
    "DOC201",  # missing return docstring (not enforced in tests)
    "DOC202",  # extraneous return docstring
    "DOC501",  # missing raises docstring
    "C901",    # complex parametrised tests
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "ERA001",  # commented-out scaffold in some test fixtures
]
"__init__.py" = ["F401"]
"scripts/**/*.py" = [
    "T20",     # print allowed in CLI scripts
    "E501",    # long lines in embedded HTML templates
    "PLC0415", # deferred imports in scripts
    "S603",    # subprocess calls expected in hook scripts
    "S607",    # partial executable paths (git, pytest, mypy)
    # AST-walking gates branch widely over node types (high return and
    # branch counts), and many hook scripts must not crash on unexpected
    # input. New scripts must still adhere to good practice; the
    # existing infra is exempt via the relaxations below.
    "BLE001",  # blind-except acceptable in hook scripts that must not crash
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "ERA001",
    "DOC201",
    "DOC202",
    "DOC501",
    "D102",    # missing docstring on render() helper-dataclass methods is acceptable
    "TC003",   # ModuleType imports used at runtime by importlib loaders
    "TRY004",  # ValueError preferred for JSON validation messages
    "INP001",  # scripts/ is intentionally a flat directory, not a package
    "SIM108",  # ternary-vs-if-else: explicit form is sometimes clearer
]
# The src/synthorg/** tree carries function-level complexity that the
# tightened thresholds catch but cannot resolve without a real
# decomposition. The function-complexity items (C901, PLR0915, PLR0911,
# PLR0912) measure structure that only a controller / service
# decomposition can satisfy; INP001 is a packaging chore. Tracked
# separately in the exemption ledger in docs/decisions/0006-tiered-module-size-policy.md.
"src/synthorg/**/*.py" = [
    "BLE001",  # broad-except boundary code (logger.exception sites)
    "C901",    # complex-structure (function-level cyclomatic)
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "INP001",  # implicit namespace packages (some directories lack __init__)
]
"src/synthorg/tools/browser/**/*.py" = [
    # The BrowserTool catches its own BrowserDomainError chain at the
    # execute() boundary and emits a structured ToolExecutionResult.
    # The error site needs concrete messages with per-call context, so
    # the "extract message to variable" / "use default_message"
    # patterns produce more noise than signal.
    "TRY003",  # long messages outside exception class
    "TRY301",  # raise inside try block
    "EM101",   # raw string literal in exception
    "EM102",   # raw f-string in exception
    # The host-side baseline path operations are O(1) stat calls that
    # do not benefit from anyio.Path indirection.
    "ASYNC240",
]
"src/synthorg/tools/desktop/**/*.py" = [
    # Same rationale as the browser tool: the DesktopTool catches its own
    # DesktopDomainError chain at the execute() boundary and emits a
    # structured ToolExecutionResult, so concrete per-call exception
    # messages read better than extracted-variable / default_message forms.
    "TRY003",  # long messages outside exception class
    "TRY301",  # raise inside try block
    "EM101",   # raw string literal in exception
    "EM102",   # raw f-string in exception
    # The host-side screenshot path operations are O(1) stat calls that
    # do not benefit from anyio.Path indirection.
    "ASYNC240",
]
"src/synthorg/meta/mcp/handlers/**/*.py" = [
    # MCP handlers catch their own ArgumentValidationError /
    # GuardrailViolationError at the envelope boundary
    # (``except ArgumentValidationError as exc: return err(exc)``) and
    # convert to the standard ``err(...)`` JSON envelope.  The
    # raise-inside-try pattern IS the canonical handler shape: the
    # validation block raises typed errors that the enclosing
    # ``except`` collapses to the wire-stable envelope, so TRY301
    # produces noise rather than signal here.  (Wave 3 removed the
    # ``invalid_argument`` factory that previously satisfied TRY301
    # by indirection; now the raises are direct.)
    "TRY301",
]

[tool.ruff.lint.isort]
known-first-party = ["synthorg", "evals"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Python 3.14+ has native lazy annotations (PEP 649). Do not use `from __future__ import annotations`."

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: static type checker (strict mode)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
# Strict++ knobs. Per-package [[tool.mypy.overrides]] blocks below
# relax flags for packages still carrying explicit ``Any`` and missing
# ``@override``; the overrides ratchet off as each package's surface
# code is typed more precisely.
disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true
extra_checks = true
strict_concatenate = true
enable_error_code = [
    "ignore-without-code",
    "redundant-cast",
    "truthy-bool",
    "narrowed-type-not-subtype",
    "unused-awaitable",
    "explicit-override",
    "possibly-undefined",
    "deprecated",
]
local_partial_types = true
strict_bytes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "litellm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiodocker.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "xdist.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "logfire.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiosqlite.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mem0.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "litestar.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "skimage.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdfplumber.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tree_sitter_language_pack.*"
ignore_missing_imports = true

# ──────────────────────────────────────────────────────────────────────
# Per-package mypy overrides for strict++ rollout. Each block absorbs
# the explicit-Any volume and missing-@override sites that already
# existed in a given package; the override lifts when the package's
# surface code is decomposed and typed more precisely. The exemption
# ledger in docs/decisions/0006-tiered-module-size-policy.md is the
# authoritative catalogue of which override unlocks what.
#
# Order: keep alphabetised for grep-discoverability. Each block lists
# only the flags / error codes actually firing.
# ──────────────────────────────────────────────────────────────────────

# The broad api exemption covers the ~70 still-undecomposed controllers and
# the decomposed controllers that inherited explicit-Any (drained by #2056,
# not this PR). The narrower block below re-enables the bar for the
# modules #2049 wrote/reduced.
[[tool.mypy.overrides]]
module = "synthorg.api.*"
disallow_any_explicit = false

# #2049 composition root + lifecycle runners + the Any-clean decomposed
# controller packages hit the FULL strict++ bar (a more-specific override
# beats the synthorg.api.* wildcard; verified against state.py's Any).
[[tool.mypy.overrides]]
module = [
    "synthorg.api.app",
    "synthorg.api.auto_wire",
    "synthorg.api.auto_wire_meetings",
    "synthorg.api.auto_wire_phase1",
    "synthorg.api.boot_persistence",
    "synthorg.api.construction_phase",
    "synthorg.api.lifecycle",
    "synthorg.api.lifecycle_assembly",
    "synthorg.api.lifecycle_builder",
    "synthorg.api.lifecycle_runner_shutdown",
    "synthorg.api.lifecycle_runner_startup",
    "synthorg.api.lifecycle_runner_support",
    "synthorg.api.lifecycle_shared",
    "synthorg.api.lifecycle_startup",
    "synthorg.api.litestar_assembly",
    "synthorg.api.controllers.providers.*",
    "synthorg.api.controllers.memory.*",
]
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = "synthorg.budget.*"
disallow_any_explicit = false

[[tool.mypy.overrides]]
