ci:
  autoupdate_schedule: never
  autofix_prs: true
  autofix_commit_msg: "style: auto-fix pre-commit hooks"
  # Hooks listed here are skipped ONLY on pre-commit.ci. They still run
  # on every developer machine and in any CI job that invokes pre-commit
  # directly. Skip reasons, grouped by category:
  #   - commitizen / gitleaks / hadolint-docker / caddy-validate / zizmor:
  #     covered by dedicated CI jobs; re-running on pre-commit.ci adds
  #     latency without adding signal. (actionlint is NOT skipped: no
  #     dedicated CI job covers it, and pre-commit.ci is the only
  #     enforcement layer for contributors who skipped local hooks.)
  #   - mypy / pytest-unit / go-* / eslint-web:
  #     too slow / toolchain-heavy for the cloud runner.
  #   - no-em-dashes / no-redundant-timeout / forbidden-literals /
  #     persistence-boundary / no-new-logger-exception-str-exc /
  #     orphan-fixtures / boundary-typed / setting-to-startup-trace /
  #     domain-error-hierarchy / list-pagination / dead-api-endpoints /
  #     dual-backend-test-parity / schema-drift / no-magic-numbers /
  #     convention-gate-inventory / mcp-admin-guardrail:
  #     scoped gates that need ``uv`` + repo source -- redundant given
  #     the `Lint` + `Forbidden literals gate` jobs in ci.yml.
  #   - check-push-rebased / check-single-migration-per-pr /
  #     check-no-modify-migration:
  #     rebase / migration state checks meaningful only on the pushing
  #     developer's clone, not in an ephemeral cloud runner.
  # ``no-release-please-token``, ``workflow-shell-git-commits``,
  # ``no-review-origin-in-code`` and ``no-migration-framing`` are
  # deliberately NOT skipped: all four are pure-Python, zero-dependency
  # scripts with no CI counterpart, and letting pre-commit.ci enforce
  # them closes the gap where a PR from a contributor who skipped local
  # hooks would otherwise introduce a regression unchecked.
  skip: [commitizen, gitleaks, hadolint-docker, caddy-validate, zizmor, no-em-dashes, no-redundant-timeout, mypy, pytest-unit, golangci-lint, go-vet, go-test, eslint-web, check-push-rebased, check-single-migration-per-pr, check-no-modify-migration, forbidden-literals, persistence-boundary, persistence-protocol-uniformity, dependency-inversion, provider-complete-chokepoint, no-new-logger-exception-str-exc, otlp-span-redaction, orphan-fixtures, doc-drift-counts, boundary-typed, setting-to-startup-trace, long-running-loop-kill-switch, list-pagination, domain-error-hierarchy, dead-api-endpoints, dual-backend-test-parity, schema-drift, no-magic-numbers, convention-gate-inventory, mcp-admin-guardrail]

default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: local
    hooks:
      - id: check-push-rebased
        name: check push rebased (block if behind main)
        entry: bash
        args: ["scripts/check_push_rebased.sh"]
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        types: []
      - id: check-single-migration-per-pr
        name: enforce at most one new Atlas migration per PR
        entry: bash
        args: ["scripts/check_single_migration_per_pr.sh"]
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-push]
        types: []
      - id: check-no-modify-migration
        name: block modification of existing migration files
        entry: bash
        args: ["scripts/check_no_modify_migration.sh"]
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        types: []
      - id: orphan-fixtures
        name: orphan pytest fixtures (opt-in via SYNTHORG_CHECK_ORPHAN_FIXTURES=1)
        entry: uv run python scripts/check_orphan_fixtures.py
        language: system
        files: ^tests/.*\.py$
        pass_filenames: false
        stages: [pre-push]
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Two files reach the unsafe-mode hook below:
        #   - mkdocs.yml uses pymdownx's !!python tags
        #   - docker/compose.dast.yml uses Docker Compose's !override
        #     custom tag (compose v2.20+) to drop the postgres dependency
        #     in DAST.
        # `check-yaml --unsafe` switches pre-commit-hooks from
        # `ruamel.yaml.YAML(typ='safe').load` to `ruamel.yaml.parse`
        # (syntactic-only stream parser; no constructor needed) so
        # custom tags pass without registering constructors. The plain
        # PyYAML SafeLoader/UnsafeLoader behaviour is irrelevant here.
        exclude: ^(src/synthorg/templates/builtins/|mkdocs\.yml$|docker/compose\.dast\.yml$)
      - id: check-yaml
        name: check-yaml (unsafe parser for custom tags; mkdocs + compose overlays)
        args: [--unsafe]
        files: ^(mkdocs\.yml|docker/compose\.dast\.yml)$
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-symlinks
      - id: check-case-conflict
      - id: debug-statements
        types: [python]
      - id: detect-private-key
        # - tests/ contains deliberate fixtures with PEM-looking literals.
        # - docs/reference/github-environments.md documents the exact
        #   ``-----BEGIN / END RSA PRIVATE KEY-----`` marker lines so
        #   operators can recognise a correct copy-paste; the file
        #   obviously contains no real key.
        exclude: ^(tests/|docs/reference/github-environments\.md$)
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-push]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.15.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
        stages: [pre-push]

  # Workflow YAML safety gates. actionlint catches workflow-syntax
  # errors, expression typos, and shellcheck-style issues in `run:`
  # blocks. zizmor catches GitHub Actions security smells (dangerous
  # workflow_run patterns, secret leakage, expression injection,
  # outdated action SHAs). Scoped to .github/workflows/ + .zizmor.yml
  # so unrelated commits do not pay the lint cost.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.24.1
    hooks:
      - id: zizmor
        files: ^(\.github/workflows/.*\.ya?ml|\.github/\.zizmor\.yml)$
        args: [--config=.github/.zizmor.yml]

  - repo: local
    hooks:
      - id: caddy-validate
        name: caddy validate (Caddyfile)
        entry: bash
        args: ["scripts/caddy-validate.sh"]
        language: system
        files: ^web/Caddyfile$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: no-em-dashes
        name: no em-dashes (U+2014)
        entry: uv
        args: [run, python, scripts/check_no_em_dashes.py]
        language: system
        types: [text]

      - id: no-redundant-timeout
        name: no redundant pytest.mark.timeout(30)
        entry: uv
        args: [run, python, scripts/check_no_redundant_timeout.py]
        language: system
        files: ^tests/.*\.py$

      - id: no-new-logger-exception-str-exc
        name: block new logger.exception(..., error=str(exc)) sites
        entry: uv
        args: [run, python, scripts/check_logger_exception_str_exc.py]
        language: system
        files: ^src/synthorg/.*\.py$

      - id: otlp-span-redaction
        name: block span.record_exception()/auto-handler kwargs in src/synthorg/
        entry: uv
        args: [run, python, scripts/check_otlp_span_redaction.py]
        language: system
        files: ^src/synthorg/.*\.py$

      - id: no-loop-bound-init
        name: block new asyncio primitives in __init__ of lifecycle-managed classes
        entry: uv
        args: [run, python, scripts/check_no_loop_bound_init.py]
        language: system
        files: ^(src/synthorg/.*\.py|scripts/check_no_loop_bound_init\.py|scripts/loop_bound_init_baseline\.txt|\.pre-commit-config\.yaml)$
        pass_filenames: false

      - id: no-new-bare-mock
        name: block new bare Mock()/AsyncMock()/MagicMock() in tests/
        entry: uv
        args: [run, python, scripts/check_mock_spec.py]
        language: system
        files: ^tests/.*\.py$

      - id: no-release-please-token
        name: forbid new RELEASE_PLEASE_TOKEN references
        entry: uv
        args: [run, python, scripts/check_no_release_please_token.py]
        language: system
        files: ^\.github/.*\.ya?ml$

      - id: workflow-shell-git-commits
        name: block shell git commit+push in workflows (must mint App token)
        entry: uv
        args: [run, python, scripts/check_workflow_shell_git_commits.py]
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: workflow-tag-lifecycle
        name: block tag CREATE+conditional-DELETE in same workflow (#1818)
        entry: uv
        args: [run, python, scripts/check_workflow_tag_lifecycle.py, --scan-all]
        language: system
        files: ^(\.github/workflows/.*\.ya?ml|scripts/check_workflow_tag_lifecycle\.py|\.pre-commit-config\.yaml)$
        # pass_filenames: false so the hook always re-scans every
        # workflow YAML regardless of which file in `files:` triggered
        # it. Without this, an edit limited to the checker script or
        # to .pre-commit-config.yaml would invoke the script with only
        # those non-workflow paths; the script would skip them on the
        # ``.yml/.yaml`` suffix filter and exit 0 with zero workflows
        # actually scanned, letting a weakened gate land unchecked.
        pass_filenames: false

      - id: doc-drift-counts
        name: doc count floors (event modules)
        entry: uv
        args: [run, python, scripts/check_doc_drift_counts.py]
        language: system
        # Trigger on edits to any registered claim site or to the events
        # directory itself; the script enumerates the events package
        # and parses each claim file end-to-end on every run.
        files: ^(docs/design/observability\.md|docs/design/agent-execution\.md|docs/research/(control-plane-audit|acg-formalism-evaluation)\.md|src/synthorg/observability/events/.*\.py|scripts/check_doc_drift_counts\.py)$
        pass_filenames: false

      - id: doc-numeric-macros
        name: doc numeric macros (no bare claims in public docs)
        entry: uv
        args: [run, python, scripts/check_doc_numeric_macros.py]
        language: system
        # Pre-push catches bare numeric literals in scoped docs before
        # they leave the dev's machine; CI then regenerates and injects
        # values from data/runtime_stats.yaml at build time. The two
        # halves are complementary: the gate enforces the contract,
        # the injector keeps values fresh.
        #
        # Files list mirrors `_SCOPED_FILES` in
        # scripts/check_doc_numeric_macros.py + the YAML source of
        # truth + the injector/generator/gate themselves. Keep this
        # list in sync with `_SCOPED_FILES` whenever the scope changes.
        files: ^(README\.md|docs/index\.md|docs/roadmap/index\.md|docs/architecture/decisions\.md|docs/reference/convention-gates\.md|data/runtime_stats\.yaml|scripts/(check_doc_numeric_macros|inject_runtime_stats|generate_runtime_stats)\.py)$
        pass_filenames: false
        stages: [pre-push]

      - id: mypy
        name: mypy type-check (affected modules)
        entry: uv run python scripts/run_affected_mypy.py
        language: system
        files: ^(src/|tests/).*\.py$
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-unit
        name: pytest unit tests (affected modules)
        entry: uv run python scripts/run_affected_tests.py
        language: system
        files: ^(src/|tests/).*\.py$
        pass_filenames: false
        stages: [pre-push]

      - id: golangci-lint
        name: golangci-lint (CLI)
        entry: bash -c "cd cli && golangci-lint run"
        language: system
        files: ^cli/.*\.go$
        pass_filenames: false
        stages: [pre-push]

      - id: go-vet
        name: go vet (CLI)
        entry: go -C cli vet ./...
        language: system
        files: ^cli/.*\.go$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: go-test
        name: go test (CLI)
        entry: go -C cli test ./...
        language: system
        files: ^cli/.*\.go$
        pass_filenames: false
        stages: [pre-push]

      - id: eslint-web
        name: ESLint (web dashboard)
        entry: npm --prefix web run lint
        language: system
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: false
        # Pre-push only: ESLint boots the TS project graph which can
        # take 15-30s locally even on unrelated backend commits. The
        # dedicated ``dashboard-lint`` CI job still gates pushes that
        # land on the branch, so nothing escapes review.
        stages: [pre-push]

      - id: forbidden-literals
        name: forbidden-literal gate (src/synthorg)
        entry: uv run python scripts/check_forbidden_literals.py
        language: system
        files: ^src/synthorg/.*\.py$
        pass_filenames: false
        stages: [pre-push]

      - id: persistence-boundary
        name: persistence-boundary gate (src/ + tests/)
        entry: uv run python scripts/check_persistence_boundary.py
        language: system
        files: ^(src/synthorg|tests)/.*\.py$
        pass_filenames: false
        stages: [pre-push]

      - id: currency-aggregation-invariant
        name: currency-aggregation-invariant gate (src/synthorg)
        entry: uv run python scripts/check_currency_aggregation_invariant.py
        language: system
        # Trigger on any change to src/synthorg Python files, the gate
        # script itself, or this config so a PR that adds an unguarded
        # cost aggregation (or weakens the gate by editing the script)
        # cannot bypass the check.
        files: ^(src/synthorg/.*\.py|scripts/check_currency_aggregation_invariant\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: persistence-protocol-uniformity
        name: persistence-backend property return-type uniformity (#1773)
        entry: uv run python scripts/check_persistence_protocol_return_types.py
        language: system
        # Trigger on changes to the protocol module, either backend, the
        # gate script itself, or this config so a PR cannot weaken the
        # check by editing the script without touching the backends.
        files: ^(src/synthorg/persistence/(protocol|[^/]+_protocol|sqlite/backend|postgres/backend)\.py|scripts/check_persistence_protocol_return_types\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: dependency-inversion
        name: dependency-inversion gate (high-level packages depend on protocols)
        entry: uv run python scripts/check_dependency_inversion.py
        language: system
        # Trigger on any change to the scanned tree, the gate script
        # itself, or this config so a PR that introduces a new concrete
        # import (or weakens the gate via the script / allowlist) cannot
        # bypass the check.
        files: ^(src/synthorg/(api|engine|communication|persistence)/.*\.py|scripts/check_dependency_inversion\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: list-pagination
        name: list_*/query repository pagination gate
        entry: uv run python scripts/check_list_pagination.py --scan-all
        language: system
        files: ^(src/synthorg/persistence/.*\.py|scripts/check_list_pagination\.py|scripts/list_pagination_baseline\.txt|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: no-magic-numbers
        name: no bare numeric literals in business logic (#1739)
        entry: uv run python scripts/check_no_magic_numbers.py
        language: system
        files: ^(src/synthorg|scripts/check_no_magic_numbers\.py|scripts/no_magic_numbers_baseline\.txt|\.pre-commit-config\.yaml)/?.*$
        pass_filenames: false
        stages: [pre-push]

      - id: setting-to-startup-trace
        name: settings → startup wiring trace (ghost-wired settings gate)
        entry: uv run python scripts/check_setting_to_startup_trace.py
        language: system
        # Trigger on any change to settings definitions, lifecycle/app
        # wiring, the lint script itself, or its baseline file so a PR
        # that adds a ghost-wired setting (or weakens the gate by editing
        # the script / baseline) cannot bypass the check.
        files: ^(src/synthorg/settings/definitions/.*\.py|src/synthorg/api/(app|lifecycle|lifecycle_builder|lifecycle_helpers|auto_wire)\.py|scripts/check_setting_to_startup_trace\.py|scripts/setting_to_startup_trace_baseline\.txt|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: long-running-loop-kill-switch
        name: long-running loops carry a runtime kill-switch
        entry: uv run python scripts/check_long_running_loops_have_kill_switch.py
        language: system
        # Trigger on any change to src/synthorg Python files, the gate
        # script itself, or its baseline. A PR that adds a new
        # ``while True:`` / ``while not stop_event.is_set():`` async
        # loop without a per-iteration ``ConfigResolver.get_bool(...
        # _enabled)`` re-read (or a mandatory-justification opt-out)
        # cannot bypass the check by editing only the source file.
        files: ^(src/synthorg/.*\.py|scripts/check_long_running_loops_have_kill_switch\.py|scripts/long_running_loops_kill_switch_baseline\.txt|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: domain-error-hierarchy
        name: domain-error-hierarchy gate (DomainError-rooted exception classes)
        entry: uv run python scripts/check_domain_error_hierarchy.py
        language: system
        # Trigger on any change to src/synthorg Python files, the gate
        # script itself, or its baseline so a PR that introduces a new
        # plain-Exception class (or weakens the gate by editing the
        # script / baseline) cannot bypass the check.
        files: ^(src/synthorg/.*\.py|scripts/check_domain_error_hierarchy\.py|scripts/domain_error_hierarchy_baseline\.txt|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: no-controller-response-for-domain-errors
        name: no-controller-response-for-domain-errors gate (raise typed errors, never build local Response envelopes)
        entry: uv run python scripts/check_no_controller_response_for_domain_errors.py
        language: system
        # Trigger on any change to controllers, the gate script, or its
        # baseline so a PR that re-introduces a controller-level
        # ``except DomainError: return Response(...)`` (or weakens the
        # gate by editing the script / baseline) cannot bypass the check.
        files: ^(src/synthorg/api/controllers/.*\.py|scripts/check_no_controller_response_for_domain_errors\.py|scripts/no_controller_response_for_domain_errors_baseline\.txt|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: error-codes-ts-in-sync
        name: error-codes-ts-in-sync gate (web/src/api/types/error-codes.gen.ts matches src/synthorg/core/error_taxonomy.py)
        entry: uv run python scripts/check_error_codes_ts_in_sync.py
        language: system
        # Trigger on any change to the source enum, the generator,
        # the gate, or the generated mirror so a PR that adds a
        # backend code without regenerating (or weakens the gate by
        # editing the script) cannot bypass the check.
        files: ^(src/synthorg/core/error_taxonomy\.py|scripts/generate_error_codes_ts\.py|scripts/check_error_codes_ts_in_sync\.py|web/src/api/types/error-codes\.gen\.ts|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: mcp-admin-guardrail
        name: MCP admin_tool guardrails gate (require_admin_guardrails on every admin handler)
        entry: uv run python scripts/check_mcp_admin_tool_guardrails.py
        language: system
        # Trigger on any change to MCP domain registrations, MCP handlers,
        # the gate script itself, or this config so a PR that introduces a
        # new admin_tool registration / handler (or weakens the gate by
        # editing the script) cannot bypass the check.
        files: ^(src/synthorg/meta/mcp/(handlers|domains)/.*\.py|scripts/check_mcp_admin_tool_guardrails\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: dead-api-endpoints
        name: dead-API-endpoint gate (frontend ↔ backend route parity)
        entry: uv run python scripts/check_dead_api_endpoints.py
        language: system
        # Trigger on any change to controller registration, controller
        # files, the WS handler, A2A controllers, every TS/TSX source
        # under web/src/, the gate scripts themselves, or the baseline
        # so a PR cannot land a frontend caller pointing at a dead
        # endpoint without the gate running.
        files: ^(src/synthorg/api/(app|controllers/.*)\.py|src/synthorg/a2a/.*\.py|web/src/.*\.(ts|tsx)|scripts/(check_dead_api_endpoints|_dead_api_endpoints_.*)\.py|scripts/dead_api_endpoints_baseline\.txt|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: dual-backend-test-parity
        name: dual-backend test parity gate (conformance + protocols)
        entry: uv run python scripts/check_dual_backend_test_parity.py
        language: system
        # Trigger on any change to a persistence protocol, a
        # conformance test, the gate script, or its baseline so a PR
        # that adds a missing-coverage gap or a signature regression
        # (or weakens the gate by editing the script / baseline)
        # cannot bypass the check.
        files: ^(src/synthorg/persistence/[^/]+\.py|tests/conformance/persistence/.*\.py|scripts/check_dual_backend_test_parity\.py|scripts/_dual_backend_parity_lib\.py|scripts/dual_backend_parity_baseline\.txt|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: dto-forbid-extra
        name: DTO extra="forbid" gate (src/synthorg/api)
        entry: uv run python scripts/check_dto_forbid_extra.py
        language: system
        # Trigger on any change to the scanned tree, the checker
        # itself, or this config so a PR that weakens the gate cannot
        # bypass the check by not touching api Python files.
        files: ^(src/synthorg/api/.*\.py|scripts/check_dto_forbid_extra\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: boundary-typed
        name: typed-boundary contract gate (RFC #1711 Phase 3)
        entry: uv run python scripts/check_boundary_typed.py
        language: system
        # The script's ``_REGISTERED_BOUNDARIES`` tuple is the single
        # source of truth for which (file, function) pairs the gate
        # enforces. Keep this trigger broad rather than duplicating
        # the boundary list here, so a future boundary added only to
        # the script does not silently stop running pre-push because
        # this regex was forgotten. The check is sub-second when
        # there are no violations, so the broader trigger costs
        # nothing per push.
        files: ^(src/synthorg/.*\.py|scripts/check_boundary_typed\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: provider-complete-chokepoint
        name: cost-recording chokepoint gate
        entry: uv run python scripts/check_provider_complete_chokepoint.py
        language: system
        # Trigger on any change to the scanned tree, the checker
        # itself, or this config -- so a PR that weakens the gate
        # (e.g. relaxing the heuristic, expanding the allowlist,
        # changing the trigger pattern) cannot bypass the check by
        # not touching ``src/synthorg/`` Python files.
        files: ^(src/synthorg/.*\.py|scripts/check_provider_complete_chokepoint\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: schema-drift
        name: schema-drift gate (SQLite vs Postgres parity)
        entry: uv run python scripts/check_schema_drift.py
        language: system
        # Trigger on schema files, revision files, the script itself,
        # the baseline, or this config so a PR that weakens the gate
        # cannot bypass the check by not touching schema.sql.
        files: ^(src/synthorg/persistence/(sqlite|postgres)/(schema\.sql|revisions/.*\.sql)|scripts/check_schema_drift\.py|scripts/_schema_drift_.*\.py|scripts/schema_drift_baseline\.txt|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: convention-gate-inventory
        name: convention-gate inventory (MANDATORY <-> gate parity)
        entry: uv run python scripts/check_convention_gate_inventory.py
        language: system
        # Trigger on any canonical doc file, the inventory YAML, the
        # gate script itself, or this config so a PR that adds a
        # MANDATORY paragraph or weakens the inventory cannot bypass
        # the check.
        files: ^(CLAUDE\.md|web/CLAUDE\.md|cli/CLAUDE\.md|docs/reference/.*\.md|docs/design/.*\.md|scripts/check_convention_gate_inventory\.py|scripts/convention_gate_map\.yaml|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: no-review-origin-in-code
        name: no reviewer citations / issue back-refs / naked SEC-N in code
        entry: uv run python scripts/check_no_review_origin_in_code.py
        language: system
        # Trigger on any in-scope source / test file, the gate script
        # itself, or this config so a PR that introduces a forbidden
        # pattern (or weakens the gate by editing the script) cannot
        # bypass the check. Atlas-managed migration revisions are
        # auto-generated and excluded so the hook does not start a
        # subprocess for files the script's internal allowlist would
        # immediately skip.
        files: ^(src/synthorg/(?!persistence/(?:postgres|sqlite)/revisions/).*\.(py|sql)|tests/.*\.py|scripts/check_no_review_origin_in_code\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        # pre-commit covers pre-commit.ci (catches GitHub-UI edits and
        # contributors who skip local hooks); pre-push remains the
        # primary developer-machine enforcement point.
        stages: [pre-commit, pre-push]

      - id: no-migration-framing
        name: no migration / origin / phase-N framing in code
        entry: uv run python scripts/check_no_migration_framing.py
        language: system
        # Trigger on any in-scope source / test file, the gate script
        # itself, or this config so a PR that introduces migration /
        # origin framing (or weakens the gate by editing the script)
        # cannot bypass the check. Atlas-managed migration revisions
        # are auto-generated and excluded so the hook does not start a
        # subprocess for files the script's internal allowlist would
        # immediately skip.
        files: ^(src/synthorg/(?!persistence/(?:postgres|sqlite)/revisions/).*\.(py|sql)|tests/.*\.py|scripts/check_no_migration_framing\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]
