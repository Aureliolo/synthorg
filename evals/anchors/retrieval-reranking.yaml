# Hand-scored calibration anchors for the ``retrieval-reranking`` rubric.
#
# Five anchors spanning degraded -> competent retrieval_relevance.
rubric_id: retrieval-reranking
anchor_set_version: 1
items:
  - anchor_id: anchor-wrong
    output: >-
      The run reused a near-duplicate lesson that did not apply, and repeated
      the original failure it was meant to avoid.
    hand_scores:
      retrieval_relevance: 0.0
  - anchor_id: anchor-distracted
    output: >-
      The run surfaced several similar lessons and blended them, diluting the
      one that actually applied.
    hand_scores:
      retrieval_relevance: 0.25
  - anchor_id: anchor-late
    output: >-
      The run eventually found the relevant lesson, but only after trying a
      wrong neighbour first and wasting turns.
    hand_scores:
      retrieval_relevance: 0.5
  - anchor_id: anchor-relevant
    output: >-
      The run surfaced the relevant lesson early and applied it, with one
      irrelevant neighbour briefly considered.
    hand_scores:
      retrieval_relevance: 0.75
  - anchor_id: anchor-precise
    output: >-
      The run surfaced exactly the relevant lesson, applied it cleanly, and
      explained why the near-duplicates did not fit.
    hand_scores:
      retrieval_relevance: 1.0
