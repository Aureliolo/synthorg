ci:
  autoupdate_schedule: never
  autofix_prs: true
  autofix_commit_msg: "style: auto-fix pre-commit hooks"
  # Hooks listed here are skipped ONLY on pre-commit.ci. They still run
  # on every developer machine and in any CI job that invokes pre-commit
  # directly. Skip reasons, grouped by category:
  #   - commitizen / gitleaks / hadolint-docker / caddy-validate / zizmor:
  #     covered by dedicated CI jobs; re-running on pre-commit.ci adds
  #     latency without adding signal. gitleaks, hadolint-docker, and
  #     markdownlint additionally carry `stages: [pre-push]` so they never
  #     reach the pre-commit.ci runner regardless of this list -- the
  #     entries are kept here for grep-discoverability of the skip
  #     rationale (markdownlint's CI counterpart is the all-files gate job
  #     that runs the pre-push stage).
  #     (actionlint is NOT skipped: no dedicated CI job covers it, and
  #     pre-commit.ci is the only enforcement layer for contributors who
  #     skipped local hooks.)
  #   - mypy / pytest-unit / go-* / lychee / vale / web-checks:
  #     too slow / toolchain-heavy for the cloud runner.
  #     lychee is also a Rust binary not bundled with pre-commit-uv;
  #     operators install it via `bash scripts/install_cli_tools.sh`,
  #     and CI runs it via .github/workflows/verify-links.yml. vale follows
  #     the same binary-install shape (operators install the binary
  #     once per machine via `bash scripts/install_cli_tools.sh vale`),
  #     but the gitignored `.vale/styles/Google/` package is populated
  #     lazily by the `scripts/vale-prepush.sh` wrapper on the first
  #     push in each worktree, so new worktrees do not need an explicit
  #     sync step. vale's CI counterpart is the `Prose lint (vale)` step
  #     in the `Gates` job of .github/workflows/verify-backend.yml, which
  #     also runs vale-ledger-complete: that gate enumerates the same
  #     gitignored style package, so it belongs wherever the package has
  #     just been materialised.
  #   - no-em-dashes / no-redundant-timeout / forbidden-literals /
  #     persistence-boundary / no-new-logger-exception-str-exc /
  #     orphan-fixtures / boundary-typed / setting-to-startup-trace /
  #     domain-error-hierarchy / list-pagination / dead-api-endpoints /
  #     dual-backend-test-parity / schema-drift / no-magic-numbers /
  #     convention-gate-inventory / mcp-admin-guardrail:
  #     scoped gates that need ``uv`` + repo source -- redundant given
  #     the `Lint` + `Forbidden literals gate` jobs in verify-backend.yml.
  #   - check-push-rebased / check-single-migration-per-pr /
  #     check-no-modify-migration:
  #     rebase / migration state checks meaningful only on the pushing
  #     developer's clone, not in an ephemeral cloud runner.
  # ``no-release-please-token`` and ``workflow-shell-git-commits`` are
  # deliberately NOT skipped: both are pure-Python, zero-dependency
  # scripts with no CI counterpart, and letting pre-commit.ci enforce
  # them at the pre-commit stage closes the gap where a PR from a
  # contributor who skipped local hooks would otherwise introduce a
  # regression unchecked. ``no-review-origin-in-code`` and
  # ``no-migration-framing`` run at ``stages: [pre-push]`` (the
  # local-only pre-push hook surface) so pre-commit.ci does not pick
  # them up; their CI counterpart is the ``Lint`` job in ``verify-backend.yml``
  # which runs the same scripts on every PR.
  skip: [commitizen, gitleaks, hadolint-docker, markdownlint, caddy-validate, zizmor, no-em-dashes, no-redundant-timeout, mypy, pytest-unit, golangci-lint, go-vet, go-test, lychee, vale, vale-ledger-complete, web-checks, check-push-rebased, check-single-migration-per-pr, check-no-modify-migration, no-new-logger-exception-str-exc, completion-config-temperature, otlp-span-redaction, doc-drift-counts, list-pagination, runtime-stats-freshness, dto-types-ts-in-sync, no-client-state-persistence, no-growth-in-god-modules, no-central-junk-drawer, lint-imports, python-audits, sqlfluff, yamllint, consolidated-python-gates]
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: local
    hooks:
      - id: check-push-rebased
        name: check push rebased (block if behind main)
        entry: bash
        args: ["scripts/check_push_rebased.sh"]
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        types: []
      - id: check-single-migration-per-pr
        name: enforce at most one new migration per backend per PR
        entry: bash
        args: ["scripts/check_single_migration_per_pr.sh"]
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-push]
        types: []
      - id: check-no-modify-migration
        name: block modification of existing migration files
        entry: bash
        args: ["scripts/check_no_modify_migration.sh"]
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
        types: []
      # Consolidated runner for the pre-push-only Python gates
      # (scripts/run_prepush_python_gates.py). Folding the individual
      # `uv run python scripts/check_*.py` hooks into one runner keeps the
      # concurrent spawn count bounded -- the desktop-heap / STATUS_DLL_INIT_
      # FAILED (0xC0000142) pressure on Windows -- while fanning the CPU-bound
      # whole-tree AST gates across a reused-worker pool, so a gate's cost is
      # absorbed by the pool instead of added to the push. Any pre-push-only
      # whole-tree gate that takes no filenames and no extra arguments belongs
      # in `_GATES`, not in its own stanza. The underlying
      # scripts/check_*.py files stay on disk so the convention-gate-inventory
      # meta-gate still resolves each gate path, and CI's `pre-commit run
      # --all-files` runs this one hook from the same config so local<->CI
      # parity holds.
      - id: consolidated-python-gates
        name: consolidated pre-push Python gates
        entry: uv run python scripts/run_prepush_python_gates.py
        language: system
        always_run: true
        pass_filenames: false
        # Surfaces the runner's own "N gates in Xs across J jobs" line on a
        # green run; without it the largest single hook reports nothing and
        # a scope regression here is invisible until a push feels slow.
        verbose: true
        stages: [pre-push]
        types: []
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Two files reach the unsafe-mode hook below:
        #   - mkdocs.yml uses pymdownx's !!python tags
        #   - docker/compose.dast.yml uses Docker Compose's !override
        #     custom tag (compose v2.20+) to drop the postgres dependency
        #     in DAST.
        # `check-yaml --unsafe` switches pre-commit-hooks from
        # `ruamel.yaml.YAML(typ='safe').load` to `ruamel.yaml.parse`
        # (syntactic-only stream parser; no constructor needed) so
        # custom tags pass without registering constructors. The plain
        # PyYAML SafeLoader/UnsafeLoader behaviour is irrelevant here.
        exclude: ^(src/synthorg/templates/builtins/|mkdocs\.yml$|docker/compose\.(dast|dev)\.yml$)
      - id: check-yaml
        name: check-yaml (unsafe parser for custom tags; mkdocs + compose overlays)
        args: [--unsafe]
        files: ^(mkdocs\.yml|docker/compose\.(dast|dev)\.yml)$
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-symlinks
      - id: check-case-conflict
      - id: debug-statements
        types: [python]
      - id: detect-private-key
        # - tests/ contains deliberate fixtures with PEM-looking literals.
        # - docs/reference/github-environments.md documents the exact
        #   ``-----BEGIN / END RSA PRIVATE KEY-----`` marker lines so
        #   operators can recognise a correct copy-paste; the file
        #   obviously contains no real key.
        exclude: ^(tests/|docs/reference/github-environments\.md$)
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Markdown lint: enforces consistent formatting for top-level + docs/
  # READMEs and CLAUDE.md, plus the CLI / web sub-tree READMEs.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
        # Top-level + docs/ + cli/ + web/ Markdown is in scope.
        files: ^(README|CLAUDE|cli/CLAUDE|web/CLAUDE)\.md$|^docs/.*\.md$
        # Markdown lint is a prose convention, not a code-correctness gate, so
        # it runs at pre-push alongside vale / lychee (and in CI via the
        # all-files gate job) to keep commits fast.
        stages: [pre-push]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-push]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        stages: [pre-push]

  # Workflow YAML safety gates. actionlint catches workflow-syntax
  # errors, expression typos, and shellcheck-style issues in `run:`
  # blocks. zizmor catches GitHub Actions security smells (dangerous
  # workflow_run patterns, secret leakage, expression injection,
  # outdated action SHAs). Scoped to .github/workflows/ + .zizmor.yml
  # so unrelated commits do not pay the lint cost.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        # Match workflows + composite actions + this file. zizmor v1.25+
        # recognises the first two as inputs and v1.29 adds pre-commit
        # configs, where its insecure-url-scheme audit catches a hook
        # repo fetched over plaintext. `.github/.zizmor.yml` is
        # intentionally NOT matched: it is the audit config (passed via
        # --config below) and zizmor v1.25 exits with `no inputs
        # collected` if the only matched path is the config itself.
        files: ^(\.github/workflows/.*\.ya?ml|\.github/actions/.+/action\.ya?ml|\.pre-commit-config\.yaml)$
        args: [--config=.github/.zizmor.yml]

  - repo: local
    hooks:
      - id: caddy-validate
        name: caddy validate (Caddyfile)
        entry: bash
        args: ["scripts/caddy-validate.sh"]
        language: system
        files: ^web/Caddyfile$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: no-em-dashes
        name: no em-dashes (U+2014)
        entry: uv
        args: [run, python, scripts/check_no_em_dashes.py]
        language: system
        types: [text]
        # Punctuation convention, not a correctness check: run at pre-push with
        # the other prose gates rather than on every commit.
        stages: [pre-push]

      - id: no-redundant-timeout
        name: no redundant pytest.mark.timeout(30)
        entry: uv
        args: [run, python, scripts/check_no_redundant_timeout.py]
        language: system
        files: ^tests/.*\.py$
        stages: [pre-push]

      - id: timeout-interval-default-drift
        name: timeout-check interval boot fallback matches registered default
        entry: uv
        args: [run, python, scripts/check_timeout_interval_default_drift.py]
        language: system
        pass_filenames: false
        files: ^src/synthorg/(api/lifecycle_helpers/boot_resolvers\.py|settings/definitions/security\.py)$
        # Settings/config gate; lives at the pre-push boundary with the other
        # bootstrap-config gates.
        stages: [pre-push]

      - id: no-synthorg-any-override
        name: no synthorg.* mypy override may lift disallow_any_explicit
        entry: uv run python scripts/check_no_synthorg_any_override.py
        language: system
        files: ^(pyproject\.toml|scripts/check_no_synthorg_any_override\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        # Cheap (parses pyproject.toml only); run at commit for fast feedback.
        stages: [pre-commit, pre-push]

      - id: no-explicit-any-inline-disable
        name: no inline # mypy: comment may lift explicit-any/unused-ignore
        entry: uv run python scripts/check_no_explicit_any_inline_disable.py
        language: system
        files: ^(src/synthorg/.*|tests/.*)\.py$
        # Cheap (scans only the staged files); run at commit for fast feedback.
        stages: [pre-commit, pre-push]

      - id: no-bare-time-in-business-logic
        name: clock-seam (no bare time.monotonic/time.time/datetime.utcnow)
        entry: uv
        args: [run, python, scripts/check_no_bare_time_in_business_logic.py]
        language: system
        pass_filenames: false
        files: ^src/synthorg/.*\.py$
        stages: [pre-commit, pre-push]

      - id: no-new-logger-exception-str-exc
        name: block logger.exception(...) calls and error=str(exc) sites
        entry: uv
        args: [run, python, scripts/check_logger_exception_str_exc.py]
        language: system
        files: ^src/synthorg/.*\.py$
        stages: [pre-push]

      - id: completion-config-temperature
        name: CompletionConfig must pin an explicit temperature
        entry: uv
        args: [run, python, scripts/check_completion_config_temperature.py]
        language: system
        files: ^src/synthorg/.*\.py$
        stages: [pre-push]

      - id: otlp-span-redaction
        name: block span.record_exception()/auto-handler kwargs in src/synthorg/
        entry: uv
        args: [run, python, scripts/check_otlp_span_redaction.py]
        language: system
        files: ^src/synthorg/.*\.py$
        stages: [pre-push]

      - id: no-loop-bound-init
        name: block new asyncio primitives in __init__ of lifecycle-managed classes
        entry: uv
        args: [run, python, scripts/check_no_loop_bound_init.py]
        language: system
        files: ^(src/synthorg/.*\.py|scripts/check_no_loop_bound_init\.py|scripts/loop_bound_init_baseline\.txt|\.pre-commit-config\.yaml)$
        pass_filenames: false

      - id: no-new-bare-mock
        name: block new bare Mock()/AsyncMock()/MagicMock() in tests/
        entry: uv
        args: [run, python, scripts/check_mock_spec.py]
        language: system
        files: ^tests/.*\.py$

      - id: baseline-growth
        name: block growth of gate suppression baselines
        entry: uv
        args: [run, python, scripts/check_baseline_growth.py]
        language: system
        files: ^scripts/(([a-z_][a-z_]*_baseline\.(txt|json))|(_[a-z][a-z_]*_baseline\.py))$

      - id: no-release-please-token
        name: forbid new RELEASE_PLEASE_TOKEN references
        entry: uv
        args: [run, python, scripts/check_no_release_please_token.py]
        language: system
        files: ^\.github/.*\.ya?ml$

      - id: workflow-shell-git-commits
        name: block shell git commit+push in workflows (must mint App token)
        entry: uv
        args: [run, python, scripts/check_workflow_shell_git_commits.py]
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [pre-push]

      - id: workflow-tag-lifecycle
        name: block tag CREATE+conditional-DELETE in same workflow
        entry: uv
        args: [run, python, scripts/check_workflow_tag_lifecycle.py, --scan-all]
        language: system
        files: ^(\.github/workflows/.*\.ya?ml|scripts/check_workflow_tag_lifecycle\.py|\.pre-commit-config\.yaml)$
        # pass_filenames: false so the hook always re-scans every
        # workflow YAML regardless of which file in `files:` triggered
        # it. Without this, an edit limited to the checker script or
        # to .pre-commit-config.yaml would invoke the script with only
        # those non-workflow paths; the script would skip them on the
        # ``.yml/.yaml`` suffix filter and exit 0 with zero workflows
        # actually scanned, letting a weakened gate land unchecked.
        pass_filenames: false
        stages: [pre-push]

      - id: ci-workflow-resilience
        name: CI workflow resilience (job timeouts + fail-closed retry ladders)
        entry: uv
        args: [run, python, scripts/check_ci_workflow_resilience.py, --scan-all]
        language: system
        # `.github/actions/` is in scope because invariants 3-5 scan composite
        # actions too: they host every retry_cmd.sh call site, can bypass a
        # wrapper, and are the transitive artifact consumers invariant 5
        # resolves through. Without it, an action-only edit never triggers the
        # gate that judges it.
        # `docker/**/Dockerfile` is in scope because invariant 8 lives there:
        # the buildx docker.io mirror is only safe while every reference
        # BuildKit resolves itself carries a digest.
        files: ^(\.github/(workflows|actions)/.*\.ya?ml|docker/(.*/)?Dockerfile|scripts/check_ci_workflow_resilience\.py|\.pre-commit-config\.yaml)$
        # pass_filenames: false so the hook always re-scans every workflow
        # regardless of which file in `files:` triggered it (same rationale
        # as workflow-tag-lifecycle above): an edit limited to the checker
        # script or this config would otherwise scan zero workflows.
        pass_filenames: false
        # pre-push only: the whole-tree YAML scan is moved off the commit
        # path so iterative commits stay fast; it still gates before push.
        stages: [pre-push]

      - id: retry-helper-selftest
        name: cosign/push retry helpers classify large 5xx output as transient (broken-pipe regression)
        entry: bash .github/scripts/tests/test_retry_classifiers.sh
        language: system
        # Re-run the full self-test whenever a helper or the test itself
        # changes. pass_filenames: false so an edit to either helper drives
        # the same assertions (the test feeds a >64 KB early-match 5xx body
        # through the real scripts; on Linux the old `printf | grep -q` form
        # reproduces the EPIPE and fails, the here-string form passes).
        files: ^\.github/scripts/(cosign_sign_with_retry|docker_push_with_retry|tests/test_retry_classifiers)\.sh$
        pass_filenames: false
        # pre-commit only: the test is fast (three subprocesses, zero
        # backoff) and gives feedback before a commit message is written;
        # without an explicit stage it would also run at commit-msg.
        stages: [pre-commit]

      - id: retry-cmd-selftest
        name: retry_cmd.sh retries-then-fails-closed self-test
        entry: bash .github/scripts/tests/test_retry_cmd.sh
        language: system
        # Re-run whenever the generic retry helper or its test changes; the
        # test drives the retry-to-success, fail-closed-with-exit-code, and
        # no-retry-on-clean-success contracts with zero backoff.
        files: ^\.github/scripts/(retry_cmd|tests/test_retry_cmd)\.sh$
        pass_filenames: false
        stages: [pre-commit]

      - id: publishers-complete-selftest
        name: verify-signatures completeness precondition self-test
        entry: bash .github/scripts/tests/test_assert_publishers_complete.sh
        language: system
        # The helper decides whether an image may be certified as signed, and
        # it is the ONLY thing standing between a publisher that stopped
        # mid-push and a green signature gate. It is tested against the two
        # safe `needs.result` values rather than the known-unsafe ones, so the
        # test pins `cancelled` and an unknown future value as blocking.
        files: ^\.github/scripts/(assert_publishers_complete|tests/test_assert_publishers_complete)\.sh$
        pass_filenames: false
        stages: [pre-commit]

      - id: doc-drift-counts
        name: doc count floors (event modules)
        entry: uv
        args: [run, python, scripts/check_doc_drift_counts.py]
        language: system
        # Trigger on edits to any registered claim site or to the events
        # directory itself; the script enumerates the events package
        # and parses each claim file end-to-end on every run.
        files: ^(docs/design/observability\.md|docs/design/agent-execution\.md|docs/research/(control-plane-audit|acg-formalism-evaluation)\.md|src/synthorg/observability/events/.*\.py|scripts/check_doc_drift_counts\.py)$
        pass_filenames: false
        # Documentation-consistency gate (enumerates the events package and
        # parses each claim file end-to-end); runs at pre-push with the other
        # doc gates. It keeps its own stanza rather than joining the
        # consolidated pool because its scope is a narrow trigger list, not
        # the whole tree.
        stages: [pre-push]

      - id: docs-nav-coverage
        name: docs nav coverage (every page in nav or allowlisted)
        entry: uv
        args: [run, python, scripts/check_docs_nav_coverage.py]
        language: system
        # A new docs/ page silently absent from the mkdocs nav, or a nav
        # entry pointing at a deleted file, both surface here. The gate
        # enforces that every docs/**/*.md is reachable from the nav or on
        # the documented internal-only allowlist in the gate script.
        # Trigger on any docs page add/remove/rename, the nav config, or
        # the gate script itself.
        files: ^(docs/.*\.md|mkdocs\.yml|scripts/check_docs_nav_coverage\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: no-pre-commit-install-in-docs
        name: docs must not recommend `pre-commit install` (use install_git_hooks.sh)
        entry: uv run python scripts/check_no_pre_commit_install_in_docs.py
        language: system
        # `pre-commit install` rewrites the shared core.hooksPath to an
        # absolute .git/hooks path, silently disabling hook gating for
        # every worktree. The sanctioned setup is the relative
        # core.hooksPath wired by scripts/install_git_hooks.sh. Trigger
        # on the scoped setup docs, the gate script itself, or this
        # config so a doc that reintroduces the bad instruction (or a PR
        # that weakens the gate) cannot bypass the check. Mirrors
        # `_SCOPED_FILES` in the gate script.
        files: ^(\.github/CONTRIBUTING\.md|docs/getting_started\.md|README\.md|(web/|cli/)?CLAUDE\.md|docs/architecture/decisions\.md|scripts/check_no_pre_commit_install_in_docs\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: runtime-stats-freshness
        name: runtime_stats.yaml freshness (values + 14-day ceiling)
        entry: uv
        args: [run, python, scripts/check_runtime_stats_freshness.py, --skip-network]
        language: system
        # Pre-push runs the gate with --skip-network so developers
        # without a configured `gh` token are not blocked; CI invokes
        # the gate without the flag to perform the full check.
        # Trigger on any edit to the YAML, the generator, the gate
        # itself, or this config so a PR that drifts the values (or
        # weakens the gate by editing the script) cannot bypass the
        # check.
        files: ^(data/runtime_stats\.yaml|scripts/(check_runtime_stats_freshness|generate_runtime_stats)\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: comparison-md-in-sync
        name: comparison.md matches data/competitors.yaml
        entry: uv
        args: [run, python, scripts/check_comparison_md_in_sync.py]
        language: system
        # Trigger on any edit to the source YAML, the rendered Markdown,
        # the generator, the gate itself, or this config so a PR that
        # drifts the comparison page (or weakens the gate) cannot bypass
        # the check. Pre-push only: the generator is offline-pure so the
        # check is cheap, but it is not needed on every local commit.
        files: ^(data/competitors\.yaml|docs/reference/comparison\.md|scripts/(check_comparison_md_in_sync|generate_comparison)\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      # ``verbose`` on the two heavy runners: pre-commit hides a passing
      # hook's stdout, which also hid the scope each one selected and how
      # long it took. A push is held to a five-minute budget, so both have
      # to be visible on a green run, not only when something breaks.
      - id: mypy
        name: mypy type-check (daemon full-tree; cold affected-module fallback)
        entry: uv run python scripts/run_affected_mypy.py
        language: system
        files: ^(src/|tests/|scripts/).*\.py$
        pass_filenames: false
        verbose: true
        stages: [pre-push]

      - id: pytest-unit
        name: pytest unit tests (affected modules)
        entry: uv run python scripts/run_affected_tests.py
        language: system
        files: ^(src/|tests/).*\.py$
        pass_filenames: false
        verbose: true
        stages: [pre-push]

      # Two Go modules ship: the CLI and the sidecar that enforces sandbox
      # egress. Each gets its own hook triple scoped to its own tree, so a
      # change to one never pays for compiling the other.
      - id: golangci-lint
        name: golangci-lint (CLI)
        entry: bash scripts/golangci_module.sh cli
        language: system
        files: ^cli/.*\.go$
        pass_filenames: false
        stages: [pre-push]

      - id: go-vet
        name: go vet (CLI)
        entry: go -C cli vet ./...
        language: system
        files: ^cli/.*\.go$
        pass_filenames: false
        # pre-push only: ``go vet ./...`` compiles the whole CLI module,
        # too heavy for the commit path; golangci-lint/go-test already
        # run pre-push, so vet joins them there.
        stages: [pre-push]

      - id: go-test
        name: go test (CLI)
        entry: go -C cli test ./...
        language: system
        files: ^cli/.*\.go$
        pass_filenames: false
        stages: [pre-push]

      - id: golangci-lint-sidecar
        name: golangci-lint (sidecar)
        entry: bash scripts/golangci_module.sh docker/sidecar
        language: system
        files: ^docker/sidecar/(.*\.go|go\.(mod|sum))$
        pass_filenames: false
        stages: [pre-push]

      - id: go-vet-sidecar
        name: go vet (sidecar)
        entry: go -C docker/sidecar vet ./...
        language: system
        files: ^docker/sidecar/(.*\.go|go\.(mod|sum))$
        pass_filenames: false
        stages: [pre-push]

      - id: go-test-sidecar
        name: go test (sidecar)
        entry: go -C docker/sidecar test ./...
        language: system
        files: ^docker/sidecar/(.*\.go|go\.(mod|sum))$
        pass_filenames: false
        stages: [pre-push]

      - id: lychee
        name: lychee (Markdown link-checker, internal links)
        entry: lychee
        args: ["--config", "lychee.toml", "--no-progress", "--offline"]
        language: system
        # Top-level README, every CLAUDE.md tier, and every Markdown
        # under docs/. The CI gate .github/workflows/verify-links.yml mirrors
        # this glob set. ``--offline`` validates internal links only
        # (relative + file://) and skips network probes, so the hook is
        # near-instant and a third-party host can never block a push.
        # External links are checked weekly by
        # .github/workflows/maint-link-rot.yml (files a tracking issue,
        # never blocks). Pre-push stage matches the other prose gates.
        files: ^(README|CLAUDE|cli/CLAUDE|web/CLAUDE)\.md$|^docs/.*\.md$
        pass_filenames: true
        stages: [pre-push]

      - id: vale
        name: vale (prose linter -- Google style + British vocab)
        # Wrapper that lazily runs `vale sync` when a worktree's
        # gitignored `.vale/styles/Google/` cache is missing, then execs
        # vale on the staged files. Subsequent pushes pay a single
        # stat() call. The vale binary itself is installed once per
        # machine via `bash scripts/install_cli_tools.sh vale`; the
        # wrapper prints a clear pointer if it is missing.
        #
        # What makes a regression block is the per-rule `= error`
        # assignment in `.vale.ini`, not MinAlertLevel: vale's exit code
        # reflects error-severity alerts only, so a corpus drained
        # against warnings and suggestions reports and still exits 0.
        # `.vale.ini` is the single source of truth for both.
        entry: bash scripts/vale-prepush.sh
        language: system
        # Same glob as lychee + markdownlint: README, every CLAUDE.md
        # tier, and every Markdown under docs/. Pre-push only -- vale
        # itself is sub-second on this corpus but pre-push is the
        # right surface for prose-style gates (matches lychee's posture).
        files: ^(README|CLAUDE|cli/CLAUDE|web/CLAUDE)\.md$|^docs/.*\.md$
        pass_filenames: true
        stages: [pre-push]

      - id: vale-ledger-complete
        name: vale ledger completeness (every shipped rule triaged)
        # Materialises the style package itself rather than relying on the
        # vale hook above having run. It cannot: that hook's file filter
        # selects Markdown, this one's selects the vale config, and the two
        # sets are disjoint. A push touching only `.vale.ini` therefore
        # reaches this gate with `.vale/styles/Google/` still absent in a
        # fresh worktree, and the gate refuses to pass without it. The
        # `--sync-only` wrapper call is the shared path, so the pinned
        # binary version is validated here too.
        #
        # Runs on any change to the pin, the ledger, or a project style,
        # since those are the three ways the classified set can drift from
        # the shipped set.
        entry: bash -c 'bash scripts/vale-prepush.sh --sync-only && uv run python scripts/check_vale_ledger_complete.py'
        language: system
        files: ^\.vale\.ini$|^\.vale/styles/(?!Google/).*\.yml$
        pass_filenames: false
        stages: [pre-push]

      # ESLint, knip and dpdm are independent read-only passes over the
      # dashboard, so the group runs them concurrently: wall-clock is the
      # slowest single tool instead of the sum of all three.
      #
      # ESLint receives only the CHANGED files. Its cost is dominated by
      # per-file work across the ~700-file dashboard, so scoping it to the
      # push turns the repo's size into a non-factor; a whole-tree run is
      # the single most expensive hook in the pre-push suite.
      #
      # Whole-tree lint stays CI's job: a config edit or a deletion can
      # affect files this push does not name, and the dedicated
      # ``dashboard-lint`` job runs the full scripts on every branch.
      - id: web-checks
        name: web dashboard checks (eslint + knip + circular, concurrent)
        entry: uv
        # The trailing ``--`` keeps a path that begins with a dash from
        # being parsed as an option when pre-commit appends the file list.
        args: [run, python, scripts/run_prepush_hook_group.py, web-checks, --]
        language: system
        # The union of the three tools' interests; the runner re-filters
        # per tool, so ESLint never receives the JSON only knip cares about.
        files: ^web/.*\.(ts|tsx|json)$
        # One invocation for the whole matched set. Without this pre-commit
        # partitions the files and runs the hook once per chunk IN PARALLEL,
        # and each invocation starts all three Node tools: a 22-file web push
        # was observed spawning six concurrent groups, so eighteen Node
        # processes competed for memory and knip/eslint died mid-parse on
        # heap-allocation failures. The runner already parallelises the three
        # tools itself, which is the concurrency this group wants; pre-commit
        # adding a second, unbounded dimension on top is what broke it.
        require_serial: true
        stages: [pre-push]

      - id: list-pagination
        name: list_*/query repository pagination gate
        entry: uv run python scripts/check_list_pagination.py --scan-all
        language: system
        files: ^(src/synthorg/persistence/.*\.py|scripts/check_list_pagination\.py|scripts/list_pagination_baseline\.txt|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: no-controller-response-for-domain-errors
        name: no-controller-response-for-domain-errors gate (raise typed errors, never build local Response envelopes)
        entry: uv run python scripts/check_no_controller_response_for_domain_errors.py
        language: system
        # Trigger on any change to controllers, the gate script, or its
        # baseline so a PR that re-introduces a controller-level
        # ``except DomainError: return Response(...)`` (or weakens the
        # gate by editing the script / baseline) cannot bypass the check.
        files: ^(src/synthorg/api/controllers/.*\.py|scripts/check_no_controller_response_for_domain_errors\.py|scripts/no_controller_response_for_domain_errors_baseline\.txt|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: error-codes-ts-in-sync
        name: error-codes-ts-in-sync gate (web/src/api/types/error-codes.gen.ts matches src/synthorg/core/error_taxonomy.py)
        entry: uv run python scripts/check_error_codes_ts_in_sync.py
        language: system
        # Trigger on any change to the source enum, the generator,
        # the gate, or the generated mirror so a PR that adds a
        # backend code without regenerating (or weakens the gate by
        # editing the script) cannot bypass the check.
        files: ^(src/synthorg/core/error_taxonomy\.py|scripts/generate_error_codes_ts\.py|scripts/check_error_codes_ts_in_sync\.py|web/src/api/types/error-codes\.gen\.ts|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      # Declared before dto-types-ts-in-sync because this hook exports the
      # OpenAPI schema that the one below consumes: running the producer
      # first turns that hook's own app boot into a file read. Ordering is
      # an optimisation, not a correctness dependency -- the consumer
      # verifies the export against the sources on disk and rebuilds it
      # itself when they disagree. The triggers deliberately are NOT equal:
      # the consumer also fires on the generated .gen.ts mirrors, the npm
      # lockfiles and the two DTO scripts, none of which can change the
      # schema, so widening the producer to match would export for a
      # dependency bump and cost the consumer more than it saves it.
      - id: endpoint-table-in-sync
        name: endpoint-table-in-sync gate (docs/openapi/index.md matches the exported schema)
        entry: bash -c 'uv run python scripts/export_openapi.py && uv run python scripts/generate_endpoint_table.py --check'
        language: system
        # Trigger on any controller edit, the exported schema, the generator
        # and the export script, and the committed table itself. Without a
        # hook invoking the generator's --check mode, the committed table
        # drifts silently every time a route is added.
        files: ^(src/synthorg/api/.*\.py|src/synthorg/core/.*\.py|scripts/(export_openapi|generate_endpoint_table|_openapi_export_shared)\.py|docs/openapi/(index\.md|openapi\.json)|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: dto-types-ts-in-sync
        name: dto-types-ts-in-sync gate (web/src/api/types/*.gen.ts matches Pydantic DTOs via OpenAPI)
        entry: uv run python scripts/check_dto_types_ts_in_sync.py
        language: system
        # Trigger on every Pydantic source the OpenAPI schema reads
        # from (api DTOs, core enums and shared types), the generator
        # and gate themselves, the schema export script and its shared
        # half, the RFC 9457 enricher, every committed output, npm lock
        # files, and this config. A backend DTO edit that does not
        # regenerate the mirrors fails the gate before the diff ships.
        files: ^(src/synthorg/api/.*\.py|src/synthorg/core/.*\.py|scripts/(generate_dto_types_ts|check_dto_types_ts_in_sync|export_openapi|_openapi_export_shared)\.py|web/src/api/types/(openapi|dtos|enum-values)\.gen\.ts|web/package\.json|web/package-lock\.json|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: no-client-state-persistence
        name: no-client-state-persistence gate (web dashboard persists no app state client-side)
        entry: uv run python scripts/check_no_client_state_persistence.py
        language: system
        # Trigger on any web source edit, the gate itself, AND this hook wiring:
        # a new localStorage / sessionStorage / indexedDB access or zustand
        # ``persist`` middleware outside the allowlist fails before the diff
        # ships, and weakening the hook config re-runs the gate. The backend is
        # the single source of truth (web/CLAUDE.md).
        files: ^(web/src/.*\.tsx?|scripts/check_no_client_state_persistence\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: backend-enums-ts-in-sync
        name: backend-enums-ts-in-sync gate (web/src/api/types/backend-enums.gen.ts matches the Python enum sources)
        entry: uv run python scripts/check_backend_enums_ts_in_sync.py
        language: system
        # Trigger on the three source enums (WsEventType,
        # NotificationSeverity, LogLevel), the generator, the gate, the
        # generated mirror, and this config so a backend enum change
        # that does not regenerate the frontend mirror cannot land.
        files: ^(src/synthorg/api/ws_models\.py|src/synthorg/notifications/models\.py|src/synthorg/observability/enums\.py|src/synthorg/providers/health\.py|scripts/generate_backend_enums_ts\.py|scripts/check_backend_enums_ts_in_sync\.py|web/src/api/types/backend-enums\.gen\.ts|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: ws-protocol-version-in-sync
        name: ws-protocol-version-in-sync gate (WS_PROTOCOL_VERSION in Python and TypeScript agree)
        entry: uv run python scripts/check_ws_protocol_version_in_sync.py
        language: system
        # The server's WS_PROTOCOL_VERSION lives in ws_models.py and
        # is mirrored client-side in constants.ts; the client
        # discards frames whose version does not match. If a PR
        # bumps one side without the other every event silently
        # drops; this gate fails before that lands.
        files: ^(src/synthorg/api/ws_models\.py|web/src/utils/constants\.ts|scripts/check_ws_protocol_version_in_sync\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: schema-drift-revisions-sqlite
        name: schema.sql matches accumulated revisions (sqlite arm)
        entry: uv run python scripts/check_schema_drift_revisions.py --backend sqlite
        language: system
        # Trigger when the sqlite schema, sqlite revisions, the gate
        # script itself, or this config changes. The postgres arm
        # needs Docker and runs in CI only; sqlite catches the
        # 'forgot to update schema.sql' bug-class at pre-push without
        # external dependencies (~5-10s).
        files: ^(src/synthorg/persistence/sqlite/(schema\.sql|revisions/.*\.sql)|scripts/check_schema_drift_revisions\.py|scripts/_schema_drift_.*\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      - id: local-ci-parity
        name: local <-> CI parity (every hook has a CI counterpart; cardinal rule)
        entry: uv run python scripts/check_local_ci_parity.py
        language: system
        # Trigger on this config (hooks added/removed/restaged), either CI
        # workflow the gate polices -- verify-backend.yml (all-files SKIP list / job
        # conditions) and verify-cli.yml (cardinal-rule job conditions) -- or the
        # gate script itself, so a change that breaks parity or re-introduces
        # a changed-file-conditioned correctness job cannot bypass the check.
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/verify-(backend|cli)\.yml|scripts/check_local_ci_parity\.py)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: ci-rollup-complete
        name: sentinel rollups cover every job (CI Pass / CLI Pass / Docker Pass)
        entry: uv run python scripts/check_ci_rollup_complete.py
        language: system
        # Every workflow, because the gate's verdict depends on all of them:
        # it collects produced contexts across the whole directory, so a job
        # renamed anywhere can strand a required context. Plus the ruleset
        # spec whose contexts it cross-checks, the gate itself, and this file
        # -- naming the three rollup workflows alone both missed the perf
        # workflows the gate already polices and let a change that narrowed or
        # deleted this very hook land without ever selecting it.
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/.*\.ya?ml|\.github/branch_protection\.yml|scripts/check_ci_rollup_complete\.py)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: no-api-dto-in-persistence-or-service
        name: forbid synthorg.api.dto_* imports inside persistence/ and service/
        entry: uv run python scripts/check_no_api_dto_in_persistence_or_service.py
        language: system
        files: ^(src/synthorg/(persistence/.*\.py|api/services/.*\.py|.*_service\.py|.*/service(?:/.*)?\.py)|scripts/check_no_api_dto_in_persistence_or_service\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: no-boilerplate-docstrings
        name: no machine-generated filler docstrings in src/synthorg/
        entry: uv run python scripts/check_no_boilerplate_docstrings.py --scan-all
        language: system
        # Trigger on any src file, the gate script itself, or this
        # config so a PR that reintroduces filler -- or weakens the gate
        # by editing the script or its hook wiring -- cannot bypass the
        # check. The gate is a fast full-tree line-scan, so it runs
        # --scan-all on every fire (pass_filenames disabled) and stays
        # on pre-commit.
        files: ^(src/synthorg/.*\.py|scripts/check_no_boilerplate_docstrings\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      # Allowlisted god-modules must net-shrink on every PR.
      - id: no-growth-in-god-modules
        name: god-modules must net-shrink
        entry: uv run python scripts/check_no_growth_in_god_modules.py
        language: system
        files: ^(scripts/check_no_growth_in_god_modules\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      # core/enums.py was dissolved and must not be recreated.
      - id: no-central-junk-drawer
        name: no central-junk-drawer (core/enums.py deleted, stays deleted)
        entry: uv run python scripts/check_no_central_junk_drawer.py
        language: system
        files: ^(src/synthorg/core/enums\.py|scripts/check_no_central_junk_drawer\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, pre-push]

      # Declarative import-layering contracts (import-linter / grimp).
      - id: lint-imports
        name: import-linter layering contracts
        entry: uv run python scripts/lint_imports.py --config .importlinter
        language: system
        files: ^(src/synthorg/.*\.py|scripts/lint_imports\.py|\.importlinter|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      # ── Cross-stack quality tools ─────────────────────────────────
      # Dead code (vulture), docstring coverage (interrogate) and
      # dependency hygiene (deptry) are independent read-only scans over
      # the same tree, configured via pyproject, so the group runs them
      # concurrently: wall-clock is the slowest scan, not the sum.
      #
      # One filter covers all three, being the union of their individual
      # interests. deptry therefore sees any ``src/synthorg`` Python
      # change, which is if anything more correct -- an added import is
      # exactly what it checks -- and vulture and interrogate see a
      # lockfile-only change, rare enough to be worth the single filter.
      - id: python-audits
        name: python audits (vulture + interrogate + deptry, concurrent)
        entry: uv
        args: [run, python, scripts/run_prepush_hook_group.py, python-audits]
        language: system
        files: ^(src/synthorg/.*\.py|pyproject\.toml|uv\.lock|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      # SQL lint for migration revisions and the canonical schema.
      # Frozen historical revisions are exempted via .sqlfluffignore;
      # the full default ruleset applies to schema.sql and new revisions.
      - id: sqlfluff
        name: sqlfluff (SQLite + Postgres revisions + schema)
        # The two ~100 KB schema.sql files dominate (~20s each, single
        # file so --processes cannot split them); run the SQLite and
        # Postgres dialects concurrently so the two parses overlap instead
        # of summing. Exit non-zero if either dialect fails.
        entry: bash -c "uv run sqlfluff lint --dialect sqlite src/synthorg/persistence/sqlite/revisions/ src/synthorg/persistence/sqlite/schema.sql & p1=$!; uv run sqlfluff lint --dialect postgres src/synthorg/persistence/postgres/revisions/ src/synthorg/persistence/postgres/schema.sql & p2=$!; wait $p1; r1=$?; wait $p2; r2=$?; [ $r1 -eq 0 ] && [ $r2 -eq 0 ]"
        language: system
        files: ^(src/synthorg/persistence/(sqlite|postgres)/(revisions/.*|schema)\.sql|\.sqlfluff(ignore)?|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-push]

      # YAML lint; configuration in .yamllint.
      - id: yamllint
        name: yamllint (YAML style)
        entry: uv run yamllint
        language: system
        files: ^(\.github/workflows/.*\.ya?ml|\.pre-commit-config\.yaml|\.yamllint|docker/.*\.ya?ml|data/.*\.ya?ml)$
        pass_filenames: true
