name: Set up melange
description: Install the melange binary and the runner dependencies its build sandbox needs

inputs:
  version:
    description: "melange version to install (e.g. v1.2.3)"
    required: true

runs:
  using: composite
  steps:
    # melange's default runner builds each apk inside bubblewrap, and the
    # aarch64 leg is emulated on this amd64 runner, so it needs the static
    # qemu binaries. Those two are the whole list: `build-essential`, `git`
    # and `jq` ship on the hosted image already, and asking for them bought
    # nothing while making the transfer, and the window a stalled mirror had
    # to stall in, several times larger.
    #
    # The mirror's fault here is episodic, not sustained, so the ladder is
    # what recovers it and a single attempt cannot. One measured run stalled
    # twice mid-item and then fetched the whole 14.7 MB in 9s on its third
    # attempt; each attempt re-read the package lists with no lock to wait
    # on, so a killed attempt leaves nothing behind for the next one. That
    # is why the escalating command is handed to the helper directly rather
    # than through a `bash -c` wrapper the kill would stop at.
    - name: Install melange runner dependencies
      shell: bash
      env:
        # Sized from what this step has actually been measured doing. Healthy,
        # the whole install lands in under 20s. Degraded, the mirror answers
        # and then trickles: one run served indices at 220 kB/s where an hour
        # earlier it managed 8 MB/s, which puts the qemu-user-static .deb at
        # over a minute on its own. So 120s is a ceiling on a slow transfer
        # with headroom, low enough that a stall is cut short while attempts
        # remain rather than consuming the whole budget. Three of those plus
        # 15s and 30s of backoff is 405s, and the deadline sits just above it
        # so the ladder can exhaust and report its own verdict.
        RETRY_CMD_ATTEMPTS: "3"
        RETRY_CMD_ATTEMPT_TIMEOUT: "120"
        RETRY_CMD_DEADLINE: "420"
      run: |
        # apt bounds a connection that never answers (Acquire::*::Timeout)
        # and retries an item that errors (Acquire::Retries). It has no
        # minimum-rate bound, so a mirror that answers and then trickles is
        # bounded only by the attempt timeout above, which is why that number
        # has to come from measurement rather than from what feels generous.
        #
        # Fetching the .debs with curl instead was tried and does not work
        # here: this runner's sources use a mirrorlist, so apt reports its
        # URIs as `mirror+file:/etc/apt/apt-mirrors.txt/...`, a scheme only
        # apt resolves and libcurl refuses outright.
        APT_ACQUIRE_OPTS=(
          -o Acquire::http::Timeout=15
          -o Acquire::https::Timeout=15
          -o Acquire::Retries=3
        )
        .github/scripts/retry_cmd.sh "apt-get update (melange deps)" \
          sudo apt-get "${APT_ACQUIRE_OPTS[@]}" update
        .github/scripts/retry_cmd.sh "apt-get install melange deps" \
          sudo apt-get "${APT_ACQUIRE_OPTS[@]}" install -y \
            qemu-user-static bubblewrap

    # Ubuntu 24.04 confines unprivileged user namespaces under AppArmor, so
    # `bwrap --unshare-user` dies with "setting up uid map: Permission
    # denied" and melange cannot start its sandbox at all. Grant the
    # `userns` capability to the bwrap profile, then prove the sandbox
    # actually starts -- failing here names the cause, whereas failing
    # later surfaces as an opaque melange runner error mid-build.
    # https://github.com/chainguard-dev/melange/issues/1508
    - name: Permit unprivileged user namespaces for bwrap
      shell: bash
      run: |
        sudo tee /etc/apparmor.d/local-bwrap <<"EOF"
        abi <abi/4.0>,
        include <tunables/global>

        profile local-bwrap /usr/bin/bwrap flags=(unconfined) {
          userns,
          include if exists <local/bwrap>
        }
        EOF
        sudo systemctl reload apparmor
        bwrap --unshare-user --bind / / true
        echo "bubblewrap sandbox verified"

    # Mirrors setup-apko: download to a file with a bounded per-attempt
    # transfer timeout and retry budget, and verify the published checksum
    # before extracting, so a truncated or stalled release-CDN download
    # self-recovers instead of failing the build on a single blip.
    # `--max-time` is what bounds a stalled-but-open connection;
    # `--retry-max-time` alone only caps the retry loop.
    - name: Install melange
      shell: bash
      env:
        MELANGE_VERSION: ${{ inputs.version }}
      run: |
        MELANGE_ARCHIVE="melange_${MELANGE_VERSION#v}_linux_amd64.tar.gz"
        curl -fsSL --connect-timeout 30 --max-time 120 \
          --retry 8 --retry-all-errors --retry-max-time 300 \
          "https://github.com/chainguard-dev/melange/releases/download/${MELANGE_VERSION}/${MELANGE_ARCHIVE}" \
          -o "/tmp/${MELANGE_ARCHIVE}"
        curl -fsSL --connect-timeout 30 --max-time 120 \
          --retry 8 --retry-all-errors --retry-max-time 300 \
          "https://github.com/chainguard-dev/melange/releases/download/${MELANGE_VERSION}/checksums.txt" \
          -o /tmp/melange-checksums.txt
        awk -v f="${MELANGE_ARCHIVE}" '$2==f {print $1"  /tmp/"$2; found=1} END{if(!found) exit 1}' /tmp/melange-checksums.txt | sha256sum -c -
        tar -xzf "/tmp/${MELANGE_ARCHIVE}" -C /tmp
        mv "/tmp/melange_${MELANGE_VERSION#v}_linux_amd64/melange" /usr/local/bin/melange
        rm -rf "/tmp/${MELANGE_ARCHIVE}" /tmp/melange-checksums.txt "/tmp/melange_${MELANGE_VERSION#v}_linux_amd64"
        melange version
