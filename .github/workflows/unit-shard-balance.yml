name: Check unit shard balance

# `.test_durations.unit` is a snapshot: every test added since it was recorded
# is partitioned at the average cost, so the shards drift apart again as the
# suite grows. Nothing fails while they drift -- they just creep toward the
# 300s session cap until one crosses it mid-PR, which is how shard 1 came to
# be 2.3x its siblings. This watches the spread and asks for a refresh before
# that happens, rather than auto-committing a weekly rewrite of an 8.5k-entry
# file (the merge noise that retired the previous refresh workflow).

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: unit-shard-balance
  cancel-in-progress: false

jobs:
  check-balance:
    name: Compare unit shard wall-clocks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read    # actions/checkout (to load the tracking-issue action)
      actions: read     # read the CI run's job timings
      issues: write     # open / update the tracking issue
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Measure the newest CI run carrying unit shards
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
          # Balanced shards sit within a few percent of each other. 1.5 is
          # well clear of that noise and still leaves headroom: at a ~170s
          # balanced shard, a 1.5x spread is ~255s against a 300s cap.
          MAX_SPREAD_RATIO: "1.5"
          # A release-please bump skips the whole correctness matrix, so the
          # newest completed run can hold no shards at all. Several runs of
          # headroom keeps an ordinary bump from costing a week's measurement.
          RUN_WINDOW: "10"
        run: |
          set -euo pipefail

          # By filename, not display name: the display name is prose and has
          # already been rewritten once (ci.yml -> verify-backend.yml,
          # "CI" -> "Verify - Backend"). A filename that no longer resolves is
          # a 404 that `set -e` turns into a failed step; an empty list is the
          # different case where the workflow exists but no completed run on
          # main does. Both are a failure to measure rather than a verdict
          # about drift, so neither may report one.
          run_ids=$(gh run list --workflow verify-backend.yml --branch main \
            --status completed --limit "$RUN_WINDOW" \
            --json databaseId --jq '.[].databaseId')
          if [ -z "$run_ids" ]; then
            echo "no completed verify-backend.yml run on main; nothing to" >&2
            echo "measure a shard spread from" >&2
            exit 1
          fi

          # `--slurp` folds `--paginate`'s one-document-per-page output into a
          # single array so `length` and the `max_by`/`min` spread below read
          # every job in one pass instead of one page at a time. gh refuses
          # `--slurp` alongside `--jq`, so the selection runs in its own jq.
          run_id=""
          timings=""
          for candidate in $run_ids; do
            candidate_timings=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/jobs" \
              --paginate --slurp \
              | jq '[ .[] | .jobs[]
                      | select(.name | startswith("Test Unit (shard"))
                      | select(.started_at != null and .completed_at != null)
                      | { name: .name,
                          seconds: (((.completed_at | fromdateiso8601)
                                   - (.started_at | fromdateiso8601))) } ]')
            if [ "$(jq 'length' <<<"$candidate_timings")" -ge 2 ]; then
              run_id="$candidate"
              timings="$candidate_timings"
              break
            fi
          done

          # Exhausting the window means no run carried the shards this reads.
          # A bump skipping the matrix explains one run, never the whole
          # window, so what is left is a selector that stopped matching:
          # it must fail rather than report a placid "no drift" forever.
          if [ -z "$run_id" ]; then
            echo "no run among the newest $RUN_WINDOW on main carries 2+" >&2
            echo "'Test Unit (shard' jobs; the job name or the workflow that" >&2
            echo "produces it has probably changed" >&2
            exit 1
          fi

          report=$(jq -r 'sort_by(-.seconds) | .[] | "  \(.name): \(.seconds)s"' <<<"$timings")
          ratio=$(jq -r '(max_by(.seconds).seconds) / ([.[].seconds] | min | if . == 0 then 1 else . end)' <<<"$timings")
          echo "run $run_id shard spread ratio: $ratio"
          echo "$report"

          if [ "$(jq -rn --argjson r "$ratio" --argjson m "$MAX_SPREAD_RATIO" '$r > $m')" = "true" ]; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<SHARD_BALANCE_EOF'
              echo "The unit shards have drifted apart by ${ratio}x (ceiling ${MAX_SPREAD_RATIO}x)."
              echo ""
              echo "Measured on run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}:"
              echo ""
              echo "$report"
              echo ""
              echo "\`.test_durations.unit\` is stale: tests added since it was"
              echo "recorded are partitioned at the average cost, so the slowest"
              echo "shard creeps toward the 300s \`--session-timeout\`. Refresh it"
              echo "from that run and commit the result:"
              echo ""
              echo "    make test-durations RUN_ID=${run_id}"
              echo ""
              echo "If the spread survives a refresh, one shard holds a genuinely"
              echo "expensive test rather than an unlucky partition; find it in the"
              echo "run's \`slowest 20 durations\` block."
              echo 'SHARD_BALANCE_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/post-tracking-issue
        if: steps.measure.outputs.drifted == 'true'
        with:
          title: 'Unit shard durations have drifted'
          labels: 'automation:ci-health,type:ci,prio:low'
          body: ${{ steps.measure.outputs.body }}
          pin: 'false'
          gh-token: ${{ github.token }}

  report-failure:
    name: Open / update tracking issue on schedule failure
    needs: check-balance
    # `== 'failure'` alone: the drift issue above is filed by the job itself
    # on what it measured, so this sink is for the measurement breaking --
    # a gh API error, an unparseable timings document, no completed run to
    # read at all, or a whole window of runs with no shard job in them. A run
    # that never finished measured nothing at all and goes to report-stalled.
    if: >-
      always()
      && github.event_name == 'schedule'
      && needs.check-balance.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/post-tracking-issue)
      issues: write     # gh issue create / comment / reopen
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compose body
        id: body
        env:
          RESULT: ${{ needs.check-balance.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo 'body<<TRACKING_ISSUE_BODY_EOF'
            cat <<EOF
          The weekly unit shard balance check failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) with result \`$RESULT\`.

          Run: ${RUN_URL}

          The shards are unmeasured while this is broken, so \`.test_durations.unit\`
          can go stale without anything asking for a refresh. Likely cause: the
          \`gh run list\` / \`gh api\` lookup of the newest \`verify-backend.yml\` run,
          or a job-name change that stops \`Test Unit (shard\` matching.
          EOF
            echo 'TRACKING_ISSUE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/post-tracking-issue
        with:
          title: 'Unit shard balance check failing'
          labels: 'automation:ci-health,type:ci,prio:low'
          body: ${{ steps.body.outputs.body }}
          pin: 'false'
          gh-token: ${{ github.token }}

  report-stalled:
    name: Open / update tracking issue on an unfinished check
    needs: check-balance
    # The complement of the three settled results, so a result GitHub adds
    # later still lands somewhere rather than falling through both sinks.
    if: >-
      always()
      && github.event_name == 'schedule'
      && needs.check-balance.result != 'success'
      && needs.check-balance.result != 'failure'
      && needs.check-balance.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/report-stalled-issue)
      issues: write     # gh issue create / comment / reopen
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/report-stalled-issue
        with:
          title: 'Unit shard balance check not completing'
          labels: 'automation:ci-health,type:ci,prio:low'
          subject: 'The weekly unit shard balance check'
          not-measured: 'no shard wall-clock was read, so no spread can have drifted'
          guidance: >-
            Check the run's step timings against the check job's 10-minute
            budget; `gh api --paginate` over each candidate run's jobs is the
            part that grows, and a window whose early runs all skipped the
            matrix pays it repeatedly, so a stall there reads the same as a
            hung endpoint.
          result: ${{ needs.check-balance.result }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          gh-token: ${{ github.token }}
