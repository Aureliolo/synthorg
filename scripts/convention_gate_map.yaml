  - id: claude-md::post-implementation-pre-pr-review
    file: CLAUDE.md
    header: Post-Implementation + Pre-PR Review
    exempt:
      reason: |
        Workflow rule enforced by hookify (block-pr-create) and the
        /pre-pr-review + /aurelio-review-pr skills. The dev-time
        prevention lives in .claude/hookify.block-pr-create.md
        rather than scripts/.

  - id: claude-md::push-budget
    file: CLAUDE.md
    header: Push budget
    exempt:
      reason: |
        Runtime property, not a source pattern: how long a push takes
        is only knowable by running it, so no static scan can decide
        it. Enforced at the moment it matters instead --
        scripts/git-hooks/_run-hook.sh times every hook run and emits
        the OVER BUDGET banner past BUDGET_SECONDS, and
        tests/unit/scripts/test_run_hook_wrapper.py pins that the
        banner fires, that a within-budget run stays quiet, and that
        neither the banner nor a failure can consume the other.

  - id: claude-md::module-size-budget
    file: CLAUDE.md
    header: Module-Size Budget
    gate: scripts/check_module_size_budget.py
    # Sibling gates documented in docs/reference/convention-gates.md
    # but not independently mapped here (the inventory tracks one
    # primary gate per MANDATORY paragraph):
    #
    #   scripts/check_no_growth_in_god_modules.py
    #     - operational corollary of the size budget: every file in the
    #       explicit allowlist (now empty; core/enums.py was deleted)
    #       must net-shrink.
    #   scripts/check_no_central_junk_drawer.py
    #     - core/enums.py must not exist (dissolved into feature
    #       directories), and stays deleted.
    #   scripts/check_no_circular_imports.py
    #   scripts/check_module_depth.py
    #   scripts/check_protocol_documented.py
    #   scripts/check_no_module_level_io.py
    #   scripts/check_state_slice_immutability.py
    #   scripts/check_strategy_protocol_injection.py
    #   scripts/check_settings_namespace_complete.py
    #   scripts/check_feature_manifest.py
    #     - every slice-bearing directory under src/synthorg/ carries
    #       a feature.py manifest with FEATURE: FeatureModule.
    #   scripts/check_no_implicit_state_attribute.py
    #     - AppState.__slots__ must stay empty (thin facade); new
    #       application state goes through a feature slice or a
    #       primitive owner object.
    #   scripts/check_feature_index_freshness.py
    #     - data/feature_index.json + data/codebase_map.json are
    #       regenerated from the feature manifests on every commit.

  - id: claude-md::import-layering-architecture-drift
