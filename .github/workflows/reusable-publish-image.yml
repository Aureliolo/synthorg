name: Reusable - Publish Image

# The build definition for every application-image publish (backend, sandbox,
# sidecar, fine-tune), held in a trusted reusable workflow.
#
# See reusable-publish-apko-base.yml for why the indirection exists: it is the
# isolation SLSA Build L3 requires and that a directly-triggered workflow
# cannot provide. Pin a consumer to it with:
#
#   gh attestation verify oci://... -R Aureliolo/synthorg \
#     --signer-workflow Aureliolo/synthorg/.github/workflows/reusable-publish-image.yml

on:
  workflow_call:
    inputs:
      image-name:
        description: Application image to publish (backend, sandbox, sidecar, fine-tune).
        required: true
        type: string
      app-version:
        description: Version the manifest list is tagged with.
        required: true
        type: string
      enable-arm64:
        description: Whether the manifest list carries an arm64 child.
        required: false
        default: true
        type: boolean
      free-disk-space:
        description: >-
          Reclaim runner disk before `docker load`. The fine-tune tarballs
          (~4 GB GPU, ~1.7 GB CPU) double on load and exhaust the runner
          without it.
        required: false
        default: false
        type: boolean
      digest-artifact-name:
        description: >-
          When set, upload the digest under this artifact name. A matrix caller
          cannot expose per-cell outputs (only the last cell wins), so
          `update-release` collects the fine-tune digests as artifacts instead.
        required: false
        default: ""
        type: string
    outputs:
      digest:
        description: Digest of the published manifest list.
        value: ${{ jobs.publish.outputs.digest }}

permissions: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    # Fixed rather than a caller input: a configurable budget nobody sets is a
    # knob that only ever drifts from what the jobs need. The value clears the
    # summed retry ladders of `publish-image-loaded` (~39m) plus the two
    # `download-artifact` ladders this path adds ahead of it and the uv
    # installer's own ladder (240s deadline), so a transient blip that trips
    # several is retried rather than cancelled mid-retry.
    timeout-minutes: 50
    environment: image-push
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      # `github.sha` only, with no pull-request fallback: publishing runs on
      # main and tag refs, never on a PR, and the attested build definition
      # must not be able to resolve to a pull-request head.
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The OpenVEX document this job is about to sign must be the one
      # `.github/vex/triage.yaml` renders to. The pre-push hook and the PR
      # gates both establish that, and neither runs here: this job runs on a
      # push to main, and an administrative merge bypasses required checks.
      # A signature outlives the review that should have preceded it, so on
      # this path the ledger is re-checked before anything is signed.
      #
      # `--no-project` rather than `uv sync`: the gate needs PyYAML and
      # nothing else, and syncing the whole dev graph into an image-publish
      # job would cost minutes to check one file pair.
      - name: Install uv
        uses: ./.github/actions/install-uv

      - name: Verify the VEX ledger matches what is committed
        env:
          # Pinned, not floating. This resolves inside the job that signs
          # images, so an unpinned install would let whatever the index
          # serves at publish time execute there. Held at the version
          # `uv.lock` resolves, so the ledger is parsed by the same library
          # the pre-push and CI gates parse it with.
          # renovate: datasource=pypi depName=pyyaml
          PYYAML_VERSION: "6.0.3"
        run: |
          uv run --no-project --python 3.14 --with "pyyaml==${PYYAML_VERSION}" \
            python scripts/check_vex_triage_sync.py

      # Reclaim headroom before `docker load` doubles the disk usage
      # (archive + daemon copy).
      - name: Free disk space
        if: inputs.free-disk-space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache /usr/share/swift /usr/share/miniconda
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Publish image
        id: publish
        uses: ./.github/actions/publish-image
        with:
          image-name: ${{ inputs.image-name }}
          app-version: ${{ inputs.app-version }}
          enable-arm64: ${{ inputs.enable-arm64 }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write digest to file
        if: inputs.digest-artifact-name != '' && steps.publish.outputs.digest != ''
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          DIGEST_FILE: ${{ inputs.digest-artifact-name }}.digest
        run: printf '%s' "$DIGEST" > "$DIGEST_FILE"

      - name: Upload digest artifact
        if: inputs.digest-artifact-name != '' && steps.publish.outputs.digest != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.digest-artifact-name }}-digest
          path: ${{ inputs.digest-artifact-name }}.digest
          retention-days: 1
