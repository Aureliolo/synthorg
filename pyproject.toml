disallow_any_explicit = false

# Packages without explicit per-package overrides above that nonetheless
# carry small amounts of pre-existing explicit-Any usage. Lifted alongside
# the broader typing PRs.
[[tool.mypy.overrides]]
module = [
    "synthorg._core.*",
    "synthorg.backup.*",
    "synthorg.coordination.*",
    "synthorg.docs_engine.*",
    "synthorg.hr.*",
    "synthorg.infrastructure.*",
    "synthorg.notifications.*",
    "synthorg.organization.*",
]
disallow_any_explicit = false

# Test code carries the residual strict++ exemptions that the original
# tests.* override block lifted. This PR (#2061) narrowed the original
# block by NEWLY ENFORCING ``disallow_any_generics`` across tests/,
# while explicitly typing ~140 test files (foundation helpers, fakes
# hubs, settings, observability, core, config, persistence, scripts,
# monitoring, telemetry, providers, security, budget, plus the bulk of
# the memory/knowledge/communication/hr/integrations/notifications/
# templates/workers/meta/tools tiers) under the full strict++ bar.
#
# Each remaining lifted flag maps to a filed follow-up issue. Drop the
# entry from ``disable_error_code`` (or remove ``disallow_any_explicit
# = false``) when the linked issue closes. Full breakdown lives in
# docs/decisions/0006-tiered-module-size-policy.md Section F.1.
#
# * ``disallow_any_explicit`` (~1,800 sites, blocked on EPIC #2056):
#   #2121
# * ``unused-ignore`` is a holding pen for pre-existing per-line
#   ``# type: ignore[code]`` comments that target a code lifted above;
#   each ratchet-off PR cleans up its own stale ignores.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_any_explicit = false  # #2121
disable_error_code = [
    "unused-ignore",         # holding pen; closes alongside the above
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# deptry: pyproject dependency hygiene
# ---------------------------------------------------------------------------
[tool.deptry]
known_first_party = ["synthorg", "evals"]
extend_exclude = [
    "scripts",
    "site",
    "_audit",
    "docker",
    "docs",
    "evals",
    "tests",
]
package_module_name_map = { "pyjwt" = "jwt", "tree-sitter-language-pack" = "tree_sitter_language_pack" }

[tool.deptry.per_rule_ignores]
# DEP002: declared-but-not-imported. The mismatch is intentional for
# transitive type-stub packages and optional runtime extras.
DEP002 = [
    "types-pyyaml",
    "types-defusedxml",
    "pre-commit-uv",
    "psycopg",
    "psycopg_pool",
    "testcontainers",
    "pdfplumber",
    "tree-sitter",
    "tree-sitter-language-pack",
    "pip-audit",
    "pytest-randomly",
    "polyfactory",
    "pytest-codspeed",
    "pytest-cov",
    "pytest-mock",
    "pytest-repeat",
    "pytest-split",
    "pytest-timeout",
    "pytest-xdist",
    "pytest-asyncio",
    "respx",
    "hypothesis",
    "bandit",
    "commitizen",
    "pre-commit",
    "nats-py",
    "torch",
    "sentence-transformers",
    "logfire",
    "griffe-pydantic",
    "mkdocs-d2-plugin",
    "mkdocs-redirects",
    "mkdocstrings",
    "zensical",
    "defusedxml",
    "sqlglot",
]

# ---------------------------------------------------------------------------
# vulture: dead-code detection
# ---------------------------------------------------------------------------
[tool.vulture]
paths = ["src/synthorg"]
min_confidence = 80
ignore_names = [
    # Protocol method params whose names leak into the public call ABI.
    # An ``_``-prefix rename at the declaration site would force every
    # keyword caller and every implementation to write the underscored
    # form, putting vulture-suppression syntax inside the contract.
    "judge_agent_id",  # JudgeEvaluator.evaluate (conflict_resolution)
    "agent_output",    # ExternalBenchmark.grade (hr/evaluation)
    "ticket_uri",      # TicketFetcher.fetch (knowledge/loaders)
    "im1",             # _StructuralSimilarity.__call__ (tools/browser/_ssim_differ)
    "im2",             # _StructuralSimilarity.__call__ (tools/browser/_ssim_differ)
    "data_range",      # _StructuralSimilarity.__call__ (tools/browser/_ssim_differ)
    # Names referenced only inside ``cast("Name", ...)`` string forms, which
    # vulture cannot see; the TYPE_CHECKING import is genuinely required by mypy.
    "JSONObject",      # aiodocker container-create config (tools/sandbox)
]

# ---------------------------------------------------------------------------
# interrogate: docstring coverage
# ---------------------------------------------------------------------------
[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = false
ignore-private = true
ignore-property-decorators = true
ignore-module = false
ignore-nested-functions = true
ignore-nested-classes = true
ignore-setters = true
ignore-overloaded-functions = true
fail-under = 95
exclude = ["build", "dist", ".venv", "tests", "evals"]
verbose = 0
quiet = false
whitelist-regex = []
ignore-regex = []

# ---------------------------------------------------------------------------
# pyright: IDE type checking only (not used in CI)
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "."]

# ---------------------------------------------------------------------------
# commitizen: conventional commits
# ---------------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.8.9" # x-release-please-version
tag_format = "v$version"

# ---------------------------------------------------------------------------
# pytest: test runner
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
# Explicit per pytest-asyncio 1.4: an unset loop scope emits a
# deprecation warning, and our ``filterwarnings = ["error", ...]``
# promotes it to error. ``"function"`` matches the stated upstream
# future default (per pytest-asyncio 1.4 release notes); pinning it
# explicitly silences the warning and decouples our behaviour from any
# subsequent upstream default change.
asyncio_default_test_loop_scope = "function"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
# Linux default for ``pytest-timeout`` is ``signal`` (SIGALRM). That mode
# only interrupts CPython code between bytecodes, so a test blocked in
# ``asyncio.Event().wait()`` (or any awaitable without a deadline) is
# never killed: the loop is dispatching callbacks, not the test function.
# The xdist worker then sits silent until GHA's job-level timeout reaps
# the whole runner; the failing test is never named. Windows already
# defaults to ``thread``; this line aligns Linux + macOS so a hung await
# raises ``KeyboardInterrupt`` -> ``CancelledError`` and pytest emits a
# proper ``TIMEOUT`` failure with the test node id. ``faulthandler.enable``
# in ``tests/conftest.py`` covers the SEGV / abort signal cases; the
# previously-installed periodic ``dump_traceback_later`` watchdog was
# removed because it races with ``PyThreadState`` teardown and SEGVs
# CPython itself (see the conftest comment for the full reasoning).
timeout_method = "thread"
markers = [
    "unit: Unit tests (fast, isolated, no I/O)",
    "integration: Integration tests (may use I/O, databases, APIs)",
    "e2e: End-to-end tests (full system, slow)",
    "slow: Slow tests (excluded from default runs)",
    "timescaledb: Integration tests that require the TimescaleDB extension (self-hosted Postgres only)",
    "agent_eval: Agent evaluation tests (skipped unless --run-agent-evals, 300s timeout)",
    "benchmark: CodSpeed CPU-instruction performance benchmarks (run only via `pytest --codspeed`; not part of `-m unit` runs)",
    "serial: Tests that legitimately require serial execution (route to a no-xdist suite); do not apply without prior approval",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "--dist=loadfile",
    "-n=8",
    "-p",
    "no:randomly",
    "-p",
    "no:unraisableexception",
    # Runtime type-check calls in the instrumented ``synthorg`` packages against
    # their annotations. Active at WARN across the full ``synthorg`` package.
    # This package list MUST stay identical to the ``install_import_hook`` list
    # in tests/conftest.py (the conftest hook does the real bytecode rewrite;
    # this plugin install is the redundant attempt whose InstrumentationWarning
    # is filtered below). WARN routes the eager-eval NameError class through
    # tests/_typeguard_checker.py; resolved-type mismatches still raise
    # regardless of the policy. ERROR-policy hardening is the remaining
    # follow-up.
    "--typeguard-packages=synthorg",
    "--typeguard-forward-ref-policy=WARN",
]
filterwarnings = [
    "error",
    # typeguard's pytest plugin runs ``install_import_hook`` from
    # ``pytest_configure``, which fires AFTER ``tests/conftest.py`` loads.
    # Our conftest imports ``synthorg.persistence.migrations`` at module
    # body (needed for ``pytest_sessionstart`` to pre-build the migrated_db
    # template), and tests/conftest.py installs the hook EARLY (before that
    # import) so the synthorg modules ARE instrumented. The plugin's later
    # install_import_hook attempt sees synthorg already in sys.modules and
    # emits ``InstrumentationWarning: typeguard cannot check these
    # packages because they are already imported: synthorg`` -- a benign
    # redundancy warning, not a check failure. Without this filter the
    # ``error`` rule above promotes it and pytest exits 2 with zero tests
    # run despite typeguard being live.
    "ignore::typeguard.InstrumentationWarning",
    # ``--typeguard-forward-ref-policy=WARN`` plus the policy-honouring checker
    # (tests/_typeguard_checker.py) SKIP a check and emit a ``TypeHintWarning``
    # when a signature or member type is only importable under
    # ``if TYPE_CHECKING:`` AND cannot be hoisted to a runtime import without an
    # import cycle. Non-cycle TYPE_CHECKING signature imports are HOISTED to
    # module level instead (so the boundary is really checked); only genuine
    # cycle-breakers reach this path. ``default`` (not ``error``, not ``ignore``)
    # keeps the residual skips NON-FATAL but VISIBLE in the pytest warnings
    # summary, so the remaining unchecked surface stays countable. A
    # resolved-type mismatch is a ``TypeCheckError`` (an exception, not a
    # warning), so it still fails regardless of this filter.
    "default::typeguard.TypeHintWarning",
    "ignore:Core Pydantic V1 functionality:UserWarning",
    "ignore:Exception in thread.*_connection_worker_thread:pytest.PytestUnhandledThreadExceptionWarning",
    # nats-py 2.14.0 (the version this repo pins) calls
    # ``asyncio.iscoroutinefunction`` in several places inside
    # ``nats/aio/client.py`` (connect, subscribe, request). Python 3.14
    # deprecated that function and our global ``error`` filter promotes it
    # to an error. The warning persists because we pin the older
    # nats-py==2.14.0 release; upstream main has already replaced the call
    # with ``inspect.iscoroutinefunction``, but no release past 2.14.0
    # ships that fix yet. The project keeps nats-py (not the modular
    # nats-core family) per the dependency decision in issue #2037.
    # Removal owner: issue #2202. Remove this filter after upgrading this
    # repo's pinned nats-py to a release that no longer calls the
    # deprecated asyncio.iscoroutinefunction, or when the codebase
    # migrates off nats-py under the modular-family path.
    # Filter is scoped by message text (unique to asyncio.iscoroutinefunction)
    # because Python's stacklevel-based module attribution varies between
    # the C and Python warning implementations, making module-based
    # filters unreliable across CI environments.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    # Python 3.14 + Windows + xdist: ProactorEventLoop and socket
    # finalizers emit ResourceWarning during xdist worker teardown.
    # These are GC-triggered cleanup warnings, not test failures.
    # The ``unraisableexception`` plugin promotes them to errors
    # which randomly crash xdist workers. Safe to ignore; the
    # underlying resources are cleaned up by the OS on process exit.
    "ignore:unclosed event loop:ResourceWarning",
    "ignore:unclosed.*socket:ResourceWarning",
    # yoyo-migrations 9.0.0 passes ``datetime`` instances directly to
    # ``sqlite3.execute`` when inserting into its ``yoyo_lock`` table.
    # Python 3.12+ deprecated the default datetime adapter (yoyo has no
    # 3.14-aware release yet). Scoped by message text for the same
    # cross-platform-attribution reason as the nats-py filter above.
    "ignore:The default datetime adapter is deprecated:DeprecationWarning",
]

# ---------------------------------------------------------------------------
# coverage: test coverage reporting
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["synthorg"]
# ``branch = true`` combined with ``core = "sysmon"`` triggers a known
# perf regression in coverage.py 7.x: every branch event during module
# collection re-runs ``ast.parse`` via ``coverage/sysmon.py``'s
# ``get_multiline_map`` -> ``coverage/parser.py:parse_source``. With
# pytest assertion rewriting executing in the same workers, the
# combined overhead pushes a single xdist worker's collection past
# 5 minutes and the GHA job timeout reaps the shard with the worker
# stuck slowly walking ``_pytest/assertion/rewrite.py:traverse_node``.
# Primary sources: https://coverage.readthedocs.io/en/latest/config.html
# ("faster for line coverage, but not for branch coverage") and
# coveragepy issue #1812 (sysmon + branch = ~2x slower in real-world
# CI runs). Keep sysmon for the line-coverage speedup; drop branch
# instrumentation -- branch reporting in coverage.xml is a secondary
# concern compared to a unit shard that consistently completes.
branch = false
parallel = true
# sys.monitoring core is meaningfully faster than the default ctrace
# core for LINE coverage in Python 3.14+ (where sysmon is the default
# anyway). Branch coverage is a separate dimension that interacts
# badly with assertion-rewriting pytest workers (see ``branch =`` note
# above); the line-coverage speedup is the win we want here. Set as
# project default so local one-off coverage runs and the CI test arms
# both benefit; CI also exports COVERAGE_CORE=sysmon per job for
# redundancy in case future runs move to an environment where this
# setting is overridden.
core = "sysmon"

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
