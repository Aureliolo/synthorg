template:
  name: "Tech Startup"
  description: >-
    A six-agent team oriented around shipping MVPs quickly. CEO and
    CTO lead directly, with two full-stack developers and a product
    manager iterating in agile sprints, and a completion reviewer
    signing off finished work. Semi-autonomous with hybrid
    communication for fast decision-making.
  version: "1.2.0"
  min_agents: 4
  max_agents: 7
  tags:
    - "startup"
    - "mvp"
    - "small-team"
    - "agile"
    - "iterative"
    - "lean"
  skill_patterns:
    - "tool_wrapper"
    - "generator"
    - "pipeline"
  extends: "solo_founder"
  posture: "autonomous"

  variables:
    - name: "sprint_length"
      description: "Sprint duration in days"
      var_type: "int"
      default: 7
      hidden: true
    - name: "wip_limit"
      description: "Work-in-progress limit per column"
      var_type: "int"
      default: 3
      hidden: true

  company:
    type: "startup"
    budget_monthly: {{ budget | default(500.0) }}
    autonomy:
      level: "semi"

  departments:
    - name: "executive"
      budget_percent: 15
      head_role: "CEO"
      reporting_lines:
        - subordinate: "CTO"
          supervisor: "CEO"
    - name: "engineering"
      budget_percent: 55
      head_role: "CTO"
      reporting_lines:
        - subordinate: "Full-Stack Developer"
          subordinate_id: "fullstack-senior"
          supervisor: "CTO"
        - subordinate: "Full-Stack Developer"
          subordinate_id: "fullstack-mid"
          supervisor: "CTO"
    - name: "product"
      budget_percent: 15
      head_role: "Product Manager"

  agents:
    # Pins the parent's Full-Stack Developer by merge_id so the mid-level one
    # below joins it rather than replacing it. Same values as the parent: what
    # the entry decides is identity, not fields.
    - role: "Full-Stack Developer"
      merge_id: "fullstack-senior"
      model:
        priority: "balanced"
      department: "engineering"
    # New agents
    - role: "CTO"
      model:
        priority: "quality"
        min_context: 100000
        requires_reasoning: true
      department: "executive"
      strategic_output_mode: "advisor"
    - role: "Full-Stack Developer"
      merge_id: "fullstack-mid"
      model:
        priority: "balanced"
      department: "engineering"
    - role: "Product Manager"
      model:
        priority: "speed"
      department: "product"

  workflow: "agile_kanban"
  communication: "hybrid"

  workflow_config:
    kanban:
      wip_limits:
        - column: "in_progress"
          limit: {{ wip_limit | default(3) }}
        - column: "review"
          limit: 2
      enforce_wip: true
    sprint:
      duration_days: {{ sprint_length | default(7) }}

  workflow_handoffs:
    - from_department: "engineering"
      to_department: "product"
      trigger: "Feature implementation completed for product review"
      artifacts:
        - "pull_request"
        - "release_notes"

  escalation_paths:
    - from_department: "engineering"
      to_department: "executive"
      condition: "Technical blocker requiring executive decision"
      priority_boost: 1
    - from_department: "product"
      to_department: "executive"
      condition: "Scope or priority conflict needing CEO resolution"
      priority_boost: 1
