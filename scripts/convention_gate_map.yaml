    # scripts/check_no_api_dto_in_persistence_or_service.py (forbids
    # synthorg.api.dto_* imports in persistence/ and service/). The
    # inventory tracks one primary gate per (file, header); the
    # sibling lives in docs/reference/convention-gates.md alongside
    # the rest of the gate inventory.

