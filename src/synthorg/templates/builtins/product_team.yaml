template:
  name: "Product Studio"
  description: >-
    A product organization where UX research gathers requirements before
    any build begins. Designers, engineers, QA, and a data analyst
    coordinate through structured meetings. Knowledge-heavy: discovery and
    decisions are grounded in the shared knowledge base.
  version: "1.0.0"
  min_agents: 8
  max_agents: 12
  tags:
    - "product"
    - "design-system"
    - "user-research"
    - "cross-functional"
    - "data-driven"
    - "knowledge-heavy"
  skill_patterns:
    - "inversion"
    - "pipeline"
    - "reviewer"
  extends: "startup"
  posture: "knowledge_heavy"

  variables:
    - name: "company_name"
      description: "Name of your company"
      default: "Product Co"
    - name: "budget"
      description: "Monthly budget in the company's configured currency"
      var_type: "float"
      default: 80.0
    - name: "sprint_length"
      description: "Sprint duration in days"
      var_type: "int"
      default: 14
    - name: "wip_limit"
      description: "Work-in-progress limit per column"
      var_type: "int"
      default: 3

  company:
    type: "product_team"
    budget_monthly: {{ budget | default(80.0) }}

  communication: "meeting_based"

  departments:
    # Remove inherited executive department
    - name: "executive"
      _remove: true
    # Override inherited departments
    - name: "product"
      budget_percent: 25
      head_role: "Product Manager"
    - name: "engineering"
      budget_percent: 35
      head_role: "Backend Developer"
      head_merge_id: "backend-senior"
      policies:
        review_requirements:
          min_reviewers: 1
      reporting_lines:
        - subordinate: "Backend Developer"
          subordinate_id: "backend-mid"
          supervisor: "Backend Developer"
          supervisor_id: "backend-senior"
        - subordinate: "Frontend Developer"
          supervisor: "Backend Developer"
          supervisor_id: "backend-senior"
        - subordinate: "Full-Stack Developer"
          supervisor: "Backend Developer"
          supervisor_id: "backend-senior"
    # New departments
    - name: "design"
      budget_percent: 15
      head_role: "UX Designer"
      policies:
        approval_chains:
          - action_type: "design_review"
            approvers:
              - "UX Designer"
      reporting_lines:
        - subordinate: "UX Researcher"
          supervisor: "UX Designer"
    - name: "quality_assurance"
      budget_percent: 15
      head_role: "QA Engineer"
      reporting_lines:
        - subordinate: "Automation Engineer"
          supervisor: "QA Engineer"
    - name: "data_analytics"
      budget_percent: 10
      head_role: "Data Analyst"

  agents:
    # Remove inherited executive agents
    - role: "CEO"
      department: "executive"
      _remove: true
    - role: "CTO"
      department: "executive"
      _remove: true
    # Override first Full-Stack Developer (matched by role+department): change personality
    - role: "Full-Stack Developer"
      level: "senior"
      model:
        priority: "balanced"
        requires_tools: true
      personality_preset: "communication_bridge"
      department: "engineering"
    # Remove second Full-Stack Developer (matched by role+department)
    - role: "Full-Stack Developer"
      department: "engineering"
      _remove: true
    # Product Manager inherited unchanged from startup
    # New agents
    - role: "Backend Developer"
      merge_id: "backend-senior"
      level: "senior"
      model:
        priority: "balanced"
        requires_tools: true
      personality_preset: "pragmatic_builder"
      department: "engineering"
    - role: "Backend Developer"
      merge_id: "backend-mid"
      level: "mid"
      model:
        priority: "cost"
        requires_tools: true
      personality_preset: "team_diplomat"
      department: "engineering"
    - role: "Frontend Developer"
      level: "mid"
      model:
        priority: "cost"
        requires_tools: true
      personality_preset: "creative_innovator"
      department: "engineering"
    - role: "UX Designer"
      level: "mid"
      model:
        priority: "balanced"
      personality_preset: "user_advocate"
      department: "design"
    - role: "UX Researcher"
      level: "mid"
      model:
        priority: "quality"
        requires_reasoning: true
      personality_preset: "methodical_analyst"
      department: "design"
    - role: "QA Engineer"
      level: "mid"
      model:
        priority: "cost"
        requires_tools: true
      personality_preset: "quality_guardian"
      department: "quality_assurance"
    - role: "Automation Engineer"
      level: "mid"
      model:
        priority: "cost"
        requires_tools: true
      personality_preset: "disciplined_executor"
      department: "quality_assurance"
    - role: "Data Analyst"
      level: "mid"
      model:
        priority: "quality"
        requires_tools: true
      personality_preset: "data_driven_optimizer"
      department: "data_analytics"

  workflow_config:
    kanban:
      wip_limits:
        - column: "in_progress"
          limit: {{ wip_limit | default(3) }}
        - column: "review"
          limit: 2
      enforce_wip: true
    sprint:
      ceremony_policy:
        strategy: "hybrid"
        velocity_calculator: "multi_dimensional"
      duration_days: {{ sprint_length | default(14) }}
      ceremonies:
        - name: "sprint_planning"
          protocol: "structured_phases"
          frequency: "bi_weekly"
        - name: "sprint_review"
          protocol: "round_robin"
          frequency: "bi_weekly"
        - name: "retrospective"
          protocol: "position_papers"
          frequency: "bi_weekly"
          duration_tokens: 3000

  workflow_handoffs:
    - from_department: "product"
      to_department: "design"
      trigger: "Product requirements defined and ready for design"
      artifacts:
        - "product_requirements"
        - "user_stories"
    - from_department: "design"
      to_department: "engineering"
      trigger: "Design specifications and mockups approved"
      artifacts:
        - "design_specs"
        - "mockups"
    - from_department: "engineering"
      to_department: "quality_assurance"
      trigger: "Feature implementation ready for testing"
      artifacts:
        - "pull_request"
        - "test_plan"
    - from_department: "quality_assurance"
      to_department: "product"
      trigger: "Testing complete with quality report for product review"
      artifacts:
        - "test_results"
        - "quality_report"
    - from_department: "data_analytics"
      to_department: "product"
      trigger: "Usage data analysis complete with insights"
      artifacts:
        - "analytics_report"
        - "recommendations"

  escalation_paths:
    - from_department: "engineering"
      to_department: "product"
      condition: "Technical constraint affecting product requirements"
      priority_boost: 1
    - from_department: "quality_assurance"
      to_department: "engineering"
      condition: "Critical defect requiring immediate engineering attention"
      priority_boost: 2
    - from_department: "quality_assurance"
      to_department: "product"
      condition: "Quality threshold not met, release decision needed"
      priority_boost: 1
