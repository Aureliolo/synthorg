template:
  name: "Design Team"
  description: >-
    A two-agent design team with a UX Designer creating wireframes,
    prototypes, and visual designs, and a UX Researcher conducting
    user interviews, usability testing, and synthesizing research
    insights to drive design decisions.
  version: "1.1.0"
  min_agents: 2
  max_agents: 2
  tags:
    - "design"
    - "ux"
    - "user-research"
    - "prototyping"

  company:
    type: "custom"
    autonomy:
      level: "semi"

  departments:
    - name: "design"
      budget_percent: 8
      head_role: "UX Designer"
      reporting_lines:
        - subordinate: "UX Researcher"
          supervisor: "UX Designer"

  agents:
    - role: "UX Designer"
      model:
        priority: "balanced"
      department: "design"
    - role: "UX Researcher"
      model:
        priority: "quality"
        requires_reasoning: true
      department: "design"

  workflow: "agile_kanban"
  communication: "hybrid"

  # Visual-asset team: enable the design tools (diagram + asset management).
  design_tools: {}
