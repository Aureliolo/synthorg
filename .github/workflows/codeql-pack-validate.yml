name: CodeQL Pack Validate

on:
  pull_request:
    paths:
      - '.github/codeql/**'
      - '.github/workflows/codeql-pack-validate.yml'
      - 'scripts/check_codeql_fixtures.py'
      - 'scripts/run_codeql_pack_validation.sh'
  push:
    branches: [main]
    paths:
      - '.github/codeql/**'
      - 'scripts/check_codeql_fixtures.py'
      - 'scripts/run_codeql_pack_validation.sh'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-pack-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate sanitiser pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL (provides codeql CLI on PATH)
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Run pack validation
        env:
          CODEQL_RAM: '4096'
        run: bash scripts/run_codeql_pack_validation.sh

      - name: Upload SARIF artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-fixture-sarifs
          path: .github/codeql/fixtures/results/
          retention-days: 7
