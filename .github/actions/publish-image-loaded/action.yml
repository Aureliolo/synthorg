name: Publish container image (already loaded)
description: >-
  Push an image whose per-arch variants are already loaded in the local
  Docker daemon as `ghcr.io/aureliolo/synthorg-${image-name}:sha-<short>-amd64`
  and (optionally) `-arm64`, then assemble the multi-arch manifest list,
  cosign-sign it keyless via GitHub OIDC, attest SLSA Level 3 build
  provenance, emit a CycloneDX SBOM, publish a per-image
  `pushed-tags-<image>.txt` artifact for the workflow-level
  `verify-signatures` job to aggregate, and finally attach the
  vulnerability triage as an OpenVEX attestation when it carries one.

  That order is deliberate: every guarantee this action exists to make is
  in place before the triage is attached, so a Sigstore failure on the
  courtesy cannot cost the image its signature, its provenance, or its
  place in the tag inventory.

  Callers prep the local tags themselves (e.g. `publish-image` downloads
  per-arch scan tarballs and re-tags; the inline web publish flow loads
  an apko-built multi-arch tarball whose internal tags already match
  the expected names). This action then runs the security-critical
  publish path that must be byte-identical across every caller.

  Why digest-pinning: `docker manifest create` re-resolves tag
  references against the registry on every call. When a concurrent
  main-push run overwrites a per-arch tag between two iterations of a
  tag-push run's loop, the manifest lists for different destination
  tags end up with different per-arch digests, and cosign signs only
  the last one, leaving the user-facing version tag unsigned.
  Capturing the per-arch digest immediately after push and referencing
  manifest list members by `@sha256:digest` makes every iteration
  produce byte-identical bytes, immune to concurrent tag mutations.

  Caller responsibilities:
    - `packages: write`, `id-token: write`, `attestations: write`
      permissions on the calling job.
    - Run on a `runs-on: ubuntu-24.04` runner.
    - Have already loaded the per-arch images into the local Docker
      daemon under `ghcr.io/aureliolo/synthorg-${image-name}:sha-<short-sha>-amd64`
      (and `-arm64` when `enable-arm64: "true"`).

inputs:
  image-name:
    description: "Short image name suffix (e.g. backend, sandbox, sidecar, web, fine-tune-gpu, fine-tune-cpu)."
    required: true
  app-version:
    description: "Application version for the `type=raw` tag on stable `v*` releases."
    required: true
  enable-arm64:
    description: >-
      Push the arm64 image alongside amd64. Set "false" for images that
      ship amd64-only (e.g. fine-tune variants).
    required: false
    default: "true"
  ghcr-token:
    description: "GITHUB_TOKEN for GHCR login -- must come from the caller's `secrets.GITHUB_TOKEN`."
    required: true

outputs:
  digest:
    description: "Pushed multi-arch manifest digest (sha256:...) for the sha-<short> tag."
    value: ${{ steps.push.outputs.digest }}
  pushed_tags:
    description: "Newline-separated list of tags pushed in this invocation."
    value: ${{ steps.push.outputs.pushed_tags }}

runs:
  using: composite
  steps:
    # GHCR's token endpoint occasionally exceeds the docker client's
    # default 30s deadline. Drive `docker login` directly through
    # nick-fields/retry so the login is re-attempted on `context
    # deadline exceeded`. Token via env + stdin so it never lands on
    # a command line.
    - name: Log in to GHCR
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        GHCR_TOKEN: ${{ inputs.ghcr-token }}
        GHCR_USER: ${{ github.actor }}
      with:
        timeout_minutes: 2
        max_attempts: 4
        retry_wait_seconds: 15
        command: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}
        # `latest` names the stable channel, so it is withheld from every
        # prerelease shape rather than from the `-dev.N` one this project
        # happens to mint: any dash in a `refs/tags/vX.Y.Z` ref is a semver
        # prerelease component. The siblings below keep the narrower
        # `-dev.` literal because a prerelease reaching them is harmless
        # (`{{major}}.{{minor}}` is withheld from prereleases by the action
        # itself, and the raw version tag equals `{{version}}` there),
        # whereas `latest` moving onto an `-rc.` build is not.
        tags: |
          type=raw,value=${{ inputs.app-version }},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev.') }}
          type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev.') }}
          type=raw,value=dev,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-dev.') }}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          type=sha,prefix=sha-

    # Push the loaded per-arch images to GHCR, capturing each per-arch
    # manifest digest directly from `docker push` stdout (Docker emits
    # `<tag>: digest: sha256:<hex> size: <bytes>` per the docker.io
    # CLI reference). This closes the TOCTOU window that existed when
    # we re-read the tag via `docker buildx imagetools inspect` after
    # push: a parallel workflow run could overwrite our per-arch tag
    # in the registry between push and inspect, making `inspect`
    # return the OTHER run's digest. Parsing the push output gives us
    # the digest of the bytes WE just pushed, regardless of any later
    # tag mutations.
    #
    # The manifest list assembled below references members by
    # `@sha256:...` rather than the mutable per-arch tags. This makes
    # the manifest list bytes byte-identical across every iteration of
    # the loop and immune to concurrent registry mutations.
    #
    # Note: the manifest-list digest below is still read via
    # `docker buildx imagetools inspect` because `docker manifest
    # push` stdout is unreliable across Docker versions: some emit
    # the digest, some only print `Created manifest list`.
    - name: Push per-arch images and assemble manifest list
      id: push
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        ENABLE_ARM64: ${{ inputs.enable-arm64 }}
        META_TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        set -euo pipefail
        REPO="ghcr.io/aureliolo/synthorg-${IMAGE_NAME}"
        SHORT_SHA="${GITHUB_SHA::7}"
        RETRY="${GITHUB_WORKSPACE}/.github/scripts/docker_push_with_retry.sh"

        # Wrap each push in docker_push_with_retry.sh so transient GHCR
        # 5xx responses ("page is taking too long", "unknown blob", TLS
        # reset, etc.) are retried with exponential backoff. The push is
        # idempotent: re-pushing the same content yields the same digest,
        # so a retry never alters the published image. The retry helper
        # also captures combined stdout+stderr so a real GHCR/auth error
        # surfaces in the build log instead of being swallowed by the
        # variable assignment.
        if ! AMD64_PUSH_OUTPUT="$(bash "$RETRY" "docker push ${REPO}:sha-${SHORT_SHA}-amd64" docker push "${REPO}:sha-${SHORT_SHA}-amd64")"; then
          printf '%s\n' "${AMD64_PUSH_OUTPUT}"
          echo "::error::docker push failed for ${REPO}:sha-${SHORT_SHA}-amd64"
          exit 1
        fi
        printf '%s\n' "${AMD64_PUSH_OUTPUT}"
        AMD64_DIGEST="$(printf '%s\n' "${AMD64_PUSH_OUTPUT}" | sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' | tail -n1)"
        if [ -z "$AMD64_DIGEST" ]; then
          echo "::error::Could not parse amd64 digest from docker push output"
          exit 1
        fi

        ARM64_DIGEST=""
        if [ "$ENABLE_ARM64" = "true" ]; then
          if ! ARM64_PUSH_OUTPUT="$(bash "$RETRY" "docker push ${REPO}:sha-${SHORT_SHA}-arm64" docker push "${REPO}:sha-${SHORT_SHA}-arm64")"; then
            printf '%s\n' "${ARM64_PUSH_OUTPUT}"
            echo "::error::docker push failed for ${REPO}:sha-${SHORT_SHA}-arm64"
            exit 1
          fi
          printf '%s\n' "${ARM64_PUSH_OUTPUT}"
          ARM64_DIGEST="$(printf '%s\n' "${ARM64_PUSH_OUTPUT}" | sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' | tail -n1)"
          if [ -z "$ARM64_DIGEST" ]; then
            echo "::error::Could not parse arm64 digest from docker push output"
            exit 1
          fi
        fi

        # Build manifest list once with per-arch digests, push it under
        # every desired tag. Identical bytes -> identical digest for
        # every tag, regardless of what concurrent runs do.
        DIGEST=""
        PUSHED_TAGS=()
        while IFS= read -r full_tag; do
          [ -z "$full_tag" ] && continue
          # metadata-action emits fully-qualified refs (repo:tag); strip
          # the repo prefix so we can reapply it to the per-arch sources.
          t="${full_tag#${REPO}:}"

          # `docker manifest create` re-resolves each `@sha256:` source
          # member against the registry (a GET on the per-arch image
          # manifest), so it hits the same transient GHCR failure surface
          # (`i/o timeout`, 5xx, connection reset) the push and
          # manifest-push calls already retry. Wrap it in the same helper:
          # `--amend` makes re-runs idempotent (the local manifest store
          # is rebuilt from the digest-pinned sources), so a retry never
          # changes the assembled list.
          if [ "$ENABLE_ARM64" = "true" ]; then
            bash "$RETRY" "docker manifest create ${REPO}:${t}" \
              docker manifest create --amend "${REPO}:${t}" \
              "${REPO}@${AMD64_DIGEST}" \
              "${REPO}@${ARM64_DIGEST}"
          else
            bash "$RETRY" "docker manifest create ${REPO}:${t}" \
              docker manifest create --amend "${REPO}:${t}" \
              "${REPO}@${AMD64_DIGEST}"
          fi
          bash "$RETRY" "docker manifest push ${REPO}:${t}" docker manifest push "${REPO}:${t}"
          PUSHED_TAGS+=("${t}")

          # Read the canonical manifest list digest back from the
          # registry. With digest-pinned source members above, every
          # iteration produces the same bytes, so the digest is the
          # same. Capture once on the sha-<short> iteration to keep the
          # output stable.
          #
          # GHCR is eventually consistent on the write path: the tag we
          # just `docker manifest push`ed can 404 ("not found") for a
          # short window before it is readable, so a bare inspect here
          # fails the whole publish (leaving the image unsigned). Retry
          # the read-back with bounded backoff so a read-after-write lag
          # self-heals; the `if [ -z "$DIGEST" ]` guard below still fails
          # loud once the budget is spent. Mirrors the inspect retry in
          # publish-image-retag.
          if [ "$t" = "sha-${SHORT_SHA}" ]; then
            INSPECT_ATTEMPTS=5
            INSPECT_BACKOFF=2
            for ((ia = 1; ia <= INSPECT_ATTEMPTS; ia++)); do
              if DIGEST="$(docker buildx imagetools inspect "${REPO}:${t}" --format '{{.Manifest.Digest}}' 2>/dev/null)" && [ -n "$DIGEST" ]; then
                break
              fi
              DIGEST=""
              if [ "$ia" -lt "$INSPECT_ATTEMPTS" ]; then
                echo "::warning::manifest ${REPO}:${t} not yet readable after push (attempt ${ia}/${INSPECT_ATTEMPTS}); GHCR read-after-write lag, retrying in ${INSPECT_BACKOFF}s"
                sleep "${INSPECT_BACKOFF}"
                INSPECT_BACKOFF=$((INSPECT_BACKOFF * 2))
              fi
            done
          fi
        done <<< "$META_TAGS"

        if [ -z "$DIGEST" ]; then
          echo "::error::metadata-action did not emit a sha-${SHORT_SHA} tag -- cannot compute signing digest"
          exit 1
        fi
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        # Newline-separated list of tags pushed in this step. Consumed
        # by the post-sign verify step below and surfaced as the
        # `pushed_tags` output for the workflow-level inventory.
        # Newline-separated (not space-separated) so the consumer
        # iterates with `while IFS= read -r` and is immune to
        # word-splitting / glob expansion. GitHub Actions multiline
        # output uses the heredoc delimiter syntax.
        {
          printf 'pushed_tags<<__SYNTHORG_TAG_EOF__\n'
          printf '%s\n' "${PUSHED_TAGS[@]}"
          printf '__SYNTHORG_TAG_EOF__\n'
        } >> "$GITHUB_OUTPUT"

    # GitHub releases occasionally 5xx; cosign-installer's internal retry (3
    # attempts in ~7s) is not enough to ride out a longer outage. Wrap the
    # install in two continue-on-error attempts with backoff before the
    # final fail-hard attempt, so a single 10-20s burst of 500s doesn't
    # kill the run. Mirrors the pattern in publish-apko-base.
    - name: Install cosign (attempt 1)
      id: cosign_1
      continue-on-error: true
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Back off before cosign retry 1
      if: steps.cosign_1.outcome == 'failure'
      shell: bash
      run: sleep 15

    - name: Install cosign (attempt 2)
      if: steps.cosign_1.outcome == 'failure'
      id: cosign_2
      continue-on-error: true
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Back off before cosign retry 2
      if: steps.cosign_2.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Install cosign (final attempt)
      if: steps.cosign_2.outcome == 'failure'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    # Wrap the cosign call in cosign_sign_with_retry.sh so a GHCR /
    # Rekor / Fulcio 5xx during signature upload retries on the same
    # budget every docker push already gets via docker_push_with_retry.sh.
    # The helper preserves the `createLogEntryConflict` idempotency
    # branch (already-signed digest -> success) and only retries on
    # the shared transient regex.
    - name: Sign image
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        set -euo pipefail
        if [ -z "$DIGEST" ]; then
          echo "::error::Push step did not produce a digest -- cannot sign image"
          exit 1
        fi
        bash "${GITHUB_WORKSPACE}/.github/scripts/cosign_sign_with_retry.sh" \
          "ghcr.io/aureliolo/synthorg-${IMAGE_NAME}@${DIGEST}"

    # Belt-and-braces: confirm every tag pushed in this step resolves
    # (in the registry, NOW) to the same digest cosign just signed. A
    # mismatch means a concurrent run overwrote one of our tags with a
    # different digest after we signed -- the user will be unable to
    # cosign-verify that tag. Fail the job loudly so the regression is
    # caught at CI time, not in production.
    #
    # The OCI referrer index is queried directly (no cosign verify call)
    # so we depend only on the registry, not on Sigstore reachability
    # at this stage. The full keyless verify happens client-side via
    # the CLI's `synthorg start --verify`/`synthorg update` flow.
    - name: Verify every pushed tag resolves to the signed digest
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        SIGNED_DIGEST: ${{ steps.push.outputs.digest }}
        PUSHED_TAGS: ${{ steps.push.outputs.pushed_tags }}
        GHCR_TOKEN: ${{ inputs.ghcr-token }}
      run: |
        set -euo pipefail
        REPO_PATH="aureliolo/synthorg-${IMAGE_NAME}"
        REPO="ghcr.io/${REPO_PATH}"

        # GHCR requires a bearer token for the v2 API even on public
        # packages; mint a pull-scoped one from the workflow token.
        # `pipefail` will surface a Python KeyError on a malformed
        # response, but defensively check for an empty token too: a
        # silent empty REG_TOKEN would otherwise have us issue every
        # subsequent `curl` with an empty Bearer header.
        # `-L` follows redirects so registry-side rewrites (rare on
        # GHCR but possible in proxy / mirror setups) don't fail.
        # `--connect-timeout`/`--max-time` bound every call: curl has no
        # default deadline, so a silently black-holed connection would
        # otherwise stall the step until the runner's job timeout.
        # --retry rides out a transient GHCR token-endpoint 5xx / reset:
        # this single mint gates the entire post-sign verification step, so
        # one blip here would otherwise fail an already-pushed-and-signed
        # image's verification. --max-time 120 still bounds a black-holed
        # connection across the whole retry budget.
        REG_TOKEN="$(curl -sSL --connect-timeout 5 --max-time 120 \
          --retry 5 --retry-all-errors --retry-connrefused --retry-max-time 100 \
          -u "x-access-token:${GHCR_TOKEN}" \
          "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO_PATH}:pull" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
        if [ -z "${REG_TOKEN}" ]; then
          echo "::error::Failed to mint GHCR pull token for ${REPO_PATH}"
          exit 1
        fi

        # Iterate the newline-separated tag list with `read -r` so
        # tags containing shell metacharacters cannot affect the loop
        # (Docker tags exclude such chars per spec, but no enforcer
        # validates the metadata-action output here).
        FAILED=0
        while IFS= read -r t; do
          [ -z "${t}" ] && continue
          ACTUAL="$(curl -sSL --connect-timeout 5 --max-time 15 -I \
            -H "Authorization: Bearer ${REG_TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${REPO_PATH}/manifests/${t}" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')"
          if [ "${ACTUAL}" != "${SIGNED_DIGEST}" ]; then
            echo "::error::Tag ${t} resolves to ${ACTUAL} but we signed ${SIGNED_DIGEST} -- a concurrent run overwrote the tag after signing"
            FAILED=1
          else
            echo "✓ ${REPO}:${t} -> ${ACTUAL} (signed)"
          fi
        done <<< "${PUSHED_TAGS}"

        # Confirm the signed digest is reachable as an OCI referrer index
        # entry. cosign v3 publishes signatures via the OCI referrer
        # mechanism, surfaced on GHCR as the `sha256-<hex>` referrer tag,
        # with EVENTUAL consistency: a check issued milliseconds after
        # signing can 404 for a short window before the tag becomes
        # queryable (observed: a 404 ~270ms after a successful sign). Poll
        # with bounded backoff (5 attempts, 2s -> 4s -> 8s -> 16s, ~30s
        # budget) so a propagation lag self-heals, while a genuinely-missing
        # signature still fails after the budget -- the gate must not mask a
        # real unsigned image. Validate the digest shape first so a
        # malformed SIGNED_DIGEST cannot build a bogus referrer URL.
        if ! [[ "${SIGNED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::SIGNED_DIGEST is not a valid sha256 digest: '${SIGNED_DIGEST}'"
          exit 1
        fi
        SIG_HEX="${SIGNED_DIGEST#sha256:}"
        SIG_ATTEMPTS=5
        SIG_BACKOFF=2
        SIG_STATUS=000
        for ((s = 1; s <= SIG_ATTEMPTS; s++)); do
          # `|| SIG_STATUS=000` on the ASSIGNMENT (not inside the command
          # substitution) so a curl network failure under `set -e` neither
          # aborts the step nor double-prints the sentinel: curl already
          # emits "000" to stdout on a connection failure, so an in-`$()`
          # `|| echo 000` would capture "000000" and miss the dedicated
          # network-error branch below. The `||` on the assignment suspends
          # `set -e` for the left side and overwrites with a clean "000".
          SIG_STATUS="$(curl -sSL --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${REG_TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${REPO_PATH}/manifests/sha256-${SIG_HEX}")" || SIG_STATUS=000
          [ "${SIG_STATUS}" = "200" ] && break
          if [ "$s" -lt "$SIG_ATTEMPTS" ]; then
            echo "::warning::signature referrer sha256-${SIG_HEX} not yet visible (HTTP ${SIG_STATUS}, attempt ${s}/${SIG_ATTEMPTS}); GHCR propagation lag, retrying in ${SIG_BACKOFF}s"
            sleep "${SIG_BACKOFF}"
            SIG_BACKOFF=$((SIG_BACKOFF * 2))
          fi
        done
        if [ "${SIG_STATUS}" = "000" ]; then
          echo "::error::cosign signature check could not reach GHCR (curl network error, not a registry response) for ${REPO}:sha256-${SIG_HEX} after ${SIG_ATTEMPTS} attempts"
          FAILED=1
        elif [ "${SIG_STATUS}" != "200" ]; then
          echo "::error::cosign signature artifact missing for ${REPO}@${SIGNED_DIGEST} (referrer tag sha256-${SIG_HEX} returned HTTP ${SIG_STATUS} after ${SIG_ATTEMPTS} attempts)"
          FAILED=1
        else
          echo "✓ signature artifact present at ${REPO}:sha256-${SIG_HEX}"
        fi

        if [ "$FAILED" -ne 0 ]; then
          exit 1
        fi

    # Rekor retry ladder (see the cosign-installer ladder above for the
    # full rationale): the attestation writes a Rekor tlog entry against
    # Sigstore's public-good backend, which intermittently times out. Three
    # attempts with backoff before failing hard; attestation is idempotent
    # (push-to-registry re-uploads the same bundle), and the final attempt
    # has no continue-on-error so a terminal error still fails the job.
    #
    # The backoffs (30s, 90s) are also sized to ride out the GitHub
    # attestation API's per-installation secondary rate limit ("Failed to
    # persist attestation: API rate limit exceeded for installation"). The
    # ~nine attestation-bearing publish jobs fan out in parallel and, when two
    # main-push runs overlap, briefly exceed the secondary limit; that limit
    # clears within ~a minute, so a 15s/30s ladder retried too soon to help.
    #
    # NODE_OPTIONS raises node's 16 KB cap on the headers of a single
    # response: `push-to-registry` talks to an OCI registry, and registries
    # have answered with more than that.
    - name: Attest build provenance (SLSA Level 3, attempt 1)
      id: attest_image_1
      continue-on-error: true
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      env:
        NODE_OPTIONS: "--max-http-header-size=32768"
      with: # zizmor: ignore[template-injection]
        subject-name: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

    - name: Back off before image attest retry 1
      if: steps.attest_image_1.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Attest build provenance (SLSA Level 3, attempt 2)
      if: steps.attest_image_1.outcome == 'failure'
      id: attest_image_2
      continue-on-error: true
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      env:
        NODE_OPTIONS: "--max-http-header-size=32768"
      with: # zizmor: ignore[template-injection]
        subject-name: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

    - name: Back off before image attest retry 2
      if: steps.attest_image_2.outcome == 'failure'
      shell: bash
      run: sleep 90

    - name: Attest build provenance (SLSA Level 3, final attempt)
      if: steps.attest_image_2.outcome == 'failure'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      env:
        NODE_OPTIONS: "--max-http-header-size=32768"
      with: # zizmor: ignore[template-injection]
        subject-name: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

    # Emit the canonical (image, tag) inventory as an artifact for the
    # workflow-level `verify-signatures` job to aggregate. Avoids the
    # drift risk of mirroring the metadata-action tag policy in two
    # places.
    #
    # Ordered here, directly after the push and ahead of everything below,
    # for the same reason the VEX triage is ordered last: this inventory is
    # how verify-signatures learns the tags exist at all, so a later step
    # failing must not be able to withhold it. Without it the gate verifies
    # the images it was told about and reports success, while the ones it
    # was never told about are live in GHCR unchecked.
    #
    # `always()` covers a failure between the push and here; the emptiness
    # guard keeps that from writing a contentless artifact, which would
    # satisfy the aggregator's own "did anything publish" check while
    # naming nothing.
    - name: Write pushed-tag inventory
      if: always() && steps.push.outputs.pushed_tags != ''
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        PUSHED_TAGS: ${{ steps.push.outputs.pushed_tags }}
      run: |
        set -euo pipefail
        OUT="pushed-tags-${IMAGE_NAME}.txt"
        : > "$OUT"
        while IFS= read -r t; do
          [ -z "${t}" ] && continue
          printf '%s:%s\n' "${IMAGE_NAME}" "${t}" >> "$OUT"
        done <<< "${PUSHED_TAGS}"
        echo "wrote $(wc -l < "$OUT") tag entries to ${OUT}"

    - name: Upload pushed-tag inventory
      if: always() && steps.push.outputs.pushed_tags != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pushed-tags-${{ inputs.image-name }}
        path: pushed-tags-${{ inputs.image-name }}.txt
        # 7d gives the verify-signatures aggregator headroom for
        # retries / delayed downstream jobs (e.g. update-release on tag
        # pushes). Original 1d cut it close to the workflow lifetime.
        retention-days: 7

    # SBOM generation pulls the image manifest from GHCR and runs syft
    # against it. Call syft directly under nick-fields/retry rather than
    # anchore/sbom-action's own step: `timeout-minutes` is not supported
    # on composite-action steps, so a slow or hung scan would run until
    # the JOB timeout and be cancelled -- a cancellation, not a failure,
    # which skips any retry gated on `outcome == 'failure'`. The retry
    # wrapper gives each attempt a real wall-clock bound so a stuck scan
    # becomes a retryable failure, matching the `docker login` step above.
    # The install is a separate concern with a separate failure mode (an
    # unguarded release fetch from github.com) and carries its own ladder
    # inside the wrapper, which is also where the syft version is pinned.
    - name: Install syft
      id: download_syft
      uses: ./.github/actions/install-syft

    - name: Generate SBOM
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        SYFT_CMD: ${{ steps.download_syft.outputs.cmd }}
        SBOM_IMAGE: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}@${{ steps.push.outputs.digest }}
        SBOM_OUT: sbom-${{ inputs.image-name }}.cdx.json
      with:
        timeout_minutes: 5
        max_attempts: 3
        retry_wait_seconds: 15
        command: |
          "$SYFT_CMD" scan "$SBOM_IMAGE" -o "cyclonedx-json=$SBOM_OUT"

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sbom-${{ inputs.image-name }}
        path: sbom-${{ inputs.image-name }}.cdx.json
        retention-days: 30

    # The vulnerability triage travels with the image. `not_affected`
    # assessments live in `.github/vex/triage.yaml` and render into this
    # OpenVEX document, which is attached as an attestation so that
    # `trivy image --vex oci <image>` shows a consumer the reasoning instead
    # of making them re-triage a finding we already investigated.
    #
    # Last of everything. The signature, the provenance and the tag
    # inventory are what this composite exists to produce; the triage is a
    # courtesy laid on top of them. Ordered any earlier, a Sigstore
    # rejection of the VEX predicate would end the job with the image
    # published and one of those missing, letting the smaller promise veto
    # the larger one.
    #
    # An empty document claims nothing, so publishing one would spend a
    # Sigstore round trip per image to say so.
    #
    # The resolver also refuses a document whose `@id` does not
    # content-address its own statements, which is what a hand edit produces.
    # The pre-push gate and CI both compare the document against the ledger,
    # but neither runs on this job, and a signature outlives the review that
    # should have preceded it.
    - name: Resolve the VEX triage to publish
      id: vex
      shell: bash
      run: |
        set -euo pipefail
        DOC="${GITHUB_WORKSPACE}/.github/vex/synthorg.openvex.json"
        if [ ! -f "$DOC" ]; then
          echo "::error::VEX document not found at ${DOC}"
          exit 1
        fi
        COUNT="$(python3 "${GITHUB_WORKSPACE}/scripts/vex_publication_plan.py" "$DOC")"
        if [ "$COUNT" -gt 0 ]; then
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Publishing ${COUNT} VEX statement(s) with this image"
        else
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "::notice::VEX document carries no statements; nothing to attest"
        fi

    - name: Attest VEX triage
      if: steps.vex.outputs.publish == 'true'
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        set -euo pipefail
        bash "${GITHUB_WORKSPACE}/.github/scripts/cosign_sign_with_retry.sh" attest \
          "ghcr.io/aureliolo/synthorg-${IMAGE_NAME}@${DIGEST}" \
          --type openvex \
          --predicate "${GITHUB_WORKSPACE}/.github/vex/synthorg.openvex.json"

    # A composite `action.yml` is invisible to actionlint (it carries no
    # `jobs:` or `on:` to parse) and no shellcheck hook covers it, so a
    # `run:` block here gets no static checking and nothing can execute it
    # in a test. The poll, its fail-closed exit paths and its identity pins
    # live in a script for that reason, beside the sign helper the same
    # suite already covers.
    - name: Verify the VEX attestation
      if: steps.vex.outputs.publish == 'true'
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        set -euo pipefail
        bash "${GITHUB_WORKSPACE}/.github/scripts/cosign_verify_attestation_with_retry.sh" \
          "ghcr.io/aureliolo/synthorg-${IMAGE_NAME}@${DIGEST}" \
          "${GITHUB_WORKSPACE}/.github/vex/synthorg.openvex.json"
