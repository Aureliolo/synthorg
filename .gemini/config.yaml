have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
  ignore_patterns:
    - "**/*.lock"
    - "uv.lock"
    - "package-lock.json"
    - "pnpm-lock.yaml"
    - "**/*.min.js"
    - "**/*.min.css"
    - "docs/openapi/**"
    - "docs/api/**"
