# Recording matrix for the recursion-depth sweep.
#
# Repetitions exist because per-depth spread is what this matrix is for: the
# first recording ran one per cell, so treatment and tree draw were confounded
# throughout, and a single draw cannot say which of the two moved. That the
# spread is worth paying for is measured rather than assumed. Three cap-1 cells
# on independently planned trees scored 37, 37 and 23 of 42, so a lone cap-1
# draw could have reported anything from strong to middling.
#
# They are concentrated where a cell is cheap, because the bill is almost
# entirely the deep end. Measured per cell on this harness: cap 1 is about an
# hour and 14M tokens, cap 2 about three hours and 45M. Cap 3 and cap 4 are
# roughly two and four times that again, so a third repetition at cap 4 costs
# more than every cap-1 and cap-2 cell in the matrix combined. Two draws at the
# deep end still bracket a cell rather than reporting a point, which is what
# stops one unlucky tree reading as the curve.
#
# ONE arm, and it is the gated one. Gating is not the binding question, the
# replication is, and halving the arms pays for it. It also dissolves the
# paired-tree confound rather than requiring a fix for it: with one arm there is
# no arm comparison left to confound. The gated arm survives because the shipped
# product gates every merge, so this measures the product's own behaviour rather
# than a configuration nobody runs.
#
# Depth 4 is the point. ARIES puts the aggregation blow-up at depth 3 to 4, and
# a sweep stopping at 3 never reaches the depth the literature says breaks.
#
# The pairs are the vendor-agnostic placeholders used throughout this
# repository. A maintainer recording real numbers aliases them to real models in
# provider config, so the committed manifest never names a vendor.
#
# `independence` is checked against the declared FAMILIES at load, never against
# the provider: a manifest claiming cross_family whose pairs name one family, or
# name none at all, is refused, and a manifest whose reviewer and executor are
# the same pair is refused outright. Under same_family every artifact carries the
# caveat on its face. Family is declared rather than derived because an
# aggregating connection serves many families through one endpoint, so the
# provider answers a different question than the one decorrelation asks.
#
# Run `python scripts/record_recursion_depth.py` (the default, no --record) to
# print the matrix and the projected session count before anything is charged.
# Relative to THIS file, not to the repository root: the loader resolves it
# against the manifest's own directory, so the sweep reads the same
# specification whatever directory it was invoked from.
spec_dir: spec/sqlcsv
depths: [1, 2, 3, 4]
repetitions:
  1: 3
  2: 3
  3: 2
  4: 2
arms:
  - gated
# Sampling and reasoning depth are declared PER PAIR, and they have to be:
# the two models this matrix binds do not answer to the same dials, so one
# figure for the matrix is guaranteed wrong for one of them. The reviewer's
# family states that temperature and top_p have NO EFFECT while thinking is on,
# which is its default state, and exposes graded reasoning effort as the dial
# that does work; the executor's answers to temperature and top_p, which is the
# axis the smoke cells sweep. Declaring both fields on both pairs is what lets
# one manifest say that honestly instead of averaging it away.
#
# Every value here is stated rather than left to a default, because each is an
# input to the result: a recording that cannot say what it sampled at cannot
# say what it measured, and a default carries no reason anyone can check.
#
# `temperature` and `top_p` move TOGETHER because a vendor publishes them
# together: applying one without the other produces a distribution nobody
# tested, which is worse than leaving both alone.
executor:
  provider: example-provider
  model_id: example-capable-001
  capability: capable
  family: example-family-a
  # The smoke cells sweep this at three points before the matrix commits to
  # one: the unstated baseline this model would otherwise run at, the vendor's
  # own published figure, and the conservative floor its neighbours publish.
  # The value here is the baseline, so one cell measures the axis from a known
  # end rather than from three untried points.
  temperature: 0.7
  top_p: 1.0
  # PINNED from measurement. Unset is not "no treatment": this family
  # documents that `reasoning_effort` defaults to MAX when the field is
  # absent, and that thinking cannot be disabled at all, so leaving it null
  # opts the model making roughly 80% of the sweep's calls into the most
  # expensive tier available.
  #
  # READ THE PROBE BELOW WITH ITS CAP IN MIND: it says less than it first
  # appears.
  #
  # On a SHORT prompt at an 8192-token cap the tiers separate cleanly. On the
  # real workload they do not: measured on live planning sessions against this
  # same specification, `max` emitted about 81,000 characters of reasoning per
  # exchange and `high` about 105,000. There is no saving there. What the probe
  # actually caught is that at `max` the thinking alone EXCEEDS a small cap, so
  # the reply is all reasoning and carries nothing; at `high` it fits. That is
  # a difference in whether a bounded reply survives, not a discount.
  #
  # So `high` is pinned as a STATED treatment rather than as an economy, and
  # which tier is actually better on this workload is what
  # `scripts/sweep_harness_variants.py` records cells to decide.
  #
  # What that cost, measured against this endpoint on one identical SHORT
  # prompt at an 8192-token output cap:
  #
  #   unset (max)         120.6s   8192 output tokens (THE CAP)   0 chars of content
  #   reasoning_effort=low  21.1s  1556 output tokens             6170 chars
  #   reasoning_effort=high 37.1s  3345 output tokens             8161 chars
  #
  # The unset row is the finding, and the cap is part of reading it honestly:
  # at max the thinking alone exceeded 8192 tokens, so under THAT cap the reply
  # was entirely reasoning and carried no content at all, which in an agentic
  # loop is a turn that emits no tool call and accomplishes nothing. Under this
  # matrix's own 131,072 ceiling the model does get to content eventually; it
  # just spends enormously first. Observed live before it was probed: a
  # contract session's first turn spent 71,405 output tokens on 275,649
  # characters of reasoning and 305 characters of content, and took half an
  # hour to say what it planned to do.
  #
  # So the exposure runs both ways. A generous ceiling buys a very slow, very
  # expensive turn; a tight one buys an empty turn. Bounding the thinking is
  # what removes the choice between them.
  #
  # `high` rather than `low` because the executor plans as well as builds, and
  # it is the cheapest setting that both reasons and reliably emits content;
  # `low` reasoned not at all.
  #
  # This is NOT a claim that max reasons worse, and nothing measured here
  # scored anything. The corpus ran at max and produced this project's two best
  # recordings, and the vendor recommends max for benchmark reproduction. That
  # advice fits a single-shot answer, where more thinking is strictly better
  # because nothing has to fit alongside it. An agentic turn has to leave room
  # to ACT, and there the evidence is direct: every merge attempt in the corpus
  # was cut off at 94-99% of its ceiling, so none of them finished whatever the
  # quality of the thinking that consumed them, and raising
  # `unit_token_ceiling` to 3,000,000 made a cell strictly WORSE, which is what
  # buying more thinking looks like. Whether `high` costs any score is untested,
  # and a cell recorded under it against one recorded at max is what answers it.
  #
  # Two nearby dials were probed and do NOT work here, so neither is an
  # alternative: `think: false` and `chat_template_kwargs.thinking` were both
  # accepted and ignored, returning the unset row's numbers exactly.
  #
  # That this reaches the wire is checked rather than assumed: the reviewer's
  # recorded request body already carries `reasoning_effort` while the
  # executor's carried no such key, and the driver declares the parameter
  # allowed for a model LiteLLM has no entry for, which is the only way it
  # survives a custom endpoint.
  reasoning_effort: high
  # Raised beyond reach for the smoke, then MEASURED and pinned from what the
  # transcripts show a response actually uses. A reasoning model spends this
  # budget on hidden reasoning before it can emit content, so a ceiling sized
  # for a model that answers directly buys sessions that think until truncated
  # and report finished work. That a cap costs nothing unused is measured, and
  # measured once: see the probe recorded on `_RESPONSE_TOKEN_CEILING` in
  # `staffing.py`, which this figure is chosen against.
  # Bounded by the window rather than by taste, on the assumption that the
  # connection an operator aliases this placeholder to carries at least 512K of
  # context, which leaves roughly 380K for the prompt a deep merge needs. The
  # manifest cannot check that (the ids here are placeholders); a smoke cell
  # can, and a context overflow is what it would show.
  max_tokens: 131072
# The declared `family` travels with the placeholder, so the pair a company
# config aliases these to must actually belong to the family named here: the
# cross_family claim below is checked against these strings, and nothing
# downstream re-derives them from the model that answered.
# Declared, not looked up: the capability registry grades a pair from a
# catalogue that knows nothing about a placeholder id, and selection refuses an
# ungraded pair outright, so an undeclared reviewer would leave every review
# unstaffed and the gated arm would record escalations rather than verdicts.
# `family` is declared for the same reason and answers a different question:
# which organisation trained the model, which is what self-preference attaches
# to and what the provider cannot tell you.
reviewer:
  provider: example-provider
  model_id: example-expert-001
  capability: expert
  family: example-family-b
  # Declared, and recorded as INERT. This model's family documents that
  # temperature and top_p "will not trigger an error but will also have no
  # effect" while thinking is on, which is its default state. Written down
  # anyway, at the vendor's own published figures, so the artifact says what
  # was asked rather than leaving a reader to assume nothing was; the smoke
  # cells confirm from the response bodies whether thinking is in fact engaged,
  # and if it is not these stop being inert and become the real dial.
  temperature: 0.6
  top_p: 0.95
  # The dial that DOES work here, stated at the vendor's own default so the
  # depth this pair reasons at is a recorded decision rather than an inherited
  # one, and so a later vendor change to that default cannot move the
  # treatment under a recording that already ran.
  reasoning_effort: high
  # This is the CEILING the connection enforces, not a figure chosen with room
  # to spare, and it is the one value here measured against the endpoint rather
  # than reasoned about: a request above it is refused outright, per model,
  # before anything is generated, so a larger number would fail every review
  # call and record a run with no verdicts at all.
  #
  # That matters beyond the number, because this model reasons at a declared
  # depth and its vendor recommends far more output room at that depth than this
  # grants. Reasoning is spent BEFORE content, so a verdict can be squeezed out
  # entirely, which is a live candidate for the stopped recording's no-verdict
  # failure (this matrix's own evidence, cited in full further down). Through
  # this connection that collision cannot be relieved by raising the ceiling; it
  # is a property of the deployment, and the smoke cells measure how close a
  # real review comes to it.
  max_tokens: 65536
independence: cross_family
# How many attempts one merge gets. Equal across arms by construction, which
# matters whenever a matrix declares more than one: repair only in the gated arm
# would let it win by spending more attempts rather than by catching anything,
# so an ungated arm spends the identical budget blindly.
merge_attempts: 3
# One session between the plan and the first leaf, fixing what the units build
# against: the module layout, the signatures that cross between them, and one
# FAILING test per requirement. Every unit is then recreated from its tree
# rather than from the seed README, so the shared names are already in each
# checkout and nothing has to be handed to anybody.
#
# Off is the recorded corpus and is the control this is measured against. Its
# three cells read 11 of 14, 11 of 12 and 12 of 13 shared modules disagreeing
# on their exports, re-derivable from the kept trees with
# `scripts/report_interface_divergence.py`; one cell recorded WITH the stage
# read 0 of 21. That is not a failure of instruction-following: the seed is a
# README, so a leaf opening its workspace finds no name to import, and
# inventing one is the only move available to it. The leaf brief said so in as
# many words: "the pieces around you are being built at the same time by
# others".
contract_stage: true
# A BASE budget, not a ceiling, and it is the shipped loop's own semantics
# rather than a looseness introduced here: a run that used a tool in the budget
# it just spent earns another budget of the same size, up to
# `engine.max_turn_extensions` times, so the effective cap is this number times
# one plus that allowance. Measuring the product means inheriting that, so the
# bound that actually stops a unit running away is the token ceiling below, and
# it is set with that job in mind. A live run put 52 turns and 1.58M tokens
# into one leaf that delivered nothing.
unit_max_turns: 40
# The planning session's own budget, separate because a planner writes a plan
# and a unit builds software: the two need different amounts of room, and the
# shipped decomposition config refuses anything above 50, so a shared value
# would cap what a unit may have at what a planner is allowed.
planner_max_turns: 40
unit_cost_ceiling: 5.0
# Roughly what `unit_cost_ceiling` buys at mid-tier per-token pricing, so the
# two bounds mean about the same thing wherever both can fire. Where only one
# can, this is the one: a flat-rate connection attributes 0.0 to every call.
#
# Sized so the guard stops only a runaway, never productive work, because a
# ceiling that truncates decides the measurement instead of bounding it. Units
# are largest at the shallowest cap, where no recursion is allowed and one leaf
# carries a whole subsystem: at cap 1 a leaf wrote 51 tests, passed 50 and was
# cut off at 605,581 tokens, so its requirements left both numerator and
# denominator over a budget rather than over the work. Read off that curve,
# "shallow trees lose work" would have been an artefact of this number.
# The cost is bounded and accepted: a dead unit now burns more before it is
# stopped, and this sits just under what the runaway above reached. Truncation
# is the commoner failure by far, and unlike a runaway it is invisible in the
# result: the unit reports its own tests failing, which reads as work that did
# not land rather than work that was cut off.
#
# MEASURED at 3,000,000 and reverted, which is why this number now carries a
# result rather than a rationale. The argument for doubling was a smoke leaf
# that had run 112 turns with only five tests still failing when it was cut,
# read as a leaf converging and being stopped. It was not converging. At
# 3,000,000 a cap-1 cell ran 976 turns against 254, spent 32.5M tokens against
# 6.7M, and delivered ZERO of eight leaves against the same tree's two: 4.3x
# the cost per leaf for a strictly worse outcome, and the held-out oracle read
# 0/42 either way.
#
# The mechanism is that this bounds TOKENS while a leaf spends TURNS: raising
# it does not let a stuck leaf finish, it lets a stuck leaf keep going. Cap 1
# fails structurally rather than budgetarily, because one leaf carries a whole
# subsystem there, so extra room buys thrashing. The recording of that run is
# kept under `results/ceiling-3m/` as the evidence for this paragraph.
unit_token_ceiling: 1500000
# What a leaf gets ON TOP of the base, per specification requirement it is
# answerable for. The base above is where a leaf claiming nothing starts, and
# it is unchanged, so a manifest setting this to 0 reproduces the flat sizing
# the recorded corpus ran under exactly.
#
# Flat was the shipped shape and the corpus says what it cost: 58% of leaves
# terminated on the ceiling rather than on their work, and the per-leaf token
# medians across three cells landed within 6% of each other, which is what
# hitting one wall looks like rather than three trees finishing. A planner is
# free to make one unit answerable for eighteen requirements and another for
# two; handing both the same budget prices the plan's own shape at zero and
# then reads the truncation as the depth effect being measured.
#
# 250,000 is a first-cut estimate, not a measurement, and is deliberately
# smaller than it could be: a claim is one requirement, and the cap-1 leaf that
# wrote 51 tests for a whole subsystem is the case the CAP below covers rather
# than this increment. Correct it once a run under this sizing measures what a
# claim actually costs, the same way `unit_token_ceiling` above carries the
# history of its own revision.
unit_token_per_claim: 250000
# The most one leaf may be sized to. A planner that puts most of the
# specification behind one unit must not be able to mint an unbounded session
# out of its own bad decomposition, and the 3,000,000 experiment recorded above
# is the evidence for keeping this close rather than generous: at that ceiling a
# cap-1 cell spent 4.3x the tokens per leaf for a strictly worse outcome,
# because the bound holds TOKENS while a stuck leaf spends TURNS.
unit_token_cap: 4000000
# The contract session: one per cell, before any leaf opens. It writes no
# behaviour, so it needs less room than a leaf; it declares every module the
# plan named and one failing test per requirement, so it needs more breadth
# than any one of them. Turns matter more than tokens here because the work is
# many small files rather than one hard problem.
contract_max_turns: 60
contract_token_ceiling: 2500000
# A merge must read every child before it can write one line; a leaf reads
# nothing. Sizing both off `unit_token_ceiling` is what starved the recording
# stopped on 2026-08-30: four merges made 167 tool calls between them, all of
# them `shell_command`, and wrote zero files, because reading alone exhausted
# the flat budget before a writing tool was ever loaded.
#
# `merge_token_base` matches `unit_token_ceiling`: an assembly with nothing to
# read still has to write a tree, on the same footing as a leaf. The per-piece
# increment is a first-cut estimate of what one child's tree costs to read,
# not yet a measurement of this matrix's own trees; the cap bounds an unusually
# wide node rather than describing an expected one. Both are meant to be
# corrected once a run under this sizing measures its own per-piece cost, the
# same way `unit_token_ceiling` above carries the history of its own revision.
merge_token_base: 1500000
merge_token_per_piece: 500000
merge_token_cap: 8000000
# Turns are the BASE budget described above `unit_max_turns`, so the same
# looseness applies: the token bounds are what actually stop a runaway.
merge_max_turns_base: 40
merge_max_turns_per_piece: 5
merge_max_turns_cap: 120
# A review reads the same pieces the merge read, plus what the merge produced,
# so its reading burden is the merge's own and the two are sized symmetrically.
# This matrix's own evidence: rep 1's review spent 1,058,678 tokens against the
# old flat 1,500,000 ceiling without reaching a verdict, which is the starved
# reviewer that let a park stand for what should have been an escalation.
review_token_base: 1500000
review_token_per_piece: 500000
review_token_cap: 8000000
# Lower than the merge's own: a review writes a verdict and findings, not an
# assembled tree.
review_max_turns_base: 30
review_max_turns_per_piece: 5
review_max_turns_cap: 100
# Aborts rather than overruns. A depth sweep's session count is a product of
# branching factors the manifest cannot predict, and the cost of being wrong
# about it is spend rather than a wrong answer.
#
# Sized above the full-tree projection below (1,390 for this matrix), which is
# the expensive scenario rather than the expected one. The expected bill from
# the first recording's measured rates is about 1,660, so this survives every
# cap-4 cell costing twice what the shape of a cap-3 tree implies, and it still
# stops a runaway well short of double the matrix.
#
# Both this and expected_sessions_per_cell below were measured while a park
# ended the repair loop the way an approval does. A parked attempt retries
# instead, so a merge that parks repeatedly spends up to its full attempt
# budget rather than one attempt: both figures are a known under-estimate
# until a depth-1 smoke re-measures them.
max_sessions: 2600
# What the plan projection assumes one planning session splits into. Used ONLY
# to print the bill before a run; nothing in the run reads it, and the tree the
# planner actually produces is whatever it produces.
#
# Rounded DOWN from a real cap-3 tree, which held 85 leaves and 25 nodes that
# planned, so it fits a branching of about 4.4. Down rather than to nearest
# because the figure is a FLOOR and it is the input to choosing max_sessions: a
# floor that reads too low kills a paid run part-way, which is exactly what
# happened when the previous projection printed 42 for the whole matrix against
# a real ~158 per cell.
projected_branching: 4
# What ONE cell at each cap is expected to actually cost, which is a different
# question from the projection above and is read by a different consumer. The
# projection is the worst case a ceiling is sized against; these decide whether
# the sweep STARTS a cell, and a cap with a recorded cell is priced from that
# measurement instead of from this.
#
# Declared rather than modelled, because the model above assumes UNIFORM
# branching and these trees do not branch uniformly. The first recording's cap-3
# tree split 7 ways at the root, 4.6 ways at level 1 and 3.5 ways at level 2, so
# the widest factor any cell shows is the root's; raised to the fourth power it
# answered 3,601 sessions for a cap-4 cell whose real cost is near 300. Used as
# a refusal threshold that number stops the deepest cell of every sweep, which
# is the one the whole matrix is paid for.
#
# Caps 1 to 3 are the first recording's worse arm (14, 85, 155) with headroom.
# Cap 4 extends that tree's own shape by one level: level 2's 46 children become
# roughly 49 planning nodes and 116 leaves, which at the measured 3.05 attempts
# per merge is about 312 sessions.
expected_sessions_per_cell:
  1: 30
  2: 130
  3: 220
  4: 450
