# SynthOrg sandbox base image -- Wolfi, composed by apko.
# Produces: ghcr.io/aureliolo/synthorg-sandbox-base
# Consumed by: docker/sandbox/Dockerfile (thin FROM wrapper).
#
# Non-distroless on purpose: keeps busybox + git for agent code execution.
# bash + tmux back a real interactive terminal: the OpenHands inner-loop
# terminal tool (docker/openhands) drives a persistent tmux-managed bash
# session and hard-fails without bash on PATH, and a real bash is a strict
# upgrade over busybox sh for the native loops too.
#
# The node major is pinned to the one the shipped npm declares support for
# (npm 12 accepts ^22.22.2 || ^24.15.0 || >=26.0.0). An unsupported pairing
# is not cosmetic: npm prints its unsupported-engine banner on stderr for
# every invocation, so it lands in every agent's captured stderr and in the
# evidence a reviewer reads. CI asserts the pair stays honest.
# Network enforcement is handled by the sidecar proxy (docker/sidecar/),
# not by the sandbox container.
#
# UID 10001 is the unprivileged sandbox user (cap_drop: ALL). It also joins
# GID 65532, the group the backend runs under, which is how a test runner in
# here opens the sources the backend wrote: two uids keep the confinement, one
# shared group makes the workspace usable. Declared for legibility only, since
# the container adds the gid at creation time (see core/workspace_sharing.py);
# an operator's own devcontainer image therefore needs nothing baked in.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - busybox
    - bash
    - tmux
    - git
    - nodejs-24
    - npm
    - python-3.14

accounts:
  groups:
    - groupname: sandbox
      gid: 10001
    - groupname: workspace
      gid: 65532
      members:
        - sandbox
  users:
    - username: sandbox
      uid: 10001
      gid: 10001
  run-as: "10001"

paths:
  - path: /workspace
    type: directory
    uid: 10001
    gid: 10001
    permissions: 0o755

environment:
  PATH: /usr/sbin:/usr/bin:/sbin:/bin
  PYTHONUNBUFFERED: "1"

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.title: synthorg-sandbox-base
  org.opencontainers.image.description: Wolfi-based apko-composed base for synthorg-sandbox
  org.opencontainers.image.url: https://github.com/Aureliolo/synthorg
  org.opencontainers.image.source: https://github.com/Aureliolo/synthorg
  org.opencontainers.image.licenses: BUSL-1.1
  org.opencontainers.image.vendor: Aureliolo
