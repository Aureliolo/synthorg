# Workspace-graded A/B brief: SIMPLE tier (greenfield from a written spec).
#
# The loop is handed a workspace containing only a README spec and must create
# textkit.py itself. Acceptance is entirely inline: every hidden check imports
# the module and asserts behaviour directly, so a loop cannot pass by editing or
# deleting anything in the workspace. Deleting the README does not help either.
#
# This brief is deliberately one-file and spec-complete. It is the control: if
# the loops differ here, the difference is execution overhead rather than
# problem-solving, because the task itself admits a single obvious solution.
brief_id: loop-ab-simple
schema_version: 1
kind: executable
title: "text helper module"
description: >-
  Read README.md in the working directory and create textkit.py implementing the
  slugify and truncate functions exactly as specified there.
priority: medium
estimated_complexity: 1
workspace:
  seed_dir: seeds/loop-ab-simple
expected_artifacts:
  - kind: file
    path: textkit.py
acceptance_criteria:
  - "textkit.py exists and imports cleanly."
  - "slugify lower-cases, collapses non-alphanumeric runs to single hyphens, and strips edges."
  - "truncate returns short input unchanged and ellipsis-terminates longer input at the limit."
  - "truncate rejects a limit below 1 with ValueError."
limits:
  max_total_cost: 2.0
  max_wall_clock_seconds: 300
  # See loop_ab_bugfix.yaml: the ceiling is set so it never decides an outcome.
  max_turns: 200
checks:
  build:
    - cmd: ["{python}", "-c", "import textkit; assert callable(textkit.slugify) and callable(textkit.truncate)"]
      timeout_seconds: 30
  hidden_tests:
    - cmd: ["{python}", "-c", "import textkit; assert textkit.slugify('Hello World') == 'hello-world'"]
      timeout_seconds: 30
    - cmd: ["{python}", "-c", "import textkit; assert textkit.slugify('  Multiple   Spaces  ') == 'multiple-spaces'"]
      timeout_seconds: 30
    - cmd: ["{python}", "-c", "import textkit; assert textkit.slugify('A!!!B') == 'a-b'"]
      timeout_seconds: 30
    - cmd: ["{python}", "-c", "import textkit; assert textkit.slugify('') == ''"]
      timeout_seconds: 30
    - cmd: ["{python}", "-c", "import textkit; assert textkit.truncate('hello', 10) == 'hello'"]
      timeout_seconds: 30
    - cmd: ["{python}", "-c", "import textkit; assert textkit.truncate('hello world', 8) == 'hello w…'"]
      timeout_seconds: 30
    - cmd: ["{python}", "-c", "import textkit; assert textkit.truncate('abc', 3) == 'abc'"]
      timeout_seconds: 30
  invariants:
    - cmd: ["{python}", "-c", "import textkit\ntry:\n    textkit.truncate('abc', 0)\nexcept ValueError:\n    pass\nelse:\n    raise AssertionError('limit below 1 must raise ValueError')"]
      timeout_seconds: 30
