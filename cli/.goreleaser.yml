version: 2

project_name: synthorg

builds:
  - id: synthorg
    main: ./main.go
    binary: synthorg
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Aureliolo/synthorg/cli/internal/version.Version={{.Version}}
      - -X github.com/Aureliolo/synthorg/cli/internal/version.Commit={{.Commit}}
      - -X github.com/Aureliolo/synthorg/cli/internal/version.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "synthorg_{{ .Os }}_{{ .Arch }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"

# One CycloneDX document per release archive, matching the format every
# container image already publishes so a consumer reads one schema across
# the whole product rather than SPDX here and CycloneDX there.
#
# `scan` is spelled explicitly rather than relying on syft's legacy
# positional form, which GoReleaser's default args still use.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.cdx.json"
    args:
      - scan
      - $artifact
      - --output
      - cyclonedx-json=$document

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  # Skip GoReleaser's release management -- Release Please owns the GitHub
  # Release (created as draft). Assets are uploaded via gh release upload
  # in the workflow, which can find draft releases (unlike GoReleaser's
  # API call which returns 404 for drafts queried by tag).
  disable: true

changelog:
  disable: true
