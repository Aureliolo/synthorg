# Hand-scored calibration anchors for the ``evolution-analysis`` rubric.
#
# Five anchors spanning degraded -> competent improvement_insight.
rubric_id: evolution-analysis
anchor_set_version: 1
items:
  - anchor_id: anchor-misdiagnosed
    output: >-
      The analysis blamed the wrong cause and proposed a change that would not
      touch the recurring failure.
    hand_scores:
      improvement_insight: 0.0
  - anchor_id: anchor-speculative
    output: >-
      The analysis proposed a sweeping speculative rewrite unsupported by the
      failure evidence.
    hand_scores:
      improvement_insight: 0.25
  - anchor_id: anchor-shallow
    output: >-
      The analysis identified the right area but stopped at the symptom and
      proposed only a partial mitigation.
    hand_scores:
      improvement_insight: 0.5
  - anchor_id: anchor-targeted
    output: >-
      The analysis reached the root cause and proposed a targeted change, with
      its expected impact stated a little optimistically.
    hand_scores:
      improvement_insight: 0.75
  - anchor_id: anchor-grounded
    output: >-
      The analysis pinned the root cause to the evidence and proposed a
      targeted, scoped improvement with a realistic expected effect.
    hand_scores:
      improvement_insight: 1.0
