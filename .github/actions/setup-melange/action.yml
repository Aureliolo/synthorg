name: Set up melange
description: Install the melange binary and the runner dependencies its build sandbox needs

inputs:
  version:
    description: "melange version to install (e.g. v1.2.3)"
    required: true

runs:
  using: composite
  steps:
    # melange's default runner builds each apk inside bubblewrap, and the
    # aarch64 leg is emulated on this amd64 runner, so it needs the static
    # qemu binaries. Those two are the whole list: `build-essential`, `git`
    # and `jq` ship on the hosted image already, and asking for them bought
    # nothing while making the transfer, and the window a stalled mirror had
    # to stall in, several times larger.
    #
    # ONE attempt, deliberately, and it is the rule
    # `check_ci_workflow_resilience.py` enforces rather than a local
    # judgement: the per-attempt `timeout` runs as the runner user and this
    # command escalates to root, so the kill never reaches `apt-get`, which
    # survives holding /var/lib/apt/lists/lock. Every later attempt then
    # fails on that lock instead of on the fault that timed the first one
    # out, which is what this step did in CI: three attempts, exit 124 each,
    # 240s spent retrying something no retry could clear. The deadline still
    # bounds it, so a genuinely stalled mirror is killed and reported here
    # with the real cause rather than the wreckage of a previous attempt.
    - name: Install melange runner dependencies
      shell: bash
      env:
        RETRY_CMD_ATTEMPTS: "1"
        RETRY_CMD_ATTEMPT_TIMEOUT: "120"
        RETRY_CMD_DEADLINE: "150"
      run: |
        # apt's acquisition timeout bounds a connection that never answers,
        # not one that answers and then trickles, and there is no
        # minimum-rate option to express the second. That is the fault this
        # step actually hits: a run fetched 11.4 MB of indices at 8 MB/s and
        # then spent every remaining second of its budget on the single
        # 14.7 MB qemu-user-static .deb from the same mirror without
        # finishing it or erroring. Bounding the whole command cannot fix a
        # transfer nothing bounds, and retrying re-enters the same stall.
        #
        # So the large artefact is fetched with curl, which HAS the bound
        # apt lacks: --speed-limit / --speed-time abandon a transfer that
        # falls under 100 kB/s for 20s, and --retry then genuinely gets a
        # fresh connection (to a healthy mirror, since the mirrorlist DNS
        # rotates) rather than resuming the stalled one. The same shape the
        # melange and d2 downloads in this repo already use.
        APT_ACQUIRE_OPTS=(
          -o Acquire::http::Timeout=15
          -o Acquire::https::Timeout=15
          -o Acquire::Retries=3
        )
        .github/scripts/retry_cmd.sh "apt-get update (melange deps)" \
          sudo apt-get "${APT_ACQUIRE_OPTS[@]}" update

        # apt resolves the exact version and URL; curl moves the bytes.
        mkdir -p /tmp/melange-debs
        # Resolution and extraction kept as two plain statements: the first
        # asks apt what it would fetch, the second reduces that to URLs.
        # --print-uris emits `'<url>' <file> <size> <hash>`, quotes included,
        # so the first field is taken and its quotes dropped.
        DEB_LINES=$(apt-get install --reinstall --print-uris -qq -y qemu-user-static bubblewrap)
        mapfile -t DEB_URIS < <(printf '%s\n' "$DEB_LINES" | awk '{print $1}' | tr -d "'")
        if [ "${#DEB_URIS[@]}" -eq 0 ]; then
          echo "::error::apt resolved no download URIs for the melange deps"
          exit 1
        fi
        for uri in "${DEB_URIS[@]}"; do
          curl -fsSL --connect-timeout 30 --max-time 180 \
            --speed-limit 102400 --speed-time 20 \
            --retry 5 --retry-all-errors --retry-max-time 240 \
            "${uri}" -o "/tmp/melange-debs/$(basename "${uri}")"
        done
        # Local files, so this reaches no mirror: it unpacks what curl
        # already has and resolves any residual dependency from the indices
        # the update above refreshed.
        .github/scripts/retry_cmd.sh "dpkg install melange deps" \
          sudo apt-get "${APT_ACQUIRE_OPTS[@]}" install -y \
            /tmp/melange-debs/*.deb
        rm -rf /tmp/melange-debs

    # Ubuntu 24.04 confines unprivileged user namespaces under AppArmor, so
    # `bwrap --unshare-user` dies with "setting up uid map: Permission
    # denied" and melange cannot start its sandbox at all. Grant the
    # `userns` capability to the bwrap profile, then prove the sandbox
    # actually starts -- failing here names the cause, whereas failing
    # later surfaces as an opaque melange runner error mid-build.
    # https://github.com/chainguard-dev/melange/issues/1508
    - name: Permit unprivileged user namespaces for bwrap
      shell: bash
      run: |
        sudo tee /etc/apparmor.d/local-bwrap <<"EOF"
        abi <abi/4.0>,
        include <tunables/global>

        profile local-bwrap /usr/bin/bwrap flags=(unconfined) {
          userns,
          include if exists <local/bwrap>
        }
        EOF
        sudo systemctl reload apparmor
        bwrap --unshare-user --bind / / true
        echo "bubblewrap sandbox verified"

    # Mirrors setup-apko: download to a file with a bounded per-attempt
    # transfer timeout and retry budget, and verify the published checksum
    # before extracting, so a truncated or stalled release-CDN download
    # self-recovers instead of failing the build on a single blip.
    # `--max-time` is what bounds a stalled-but-open connection;
    # `--retry-max-time` alone only caps the retry loop.
    - name: Install melange
      shell: bash
      env:
        MELANGE_VERSION: ${{ inputs.version }}
      run: |
        MELANGE_ARCHIVE="melange_${MELANGE_VERSION#v}_linux_amd64.tar.gz"
        curl -fsSL --connect-timeout 30 --max-time 120 \
          --retry 8 --retry-all-errors --retry-max-time 300 \
          "https://github.com/chainguard-dev/melange/releases/download/${MELANGE_VERSION}/${MELANGE_ARCHIVE}" \
          -o "/tmp/${MELANGE_ARCHIVE}"
        curl -fsSL --connect-timeout 30 --max-time 120 \
          --retry 8 --retry-all-errors --retry-max-time 300 \
          "https://github.com/chainguard-dev/melange/releases/download/${MELANGE_VERSION}/checksums.txt" \
          -o /tmp/melange-checksums.txt
        awk -v f="${MELANGE_ARCHIVE}" '$2==f {print $1"  /tmp/"$2; found=1} END{if(!found) exit 1}' /tmp/melange-checksums.txt | sha256sum -c -
        tar -xzf "/tmp/${MELANGE_ARCHIVE}" -C /tmp
        mv "/tmp/melange_${MELANGE_VERSION#v}_linux_amd64/melange" /usr/local/bin/melange
        rm -rf "/tmp/${MELANGE_ARCHIVE}" /tmp/melange-checksums.txt "/tmp/melange_${MELANGE_VERSION#v}_linux_amd64"
        melange version
