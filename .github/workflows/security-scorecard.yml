name: Security - Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"  # Weekly Monday 4am UTC
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-24.04
    # The OSSF scorecard scan makes many OSSF + GitHub API calls and can
    # run for minutes; 20 gives it room while still reaping a hung API
    # call rather than the 6-hour default.
    timeout-minutes: 20
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      # ossf/scorecard-action enforces a workflow-step allowlist on the job
      # that contains it. The local retry-wrapped checkout composite is not
      # allowlisted, so we must call actions/checkout directly here. SHA
      # matches the one pinned inside .github/actions/checkout (v6.0.2).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif

  report-failure:
    name: Open / update tracking issue on schedule failure
    needs: scorecard
    # Only the schedule path gets the issue sink. Push runs already
    # surface as commit checks on main; workflow_dispatch is visible to
    # the triggerer.
    #
    # `== 'failure'` and not the non-success complement: a cancelled or
    # timed-out scan produced no score, and this title asserts the score
    # regressed. That outcome goes to report-stalled.
    if: >-
      always()
      && github.event_name == 'schedule'
      && needs.scorecard.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/post-tracking-issue)
      issues: write     # gh issue create / comment / pin
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compose body
        id: body
        env:
          RESULT: ${{ needs.scorecard.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo 'body<<TRACKING_ISSUE_BODY_EOF'
            cat <<EOF
          Scheduled OSSF Scorecard scan failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) with result \`$RESULT\`.

          Run: ${RUN_URL}

          Likely cause: scorecard-action upgrade, OSSF endpoint outage,
          or repo-side permissions drift. The push-triggered run on the
          next merge to main will independently re-surface this if the
          underlying issue persists.
          EOF
            echo 'TRACKING_ISSUE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/post-tracking-issue
        with:
          title: 'Scorecard scan regression'
          labels: 'automation:ci-health,type:ci,prio:low'
          body: ${{ steps.body.outputs.body }}
          pin: 'false'
          gh-token: ${{ github.token }}

  report-stalled:
    name: Open / update tracking issue on an unfinished scan
    needs: scorecard
    # The complement of the three settled results, so a result GitHub adds
    # later still lands somewhere rather than falling through both sinks.
    if: >-
      always()
      && github.event_name == 'schedule'
      && needs.scorecard.result != 'success'
      && needs.scorecard.result != 'failure'
      && needs.scorecard.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/report-stalled-issue)
      issues: write     # gh issue create / comment / reopen
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/report-stalled-issue
        with:
          title: 'Scorecard scan not completing'
          labels: 'automation:ci-health,type:ci,prio:low'
          subject: 'The weekly OSSF Scorecard scan'
          not-measured: 'no score was produced, so none can have regressed'
          guidance: >-
            Check the run's step timings against the scan job's 20-minute
            budget; an OSSF endpoint that hangs rather than erroring reads
            the same as a genuine stall from here.
          result: ${{ needs.scorecard.result }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          gh-token: ${{ github.token }}
