name: Setup Python with uv
description: Install uv, Python, and project dependencies

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.14"

runs:
  using: composite
  steps:
    # uv's dependency cache. Replaces astral-sh/setup-uv's bundled cache
    # handling: actions/cache treats a cache-service outage as a non-fatal
    # warning, so a restore/save blip never fails the job. Keyed on uv.lock
    # (the uv project's resolved graph), not the requirements glob setup-uv
    # defaulted to.
    - name: Restore uv cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - uses: ./.github/actions/install-uv

    # Both installs are wrapped in retry_cmd.sh: a cold run (or evicted
    # uv cache) fetches the CPython standalone tarball and every dependency
    # from PyPI / Astral's index, and a transient CDN / index blip on any
    # of those would otherwise fail the step on a single attempt. This is
    # the Python analogue of go-mod-download-retry; both wrapped commands
    # are idempotent, so retry-everything is safe.
    #
    # Each carries a RETRY_CMD_DEADLINE so the ladder always reports its own
    # named failure before the enclosing job's timeout-minutes reaps the
    # runner. Attempts x per-attempt timeout plus backoff is the real worst
    # case, and an unbounded one is how a stalled download becomes an opaque
    # cancelled job with no diagnosis.
    #
    # ``uv python install`` is a quick, bounded fetch, so it also carries a
    # per-attempt timeout that converts a stalled download into a retry.
    # ``uv sync`` keeps none of its own: a cold cross-platform resolve
    # legitimately runs for minutes, and a fixed timeout tight enough to help
    # within the shorter job budgets would risk killing a slow-but-progressing
    # sync. Its deadline supplies the bound instead -- retry_cmd clamps each
    # attempt to the time left, so a hung sync is still killed without
    # capping a healthy one at some guessed constant.
    - name: Install Python
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        RETRY_CMD_ATTEMPT_TIMEOUT: "180"
        RETRY_CMD_DEADLINE: "210"
      run: |
        .github/scripts/retry_cmd.sh "uv python install" \
          uv python install "$PYTHON_VERSION"

    - name: Install dependencies
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        RETRY_CMD_DEADLINE: "240"
      run: |
        .github/scripts/retry_cmd.sh "uv sync --frozen" \
          uv sync --frozen --python "$PYTHON_VERSION"
