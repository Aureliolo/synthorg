version: "2"

run:
  go: "1.26"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - bodyclose
    - errname
    - errorlint
    - noctx
    - prealloc
    - unconvert
    - unparam
    # Structural-complexity checks that catch overgrown functions
    # and deep nested control flow.
    - gocyclo
    - funlen
    - gocognit
    - nestif
    - revive
    # Security scanner for the Docker-orchestrating CLI: subprocess
    # construction, file permissions, path handling, secret marshalling.
    - gosec
    # Every Docker call takes a context, and the orchestrator loops over
    # containers, volumes and images constantly. A context derived inside such
    # a loop accumulates one cancel/timeout layer per iteration, so the
    # deadline the first iteration sees is not the one the last one gets.
    - fatcontext
  settings:
    fatcontext:
      # The bare linter only sees a context reassigned in a loop body. The
      # two checks below reach the shapes this codebase actually writes: a
      # context derived from an outer one inside a range, and one captured by
      # a closure passed to a helper.
      check-loops: true
      check-function-literals: true
    gocyclo:
      min-complexity: 10
    funlen:
      lines: 80
      statements: 60
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: unused-parameter
        - name: unused-receiver
        - name: confusing-naming
        - name: cognitive-complexity
          arguments: [15]
  exclusions:
    # Complexity rules (gocyclo/funlen/gocognit/nestif/revive): table tests
    # and OS-conditional branches in test files are excluded. The signal
    # lives in production code, not in test data enumeration. This matches
    # the industry standard (golangci-lint docs explicitly recommend this
    # set; the same exclusion is shipped by kubernetes, docker, prometheus,
    # hashicorp, etc.). Production code has zero path-scoped complexity
    # exclusions. This exclusion is intended-permanent, not a temporary
    # suppression.
    #
    # gosec on test files: also excluded. Fixtures legitimately embed fake
    # credentials (G101) and use world-readable perms (G301/G304/G306) on
    # throwaway temp files; the production-code security signal is what
    # matters. G103 (unsafe-pointer audit) is excluded only for the Windows
    # disk-free syscall, where unsafe.Pointer is mandated by the Win32 API.
    rules:
      - path: '_test\.go$'
        linters: [gocyclo, funlen, gocognit, nestif, revive, gosec]
      - path: 'internal/diagnostics/disk_windows\.go$'
        linters: [gosec]
        text: 'G103'
      # completion/install.go installs shell completion scripts and rc
      # snippets into the user's own home directory. These are non-secret
      # files at fixed home-relative paths that must be shell-readable
      # (0644 files, 0755 dirs); the perm (G301/G302/G306) and fixed-path
      # read (G304) findings are inherent to that purpose, not a weakness.
      - path: 'internal/completion/install\.go$'
        linters: [gosec]
        text: 'G30[1246]'

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
