# Generated by SynthOrg CLI dev
# Do not edit manually -- run 'synthorg init' to regenerate.
name: synthorg
services:

  data-init:
    image: busybox:<TAG>-musl@sha256:<DIGEST>
    volumes:
      - synthorg-data:/data
    command: ["sh", "-c", "set -e; mkdir -p /data/logs /data/memory /data/tunnel; chown -R 65532:65532 /data"]
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "1.0"
          pids: 64

  backend:
    image: ghcr.io/aureliolo/synthorg-backend@sha256:<DIGEST>
    ports:
      - "3001:3001"
    volumes:
      - synthorg-data:/data
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      SYNTHORG_DB_PATH: "/data/synthorg.db"
      SYNTHORG_IMAGE_TAG: "0.3.0"
      SYNTHORG_MEMORY_DIR: "/data/memory"
      SYNTHORG_PERSISTENCE_BACKEND: "sqlite"
      SYNTHORG_MEMORY_BACKEND: "sqlvector"
      SYNTHORG_BUS_BACKEND: "internal"
      SYNTHORG_TUNNEL_STATE_DIR: "/data/tunnel"
      SYNTHORG_TELEMETRY_ENABLED: "false"
      SYNTHORG_LOG_LEVEL: "info"
      SYNTHORG_LOG_DIR: "${SYNTHORG_LOG_DIR:-/data/logs}"
      SYNTHORG_API_SERVER_HOST: "0.0.0.0"
      SYNTHORG_API_SERVER_PORT: "3001"
      SYNTHORG_API_API_PREFIX: "${SYNTHORG_API_API_PREFIX:-/api/v1}"
      SYNTHORG_API_SSL_CERTFILE: "${SYNTHORG_API_SSL_CERTFILE:-}"
      SYNTHORG_API_SSL_KEYFILE: "${SYNTHORG_API_SSL_KEYFILE:-}"
      SYNTHORG_API_SSL_CA_CERTS: "${SYNTHORG_API_SSL_CA_CERTS:-}"
      SYNTHORG_API_TRUSTED_PROXIES: "${SYNTHORG_API_TRUSTED_PROXIES:-[]}"
      SYNTHORG_API_CORS_ALLOWED_ORIGINS: "${SYNTHORG_API_CORS_ALLOWED_ORIGINS:-[]}"
      SYNTHORG_API_AUTH_EXCLUDE_PATHS: "${SYNTHORG_API_AUTH_EXCLUDE_PATHS:-}"
      SYNTHORG_API_RATE_LIMIT_EXCLUDE_PATHS: "${SYNTHORG_API_RATE_LIMIT_EXCLUDE_PATHS:-}"
      SYNTHORG_API_REQUEST_MAX_BODY_SIZE_BYTES: "${SYNTHORG_API_REQUEST_MAX_BODY_SIZE_BYTES:-10485760}"
      # Timestamp-authority trust anchors for the signed audit chain. Resolved
      # before the settings backend exists, so the deployment is the only place
      # they can be chosen.
      SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_FREETSA: "${SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_FREETSA:-https://freetsa.org/tsr}"
      SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_DIGICERT: "${SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_DIGICERT:-https://timestamp.digicert.com}"
      SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_SECTIGO: "${SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_SECTIGO:-https://timestamp.sectigo.com}"
      # Provider cassettes: recording or replaying is chosen for the whole run,
      # because switching mid-process leaves a half-recorded transcript.
      SYNTHORG_PROVIDERS_CASSETTE_MODE: "${SYNTHORG_PROVIDERS_CASSETTE_MODE:-off}"
      SYNTHORG_PROVIDERS_CASSETTE_PATH: "${SYNTHORG_PROVIDERS_CASSETTE_PATH:-}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
    # The ordered teardown bounds itself to _TOTAL_SHUTDOWN_WINDOW_SECONDS
    # (75s, in api/lifecycle_runner_shutdown.py) and can overrun it by the
    # per-step floor it grants once that window is spent. Without this,
    # Docker's 10s default arrives mid-sequence and the steps that lose are
    # the ones at the end: the audit-chain flush and the persistence
    # disconnect. Move this and that constant together.
    stop_grace_period: 90s
    stop_signal: SIGTERM
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/aureliolo/synthorg-web@sha256:<DIGEST>
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # uid/gid are load-bearing: a tmpfs mounts root-owned by default,
      # which Caddy (running as 65532) cannot write, so it would fall
      # back to read-only mode.
      - /tmp:noexec,nosuid,nodev,size=16m,uid=65532,gid=65532
      - /config/caddy:noexec,nosuid,nodev,size=8m,uid=65532,gid=65532
      - /data/caddy:noexec,nosuid,nodev,size=16m,uid=65532,gid=65532
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: synthorg-net

volumes:
  synthorg-data:
