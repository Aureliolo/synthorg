name: Build and scan container image
description: >-
  Build a Dockerfile-based container image from a signed apko base, scan
  amd64 with Trivy (JSON + SARIF) at CRITICAL + HIGH, upload SARIF to
  GitHub Security, and execute the CIS Docker Benchmark. On non-PR events
  the build emits per-arch docker-archive tarballs (uploaded as artifacts)
  so the companion `publish-image` action can push the *exact scanned
  bytes* instead of rebuilding. Intended to be called from a job whose
  only permissions are `contents: read` + `security-events: write` -- no
  elevated registry perms.

inputs:
  image-name:
    description: >-
      Short image name suffix (e.g. backend, sandbox, sidecar,
      fine-tune-gpu, fine-tune-cpu). Combined with
      `ghcr.io/aureliolo/synthorg-` to form the registry ref and used as
      the suffix for Trivy report filenames and SARIF categories.
    required: true
  display-name:
    description: "Human-readable name for log messages (e.g. 'Backend', 'Fine-Tune (gpu)')."
    required: true
  dockerfile:
    description: "Path to the Dockerfile (relative to repository root)."
    required: true
  context:
    description: "Docker build context path."
    required: false
    default: "."
  app-version:
    description: >-
      Application version from `needs.version.outputs.app_version`. Emitted
      as the `type=raw` tag on stable `v*` releases.
    required: true
  base-image-repo:
    description: >-
      Base image repository (e.g. ghcr.io/aureliolo/synthorg-backend-base).
      Combined with `base-image-digest` (preferred) or `base-image-tag` to
      form the `BASE_IMAGE` build-arg.
    required: true
  base-image-tag:
    description: "Base image tag from `needs.build-X-base.outputs.tag`."
    required: true
  base-image-digest:
    description: >-
      Base image digest from `needs.build-X-base-publish.outputs.digest`.
      Empty on pull-request events (no publish happens). When set, takes
      precedence over `base-image-tag` for the BASE_IMAGE build-arg.
    required: false
    default: ""
  base-image-artifact-name:
    description: >-
      Artifact name for the base tarball. Only consumed on the PR path to
      load the signed apko base without re-pulling from GHCR; callers on
      push/tag events may leave this empty since the base is referenced
      by digest instead.
    required: false
    default: ""
  base-image-tarball-name:
    description: >-
      Tarball filename inside the downloaded artifact. Same PR-path-only
      semantics as `base-image-artifact-name`.
    required: false
    default: ""
  extra-build-args:
    description: >-
      Additional Docker build args, one per line (e.g. DEPLOYMENT_ENV,
      FINE_TUNE_EXTRA). `BASE_IMAGE` is prepended automatically.
    required: false
    default: ""
  enable-arm64:
    description: >-
      Build an arm64 tarball in addition to amd64 on non-PR events. Set
      "false" for images that ship amd64-only (e.g. fine-tune variants
      bundle CUDA wheels / torch with no arm64 coverage).
    required: false
    default: "true"
  cache-scope:
    description: >-
      GHA cache scope suffix. Leave empty for non-matrix jobs. Fine-tune
      passes the variant name so GPU and CPU do not share a cache layer.
    required: false
    default: ""
  free-disk-space:
    description: >-
      Run aggressive disk cleanup before buildx setup. Required for
      fine-tune images (~4 GB GPU + ~1.7 GB CPU variants overflow the
      default `ubuntu-latest` runner). Pass the literal string "true" to
      enable. WARNING: this wipes the entire pre-installed toolchain cache
      (`/opt/hostedtoolcache`, dotnet, swift, miniconda, ghcup, the Android
      SDK, etc.). A caller that sets this MUST NOT rely on any cached
      toolchain (a hostedtoolcache Python/Node/Java, etc.) in a later step
      of the same job; the system `/usr/bin` interpreters survive, the
      cached ones do not.
    required: false
    default: "false"
  trivy-version:
    description: "Trivy version, WITHOUT a leading `v` (e.g. `0.70.0`). The release download URL adds the `v` prefix; the tarball filename does not."
    required: true
  github-token:
    description: >-
      GITHUB_TOKEN for the artifact REST API, from the caller's
      `secrets.GITHUB_TOKEN`, which must also grant `actions: read`. Both are
      needed so a re-run can reach the base tarball an earlier attempt
      uploaded; the full reasoning and its security trade-off are in the header
      comment of `.github/workflows/docker.yml`.
    required: true

outputs:
  ref_amd64:
    description: |
      Local docker image reference for the amd64 build (loaded into the
      runner's Docker daemon). On PR events: `ghcr.io/<owner>/synthorg-<image-name>:sha-<short-sha>`.
      On non-PR events: `ghcr.io/<owner>/synthorg-<image-name>:scan-<full-sha>-amd64`.
      Used by smoke-test composite actions that need to `docker run`
      the just-built image.
    value: ${{ steps.scan-ref.outputs.ref_amd64 }}
  ref_arm64:
    description: |
      Local docker image reference for the arm64 build. Same naming
      convention as ref_amd64 with `-arm64` suffix.

      Emitted as an empty string when no arm64 tarball was produced.
      Two cases produce empty:
        - PR events (arm64 is non-PR-only -- PR builds are always
          single-arch amd64).
        - Non-PR events when `enable-arm64="false"` (fine-tune
          variants set this because torch / CUDA wheels have no arm64
          coverage).

      Callers that consume this output MUST check for empty before
      using it -- otherwise they will operate on a tag pointing at a
      tarball that was never built.
    value: ${{ steps.scan-ref.outputs.ref_arm64 }}

runs:
  using: composite
  steps:
    # Fine-tune GPU image is ~4 GB (torch + CUDA wheels). The GHA
    # ubuntu-latest runner ships with ~14 GB free on /, which is not
    # enough headroom for buildx to assemble the layer tar + load it
    # into the daemon + run Trivy. Remove pre-installed toolchains we
    # do not use to reclaim ~25 GB.
    - name: Free disk space
      if: inputs.free-disk-space == 'true'
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo rm -rf /opt/hostedtoolcache /usr/share/swift /usr/share/miniconda
        sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
        sudo rm -rf /usr/local/lib/node_modules /usr/local/.ghcup
        sudo docker image prune --all --force
        df -h /

    # Digest-pinned so a reconnect cannot silently change which binfmt runs.
    - name: Pull binfmt image (ARM64 emulation)
      if: github.event_name != 'pull_request' && inputs.enable-arm64 == 'true'
      uses: ./.github/actions/docker-pull-resilient
      with:
        # renovate: datasource=docker depName=tonistiigi/binfmt
        image: tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6
        local-tag: synthorg-binfmt:qemu-v9.2.2

    # `docker/setup-qemu-action` always pulls its `image:` input, so it cannot
    # consume the local tag above. `--install` is what it shells out to.
    - name: Register binfmt handlers (ARM64 emulation)
      if: github.event_name != 'pull_request' && inputs.enable-arm64 == 'true'
      shell: bash
      env:
        BINFMT_IMAGE: synthorg-binfmt:qemu-v9.2.2
      run: |
        set -euo pipefail
        docker run --rm --privileged "${BINFMT_IMAGE}" --install arm64
        # `--install` exits 0 even when the kernel registered nothing, and a
        # registered handler can still be disabled, which surfaces much later
        # as an exec-format error inside an arm64 RUN. The entry's first line
        # is literally `enabled` or `disabled`, so assert on that, not on the
        # file merely existing.
        handler=/proc/sys/fs/binfmt_misc/qemu-aarch64
        if [[ ! -e "${handler}" ]] || ! grep -qx enabled "${handler}"; then
          echo "::error::binfmt qemu-aarch64 handler missing or disabled after --install arm64"
          exit 1
        fi

    # The `docker-container` driver boots BuildKit by pulling moby/buildkit
    # from Docker Hub, and setup-buildx-action does not retry that pull: a
    # sub-minute registry timeout fails the whole build job before the
    # Dockerfile is even read. Pre-pull through the retry-and-mirror ladder
    # and point the driver at the resulting local tag so the boot never
    # reaches Docker Hub itself. The `docker` driver used on PRs boots no
    # BuildKit container, so it needs neither the pull nor the driver-opt.
    - name: Pull BuildKit image
      if: github.event_name != 'pull_request'
      uses: ./.github/actions/docker-pull-resilient
      with:
        # renovate: datasource=docker depName=moby/buildkit
        image: moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
        local-tag: synthorg-buildkit:buildx-stable-1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      with:
        # `docker` driver is required for `load: true` on PR builds so
        # Trivy can scan a locally loaded image; `docker-container`
        # enables `type=gha` layer cache + `type=docker` archive output
        # for the tarball handoff on non-PR builds.
        driver: ${{ github.event_name == 'pull_request' && 'docker' || 'docker-container' }}
        # Condition is inverted relative to `driver` above so the non-empty
        # value sits on the truthy branch: `A && '' || B` would always yield
        # B, since `''` is falsy and GHA falls through to the `||` arm.
        driver-opts: ${{ github.event_name != 'pull_request' && 'image=synthorg-buildkit:buildx-stable-1' || '' }}
        # BuildKit resolves the `# syntax=` frontend and every `FROM` itself,
        # outside the `docker pull` the ladder wraps. This covers only the
        # docker.io refs (the frontend and the builder-stage bases); the
        # GHCR-hosted `BASE_IMAGE` final stage never touches it. Digest pins
        # on both keep either path safe. Ignored by the `docker` driver PR
        # builds use.
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
        cache-binary: false

    - name: Download base image artifact (PR only)
      if: github.event_name == 'pull_request'
      uses: ./.github/actions/download-artifact
      with:
        name: ${{ inputs.base-image-artifact-name }}
        path: /tmp
        github-token: ${{ inputs.github-token }}

    - name: Load base image (PR only)
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        BASE_IMAGE_REPO: ${{ inputs.base-image-repo }}
        BASE_TAG: ${{ inputs.base-image-tag }}
        BASE_TARBALL: ${{ inputs.base-image-tarball-name }}
      run: |
        docker load -i "/tmp/${BASE_TARBALL}"
        docker tag "${BASE_IMAGE_REPO}:${BASE_TAG}-amd64" "${BASE_IMAGE_REPO}:${BASE_TAG}"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}
        tags: |
          type=raw,value=${{ inputs.app-version }},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev.') }}
          type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev.') }}
          type=raw,value=dev,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-dev.') }}
          type=sha,prefix=sha-

    # PR path: buildx `driver: docker` + `load: true` produces a single
    # amd64 image in the local daemon for scanning. No tarball is
    # persisted -- PR builds never feed the publish-image action.
    - name: Build image (PR, loaded for scan)
      id: build-pr
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: false
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BASE_IMAGE=${{ inputs.base-image-digest != '' && format('{0}@{1}', inputs.base-image-repo, inputs.base-image-digest) || format('{0}:{1}', inputs.base-image-repo, inputs.base-image-tag) }}
          ${{ inputs.extra-build-args }}
        platforms: linux/amd64

    # Non-PR path: build each arch to its own docker-archive tarball so
    # the publish-image action can push the exact scanned bytes instead
    # of rebuilding. `outputs: type=docker,dest=...` is single-platform
    # (docker-archive format requires one manifest), so we emit two
    # tarballs and reassemble the multi-arch manifest at push time.
    - name: Build amd64 tarball (non-PR)
      id: build-amd64
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        outputs: type=docker,dest=/tmp/scan-image-${{ inputs.image-name }}-amd64.tar
        tags: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}:scan-${{ github.sha }}-amd64
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BASE_IMAGE=${{ inputs.base-image-digest != '' && format('{0}@{1}', inputs.base-image-repo, inputs.base-image-digest) || format('{0}:{1}', inputs.base-image-repo, inputs.base-image-tag) }}
          ${{ inputs.extra-build-args }}
        cache-from: ${{ inputs.cache-scope != '' && format('type=gha,scope={0}-amd64', inputs.cache-scope) || 'type=gha,scope=amd64' }}
        cache-to: ${{ inputs.cache-scope != '' && format('type=gha,mode=max,scope={0}-amd64', inputs.cache-scope) || 'type=gha,mode=max,scope=amd64' }}
        platforms: linux/amd64

    # `!cancelled()` rather than the implicit success chain: this load is what
    # the amd64 gate keys off, so it has to be reached even when a sibling
    # arch already failed. Its own build is still required, or the load would
    # report a missing tarball instead of the build error that caused it.
    - name: Load amd64 image for scanning (non-PR)
      id: load-amd64
      if: ${{ !cancelled() && steps.build-amd64.outcome == 'success' }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        docker load -i "/tmp/scan-image-${IMAGE_NAME}-amd64.tar"

    - name: Build arm64 tarball (non-PR, multi-arch)
      id: build-arm64
      if: github.event_name != 'pull_request' && inputs.enable-arm64 == 'true'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        outputs: type=docker,dest=/tmp/scan-image-${{ inputs.image-name }}-arm64.tar
        tags: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}:scan-${{ github.sha }}-arm64
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BASE_IMAGE=${{ inputs.base-image-digest != '' && format('{0}@{1}', inputs.base-image-repo, inputs.base-image-digest) || format('{0}:{1}', inputs.base-image-repo, inputs.base-image-tag) }}
          ${{ inputs.extra-build-args }}
        cache-from: ${{ inputs.cache-scope != '' && format('type=gha,scope={0}-arm64', inputs.cache-scope) || 'type=gha,scope=arm64' }}
        cache-to: ${{ inputs.cache-scope != '' && format('type=gha,mode=max,scope={0}-arm64', inputs.cache-scope) || 'type=gha,mode=max,scope=arm64' }}
        platforms: linux/arm64

    # arm64 scans run under QEMU emulation (set up at the top of this
    # action). Both architectures go through the same Trivy + CIS gate
    # before publish-image pushes them, so neither arch ships unscanned.
    - name: Load arm64 image for scanning (non-PR, multi-arch)
      id: load-arm64
      if: ${{ !cancelled() && steps.build-arm64.outcome == 'success' }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        docker load -i "/tmp/scan-image-${IMAGE_NAME}-arm64.tar"

    # Scan ref. PR path = single amd64 image built via `load: true`.
    # Non-PR path = two tarball-loaded refs (amd64 always; arm64 when
    # enable-arm64). Each arch is scanned independently so the published
    # multi-arch manifest never includes bytes that bypassed the gate.
    - name: Compute scan image refs
      id: scan-ref
      # Reads only inputs and github.sha, so it must not inherit a load
      # failure: the per-arch gates below need these refs to decide anything.
      if: ${{ !cancelled() }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        EVENT_NAME: ${{ github.event_name }}
        ENABLE_ARM64: ${{ inputs.enable-arm64 }}
      run: |
        SHORT_SHA="${GITHUB_SHA::7}"
        if [ "$EVENT_NAME" = "pull_request" ]; then
          # PR path is always single-arch amd64. arm64 ref is empty so
          # downstream callers cannot accidentally consume it.
          echo "ref_amd64=ghcr.io/aureliolo/synthorg-${IMAGE_NAME}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "ref_arm64=" >> "$GITHUB_OUTPUT"
        else
          echo "ref_amd64=ghcr.io/aureliolo/synthorg-${IMAGE_NAME}:scan-${GITHUB_SHA}-amd64" >> "$GITHUB_OUTPUT"
          # arm64 ref is gated on enable-arm64 -- fine-tune images set
          # this to "false" because torch / CUDA wheels have no arm64
          # coverage. Emitting a non-empty ref_arm64 when no arm64
          # tarball was actually built would let downstream callers
          # (e.g. smoke-test-backend-image) docker-run an image that
          # does not exist on the runner. Always emit empty when arm64
          # was skipped.
          if [ "$ENABLE_ARM64" = "true" ]; then
            echo "ref_arm64=ghcr.io/aureliolo/synthorg-${IMAGE_NAME}:scan-${GITHUB_SHA}-arm64" >> "$GITHUB_OUTPUT"
          else
            echo "ref_arm64=" >> "$GITHUB_OUTPUT"
          fi
        fi

    - name: Report image size (amd64)
      shell: bash
      env:
        SCAN_REF: ${{ steps.scan-ref.outputs.ref_amd64 }}
        DISPLAY_NAME: ${{ inputs.display-name }}
      run: scripts/report-image-size.sh "$SCAN_REF" "$DISPLAY_NAME"

    - name: Report image size (arm64)
      if: github.event_name != 'pull_request' && inputs.enable-arm64 == 'true'
      shell: bash
      env:
        SCAN_REF: ${{ steps.scan-ref.outputs.ref_arm64 }}
        DISPLAY_NAME: ${{ inputs.display-name }}
      run: scripts/report-image-size.sh "$SCAN_REF" "$DISPLAY_NAME (arm64)"

    # `trivy image <ref>` re-exports the whole image from the Docker daemon
    # to a docker-archive under its temp dir before analysing layers. For the
    # fine-tune GPU image (~4 GB compressed, far larger uncompressed) that
    # export is a third full copy alongside the build tarball and the loaded
    # daemon image, overflowing the runner's ~14 GB root volume with
    # `no space left on device`. The `/mnt` resource disk has ~70 GB free, so
    # point Trivy's scratch (export temp via TMPDIR + vuln-db cache via
    # TRIVY_CACHE_DIR) there. Created unconditionally so every image scans the
    # same way, not just the disk-pressured fine-tune variants.
    # Both setup steps carry `!cancelled()` for the same reason the loads do:
    # left on the default success chain they are skipped by any earlier
    # failure, and a per-arch gate that legitimately passes then runs Trivy
    # that was never installed, burying the real error under `command not
    # found`. Every consumer below additionally requires the install itself.
    - name: Provision Trivy scratch on /mnt
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        sudo mkdir -p /mnt/trivy-tmp /mnt/trivy-cache
        sudo chown "$(id -u):$(id -g)" /mnt/trivy-tmp /mnt/trivy-cache
        df -h /mnt /

    - name: Install Trivy
      id: install-trivy
      if: ${{ !cancelled() }}
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy-version }}
      run: |
        curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o "/tmp/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy_checksums.txt
        (cd /tmp && grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy_checksums.txt | sha256sum -c -)
        tar -xzf "/tmp/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -C /tmp trivy
        sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

    # Trivy JSON + SARIF + CIS benchmark per arch. JSON feeds
    # evaluate-scan.sh (fails on CRITICAL, warns on HIGH). SARIF goes to
    # GitHub Security for both arches with distinct categories.
    #
    # Each arch's scan and gate keys off the step that produced ITS image,
    # never the implicit success chain, so one arch cannot silently cost the
    # other its vulnerability gate: an arm64 load failure would otherwise skip
    # the amd64 gate for a healthy amd64 image, and an amd64 CRITICAL would
    # skip the arm64 gate entirely. Keying off `scan-ref` would not achieve
    # that either, since it runs after both loads and so inherits either
    # failure.
    - name: Trivy scan (amd64)
      if: ${{ !cancelled() && steps.install-trivy.outcome == 'success' && (steps.build-pr.outcome == 'success' || steps.load-amd64.outcome == 'success') }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        SCAN_REF: ${{ steps.scan-ref.outputs.ref_amd64 }}
        TMPDIR: /mnt/trivy-tmp
        TRIVY_CACHE_DIR: /mnt/trivy-cache
      run: |
        trivy image "${SCAN_REF}" --format json --output "trivy-${IMAGE_NAME}-amd64.json" \
          --exit-code 0 --severity CRITICAL,HIGH --ignorefile .github/.trivyignore.yaml

    - name: Evaluate Trivy results (amd64)
      if: ${{ !cancelled() && steps.install-trivy.outcome == 'success' && (steps.build-pr.outcome == 'success' || steps.load-amd64.outcome == 'success') }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        DISPLAY_NAME: ${{ inputs.display-name }}
      run: scripts/evaluate-scan.sh --verbose "trivy-${IMAGE_NAME}-amd64.json" "$DISPLAY_NAME"

    - name: Trivy scan (arm64)
      if: ${{ !cancelled() && steps.install-trivy.outcome == 'success' && steps.load-arm64.outcome == 'success' }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        SCAN_REF: ${{ steps.scan-ref.outputs.ref_arm64 }}
        TMPDIR: /mnt/trivy-tmp
        TRIVY_CACHE_DIR: /mnt/trivy-cache
      run: |
        trivy image "${SCAN_REF}" --format json --output "trivy-${IMAGE_NAME}-arm64.json" \
          --exit-code 0 --severity CRITICAL,HIGH --ignorefile .github/.trivyignore.yaml

    - name: Evaluate Trivy results (arm64)
      if: ${{ !cancelled() && steps.install-trivy.outcome == 'success' && steps.load-arm64.outcome == 'success' }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        DISPLAY_NAME: ${{ inputs.display-name }}
      run: scripts/evaluate-scan.sh --verbose "trivy-${IMAGE_NAME}-arm64.json" "$DISPLAY_NAME (arm64)"

    - name: Upload Trivy reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: trivy-${{ inputs.image-name }}-report
        path: trivy-${{ inputs.image-name }}-*.json
        retention-days: 30
        if-no-files-found: ignore

    # Not `always()`: after a failed build Trivy is never installed and there
    # is nothing to scan, so the `command not found` lands BELOW the real
    # error and masks it.
    - name: Trivy SARIF scan (amd64)
      if: ${{ !cancelled() && steps.install-trivy.outcome == 'success' && (steps.build-pr.outcome == 'success' || steps.load-amd64.outcome == 'success') }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        SCAN_REF: ${{ steps.scan-ref.outputs.ref_amd64 }}
        TMPDIR: /mnt/trivy-tmp
        TRIVY_CACHE_DIR: /mnt/trivy-cache
      run: |
        trivy image "${SCAN_REF}" --format sarif --output "trivy-${IMAGE_NAME}-amd64.sarif" \
          --exit-code 0 --severity CRITICAL,HIGH --ignorefile .github/.trivyignore.yaml

    - name: Upload SARIF amd64 to GitHub Security
      if: ${{ !cancelled() && steps.install-trivy.outcome == 'success' && (steps.build-pr.outcome == 'success' || steps.load-amd64.outcome == 'success') }}
      # Cosmetic Security-tab upload, NOT a required check, and the real
      # vulnerability gate is the separate `Evaluate Trivy results` step
      # above (which stays loud). A transient code-scanning API 401/5xx must
      # not fail the image build/publish; the SARIF re-uploads next run.
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
      with:
        sarif_file: trivy-${{ inputs.image-name }}-amd64.sarif
        category: trivy-${{ inputs.image-name }}-amd64

    - name: Trivy SARIF scan (arm64)
      if: ${{ !cancelled() && steps.install-trivy.outcome == 'success' && steps.load-arm64.outcome == 'success' }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        SCAN_REF: ${{ steps.scan-ref.outputs.ref_arm64 }}
        TMPDIR: /mnt/trivy-tmp
        TRIVY_CACHE_DIR: /mnt/trivy-cache
      run: |
        trivy image "${SCAN_REF}" --format sarif --output "trivy-${IMAGE_NAME}-arm64.sarif" \
          --exit-code 0 --severity CRITICAL,HIGH --ignorefile .github/.trivyignore.yaml

    - name: Upload SARIF arm64 to GitHub Security
      if: ${{ !cancelled() && steps.install-trivy.outcome == 'success' && steps.load-arm64.outcome == 'success' }}
      # See the amd64 upload above: cosmetic, non-gating, re-uploads next run.
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
      with:
        sarif_file: trivy-${{ inputs.image-name }}-arm64.sarif
        category: trivy-${{ inputs.image-name }}-arm64

    # No Trivy dependency here: cis-scan is a separate tool, so gating it on
    # the Trivy install would couple two independent checks.
    - name: CIS Docker Benchmark (amd64)
      if: ${{ !cancelled() && (steps.build-pr.outcome == 'success' || steps.load-amd64.outcome == 'success') }}
      uses: ./.github/actions/cis-scan
      with:
        image-ref: ${{ steps.scan-ref.outputs.ref_amd64 }}

    - name: CIS Docker Benchmark (arm64)
      if: ${{ !cancelled() && steps.load-arm64.outcome == 'success' }}
      uses: ./.github/actions/cis-scan
      with:
        image-ref: ${{ steps.scan-ref.outputs.ref_arm64 }}

    # Hand off the scanned tarballs to the publish-only job. The publish
    # job docker-loads these exact bytes and re-tags + pushes them
    # without rebuilding, guaranteeing the pushed digest covers the
    # same filesystem Trivy + CIS scanned.
    # 7-day retention covers approval delays on the environment-gated
    # publish-image jobs: 1-day would expire the tarball before a
    # deferred `image-push` approval lands, breaking the publish chain.
    - name: Upload amd64 image tarball (non-PR)
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: scan-image-${{ inputs.image-name }}-amd64
        path: /tmp/scan-image-${{ inputs.image-name }}-amd64.tar
        retention-days: 7

    - name: Upload arm64 image tarball (non-PR, multi-arch)
      if: github.event_name != 'pull_request' && inputs.enable-arm64 == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: scan-image-${{ inputs.image-name }}-arm64
        path: /tmp/scan-image-${{ inputs.image-name }}-arm64.tar
        retention-days: 7
