name: Release - Cut

on:
  push:
    branches: [main]

permissions: {}

env:
  # One owner for the model name: the request, the attribution line the
  # release note carries, and the dry-run's default all read this.
  #
  # `mistral-large-latest` was tier-gated out of the free plan on
  # 2026-08-29 (HTTP 403, `tier_not_allowed`) and every run silently
  # produced nothing until someone went looking. The `-latest` alias is
  # deliberate: it never hits a deprecation date, and the report-failure
  # job below now surfaces a model that stops answering.
  HIGHLIGHTS_MODEL: mistral-medium-latest

# Serialize: every main push updates the SAME sticky release-please PR
# branch. Two overlapping runs racing the BSL Change Date Contents-API
# commit on that branch produced HTTP 409 "does not match" conflicts.
# Queue rather than cancel so an in-flight run always finishes creating
# the release PR and posting its required-check statuses. GitHub keeps
# only the newest queued run; dropping older ones is safe because each
# run reconciles full main state from scratch.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    # Fork gate: release-please needs the synthorg-repo-bot App token
    # to mint signed commits + bypass GITHUB_TOKEN's anti-recursion rule.
    # Forks don't have those env-scoped secrets; skip cleanly.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    # Bound total wall time. The retry-wrapped gh calls below (LICENSE
    # read, PR-body read, head-SHA read, and the four required-status
    # POSTs) each carry the gh_with_retry.sh ladder (~1m45s worst case);
    # a black-holed connection is not bounded by the ladder itself. Cap
    # the job so a stuck API call cannot hold a runner up to the 6h
    # default and block the cancel-in-progress:false concurrency group.
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      pull-requests: write
      # For the "Post CI Pass status on release PR" step below: the
      # statuses API needs `statuses: write` to mark the required
      # `CI Pass` check satisfied on the release PR's head SHA
      # without running verify-backend.yml. See the rationale on that step.
      statuses: write
    outputs:
      # Surfaced so the Highlights tracker job below can alert on a
      # generation that failed. The generate step is continue-on-error, so
      # the job result stays `success` and the existing release-please
      # tracker never fires on it.
      highlights_status: ${{ steps.highlights.outputs.status }}
      highlights_skipped: ${{ steps.digest.outputs.skip }}
      # A digest cut short by the compare endpoint's 250-commit ceiling omits
      # the oldest work in the release without failing anything, which is the
      # same silent degradation the tracker exists to end.
      highlights_truncated: ${{ steps.digest.outputs.truncated }}
      highlights_commits: ${{ steps.digest.outputs.total_commits }}
    steps:
      # Minimal checkout of main required so `./.github/actions/...`
      # paths resolve on the runner disk. `fetch-depth: 1` is enough;
      # release-please works via REST API, not the local working tree.
      # The BSL-date step reads + writes LICENSE on the release branch
      # entirely through the Contents API, so no branch checkout is needed.
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Shared setup: validate ref is refs/heads/main and mint the
      # synthorg-repo-bot App installation token.
      - name: Release runner setup
        id: setup
        uses: ./.github/actions/release-runner-setup
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          # release-please creates/updates the release branch + release PR
          # under the App identity, so the token needs contents+PRs write.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.setup.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # When Release Please creates/updates a release PR, update the BSL
      # Change Date to 3 years from today. The date update ships as part
      # of the release PR, so it goes through normal review + merge flow.
      - name: Update BSL Change Date (release + 3 years)
        if: steps.release.outputs.pr != ''
        env:
          # GITHUB_TOKEN (not the PAT) so the Contents API commit ships
          # with a GitHub-signed verification -- PAT-authored API commits
          # are unsigned, while GITHUB_TOKEN commits are signed by GitHub
          # and attributed to github-actions[bot]. Workflow recursion is
          # not a concern here because the commit lands on the release PR
          # branch, not main.
          GH_TOKEN: ${{ github.token }}
          BRANCH: release-please--branches--main--components--synthorg
        run: |
          set -euo pipefail
          new_date=$(LC_TIME=C date -d "+3 years" "+%B %-d, %Y")  # GNU date (ubuntu-24.04)
          echo "Updating Change Date to: $new_date"

          # Read LICENSE content + its blob sha from the single source the
          # PUT's optimistic-lock check consults -- the Contents API on the
          # release branch -- so the sha we send always matches the sha the
          # API holds. This is the canonical read-sha-then-conditional-write
          # pattern; no branch checkout is needed.
          api_json=$(.github/scripts/gh_with_retry.sh "LICENSE contents read" \
            gh api "repos/$GITHUB_REPOSITORY/contents/LICENSE?ref=$BRANCH")
          cur_sha=$(printf '%s' "$api_json" | jq -re '.sha')
          printf '%s' "$api_json" | jq -r '.content' | tr -d '\n' | base64 -d > LICENSE

          sed -i "s/^Change Date:          .*/Change Date:          $new_date/" LICENSE
          grep -q "^Change Date:.*$new_date" LICENSE || {
            echo "::error::sed pattern did not match; Change Date was not updated"
            exit 1
          }
          if [ "$(git hash-object --no-filters LICENSE)" = "$cur_sha" ]; then
            echo "Change Date already up to date -- skipping commit"
            exit 0
          fi

          # Commit via the GitHub Contents API with GITHUB_TOKEN. The
          # resulting commit is signed by GitHub and authored by
          # github-actions[bot], appearing as Verified in the release PR
          # UI. (The eventual squash-merge produces a separate GitHub-
          # signed commit on main regardless of this step's signature.)
          # Materialise the payload to a file (not a pipe) so each
          # gh_with_retry.sh attempt re-reads identical stdin -- a piped
          # `--input -` drains on the first attempt, leaving a retry with
          # empty input. The write is idempotent: the embedded blob `sha`
          # optimistic-locks it, so retrying a transient 5xx / timeout
          # cannot double-commit, and a real 409/422 sha conflict (a
          # concurrent push to the branch) fast-fails so the next main push
          # retriggers cleanly rather than looping on a stale sha.
          payload=$(mktemp)
          jq -n \
            --arg msg "chore: update BSL Change Date to $new_date" \
            --arg content "$(base64 -w0 LICENSE)" \
            --arg sha "$cur_sha" \
            --arg branch "$BRANCH" \
            '{message: $msg, content: $content, sha: $sha, branch: $branch}' > "$payload"
          .github/scripts/gh_with_retry.sh "BSL Change Date write" \
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/LICENSE" --input "$payload"

      # ── Release-notes tagline + Highlights ──
      # Generate a one-line tagline and a three-section Highlights summary,
      # publish both to a sticky comment on the release PR, and mirror them
      # into the PR body. Opt-out: a `No-Highlights:` trailer
      # (case-insensitive) anywhere in the PR body.
      #
      # The STICKY COMMENT is the source of truth and the body copy is a
      # convenience for whoever reviews the PR. release-please owns that body
      # and rewrites it whenever the changelog changes, so a body-only block
      # is deleted by the first rewrite after any failed generation and
      # nothing puts it back. That is not hypothetical: it is how the feature
      # ran dead for two days with every release still green.
      #
      # The digest comes from commit MESSAGES via the compare API rather than
      # from the PR body. The body carries subjects alone, and a subject names
      # a change without saying what it does, which is not enough to write a
      # summary from and nowhere near enough to write a tagline from.
      - name: Build changelog digest
        if: steps.release.outputs.pr != ''
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
          # Null-safe: env is evaluated before the step's `if` is checked, so
          # `fromJSON('')` would fail the workflow whenever release-please has
          # no PR to surface (typically the post-release-merge run, when no
          # commits sit past the freshly-tagged release).
          PR_NUMBER: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Digest construction is best-effort. A transient-exhaustion
          # (EX_TEMPFAIL, exit 75) on the body read must NOT abort the
          # release-please workflow -- skip Highlights and let the required
          # status posting proceed. Any other non-zero is a real failure.
          rc=0
          BODY=$(.github/scripts/gh_with_retry.sh "release PR body read" \
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body') || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "::warning::release PR body read deferred (transient GitHub API failure); skipping best-effort Highlights generation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            echo "::error::release PR body read failed (exit ${rc})"
            exit "$rc"
          fi

          # Skip if the PR body opts out.
          if printf '%s' "$BODY" | grep -qiE '^[[:space:]]*no-highlights:'; then
            echo "No-Highlights: trailer detected; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `releases/latest` excludes drafts and prereleases, so it names the
          # last STABLE release. Dev tags ship as draft prereleases and must
          # not become the base, or the digest would cover a single push.
          BASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name') || BASE=""
          if [ -z "$BASE" ]; then
            echo "::warning::no stable release to compare against; skipping Highlights"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # build_release_digest.py drops the structural noise (issue refs,
          # headings, tables, fenced code, pre-PR review chatter) and caps each
          # commit, because the uncapped messages for one release run to about
          # twice any model's context window. Its stderr carries the
          # truncation warning, which the tracker below reads: a digest cut
          # short by the compare endpoint's own 250-commit ceiling silently
          # omits the oldest work in the release.
          COMPARE=$(gh api "repos/$GITHUB_REPOSITORY/compare/${BASE}...${HEAD_SHA}")
          TOTAL=$(printf '%s' "$COMPARE" | jq -r '.total_commits // 0')
          DIGEST=$(printf '%s' "$COMPARE" | python3 scripts/build_release_digest.py 2> digest-stderr.txt) || true
          cat digest-stderr.txt
          if grep -q 'digest is partial' digest-stderr.txt; then
            echo "truncated=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "${DIGEST// /}" ]; then
            echo "::warning::digest for ${BASE}...${HEAD_SHA} came out empty; skipping Highlights"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Regeneration throttle ──
          # This workflow runs on every push to main, and the digest it builds
          # grows by one commit at a time. Regenerating per push would reroll
          # the tagline several times a day (so the line reviewed on the PR is
          # never the line that ships) and pay the full input cost each time
          # for a document that barely moved.
          #
          # The threshold scales with the release, because one commit means
          # something different at 10 commits than at 180. Below 30 it is 1, so
          # a young release regenerates on every push, which is right: every
          # commit is then a material fraction of it.
          if [ "$TOTAL" -lt 30 ]; then
            THRESHOLD=1
          else
            THRESHOLD=$((TOTAL / 30))
            [ "$THRESHOLD" -lt 2 ] && THRESHOLD=2
          fi

          # Prior state rides in the sticky comment, the same place the block
          # itself lives, so there is no second store to fall out of step.
          STATE=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq 'map(select(.body | contains("<!-- HIGHLIGHTS_STICKY -->"))) | last | .body // empty' \
            | sed -n 's/.*HIGHLIGHTS_STATE base=\([^ ]*\) commits=\([0-9]*\).*/\1 \2/p') || STATE=""
          PREV_BASE=$(printf '%s' "$STATE" | cut -d' ' -f1)
          PREV_COUNT=$(printf '%s' "$STATE" | cut -d' ' -f2)

          REGENERATE=true
          REASON="no previous Highlights for this release"
          if [ -n "$PREV_COUNT" ] && [ "$PREV_BASE" = "$BASE" ]; then
            GROWTH=$((TOTAL - PREV_COUNT))
            if [ "$GROWTH" -lt "$THRESHOLD" ]; then
              REGENERATE=false
              REASON="only ${GROWTH} new commit(s) since the last run, threshold ${THRESHOLD}"
            else
              REASON="${GROWTH} new commit(s) since the last run, threshold ${THRESHOLD}"
            fi
          fi
          echo "regenerate=${REGENERATE} (${REASON})"
          echo "regenerate=${REGENERATE}" >> "$GITHUB_OUTPUT"
          echo "total_commits=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

          # Write to a file because GITHUB_OUTPUT does not handle multi-line
          # content well via simple echo. Commit prose is gated by
          # signed-commit branch protection and the commitizen hook, but it is
          # still human-written and can carry a prompt-injection payload. Wrap
          # it in an explicit untrusted-content fence and escape any literal
          # closing tag so the model cannot be tricked into treating the
          # fenced payload as new instructions.
          ESCAPED_DIGEST=$(printf '%s' "$DIGEST" \
            | sed -E 's#</(untrusted-changelog)>#</\1_escaped>#gI')
          {
            printf '<untrusted-changelog>\n'
            printf '%s' "$ESCAPED_DIGEST"
            printf '\n</untrusted-changelog>\n'
          } > changelog-digest.txt
          echo "Digest for ${BASE}...${HEAD_SHA}: $(wc -c < changelog-digest.txt) bytes, ${TOTAL} commits"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Generate Highlights via Mistral
        if: steps.release.outputs.pr != '' && steps.digest.outputs.skip != 'true' && steps.digest.outputs.regenerate == 'true'
        id: highlights
        # Highlights are cosmetic release-note polish; Release Please has
        # already created / updated the release PR by the time this step
        # runs. A Mistral quota hit, model timeout, or transient service
        # error must NOT fail the release pipeline -- every failure path
        # below exits 0 with no `response` output, so the publish steps
        # simply skip and the release proceeds. `status` records WHICH of
        # those paths was taken, because a step that only ever succeeds is a
        # step nothing can alert on.
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ env.HIGHLIGHTS_MODEL }}
        run: |
          set -euo pipefail
          echo "status=unknown" >> "$GITHUB_OUTPUT"

          # The prompt lives in a file both this workflow and the dry-run
          # read. It was previously copy-pasted into both with a comment
          # asking humans to keep them in step, which is two owners of one
          # value.
          PAYLOAD=$(jq -n \
            --arg model "$MISTRAL_MODEL" \
            --rawfile sys .github/release-highlights-prompt.md \
            --rawfile digest changelog-digest.txt \
            '{model: $model, temperature: 0.4, max_tokens: 4000,
              messages: [{role: "system", content: $sys},
                         {role: "user", content: $digest}]}')

          # curl retries transient 429 / 5xx (and transport errors) itself;
          # after exhaustion it returns non-zero, which we swallow (best-effort).
          rc=0
          RESP=$(printf '%s' "$PAYLOAD" | curl -sS \
            --retry 3 --retry-delay 3 --retry-all-errors \
            -w '\n%{http_code}' \
            -X POST https://api.mistral.ai/v1/chat/completions \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @-) || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Mistral request failed (transport, exit ${rc}); skipping best-effort Highlights."
            echo "status=transport error (curl exit ${rc})" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          if [ "$CODE" != "200" ]; then
            # The response BODY is the diagnosis and the code alone is not:
            # a 403 saying `tier_not_allowed` (the model left our plan) and a
            # 403 saying the key was revoked are the same number and
            # different jobs. Logging only the code cost two days of silent
            # failure and a workflow dispatch to find out which.
            DETAIL=$(printf '%s' "$BODY" | head -c 300 | tr -d '\n')
            echo "::warning::Mistral returned HTTP ${CODE}: ${DETAIL}"
            echo "status=HTTP ${CODE}: ${DETAIL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONTENT=$(printf '%s' "$BODY" | jq -r '.choices[0].message.content // empty')
          if [ -z "$CONTENT" ]; then
            echo "::warning::Mistral returned empty content; skipping best-effort Highlights."
            echo "status=empty completion" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Randomised heredoc delimiter: the model output derives from
          # untrusted commit prose, so a fixed marker could be smuggled in
          # to truncate the output value. openssl ships on ubuntu-24.04.
          DELIM="HIGHLIGHTS_RESPONSE_$(openssl rand -hex 12)"
          {
            printf 'response<<%s\n' "$DELIM"
            printf '%s\n' "$CONTENT"
            printf '%s\n' "$DELIM"
            printf 'status=ok\n'
          } >> "$GITHUB_OUTPUT"

      - name: Render Highlights block
        if: steps.highlights.outputs.status == 'ok' && steps.highlights.outputs.response != ''
        id: render
        continue-on-error: true
        env:
          HIGHLIGHTS: ${{ steps.highlights.outputs.response }}
          MISTRAL_MODEL: ${{ env.HIGHLIGHTS_MODEL }}
        run: |
          set -euo pipefail
          # Marker collision guard: the prompt already tells the model not to
          # emit the markers, but a prompt-injection payload that smuggled one
          # through would let the next run's sticky-strip delete
          # human-authored content between the forged markers.
          SAFE=$(printf '%s' "$HIGHLIGHTS" \
            | sed -E 's/HIGHLIGHTS_(START|END)/HIGHLIGHTS_\1_escaped/g')

          # The model puts the tagline on the first line behind a `TAGLINE: `
          # prefix. Missing or empty is not a failure: the bullets are the
          # substance and a release note without a joke is still a release
          # note, so the block renders without one.
          TAGLINE=$(printf '%s' "$SAFE" | sed -n '1s/^TAGLINE:[[:space:]]*//p')
          if [ -n "${TAGLINE// /}" ]; then
            BULLETS=$(printf '%s' "$SAFE" | sed '1d')
            TAGLINE_BLOCK=$(printf '_%s_\n\n' "$TAGLINE")
          else
            echo "::warning::model emitted no TAGLINE line; rendering Highlights without one."
            BULLETS="$SAFE"
            TAGLINE_BLOCK=""
          fi

          # Attribution sits above the bullets so every reader sees the
          # section is generated before they read it. The model name is read
          # from the same variable the request used, so the two cannot drift.
          DISCLAIMER=$(printf '> _AI-generated summary (model: `%s` via Mistral). Commit-based changelog below._' "$MISTRAL_MODEL")

          BLOCK=$(printf '<!-- HIGHLIGHTS_START -->\n## Highlights\n\n%s%s\n\n%s\n\n<!-- HIGHLIGHTS_END -->' \
            "$TAGLINE_BLOCK" "$DISCLAIMER" "$(printf '%s' "$BULLETS" | sed -e 's/^[[:space:]]*$//' -e '/./,$!d')")

          DELIM="HIGHLIGHTS_BLOCK_$(openssl rand -hex 12)"
          {
            printf 'block<<%s\n' "$DELIM"
            printf '%s\n' "$BLOCK"
            printf '%s\n' "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Highlights sticky comment
        if: steps.render.outputs.block != ''
        # The sticky comment is the SOURCE OF TRUTH that release-finalize.yml
        # reads. release-please owns the PR body and rewrites it on every
        # changelog change; it does not touch comments, so a generation
        # failure can no longer erase a summary that was already produced.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number || '' }}
          BLOCK: ${{ steps.render.outputs.block }}
          BASE: ${{ steps.digest.outputs.base }}
          TOTAL: ${{ steps.digest.outputs.total_commits }}
        run: |
          set -euo pipefail
          # The state marker rides on the comment rather than in a second
          # store, so the record of what was last summarised cannot drift from
          # the summary itself. It sits outside the HIGHLIGHTS markers so
          # release-finalize.yml's extraction never carries it to the release.
          STATE=$(printf '<!-- HIGHLIGHTS_STATE base=%s commits=%s -->' "$BASE" "$TOTAL")
          COMMENT_BODY=$(printf '%s\n%s\n\n%s\n' '<!-- HIGHLIGHTS_STICKY -->' "$STATE" "$BLOCK")

          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq 'map(select(.body | contains("<!-- HIGHLIGHTS_STICKY -->"))) | first | .id // empty')

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" \
              -f body="$COMMENT_BODY" --silent
            echo "Updated Highlights sticky comment $EXISTING on PR #$PR_NUMBER"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$COMMENT_BODY" --silent
            echo "Created Highlights sticky comment on PR #$PR_NUMBER"
          fi

      - name: Mirror Highlights into release PR body
        if: steps.release.outputs.pr != '' && steps.digest.outputs.skip != 'true'
        # Reads the block back from the sticky comment rather than taking it
        # from the render step, so it runs on EVERY push including the ones
        # that skipped regeneration. That matters: release-please rewrites the
        # body whenever the changelog changes, and without an unconditional
        # mirror a throttled push would leave the body stripped until the next
        # regeneration.
        #
        # Convenience only: the comment holds the canonical copy, so a failure
        # here costs a reviewer some scrolling and nothing else.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number || '' }}
        run: |
          set -euo pipefail
          COMMENT=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq 'map(select(.body | contains("<!-- HIGHLIGHTS_STICKY -->"))) | last | .body // empty')
          if [ -z "$COMMENT" ]; then
            echo "No Highlights sticky comment yet; nothing to mirror."
            exit 0
          fi

          # Extract by explicit line numbers after confirming the pair is
          # present and ordered: `sed '/START/,/END/'` runs to EOF when the
          # end marker is missing, which would paste the whole comment.
          START_LINE=$(grep -nFx '<!-- HIGHLIGHTS_START -->' <<< "$COMMENT" | head -n1 | cut -d: -f1 || true)
          END_LINE=$(grep -nFx '<!-- HIGHLIGHTS_END -->' <<< "$COMMENT" | head -n1 | cut -d: -f1 || true)
          if [ -z "$START_LINE" ] || [ -z "$END_LINE" ] || [ "$START_LINE" -ge "$END_LINE" ]; then
            echo "::warning::sticky comment has no well-formed Highlights block; body left alone."
            exit 0
          fi
          BLOCK=$(sed -n "${START_LINE},${END_LINE}p" <<< "$COMMENT")

          CUR_BODY=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
          CLEANED=$(printf '%s' "$CUR_BODY" \
            | sed '/<!-- HIGHLIGHTS_START -->/,/<!-- HIGHLIGHTS_END -->/d')
          NEW_BODY=$(printf '%s\n\n%s' "$BLOCK" "$CLEANED")
          if [ "$NEW_BODY" = "$CUR_BODY" ]; then
            echo "PR body already carries this block; no edit needed."
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$NEW_BODY"
          echo "Highlights mirrored into PR #$PR_NUMBER body"

      # ── Mark required status checks satisfied on the release PR ──
      # release-please opened / updated the PR using the
      # synthorg-repo-bot App installation token. GitHub's
      # anti-recursion rule blocks `pull_request` workflows for
      # events created by the workflow's own installation token,
      # so verify-backend.yml / perf-benchmarks.yml / perf-web-vitals.yml
      # never auto-fire on release PRs.
      #
      # An earlier attempt used `gh workflow run verify-backend.yml
      # --ref <release-branch>` to nudge verify-backend.yml via
      # workflow_dispatch -- but workflow_dispatch runs produce a
      # check_suite with empty `pull_requests`, so the resulting
      # check_run does NOT appear in the PR's status rollup.
      # Branch protection still saw the check on the SHA, but the
      # merge UI showed "<Check> -- Expected, waiting" forever
      # (visible to a human viewer; not a real check failure but
      # indistinguishable from one in the UI).
      #
      # Release PRs touch only CHANGELOG.md, version.txt, and the
      # manifest -- there is no source code that any of these
      # workflows could meaningfully test or benchmark. We
      # therefore post each required *commit status* (not
      # check_run) directly on the PR head SHA. Statuses are in
      # the rollup unconditionally, satisfy branch protection's
      # required-check evaluation, and don't require any workflow
      # run at all. verify-backend.yml's `is_release_please` skip stays in
      # place as defense-in-depth in case release-please's
      # identity ever changes.
      #
      # The required-context list MUST stay in sync with
      # `.github/branch_protection.yml` (the spec) and the live
      # `protect-main` ruleset. The branch-protection drift audit
      # in verify-backend.yml will surface the spec side; new required
      # contexts must be added here at the same time, or the
      # release PR will silently re-block.
      #
      # Resolves the head SHA AT THIS POINT (after the BSL Change
      # Date Contents-API commit) so the statuses post on the
      # final SHA the PR will be merged at, not the
      # release-please-action output captured before that commit.
      - name: Post required-check statuses on release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release-please--branches--main--components--synthorg
        run: |
          set -euo pipefail
          # Release-BLOCKING step: these statuses satisfy branch protection
          # on the release PR. Retry-wrap the head-SHA read AND each status
          # POST (idempotent) so a transient 401/5xx does not leave the PR
          # permanently un-mergeable with "Expected, waiting".
          HEAD_SHA=$(.github/scripts/gh_with_retry.sh "release-PR head-SHA read" \
            gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" --jq '.object.sha')
          DESCRIPTION="release-please PR -- auto-passes (no source changes to test)"
          # Keep in sync with .github/branch_protection.yml ::
          # rulesets[name=protect-main] :: required_status_checks.
          # check_ci_rollup_complete.py fails the build if this list drifts
          # from the spec, so the sync is enforced rather than remembered.
          for context in \
            "CI Pass" \
            "CLI Pass" \
            "Docker Pass" \
            "CodSpeed Python Pass" \
            "CodSpeed Web Pass" \
            "Lighthouse Pass"; do
            .github/scripts/gh_with_retry.sh "status post '$context'" \
              gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f "state=success" \
              -f "context=$context" \
              -f "description=$DESCRIPTION"
            echo "Posted '$context'=success on $HEAD_SHA"
          done

  report-failure:
    name: Open / update tracking issue on release-please failure
    needs: release-please
    if: >-
      always()
      && !github.event.repository.fork
      && needs.release-please.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/post-tracking-issue)
      issues: write     # gh issue create / comment / pin
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compose body
        id: body
        env:
          RESULT: ${{ needs.release-please.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo 'body<<TRACKING_ISSUE_BODY_EOF'
            cat <<EOF
          \`release-please\` workflow failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) with result \`$RESULT\` on $HEAD_SHA.

          Run: ${RUN_URL}

          Likely cause: release-please action failure (manifest drift,
          token mint failure, BSL-date generation), or the post-CI-Pass
          status spoof failed. A failed Highlights generation does NOT
          reach here: it is best-effort and carries its own tracker.

          When this stays red, no new release PR is opened on main;
          dev tags continue to mint via release-dev.yml but no stable
          release ever lands.
          EOF
            echo 'TRACKING_ISSUE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/post-tracking-issue
        with:
          title: 'release-please regression'
          labels: 'automation:ci-health,type:ci,prio:high'
          body: ${{ steps.body.outputs.body }}
          pin: 'false'
          gh-token: ${{ github.token }}

  # ── Highlights generation tracker ──
  # The generate step is deliberately continue-on-error, so the release
  # never blocks on a summary. The cost of that is a failure with no
  # reader: a model tier-gated out from under us produced nothing for two
  # days across ~30 runs that all reported success. This job is what makes
  # the best-effort step observable, matching the CI failure-surfacing
  # policy every other workflow here follows.
  #
  # `skipped` is not a failure. A `No-Highlights:` trailer, a deferred body
  # read, a throttled regeneration and the first release (no stable base to
  # compare against) are all deliberate outcomes and must not open a tracker.
  report-highlights-failure:
    name: Open / update tracking issue on Highlights failure
    needs: release-please
    if: >-
      always()
      && !github.event.repository.fork
      && needs.release-please.result == 'success'
      && needs.release-please.outputs.highlights_skipped != 'true'
      && (
        needs.release-please.outputs.highlights_truncated == 'true'
        || (
          needs.release-please.outputs.highlights_status != ''
          && needs.release-please.outputs.highlights_status != 'ok'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/post-tracking-issue)
      issues: write     # gh issue create / comment / pin
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compose body
        id: body
        env:
          STATUS: ${{ needs.release-please.outputs.highlights_status }}
          TRUNCATED: ${{ needs.release-please.outputs.highlights_truncated }}
          COMMITS: ${{ needs.release-please.outputs.highlights_commits }}
          MODEL: ${{ env.HIGHLIGHTS_MODEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo 'body<<TRACKING_ISSUE_BODY_EOF'
            cat <<EOF
          Release-notes Highlights degraded at $(date -u +%Y-%m-%dT%H:%M:%SZ) on $HEAD_SHA.

          Model: \`${MODEL}\`
          Generation outcome: \`${STATUS:-not reached}\`
          Digest truncated: \`${TRUNCATED:-false}\` (${COMMITS:-?} commits in range)

          Run: ${RUN_URL}

          The release is NOT blocked. What breaks is the summary: the release
          PR keeps whatever sticky comment a previous run produced, and if
          none exists the published release and \`synthorg update\` ship with
          no Highlights and no tagline at all.

          If the outcome above reads \`tier_not_allowed\`, the model has left
          the account's plan and \`HIGHLIGHTS_MODEL\` in release-cut.yml needs
          repointing. Run \`release-highlights-dryrun.yml\` to list the models
          the key can currently call.

          If truncation is \`true\`, the range has passed the compare
          endpoint's 250-commit ceiling, so the digest silently omits the
          OLDEST work in the release and the summary cannot mention it. Cut a
          release, or teach the digest step to paginate.
          EOF
            echo 'TRACKING_ISSUE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/post-tracking-issue
        with:
          title: 'Release Highlights generation is failing'
          labels: 'automation:ci-health,type:ci,prio:medium'
          body: ${{ steps.body.outputs.body }}
          pin: 'false'
          gh-token: ${{ github.token }}

  # Self-resolving counterpart: a recovered generation closes the tracker
  # rather than leaving a stale red issue for somebody to notice and tidy.
  close-highlights-tracker:
    name: Close Highlights tracker on recovery
    needs: release-please
    if: >-
      always()
      && !github.event.repository.fork
      && needs.release-please.outputs.highlights_status == 'ok'
      && needs.release-please.outputs.highlights_truncated != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/post-tracking-issue
        with:
          mode: 'close'
          title: 'Release Highlights generation is failing'
          body: 'Highlights generated successfully; closing. This tracker reopens automatically if generation regresses.'
          close-comment-sha: ${{ github.sha }}
          gh-token: ${{ github.token }}
