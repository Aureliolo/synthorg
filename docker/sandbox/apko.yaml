# SynthOrg sandbox base image -- Wolfi, composed by apko.
# Produces: ghcr.io/aureliolo/synthorg-sandbox-base
# Consumed by: docker/sandbox/Dockerfile (thin FROM wrapper).
#
# Non-distroless on purpose: keeps busybox + git for agent code execution.
# A real bash is a strict upgrade over busybox sh for the shell tool, whose
# commands an agent writes and which busybox silently reads differently.
# tmux backs a terminal that survives between commands rather than one process
# per exec; no shipped tool drives it today, and it is kept because that is the
# shape any interactive terminal tool needs and the package costs a megabyte.
#
# Both halves of the node/npm pair are named: npm 12 accepts
# ^22.22.2 || ^24.15.0 || >=26.0.0, and nodejs-26 sits inside that range.
# Naming one half only leaves the other free to move out of the range this
# comment claims, which is a pairing nothing would flag. An unsupported
# pairing is not cosmetic: npm prints its unsupported-engine banner on stderr
# for every invocation, so it lands in every agent's captured stderr and in
# the evidence a reviewer reads. CI asserts the pair stays honest. A future
# node series bump should prefer an even major (node's LTS track) over an
# odd one: report_apko_series_drift.py has no node-specific LTS awareness,
# so nothing else will steer that choice.
# Network enforcement is handled by the sidecar proxy (docker/sidecar/),
# not by the sandbox container.
#
# UID 10001 is the unprivileged sandbox user (cap_drop: ALL). It also joins
# GID 65532, the group the backend runs under, which is how a test runner in
# here opens the sources the backend wrote: two uids keep the confinement, one
# shared group makes the workspace usable. Declared for legibility only, since
# the container adds the gid at creation time (see core/workspace_sharing.py);
# an operator's own devcontainer image therefore needs nothing baked in.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - busybox
    - bash
    - tmux
    - git
    - nodejs-26
    - npm-12
    - python-3.14
    # A test runner belongs in the image that runs untrusted code, not on the
    # host beside it. Without it an agent asked to write code and its tests
    # cannot run them where its code already runs, and anything grading a
    # delivered tree has to execute that tree somewhere else, which means the
    # host. Pinned to the interpreter's own minor so the two cannot drift apart
    # under a lockfile refresh.
    - py3.14-pytest

accounts:
  groups:
    - groupname: sandbox
      gid: 10001
    - groupname: workspace
      gid: 65532
      members:
        - sandbox
  users:
    - username: sandbox
      uid: 10001
      gid: 10001
  run-as: "10001"

paths:
  - path: /workspace
    type: directory
    uid: 10001
    gid: 10001
    permissions: 0o755

environment:
  PATH: /usr/sbin:/usr/bin:/sbin:/bin
  PYTHONUNBUFFERED: "1"

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.title: synthorg-sandbox-base
  org.opencontainers.image.description: Wolfi-based apko-composed base for synthorg-sandbox
  org.opencontainers.image.url: https://github.com/Aureliolo/synthorg
  org.opencontainers.image.source: https://github.com/Aureliolo/synthorg
  org.opencontainers.image.licenses: BUSL-1.1
  org.opencontainers.image.vendor: Aureliolo
