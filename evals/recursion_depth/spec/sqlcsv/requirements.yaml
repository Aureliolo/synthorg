# The spec's requirement index: what each id means, and the held-out test that
# decides it.
#
# The ids reach the planning brief so a unit can claim the requirements it
# advances through `SubtaskDefinition.satisfies`. The `oracle` node ids do NOT:
# they name tests no agent ever sees, and an agent told which test decides a
# requirement builds to the test rather than to the requirement (S2 section 1:
# a run scored near-perfect against an exposed 222-test oracle while the
# delivered library was dead outside the tested paths).
#
# `area` is the seven-way grouping the top-level decomposition is expected to
# fall out along. Nothing enforces that: it is here so a run whose planner
# invented a different shape can be compared against the one a person would
# have chosen.
spec_id: sqlcsv
title: A SQL query CLI over CSV files
brief: SPEC.md
seed_dir: seed
oracle_dir: oracle

requirements:
