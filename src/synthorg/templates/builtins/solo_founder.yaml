template:
  name: "Solo Builder"
  description: >-
    A lean three-agent setup for maximum autonomy and fast iteration.
    The CEO and a full-stack developer operate event-driven without
    approval gates or hierarchy overhead, and a completion reviewer
    signs off finished work so nobody reviews their own. Ideal for solo
    projects, proof-of-concepts, and rapid prototyping.
  version: "1.2.0"
  min_agents: 3
  max_agents: 4
  tags:
    - "minimal"
    - "solo"
    - "rapid-prototyping"
    - "no-hierarchy"
    - "autonomous"
  skill_patterns:
    - "tool_wrapper"

  posture: "autonomous"

  variables:
    - name: "wip_limit"
      description: "Work-in-progress limit per column"
      var_type: "int"
      default: 3
      hidden: true

  company:
    type: "solo_founder"
    budget_monthly: {{ budget | default(500.0) }}
    autonomy:
      level: "full"

  departments:
    - name: "executive"
      budget_percent: 30
      head_role: "CEO"
    - name: "engineering"
      budget_percent: 55
      head_role: "Full-Stack Developer"
    - name: "quality_assurance"
      budget_percent: 15
      head_role: "Completion Reviewer"

  agents:
    - role: "CEO"
      model:
        priority: "quality"
        min_context: 100000
        requires_reasoning: true
      department: "executive"
      strategic_output_mode: "advisor"
    - role: "Full-Stack Developer"
      merge_id: "fullstack-senior"
      model:
        priority: "balanced"
      department: "engineering"
    # A two-agent org cannot review its own work: the completion oracle is
    # on by default and excludes the executor, so without a third agent
    # every finished task parks unstaffed.
    - role: "Completion Reviewer"
      model:
        priority: "quality"
        requires_reasoning: true
      department: "quality_assurance"

  workflow: "kanban"
  communication: "event_driven"

  workflow_config:
    kanban:
      wip_limits:
        - column: "in_progress"
          limit: {{ wip_limit | default(3) }}
      enforce_wip: false
