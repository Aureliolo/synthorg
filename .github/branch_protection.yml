# Declarative spec for SynthOrg's repo rulesets. Compared against the
# live rules by scripts/audit_branch_protection.sh.
#
# Do not edit volatile fields here -- only the structural rules we want
# enforced. The audit script normalises the live API response to this
# shape before diffing:
#   - Strips id, node_id, created_at, updated_at
#   - Strips bypass_actors (owner-private; different accounts have
#     different admin setups)
#   - Strips copilot_code_review rule entries on BOTH sides -- Copilot
#     review is a UI-managed convenience that GitHub toggles when it
#     adjusts review-rate-limit policies, so treating its drift as
#     alertable produces noise on every policy change. Do NOT add
#     copilot_code_review entries to this spec; the audit will silently
#     drop them on the spec side as well.
#   - Sorts `rules` alphabetically by `type`
#
# A mismatch fails the audit, signalling drift between the committed
# spec and whatever someone changed in Settings -> Rules.

rulesets:
  - name: default
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include: ["~ALL"]
        # No carve-outs: every ref under this ruleset must satisfy the
        # required_signatures rule below. repo-cla.yml's cla-sign job
        # mints commits via the App token + Git Data API, so even the
        # cla-signatures branch carries GitHub-verified signatures.
        exclude: []
    rules:
      - type: code_quality
        parameters:
          severity: all
      - type: required_signatures

  - name: protect-main
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - refs/heads/main
        exclude: []
    rules:
      - type: deletion
      # No merge_queue rule: the queue feature is unavailable on this repo
      # because it is owned by a personal user account, not an organisation
      # (GitHub gates merge queue to org-owned public repos and Enterprise
      # Cloud). Both the rulesets REST API and the Settings -> Rules UI reject
      # it, so the spec must not declare it or audit_branch_protection.sh
      # reports permanent drift. The dropped-dispatch deadlock this would have
      # dissolved is tracked separately; manual re-run/re-push remains the
      # workaround until the repo moves to an organisation.
      - type: non_fast_forward
      - type: required_signatures
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: true
          do_not_enforce_on_create: false
          # integration_id pins each context to the GitHub Actions app
          # (id 15368, slug github-actions) that legitimately posts these
          # sentinel jobs, so no other app holding checks:write can satisfy a
          # required context by reusing its name. The live ruleset must carry
          # the same integration_id or audit_branch_protection.sh reports drift.
          #
          # Every context here is the rollup of a workflow with NO top-level
          # `paths:` filter, which is load-bearing: GitHub treats a
          # never-reported required context as unsatisfied, blocking the PR
          # permanently. Enforced by check_ci_rollup_complete.py.
          required_status_checks:
            - context: "CI Pass"
              integration_id: 15368
            - context: "CLI Pass"
              integration_id: 15368
            - context: "Docker Pass"
              integration_id: 15368
            - context: "CodSpeed Python Pass"
              integration_id: 15368
            - context: "CodSpeed Web Pass"
              integration_id: 15368
            - context: "Lighthouse Pass"
              integration_id: 15368

  - name: protect-main-reviews
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - refs/heads/main
        exclude: []
    rules:
      - type: pull_request
        parameters:
          # Stays at 1: a second approver is unsatisfiable on a solo repo.
          #
          # In fact NO approval count is satisfiable here, and that is
          # deliberate rather than an oversight. `.github/CODEOWNERS` names
          # only @Aureliolo, `require_code_owner_review` therefore demands an
          # approval from the same account that authors every PR, and GitHub
          # does not let an author approve their own PR;
          # `require_last_push_approval` closes the same door from the other
          # side. Every merge consequently runs through the repo owner's admin
          # bypass (`gh pr merge --squash --admin`), which GitHub records in
          # the audit log.
          #
          # Keeping the rules armed rather than relaxing them is the point: if
          # a second maintainer ever joins, review becomes enforced the moment
          # they land in CODEOWNERS, with no ruleset change to remember. The
          # bypass actor itself is not specified here because the audit script
          # strips `bypass_actors` on both sides (see the header).
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          required_reviewers: []
          require_code_owner_review: true
          require_last_push_approval: true
          required_review_thread_resolution: false
          allowed_merge_methods:
            - merge
            - squash
            - rebase
