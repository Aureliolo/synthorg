name: Auto Rollover

# Preserve the 0.X.9 -> 0.(X+1).0 versioning pattern under `always-bump-patch`.
# When the last stable tag is 0.X.9, the next patch bump would be 0.X.10.
# This workflow detects that case and creates an empty commit with a
# `Release-As: 0.(X+1).0` trailer so Release-Please opens a PR for the minor
# bump instead. No manual Release-As trailers needed for routine rollovers.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: auto-rollover
  cancel-in-progress: false

jobs:
  rollover:
    name: Check Rollover
    # Skip Release Please release-PR merges and our own auto-rollover
    # PR merges. The subject-prefix matches are anchored to avoid the
    # false-positive where any unrelated PR's body that mentions
    # `Release-As:` in prose / code blocks would silently disable
    # rollover for that push. Manual `Release-As:` trailers on feature
    # PRs are still detected by the in-step grep below
    # ("Release-As trailer already queued in unreleased commits") which
    # matches the real anchored trailer (`^Release-As:`) rather than
    # any substring.
    # Skip in forks -- needs the upstream-only release-bot App token.
    if: >-
      !github.event.repository.fork
      && !startsWith(github.event.head_commit.message, 'chore(main): release')
      && !startsWith(github.event.head_commit.message, 'chore: auto-rollover')
    runs-on: ubuntu-latest
    # Headroom for the gh_with_retry.sh ladder (~1m45s worst case) on top of
    # checkout + App-token mint, so the transient-exhaustion fail-closed path
    # is reachable rather than the job being killed mid-retry.
    timeout-minutes: 8
    environment: release
    permissions:
      contents: write
      pull-requests: write   # gh pr create + gh pr merge --auto
    steps:
      # Full-history checkout: the "Check if rollover is needed" step
      # walks git tags via `git tag --sort=-v:refname` and compares the
      # last stable tag's commit against HEAD, which requires complete
      # history.
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Shared setup: validate ref is refs/heads/main and mint the
      # synthorg-repo-bot App installation token. The minted token
      # is needed so the rollover commit on main is GitHub-signed (main
      # enforces signed commits via branch protection) AND triggers the
      # downstream Release + Dev Release workflows.
      - name: Release runner setup
        id: setup
        uses: ./.github/actions/release-runner-setup
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          # Auto-rollover lands a signed empty commit on main and opens a
          # PR via the App identity, so the token needs contents+PRs write.
          permission-contents: write
          permission-pull-requests: write

      - name: Check if rollover is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Threshold lives in release-please-config.json under the
          # custom key `__synthorg_rollover_at_patch` so release pipeline
          # configuration stays in one place. Default 9 preserves the
          # historical threshold; RP itself ignores the field.
          RAW_ROLLOVER_AT=$(jq -r '.packages["."].__synthorg_rollover_at_patch // null' \
            .github/release-please-config.json)
          if [ "$RAW_ROLLOVER_AT" = "null" ]; then
            # Fallback is documented, but log it so a silent schema rename
            # (packages["."] -> packages["synthorg"] etc.) surfaces as a
            # notice in the run log instead of a silent rollover at 9.
            echo "::notice::__synthorg_rollover_at_patch missing from release-please-config.json; defaulting to 9"
            ROLLOVER_AT=9
          else
            ROLLOVER_AT="$RAW_ROLLOVER_AT"
          fi
          if ! [[ "$ROLLOVER_AT" =~ ^[0-9]+$ ]]; then
            echo "::error::__synthorg_rollover_at_patch is not a non-negative integer (got: $ROLLOVER_AT)"
            exit 1
          fi
          if [ "$ROLLOVER_AT" != "9" ]; then
            echo "::warning::Non-default rollover threshold: __synthorg_rollover_at_patch=$ROLLOVER_AT"
          fi
          echo "Resolved rollover threshold: patch=$ROLLOVER_AT"

          LAST_STABLE=$(git tag --sort=-v:refname --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | grep -vE '\-(dev|rc|alpha|beta)' | head -1 || true)
          if [ -z "$LAST_STABLE" ]; then
            echo "No stable tag found; skipping rollover."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Last stable tag: $LAST_STABLE"

          VERSION="${LAST_STABLE#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Roll over whenever patch >= ROLLOVER_AT (next bump would reach
          # or exceed ROLLOVER_AT+1). Defensive: the typical trigger is
          # patch == ROLLOVER_AT, but this also recovers if a higher-patch
          # tag somehow slipped through.
          if [ "$PATCH" -lt "$ROLLOVER_AT" ]; then
            echo "Last stable patch is $PATCH; rollover threshold is $ROLLOVER_AT; no rollover needed."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compute the rollover target now so the dedup guards can reference it.
          NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0"
          ROLLOVER_BRANCH="chore/auto-rollover-v${NEXT_VERSION}"

          # Primary dedup guard (history-INDEPENDENT, and the definitive one).
          # The git-log range check below fails OPEN: when a run's checkout
          # does not fully materialise the tag<->HEAD connection the range can
          # come up empty even though the trailer is in history, so a rollover
          # PR for this version could be opened a second time. This query reads
          # GitHub state directly, so it holds regardless of local git history.
          # The branch name carries the version, so a merged v0.(X+1).0
          # rollover never suppresses the next version's rollover. A
          # CLOSED-not-merged rollover (e.g. a manual cancel) is intentionally
          # NOT a skip: it never took effect.
          # gh_with_retry.sh absorbs the transient `HTTP 401: Requires
          # authentication` the GHA auth service occasionally returns on a
          # job's first API call (and 5xx/network blips). On exhaustion it
          # exits 75: fail CLOSED (skip this run), since a missed rollover
          # self-heals on the next push to main and the dedup branch makes the
          # next run idempotent. Any OTHER non-zero exit is a definitive client
          # error (e.g. 403 token-scope / ruleset drift) -- fail LOUD so the
          # regression tracker surfaces a real config bug rather than masking
          # it as a self-healing skip.
          rc=0
          PRIOR_ROLLOVER=$(.github/scripts/gh_with_retry.sh \
            "rollover-dedup PR query (v${NEXT_VERSION})" \
            gh pr list --state all --head "$ROLLOVER_BRANCH" \
            --json number,state \
            --jq '[.[] | select(.state == "MERGED" or .state == "OPEN")] | .[0].number // ""') || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "::warning::Could not query existing rollover PRs after retries; skipping rollover this run (self-heals on next push)."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            echo "::error::Definitive API error querying existing rollover PRs (exit ${rc}); not transient. Failing so the tracker surfaces it."
            exit 1
          fi
          if [ -n "$PRIOR_ROLLOVER" ]; then
            echo "Rollover PR #${PRIOR_ROLLOVER} for v${NEXT_VERSION} already merged/open; skipping."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Secondary guard: a Release-As trailer already queued between last
          # stable and HEAD (our own rollover commit, or a manual override in
          # a feature-PR body that landed via squash-merge). Fail CLOSED: if
          # the range cannot be computed (incomplete history / tag not
          # fetched), skip this run rather than rolling over. A missed
          # rollover self-heals on the next push to main; a spurious PR does
          # not. Capturing into a variable separates a `git log` failure (skip)
          # from a genuine no-match (fall through); a piped `git log | grep`
          # would mask the git-log exit status under `set -o pipefail` and
          # conflate the two.
          if ! UNRELEASED_BODIES=$(git log "${LAST_STABLE}..HEAD" --format=%B); then
            echo "::warning::Could not compute ${LAST_STABLE}..HEAD range; skipping rollover this run."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$UNRELEASED_BODIES" | grep -qE '^Release-As:'; then
            echo "Release-As trailer already present in unreleased commits; skipping."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Also skip if Release Please already has an open release PR whose
          # body carries a Release-As trailer. That directive isn't in git
          # history until the RP PR merges, so without this check the rollover
          # could race ahead and push a conflicting 0.(X+1).0 target.
          # Same retry posture and fail-closed-on-exhaustion / fail-loud-on-
          # definitive-error contract as the dedup query above.
          rc=0
          RP_PR_BODY=$(.github/scripts/gh_with_retry.sh \
            "Release-Please pending-PR body query" \
            gh pr list --state open --label 'autorelease: pending' \
            --json body --jq '.[0].body // ""') || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "::warning::Could not query the Release-Please PR after retries; skipping rollover this run (self-heals on next push)."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            echo "::error::Definitive API error querying the Release-Please PR (exit ${rc}); not transient. Failing so the tracker surfaces it."
            exit 1
          fi
          if printf '%s' "$RP_PR_BODY" | grep -qE '^Release-As:'; then
            echo "Release-As trailer already queued in Release Please PR body; skipping."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Rollover target: $NEXT_VERSION"
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create rollover branch and PR
        if: steps.check.outputs.needed == 'true'
        env:
          # App installation token (not GITHUB_TOKEN) so the resulting
          # commit triggers downstream release.yml + dev-release.yml
          # workflows (GITHUB_TOKEN-authored commits are suppressed by
          # GitHub's anti-recursion rule, which does not apply to App
          # tokens). Git Data API commits from an App token are signed
          # with GitHub's internal key, attributed to the App's bot
          # identity, and verify as `{verified: true, reason: "valid"}`.
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          NEXT_VERSION: ${{ steps.check.outputs.next_version }}
        run: |
          set -euo pipefail
          BRANCH_NAME="chore/auto-rollover-v${NEXT_VERSION}"

          # Skip if a rollover PR is already open for this version (e.g. a
          # prior run created the PR but auto-merge has not landed yet).
          # The earlier PR is the one that should merge; opening a second
          # would diverge and leave reviewers triaging duplicates.
          # Retry-wrap this dedup read (transient 401/5xx absorbed). On
          # exhaustion (exit 75) skip THIS run: the rollover re-evaluates on
          # the next push, so deferring is safe and avoids a false tracker.
          # The mutating calls below (commit/ref/PR create + merge) are left
          # un-retried on purpose -- a real write failure there SHOULD page.
          rc=0
          EXISTING_PR=$(.github/scripts/gh_with_retry.sh \
            "open rollover-PR check (v${NEXT_VERSION})" \
            gh pr list --state open --head "$BRANCH_NAME" \
            --json number --jq '.[0].number // ""') || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "::warning::Could not check for an open rollover PR after retries; skipping this run (self-heals on next push)."
            exit 0
          elif [ "$rc" -ne 0 ]; then
            echo "::error::Definitive API error checking for an open rollover PR (exit ${rc}); not transient."
            exit 1
          fi
          if [ -n "$EXISTING_PR" ]; then
            echo "Auto-rollover PR #${EXISTING_PR} already open for v${NEXT_VERSION}; skipping."
            exit 0
          fi

          PARENT_SHA=$(git rev-parse HEAD)
          TREE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$PARENT_SHA" --jq '.tree.sha')

          # Empty commit (reuses parent tree) via the Git Data API so it
          # ships with a verified signature. The Release-As trailer goes
          # in the PR body -- not the commit message -- because squash-
          # merge (this repo's default) drops the original commit body
          # and uses the PR body as the squash commit body. Release
          # Please reads the squash commit's trailer to retarget the
          # next stable to NEXT_VERSION.
          COMMIT_MESSAGE="chore: auto-rollover to v${NEXT_VERSION}"
          NEW_COMMIT=$(jq -n \
            --arg msg "$COMMIT_MESSAGE" \
            --arg tree "$TREE_SHA" \
            --arg parent "$PARENT_SHA" \
            '{message: $msg, tree: $tree, parents: [$parent]}' \
          | gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha')
          echo "Created commit: $NEW_COMMIT"

          # Create the branch ref. POST creates a fresh ref; if a stale
          # ref exists from a previous partial run, fall back to a force
          # PATCH so the branch points at the new commit.
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$BRANCH_NAME" \
              -f sha="$NEW_COMMIT" >/dev/null 2>&1; then
            echo "Branch $BRANCH_NAME exists; force-updating to new commit."
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH_NAME" \
              -f sha="$NEW_COMMIT" -F force=true >/dev/null
          fi

          PR_BODY=$(printf '%s\n\n%s\n\n%s\n\nRelease-As: %s\n' \
            "Auto-rollover from the .9 patch boundary; bumps the next stable release to v${NEXT_VERSION}." \
            "Generated by \`.github/workflows/auto-rollover.yml\`. Do not edit by hand." \
            "The trailer below is what Release Please reads on squash-merge." \
            "$NEXT_VERSION")

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "$COMMIT_MESSAGE" \
            --body "$PR_BODY")
          echo "Created PR: $PR_URL"

          # Best-effort auto-merge. Branch protection on main may block
          # auto-merge until required status checks pass; if auto-merge
          # cannot be enabled the PR stays open for manual handling and
          # the report-failure job below opens a tracker.
          if ! gh pr merge "$PR_URL" --auto --squash; then
            echo "::warning::Could not enable auto-merge on $PR_URL; PR will need manual merge."
          fi

  report-failure:
    name: Open / update tracking issue on rollover failure
    needs: rollover
    # Fire on any non-success path EXCEPT skipped (the workflow's own
    # if-clause skips on fork / release / Release-As-already-present
    # commits; those are not failures).
    if: >-
      always()
      && needs.rollover.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/post-tracking-issue)
      issues: write     # gh issue create / comment / pin
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compose body
        id: body
        env:
          RESULT: ${{ needs.rollover.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo 'body<<TRACKING_ISSUE_BODY_EOF'
            cat <<EOF
          \`auto-rollover\` workflow failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) with result \`$RESULT\` on $HEAD_SHA.

          Run: ${RUN_URL}

          Open the run and read the failing step before assuming a cause.
          The dedup-read \`gh pr list\` calls retry transient 401/5xx and
          fail CLOSED on exhaustion (skip, no failure), so a job that
          reaches THIS tracker failed on something non-transient:

          - A definitive client error (e.g. \`HTTP 403\`) from the dedup
            reads -- token-scope narrowing or branch-protection ruleset
            drift. This fails loud by design.
          - The App-token \`gh pr create\` / \`gh pr merge\` write flow
            (synthorg-repo-bot App token mint failure, GraphQL permission
            denial, ruleset drift), or the rollover ref-update failing
            because main moved between tree fetch and commit-creation.

          When this stays red, the .9 -> next-minor bump is silently
          replaced by a routine .10 patch bump. Release Please continues
          publishing patch-level dev tags but the next stable is wrong.
          EOF
            echo 'TRACKING_ISSUE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/post-tracking-issue
        with:
          title: 'auto-rollover regression'
          labels: 'automation:ci-health,type:ci,prio:high'
          body: ${{ steps.body.outputs.body }}
          pin: 'false'
          gh-token: ${{ github.token }}
