name: Link Check (lychee, external)

# Weekly external-link checker for README, every CLAUDE.md tier, and
# every Markdown under docs/. Runs lychee ONLINE (no ``--offline``):
# every remote link is probed and any non-200 is surfaced. This is the
# counterpart to the blocking gate in ``.github/workflows/lychee.yml``,
# which runs ``--offline`` and only validates internal links so a
# third-party host can never block a merge. External rot is real but is
# not the committer's to fix, so it is reported here off the critical
# path instead: on broken links this run files (or updates) a tracking
# issue via the ``post-tracking-issue`` composite action, the same sink
# the security workflows use. The run itself goes red on a scheduled
# failure for visibility; a human triages and closes the issue.
#
# Config is the shared ``lychee.toml``: its ``exclude`` list suppresses
# anti-bot (403) and rate-limit (429) hosts that are live in a browser,
# so they never file a bogus issue here.

on:
  schedule:
    - cron: "0 7 * * 1"  # Weekly Monday 07:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lychee-external:
    name: lychee-external
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # actions/checkout + load .github/actions/post-tracking-issue
      issues: write   # post-tracking-issue (gh issue create / edit / reopen)
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Restore lychee cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Install lychee
        shell: bash
        # ``runner.temp`` is only available at step-level env; job-level
        # env limits context to github/inputs/matrix/needs/secrets/strategy/vars
        # (actionlint enforces this). Same install dir is reused by the
        # following PATH step.
        env:
          LYCHEE_INSTALL_DIR: ${{ runner.temp }}/lychee-bin
        run: bash scripts/install_cli_tools.sh lychee

      - name: Add lychee to PATH
        shell: bash
        env:
          LYCHEE_INSTALL_DIR: ${{ runner.temp }}/lychee-bin
        run: echo "${LYCHEE_INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Run lychee (online)
        id: lychee
        shell: bash
        env:
          # Authenticated GitHub requests get a higher rate-limit budget,
          # which matters because docs reference many github.com URLs.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Disable errexit so a non-200 (the signal we want) does not
          # abort the step before we capture the exit code; the report
          # is teed to the job summary and stashed for the issue body.
          set +e
          lychee \
            --config lychee.toml \
            --no-progress \
            --format markdown \
            './README.md' \
            './CLAUDE.md' \
            './cli/CLAUDE.md' \
            './web/CLAUDE.md' \
            './docs/**/*.md' \
            > lychee-report.md
          status=$?
          cat lychee-report.md >> "${GITHUB_STEP_SUMMARY}"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Compose issue body
        if: steps.lychee.outputs.status != '0'
        id: body
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo 'body<<TRACKING_ISSUE_BODY_EOF'
            echo "The weekly external link check found broken links at $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo ""
            echo "Run: ${RUN_URL}"
            echo ""
            cat lychee-report.md
            echo ""
            echo "These are external (remote) links, not link rot in our own docs. Fix the doc if the link is genuinely wrong, add an exclude to \`lychee.toml\` for a false-positive host (anti-bot 403 / rate-limit 429), or leave this open until the upstream site recovers."
            echo 'TRACKING_ISSUE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open / update tracking issue on broken external links
        if: steps.lychee.outputs.status != '0' && github.event_name == 'schedule'
        uses: ./.github/actions/post-tracking-issue
        with:
          title: 'External link rot'
          labels: 'automation:ci-health,type:ci,prio:low'
          body: ${{ steps.body.outputs.body }}
          pin: 'false'
          gh-token: ${{ github.token }}

      - name: Re-surface broken links as a run failure
        if: steps.lychee.outputs.status != '0'
        shell: bash
        run: exit 1
