name: Finalize Release

# Publish draft releases once both CLI and Docker workflows succeed.
# Release Please creates draft releases (immutable once published),
# then CLI (GoReleaser) and Docker (GHCR) attach assets to the draft.
# This workflow fires on each completion and publishes when both are done.

on:
  # zizmor: ignore[dangerous-triggers] -- safe: no checkout, no untrusted code
  # execution; only queries workflow status via gh CLI and publishes a draft
  # release. Guarded by event != 'pull_request' and startsWith(head_branch, 'v').
  workflow_run:
    workflows: [Docker, CLI]
    types: [completed]

permissions: {}

# Finalize Release publishes a draft release (immutable after publish)
# and deletes dev pre-release tags. Cancelling in-flight would leave the
# draft half-published and the dev-tag cleanup partially applied;
# ``cancel-in-progress: false`` keeps concurrent reruns serialised per
# tag without clobbering each other. Concurrent stable tags still run
# in parallel because the group key includes the tag name.
concurrency:
  group: finalize-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Draft Release
    # Only process tag-triggered release builds, not PR-triggered runs.
    # The event != 'pull_request' guard prevents a PR that modifies the
    # Docker/CLI workflows from reaching this privileged publish step.
    # Both stable (v0.4.7) and dev (v0.4.7-dev.3) releases go through the
    # same draft -> finalize pipeline.
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    # `workflow_run` sets `github.ref` to the default branch (main) regardless
    # of which tag triggered the upstream workflow, so the `release` env's
    # `main`-only branch policy matches cleanly. The workflow-level `if:` guard
    # still enforces that the triggering workflow ran on a tag starting with `v`.
    # This job does not consume the `synthorg-repo-bot` App token, but
    # sharing the env with the release-please jobs keeps the main-scoped
    # gate consistent.
    environment: release
    permissions:
      actions: read
      contents: write
      pull-requests: read
      statuses: write
    steps:
      # ── Surface this run's outcome on the head commit's status row ──
      # ``workflow_run``-triggered jobs do not produce commit checks by
      # default, so a failure in finalize-release is invisible from the
      # commit list, the PR/branch rollup, and the status API. We post
      # an explicit "finalize-release" status: ``pending`` here, then
      # ``success`` / ``failure`` from the final reporter step below.
      - name: Report status (pending)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context=finalize-release \
            -f description="Finalising $TAG" \
            -f target_url="$RUN_URL"

      - name: Preflight (both workflows succeeded + draft exists)
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          echo "Triggered by: $WORKFLOW_NAME"
          echo "Tag: $TAG"
          echo "Triggering run conclusion: $WORKFLOW_CONCLUSION"

          # If the triggering workflow failed, no point checking the other
          if [ "$WORKFLOW_CONCLUSION" != "success" ]; then
            echo "Triggering workflow failed -- skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The triggering workflow's conclusion is known directly from the
          # event payload above -- never query it back, since the Actions
          # search API has eventual-consistency lag (`gh run list --status
          # completed` has been observed to miss runs that finished tens of
          # minutes earlier under load) and would falsely report `pending`,
          # leaving the commit's `finalize-release` status stuck.
          #
          # Query only the SIBLING (the workflow we did NOT just observe
          # complete). Use the direct `actions/runs?head_sha=` endpoint
          # instead of `gh run list` -- it is more reliable than the
          # search-indexed listing -- and retry with backoff to absorb any
          # residual lag from the indexer.
          case "$WORKFLOW_NAME" in
            Docker) SIBLING_NAME=CLI ;;
            CLI) SIBLING_NAME=Docker ;;
            *)
              echo "::error::Unexpected triggering workflow: $WORKFLOW_NAME"
              exit 1
              ;;
          esac

          SIBLING_STATUS=missing
          SIBLING_CONCLUSION=pending
          for attempt in 1 2 3 4 5 6; do
            SIBLING_JSON=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"$SIBLING_NAME\" and .head_branch == \"$TAG\" and .event == \"push\")] | .[0] // {}")
            SIBLING_STATUS=$(jq -r '.status // "missing"' <<< "$SIBLING_JSON")
            SIBLING_CONCLUSION=$(jq -r '.conclusion // "pending"' <<< "$SIBLING_JSON")
            if [ "$SIBLING_STATUS" = "completed" ]; then
              break
            fi
            echo "Sibling $SIBLING_NAME status=$SIBLING_STATUS conclusion=$SIBLING_CONCLUSION (attempt $attempt/6); sleeping..."
            sleep $((attempt * 10))
          done

          echo "$WORKFLOW_NAME (this trigger): $WORKFLOW_CONCLUSION"
          echo "$SIBLING_NAME (sibling): status=$SIBLING_STATUS conclusion=$SIBLING_CONCLUSION"

          if [ "$SIBLING_STATUS" != "completed" ]; then
            echo "Sibling $SIBLING_NAME has not completed yet -- its workflow_run event will retrigger this run."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$SIBLING_CONCLUSION" != "success" ]; then
            echo "Sibling $SIBLING_NAME concluded $SIBLING_CONCLUSION -- release will not publish."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "sibling_failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Both succeeded -- check if release exists and is still a draft
          if ! IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq '.isDraft' 2>/dev/null); then
            echo "Release $TAG not found -- nothing to publish."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$IS_DRAFT" != "true" ]; then
            echo "Release $TAG is not a draft (isDraft=$IS_DRAFT). Already published."
            # Still signal published so the cleanup step can run on reruns
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # NOTE: artifact smoke testing happens at BUILD time in
      # cli.yml (smoke-test-cli-binary composite action) and
      # docker.yml (smoke-test-backend-image composite action), so a
      # broken binary or backend image fails the originating PR with
      # a red ❌ on the commit row -- not the finalize-release step
      # after a tag has already been cut. The previous smoke steps
      # here were redundant (Docker images are content-addressed, so
      # the GHCR-pulled image is bit-identical to the one tested at
      # build time; CLI archive integrity is already verified by the
      # cosign-signed checksums.txt before publish), and they were
      # also the only place either probe ran -- meaning a regression
      # was caught only after a tag was already cut, which is too
      # late. Build-time smoke makes this gate redundant.

      - name: Assemble + publish draft
        if: steps.preflight.outputs.proceed == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # ── Assemble combined Verification section ──
          # CLI and Docker workflows embed verification data in HTML comments.
          # Extract, strip markers, and append as a visible Verification section.
          BODY="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"

          CLI_CHECKSUMS=""
          CLI_SLSA=""
          if grep -q "CLI_VERIFICATION_DATA" <<< "$BODY"; then
            CLI_CHECKSUMS=$(sed -n '/<!-- CLI_VERIFICATION_DATA/,/CLI_VERIFICATION_DATA -->/p' <<< "$BODY" \
              | sed '1d;$d' | grep -E '^\|' || true)
            CLI_SLSA=$(sed -n '/<!-- CLI_VERIFICATION_DATA/,/CLI_VERIFICATION_DATA -->/p' <<< "$BODY" \
              | sed '1d;$d' | sed -n '/^```bash$/,/^```$/p' || true)
            if [ -z "$CLI_CHECKSUMS" ]; then
              echo "::warning::CLI checksums table not found in release body"
            fi
            if [ -z "$CLI_SLSA" ]; then
              echo "::warning::CLI SLSA provenance commands not found in release body"
            fi
          fi

          CLI_COSIGN=""
          if grep -q "CLI_COSIGN_DATA" <<< "$BODY"; then
            CLI_COSIGN=$(sed -n '/<!-- CLI_COSIGN_DATA/,/CLI_COSIGN_DATA -->/p' <<< "$BODY" \
              | sed '1d;$d' | sed -n '/^```bash$/,/^```$/p' || true)
            if [ -z "$CLI_COSIGN" ]; then
              echo "::warning::CLI cosign verification data not found in release body"
            fi
          fi

          CLI_SLSA_BUNDLE=""
          if grep -q "CLI_SLSA_BUNDLE_DATA" <<< "$BODY"; then
            CLI_SLSA_BUNDLE=$(sed -n '/<!-- CLI_SLSA_BUNDLE_DATA/,/CLI_SLSA_BUNDLE_DATA -->/p' <<< "$BODY" \
              | sed '1d;$d' | sed -n '/^```bash$/,/^```$/p' || true)
            if [ -z "$CLI_SLSA_BUNDLE" ]; then
              echo "::warning::CLI SLSA bundle verification data not found in release body"
            fi
          fi

          CONTAINER_SBOM=""
          if grep -q "CONTAINER_SBOM_DATA" <<< "$BODY"; then
            CONTAINER_SBOM=$(sed -n '/<!-- CONTAINER_SBOM_DATA/,/CONTAINER_SBOM_DATA -->/p' <<< "$BODY" \
              | sed '1d;$d' | grep -E '^\- ' || true)
            if [ -z "$CONTAINER_SBOM" ]; then
              echo "::warning::Container SBOM data not found in release body"
            fi
          fi

          CONTAINER_COSIGN=""
          CONTAINER_SLSA=""
          if grep -q "CONTAINER_VERIFICATION_DATA" <<< "$BODY"; then
            CONTAINER_INNER=$(sed -n '/<!-- CONTAINER_VERIFICATION_DATA/,/CONTAINER_VERIFICATION_DATA -->/p' <<< "$BODY" | sed '1d;$d')
            # Extract first and second ```bash...``` code blocks using line-by-line awk.
            # (awk paragraph mode RS= breaks on blank lines inside code blocks.)
            CONTAINER_COSIGN=$(awk '
              /^```bash$/ { n++; p=1 }
              p && n==1
              /^```$/ && p && n==1 { p=0; exit }
            ' <<< "$CONTAINER_INNER" || true)
            CONTAINER_SLSA=$(awk '
              /^```bash$/ { n++; if(n==2) p=1 }
              p && n==2
              /^```$/ && p && n==2 { p=0; exit }
            ' <<< "$CONTAINER_INNER" || true)
            if [ -z "$CONTAINER_COSIGN" ]; then
              echo "::warning::Container cosign verification data not found in release body"
            fi
            if [ -z "$CONTAINER_SLSA" ]; then
              echo "::warning::Container SLSA provenance data not found in release body"
            fi
          fi

          # SBOM subsection. Source of truth for which SBOMs exist
          # is the release assets list, not body-injected markers;
          # docker.yml uploads sbom-*.cdx.json files via
          # `gh release upload` but does NOT inject
          # <!-- CONTAINER_SBOM_DATA --> markers, so the
          # marker-only path silently produced an empty SBOM
          # subsection (and therefore no `### Software Bill of
          # Materials` header) on every release.
          #
          # Computed BEFORE the gate so an asset-backed SBOM list
          # can stand on its own as the verification trigger when
          # all marker-derived sections are empty (e.g. an early
          # build where CLI / Docker injection is broken but
          # SBOM upload still succeeded). Without this hoist, the
          # gate's marker-only OR-list would skip the entire
          # Verification section and silently lose the SBOM
          # subsection too.
          #
          # No `|| true` on the gh release view call: an empty
          # SBOM list is fine (jq exits 0 with empty output when
          # no asset matches the filter), but a real failure
          # (token denied, 404, network) is NOT fine -- masking
          # it would let the workflow proceed to the immutable
          # `--draft=false` publish below with an SBOM-less
          # release body.
          SBOM_ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '[.assets[].name | select(test("^sbom-.*\\.cdx\\.json$"))] | .[]')
          SBOM_ITEMS=""
          if [ -n "$SBOM_ASSETS" ]; then
            # Render as `\`name\`` separated by ` | `, preserving the
            # docker.yml release-events format readers are used to.
            SBOM_LIST=$(printf '%s' "$SBOM_ASSETS" \
              | awk 'BEGIN{first=1} {if(first){first=0}else{printf " | "}; printf "`%s`", $0} END{print ""}')
            SBOM_ITEMS="$(printf '**Container images:** %s\n' "$SBOM_LIST")"
          fi
          # Marker-injected legacy data still concatenates if
          # present, for forward-compat if a future docker.yml
          # change starts emitting CONTAINER_SBOM_DATA.
          if [ -n "$CONTAINER_SBOM" ]; then
            SBOM_ITEMS="$(printf '%s\n\n%s' "$SBOM_ITEMS" "$CONTAINER_SBOM")"
          fi

          # Build the combined Verification section
          VERIFICATION=""
          if [ -n "$CLI_CHECKSUMS" ] || [ -n "$CLI_COSIGN" ] || [ -n "$CLI_SLSA_BUNDLE" ] || [ -n "$CONTAINER_COSIGN" ] || [ -n "$CLI_SLSA" ] || [ -n "$CONTAINER_SLSA" ] || [ -n "$SBOM_ITEMS" ]; then
            VERIFICATION="$(printf '\n<!-- FINALIZE_VERIFICATION -->\n\n---\n\n## Verification\n')"

            if [ -n "$CLI_CHECKSUMS" ]; then
              VERIFICATION="$(printf '%s\n\n### CLI Checksums (SHA-256)\n\n%s\n' "$VERIFICATION" "$CLI_CHECKSUMS")"
            fi

            if [ -n "$CLI_COSIGN" ]; then
              VERIFICATION="$(printf '%s\n\n### CLI Binary Signatures\n\n%s\n' "$VERIFICATION" "$CLI_COSIGN")"
            fi

            if [ -n "$CLI_SLSA_BUNDLE" ]; then
              VERIFICATION="$(printf '%s\n\n### CLI Provenance Bundle\n\nVerify the Sigstore provenance bundle (`.sigstore.json`):\n\n%s\n' "$VERIFICATION" "$CLI_SLSA_BUNDLE")"
            fi

            if [ -n "$CONTAINER_COSIGN" ]; then
              VERIFICATION="$(printf '%s\n\n### Container Image Signatures\n\n%s\n' "$VERIFICATION" "$CONTAINER_COSIGN")"
            fi

            # Combined SLSA provenance
            SLSA_BLOCK=""
            if [ -n "$CLI_SLSA" ]; then
              SLSA_BLOCK="$CLI_SLSA"
            fi
            if [ -n "$CONTAINER_SLSA" ]; then
              if [ -n "$SLSA_BLOCK" ]; then
                # Merge: strip closing ``` from CLI, strip opening ```bash from container
                CLI_COMMANDS=$(printf '%s' "$CLI_SLSA" | sed '1d' | sed '/^```$/d')
                CONTAINER_COMMANDS=$(printf '%s' "$CONTAINER_SLSA" | sed '1d' | sed '/^```$/d')
                SLSA_BLOCK="$(printf '```bash\n%s\n\n%s\n```' "$CLI_COMMANDS" "$CONTAINER_COMMANDS")"
              else
                SLSA_BLOCK="$CONTAINER_SLSA"
              fi
            fi

            if [ -n "$SLSA_BLOCK" ]; then
              VERIFICATION="$(printf '%s\n\n### Provenance (SLSA Level 3)\n\nVerify with the [GitHub CLI](https://cli.github.com/):\n\n%s\n' "$VERIFICATION" "$SLSA_BLOCK")"
            fi

            # SBOM subsection. SBOM_ITEMS was computed before the
            # gate so this block just appends; see the comment block
            # at the top of the gate for the rationale.
            if [ -n "$SBOM_ITEMS" ]; then
              VERIFICATION="$(printf '%s\n\n### Software Bill of Materials\n\nCycloneDX JSON SBOMs are attached to this release as downloadable assets.\n\n%s\n' "$VERIFICATION" "$SBOM_ITEMS")"
            fi
          fi

          # ── Promote AI Highlights from the release-please PR body ──
          # release.yml writes a `<!-- HIGHLIGHTS_START -->...<!-- HIGHLIGHTS_END -->`
          # block onto the rolling release-please PR body via gh pr edit.
          # When the PR is merged, release-please builds the release notes
          # from CHANGELOG.md only, leaving the Highlights block stranded on
          # the PR. Locate the merged PR via the head_sha -> pulls
          # association and copy the marker block (verbatim, markers
          # included) to the top of the release body so:
          #   - users see the AI summary on github.com/<repo>/releases
          #   - `synthorg update` parses it via cli/internal/selfupdate
          #     ExtractHighlights for the styled changelog walk.
          #
          # Stable releases only (release-please does not run on dev tags).
          # Best-effort: missing PR, missing block, or empty PR body all
          # leave the release body untouched.
          HIGHLIGHTS=""
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Distinguish "API failed" (warning, propagation skipped) from
            # "API succeeded but returned no release-please PR" (notice,
            # propagation legitimately not applicable). Wrapping the whole
            # pipeline in `|| true` would conflate the two; querying the
            # API once and filtering the JSON locally keeps the failure
            # signal observable while preserving best-effort semantics.
            PR_NUMBER=""
            if PR_API_OUTPUT=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" 2>/dev/null); then
              PR_NUMBER=$(printf '%s' "$PR_API_OUTPUT" \
                | jq -r '.[] | select(.head.ref | startswith("release-please--branches--main")) | .number' \
                | head -n1)
            else
              echo "::warning::gh api commits/${HEAD_SHA}/pulls failed; skipping Highlights propagation."
            fi
            if [ -n "$PR_NUMBER" ]; then
              PR_BODY=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null || true)
              if [ -n "$PR_BODY" ]; then
                EXTRACTED=$(sed -n '/<!-- HIGHLIGHTS_START -->/,/<!-- HIGHLIGHTS_END -->/p' <<< "$PR_BODY")
                # Only treat as a valid block when the exact closing
                # marker is present; sed -n on a body with the start
                # marker but no end marker would print everything from
                # start to EOF. Use grep -F with the full HTML comment so
                # prose like "HIGHLIGHTS_END mentioned in the changelog"
                # cannot pass the guard.
                if [ -n "$EXTRACTED" ] && grep -qF '<!-- HIGHLIGHTS_END -->' <<< "$EXTRACTED"; then
                  # Trim trailing newlines so the prepend produces exactly
                  # one blank line between the Highlights block and the
                  # changelog. The herestring `<<<` adds one trailing
                  # newline that sed's range capture preserves; without
                  # this trim, ${HIGHLIGHTS}${CLEANED} renders an extra
                  # blank line at the top of the release body.
                  while [[ "$EXTRACTED" == *$'\n' ]]; do EXTRACTED="${EXTRACTED%$'\n'}"; done
                  HIGHLIGHTS="$EXTRACTED"$'\n\n'
                  echo "Highlights block found in release-please PR #${PR_NUMBER}; prepending to release body."
                else
                  echo "::notice::release-please PR #${PR_NUMBER} has no Highlights block; release body unchanged."
                fi
              else
                echo "::warning::Could not fetch body of release-please PR #${PR_NUMBER}; release body unchanged."
              fi
            elif [ -n "${PR_API_OUTPUT-}" ]; then
              echo "::notice::No release-please PR associated with ${HEAD_SHA}; skipping Highlights propagation."
            fi
          fi

          # Strip and re-append only when we have a replacement. If both
          # HIGHLIGHTS and VERIFICATION are empty (nothing to add), leave
          # the body untouched to avoid destroying an existing Highlights
          # / Verification section with no replacement.
          if [ -n "$VERIFICATION" ] || [ -n "$HIGHLIGHTS" ]; then
            CLEANED="$BODY"
            # Each marker-pair strip is gated on BOTH markers being
            # present in the body. `sed '/START/,/END/d'` is greedy:
            # with no END, it deletes from START through EOF. A
            # contributor's commit subject (now propagated verbatim
            # into dev release bodies) carrying the literal opening
            # marker would otherwise tank the CHANGELOG-derived body
            # on the next finalize run. Use grep -F so the marker
            # strings are matched as fixed literals; sed BRE/ERE
            # special chars in markers (none today, but defensive)
            # would otherwise be misinterpreted.
            strip_balanced_pair() {
              local start_marker="$1"
              local end_marker="$2"
              if grep -qF "$start_marker" <<< "$CLEANED" \
                  && grep -qF "$end_marker" <<< "$CLEANED"; then
                CLEANED=$(printf '%s' "$CLEANED" \
                  | sed "/${start_marker}/,/${end_marker}/d")
              fi
            }
            strip_balanced_pair '<!-- HIGHLIGHTS_START -->' '<!-- HIGHLIGHTS_END -->'
            strip_balanced_pair '<!-- CLI_VERIFICATION_DATA' 'CLI_VERIFICATION_DATA -->'
            strip_balanced_pair '<!-- CLI_COSIGN_DATA' 'CLI_COSIGN_DATA -->'
            strip_balanced_pair '<!-- CLI_SLSA_BUNDLE_DATA' 'CLI_SLSA_BUNDLE_DATA -->'
            strip_balanced_pair '<!-- CONTAINER_VERIFICATION_DATA' 'CONTAINER_VERIFICATION_DATA -->'
            strip_balanced_pair '<!-- CONTAINER_SBOM_DATA' 'CONTAINER_SBOM_DATA -->'
            # FINALIZE_VERIFICATION is intentionally greedy-to-EOF:
            # everything after the marker IS the verification section
            # (no closing marker by design). The greedy strip rebuilds
            # the section fresh from the per-image marker data above.
            CLEANED=$(printf '%s' "$CLEANED" \
              | sed '/^<!-- FINALIZE_VERIFICATION -->/,$d')
            FINAL="${HIGHLIGHTS}${CLEANED}${VERIFICATION}"
          else
            FINAL="$BODY"
          fi

          tmpfile="$(mktemp /tmp/finalize-release.XXXXXX)"
          trap 'rm -f "$tmpfile"' EXIT
          printf '%s' "$FINAL" > "$tmpfile"
          if gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$tmpfile"; then
            echo "Release body assembled (Highlights: $([ -n "$HIGHLIGHTS" ] && echo yes || echo no); Verification: $([ -n "$VERIFICATION" ] && echo yes || echo no))."
          else
            if [ -n "$VERIFICATION" ] || [ -n "$HIGHLIGHTS" ]; then
              echo "::error::Failed to update release body -- highlights/verification data would be lost. Not publishing."
              exit 1
            else
              echo "::warning::Failed to update release body (nothing to lose -- proceeding)"
            fi
          fi

          # ── Publish the draft release (makes it immutable) ──
          # Handle TOCTOU race: if a concurrent run published first, the second
          # call may fail with 422 (immutable). Re-check and exit cleanly.
          if gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false; then
            echo "Release $TAG published successfully."
          else
            IS_DRAFT_NOW=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq '.isDraft' 2>/dev/null || echo "unknown")
            if [ "$IS_DRAFT_NOW" = "false" ]; then
              echo "Release $TAG was already published by a concurrent run -- OK."
            else
              echo "::error::Failed to publish release $TAG (isDraft=$IS_DRAFT_NOW)"
              exit 1
            fi
          fi

          # Signal to subsequent steps that publish succeeded
          echo "published=true" >> "$GITHUB_OUTPUT"

      # ── Clean up ALL dev pre-releases and tags after a stable release ──
      # Deletes every release and tag matching the dev-tag regex, regardless
      # of draft/published/pre-release status. Only runs when a stable release
      # was just published (not for dev releases themselves). The already_published
      # branch handles replays after a concurrent run won the publish race.
      - name: Clean up dev pre-releases and tags
        if: >-
          (steps.publish.outputs.published == 'true'
             || steps.preflight.outputs.already_published == 'true')
          && !contains(github.event.workflow_run.head_branch, '-dev.')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          # Safety: verify the stable release is actually published
          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq '.isDraft' 2>/dev/null || echo "not_found")
          if [ "$IS_DRAFT" != "false" ]; then
            echo "::error::Stable release $TAG is not published (isDraft=$IS_DRAFT) -- aborting dev cleanup"
            exit 1
          fi

          echo "Stable release $TAG is published -- cleaning up all dev pre-releases and tags"

          # 1. Delete all dev releases (draft, pre-release, or published) + their tags.
          #    Use the API directly to ensure drafts are included.
          #    Strict regex: only match vX.Y.Z-dev.N (never stable tags).
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.[0-9]+$")) | .tag_name' \
          | while read -r dev_tag; do
              echo "Deleting dev release + tag: $dev_tag"
              gh release delete "$dev_tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            done

          # 2. Delete orphan dev tags (tags without a release, e.g. from failed builds).
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate --jq '.[].ref' \
          | sed 's|^refs/tags/||' \
          | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$' || true; } \
          | while read -r dev_tag; do
              echo "Deleting orphan dev tag: $dev_tag"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$dev_tag" || true
            done

          echo "Dev pre-release cleanup complete"

      # ── Final commit-status report ──
      # Always runs, regardless of earlier step outcomes. Decides the
      # status state from the job's overall conclusion + the preflight /
      # publish output flags so the commit row shows:
      #   - success   when this run actually published OR the release
      #               was already published by a concurrent run OR we
      #               are still legitimately waiting for the sibling
      #               workflow (CLI/Docker) to complete (a definitive
      #               status will be posted by its own trigger)
      #   - failure   when the job failed at any step, OR preflight
      #               proved the release will never publish (the
      #               triggering workflow itself failed)
      # The pending status posted in the first step is overwritten by
      # this final state.
      - name: Report status (final)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          PROCEED: ${{ steps.preflight.outputs.proceed }}
          ALREADY_PUBLISHED: ${{ steps.preflight.outputs.already_published }}
          SIBLING_FAILED: ${{ steps.preflight.outputs.sibling_failed }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          if [ "$JOB_STATUS" = "failure" ] || [ "$JOB_STATUS" = "cancelled" ]; then
            STATE=failure
            DESC="Finalize-release ${JOB_STATUS} for ${TAG}"
          elif [ "$PUBLISHED" = "true" ] || [ "$ALREADY_PUBLISHED" = "true" ]; then
            STATE=success
            DESC="Released ${TAG}"
          elif [ "$PROCEED" != "true" ] && [ "$TRIGGER_CONCLUSION" != "success" ]; then
            # Triggering workflow (Docker/CLI) failed -- release will not publish.
            STATE=failure
            DESC="Upstream ${TRIGGER_CONCLUSION} blocked publish of ${TAG}"
          elif [ "$PROCEED" != "true" ] && [ "$SIBLING_FAILED" = "true" ]; then
            # Sibling workflow (the OTHER of Docker/CLI) failed/cancelled --
            # release will never publish. Mark the commit red now rather
            # than leaving a yellow dot waiting for a re-trigger that
            # cannot succeed.
            STATE=failure
            DESC="Sibling workflow blocked publish of ${TAG}"
          elif [ "$PROCEED" != "true" ]; then
            # Sibling workflow (Docker / CLI) still pending; its
            # completion will retrigger this workflow and post the
            # definitive status. Stay in `pending` so the commit row
            # does not falsely render a green check before the release
            # has actually published.
            STATE=pending
            DESC="Awaiting sibling workflow before publishing ${TAG}"
          else
            STATE=success
            DESC="Finalize-release completed for ${TAG}"
          fi

          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context=finalize-release \
            -f description="$DESC" \
            -f target_url="$RUN_URL"
