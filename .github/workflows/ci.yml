name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Path filter: detect which domains changed ──
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      docker: ${{ steps.filter.outputs.docker }}
      doc_claims: ${{ steps.filter.outputs.doc_claims }}
      runtime_stats: ${{ steps.filter.outputs.runtime_stats }}
      # release-please PRs only touch CHANGELOG.md, version.txt, and
      # the manifest. There is no source code to test, so every heavy
      # job below short-circuits on this flag and ci-pass posts success
      # immediately.
      #
      # SECURITY: branch names alone are NOT sufficient -- on a
      # `pull_request` event from a fork, `github.head_ref` is the
      # source ref name, which is fully attacker-controlled. A fork PR
      # named `release-please--evil` would otherwise short-circuit CI
      # and post a green CI Pass with no real testing. We therefore
      # gate the pull_request arm on the PR author identity (set by
      # GitHub at PR creation, not bypassable via branch naming) and
      # only fall back to ref-name detection for push / dispatch
      # events, where pushing `refs/heads/release-please--*` already
      # requires push access to the upstream.
      is_release_please: ${{ (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'synthorg-repo-bot[bot]') || (github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/release-please--')) }}
    steps:
      # fetch-depth: 0 needed by paths-filter on push: events. With a shallow
      # checkout it falls back to two back-to-back `git fetch --depth=1` calls
      # (base SHA + main) that both rewrite `.git/shallow`; the second races
      # the first and dies with `fatal: shallow file has changed since we
      # read it`. Full history skips the remote fetches entirely.
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              # WS_PROTOCOL_VERSION parity gate runs in Lint; it must
              # also fire on TS-only bumps so an out-of-sync constant
              # cannot land without the gate noticing.
              - 'web/src/utils/constants.ts'
            dashboard:
              - 'web/**'
              - 'src/synthorg/api/**'
              - 'src/synthorg/core/**'
              - 'scripts/export_openapi.py'
              - 'scripts/generate_dto_types_ts.py'
              - 'scripts/check_dto_types_ts_in_sync.py'
              - 'docs/openapi/openapi.json'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - 'web/src/api/types/openapi.gen.ts'
              - 'web/src/api/types/dtos.gen.ts'
              - 'web/src/api/types/enum-values.gen.ts'
            docker:
              - 'docker/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            # Files whose claims are guarded by the doc-drift gate. Docs-only
            # PRs that touch one of these (and nothing in `python:`) still need
            # the gate to run, otherwise a stale "100+" claim could ship.
            doc_claims:
              - 'docs/design/observability.md'
              - 'docs/design/agent-execution.md'
              - 'docs/research/control-plane-audit.md'
              - 'docs/research/acg-formalism-evaluation.md'
              - 'src/synthorg/observability/events/**'
              - 'scripts/check_doc_drift_counts.py'
            # Trigger the runtime_stats freshness gate when the YAML or
            # the gate / generator change. YAML-only edits would not
            # match the `python:` filter, so without this a manual seed
            # could land without the freshness check running.
            runtime_stats:
              - 'data/runtime_stats.yaml'
              - 'scripts/check_runtime_stats_freshness.py'
              - 'scripts/generate_runtime_stats.py'

  # ── Python: Lint ──
  lint:
    name: Lint
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Forbidden literals gate (src/synthorg)
        run: uv run python scripts/check_forbidden_literals.py

      - name: Persistence boundary gate (src/ + tests/)
        run: >-
          uv run python scripts/check_persistence_boundary.py
          --repo-root "${{ github.workspace }}"

      - name: Settings → startup wiring trace (ghost-wired settings gate)
        run: >-
          uv run python scripts/check_setting_to_startup_trace.py
          --repo-root "${{ github.workspace }}"

      - name: Dual-backend test parity gate (conformance + protocols)
        run: >-
          uv run python scripts/check_dual_backend_test_parity.py
          --repo-root "${{ github.workspace }}"

      - name: Cost-recording chokepoint gate
        run: uv run python scripts/check_provider_complete_chokepoint.py

      - name: Typed-boundary contract gate (RFC #1711)
        run: uv run python scripts/check_boundary_typed.py

      - name: WS_PROTOCOL_VERSION parity gate (Python <-> TypeScript)
        run: uv run python scripts/check_ws_protocol_version_in_sync.py

      - name: Dead API endpoints gate (frontend ↔ backend route parity)
        run: >-
          uv run python scripts/check_dead_api_endpoints.py
          --repo-root "${{ github.workspace }}"

      - name: Schema-drift gate (SQLite vs Postgres parity)
        run: uv run python scripts/check_schema_drift.py

      - name: Review-origin / issue-backref gate (src/ + tests/)
        run: uv run python scripts/check_no_review_origin_in_code.py

      - name: Migration-framing / phase-N gate (src/ + tests/)
        run: uv run python scripts/check_no_migration_framing.py

      - name: Long-running-loop kill-switch gate (src/synthorg)
        run: uv run python scripts/check_long_running_loops_have_kill_switch.py

      - name: Import-layering contracts (import-linter)
        run: uv run lint-imports --config .importlinter

  # ── Runtime Stats Freshness ──
  # Fails the build when data/runtime_stats.yaml has drifted (any
  # stats.<name>.raw differs from a freshly-fetched value) or when
  # last_generated_utc is older than the 14-day ceiling. Runs on python
  # OR runtime_stats so a YAML-only edit (e.g. a manual seed) still
  # triggers the gate.
  runtime-stats-freshness:
    name: Runtime Stats Freshness Gate
    needs: changes
    if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.runtime_stats == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Check runtime_stats freshness
        env:
          # `gh release list` / `gh api` calls inside the generator's
          # fetchers need an authenticated token; GITHUB_TOKEN is
          # sufficient for the public-repo metadata they read.
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_runtime_stats_freshness.py

  # ── Docs: Doc-claim drift gate ──
  # Runs on python OR doc_claims so a docs-only PR that bumps a guarded
  # claim (eg "100+ event constant modules") still triggers the gate.
  doc-drift:
    name: Doc Drift Gate
    needs: changes
    if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.doc_claims == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Doc count drift gate (event modules)
        run: uv run python scripts/check_doc_drift_counts.py

  # ── Schema: Drift Validation ──
  schema-validate:
    name: Schema Validation
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 needed by the "Enforce at most one new revision per
      # PR" step below: `git diff base...HEAD` uses the three-dot merge-base
      # form, which is undefined on a shallow clone (no shared ancestry).
      # Without full history the rule either misses additions or fires
      # false positives, depending on which commit happens to be the
      # shallow root. The cost (one checkout) is small; this job already
      # runs full schema-drift validation.
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Enforce at most one new revision per PR
        if: github.event_name == 'pull_request'
        env:
          GH_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$GH_BASE_REF"
          base_ref="origin/$GH_BASE_REF"
          mapfile -t new_revs < <(
            git diff --name-only --diff-filter=A "$base_ref"...HEAD -- \
              'src/synthorg/persistence/sqlite/revisions/*.sql' \
              'src/synthorg/persistence/postgres/revisions/*.sql'
          )
          sqlite_count=0
          postgres_count=0
          for rev in "${new_revs[@]}"; do
            case "$rev" in
              # Assignment form (not ``((c++))``): post-increment from 0 evaluates
              # to 0, which makes the arithmetic command exit 1 and trips
              # ``set -e`` on the first revision per backend.
              src/synthorg/persistence/sqlite/revisions/*.sql) sqlite_count=$((sqlite_count + 1)) ;;
              src/synthorg/persistence/postgres/revisions/*.sql) postgres_count=$((postgres_count + 1)) ;;
            esac
          done
          if [ "$sqlite_count" -gt 1 ] || [ "$postgres_count" -gt 1 ]; then
            echo "::error::PR adds too many new revision files (sqlite=$sqlite_count, postgres=$postgres_count). Policy allows at most one per backend."
            printf '  - %s\n' "${new_revs[@]}" >&2
            echo "" >&2
            echo "Consolidate by deleting in-progress revisions and authoring a single new revision per backend." >&2
            exit 1
          fi
          echo "OK: PR adds sqlite=$sqlite_count, postgres=$postgres_count new revision(s) (limit 1 each)."

      - name: SQLite drift detection
        run: uv run python scripts/check_schema_drift_revisions.py --backend sqlite

  # ── Python: Type Check ──
  type-check:
    name: Type Check
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: mypy
        run: uv run mypy --num-workers=4 src/ tests/

  # ── Python: OpenAPI Liveness ──
  openapi-liveness:
    name: OpenAPI Liveness
    needs: changes
    if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Assert OpenAPI export is deterministic and complete
        run: uv run python scripts/check_openapi_liveness.py

  # ── Python: Test (Unit) ──
  # Fast-signal arm: -m unit, no Docker, no Postgres. Sharded 4-way
  # via pytest-split so a hung worker only cancels its own shard (the
  # other three still upload junit + durations, preserving forensic
  # data for the recurring xdist-hang flake). Each shard collects
  # coverage; the 80% gate runs once on the combined aggregate in
  # test-coverage-aggregate. COVERAGE_CORE=sysmon switches coverage.py
  # to its sys.monitoring core (5-10x faster tracer; full line + branch
  # parity since coverage 7.7 -- pinned 7.14.0).
  test-unit:
    name: Test Unit (shard ${{ matrix.shard }})
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    # Healthy wall-clock per shard is ~2-3 min (114-120s observed on the
    # un-stuck shards). The previous 15-min slack existed only because
    # ``pytest-timeout method=signal`` could not kill an async hang and
    # the job had to be reaped by GHA's job timeout. With
    # ``timeout_method = "thread"`` in pyproject.toml the per-test
    # timeout (30s) actually fires for blocked awaits, so a runaway
    # shard now fails fast with a named test instead of burning 12+ min
    # of compute. 5 min preserves a 2x cushion over the observed normal
    # runtime; any later regression that legitimately needs more should
    # land here with the duration data justifying it.
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      COVERAGE_FILE: .coverage.unit-${{ matrix.shard }}
      COVERAGE_CORE: sysmon
      # ``PYTHONFAULTHANDLER=1`` arms ``faulthandler`` at interpreter
      # startup, BEFORE conftest loads. Without this, a crash during
      # module import or before ``faulthandler.enable`` runs leaves zero
      # forensic data. ``PYTHONUNBUFFERED=1`` flushes stdout/stderr
      # line-by-line so a worker that dies (e.g. ``pytest-timeout``
      # ``thread`` method terminating it on a 30s test hang) cannot
      # take its last-words stack dump down with it via a half-flushed
      # buffer. Both add zero runtime cost.
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - uses: ./.github/actions/warm-tree-sitter-cache

      # Enable user-process core dumps. Ubuntu runners ship with
      # ``ulimit -c 0`` (disabled). With ``-c unlimited`` any SIGSEGV /
      # SIGABRT / SIGBUS that kills a worker leaves a binary core file
      # we can later ``gdb -ex bt`` against. ``sysctl
      # kernel.core_pattern`` writes them to the workspace so the
      # post-step artifact upload picks them up.
      - name: Enable core dumps
        run: |
          ulimit -c unlimited
          ulimit -a
          # ``core_pattern`` must be an absolute path on disk we control;
          # the default ``|/usr/share/apport/apport ...`` pipes through
          # apport which is not installed on hosted runners.
          sudo bash -c 'echo "/home/runner/work/synthorg/synthorg/core.%e.%p.%t" > /proc/sys/kernel/core_pattern'
          cat /proc/sys/kernel/core_pattern

      # --cov-fail-under=0 overrides pyproject's [tool.coverage.report]
      # fail_under=80, which pytest-cov otherwise applies at end-of-session
      # even with an empty --cov-report=. A single marker slice never reaches
      # 80% alone; the gate belongs solely to test-coverage-aggregate. Every
      # per-suite arm below carries the same override for the same reason.
      #
      # --splits/--group come from pytest-split; --durations-path points
      # at .test_durations.unit (empty {} on first run, falls back to
      # count-based partition until CI populates real timings).
      #
      # ``-v`` prints every test's nodeid as it starts, so the LAST
      # printed test before ``[gwN] node down`` names the suspect.
      # ``-s`` (``--capture=no``) disables pytest's per-test capture
      # buffer; without this, the all-threads stack dump that
      # ``pytest-timeout`` ``thread`` method emits before terminating
      # the worker is captured into a buffer that is dropped when the
      # worker process exits. With ``-s`` the dump goes straight
      # through xdist's worker-stderr channel to the controller log.
      - name: Run unit tests (shard ${{ matrix.shard }}/4)
        run: |
          # Inherit the parent shell's core-dump rlimit (the previous
          # step already raised it; ``ulimit`` is per-shell, so we
          # re-assert here in case GHA respawns the shell).
          ulimit -c unlimited
          uv run python -m pytest tests/ \
            -m unit \
            -n auto \
            --max-worker-restart=0 \
            --splits 4 \
            --group ${{ matrix.shard }} \
            --durations-path .test_durations.unit \
            --cov=synthorg \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml=junit-unit-${{ matrix.shard }}.xml \
            --durations=20 \
            --durations-min=1.0 \
            -v \
            -s

      # Critical safety net: pytest can exit 0 with zero tests run.
      # PR #2080 reproduced this -- 3 of 4 xdist workers crashed during
      # pytest_sessionstart, master saw "no test failures" and exited 0,
      # the job was marked success despite junit-unit-N.xml showing
      # tests="0". Without this gate, a CI session that silently runs
      # ZERO tests passes the green-checkmark check. We MUST surface
      # that as a hard failure.
      - name: Sanity check (junit shows tests > 0)
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("junit-unit-*.xml"))
          if not files:
              print("FAIL: no junit-unit-*.xml files found", file=sys.stderr)
              sys.exit(1)
          total = 0
          for f in files:
              tree = ET.parse(f)
              for ts in tree.iter("testsuite"):
                  total += int(ts.get("tests", 0))
          print(f"junit total tests: {total} across {len(files)} file(s)")
          if total == 0:
              print(
                  "FAIL: junit reports zero tests across all files; "
                  "something prevented tests from running.",
                  file=sys.stderr,
              )
              sys.exit(1)

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-unit-${{ matrix.shard }}
          path: .coverage.unit-${{ matrix.shard }}*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-unit-${{ matrix.shard }}
          path: junit-unit-${{ matrix.shard }}.xml

      # Upload any core dumps that landed in the workspace, on
      # success OR failure. Previously gated on ``failure() ||
      # cancelled()`` but PR #2080 demonstrated a "success-with-zero-
      # tests" failure mode: workers crashed via os.abort (producing
      # cores), pytest exited 0, GHA marked the step success, the
      # gated upload was SKIPPED, the cores were lost. ``!cancelled()``
      # uploads on every non-cancelled exit. ``if-no-files-found:
      # ignore`` keeps a genuinely-green job's tail clean. Retention is
      # short (3 days) because core dumps can be large and the value
      # decays rapidly once the crash is diagnosed.
      - name: Upload core dumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-dumps-unit-${{ matrix.shard }}
          path: core.*
          if-no-files-found: ignore
          retention-days: 3

  # ── Python: Test (Integration) ──
  # Sharded 4-way so 12-minute single-runner wall-clock drops to ~3
  # minutes critical path. A GitHub Actions ``services: postgres``
  # block exposes postgres:18-alpine to each shard via TCP localhost
  # plus the SYNTHORG_TEST_POSTGRES_* env vars; the conftest fixtures
  # (``tests/conformance/persistence/conftest.py`` and
  # ``tests/integration/persistence/conftest.py``) detect those env
  # vars and bypass the local testcontainers start-up dance. Local-dev
  # test runs leave the env vars unset and keep using testcontainers.
  # TimescaleDB tests still use testcontainers because the service
  # container path cannot host the timescale/timescaledb image.
  test-integration:
    name: Test Integration (shard ${{ matrix.shard }})
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
        env:
          POSTGRES_USER: synthorg
          POSTGRES_PASSWORD: synthorg-test
          POSTGRES_DB: synthorg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthorg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COVERAGE_FILE: .coverage.integration-${{ matrix.shard }}
      COVERAGE_CORE: sysmon
      SYNTHORG_TEST_POSTGRES_HOST: localhost
      SYNTHORG_TEST_POSTGRES_PORT: "5432"
      SYNTHORG_TEST_POSTGRES_USER: synthorg
      SYNTHORG_TEST_POSTGRES_PASSWORD: synthorg-test
      SYNTHORG_TEST_POSTGRES_DB: synthorg
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - uses: ./.github/actions/install-postgres-18-client

      - uses: ./.github/actions/warm-tree-sitter-cache

      - name: Postgres drift detection
        run: uv run python scripts/check_schema_drift_revisions.py --backend postgres

      # Mirror test-unit's forensic plumbing -- see the long comment on
      # that step (line ~374) for the full rationale. Without this,
      # SIGABRT from our pytest-timeout monkey-patch (tests/conftest.py)
      # produces no core file and the "Upload core dumps" step below
      # has nothing to upload. Confirmed gap on main CI run
      # 26390141124 / job 77677668898 (2026-05-25 integration shard 4
      # crash): event loop hang in test_distributed_path_nats, abort
      # fired, no core artefact landed because this step was missing.
      - name: Enable core dumps
        run: |
          ulimit -c unlimited
          ulimit -a
          sudo bash -c 'echo "/home/runner/work/synthorg/synthorg/core.%e.%p.%t" > /proc/sys/kernel/core_pattern'
          cat /proc/sys/kernel/core_pattern

      # ``-k "not [sqlite-"`` drops the SQLite parametrisation of the
      # dual-backend ``backend`` fixture in tests/conformance/persistence/;
      # the dedicated ``test-conformance-sqlite`` job already covers that
      # arm, so running it again here is pure duplicate work.
      #
      # ``--splits/--group`` come from pytest-split with .test_durations.integration
      # (empty {} on first run, falls back to count-based partition until
      # CI populates real timings).
      #
      # ``-v -s`` mirrors test-unit: ``-v`` prints every nodeid so the
      # last printed test before ``[gwN] node down`` names the suspect,
      # ``-s`` disables ``capture=fd`` so our pytest-timeout monkey-patch
      # banner + explicit faulthandler.dump_traceback output survive on
      # CI (see [[project-pytest-timeout-xdist-log-loss]]).
      - name: Run integration tests (shard ${{ matrix.shard }}/4)
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: |
          ulimit -c unlimited
          uv run python -m pytest tests/ \
            -m integration \
            -k "not [sqlite-" \
            -n auto \
            --max-worker-restart=0 \
            --splits 4 \
            --group ${{ matrix.shard }} \
            --durations-path .test_durations.integration \
            --cov=synthorg \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml=junit-integration-${{ matrix.shard }}.xml \
            --durations=20 \
            --durations-min=1.0 \
            -v \
            -s

      # See identical step in test-unit for the reason this gate exists.
      - name: Sanity check (junit shows tests > 0)
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("junit-integration-*.xml"))
          if not files:
              print("FAIL: no junit-integration-*.xml files found", file=sys.stderr)
              sys.exit(1)
          total = 0
          for f in files:
              tree = ET.parse(f)
              for ts in tree.iter("testsuite"):
                  total += int(ts.get("tests", 0))
          print(f"junit total tests: {total} across {len(files)} file(s)")
          if total == 0:
              print(
                  "FAIL: junit reports zero tests across all files; "
                  "something prevented tests from running.",
                  file=sys.stderr,
              )
              sys.exit(1)

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-integration-${{ matrix.shard }}
          path: .coverage.integration-${{ matrix.shard }}*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-integration-${{ matrix.shard }}
          path: junit-integration-${{ matrix.shard }}.xml

      # Mirror test-unit. Uploads on non-cancelled exit (success OR
      # failure) so a SIGABRT under our pytest-timeout monkey-patch
      # always surfaces a core artefact regardless of how pytest
      # reports the session outcome. ``if-no-files-found: ignore``
      # keeps a clean run quiet.
      - name: Upload core dumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-dumps-integration-${{ matrix.shard }}
          path: core.*
          if-no-files-found: ignore
          retention-days: 3

  # ── Python: Test (E2E) ──
  # Same service-container Postgres path as test-integration so the
  # conftest fixtures bypass testcontainers. Not sharded; e2e is small
  # (~3 min historically) and matrix overhead would mostly cancel the
  # wall-clock saving.
  test-e2e:
    name: Test E2E
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
        env:
          POSTGRES_USER: synthorg
          POSTGRES_PASSWORD: synthorg-test
          POSTGRES_DB: synthorg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthorg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COVERAGE_FILE: .coverage.e2e
      COVERAGE_CORE: sysmon
      SYNTHORG_TEST_POSTGRES_HOST: localhost
      SYNTHORG_TEST_POSTGRES_PORT: "5432"
      SYNTHORG_TEST_POSTGRES_USER: synthorg
      SYNTHORG_TEST_POSTGRES_PASSWORD: synthorg-test
      SYNTHORG_TEST_POSTGRES_DB: synthorg
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - uses: ./.github/actions/install-postgres-18-client

      - uses: ./.github/actions/warm-tree-sitter-cache

      - name: Postgres drift detection
        run: uv run python scripts/check_schema_drift_revisions.py --backend postgres

      # See test-unit (line ~374) for the rationale on core dumps.
      - name: Enable core dumps
        run: |
          ulimit -c unlimited
          ulimit -a
          sudo bash -c 'echo "/home/runner/work/synthorg/synthorg/core.%e.%p.%t" > /proc/sys/kernel/core_pattern'
          cat /proc/sys/kernel/core_pattern

      # ``-v -s`` mirrors test-unit: nodeid echo + capture-off so the
      # pytest-timeout monkey-patch banner survives. See
      # [[project-pytest-timeout-xdist-log-loss]].
      - name: Run e2e tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: |
          ulimit -c unlimited
          uv run python -m pytest tests/ \
            -m e2e \
            -n auto \
            --max-worker-restart=0 \
            --cov=synthorg \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml=junit-e2e.xml \
            --durations=20 \
            --durations-min=1.0 \
            -v \
            -s

      # See identical step in test-unit for the reason this gate exists.
      - name: Sanity check (junit shows tests > 0)
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("junit-e2e.xml")
          if not path.exists():
              print("FAIL: junit-e2e.xml not found", file=sys.stderr)
              sys.exit(1)
          total = 0
          for ts in ET.parse(path).iter("testsuite"):
              total += int(ts.get("tests", 0))
          print(f"junit total tests: {total}")
          if total == 0:
              print(
                  "FAIL: junit reports zero tests; "
                  "something prevented tests from running.",
                  file=sys.stderr,
              )
              sys.exit(1)

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-e2e
          path: .coverage.e2e*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-e2e
          path: junit-e2e.xml

      - name: Upload core dumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-dumps-e2e
          path: core.*
          if-no-files-found: ignore
          retention-days: 3

  # ── Python: Test (Conformance, SQLite arm) ──
  # No-Docker SQLite-only slice of the dual-backend persistence
  # conformance suite, so the lowest-cost backend is always exercised
  # early even when the Postgres testcontainer infra is flaky. The
  # ``backend`` fixture is parametrised ["sqlite", "postgres"]; -k "not
  # postgres" deselects the postgres ids so the container fixture is
  # never triggered. The full dual-backend conformance still runs inside
  # test-integration via -m integration.
  test-conformance-sqlite:
    name: Test Conformance (SQLite)
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      COVERAGE_FILE: .coverage.conformance-sqlite
      COVERAGE_CORE: sysmon
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      # See test-unit (line ~374) for the rationale on core dumps.
      - name: Enable core dumps
        run: |
          ulimit -c unlimited
          ulimit -a
          sudo bash -c 'echo "/home/runner/work/synthorg/synthorg/core.%e.%p.%t" > /proc/sys/kernel/core_pattern'
          cat /proc/sys/kernel/core_pattern

      # ``-v -s`` mirrors test-unit: nodeid echo + capture-off so the
      # pytest-timeout monkey-patch banner survives. See
      # [[project-pytest-timeout-xdist-log-loss]].
      - name: Run SQLite conformance tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: |
          ulimit -c unlimited
          uv run python -m pytest tests/conformance/persistence \
            -m integration \
            -k "not postgres" \
            -n auto \
            --max-worker-restart=0 \
            --cov=synthorg \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml=junit-conformance-sqlite.xml \
            --durations=20 \
            --durations-min=1.0 \
            -v \
            -s

      # See identical step in test-unit for the reason this gate exists.
      - name: Sanity check (junit shows tests > 0)
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("junit-conformance-sqlite.xml")
          if not path.exists():
              print(
                  "FAIL: junit-conformance-sqlite.xml not found",
                  file=sys.stderr,
              )
              sys.exit(1)
          total = 0
          for ts in ET.parse(path).iter("testsuite"):
              total += int(ts.get("tests", 0))
          print(f"junit total tests: {total}")
          if total == 0:
              print(
                  "FAIL: junit reports zero tests; "
                  "something prevented tests from running.",
                  file=sys.stderr,
              )
              sys.exit(1)

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-conformance-sqlite
          path: .coverage.conformance-sqlite*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-conformance-sqlite
          path: junit-conformance-sqlite.xml

      - name: Upload core dumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-dumps-conformance-sqlite
          path: core.*
          if-no-files-found: ignore
          retention-days: 3

  # ── Python: Test Coverage Aggregate ──
  # The single, airtight 80% gate. Runs only when all four test arms
  # succeed (default needs semantics, no if: always()), so coverage is
  # never computed on partial data. Codecov stays best-effort and is
  # never the gate; ``coverage report --fail-under=80`` is.
  test-coverage-aggregate:
    name: Test Coverage Aggregate
    needs: [changes, test-unit, test-integration, test-e2e, test-conformance-sqlite]
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required for tokenless Codecov upload via use_oidc: true.
      id-token: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: test-results-*
          merge-multiple: true
          path: test-results

      # Hard no-missed-coverage assertion. Every split arm MUST have
      # contributed a data file before the gate runs; a silently dropped
      # suite (or all shards of a sharded suite) would shrink the report
      # yet could still clear --fail-under on the remaining suites (a
      # false green). Fail loudly instead.
      #
      # Sharded arms (unit, integration) contribute multiple files like
      # .coverage.unit-1, .coverage.unit-2, ... -- the glob ``unit*``
      # matches all of them. We also assert an EXPECTED shard count so
      # a silently-dropped single shard (e.g. one matrix cell cancelled
      # by a hang) still fails the gate.
      - name: Assert all suites contributed coverage
        run: |
          set -euo pipefail
          missing=""
          for suite in unit integration e2e conformance-sqlite; do
            if ! compgen -G "coverage-data/.coverage.${suite}*" > /dev/null; then
              missing="${missing} ${suite}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Missing coverage data for suite(s):${missing}. Refusing to compute the 80% gate on partial data."
            ls -la coverage-data || true
            exit 1
          fi
          # Assert sharded arms contributed every shard (4 each).
          # The expected count 4 MUST stay in sync with the
          # `strategy.matrix.shard: [1, 2, 3, 4]` definitions on the
          # `test-unit` and `test-integration` jobs above. If a future
          # change grows or shrinks the matrix, update this number too.
          for sharded in unit integration; do
            count=$(compgen -G "coverage-data/.coverage.${sharded}-*" | wc -l || echo 0)
            if [ "${count}" -lt 4 ]; then
              echo "::error::Sharded suite ${sharded} contributed ${count} shard(s); expected 4. Refusing to compute the 80% gate on partial data."
              ls -la coverage-data || true
              exit 1
            fi
          done
          echo "All four suites contributed coverage data (unit + integration sharded 4/4)."

      - name: Inspect coverage data files (forensic)
        run: |
          # List every downloaded .coverage* file with its size so we can
          # see at a glance which shards produced data and how much. The
          # aggregate gate has been silently dropping per-shard files
          # (PR #2080: "Combined 7 files, skipped 3" -> 70% on a suite
          # that should be ~90%); without this listing, the combine step
          # gives no signal about which shard's coverage was lost.
          ls -laR coverage-data || true
          echo "--- file count by shard prefix ---"
          # ``-A`` is required: every per-shard data file is named
          # ``.coverage.<suite>-<shard>``, leading dot. A plain ``ls``
          # hides them and the sed/sort/uniq pipe input is empty,
          # which is what we observed on PR #2080 (the "file count by
          # shard prefix" line printed and then nothing followed). ``-A``
          # includes dotfiles but excludes ``.`` and ``..``.
          ls -A coverage-data 2>/dev/null \
            | sed -E 's/\.[0-9a-f]+\.[0-9]+\.[0-9a-f]+$//' \
            | sort | uniq -c | sort -rn || true

      - name: Combine coverage
        # ``--debug=dataio,process`` writes the path of each file
        # combined or skipped to stderr; without it the bare ``Combined
        # N files, skipped M`` message hides which file was rejected and
        # why. Each line is a single forensic record we can read out of
        # the GHA log.
        run: uv run coverage combine --debug=dataio,process coverage-data

      - name: Enforce 80% aggregate coverage gate
        run: uv run coverage report --show-missing --fail-under=80

      - name: Generate combined coverage XML
        run: uv run coverage xml -o coverage.xml

      # Codecov upload is best-effort -- CI must not fail on Codecov
      # outages. The 80% enforcement above is Codecov-independent. This
      # is the ONLY Codecov coverage upload in the workflow: one combined
      # report, so the Codecov project view is never fragmented across
      # partial per-suite uploads. Tokenless OIDC (public repo).
      - name: Upload combined coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
          use_oidc: true

      - name: Collect junit file list
        id: junit
        run: |
          set -euo pipefail
          # Each sharded arm produces junit-${suite}-${shard}.xml; e2e and
          # conformance-sqlite contribute single files. Build a CSV that
          # Codecov consumes. The earlier "Assert all suites contributed
          # coverage" step already fails the job when any suite or shard
          # dropped its artifact, so the loop below is a belt-and-braces
          # guard for the junit upload path specifically.
          files=$(ls test-results/junit-*.xml 2>/dev/null | paste -sd, || true)
          if [ -z "${files}" ]; then
            echo "::error::No junit XML files found under test-results/. Refusing to upload an empty file list to Codecov."
            exit 1
          fi
          echo "files=${files}" >> "${GITHUB_OUTPUT}"
          echo "Uploading: ${files}"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: ${{ steps.junit.outputs.files }}
          fail_ci_if_error: false
          report_type: test_results
          use_oidc: true

      - name: Upload combined coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-combined
          path: |
            coverage.xml
            .coverage
          include-hidden-files: true

  # ── Python: Security Audit ──
  python-audit:
    name: Python Security Audit
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Assert ignored advisories remain non-actionable
        # pip-audit --ignore-vuln suppresses an advisory by ID
        # unconditionally; if the conditions justifying the suppression
        # stop holding (markdown downgraded below the patched line,
        # MIN_SECRET_LENGTH guard removed, ...) the ignore would
        # silently hide a real regression. These pre-flight assertions
        # fail the job before pip-audit runs if either condition
        # changes, so the ignore list cannot rot into a security gap.
        run: |
          uv run python - <<'PY'
          from importlib.metadata import version

          markdown_version = tuple(int(p) for p in version("Markdown").split(".")[:3])
          assert markdown_version >= (3, 8, 1), (
              "PYSEC-2026-89 ignore is only safe at Markdown >= 3.8.1; "
              f"installed Markdown is {version('Markdown')}"
          )

          from synthorg.core.auth.config import MIN_SECRET_LENGTH

          assert MIN_SECRET_LENGTH >= 32, (
              "PYSEC-2025-183 ignore relies on MIN_SECRET_LENGTH >= 32 as the "
              f"compensating control; current value is {MIN_SECRET_LENGTH}"
          )
          PY

      - name: pip-audit
        # Ignored vulnerabilities (revisit whenever upstream publishes a fix):
        # - GHSA-xqmj-j6mv-4862: litellm 1.83.0 is pinned by project decision;
        #   fix is in 1.83.7 but the pin is load-bearing for this repo.
        # - CVE-2026-3219: pip 26.0.1 vulnerability with no upstream fix
        #   version available yet. pip is a transitive of uv in this repo.
        # - PYSEC-2026-89: markdown DoS via malformed HTML; affected versions
        #   are <= 3.8 with fix in 3.8.1 per the OSV record. The project is on
        #   markdown 3.10.2, which is past the patched line; pip-audit is
        #   misreporting the version range. The pre-flight assertion above
        #   keeps this ignore safe by failing if markdown is ever downgraded
        #   below 3.8.1.
        # - PYSEC-2025-183: pyjwt weak-encryption advisory disputed by the
        #   maintainer (key length is the application's responsibility). This
        #   project enforces MIN_SECRET_LENGTH via
        #   src/synthorg/core/auth/config.py::_require_valid_secret, which
        #   addresses the disputed concern. The pre-flight assertion above
        #   keeps this ignore safe by failing if MIN_SECRET_LENGTH drops
        #   below 32 (the project's enforced minimum).
        # - PYSEC-2022-42969: regex DoS in py.path. py is unmaintained
        #   upstream with no fix version available, pulled in as a transitive
        #   of the modularity-gate dev tooling. synthorg never imports py
        #   directly and the vulnerable py.path.svnurl / svnwc surfaces are
        #   not reachable through anything we ship; ignoring is the only path
        #   to a green pip-audit until the consuming tool drops py as a dep.
        run: |
          uv run pip-audit \
            --ignore-vuln GHSA-xqmj-j6mv-4862 \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln PYSEC-2026-89 \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln PYSEC-2022-42969

  # ── Docker: Dockerfile Lint ──
  dockerfile-lint:
    name: Dockerfile Lint
    needs: changes
    if: (needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: docker/backend/Dockerfile

      - name: Lint sandbox Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: docker/sandbox/Dockerfile

  # ── OpenAPI: export once, share with dashboard arm ──
  # scripts/export_openapi.py was previously re-run in dashboard-type-check,
  # dashboard-test, AND dashboard-build, each paying for a fresh uv sync.
  # The export is deterministic given pinned backend code, so a single
  # upstream job + actions/upload-artifact lets the downstream Node-only
  # jobs skip the Python env spin-up entirely. Runs on python OR dashboard
  # changes (the dashboard filter already includes src/synthorg/api/**).
  export-openapi:
    name: Export OpenAPI Schema
    needs: changes
    if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Export OpenAPI schema
        run: uv run python scripts/export_openapi.py

      - name: Upload OpenAPI schema artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-schema
          path: docs/openapi/openapi.json
          if-no-files-found: error

  # ── Dashboard: Lint ──
  dashboard-lint:
    name: Dashboard Lint
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run lint:circular
        working-directory: web

  # ── Dashboard: Type Check ──
  dashboard-type-check:
    name: Dashboard Type Check
    needs: [changes, export-openapi]
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Download OpenAPI schema artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openapi-schema
          path: docs/openapi
      - run: npm ci
        working-directory: web
      - run: npm run type-check
        working-directory: web

  # ── Dashboard: Test ──
  dashboard-test:
    name: Dashboard Test
    needs: [changes, export-openapi]
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    # Re-baselined 2026-05-28 from 15 -> 30 minutes after EPIC #2066 D2a
    # decomposition (PR #2154) grew the affected vitest universe past the
    # 15-min wall (per-file gzip overhead from the 24 newly-extracted
    # controller hooks pulled in more component-render coverage). Two
    # consecutive Dashboard Test cancellations on dfad8c49 and ccd733ab
    # both hit exactly 15m13s of wall-clock with vitest still iterating
    # through the suite -- not a hang, just a budget overrun. Same
    # justification pattern as the .size-limit.cjs re-baseline.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Download OpenAPI schema artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openapi-schema
          path: docs/openapi
      - run: npm ci
        working-directory: web
      - name: Run Vitest (active-handle detection is part of the test run)
        working-directory: web
        env:
          # Disable colour output so the active-handle reporter's summary
          # lands as plain ASCII in CI logs (helpful for downstream
          # log-scrapers and the on-failure artifact upload).
          NO_COLOR: '1'
          # Pin the active-handle gate's mode explicitly so a shell
          # default of ACTIVE_HANDLE_MODE=log on the runner cannot
          # silently downgrade the gate from blocking to advisory.
          ACTIVE_HANDLE_MODE: 'fail'
        run: npm run test -- --coverage
      - name: Upload active-handle telemetry artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-active-handle-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/.test-tmp/handle-telemetry.json
          if-no-files-found: warn
          retention-days: 30

  # ── Dashboard: Build ──
  dashboard-build:
    name: Dashboard Build
    needs: [changes, export-openapi]
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Download OpenAPI schema artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openapi-schema
          path: docs/openapi
      # The DTO drift gate (check_dto_types_ts_in_sync.py) is the
      # only step in this job that needs the Python env; type-check
      # and test don't.
      - name: Set up Python + uv (DTO drift gate)
        uses: ./.github/actions/setup-python-uv
      - run: npm ci
        working-directory: web
      - name: DTO TypeScript drift gate
        run: uv run python scripts/check_dto_types_ts_in_sync.py
      - name: Production build
        run: npm run build
        working-directory: web
      # Bundle-size budgets are enforced inside the same job to reuse
      # the just-built ``dist/`` artifact -- a separate job would have
      # to ``npm ci`` + ``npm run build`` again, doubling Vite's
      # cost (~2-3 min) per PR.
      - name: size-limit budget check
        run: npm run size
        working-directory: web

  # ── Dashboard: Security Audit ──
  dashboard-audit:
    name: Dashboard Security Audit
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: npm audit (critical + high)
        run: npm audit --audit-level=high
        working-directory: web

  # ── Dashboard: Storybook Build ──
  dashboard-storybook-build:
    name: Dashboard Storybook Build
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Run npm run storybook:build -- --disable-telemetry
        run: npm run storybook:build -- --disable-telemetry
        working-directory: web
        env:
          # Prevent OOM-induced crashes on CI runners with limited RAM.
          # --report-on-fatalerror captures Node.js-level crashes (OOM,
          # assertions) but NOT native addon SIGSEGV -- those need OS
          # core dumps. --report-directory ensures reports land in a
          # predictable location for artifact upload.
          NODE_OPTIONS: "--max-old-space-size=4096 --report-on-fatalerror --report-directory=."
      - name: Upload Node.js crash report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-crash-report
          path: web/report.*.json
          if-no-files-found: ignore

  # ── Branch-protection drift audit ──
  # Compares live rulesets against .github/branch_protection.yml. Runs on
  # push to main (informational) and workflow_dispatch. continue-on-error
  # for now so benign drift in the spec's initial capture does not block
  # every push; promote to blocking once the spec has survived 30 days
  # of zero-drift runs (tracked in #1555).
  #
  # Authentication: the GitHub rulesets REST API requires a token with
  # ``administration: read`` scope. GITHUB_TOKEN cannot be granted that
  # scope via workflow permissions, so the job mints a fresh
  # ``synthorg-repo-bot`` App installation token via the shared
  # ``release-runner-setup`` composite. The App's scope is already
  # Contents RW + PRs RW + Metadata R (see docs/reference/github-
  # environments.md); rulesets are accessible to any installation with
  # metadata read, which is sufficient for this read-only audit.
  branch-protection-audit:
    name: Branch-protection drift audit
    # Accept push-to-main (informational) AND workflow_dispatch from
    # main so the audit can be triggered ad-hoc from Actions -> "CI"
    # -> Run workflow. The ``release`` environment's branch policy
    # also restricts deploys to main, so allowing this job to attempt
    # a deploy from a non-main ref would surface a noisy "deployment
    # was rejected" annotation on every CI run dispatched against a
    # release-please branch (the standard nudge used by release.yml
    # to trigger CI on App-token-authored PRs). Gate at the if: check
    # so non-main dispatches simply skip this job.
    #
    # Fork gate: skip in forks. The audit needs the release-bot App
    # token (env-scoped secret on `release`) and a fork won't have it.
    # ci-preflight reports the missing setup separately.
    #
    # Precedence: `&&` binds tighter than `||`, so the inner
    # parentheses around `(push || dispatch)` are required to keep
    # the trigger-OR group intact under the outer fork-AND-main-AND.
    if: >-
      !github.event.repository.fork
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    environment: release
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Release runner setup
        id: setup
        uses: ./.github/actions/release-runner-setup
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          # Read-only audit of the GitHub rulesets API; metadata:read is
          # the minimum scope sufficient for that surface.
          permission-metadata: read
      - name: Install yq
        run: |
          set -euo pipefail
          # yq (Mike Farah) -- Go binary, no runtime deps.  Retry on
          # transient GitHub-releases CDN flakes.
          sudo curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Audit
        id: audit
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
        run: bash scripts/audit_branch_protection.sh

      # The job-level `continue-on-error: true` above silences the audit
      # step's failure entirely during the #1555 stabilization window,
      # which means real drift could ship invisibly. Surface a warning
      # annotation when the audit detected drift; the warning shows up
      # in the run summary and check-run UI even though the job stays
      # green per #1555. Promote the job to blocking once #1555 closes
      # the 30-day zero-drift window.
      - name: Report drift outcome
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" = "failure" ]; then
            echo "::warning::Branch-protection drift detected -- see Audit step log. Job stays green via job-level continue-on-error during the #1555 stabilization window; promote to blocking once the spec has survived 30 days of zero-drift runs."
          fi

  # ── Gate: all required checks passed ──
  ci-pass:
    name: CI Pass
    if: always()
    needs: [changes, lint, doc-drift, runtime-stats-freshness, schema-validate, type-check, openapi-liveness, export-openapi, test-unit, test-integration, test-e2e, test-conformance-sqlite, test-coverage-aggregate, python-audit, dockerfile-lint, dashboard-lint, dashboard-type-check, dashboard-test, dashboard-build, dashboard-audit, dashboard-storybook-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          # Jobs that were skipped (not needed) count as passing.
          # Only "failure" is a real failure.
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.lint.result }}
            ${{ needs.doc-drift.result }}
            ${{ needs.runtime-stats-freshness.result }}
            ${{ needs.schema-validate.result }}
            ${{ needs.type-check.result }}
            ${{ needs.openapi-liveness.result }}
            ${{ needs.export-openapi.result }}
            ${{ needs.test-unit.result }}
            ${{ needs.test-integration.result }}
            ${{ needs.test-e2e.result }}
            ${{ needs.test-conformance-sqlite.result }}
            ${{ needs.test-coverage-aggregate.result }}
            ${{ needs.python-audit.result }}
            ${{ needs.dockerfile-lint.result }}
            ${{ needs.dashboard-lint.result }}
            ${{ needs.dashboard-type-check.result }}
            ${{ needs.dashboard-test.result }}
            ${{ needs.dashboard-build.result }}
            ${{ needs.dashboard-audit.result }}
            ${{ needs.dashboard-storybook-build.result }}
        run: |
          # Any "failure" or "cancelled" in the results means CI failed.
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed. Job results: $RESULTS"
            exit 1
          fi
          echo "All CI checks passed (some may have been skipped due to path filters)"
