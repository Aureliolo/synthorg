name: Verify - Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The required `CI Pass` context must report on the merge-queue ref so a
  # dropped pull_request dispatch on a PR head can never permanently block a
  # merge: with a merge queue the gate is evaluated on the `merge_group` event
  # at merge time, under GitHub's control, not on the fragile one-shot
  # per-head dispatch. See docs/reference/claude-reference.md (Merge queue).
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Path filter: detect which domains changed ──
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
      # release-please PRs only touch CHANGELOG.md, version.txt, and
      # the manifest. There is no source code to test, so every heavy
      # job below short-circuits on this flag and ci-pass posts success
      # immediately.
      #
      # SECURITY: branch names alone are NOT sufficient -- on a
      # `pull_request` event from a fork, `github.head_ref` is the
      # source ref name, which is fully attacker-controlled. A fork PR
      # named `release-please--evil` would otherwise short-circuit CI
      # and post a green CI Pass with no real testing. We therefore
      # gate the pull_request arm on the PR author identity (set by
      # GitHub at PR creation, not bypassable via branch naming) and
      # only fall back to ref-name detection for push / dispatch
      # events, where pushing `refs/heads/release-please--*` already
      # requires push access to the upstream.
      is_release_please: ${{ (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'synthorg-repo-bot[bot]') || (github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/release-please--')) }}
    steps:
      # fetch-depth: 0 needed by paths-filter on push: events. With a shallow
      # checkout it falls back to two back-to-back `git fetch --depth=1` calls
      # (base SHA + main) that both rewrite `.git/shallow`; the second races
      # the first and dies with `fatal: shallow file has changed since we
      # read it`. Full history skips the remote fetches entirely.
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          # On `merge_group` the event is neither push nor pull_request, so
          # paths-filter cannot infer what to diff: tell it explicitly. Both
          # expressions are empty (falsy) on push / pull_request, where the
          # action keeps its existing default detection; they are populated
          # only inside the merge queue. The merge-group head is main-tip +
          # queued commits, so base_sha is an ancestor of head_sha and the
          # fetch-depth: 0 checkout above has the history to diff them.
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          # Only the `dashboard` filter survives: every correctness job is
          # de-conditioned (cardinal rule), so the python / docker / doc_claims
          # / runtime_stats filters had no consumer left. `dashboard` still
          # path-scopes the pure dashboard build/artifact jobs.
          filters: |
            dashboard:
              - 'web/**'
              - 'src/synthorg/api/**'
              - 'src/synthorg/core/**'
              - 'scripts/export_openapi.py'
              - 'scripts/generate_dto_types_ts.py'
              - 'scripts/check_dto_types_ts_in_sync.py'
              - 'docs/openapi/openapi.json'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/actions/**'
              - '.github/workflows/verify-backend.yml'
              - 'web/src/api/types/openapi.gen.ts'
              - 'web/src/api/types/dtos.gen.ts'
              - 'web/src/api/types/enum-values.gen.ts'

  # ── Python: Lint ──
  lint:
    name: Gates (pre-commit all-files + parity)
    needs: changes
    # CARDINAL RULE: a correctness gate must never be conditioned on which
    # files changed -- a shallow-checkout race in dorny/paths-filter can
    # falsely report "unchanged" and silently drop the gate. This job runs
    # the entire gate suite on every push (release-please bot PRs excepted,
    # which only bump versions). Enforced by check_local_ci_parity.py.
    if: needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Hooks NOT run by the all-files steps below: each is covered by a
      # dedicated CI job (Go in verify-cli.yml, dashboard lint, secrets, etc.) or is a
      # developer-clone git-state hook with no CI meaning (the three migration /
      # rebase checks need origin/main + a base ref this shallow checkout lacks;
      # they fail closed in CI rather than gating content). check_local_ci_parity.py
      # enforces that this SKIP list equals _COVERED_ELSEWHERE u _LOCAL_ONLY
      # exactly. The two all-files steps share this one job-level SKIP so a hook
      # can never be skipped at one stage but silently run at another.
      SKIP: go-vet,go-test,golangci-lint,web-checks,dto-types-ts-in-sync,lychee,hadolint-docker,gitleaks,zizmor,mypy,pytest-unit,vale,caddy-validate,check-single-migration-per-pr,check-no-modify-migration,check-push-rebased
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Full history: the comparison-md sync gate regenerates
          # docs/reference/comparison.md, whose "Last updated" line is
          # auto-derived from `git log -1 -- data/competitors.yaml`. A
          # shallow checkout cannot see that file's last-touch commit when
          # comparison.md is regenerated in a later commit, so the generator
          # falls back to today's date and the gate reports a false drift.
          fetch-depth: "0"
      - uses: ./.github/actions/setup-python-uv

      # Local <-> CI parity: every pre-commit / pre-push hook must have a CI
      # counterpart so `git push --no-verify` cannot bypass it. These two steps
      # run the hybrid set (ruff + every Python script gate + the
      # pre-commit-hooks builtins + markdownlint/actionlint via
      # pre-commit-managed envs) over the WHOLE tree -- no hand-list to drift.
      #
      # TWO invocations are required because `pre-commit run --all-files` runs
      # ONLY the pre-commit stage, but nearly every heavy content gate
      # (forbidden-literals, persistence-boundary, architecture-drift,
      # lint-imports, python-audits, sqlfluff, docstring-completeness,
      # the AST gates, ...) is `stages: [pre-push]`. A
      # single pre-commit-stage run would silently skip the bulk of the suite.
      # check_local_ci_parity.py asserts both parity stages are covered.
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # Hash install_cli_tools.sh too: the language:system hooks (vale,
          # lychee, golangci-lint) resolve binaries provisioned by that
          # script, so a toolchain version bump there must bust the cached
          # hook environments alongside a config change.
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml', 'scripts/install_cli_tools.sh') }}
          # On an exact-key miss (any edit to the config or toolchain
          # script), fall back to the most recent prior hook-env cache so
          # only the changed environments rebuild instead of a full cold
          # rebuild of every hook.
          restore-keys: |
            pre-commit-
      - name: All pre-commit-stage gates over the whole tree
        run: uv run pre-commit run --all-files --hook-stage pre-commit --show-diff-on-failure --color always
      - name: All pre-push-stage gates over the whole tree
        run: uv run pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure --color always

      # The local <-> CI parity self-check (every local hook maps to a CI
      # counterpart; no correctness job is changed-file conditioned) is NOT a
      # dedicated step: it is `stages: [pre-commit, pre-push]`, so the two
      # all-files invocations above already run it. A separate step would just
      # run it a third time.

      # vale and caddy-validate are language: system hooks needing binaries
      # pre-commit does not manage, so they are SKIPped above and run here.
      - name: Prose lint (vale)
        run: |
          bash scripts/install_cli_tools.sh vale
          export PATH="$HOME/.local/bin:$PATH"
          vale README.md CLAUDE.md cli/CLAUDE.md web/CLAUDE.md docs/
      - name: Pull caddy image
        uses: ./.github/actions/docker-pull-resilient
        with:
          # renovate: datasource=docker depName=caddy
          image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          local-tag: synthorg-caddy:2.11.4-alpine
      - name: Caddyfile validate
        run: >-
          docker run --rm -v "$PWD:/work" -w /work
          synthorg-caddy:2.11.4-alpine
          caddy validate --config web/Caddyfile --adapter caddyfile
      # Spell-check runs as a dedicated step rather than a pre-commit hook so
      # the ~11s full-tree scan gates every push in CI without sitting on the
      # local pre-push critical path. Config in .codespellrc.
      - name: Spell check (codespell)
        run: uv run codespell --config .codespellrc

  # ── Runtime Stats Freshness ──
  # Fails the build when data/runtime_stats.yaml has drifted (any
  # stats.<name>.raw differs from a freshly-fetched value) or when
  # last_generated_utc is older than the 14-day ceiling. Runs on python
  # OR runtime_stats so a YAML-only edit (e.g. a manual seed) still
  # triggers the gate.
  runtime-stats-freshness:
    name: Runtime Stats Freshness Gate
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Check runtime_stats freshness
        env:
          # `gh release list` / `gh api` calls inside the generator's
          # fetchers need an authenticated token; GITHUB_TOKEN is
          # sufficient for the public-repo metadata they read.
          GH_TOKEN: ${{ github.token }}
        # Retry the whole check on a transient GitHub API blip: the gate reads
        # release/metadata via `gh`, which occasionally 5xx's. A real staleness
        # failure is deterministic and still fails after the 3 attempts; only a
        # flaky API error is absorbed. Freshness has a 14-day ceiling, so a
        # short retry delay has no correctness impact.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if uv run python scripts/check_runtime_stats_freshness.py; then
              exit 0
            fi
            echo "::warning::runtime_stats freshness check failed (attempt ${attempt}/3); retrying after backoff"
            # 30/60/90s backoff clears a GitHub secondary-rate-limit window
            # (~60s); a 10s step would exhaust all 3 attempts inside one window.
            sleep $((attempt * 30))
          done
          echo "error: runtime_stats freshness check failed after 3 attempts" >&2
          exit 1

  # ── Docs: Doc-claim drift gate ──
  # Runs on python OR doc_claims so a docs-only PR that bumps a guarded
  # claim (eg "100+ event constant modules") still triggers the gate.
  doc-drift:
    name: Doc Drift Gate
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Doc count drift gate (event modules)
        run: uv run python scripts/check_doc_drift_counts.py

  # ── Prompt-pin drift regression + tier-change canary ──
  # Recomputes every prompt class's pin fingerprint from the live pins and
  # both (a) checks it equals the committed pin_golden.json (the tier-change
  # canary) and (b) grades it through the deterministic probe benchmark (the
  # prompt-drift regression eval), as a named signal independent of the unit
  # suite.
  pin-drift-regression:
    name: Prompt-Drift Regression Gate
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Arm faulthandler before conftest loads and flush unbuffered so a
      # C-level crash or hang in the probe harness leaves forensic output
      # rather than a bare job cancellation (zero runtime cost).
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Pin-golden freshness canary (tier / pin change without regen)
        run: uv run python scripts/check_pin_golden_fresh.py

      # --session-timeout produces a named pytest error before GHA's
      # timeout-minutes reaps the job as a confusing "cancelled"; junitxml +
      # the sanity check below catch a 0-test run (pytest can exit 0 with no
      # tests collected).
      - name: Pin-validation drift regression eval
        run: |
          uv run python -m pytest \
            tests/unit/hr/evaluation/test_pin_validation_benchmark.py \
            -m unit \
            --session-timeout 120 \
            --junitxml=junit-pin-drift.xml

      - name: Sanity check (junit shows tests > 0)
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("junit-pin-drift.xml")
          if not path.exists():
              print("FAIL: junit-pin-drift.xml not found", file=sys.stderr)
              sys.exit(1)
          total = sum(
              int(ts.get("tests", 0))
              for ts in ET.parse(path).iter("testsuite")
          )
          print(f"junit total tests: {total}")
          if total == 0:
              print("FAIL: junit reports zero tests run", file=sys.stderr)
              sys.exit(1)

  # ── Schema: Drift Validation ──
  schema-validate:
    name: Schema Validation
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    # The Postgres drift arm pulls postgres:18-alpine via testcontainers
    # (cold on this runner, since no start-postgres precedes it), applies
    # every revision, then runs pg_dump -- far heavier than the git-state
    # and SQLite-drift steps it shares this job with.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 needed by the "Enforce at most one new revision per
      # PR" step below: `git diff base...HEAD` uses the three-dot merge-base
      # form, which is undefined on a shallow clone (no shared ancestry).
      # Without full history the rule either misses additions or fires
      # false positives, depending on which commit happens to be the
      # shallow root. The cost (one checkout) is small; this job already
      # runs full schema-drift validation.
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Enforce at most one new revision per PR
        # --diff-filter=A (added-only) is correct, NOT a Finding-4 added-files
        # gap: the policy counts NEW revisions, and revisions are append-only
        # (editing a committed revision is a separate violation blocked by
        # check_no_modify_migration / check_no_edit_migration). PR-event
        # scoping is inherent: the count is relative to the PR base ref.
        if: github.event_name == 'pull_request'
        env:
          GH_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$GH_BASE_REF"
          base_ref="origin/$GH_BASE_REF"
          mapfile -t new_revs < <(
            git diff --name-only --diff-filter=A "$base_ref"...HEAD -- \
              'src/synthorg/persistence/sqlite/revisions/*.sql' \
              'src/synthorg/persistence/postgres/revisions/*.sql'
          )
          sqlite_count=0
          postgres_count=0
          for rev in "${new_revs[@]}"; do
            case "$rev" in
              # Assignment form (not ``((c++))``): post-increment from 0 evaluates
              # to 0, which makes the arithmetic command exit 1 and trips
              # ``set -e`` on the first revision per backend.
              src/synthorg/persistence/sqlite/revisions/*.sql) sqlite_count=$((sqlite_count + 1)) ;;
              src/synthorg/persistence/postgres/revisions/*.sql) postgres_count=$((postgres_count + 1)) ;;
            esac
          done
          if [ "$sqlite_count" -gt 1 ] || [ "$postgres_count" -gt 1 ]; then
            echo "::error::PR adds too many new revision files (sqlite=$sqlite_count, postgres=$postgres_count). Policy allows at most one per backend."
            printf '  - %s\n' "${new_revs[@]}" >&2
            echo "" >&2
            echo "Consolidate by deleting in-progress revisions and authoring a single new revision per backend." >&2
            exit 1
          fi
          echo "OK: PR adds sqlite=$sqlite_count, postgres=$postgres_count new revision(s) (limit 1 each)."

      - name: Block modification of committed migrations
        # CI mirror of the check-no-modify-migration pre-commit hook. Editing a
        # revision already merged to main breaks yoyo's content-hash for everyone
        # who applied it. The schema-drift gate only catches edits that shift the
        # resulting schema, so this closes the --no-verify hole for content-only
        # edits (comments, reformatting, semantically-equal SQL). Runs here (not
        # in the all-files Gates job) because it needs origin/main, which only
        # this fetch-depth:0 job has.
        #
        # A sanctioned revision squash legitimately rewrites the baseline and
        # deletes the prior chain, which this gate would otherwise block. The
        # local workflow sets SYNTHORG_MIGRATION_SQUASH=1 deliberately at commit
        # time; the CI equivalent of that deliberate human authorisation is the
        # ``migration-squash`` PR label -- visible and auditable in the PR UI,
        # removable, and absent on every ordinary PR so the gate stays fully
        # active for them. Drift detection below still proves the rewritten
        # baseline reproduces schema.sql, so the squash remains independently
        # verified even when this content-hash gate steps aside.
        if: github.event_name == 'pull_request'
        env:
          SYNTHORG_MIGRATION_SQUASH: ${{ contains(github.event.pull_request.labels.*.name, 'migration-squash') && '1' || '0' }}
        run: |
          git fetch origin main
          bash scripts/check_no_modify_migration.sh

      - name: SQLite drift detection
        run: uv run python scripts/check_schema_drift_revisions.py --backend sqlite

      # Schema drift is a global invariant, independent of which tests
      # run, so it is validated once here rather than on every persistence
      # test job. The Postgres arm brings its own throwaway database via
      # testcontainers (Docker on the runner) and dumps it with an
      # in-container pg_dump, so it needs neither the start-postgres
      # service nor the postgresql-client package -- only the synced test
      # dependencies this job already installs.
      #
      # Bringing that container up reaches Docker Hub at job runtime,
      # which times out from the hosted runners often enough to fail the
      # gate on its own. Pre-pulling through the retry-and-mirror ladder
      # keeps a registry outage out of the gate: testcontainers then finds
      # the image already present and never reaches a registry itself.
      - name: Pull postgres image
        uses: ./.github/actions/docker-pull-resilient
        with:
          # Keep in step with the pin in .github/actions/start-postgres and
          # _POSTGRES_TESTCONTAINER_IMAGE, so the drift gate and the test
          # suites validate against the same Postgres image bytes.
          # renovate: datasource=docker depName=postgres
          image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          local-tag: synthorg-postgres-ci:18-alpine

      # The script exits 3 for "container never came up" specifically so
      # the retry below covers that and nothing else: a real drift finding
      # (exit 1) fails on the first attempt, as it must, since retrying a
      # deterministic result only burns the job's 15-minute budget. It
      # stays as the outer net for a container that fails to start for a
      # reason the pull cannot pre-empt (port contention, disk pressure).
      - name: Postgres drift detection
        env:
          # The reaper exists to clean up leaked containers on a
          # long-lived host. A hosted runner is destroyed after the job,
          # so it buys nothing here while adding a second Docker Hub pull
          # (testcontainers/ryuk, unpinned) of an image that runs with
          # the Docker socket mounted. The script stops its own container
          # in a finally block, so disabling the reaper removes both the
          # extra failure mode and the socket-mounted third-party image.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          set -euo pipefail
          # Keep in step with _PROVISION_EXIT_CODE in the script.
          provision_exit=3
          for attempt in 1 2 3; do
            status=0
            uv run python scripts/check_schema_drift_revisions.py \
              --backend postgres \
              --postgres-image synthorg-postgres-ci:18-alpine || status=$?
            if [ "$status" -ne "$provision_exit" ]; then
              exit "$status"
            fi
            # No warning or backoff on the last attempt: nothing follows it,
            # and the sleep would burn a minute of the 15-minute budget.
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Postgres drift gate could not provision its container (attempt ${attempt}/3); retrying after backoff"
              sleep $((attempt * 20))
            fi
          done
          echo "::error::Postgres drift gate could not provision its container after 3 attempts" >&2
          exit 1

  # ── Python: Type Check ──
  type-check:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: mypy
        # Whole-tree scope (mirrors run_affected_mypy.py's full-run fallback).
        # scripts/ is a second invocation: its flat layout clashes on bare vs
        # scripts.* names, so it needs MYPYPATH + --explicit-package-bases.
        # --no-warn-unused-configs is not load-bearing here (cold mypy prints
        # the unused-section note and still exits 0); it is carried so this
        # invocation stays flag-identical to the local one in
        # run_affected_mypy.py's _SCRIPTS_DAEMON, where a daemon recheck does
        # count the note and exit 1.
        run: |
          uv run mypy --num-workers=4 src/ tests/ evals/ docker/ d2_fence.py
          MYPYPATH=. uv run mypy --num-workers=4 --explicit-package-bases --no-warn-unused-configs scripts/

  # ── Python: Type Check (second opinion) ──
  # Mypy is authoritative; pyright disagrees with it in places, so this gates
  # on a shrink-only per-rule baseline rather than on zero findings.
  type-check-pyright:
    name: Type Check (pyright)
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Run pyright
        # Exit code discarded: findings are the expected steady state, and the
        # baseline gate below is what decides pass or fail.
        run: uv run pyright --outputjson > pyright-report.json || true

      - name: Enforce shrink-only baseline
        run: uv run python scripts/check_pyright_baseline.py --report pyright-report.json

      - name: Upload pyright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyright-report
          path: pyright-report.json
          retention-days: 14

  # ── Python: OpenAPI Liveness ──
  openapi-liveness:
    name: OpenAPI Liveness
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Assert OpenAPI export is deterministic and complete
        run: uv run python scripts/check_openapi_liveness.py

  # ── Python: Test (Unit) ──
  # Fast-signal arm: -m unit, no Docker, no Postgres. Sharded 4-way
  # via pytest-split so a hung worker only cancels its own shard (the
  # other three still upload junit + durations, preserving forensic
  # data for the recurring xdist-hang flake). Each shard collects
  # coverage; the 80% gate runs once on the combined aggregate in
  # test-coverage-aggregate. COVERAGE_CORE=sysmon switches coverage.py
  # to its sys.monitoring core (5-10x faster tracer; full line + branch
  # parity since coverage 7.7 -- pinned 7.14.0).
  test-unit:
    name: Test Unit (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    # Healthy wall-clock per shard is ~2-3 min (114-120s observed on the
    # un-stuck shards). Two in-pytest timeouts bound a shard so a stuck
    # or slow run FAILS (named) rather than being reaped as "cancelled":
    # the per-test 30s ``timeout_method = "thread"`` (pyproject) kills a
    # single blocked await, and ``--session-timeout`` (the run step
    # below) fails the whole session if cumulative wall-clock creeps past
    # its budget without any single test tripping the per-test timeout --
    # otherwise that case hits GHA's job timeout and surfaces as a
    # confusing job cancellation. ``timeout-minutes`` here is only a
    # backstop above the session timeout, for the rare case where pytest
    # itself wedges (e.g. a collection hang) before the session timer can
    # fire; it should never be the primary signal. It must comfortably
    # exceed (job setup + the 300s ``--session-timeout`` + the post-fail
    # all-threads dump, junit write, and artifact upload). Setup alone is
    # ~90s, so anything under 10 min leaves too little for teardown and
    # lets the GHA timeout fire first, masking the named session failure.
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      COVERAGE_FILE: .coverage.unit-${{ matrix.shard }}
      COVERAGE_CORE: sysmon
      # ``PYTHONFAULTHANDLER=1`` arms ``faulthandler`` at interpreter
      # startup, BEFORE conftest loads. Without this, a crash during
      # module import or before ``faulthandler.enable`` runs leaves zero
      # forensic data. ``PYTHONUNBUFFERED=1`` flushes stdout/stderr
      # line-by-line so a worker that dies (e.g. ``pytest-timeout``
      # ``thread`` method terminating it on a 30s test hang) cannot
      # take its last-words stack dump down with it via a half-flushed
      # buffer. Both add zero runtime cost.
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - uses: ./.github/actions/warm-tree-sitter-cache

      # Enable user-process core dumps. Ubuntu runners ship with
      # ``ulimit -c 0`` (disabled). With ``-c unlimited`` any SIGSEGV /
      # SIGABRT / SIGBUS that kills a worker leaves a binary core file
      # we can later ``gdb -ex bt`` against. ``sysctl
      # kernel.core_pattern`` writes them to the workspace so the
      # post-step artifact upload picks them up.
      - name: Enable core dumps
        run: |
          ulimit -c unlimited
          ulimit -a
          # ``core_pattern`` must be an absolute path on disk we control;
          # the default ``|/usr/share/apport/apport ...`` pipes through
          # apport which is not installed on hosted runners.
          sudo bash -c 'echo "/home/runner/work/synthorg/synthorg/core.%e.%p.%t" > /proc/sys/kernel/core_pattern'
          cat /proc/sys/kernel/core_pattern

      # --cov-fail-under=0 overrides pyproject's [tool.coverage.report]
      # fail_under=80, which pytest-cov otherwise applies at end-of-session
      # even with an empty --cov-report=. A single marker slice never reaches
      # 80% alone; the gate belongs solely to test-coverage-aggregate. Every
      # per-suite arm below carries the same override for the same reason.
      #
      # --splits/--group come from pytest-split, against the tracked
      # .test_durations.unit. Both halves are load-bearing and neither works
      # alone.
      #
      # --splitting-algorithm least_duration assigns tests INDIVIDUALLY to the
      # least-loaded group. The default (duration_based_chunks) hands out
      # CONTIGUOUS chunks of collection order, which put all 4370
      # tests/unit/api tests in shard 1 and none in shard 4: every one builds
      # an app, so shard 1 ran 322s against shard 3's 141s for the same test
      # count, over the --session-timeout below. Chunking can only move that
      # boundary, never interleave, so no durations file can fix it.
      #
      # The durations file is what least_duration greedily packs against;
      # without it every test weighs the same and the balance is by count.
      # Refresh it with `make test-durations RUN_ID=<run>`;
      # unit-shard-balance.yml watches the spread and asks when it drifted.
      #
      # ``-v`` prints every test's nodeid as it starts, so the LAST
      # printed test before ``[gwN] node down`` names the suspect.
      # ``-s`` (``--capture=no``) disables pytest's per-test capture
      # buffer; without this, the all-threads stack dump that
      # ``pytest-timeout`` ``thread`` method emits before terminating
      # the worker is captured into a buffer that is dropped when the
      # worker process exits. With ``-s`` the dump goes straight
      # through xdist's worker-stderr channel to the controller log.
      - name: Run unit tests (shard ${{ matrix.shard }}/4)
        run: |
          # Inherit the parent shell's core-dump rlimit (the previous
          # step already raised it; ``ulimit`` is per-shell, so we
          # re-assert here in case GHA respawns the shell).
          ulimit -c unlimited
          uv run python -m pytest tests/ \
            -m unit \
            -n auto \
            --max-worker-restart=0 \
            --session-timeout 300 \
            --splits 4 \
            --group ${{ matrix.shard }} \
            --durations-path .test_durations.unit \
            --splitting-algorithm least_duration \
            --cov=synthorg \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml=junit-unit-${{ matrix.shard }}.xml \
            --durations=20 \
            --durations-min=1.0 \
            -v \
            -s

      # Critical safety net: pytest can exit 0 with zero tests run. When
      # xdist workers crash during pytest_sessionstart, the master sees no
      # test failures and exits 0, so the job is marked success while
      # junit-unit-N.xml shows tests="0". Without this gate a session that
      # silently ran ZERO tests earns a green checkmark.
      - name: Sanity check (junit shows tests > 0)
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("junit-unit-*.xml"))
          if not files:
              print("FAIL: no junit-unit-*.xml files found", file=sys.stderr)
              sys.exit(1)
          total = 0
          for f in files:
              tree = ET.parse(f)
              for ts in tree.iter("testsuite"):
                  total += int(ts.get("tests", 0))
          print(f"junit total tests: {total} across {len(files)} file(s)")
          if total == 0:
              print(
                  "FAIL: junit reports zero tests across all files; "
                  "something prevented tests from running.",
                  file=sys.stderr,
              )
              sys.exit(1)

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-unit-${{ matrix.shard }}
          path: .coverage.unit-${{ matrix.shard }}*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-unit-${{ matrix.shard }}
          path: junit-unit-${{ matrix.shard }}.xml

      # ``!cancelled()``, not ``failure() || cancelled()``: workers can crash
      # via os.abort (producing cores) while pytest still exits 0, so a
      # failure-gated upload would be SKIPPED on exactly the runs whose cores
      # matter most. ``if-no-files-found: ignore`` keeps a genuinely-green
      # job's tail clean. Retention is short (3 days) because core dumps are
      # large and lose value once the crash is diagnosed.
      - name: Upload core dumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-dumps-unit-${{ matrix.shard }}
          path: core.*
          if-no-files-found: ignore
          retention-days: 3

  # ── Python: Test (Integration) ──
  # Sharded 4-way so 12-minute single-runner wall-clock drops to ~3
  # minutes critical path. The ``start-postgres`` composite action
  # exposes postgres:18-alpine to each shard via TCP localhost plus the
  # SYNTHORG_TEST_POSTGRES_* env vars (a retry-resilient replacement for
  # a ``services: postgres`` block, whose container-init pull cannot be
  # retried); the conftest fixtures
  # (``tests/conformance/persistence/conftest.py`` and
  # ``tests/integration/persistence/conftest.py``) detect those env
  # vars and bypass the local testcontainers start-up dance. Local-dev
  # test runs leave the env vars unset and keep using testcontainers.
  # TimescaleDB tests still use testcontainers because the postgres
  # container path cannot host the timescale/timescaledb image.
  test-integration:
    name: Test Integration (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    # ``--session-timeout 1650`` (27.5 min) is the in-suite watchdog; the
    # job ceiling sits above it with enough headroom for cold-runner
    # Postgres image pulls so a slow start cannot pre-empt the named
    # per-test failure with an opaque job cancellation.
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      COVERAGE_FILE: .coverage.integration-${{ matrix.shard }}
      COVERAGE_CORE: sysmon
      SYNTHORG_TEST_POSTGRES_HOST: localhost
      SYNTHORG_TEST_POSTGRES_PORT: "5432"
      SYNTHORG_TEST_POSTGRES_USER: synthorg
      SYNTHORG_TEST_POSTGRES_PASSWORD: synthorg-test
      SYNTHORG_TEST_POSTGRES_DB: synthorg
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Postgres for the persistence suites. Replaces a
      # ``services: postgres`` block whose Docker Hub image pull cannot
      # be retried (runner container-init gives up after 3 attempts and
      # registry-1.docker.io intermittently times out with "context
      # deadline exceeded"); the composite action retries the pull with
      # backoff. Same localhost:5432 + SYNTHORG_TEST_POSTGRES_* contract
      # the service block provided, so the conftest fixtures are
      # unaffected.
      - uses: ./.github/actions/start-postgres

      - uses: ./.github/actions/setup-python-uv

      - uses: ./.github/actions/install-postgres-18-client

      - uses: ./.github/actions/warm-tree-sitter-cache

      # Mirror test-unit's forensic plumbing -- see the long comment on
      # that step (line ~374) for the full rationale. Without this,
      # SIGABRT from our pytest-timeout monkey-patch (tests/conftest.py)
      # produces no core file and the "Upload core dumps" step below
      # has nothing to upload. Confirmed gap on main CI run
      # 26390141124 / job 77677668898 (2026-05-25 integration shard 4
      # crash): event loop hang in test_distributed_path_nats, abort
      # fired, no core artefact landed because this step was missing.
      - name: Enable core dumps
        run: |
          ulimit -c unlimited
          ulimit -a
          sudo bash -c 'echo "/home/runner/work/synthorg/synthorg/core.%e.%p.%t" > /proc/sys/kernel/core_pattern'
          cat /proc/sys/kernel/core_pattern

      # ``-k "not [sqlite-"`` drops the SQLite parametrisation of the
      # dual-backend ``backend`` fixture in tests/conformance/persistence/;
      # the dedicated ``test-conformance-sqlite`` job already covers that
      # arm, so running it again here is pure duplicate work.
      #
      # ``--splits/--group`` come from pytest-split with .test_durations.integration
      # (empty {} on first run, falls back to count-based partition until
      # CI populates real timings).
      #
      # ``-v -s`` mirrors test-unit: ``-v`` prints every nodeid so the
      # last printed test before ``[gwN] node down`` names the suspect,
      # ``-s`` disables ``capture=fd`` so our pytest-timeout monkey-patch
      # banner + explicit faulthandler.dump_traceback output survive on
      # CI (see [[project-pytest-timeout-xdist-log-loss]]).
      - name: Run integration tests (shard ${{ matrix.shard }}/4)
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: |
          ulimit -c unlimited
          uv run python -m pytest tests/ \
            -m integration \
            -k "not [sqlite-" \
            -n auto \
            --max-worker-restart=0 \
            --session-timeout 1650 \
            --splits 4 \
            --group ${{ matrix.shard }} \
            --durations-path .test_durations.integration \
            --cov=synthorg \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml=junit-integration-${{ matrix.shard }}.xml \
            --durations=20 \
            --durations-min=1.0 \
            -v \
            -s

      # See identical step in test-unit for the reason this gate exists.
      - name: Sanity check (junit shows tests > 0)
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("junit-integration-*.xml"))
          if not files:
              print("FAIL: no junit-integration-*.xml files found", file=sys.stderr)
              sys.exit(1)
          total = 0
          for f in files:
              tree = ET.parse(f)
              for ts in tree.iter("testsuite"):
                  total += int(ts.get("tests", 0))
          print(f"junit total tests: {total} across {len(files)} file(s)")
          if total == 0:
              print(
                  "FAIL: junit reports zero tests across all files; "
                  "something prevented tests from running.",
                  file=sys.stderr,
              )
              sys.exit(1)

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-integration-${{ matrix.shard }}
          path: .coverage.integration-${{ matrix.shard }}*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-integration-${{ matrix.shard }}
          path: junit-integration-${{ matrix.shard }}.xml

      # Mirror test-unit. Uploads on non-cancelled exit (success OR
      # failure) so a SIGABRT under our pytest-timeout monkey-patch
      # always surfaces a core artefact regardless of how pytest
      # reports the session outcome. ``if-no-files-found: ignore``
      # keeps a clean run quiet.
      - name: Upload core dumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-dumps-integration-${{ matrix.shard }}
          path: core.*
          if-no-files-found: ignore
          retention-days: 3

  # ── Python: Test (E2E) ──
  # Same ``start-postgres`` composite-action path as test-integration so
  # the conftest fixtures bypass testcontainers. Not sharded; e2e is
  # small (~3 min historically) and matrix overhead would mostly cancel
  # the wall-clock saving.
  test-e2e:
    name: Test E2E
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COVERAGE_FILE: .coverage.e2e
      COVERAGE_CORE: sysmon
      SYNTHORG_TEST_POSTGRES_HOST: localhost
      SYNTHORG_TEST_POSTGRES_PORT: "5432"
      SYNTHORG_TEST_POSTGRES_USER: synthorg
      SYNTHORG_TEST_POSTGRES_PASSWORD: synthorg-test
      SYNTHORG_TEST_POSTGRES_DB: synthorg
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Postgres for the persistence suites. Replaces a
      # ``services: postgres`` block whose Docker Hub image pull cannot
      # be retried (runner container-init gives up after 3 attempts and
      # registry-1.docker.io intermittently times out with "context
      # deadline exceeded"); the composite action retries the pull with
      # backoff. Same localhost:5432 + SYNTHORG_TEST_POSTGRES_* contract
      # the service block provided, so the conftest fixtures are
      # unaffected.
      - uses: ./.github/actions/start-postgres

      - uses: ./.github/actions/setup-python-uv

      - uses: ./.github/actions/install-postgres-18-client

      - uses: ./.github/actions/warm-tree-sitter-cache

      # See test-unit (line ~374) for the rationale on core dumps.
      - name: Enable core dumps
        run: |
          ulimit -c unlimited
          ulimit -a
          sudo bash -c 'echo "/home/runner/work/synthorg/synthorg/core.%e.%p.%t" > /proc/sys/kernel/core_pattern'
          cat /proc/sys/kernel/core_pattern

      # ``-v -s`` mirrors test-unit: nodeid echo + capture-off so the
      # pytest-timeout monkey-patch banner survives. See
      # [[project-pytest-timeout-xdist-log-loss]].
      - name: Run e2e tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: |
          ulimit -c unlimited
          uv run python -m pytest tests/ \
            -m e2e \
            -n auto \
            --max-worker-restart=0 \
            --session-timeout 1500 \
            --cov=synthorg \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml=junit-e2e.xml \
            --durations=20 \
            --durations-min=1.0 \
            -v \
            -s

      # See identical step in test-unit for the reason this gate exists.
      - name: Sanity check (junit shows tests > 0)
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("junit-e2e.xml")
          if not path.exists():
              print("FAIL: junit-e2e.xml not found", file=sys.stderr)
              sys.exit(1)
          total = 0
          for ts in ET.parse(path).iter("testsuite"):
              total += int(ts.get("tests", 0))
          print(f"junit total tests: {total}")
          if total == 0:
              print(
                  "FAIL: junit reports zero tests; "
                  "something prevented tests from running.",
                  file=sys.stderr,
              )
              sys.exit(1)

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-e2e
          path: .coverage.e2e*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-e2e
          path: junit-e2e.xml

      - name: Upload core dumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-dumps-e2e
          path: core.*
          if-no-files-found: ignore
          retention-days: 3

  # ── Python: Test (Conformance, SQLite arm) ──
  # No-Docker SQLite-only slice of the dual-backend persistence
  # conformance suite, so the lowest-cost backend is always exercised
  # early even when the Postgres testcontainer infra is flaky. The
  # ``backend`` fixture is parametrised ["sqlite", "postgres"]; -k "not
  # postgres" deselects the postgres ids so the container fixture is
  # never triggered. The full dual-backend conformance still runs inside
  # test-integration via -m integration.
  test-conformance-sqlite:
    name: Test Conformance (SQLite)
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COVERAGE_FILE: .coverage.conformance-sqlite
      COVERAGE_CORE: sysmon
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      # See test-unit (line ~374) for the rationale on core dumps.
      - name: Enable core dumps
        run: |
          ulimit -c unlimited
          ulimit -a
          sudo bash -c 'echo "/home/runner/work/synthorg/synthorg/core.%e.%p.%t" > /proc/sys/kernel/core_pattern'
          cat /proc/sys/kernel/core_pattern

      # ``-v -s`` mirrors test-unit: nodeid echo + capture-off so the
      # pytest-timeout monkey-patch banner survives. See
      # [[project-pytest-timeout-xdist-log-loss]].
      - name: Run SQLite conformance tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: |
          ulimit -c unlimited
          uv run python -m pytest tests/conformance/persistence \
            -m integration \
            -k "not postgres" \
            -n auto \
            --max-worker-restart=0 \
            --session-timeout 900 \
            --cov=synthorg \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml=junit-conformance-sqlite.xml \
            --durations=20 \
            --durations-min=1.0 \
            -v \
            -s

      # See identical step in test-unit for the reason this gate exists.
      - name: Sanity check (junit shows tests > 0)
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("junit-conformance-sqlite.xml")
          if not path.exists():
              print(
                  "FAIL: junit-conformance-sqlite.xml not found",
                  file=sys.stderr,
              )
              sys.exit(1)
          total = 0
          for ts in ET.parse(path).iter("testsuite"):
              total += int(ts.get("tests", 0))
          print(f"junit total tests: {total}")
          if total == 0:
              print(
                  "FAIL: junit reports zero tests; "
                  "something prevented tests from running.",
                  file=sys.stderr,
              )
              sys.exit(1)

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-conformance-sqlite
          path: .coverage.conformance-sqlite*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-conformance-sqlite
          path: junit-conformance-sqlite.xml

      - name: Upload core dumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-dumps-conformance-sqlite
          path: core.*
          if-no-files-found: ignore
          retention-days: 3

  # ── Python: Test Coverage Aggregate ──
  # The single, airtight 80% gate. Runs only when all four test arms
  # succeed (default needs semantics, no if: always()), so coverage is
  # never computed on partial data. Coverage policy is enforced by
  # ``coverage report --fail-under=80``; the Codecov uploads run a
  # fail-closed retry ladder that fails the job once a persistent
  # external/OIDC outage exhausts the retries.
  test-coverage-aggregate:
    name: Test Coverage Aggregate
    needs: [changes, test-unit, test-integration, test-e2e, test-conformance-sqlite]
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Required so `download-artifact` uses the REST API rather than the
      # runtime token, whose scope covers only the CURRENT run attempt: a
      # re-run of this job would otherwise 404 on the coverage and
      # test-result artifacts the earlier attempt uploaded.
      actions: read
      contents: read
      # Required for tokenless Codecov upload via use_oidc: true.
      id-token: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Download coverage data
        uses: ./.github/actions/download-artifact
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download test results
        uses: ./.github/actions/download-artifact
        with:
          pattern: test-results-*
          merge-multiple: true
          path: test-results
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Hard no-missed-coverage assertion. Every split arm MUST have
      # contributed a data file before the gate runs; a silently dropped
      # suite (or all shards of a sharded suite) would shrink the report
      # yet could still clear --fail-under on the remaining suites (a
      # false green). Fail loudly instead.
      #
      # Sharded arms (unit, integration) contribute multiple files like
      # .coverage.unit-1, .coverage.unit-2, ... -- the glob ``unit*``
      # matches all of them. We also assert an EXPECTED shard count so
      # a silently-dropped single shard (e.g. one matrix cell cancelled
      # by a hang) still fails the gate.
      - name: Assert all suites contributed coverage
        run: |
          set -euo pipefail
          missing=""
          for suite in unit integration e2e conformance-sqlite; do
            if ! compgen -G "coverage-data/.coverage.${suite}*" > /dev/null; then
              missing="${missing} ${suite}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Missing coverage data for suite(s):${missing}. Refusing to compute the 80% gate on partial data."
            ls -la coverage-data || true
            exit 1
          fi
          # Assert sharded arms contributed every shard (4 each).
          # The expected count 4 MUST stay in sync with the
          # `strategy.matrix.shard: [1, 2, 3, 4]` definitions on the
          # `test-unit` and `test-integration` jobs above. If a future
          # change grows or shrinks the matrix, update this number too.
          for sharded in unit integration; do
            count=$(compgen -G "coverage-data/.coverage.${sharded}-*" | wc -l || echo 0)
            if [ "${count}" -lt 4 ]; then
              echo "::error::Sharded suite ${sharded} contributed ${count} shard(s); expected 4. Refusing to compute the 80% gate on partial data."
              ls -la coverage-data || true
              exit 1
            fi
          done
          echo "All four suites contributed coverage data (unit + integration sharded 4/4)."

      - name: Inspect coverage data files
        run: |
          # List every downloaded .coverage* file with its size, so which
          # shards produced data is visible at a glance. The combine step can
          # silently drop per-shard files and under-report total coverage
          # with no other signal about which shard's data was lost.
          ls -laR coverage-data || true
          echo "--- file count by shard prefix ---"
          # ``-A`` is required: every per-shard data file is named
          # ``.coverage.<suite>-<shard>``, leading dot, so a plain ``ls``
          # hides them and the sed/sort/uniq pipe reads empty input.
          # ``-A`` includes dotfiles but excludes ``.`` and ``..``.
          # shellcheck disable=SC2012  # coverage-data holds controlled CI-artifact names (.coverage.<suite>-<shard>); ls -A is the deliberate dotfile-listing path
          ls -A coverage-data 2>/dev/null \
            | sed -E 's/\.[0-9a-f]+\.[0-9]+\.[0-9a-f]+$//' \
            | sort | uniq -c | sort -rn || true

      - name: Combine coverage
        # ``--debug=dataio,process`` writes the path of each file
        # combined or skipped to stderr; without it the bare ``Combined
        # N files, skipped M`` message hides which file was rejected and
        # why. Each line is a single forensic record we can read out of
        # the GHA log.
        run: uv run coverage combine --debug=dataio,process coverage-data

      - name: Enforce 80% aggregate coverage gate
        run: uv run coverage report --show-missing --fail-under=80

      - name: Generate combined coverage XML
        id: coverage-xml
        run: uv run coverage xml -o coverage.xml

      # Codecov upload, wrapped in a 3-attempt retry ladder. This is the
      # ONLY Codecov coverage upload in the workflow: one combined report,
      # so the Codecov project view is never fragmented across partial
      # per-suite uploads. Tokenless OIDC (public repo).
      #
      # Why a ladder rather than fail_ci_if_error: false alone: the
      # original incident was a 503 from the OIDC getIDToken() mint, which
      # throws an UNHANDLED error BEFORE the upload, so fail_ci_if_error
      # (which only suppresses the upload error path) never sees it and the
      # step crashed exit 1. Every attempt sets fail_ci_if_error: true so a
      # soft upload error ALSO surfaces as a non-zero outcome that the next
      # attempt retries; intermediate attempts add continue-on-error so the
      # run advances to the retry; the final attempt has neither guard, so a
      # genuinely persistent Codecov/OIDC outage (past the ~2.5min budget)
      # fails CI loud rather than being silently swallowed.
      # Gate attempt 1 on coverage.xml having been produced: if the XML
      # step failed there is nothing to upload, and running the ladder
      # anyway burns ~2.5min of retries and buries the real failure under
      # three Codecov "file not found" errors.
      - name: Upload combined coverage to Codecov (attempt 1/3)
        id: codecov-cov-1
        if: ${{ !cancelled() && steps.coverage-xml.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: true
          use_oidc: true
      - name: Backoff before Codecov coverage attempt 2
        if: ${{ !cancelled() && steps.codecov-cov-1.outcome == 'failure' }}
        run: |
          echo "::warning::Codecov coverage upload attempt 1 failed; waiting 30s before retry"
          sleep 30
      - name: Upload combined coverage to Codecov (attempt 2/3)
        id: codecov-cov-2
        if: ${{ !cancelled() && steps.codecov-cov-1.outcome == 'failure' }}
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: true
          use_oidc: true
      - name: Backoff before Codecov coverage attempt 3
        if: ${{ !cancelled() && steps.codecov-cov-1.outcome == 'failure' && steps.codecov-cov-2.outcome == 'failure' }}
        run: |
          echo "::warning::Codecov coverage upload attempt 2 failed; waiting 120s before final retry"
          sleep 120
      - name: Upload combined coverage to Codecov (attempt 3/3)
        if: ${{ !cancelled() && steps.codecov-cov-1.outcome == 'failure' && steps.codecov-cov-2.outcome == 'failure' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: true
          use_oidc: true

      - name: Collect junit file list
        id: junit
        run: |
          set -euo pipefail
          # Each sharded arm produces junit-${suite}-${shard}.xml; e2e and
          # conformance-sqlite contribute single files. Build a CSV that
          # Codecov consumes. The earlier "Assert all suites contributed
          # coverage" step already fails the job when any suite or shard
          # dropped its artifact, so the loop below is a belt-and-braces
          # guard for the junit upload path specifically.
          # shellcheck disable=SC2012  # test-results holds controlled CI-artifact names (junit-*.xml); the glob list feeds Codecov's CSV
          files=$(ls test-results/junit-*.xml 2>/dev/null | paste -sd, || true)
          if [ -z "${files}" ]; then
            echo "::error::No junit XML files found under test-results/. Refusing to upload an empty file list to Codecov."
            exit 1
          fi
          echo "files=${files}" >> "${GITHUB_OUTPUT}"
          echo "Uploading: ${files}"

      # Same 3-attempt ladder rationale as the coverage upload above; gate
      # attempt 1 on the junit file list having been collected (the step
      # exits 1 when no junit files were found) so the ladder does not run
      # against an empty file list.
      - name: Upload test results to Codecov (attempt 1/3)
        id: codecov-junit-1
        if: ${{ !cancelled() && steps.junit.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ steps.junit.outputs.files }}
          fail_ci_if_error: true
          report_type: test_results
          use_oidc: true
      - name: Backoff before Codecov test-results attempt 2
        if: ${{ !cancelled() && steps.codecov-junit-1.outcome == 'failure' }}
        run: |
          echo "::warning::Codecov test-results upload attempt 1 failed; waiting 30s before retry"
          sleep 30
      - name: Upload test results to Codecov (attempt 2/3)
        id: codecov-junit-2
        if: ${{ !cancelled() && steps.codecov-junit-1.outcome == 'failure' }}
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ steps.junit.outputs.files }}
          fail_ci_if_error: true
          report_type: test_results
          use_oidc: true
      - name: Backoff before Codecov test-results attempt 3
        if: ${{ !cancelled() && steps.codecov-junit-1.outcome == 'failure' && steps.codecov-junit-2.outcome == 'failure' }}
        run: |
          echo "::warning::Codecov test-results upload attempt 2 failed; waiting 120s before final retry"
          sleep 120
      - name: Upload test results to Codecov (attempt 3/3)
        if: ${{ !cancelled() && steps.codecov-junit-1.outcome == 'failure' && steps.codecov-junit-2.outcome == 'failure' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ steps.junit.outputs.files }}
          fail_ci_if_error: true
          report_type: test_results
          use_oidc: true

      - name: Upload combined coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-combined
          path: |
            coverage.xml
            .coverage
          include-hidden-files: true

  # ── Python: Security Audit ──
  python-audit:
    name: Python Security Audit
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: pip-audit
        # Suppressed advisories are tracked for removal in #2202 (one ignore
        # maps to one removal owner). Only PYSEC-2022-42969 remains suppressed:
        # - PYSEC-2022-42969: regex DoS in py.path. py is unmaintained upstream
        #   with no fix version, pulled in only as a transitive of the
        #   modularity-gate dev tooling (interrogate). synthorg never imports py
        #   directly and the vulnerable py.path.svnurl / svnwc surfaces are not
        #   reachable through anything we ship. Remove when py leaves the
        #   dependency tree.
        run: |
          set -euo pipefail
          # pip-audit does not error when an --ignore-vuln target is absent
          # from the report, so the suppression can silently outlive the
          # package it covers. Fail loudly once py has left the lockfile.
          if ! grep -q '^name = "py"$' uv.lock; then
            echo "::error::PYSEC-2022-42969 is suppressed but 'py' is no longer in uv.lock; drop the --ignore-vuln." >&2
            exit 1
          fi
          uv run pip-audit \
            --ignore-vuln PYSEC-2022-42969

  # ── Docker: Dockerfile Lint ──
  dockerfile-lint:
    name: Dockerfile Lint
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # `config` is passed explicitly rather than relying on hadolint's cwd
      # discovery, so the trusted-registries allowlist is guaranteed to apply
      # inside the action's container.
      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: docker/backend/Dockerfile
          config: .hadolint.yaml

      - name: Lint sandbox Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: docker/sandbox/Dockerfile
          config: .hadolint.yaml

      - name: Lint openhands Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: docker/openhands/Dockerfile
          config: .hadolint.yaml

  # ── OpenAPI: export once, share with dashboard arm ──
  # dashboard-type-check, dashboard-test and dashboard-build all need the
  # exported schema, and each would otherwise pay for its own uv sync. The
  # export is deterministic given pinned backend code, so a single upstream
  # job + actions/upload-artifact lets those Node-only jobs skip the Python
  # env spin-up entirely. Runs on python OR dashboard
  # changes (the dashboard filter already includes src/synthorg/api/**).
  export-openapi:
    name: Export OpenAPI Schema
    needs: changes
    # Always-run: the de-conditioned dashboard type-check / test jobs depend
    # on this artefact, and a skipped dependency would skip them too. Cheap
    # (one export_openapi.py invocation).
    if: needs.changes.outputs.is_release_please != 'true' # always-run (feeds always-run dashboard gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Export OpenAPI schema
        run: uv run python scripts/export_openapi.py

      - name: Upload OpenAPI schema artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-schema
          path: docs/openapi/openapi.json
          if-no-files-found: error

  # ── Dashboard: Lint ──
  dashboard-lint:
    name: Dashboard Lint
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/install-js-deps
        with:
          working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run lint:circular
        working-directory: web
      # This job is the whole-dashboard CI counterpart for the local
      # `web-checks` pre-push hook. That hook scopes only ESLint to the
      # pushed files; knip and circular already run whole-dashboard there.
      - run: npm run lint:knip
        working-directory: web

  # ── Dashboard: Type Check ──
  dashboard-type-check:
    name: Dashboard Type Check
    needs: [changes, export-openapi]
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # See the coverage-aggregate job: `actions: read` keeps a re-run of
      # this job able to fetch the openapi-schema artifact the earlier
      # attempt uploaded.
      actions: read
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      # python+uv is needed for the dto-types parity gate below, which
      # re-exports the OpenAPI schema from the live app before diffing.
      - uses: ./.github/actions/setup-python-uv
      - name: Download OpenAPI schema artifact
        uses: ./.github/actions/download-artifact
        with:
          name: openapi-schema
          path: docs/openapi
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/install-js-deps
        with:
          working-directory: web
      - run: npm run type-check
        working-directory: web
      # CI counterpart for the local `dto-types-ts-in-sync` pre-push hook
      # (parity). It runs here, NOT in the python-only Gates job, because it
      # shells out to `npx openapi-typescript`, which needs node + the pinned
      # web/node_modules (openapi-typescript and its typescript peer). The
      # Gates job has no node toolchain, so the gate is SKIPped there and
      # mapped to this job in check_local_ci_parity._COVERED_ELSEWHERE.
      - name: dto-types-ts-in-sync gate (parity)
        run: uv run python scripts/check_dto_types_ts_in_sync.py

  # ── Dashboard: Test ──
  dashboard-test:
    name: Dashboard Test (shard ${{ matrix.shard }}/4)
    needs: [changes, export-openapi]
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    # Sharded 4 ways with vitest ``--shard`` so each runner executes a
    # quarter of the unit suite in parallel. This replaced the earlier
    # 15 -> 30 minute single-runner re-baseline (the affected vitest
    # universe outgrew the 15-min wall after the EPIC #2066 controller-hook
    # decomposition): parallelism, not a longer wall, keeps the
    # correctness gate inside a 15-minute per-shard budget. ``ci-pass``
    # aggregates the four shards via ``needs.dashboard-test.result``, so
    # the required check is unchanged.
    timeout-minutes: 15
    permissions:
      # See the coverage-aggregate job: `actions: read` keeps a re-run of
      # this job able to fetch the openapi-schema artifact the earlier
      # attempt uploaded.
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Download OpenAPI schema artifact
        uses: ./.github/actions/download-artifact
        with:
          name: openapi-schema
          path: docs/openapi
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/install-js-deps
        with:
          working-directory: web
      - name: Run Vitest (shard ${{ matrix.shard }}/4; active-handle detection is part of the test run)
        working-directory: web
        env:
          # Disable colour output so the active-handle reporter's summary
          # lands as plain ASCII in CI logs (helpful for downstream
          # log-scrapers and the on-failure artifact upload).
          NO_COLOR: '1'
          # Pin the active-handle gate's mode explicitly so a shell
          # default of ACTIVE_HANDLE_MODE=log on the runner cannot
          # silently downgrade the gate from blocking to advisory.
          ACTIVE_HANDLE_MODE: 'fail'
        run: npm run test -- --coverage --shard=${{ matrix.shard }}/4
      - name: Upload active-handle telemetry artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-active-handle-telemetry-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: web/.test-tmp/handle-telemetry.json
          if-no-files-found: warn
          retention-days: 30

  # ── Dashboard: Build ──
  dashboard-build:
    name: Dashboard Build
    needs: [changes, export-openapi]
    # BUILD/PERF job (cardinal-rule exemption): production bundle + size
    # budget; skipping it on non-dashboard PRs cannot hide a correctness
    # defect. Allowlisted in check_local_ci_parity.py.
    # On merge_group the `dashboard` flag is computed correctly (paths-filter
    # base/ref), so it is the right gate in the queue. Do NOT add a
    # `github.event_name == 'merge_group'` bypass here: it would run the build
    # on dashboard-irrelevant queue entries.
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # See the coverage-aggregate job: `actions: read` keeps a re-run of
      # this job able to fetch the openapi-schema artifact the earlier
      # attempt uploaded.
      actions: read
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Download OpenAPI schema artifact
        uses: ./.github/actions/download-artifact
        with:
          name: openapi-schema
          path: docs/openapi
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The DTO drift gate (check_dto_types_ts_in_sync.py) is the
      # only step in this job that needs the Python env; type-check
      # and test don't.
      - name: Set up Python + uv (DTO drift gate)
        uses: ./.github/actions/setup-python-uv
      - uses: ./.github/actions/install-js-deps
        with:
          working-directory: web
      - name: DTO TypeScript drift gate
        run: uv run python scripts/check_dto_types_ts_in_sync.py
      - name: Production build
        run: npm run build
        working-directory: web
      # Bundle-size budgets are enforced inside the same job to reuse
      # the just-built ``dist/`` artifact -- a separate job would have
      # to ``npm ci`` + ``npm run build`` again, doubling Vite's
      # cost (~2-3 min) per PR.
      - name: size-limit budget check
        run: npm run size
        working-directory: web

  # ── Dashboard: Security Audit ──
  dashboard-audit:
    name: Dashboard Security Audit
    needs: changes
    if: needs.changes.outputs.is_release_please != 'true' # always-run correctness gate (cardinal rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/install-js-deps
        with:
          working-directory: web
      - name: npm audit (critical + high)
        # Audit the shipped dependency tree only. The dashboard bundle
        # carries no dev tooling, so a build-time-only advisory (glob /
        # minimatch brace expansion in codegen and lighthouse, which never
        # process untrusted runtime input) is not a production risk and
        # must not red-gate every PR while its transitive chain waits on a
        # compatible upstream fix.
        run: npm audit --omit=dev --audit-level=high
        working-directory: web

  # ── Dashboard: Storybook Build ──
  dashboard-storybook-build:
    name: Dashboard Storybook Build
    needs: changes
    # BUILD job (cardinal-rule exemption): Storybook static build; skipping
    # it on non-dashboard PRs cannot hide a correctness defect. Allowlisted
    # in check_local_ci_parity.py.
    # See dashboard-build: the `dashboard` flag is the correct merge_group
    # gate; do NOT add a `merge_group` event bypass here.
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/install-js-deps
        with:
          working-directory: web
      - name: Run npm run storybook:build -- --disable-telemetry
        run: npm run storybook:build -- --disable-telemetry
        working-directory: web
        env:
          # Prevent OOM-induced crashes on CI runners with limited RAM.
          # --report-on-fatalerror captures Node.js-level crashes (OOM,
          # assertions) but NOT native addon SIGSEGV -- those need OS
          # core dumps. --report-directory ensures reports land in a
          # predictable location for artifact upload.
          NODE_OPTIONS: "--max-old-space-size=4096 --report-on-fatalerror --report-directory=."
      - name: Upload Node.js crash report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-crash-report
          path: web/report.*.json
          if-no-files-found: ignore

  # ── Dashboard: Playwright E2E flows ──
  dashboard-e2e:
    name: Dashboard E2E (Playwright)
    needs: changes
    # BUILD-dependent job (cardinal-rule exemption): drives the built
    # dashboard bundle through a headless browser. A non-dashboard PR
    # cannot regress the UI flows, so skipping it there cannot hide a
    # correctness defect. Allowlisted in check_local_ci_parity.py.
    # See dashboard-build: the `dashboard` flag is the correct merge_group
    # gate; do NOT add a `merge_group` event bypass here.
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/install-js-deps
        with:
          working-directory: web
      - name: Install Playwright chromium + OS deps
        run: npx playwright install --with-deps chromium
        working-directory: web
      # The Playwright config's webServer runs ``npm run preview``, which
      # serves ``dist/``; build it first so the preview server has a bundle.
      - name: Production build (preview server source)
        run: npm run build
        working-directory: web
      # Functional flow specs only (the desktop-chromium project). Visual
      # screenshot specs (e2e/visual) need committed per-platform baselines
      # and are out of scope for this gate.
      - name: Run Playwright flow specs
        # No --retries here: the count lives in web/playwright.config.ts, which
        # already applies 2 under CI. A CLI flag would silently override it and
        # leave the config value dead.
        run: npx playwright test e2e/flows --project=desktop-chromium
        working-directory: web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  # ── Branch-protection drift audit ──
  # Compares live rulesets against .github/branch_protection.yml. Runs on
  # push to main and workflow_dispatch only (it needs the release-env App
  # token, which PRs and forks lack), so it is a post-merge alarm rather
  # than a pre-merge gate. Blocking: detected drift fails the Audit step
  # and turns the main-branch CI run red.
  #
  # Authentication: the GitHub rulesets REST API requires a token with
  # ``administration: read`` scope. GITHUB_TOKEN cannot be granted that
  # scope via workflow permissions, so the job mints a fresh
  # ``synthorg-repo-bot`` App installation token via the shared
  # ``release-runner-setup`` composite. The App's scope is already
  # Contents RW + PRs RW + Metadata R (see docs/reference/github-
  # environments.md); rulesets are accessible to any installation with
  # metadata read, which is sufficient for this read-only audit.
  # PR-time half of the ruleset audit. The full audit below needs
  # `administration: read` to fetch the live rulesets, a scope GITHUB_TOKEN
  # cannot hold, so it needs the App token from the main-restricted `release`
  # environment and can only run post-merge. That covers out-of-band UI edits.
  # This job needs no token and covers the other case: a PR changed the spec,
  # so the live ruleset will need applying at merge. Advisory, because applying
  # it BEFORE merge would block every other open PR on a context main does not
  # yet produce.
  branch-protection-spec:
    name: Branch-protection spec change
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Needs the base commit on disk to diff the spec against it.
          fetch-depth: "0"
          persist-credentials: false
      - name: Install yq
        env:
          # SHA-256 of yq_linux_amd64 v4.45.1. A release asset can be replaced
          # under an existing tag, so the tag alone is not a pin; every other
          # input in this tree (action SHAs, image digests, tool versions) is
          # pinned and this download was the remaining gap.
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: v4.45.1
          YQ_SHA256: 654d2943ca1d3be2024089eb4f270f4070f491a0610481d128509b2834870049
        run: |
          set -euo pipefail
          # 60s of retries, not 300: this job's timeout is 5 minutes, so a
          # 300s download budget could consume the whole of it and leave
          # nothing for the version check and the spec-change script below.
          curl -sSfL --connect-timeout 15 --retry 5 --retry-all-errors --retry-max-time 60 \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum --check --strict
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          # check_branch_protection_spec_changed.sh reads the required contexts
          # under `2>/dev/null || true`, so an unusable binary yields an empty
          # list and a summary that quietly claims the spec requires nothing.
          # Prove the binary runs before that step trusts its output.
          yq --version
      - name: Report spec change
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check_branch_protection_spec_changed.sh

  branch-protection-audit:
    name: Branch-protection drift audit
    # Accept push-to-main (informational) AND workflow_dispatch from
    # main so the audit can be triggered ad-hoc. The ``release`` environment's branch policy
    # also restricts deploys to main, so allowing this job to attempt
    # a deploy from a non-main ref would surface a noisy "deployment
    # was rejected" annotation on every CI run dispatched against a
    # release-please branch (the standard nudge used by release-cut.yml
    # to trigger CI on App-token-authored PRs). Gate at the if: check
    # so non-main dispatches simply skip this job.
    #
    # Fork gate: skip in forks. The audit needs the release-bot App
    # token (env-scoped secret on `release`) and a fork won't have it.
    # ci-preflight reports the missing setup separately.
    #
    # Precedence: `&&` binds tighter than `||`, so the inner
    # parentheses around `(push || dispatch)` are required to keep
    # the trigger-OR group intact under the outer fork-AND-main-AND.
    if: >-
      !github.event.repository.fork
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    # The audit retries every ruleset read; the per-call budget below
    # (GH_RETRY_ATTEMPTS) caps audit runtime regardless of ruleset count, but
    # this job also runs a yq install with its own ~5-minute curl retry budget,
    # so give the whole job headroom rather than risk a mid-retry kill. 15
    # minutes leaves room for the 4-attempt retry ladder to ride out a transient
    # GitHub API window without the backoff accumulating into a timeout kill.
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Release runner setup
        id: setup
        uses: ./.github/actions/release-runner-setup
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          # Read-only audit of the GitHub rulesets API; metadata:read is
          # the minimum scope sufficient for that surface.
          permission-metadata: read
      - name: Install yq
        env:
          # See the spec-change job's Install yq step: the tag is not a pin,
          # because a release asset can be replaced under an existing tag.
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: v4.45.1
          YQ_SHA256: 654d2943ca1d3be2024089eb4f270f4070f491a0610481d128509b2834870049
        run: |
          set -euo pipefail
          # yq (Mike Farah) -- Go binary, no runtime deps.  Retry on
          # transient GitHub-releases CDN flakes.
          curl -sSfL --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum --check --strict
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version
      - name: Audit
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          # Pass the repo explicitly so the script never depends on
          # `gh repo view` inference, which is fragile under
          # persist-credentials: false (and masked a transient 401 as a
          # bogus "could not infer repo" failure).
          GH_REPO: ${{ github.repository }}
          # Retry budget for this read-only, best-effort audit: it makes a
          # rulesets-list call plus one fetch per ruleset, each retried by
          # gh_with_retry.sh. Four attempts absorb a transient GitHub API window
          # that outlasts a single retry; the 15-minute job timeout above gives
          # the accumulated backoff room so it cannot be killed mid-ladder.
          # Sustained degradation past the budget still defers via exit 75 (the
          # audit's designed re-audit-next-push path).
          GH_RETRY_ATTEMPTS: 4
        run: bash scripts/audit_branch_protection.sh

  # ── Gate: all required checks passed ──
  ci-pass:
    name: CI Pass
    if: always()
    needs: [changes, lint, doc-drift, pin-drift-regression, runtime-stats-freshness, schema-validate, type-check, type-check-pyright, openapi-liveness, export-openapi, test-unit, test-integration, test-e2e, test-conformance-sqlite, test-coverage-aggregate, python-audit, dockerfile-lint, dashboard-lint, dashboard-type-check, dashboard-test, dashboard-build, dashboard-audit, dashboard-storybook-build, dashboard-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          # Jobs that were skipped (not needed) count as passing.
          # Only "failure" is a real failure.
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.lint.result }}
            ${{ needs.doc-drift.result }}
            ${{ needs.pin-drift-regression.result }}
            ${{ needs.runtime-stats-freshness.result }}
            ${{ needs.schema-validate.result }}
            ${{ needs.type-check.result }}
            ${{ needs.type-check-pyright.result }}
            ${{ needs.openapi-liveness.result }}
            ${{ needs.export-openapi.result }}
            ${{ needs.test-unit.result }}
            ${{ needs.test-integration.result }}
            ${{ needs.test-e2e.result }}
            ${{ needs.test-conformance-sqlite.result }}
            ${{ needs.test-coverage-aggregate.result }}
            ${{ needs.python-audit.result }}
            ${{ needs.dockerfile-lint.result }}
            ${{ needs.dashboard-lint.result }}
            ${{ needs.dashboard-type-check.result }}
            ${{ needs.dashboard-test.result }}
            ${{ needs.dashboard-build.result }}
            ${{ needs.dashboard-audit.result }}
            ${{ needs.dashboard-storybook-build.result }}
            ${{ needs.dashboard-e2e.result }}
        run: |
          # Any "failure" or "cancelled" in the results means CI failed.
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed. Job results: $RESULTS"
            exit 1
          fi
          echo "All CI checks passed (some may have been skipped due to path filters)"
