name: Build - Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  # No `paths:` filter: `Docker Pass` is a required check, and GitHub treats a
  # never-reported required context as unsatisfied, blocking the PR forever.
  # Scoping lives on the `changes` job instead.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Every job below that downloads an artifact carries `actions: read` and
# hands its composite action the workflow token. Without both,
# `download-artifact` falls back to the runtime token, whose scope covers
# only the CURRENT run attempt: re-running a failed job then 404s
# ("GetSignedArtifactURL ... workflow run not found") on the tarball the
# earlier attempt uploaded, so the only recovery is a full re-run of the
# whole matrix.
#
# The trade-off is deliberate and worth stating plainly, because it is larger
# than "read-only": `actions: read` is repo-wide, so it also exposes artifacts,
# run metadata and job logs from every past run, not just this one, and these
# jobs each run several third-party actions. GitHub offers no narrower
# current-run-only artifact scope, so this is the minimum that makes a failed
# job recoverable. It grants no write surface, and secret values stay masked.

# PR runs cancel each other (we don't care about intermediate PR-build
# artifacts). Non-PR events key on the SHA: a main-push and a
# tag-push for the same commit (the release-please flow) share the
# group and queue serially -- the tag-push retag jobs require the
# main-push publish to have completed first. Successive main-pushes
# of different SHAs run in parallel because main-push only emits the
# unique `sha-<short>` tag (no shared mutable tags), so there is
# nothing for them to race on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: "0.74.0"
  # renovate: datasource=github-releases depName=chainguard-dev/apko
  APKO_VERSION: "v1.2.39"

jobs:
  # Detect which domains changed so docs-only PRs skip backend/sandbox builds
  changes:
    name: Detect Docker Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # ANDed with "not release-please": such a PR touches pyproject.toml, which
    # sits in the backend and fine-tune filters, so a version bump would
    # otherwise build both images for source that did not change.
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' && steps.rp.outputs.is_release_please != 'true' }}
      sandbox: ${{ steps.filter.outputs.sandbox == 'true' && steps.rp.outputs.is_release_please != 'true' }}
      openhands: ${{ steps.filter.outputs.openhands == 'true' && steps.rp.outputs.is_release_please != 'true' }}
      sidecar: ${{ steps.filter.outputs.sidecar == 'true' && steps.rp.outputs.is_release_please != 'true' }}
      fine-tune: ${{ steps.filter.outputs.fine-tune == 'true' && steps.rp.outputs.is_release_please != 'true' }}
      web: ${{ steps.filter.outputs.web == 'true' && steps.rp.outputs.is_release_please != 'true' }}
    steps:
      # fetch-depth: 0. See verify-backend.yml Detect Changes for full rationale:
      # paths-filter on push: events races on shallow checkouts.
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          persist-credentials: false
      # Author identity, not just the branch name: on a fork `pull_request`,
      # `head_ref` is attacker-controlled.
      - name: Detect release-please PR
        id: rp
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [[ "${HEAD_REF}" == release-please--* && "${PR_AUTHOR}" == "synthorg-repo-bot[bot]" ]]; then
            echo "is_release_please=true" >> "$GITHUB_OUTPUT"
            echo "Release-please PR: image builds short-circuited."
          else
            echo "is_release_please=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'docker/backend/**'
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.dockerignore'
              - '.github/workflows/build-images.yml'
              - '.github/actions/build-apko-base/**'
              - '.github/actions/build-scan-image/**'
              - '.github/actions/cis-scan/**'
              - '.github/actions/publish-apko-base/**'
              - '.github/actions/publish-image/**'
              - '.github/actions/publish-image-loaded/**'
              - '.github/actions/setup-apko/**'
              - 'scripts/cis-scan.sh'
            sandbox:
              - 'docker/sandbox/**'
              - '.dockerignore'
              - '.github/workflows/build-images.yml'
              - '.github/actions/build-apko-base/**'
              - '.github/actions/build-scan-image/**'
              - '.github/actions/cis-scan/**'
              - '.github/actions/publish-apko-base/**'
              - '.github/actions/publish-image/**'
              - '.github/actions/publish-image-loaded/**'
              - '.github/actions/setup-apko/**'
              - 'scripts/cis-scan.sh'
            # docker/sandbox/** is in scope because the OpenHands Dockerfile
            # builds FROM the sandbox apko base. The engine package and the
            # contract test are in scope because that test runs in this
            # image's build job and drives the production spec/event codecs.
            openhands:
              - 'docker/openhands/**'
              - 'docker/sandbox/**'
              - 'src/synthorg/engine/openhands/**'
              # The boot gate that decides whether the loop exists at all, and
              # the sandbox config carrying its egress pinning: a change here
              # can break the container contract without touching the image.
              - 'src/synthorg/workers/_openhands_wiring.py'
              - 'src/synthorg/tools/sandbox/**'
              - 'docker/sidecar/**'
              # The contract test drives the production event codec, which
              # reaches into these; a change there can break the run protocol
              # without touching anything named openhands.
              - 'src/synthorg/core/**'
              - 'src/synthorg/observability/**'
              - 'tests/_shared/**'
              - 'tests/integration/engine/test_openhands_container_contract.py'
              - '.dockerignore'
              - '.github/workflows/build-images.yml'
              - '.github/actions/build-apko-base/**'
              - '.github/actions/build-scan-image/**'
              - '.github/actions/cis-scan/**'
              - '.github/actions/publish-apko-base/**'
              - '.github/actions/publish-image/**'
              - '.github/actions/publish-image-loaded/**'
              - '.github/actions/setup-apko/**'
              - '.github/actions/setup-python-uv/**'
              - 'scripts/cis-scan.sh'
            sidecar:
              - 'docker/sidecar/**'
              - '.dockerignore'
              - '.github/workflows/build-images.yml'
              - '.github/actions/build-apko-base/**'
              - '.github/actions/build-scan-image/**'
              - '.github/actions/cis-scan/**'
              - '.github/actions/publish-apko-base/**'
              - '.github/actions/publish-image/**'
              - '.github/actions/publish-image-loaded/**'
              - '.github/actions/setup-apko/**'
              - 'scripts/cis-scan.sh'
            fine-tune:
              - 'docker/fine-tune/**'
              # The Dockerfile does `COPY src/ src/`, so src/** is what
              # changes the image, and a narrower glob is an approximation
              # of the entrypoint's import closure rather than a fact about
              # it. Scoping to a hand-derived closure was tried and is not
              # safe to derive: Python executes every ancestor package
              # __init__ on the way to a submodule, and this tree's hubs
              # import eagerly, so the real closure reaches 20 packages at
              # import time (557 modules) including tools/, engine/,
              # security/ and integrations/.
              #
              # A miss here costs a PR-time build and scan, never a stale
              # image: on a push to main `changes` does not run, so the
              # build job's `changes.result == 'skipped'` arm publishes
              # unconditionally.
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.dockerignore'
              - '.github/workflows/build-images.yml'
              - '.github/actions/build-apko-base/**'
              - '.github/actions/build-scan-image/**'
              - '.github/actions/cis-scan/**'
              - '.github/actions/publish-apko-base/**'
              - '.github/actions/publish-image/**'
              - '.github/actions/publish-image-loaded/**'
              - '.github/actions/setup-apko/**'
              - 'scripts/cis-scan.sh'
            web:
              - 'docker/web/**'
              - 'web/**'
              - 'docs/**'
              - 'mkdocs.yml'
              - 'scripts/export_openapi.py'
              - 'src/synthorg/api/**'
              - '.github/workflows/build-images.yml'
              - '.github/actions/build-apko-base/**'
              - '.github/actions/cis-scan/**'
              - '.github/actions/publish-image-loaded/**'
              - '.github/actions/setup-apko/**'
              - '.github/actions/setup-melange/**'
              - '.github/actions/setup-python-uv/**'
              - 'scripts/cis-scan.sh'

  # Extract app version from pyproject.toml (single source of truth)
  version:
    name: Extract Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      deployment_env: ${{ steps.deployment-env.outputs.deployment_env }}
      arches: ${{ steps.arches.outputs.arches }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c "
          import tomllib
          import sys
          try:
              with open('pyproject.toml', 'rb') as f:
                  data = tomllib.load(f)
              print(data['tool']['commitizen']['version'])
          except (KeyError, FileNotFoundError) as e:
              print(f'::error::Failed to extract version: {e}', file=sys.stderr)
              sys.exit(1)
          ")
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "App version: ${VERSION}"

      # Resolve the deployment environment baked into backend images
      # built by this run. Ties into the existing version-label logic:
      # final release tags (e.g. v0.7.0) -> "prod"; every other tagged
      # pre-release form (-dev.N, -rc.N, -alpha.N, -beta.N) -> "pre-release";
      # everything else (main pushes, PR builds, workflow_dispatch manual
      # runs, and any local `docker build` without --build-arg) -> "dev".
      # The backend Dockerfile reads this as a build-arg and bakes it
      # into SYNTHORG_TELEMETRY_ENV_BAKED, which
      # synthorg.telemetry.collector._resolve_environment picks up as
      # the fallback tag when no operator override or CI auto-detection
      # applies.
      - name: Resolve baked deployment environment
        id: deployment-env
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            case "${GITHUB_REF}" in
              *-dev.*|*-rc.*|*-alpha.*|*-beta.*)
                ENV_TAG="pre-release"
                ;;
              *)
                ENV_TAG="prod"
                ;;
            esac
          else
            ENV_TAG="dev"
          fi
          echo "deployment_env=${ENV_TAG}" >> "$GITHUB_OUTPUT"
          echo "Deployment env (baked into backend image): ${ENV_TAG}"

      # Both arches on every event, pull_request included. An arm64-only
      # break (a package with no aarch64 build, an arch-specific wheel, a
      # RUN that assumes x86) would otherwise pass Docker Pass, merge, then
      # fail on main, leaving that SHA with no image for the next release to
      # retag. Each arch is a native runner in parallel so this costs no
      # wall clock, and the tarball upload is already gated off pull_request,
      # so a PR still builds and scans both while publishing neither.
      - name: Resolve build architectures
        id: arches
        run: |
          ARCHES='["amd64","arm64"]'
          echo "arches=${ARCHES}" >> "$GITHUB_OUTPUT"
          echo "Build architectures: ${ARCHES}"

  # =========================================================================
  # Compose file validation -- catches syntax errors early
  # =========================================================================
  validate-compose:
    name: Validate Compose Files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate compose files
        run: |
          # Placeholder values for compose interpolation. The Dockerfile is
          # never built during `compose config`, so these values just need
          # to silence "variable not set" warnings; they are not consumed.
          {
            echo "POSTGRES_PASSWORD=ci-validation-dummy"
            echo "BASE_IMAGE=ci-validation-dummy:placeholder"
            echo "SYNTHORG_REPO_ROOT=${GITHUB_WORKSPACE}"
            echo "SYNTHORG_BACKEND_BASE_IMAGE=ci-validation-dummy:placeholder"
          } > docker/.env
          docker compose -f docker/compose.yml config --quiet
          docker compose -f docker/compose.yml -f docker/compose.distributed.yml --profile distributed config --quiet
          docker compose -f docker/compose.yml -f docker/compose.override.yml config --quiet
          # The dev overlay is applied over whatever file made the operator's
          # stack; validating it over the shipped one is the same merge shape
          # and catches a key typo or a bad tag that a YAML parse cannot.
          docker compose -f docker/compose.yml -f docker/compose.dev.yml config --quiet

      - name: Report tmpfs allocations
        run: |
          echo "## tmpfs Allocations" >> "$GITHUB_STEP_SUMMARY"
          for f in docker/compose.yml docker/compose.distributed.yml docker/compose.override.yml docker/compose.dev.yml; do
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'tmpfs:|^\s+- /.*size=' "$f" >> "$GITHUB_STEP_SUMMARY" || echo "_none_" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

  # =========================================================================
  # apko base images -- Wolfi-composed bases (all use build-apko-base action)
  # =========================================================================
  # The build-*-base jobs run on every event (PR, push, tag). They only need
  # `security-events: write` to upload Trivy SARIF results. The companion
  # build-*-base-publish jobs run on non-PR events and carry the elevated
  # permissions needed to push, sign, and attest the image.
  build-backend-base:
    name: Build Backend Base (apko)
    needs: [version, changes, validate-compose]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball-name: ${{ steps.build.outputs.tarball-name }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: build
        uses: ./.github/actions/build-apko-base
        with:
          image-name: backend
          apko-yaml: docker/backend/apko.yaml
          apko-version: ${{ env.APKO_VERSION }}
          trivy-version: ${{ env.TRIVY_VERSION }}

  build-backend-base-publish:
    name: Publish Backend Base (apko)
    needs: [version, build-backend-base]
    # Main-push only: tag-push runs the retag-* jobs instead, which
    # apply version tags to main-run's already-signed digest without
    # rebuilding. Restricting to `refs/heads/main` (rather than
    # `event_name != 'pull_request'`) blocks workflow_dispatch from
    # arbitrary feature branches from pushing/signing base images.
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.build-backend-base.result == 'success'
    # Permissions are granted HERE, not only in the called workflow: a called
    # workflow inherits the caller's token scopes and can narrow them, never
    # widen them, so omitting these would leave it unable to push or attest.
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-publish-apko-base.yml
    with:
      image-name: backend
      tag: ${{ needs.build-backend-base.outputs.tag }}
      artifact-name: ${{ needs.build-backend-base.outputs.artifact-name }}
      tarball-name: ${{ needs.build-backend-base.outputs.tarball-name }}

  # Also gated on the openhands filter: the OpenHands image builds FROM this
  # base, so a docker/openhands-only diff still has to produce it or
  # build-openhands has no `FROM` to resolve.
  build-sandbox-base:
    name: Build Sandbox Base (apko)
    needs: [version, changes, validate-compose]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      (needs.changes.result == 'skipped' ||
        needs.changes.outputs.sandbox == 'true' ||
        needs.changes.outputs.openhands == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball-name: ${{ steps.build.outputs.tarball-name }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: build
        uses: ./.github/actions/build-apko-base
        with:
          image-name: sandbox
          apko-yaml: docker/sandbox/apko.yaml
          apko-version: ${{ env.APKO_VERSION }}
          trivy-version: ${{ env.TRIVY_VERSION }}

  build-sandbox-base-publish:
    name: Publish Sandbox Base (apko)
    needs: [version, build-sandbox-base]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.build-sandbox-base.result == 'success'
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-publish-apko-base.yml
    with:
      image-name: sandbox
      tag: ${{ needs.build-sandbox-base.outputs.tag }}
      artifact-name: ${{ needs.build-sandbox-base.outputs.artifact-name }}
      tarball-name: ${{ needs.build-sandbox-base.outputs.tarball-name }}

  build-sidecar-base:
    name: Build Sidecar Base (apko)
    needs: [version, changes, validate-compose]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.sidecar == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball-name: ${{ steps.build.outputs.tarball-name }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: build
        uses: ./.github/actions/build-apko-base
        with:
          image-name: sidecar
          apko-yaml: docker/sidecar/apko.yaml
          apko-version: ${{ env.APKO_VERSION }}
          trivy-version: ${{ env.TRIVY_VERSION }}

  build-sidecar-base-publish:
    name: Publish Sidecar Base (apko)
    needs: [version, build-sidecar-base]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.build-sidecar-base.result == 'success'
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-publish-apko-base.yml
    with:
      image-name: sidecar
      tag: ${{ needs.build-sidecar-base.outputs.tag }}
      artifact-name: ${{ needs.build-sidecar-base.outputs.artifact-name }}
      tarball-name: ${{ needs.build-sidecar-base.outputs.tarball-name }}

  build-fine-tune-base:
    name: Build Fine-Tune Base (apko)
    needs: [version, changes, validate-compose]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.fine-tune == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball-name: ${{ steps.build.outputs.tarball-name }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: build
        uses: ./.github/actions/build-apko-base
        with:
          image-name: fine-tune
          apko-yaml: docker/fine-tune/apko.yaml
          apko-version: ${{ env.APKO_VERSION }}
          trivy-version: ${{ env.TRIVY_VERSION }}

  build-fine-tune-base-publish:
    name: Publish Fine-Tune Base (apko)
    needs: [version, build-fine-tune-base]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.build-fine-tune-base.result == 'success'
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-publish-apko-base.yml
    with:
      image-name: fine-tune
      tag: ${{ needs.build-fine-tune-base.outputs.tag }}
      artifact-name: ${{ needs.build-fine-tune-base.outputs.artifact-name }}
      tarball-name: ${{ needs.build-fine-tune-base.outputs.tarball-name }}
      architectures: "amd64"

  # =========================================================================
  # Application images -- thin Dockerfile wrappers over apko bases
  # =========================================================================
  build-backend:
    name: Build Backend (${{ matrix.arch }})
    needs: [version, build-backend-base, build-backend-base-publish]
    # On PR events publish is always skipped (guarded to main), so the
    # app build falls back to the locally-loaded scan artifact. On any
    # non-PR event we require publish to have succeeded -- this makes
    # workflow_dispatch from a feature branch skip the app build entirely
    # instead of trying to pull a base tag that was never pushed to GHCR.
    # Tag pushes skip the build/publish path entirely; the retag-* jobs
    # apply version tags to main-run's already-signed digest.
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      needs.build-backend-base.result == 'success' &&
      (github.event_name == 'pull_request' || needs.build-backend-base-publish.result == 'success')
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      # An arm64 failure must not cancel a healthy amd64 build.
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.version.outputs.arches) }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build and scan backend image
        id: build_scan
        uses: ./.github/actions/build-scan-image
        with:
          image-name: backend
          platform: ${{ matrix.arch }}
          display-name: Backend
          dockerfile: docker/backend/Dockerfile
          app-version: ${{ needs.version.outputs.app_version }}
          base-image-repo: ghcr.io/aureliolo/synthorg-backend-base
          base-image-tag: ${{ needs.build-backend-base.outputs.tag }}
          base-image-digest: ${{ needs.build-backend-base-publish.outputs.digest }}
          base-image-artifact-name: ${{ needs.build-backend-base.outputs.artifact-name }}
          base-image-tarball-name: ${{ needs.build-backend-base.outputs.tarball-name }}
          trivy-version: ${{ env.TRIVY_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # ``LOGFIRE_PROJECT_TOKEN`` is the GHA repo secret; the
          # Dockerfile's ``embed_logfire_token.py`` step writes it
          # into ``_embedded_token.py`` before ``uv sync`` packages
          # the venv, so published images carry the token while PR
          # / non-secret-bearing builds (e.g. forks) keep the
          # sentinel and run telemetry disabled-by-build.
          # Pull-request events deliberately receive an empty token:
          # unreviewed PR code paths must not have access to the
          # write-only project secret.
          extra-build-args: |
            DEPLOYMENT_ENV=${{ needs.version.outputs.deployment_env }}
            LOGFIRE_PROJECT_TOKEN=${{ github.event_name != 'pull_request' && secrets.LOGFIRE_PROJECT_TOKEN || '' }}

      # Smoke-test the just-built backend image. Runs on EVERY event
      # that builds the image (PR, push to main, v* tag pushes,
      # workflow_dispatch) -- intentionally NOT gated to PRs only.
      # Catches broken boot paths (404 on the wrong probe URL,
      # missing migration, entrypoint crash, etc.) before publish.
      #
      # Why every event, not just PRs:
      #   - PR path: fails the originating PR with a red ❌ on the
      #     commit row.
      #   - push to main: catches regressions in commits that did
      #     NOT come through PR CI -- auto-rollover empty commits
      #     (release-rollover.yml), release-please bumps, hotfixes
      #     pushed via the CLI, etc. Without smoke here, those
      #     commits would let build-backend-publish push a broken
      #     image straight to GHCR.
      #   - tag push: same story for release-graduate.yml + manual tags.
      #   - workflow_dispatch: protects ad-hoc rebuilds.
      #
      # Single source-of-truth gate for a broken boot path; nothing
      # downstream re-tests it. Probes /api/v1/healthz under compose's CPU
      # and memory limits, against a deadline derived from the image's own
      # HEALTHCHECK start period. Runs on both arches now that each builds
      # natively.
      - name: Smoke-test backend image
        uses: ./.github/actions/smoke-test-backend-image
        with:
          image: ${{ steps.build_scan.outputs.ref }}

  build-backend-publish:
    name: Publish Backend
    needs: [version, build-backend]
    if: >-
      !cancelled() &&
      needs.build-backend.result == 'success' &&
      github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      image-name: backend
      app-version: ${{ needs.version.outputs.app_version }}

  # =========================================================================
  # Web image -- melange-packaged assets + pure apko (no Dockerfile)
  # =========================================================================
  build-web-assets:
    name: Build Web Assets (melange)
    needs: [version, changes, validate-compose]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Set up Python + uv (OpenAPI export + docs build)
        uses: ./.github/actions/setup-python-uv

      - name: Export OpenAPI schema (required by frontend codegen)
        run: uv run python scripts/export_openapi.py

      # `npm ci` hits the npm registry for every transitive dep, and npm's
      # optional-dependency reify bug (npm/cli#4828) can silently drop a
      # platform native binding. The composite retries on registry blips and
      # verifies + repairs any missing native binding before the build runs.
      - name: Install frontend deps
        uses: ./.github/actions/install-js-deps
        with:
          working-directory: web
          npm-ci-args: --ignore-scripts

      - name: Build SPA
        working-directory: web
        run: npm run build

      # D2 does not publish checksums or signatures in its releases;
      # integrity relies on HTTPS transport from GitHub. Accepted tradeoff:
      # D2 is a docs-only diagramming tool (not a security scanner).
      # Version managed by Renovate (regex manager in renovate.json).
      - name: Install D2
        env:
          # renovate: datasource=github-releases depName=terrastruct/d2
          D2_VERSION: v0.7.1
        run: |
          curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz" -o /tmp/d2.tar.gz
          tar -xzf /tmp/d2.tar.gz -C /tmp
          sudo mv "/tmp/d2-${D2_VERSION}/bin/d2" /usr/local/bin/d2
          rm -rf /tmp/d2.tar.gz "/tmp/d2-${D2_VERSION}"

      - name: Build documentation
        env:
          PYTHONPATH: .
        run: uv run zensical build

      - name: Set up melange
        # Local action: a retrying, checksum-verified binary download (twin
        # of setup-apko) plus the sandbox prerequisites melange needs --
        # bubblewrap with unprivileged userns permitted, static qemu for the
        # emulated aarch64 leg, and the build toolchain. A transient
        # release-CDN or mirror blip is absorbed by the retry budgets; only
        # a sustained outage fails the step. Renovate watches the binary
        # version via the marker below.
        uses: ./.github/actions/setup-melange
        with:
          # renovate: datasource=github-releases depName=chainguard-dev/melange
          version: v0.59.1

      - name: Generate melange signing key
        run: melange keygen

      # Each `melange build` pulls Wolfi apks from packages.wolfi.dev for
      # build/runtime deps; a single 5xx on that mirror fails the whole arch
      # leg. Retry per-arch so a transient mirror blip doesn't kill the run.
      # Build arches sequentially -- melange v0.49.0 bubblewrap runner has a
      # bind-mount race when building multiple arches in parallel, causing
      # web/dist/ to be invisible in one guest.
      # DEFERRED(setup-melange>v1.6.15 / melange>0.49.0): parallelise the
      # per-arch builds once the upstream bubblewrap bind-mount concurrency
      # fix lands and the pin advances past those versions. Parallel arch
      # builds would cut this step from ~6m to ~3m on the critical path.
      - name: Build web-assets apk (x86_64)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            printf 'version: %s\n' "$APP_VERSION" > /tmp/melange-vars.yaml
            melange build docker/web/melange.yaml \
              --arch x86_64 \
              --source-dir . \
              --signing-key melange.rsa \
              --out-dir packages/ \
              --vars-file /tmp/melange-vars.yaml

      - name: Build web-assets apk (aarch64)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            printf 'version: %s\n' "$APP_VERSION" > /tmp/melange-vars.yaml
            melange build docker/web/melange.yaml \
              --arch aarch64 \
              --source-dir . \
              --signing-key melange.rsa \
              --out-dir packages/ \
              --vars-file /tmp/melange-vars.yaml

      - name: Upload packages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-apk-packages
          path: |
            packages/
            melange.rsa.pub
          retention-days: 1

  build-web:
    name: Build Web (apko)
    needs: [version, build-web-assets]
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      needs.build-web-assets.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare work directory
        run: sudo mkdir -p /work && sudo chown "$(id -u):$(id -g)" /work

      - name: Download web-assets apk
        uses: ./.github/actions/download-artifact
        with:
          name: web-apk-packages
          path: /work
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up apko
        uses: ./.github/actions/setup-apko
        with:
          version: ${{ env.APKO_VERSION }}

      # Compute the short-SHA tag in a bash step so the substring expansion
      # `${GITHUB_SHA::7}` runs under bash. nick-fields/retry's `command:`
      # runs under `sh` by default, where that expansion is a syntax error.
      - name: Compute image tag
        id: web-image-ref
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # `apko build` pulls every package from the Wolfi mirror. Retry so a
      # mirror 5xx doesn't tank the whole web build.
      - name: Build web image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          TAG: ${{ steps.web-image-ref.outputs.tag }}
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            apko build docker/web/apko.yaml \
              "ghcr.io/aureliolo/synthorg-web:${TAG}" \
              web.tar

      - name: Load image for scanning
        run: |
          docker load -i web.tar
          docker tag "ghcr.io/aureliolo/synthorg-web:sha-${GITHUB_SHA::7}-amd64" "ghcr.io/aureliolo/synthorg-web:sha-${GITHUB_SHA::7}" 2>/dev/null || true

      - name: Compute scan image ref
        id: scan-ref
        run: echo "ref=ghcr.io/aureliolo/synthorg-web:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Report image size
        env:
          SCAN_REF: ${{ steps.scan-ref.outputs.ref }}
        run: scripts/report-image-size.sh "${SCAN_REF}" "Web"

      - name: Install Trivy
        run: |
          curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o "/tmp/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy_checksums.txt
          (cd /tmp && grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

      - name: Trivy scan
        env:
          SCAN_REF: ${{ steps.scan-ref.outputs.ref }}
        run: |
          trivy image "${SCAN_REF}" --format json --output trivy-web.json \
            --exit-code 0 --severity CRITICAL,HIGH --ignorefile .github/.trivyignore.yaml \
            --vex .github/vex/synthorg.openvex.json

      - name: Evaluate Trivy results
        run: scripts/evaluate-scan.sh --verbose trivy-web.json "Web"

      - name: Trivy SARIF scan (web)
        if: always()
        env:
          SCAN_REF: ${{ steps.scan-ref.outputs.ref }}
        run: |
          trivy image "${SCAN_REF}" --format sarif --output trivy-web.sarif \
            --exit-code 0 --severity CRITICAL,HIGH --ignorefile .github/.trivyignore.yaml \
            --vex .github/vex/synthorg.openvex.json

      - name: Upload SARIF to GitHub Security (web)
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

      - name: CIS Docker Benchmark (web)
        uses: ./.github/actions/cis-scan
        with:
          image-ref: ${{ steps.scan-ref.outputs.ref }}

      # Hand off the loaded multi-arch apko tarball to the publish-only job.
      # The publish job re-loads the tarball into its daemon rather than
      # rebuilding -- apko builds are deterministic, so this saves ~2min
      # and keeps the scanned bytes identical to the pushed bytes.
      - name: Upload web image tarball for publish job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-image-tarball
          path: web.tar
          # 7-day retention so the env-gated `build-web-publish` job can
          # still download after an approval delay.
          retention-days: 7
          # These are the bytes build-web-publish pushes; an empty upload
          # must fail here, not as a `docker load` error in that job.
          if-no-files-found: error

  build-web-publish:
    name: Publish Web (apko)
    needs: [version, build-web]
    if: >-
      !cancelled() &&
      needs.build-web.result == 'success' &&
      github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-publish-image-loaded.yml
    with:
      image-name: web
      app-version: ${{ needs.version.outputs.app_version }}
      tarball-artifact: web-image-tarball
      tarball-name: web.tar
      enable-arm64: true

  # The explicit `changes` gate is load-bearing now that the base also builds
  # for an openhands-only diff: without it, every OpenHands change would drag a
  # full sandbox build and Trivy scan along for source that did not move.
  build-sandbox:
    name: Build Sandbox (${{ matrix.arch }})
    needs: [version, changes, build-sandbox-base, build-sandbox-base-publish]
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.sandbox == 'true') &&
      needs.build-sandbox-base.result == 'success' &&
      (github.event_name == 'pull_request' || needs.build-sandbox-base-publish.result == 'success')
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.version.outputs.arches) }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build and scan sandbox image
        id: build_scan
        uses: ./.github/actions/build-scan-image
        with:
          image-name: sandbox
          platform: ${{ matrix.arch }}
          display-name: Sandbox
          dockerfile: docker/sandbox/Dockerfile
          app-version: ${{ needs.version.outputs.app_version }}
          base-image-repo: ghcr.io/aureliolo/synthorg-sandbox-base
          base-image-tag: ${{ needs.build-sandbox-base.outputs.tag }}
          base-image-digest: ${{ needs.build-sandbox-base-publish.outputs.digest }}
          base-image-artifact-name: ${{ needs.build-sandbox-base.outputs.artifact-name }}
          base-image-tarball-name: ${{ needs.build-sandbox-base.outputs.tarball-name }}
          trivy-version: ${{ env.TRIVY_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The sandbox runs every agent's commands, so anything its toolchain
      # prints on stderr lands in the run evidence a reviewer reads. A node
      # major the shipped npm does not support prints its unsupported-engine
      # banner on EVERY npm invocation; the pair drifts apart silently
      # because both packages resolve independently.
      - name: Smoke-test sandbox toolchain
        uses: ./.github/actions/smoke-test-sandbox-toolchain
        timeout-minutes: 5
        with:
          image: ${{ steps.build_scan.outputs.ref }}

  build-sandbox-publish:
    name: Publish Sandbox
    needs: [version, build-sandbox]
    if: >-
      !cancelled() &&
      needs.build-sandbox.result == 'success' &&
      github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      image-name: sandbox
      app-version: ${{ needs.version.outputs.app_version }}

  # No apko base of its own: docker/openhands/Dockerfile takes ARG BASE_IMAGE
  # and builds FROM the sandbox base, so it consumes build-sandbox-base's
  # outputs exactly the way build-sandbox does.
  build-openhands:
    name: Build OpenHands (${{ matrix.arch }})
    needs: [version, changes, build-sandbox-base, build-sandbox-base-publish]
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.openhands == 'true') &&
      needs.build-sandbox-base.result == 'success' &&
      (github.event_name == 'pull_request' || needs.build-sandbox-base-publish.result == 'success')
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # Above the sandbox's 30: this image layers a large hash-pinned pip
    # closure on top of the same base, and the amd64 leg also runs the
    # container contract test.
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.version.outputs.arches) }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build and scan openhands image
        id: image
        uses: ./.github/actions/build-scan-image
        with:
          image-name: openhands
          platform: ${{ matrix.arch }}
          display-name: OpenHands
          dockerfile: docker/openhands/Dockerfile
          app-version: ${{ needs.version.outputs.app_version }}
          base-image-repo: ghcr.io/aureliolo/synthorg-sandbox-base
          base-image-tag: ${{ needs.build-sandbox-base.outputs.tag }}
          base-image-digest: ${{ needs.build-sandbox-base-publish.outputs.digest }}
          base-image-artifact-name: ${{ needs.build-sandbox-base.outputs.artifact-name }}
          base-image-tarball-name: ${{ needs.build-sandbox-base.outputs.tarball-name }}
          trivy-version: ${{ env.TRIVY_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The contract test runs HERE rather than in a job of its own because
      # this is the only place the image is reachable on a pull request:
      # build-scan-image loads it into the runner's daemon on PR events and
      # uploads a tarball only on non-PR events, so a downstream job would have
      # nothing to pull. One arch is enough: it proves the stdin/stdout
      # protocol, not architecture coverage.
      - name: Set up Python
        if: matrix.arch == 'amd64'
        uses: ./.github/actions/setup-python-uv

      - name: Container contract test (no provider spend)
        if: matrix.arch == 'amd64'
        env:
          SYNTHORG_OPENHANDS_IMAGE: ${{ steps.image.outputs.ref }}
          RUN_INTEGRATION_TESTS: "1"
        run: |
          uv run python -m pytest -n0 \
            tests/integration/engine/test_openhands_container_contract.py -v

  build-openhands-publish:
    name: Publish OpenHands
    needs: [version, build-openhands]
    if: >-
      !cancelled() &&
      needs.build-openhands.result == 'success' &&
      github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      image-name: openhands
      app-version: ${{ needs.version.outputs.app_version }}

  build-sidecar:
    name: Build Sidecar (${{ matrix.arch }})
    needs: [version, build-sidecar-base, build-sidecar-base-publish]
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      needs.build-sidecar-base.result == 'success' &&
      (github.event_name == 'pull_request' || needs.build-sidecar-base-publish.result == 'success')
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.version.outputs.arches) }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build and scan sidecar image
        uses: ./.github/actions/build-scan-image
        with:
          image-name: sidecar
          platform: ${{ matrix.arch }}
          display-name: Sidecar
          dockerfile: docker/sidecar/Dockerfile
          app-version: ${{ needs.version.outputs.app_version }}
          base-image-repo: ghcr.io/aureliolo/synthorg-sidecar-base
          base-image-tag: ${{ needs.build-sidecar-base.outputs.tag }}
          base-image-digest: ${{ needs.build-sidecar-base-publish.outputs.digest }}
          base-image-artifact-name: ${{ needs.build-sidecar-base.outputs.artifact-name }}
          base-image-tarball-name: ${{ needs.build-sidecar-base.outputs.tarball-name }}
          trivy-version: ${{ env.TRIVY_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-sidecar-publish:
    name: Publish Sidecar
    needs: [version, build-sidecar]
    if: >-
      !cancelled() &&
      needs.build-sidecar.result == 'success' &&
      github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      image-name: sidecar
      app-version: ${{ needs.version.outputs.app_version }}

  # Fine-tune ships in two flavours. The matrix builds them in parallel:
  #   - gpu  -> ghcr.io/aureliolo/synthorg-fine-tune-gpu  (bundled CUDA, ~4 GB)
  #   - cpu  -> ghcr.io/aureliolo/synthorg-fine-tune-cpu  (CPU torch, ~1.7 GB)
  # The variant is driven by the FINE_TUNE_EXTRA build-arg; uv routes torch to
  # PyPI (CUDA) or pytorch.org/whl/cpu via [tool.uv.sources] in pyproject.toml.
  # Use a static job name. GitHub normally appends `(variant)` to each
  # matrix leg, so expanded jobs still read "Build Fine-Tune (gpu)" /
  # "(cpu)" in the UI. A `name:` that interpolates `${{ matrix.* }}`
  # leaves the raw template visible when a matrix is skipped *before*
  # expansion (the `if:` evaluates false), producing ugly check-run
  # entries like "Build Fine-Tune (${{ matrix.variant }})".
  build-fine-tune:
    name: Build Fine-Tune
    needs: [version, build-fine-tune-base, build-fine-tune-base-publish]
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      needs.build-fine-tune-base.result == 'success' &&
      (github.event_name == 'pull_request' || needs.build-fine-tune-base-publish.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gpu
            extra: fine-tune-gpu
          - variant: cpu
            extra: fine-tune-cpu
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build and scan fine-tune image
        uses: ./.github/actions/build-scan-image
        with:
          image-name: fine-tune-${{ matrix.variant }}
          display-name: "Fine-Tune (${{ matrix.variant }})"
          dockerfile: docker/fine-tune/Dockerfile
          app-version: ${{ needs.version.outputs.app_version }}
          base-image-repo: ghcr.io/aureliolo/synthorg-fine-tune-base
          base-image-tag: ${{ needs.build-fine-tune-base.outputs.tag }}
          base-image-digest: ${{ needs.build-fine-tune-base-publish.outputs.digest }}
          base-image-artifact-name: ${{ needs.build-fine-tune-base.outputs.artifact-name }}
          base-image-tarball-name: ${{ needs.build-fine-tune-base.outputs.tarball-name }}
          extra-build-args: |
            FINE_TUNE_EXTRA=${{ matrix.extra }}
          # torch / CUDA wheels publish no arm64 build.
          platform: amd64
          cache-scope: fine-tune-${{ matrix.variant }}
          free-disk-space: "true"
          trivy-version: ${{ env.TRIVY_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-fine-tune-publish:
    name: Publish Fine-Tune
    needs: [version, build-fine-tune]
    # `failure` is admitted deliberately. `build-fine-tune` is a
    # `fail-fast: false` matrix, so its aggregate result is `failure` when ANY
    # variant failed. Gating on `success` alone would let one variant's
    # transient failure withhold the healthy variant's publish as well, and
    # then fail both retag legs on the next tag push, since the images the tag
    # needs were never pushed. Each publish leg downloads its own variant's
    # tarball, so the healthy variant publishes while the failed variant's leg
    # fails loudly on the artifact it never produced. `skipped` stays excluded:
    # no build ran, so there is nothing to push.
    if: >-
      !cancelled() &&
      (needs.build-fine-tune.result == 'success' ||
        needs.build-fine-tune.result == 'failure') &&
      github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gpu
            extra: fine-tune-gpu
          - variant: cpu
            extra: fine-tune-cpu
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Matrix cells cannot expose per-variant outputs to `update-release` via
    # `needs.build-fine-tune-publish.outputs.digest` (only the last cell wins),
    # so each cell uploads its digest as an artifact instead; update-release
    # reads both via the `fine-tune-*-digest` pattern.
    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      image-name: fine-tune-${{ matrix.variant }}
      app-version: ${{ needs.version.outputs.app_version }}
      enable-arm64: false
      free-disk-space: true
      digest-artifact-name: fine-tune-${{ matrix.variant }}

  # =========================================================================
  # Retag-only jobs -- fire on `push: tags: [v*]` instead of the full
  # build/scan/publish pipeline. Resolve main-run's already-signed
  # manifest list digest for each image from GHCR's `sha-<short>` tag,
  # then apply the version tags via `docker buildx imagetools create`
  # (registry-side; no image bytes move). cosign signs by digest, so the
  # main-run signature carries forward to every new tag ref by
  # construction. Halves CI minutes on releases and eliminates the race
  # a rebuild would open, where the tag push and the main run could
  # produce two different manifests for the same commit.
  #
  # Base images (`synthorg-{x}-base`) are intentionally NOT retagged on
  # tag-push: they're internal artifacts consumed only by app
  # Dockerfiles via `FROM ...@digest`, so version tags add no consumer
  # value.
  #
  # The per-SHA concurrency group at the top of this workflow queues
  # these jobs behind the main-push run for the same SHA. If main-run
  # failed, the publish-image-retag action's "resolve signed digest"
  # step 404s with an actionable error message.
  # =========================================================================
  retag-backend:
    name: Retag Backend
    needs: [version]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !cancelled() &&
      needs.version.result == 'success'
    runs-on: ubuntu-24.04
    # Every retag job shares publish-image-retag, whose GHCR-login
    # (~8m45s worst case), digest-resolve, tag-apply, syft-install
    # (110s of backoff plus five release fetches) and syft-SBOM
    # (~15m30s worst case) steps each carry their own bounded retry
    # ladder. The job timeout must clear the SUM of those ladders, not
    # just the largest one, so a transient registry blip that trips
    # several of them in one run is retried rather than cancelled
    # mid-retry (the failure this family hit). 40 sits above the ~36m
    # composed worst case with margin for checkout, which rides its own
    # ladder. Nothing computes this sum: invariant 6 in
    # check_ci_workflow_resilience.py budgets only the docker-pull ladder
    # shape, so a new step-duplication ladder here must be added by hand.
    timeout-minutes: 40
    environment: image-push
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.retag.outputs.digest }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: retag
        uses: ./.github/actions/publish-image-retag
        with:
          image-name: backend
          app-version: ${{ needs.version.outputs.app_version }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  retag-web:
    name: Retag Web
    needs: [version]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !cancelled() &&
      needs.version.result == 'success'
    runs-on: ubuntu-24.04
    # See retag-backend: sized above the summed publish-image-retag
    # retry budget (~36m composed worst case).
    timeout-minutes: 40
    environment: image-push
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.retag.outputs.digest }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: retag
        uses: ./.github/actions/publish-image-retag
        with:
          image-name: web
          app-version: ${{ needs.version.outputs.app_version }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  retag-sandbox:
    name: Retag Sandbox
    needs: [version]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !cancelled() &&
      needs.version.result == 'success'
    runs-on: ubuntu-24.04
    # See retag-backend: sized above the summed publish-image-retag
    # retry budget (~36m composed worst case).
    timeout-minutes: 40
    environment: image-push
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.retag.outputs.digest }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: retag
        uses: ./.github/actions/publish-image-retag
        with:
          image-name: sandbox
          app-version: ${{ needs.version.outputs.app_version }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  retag-openhands:
    name: Retag OpenHands
    needs: [version]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !cancelled() &&
      needs.version.result == 'success'
    runs-on: ubuntu-24.04
    # See retag-backend: sized above the summed publish-image-retag
    # retry budget (~36m composed worst case).
    timeout-minutes: 40
    environment: image-push
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.retag.outputs.digest }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: retag
        uses: ./.github/actions/publish-image-retag
        with:
          image-name: openhands
          app-version: ${{ needs.version.outputs.app_version }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  retag-sidecar:
    name: Retag Sidecar
    needs: [version]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !cancelled() &&
      needs.version.result == 'success'
    runs-on: ubuntu-24.04
    # See retag-backend: sized above the summed publish-image-retag
    # retry budget (~36m composed worst case).
    timeout-minutes: 40
    environment: image-push
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.retag.outputs.digest }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: retag
        uses: ./.github/actions/publish-image-retag
        with:
          image-name: sidecar
          app-version: ${{ needs.version.outputs.app_version }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  # Matrix mirrors `build-fine-tune-publish`: each variant is a separate
  # image repo (`synthorg-fine-tune-gpu`, `synthorg-fine-tune-cpu`) and
  # carries its own signed digest. GitHub Actions matrix jobs cannot
  # expose per-variant `outputs:` (only the last leg's outputs would
  # win), so per-variant digests reach `update-release` via the same
  # `fine-tune-{variant}-digest` artifact pattern the build-publish
  # path uses. `verify-signatures` and `update-release` reference this
  # job by `result` only; consumers needing a per-variant digest read
  # the artifact, not `needs.retag-fine-tune.outputs.*`.
  retag-fine-tune:
    name: Retag Fine-Tune
    needs: [version]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !cancelled() &&
      needs.version.result == 'success'
    runs-on: ubuntu-24.04
    # Highest of the retag family: alone among them this job runs the
    # `Free disk space` reclaim (the GPU image is the only one large
    # enough to fill a stock runner), stacking that on top of the summed
    # publish-image-retag retry budget (~36m composed worst case). At 10
    # min the GPU leg -- largest image, slowest syft scan -- had no margin
    # and was cancelled mid-scan. 45 min clears the reclaim plus the full
    # composed retry budget so the timeout is a runaway backstop, not a
    # starvation trigger.
    #
    # A cancellation here is no longer merely a lost run: `verify-signatures`
    # refuses to certify ANY image while a publisher ended `cancelled`,
    # because a job reaped mid-push leaves tags live with no inventory row.
    # Sizing this budget honestly is what keeps that gate from tripping on
    # arithmetic rather than on a real fault.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gpu
          - variant: cpu
    environment: image-push
    permissions:
      contents: read
      packages: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The retag itself is registry-side (no bytes move), but the SBOM
      # step inside publish-image-retag runs syft against the image, which
      # pulls the ~4 GB GPU (~1.7 GB CPU) layers to local disk -- both the
      # docker-daemon save and the oci-registry cache. A stock runner's
      # ~14 GB free fills up and syft fails with "no space left on device",
      # so mirror the build path's reclaim before the composite action.
      #
      # The directories are disjoint, so deleting them sequentially just
      # sums independent I/O and has been observed to take up to ~9 min --
      # long enough to starve the SBOM scan out of the job budget. Fan the
      # deletes out in the background so wall-clock collapses to the
      # slowest single tree. `wait` with no operands returns 0 regardless
      # of the jobs' exit status, which under `bash -eo pipefail` would
      # silently swallow a failed reclaim and let the job continue with
      # less disk than expected (surfacing later as an opaque ENOSPC in
      # syft), so wait on each PID and propagate a non-zero status.
      - name: Free disk space
        run: |
          df -h /
          pids=()
          for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /opt/hostedtoolcache /usr/share/swift /usr/share/miniconda \
                     /usr/local/share/powershell /usr/local/share/chromium \
                     /usr/local/lib/node_modules /usr/local/.ghcup; do
            sudo rm -rf "$dir" &
            pids+=("$!")
          done
          sudo docker image prune --all --force &
          pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=$?
          done
          df -h /
          exit "$status"

      - id: retag
        uses: ./.github/actions/publish-image-retag
        with:
          image-name: fine-tune-${{ matrix.variant }}
          app-version: ${{ needs.version.outputs.app_version }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write digest to file
        if: steps.retag.outputs.digest != ''
        env:
          DIGEST: ${{ steps.retag.outputs.digest }}
        run: printf '%s' "$DIGEST" > "fine-tune-${{ matrix.variant }}.digest"

      - name: Upload digest artifact
        if: steps.retag.outputs.digest != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fine-tune-${{ matrix.variant }}-digest
          path: fine-tune-${{ matrix.variant }}.digest
          retention-days: 1

  # Final cross-publish gate. After every publish job has finished
  # (which means in-step verification has already passed for each
  # image+tag locally), confirm one more time that NO concurrent run
  # has overwritten any of our tags between the in-step check and now.
  # The script also catches divergent digests across tags of the same
  # image -- the exact failure mode that left
  # `synthorg-sandbox:0.7.6-dev.9` unsigned despite a green CI run.
  # Run on every main + tag push (not PRs, which never publish).
  verify-signatures:
    name: Verify Image Signatures
    needs:
      - version
      - build-backend-base-publish
      - build-sandbox-base-publish
      - build-sidecar-base-publish
      - build-fine-tune-base-publish
      - build-backend-publish
      - build-web-publish
      - build-sandbox-publish
      - build-openhands-publish
      - build-sidecar-publish
      - build-fine-tune-publish
      - retag-backend
      - retag-web
      - retag-sandbox
      - retag-openhands
      - retag-sidecar
      - retag-fine-tune
    # Two event paths feed this gate:
    #   - main-push: build-*-publish succeeds, retag-* skipped.
    #   - tag-push: retag-* succeeds, build-*-publish skipped.
    # Either path emits the `pushed-tags-*` artifacts the script
    # consumes. Bases are only in the inventory on main-push (skipped
    # on tag-push by design); the script's per-image divergence check
    # works on whichever scope of tags shows up.
    #
    # ANY publish having RUN is enough to trigger this, rather than all of
    # them succeeding. Two steps behind that:
    #
    #   - Per image, not per set. This job is the last line of defence
    #     against a concurrent run overwriting a tag after it was signed, and
    #     that risk attaches to each image independently. Requiring the whole
    #     set would forfeit the check for four healthy, signed images because
    #     a fifth failed for an unrelated reason.
    #   - `success` is the wrong signal for a matrix. `build-fine-tune-publish`
    #     and `retag-fine-tune` are cpu/gpu matrices with `fail-fast: false`,
    #     so one failed leg reports `failure` for the whole job while the
    #     other leg has already pushed and signed. Gating on `success` there
    #     skips verification for exactly the images that did get published --
    #     and when fine-tune is the only publisher a run touched (its
    #     paths-filter fires alone), nothing else is left to trigger the job.
    #     A job that ran may have pushed, so only `skipped` excludes it.
    #
    # The inventory is built from whichever `pushed-tags-*` artifacts exist, so
    # a partial run verifies exactly what was actually pushed, and the
    # aggregation step fails loudly if nothing was. Completeness is not
    # weakened by this: `update-release` gates on every retag succeeding in
    # its own right, so an incomplete image set still cannot reach the
    # release notes.
    if: >-
      github.event_name != 'pull_request' &&
      !cancelled() &&
      (
        (github.ref == 'refs/heads/main' &&
          (needs.build-backend-publish.result != 'skipped' ||
            needs.build-web-publish.result != 'skipped' ||
            needs.build-sandbox-publish.result != 'skipped' ||
            needs.build-openhands-publish.result != 'skipped' ||
            needs.build-sidecar-publish.result != 'skipped' ||
            needs.build-fine-tune-publish.result != 'skipped')) ||
        (startsWith(github.ref, 'refs/tags/v') &&
          (needs.retag-backend.result != 'skipped' ||
            needs.retag-web.result != 'skipped' ||
            needs.retag-sandbox.result != 'skipped' ||
            needs.retag-openhands.result != 'skipped' ||
            needs.retag-sidecar.result != 'skipped' ||
            needs.retag-fine-tune.result != 'skipped'))
      )
    runs-on: ubuntu-24.04
    # Sized against the script's own retry ladder, not a round number. It
    # verifies each (image, tag) pair sequentially, and a pair that exhausts
    # its retries costs roughly 90s across resolve + signature + provenance.
    # At ~18 pairs a widespread registry blip, the case the retries exist to
    # survive, would breach a 5-minute cap and be reaped mid-retry, turning a
    # recoverable stall into an opaque cancellation.
    timeout-minutes: 30
    # `contents: read` covers checkout for the helper script, and
    # `packages: read` is what the workflow `GITHUB_TOKEN` needs to
    # mint a pull-scoped GHCR token. No write permissions: this job
    # only verifies, never pushes.
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # This gate certifies "every image this run published is signed", and
      # it learns WHICH images those are from the inventory artifacts the
      # publish jobs emit. A job that stops between its push and its upload
      # therefore leaves live tags the aggregation below cannot see, and the
      # gate would report success having verified only what it was told
      # about. The inventory steps are ordered to make that window
      # vanishingly small; this refuses to certify anything at all while it
      # is even theoretically open, because the failure mode is silent and
      # the assertion is a security one.
      #
      # The whole `needs` set is passed, not a hand-listed subset: a
      # publisher added later joins `needs` to run at all, so it is covered
      # the day it lands rather than the day someone remembers this list.
      # Non-publishing dependencies (`version`) ride along, which costs
      # nothing: their failure blocks this job for its own good reasons.
      #
      # Blanket rather than per-image, so one matrix leg's failure blocks
      # certifying its healthy siblings too. That is deliberate: from
      # `needs.<job>.result` alone, a job that failed having published
      # nothing is indistinguishable from one that published without
      # recording it, and only the second is safe to wave through.
      - name: Refuse to certify a partial publish
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash .github/scripts/assert_publishers_complete.sh "$NEEDS_JSON"

      # Aggregate the (image, tag) inventory directly from the artifacts
      # each publish job emits via its `Write pushed-tag inventory` /
      # `Upload pushed-tag inventory` steps, rather than re-deriving the
      # metadata-action tag policy here: two independent copies of that
      # policy drift silently the day one changes and the other does not.
      - name: Download per-job pushed-tag inventories
        uses: ./.github/actions/download-artifact
        with:
          pattern: pushed-tags-*
          merge-multiple: true
          path: tag-inventories
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aggregate pushed-tag inventories
        id: inventory
        run: |
          set -euo pipefail
          if [ ! -d tag-inventories ] || [ -z "$(ls -A tag-inventories 2>/dev/null)" ]; then
            echo "::error::No pushed-tag inventory artifacts found -- the publish jobs did not emit any."
            exit 1
          fi
          cat tag-inventories/*.txt | sort -u > pushed-image-tags.txt
          if [ ! -s pushed-image-tags.txt ]; then
            echo "::error::Aggregated inventory is empty"
            exit 1
          fi
          echo "Pushed inventory:"
          cat pushed-image-tags.txt

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Verify cosign signatures for every pushed (image, tag)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Convert the inventory into one --image-tags arg per line so
          # the script can deduplicate tags within an image group.
          ARGS=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            ARGS+=("--image-tags" "$line")
          done < pushed-image-tags.txt
          python3 scripts/check_image_signatures.py "${ARGS[@]}"

  # Append container image references to the GitHub Release (version tags only).
  # On tag-push, retag-* jobs supply the per-image manifest list digest
  # (inherited from main-run's signed digest) and re-emit per-run SBOM
  # artifacts. Build-publish jobs are skipped on tag-push, so we depend
  # exclusively on the retag-* set here.
  update-release:
    name: Update Release Notes
    needs:
      - version
      - retag-backend
      - retag-web
      - retag-sandbox
      - retag-openhands
      - retag-sidecar
      - retag-fine-tune
      - verify-signatures
    if: >-
      startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request' &&
      !cancelled() &&
      needs.retag-backend.result == 'success' &&
      needs.retag-web.result == 'success' &&
      needs.retag-sandbox.result == 'success' &&
      needs.retag-openhands.result == 'success' &&
      needs.retag-sidecar.result == 'success' &&
      needs.retag-fine-tune.result == 'success' &&
      needs.verify-signatures.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Uses `release-tags` (v*-only, no privileged secrets), not `release`
    # (main-only, holds the `synthorg-repo-bot` App credentials). This
    # job writes release notes via the ambient `GITHUB_TOKEN`, so it
    # does not need the App token.
    environment: release-tags
    permissions:
      actions: read
      contents: write
    steps:
      # Upstream, not the ./.github/actions/download-artifact ladder: this
      # job never checks out, so no local composite action is on disk.
      - name: Download SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sboms
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download fine-tune digest artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fine-tune-*-digest
          merge-multiple: true
          path: fine-tune-digests
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read fine-tune digests
        id: ft-digests
        run: |
          set -euo pipefail
          gpu=$(cat fine-tune-digests/fine-tune-gpu.digest 2>/dev/null || echo "")
          cpu=$(cat fine-tune-digests/fine-tune-cpu.digest 2>/dev/null || echo "")
          if [ -z "$gpu" ] || [ -z "$cpu" ]; then
            echo "::error::Missing fine-tune digest artifact(s): gpu='$gpu' cpu='$cpu'"
            exit 1
          fi
          echo "gpu=${gpu}" >> "$GITHUB_OUTPUT"
          echo "cpu=${cpu}" >> "$GITHUB_OUTPUT"

      - name: Append container images to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BACKEND_DIGEST: ${{ needs.retag-backend.outputs.digest }}
          WEB_DIGEST: ${{ needs.retag-web.outputs.digest }}
          SANDBOX_DIGEST: ${{ needs.retag-sandbox.outputs.digest }}
          OPENHANDS_DIGEST: ${{ needs.retag-openhands.outputs.digest }}
          SIDECAR_DIGEST: ${{ needs.retag-sidecar.outputs.digest }}
          FINE_TUNE_GPU_DIGEST: ${{ steps.ft-digests.outputs.gpu }}
          FINE_TUNE_CPU_DIGEST: ${{ steps.ft-digests.outputs.cpu }}
        run: |
          set -euo pipefail

          # Validate required inputs
          if [ -z "$TAG" ] || [ -z "$BACKEND_DIGEST" ] || [ -z "$WEB_DIGEST" ] || [ -z "$SANDBOX_DIGEST" ] || [ -z "$OPENHANDS_DIGEST" ] || [ -z "$SIDECAR_DIGEST" ]; then
            echo "::error::Missing required values: TAG='$TAG' BACKEND_DIGEST='$BACKEND_DIGEST' WEB_DIGEST='$WEB_DIGEST' SANDBOX_DIGEST='$SANDBOX_DIGEST' OPENHANDS_DIGEST='$OPENHANDS_DIGEST' SIDECAR_DIGEST='$SIDECAR_DIGEST'"
            exit 1
          fi

          # Bounded retry -- Release Please may still be creating the release
          EXISTING=""
          FOUND=0
          for i in $(seq 1 6); do
            if EXISTING=$(gh release view "$TAG" --json body -q '.body // ""' 2>/dev/null); then
              FOUND=1
              break
            fi
            echo "Release '$TAG' not available yet (attempt $i/6), retrying in 10s..."
            sleep 10
          done
          if [ "$FOUND" -ne 1 ]; then
            # A dev pre-release can be swept by a concurrent stable
            # finalize-release cleanup before this slow retag+sign chain
            # reaches here. With nothing to attach to, skip rather than
            # red the run -- release-finalize.yml likewise skip-publishes a
            # tag with no draft. Only dev tags are swept; a missing release
            # for a real / rc / alpha / beta tag is a genuine error.
            case "$TAG" in
              *-dev.*)
                echo "::warning::Dev pre-release '$TAG' not found after 6 attempts -- likely swept by a concurrent stable finalize-release cleanup. Skipping release-notes update."
                exit 0
                ;;
              *)
                echo "::error::GitHub release '$TAG' not available after 6 attempts"
                exit 1
                ;;
            esac
          fi

          IMAGES=$(cat <<'BLOCK'

          ## Container Images

          All images are signed with [cosign](https://docs.sigstore.dev/cosign/overview/) (keyless via GitHub OIDC), attested with [SLSA Level 3](https://slsa.dev/spec/v1.0/levels) build provenance, and include CycloneDX SBOMs.

          ### Pull

          | Image | Command |
          |-------|---------|
          | Backend | `docker pull ghcr.io/aureliolo/synthorg-backend:VERSION_PH` |
          | Web | `docker pull ghcr.io/aureliolo/synthorg-web:VERSION_PH` |
          | Sandbox | `docker pull ghcr.io/aureliolo/synthorg-sandbox:VERSION_PH` |
          | OpenHands | `docker pull ghcr.io/aureliolo/synthorg-openhands:VERSION_PH` |
          | Sidecar | `docker pull ghcr.io/aureliolo/synthorg-sidecar:VERSION_PH` |
          | Fine-Tune (GPU) | `docker pull ghcr.io/aureliolo/synthorg-fine-tune-gpu:VERSION_PH` |
          | Fine-Tune (CPU) | `docker pull ghcr.io/aureliolo/synthorg-fine-tune-cpu:VERSION_PH` |

          ### Digest Pins

          Pin to these digests in production for reproducible deployments:

          | Image | Digest |
          |-------|--------|
          | Backend | `BACKEND_DIGEST_PH` |
          | Web | `WEB_DIGEST_PH` |
          | Sandbox | `SANDBOX_DIGEST_PH` |
          | OpenHands | `OPENHANDS_DIGEST_PH` |
          | Sidecar | `SIDECAR_DIGEST_PH` |
          | Fine-Tune (GPU) | `FINE_TUNE_GPU_DIGEST_PH` |
          | Fine-Tune (CPU) | `FINE_TUNE_CPU_DIGEST_PH` |

          ### Supply Chain

          <details>
          <summary>Verify signatures (cosign)</summary>

          ```bash
          # Verify any image -- replace IMAGE and DIGEST:
          cosign verify ghcr.io/aureliolo/synthorg-IMAGE@DIGEST \
            --certificate-identity-regexp='github\.com/Aureliolo/synthorg' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com'
          ```
          </details>

          <details>
          <summary>Verify SLSA provenance (gh CLI)</summary>

          ```bash
          gh attestation verify oci://ghcr.io/aureliolo/synthorg-backend@BACKEND_DIGEST_PH -R Aureliolo/synthorg
          gh attestation verify oci://ghcr.io/aureliolo/synthorg-web@WEB_DIGEST_PH -R Aureliolo/synthorg
          gh attestation verify oci://ghcr.io/aureliolo/synthorg-sandbox@SANDBOX_DIGEST_PH -R Aureliolo/synthorg
          gh attestation verify oci://ghcr.io/aureliolo/synthorg-openhands@OPENHANDS_DIGEST_PH -R Aureliolo/synthorg
          gh attestation verify oci://ghcr.io/aureliolo/synthorg-sidecar@SIDECAR_DIGEST_PH -R Aureliolo/synthorg
          gh attestation verify oci://ghcr.io/aureliolo/synthorg-fine-tune-gpu@FINE_TUNE_GPU_DIGEST_PH -R Aureliolo/synthorg
          gh attestation verify oci://ghcr.io/aureliolo/synthorg-fine-tune-cpu@FINE_TUNE_CPU_DIGEST_PH -R Aureliolo/synthorg
          ```
          </details>

          <details>
          <summary>SBOMs (CycloneDX JSON)</summary>

          Attached to this release as artifacts:
          \`sbom-backend.cdx.json\` | \`sbom-web.cdx.json\` | \`sbom-sandbox.cdx.json\` | \`sbom-openhands.cdx.json\` | \`sbom-sidecar.cdx.json\` | \`sbom-fine-tune-gpu.cdx.json\` | \`sbom-fine-tune-cpu.cdx.json\`
          </details>
          BLOCK
          )
          # Substitute placeholders (strip leading 'v' from tag for image tags)
          IMAGES=${IMAGES//VERSION_PH/${TAG#v}}
          IMAGES=${IMAGES//BACKEND_DIGEST_PH/$BACKEND_DIGEST}
          IMAGES=${IMAGES//WEB_DIGEST_PH/$WEB_DIGEST}
          IMAGES=${IMAGES//SANDBOX_DIGEST_PH/$SANDBOX_DIGEST}
          IMAGES=${IMAGES//OPENHANDS_DIGEST_PH/$OPENHANDS_DIGEST}
          IMAGES=${IMAGES//SIDECAR_DIGEST_PH/$SIDECAR_DIGEST}
          IMAGES=${IMAGES//FINE_TUNE_GPU_DIGEST_PH/$FINE_TUNE_GPU_DIGEST}
          IMAGES=${IMAGES//FINE_TUNE_CPU_DIGEST_PH/$FINE_TUNE_CPU_DIGEST}

          # Upload container SBOMs to the draft release
          if ls sboms/sbom-*.cdx.json 1>/dev/null 2>&1; then
            gh release upload "$TAG" --clobber sboms/sbom-*.cdx.json
            echo "Container SBOMs uploaded to release."
          else
            echo "::warning::No SBOM files found in sboms/ directory"
          fi

          # Idempotent: strip existing Container Images section before appending.
          # Uses awk to delete only this section (up to the next ## heading), not to EOF.
          CLEANED=$(echo "$EXISTING" | awk '/^## Container Images$/{skip=1; next} /^## /{skip=0} !skip')
          gh release edit "$TAG" --notes "${CLEANED}${IMAGES}"

  # ── Gate: all required checks passed ──
  # Nearly every job here is conditional on the event, so `skipped` must count
  # as passing.
  docker-pass:
    name: Docker Pass
    if: always()
    needs: [changes, version, validate-compose, build-backend-base, build-backend-base-publish, build-sandbox-base, build-sandbox-base-publish, build-sidecar-base, build-sidecar-base-publish, build-fine-tune-base, build-fine-tune-base-publish, build-backend, build-backend-publish, build-web-assets, build-web, build-web-publish, build-sandbox, build-sandbox-publish, build-openhands, build-openhands-publish, build-sidecar, build-sidecar-publish, build-fine-tune, build-fine-tune-publish, retag-backend, retag-web, retag-sandbox, retag-openhands, retag-sidecar, retag-fine-tune, verify-signatures, update-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.version.result }}
            ${{ needs.validate-compose.result }}
            ${{ needs.build-backend-base.result }}
            ${{ needs.build-backend-base-publish.result }}
            ${{ needs.build-sandbox-base.result }}
            ${{ needs.build-sandbox-base-publish.result }}
            ${{ needs.build-sidecar-base.result }}
            ${{ needs.build-sidecar-base-publish.result }}
            ${{ needs.build-fine-tune-base.result }}
            ${{ needs.build-fine-tune-base-publish.result }}
            ${{ needs.build-backend.result }}
            ${{ needs.build-backend-publish.result }}
            ${{ needs.build-web-assets.result }}
            ${{ needs.build-web.result }}
            ${{ needs.build-web-publish.result }}
            ${{ needs.build-sandbox.result }}
            ${{ needs.build-sandbox-publish.result }}
            ${{ needs.build-openhands.result }}
            ${{ needs.build-openhands-publish.result }}
            ${{ needs.build-sidecar.result }}
            ${{ needs.build-sidecar-publish.result }}
            ${{ needs.build-fine-tune.result }}
            ${{ needs.build-fine-tune-publish.result }}
            ${{ needs.retag-backend.result }}
            ${{ needs.retag-web.result }}
            ${{ needs.retag-sandbox.result }}
            ${{ needs.retag-openhands.result }}
            ${{ needs.retag-sidecar.result }}
            ${{ needs.retag-fine-tune.result }}
            ${{ needs.verify-signatures.result }}
            ${{ needs.update-release.result }}
        run: |
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Docker failed. Job results: $RESULTS"
            exit 1
          fi
          echo "All Docker checks passed (some skipped by event or path scope)."
