# Inventory of every MANDATORY paragraph in the canonical doc set.
#
# Canonical files: CLAUDE.md, web/CLAUDE.md, cli/CLAUDE.md,
# docs/reference/*.md, docs/design/*.md.
#
# Per rule: ONE of `gate` (relative path to enforcement file -- must
# stay inside the repo, no '..' segments, no absolute paths) or
# `exempt: { reason: <non-empty justification> }`. Exempt entries are
# technical debt; the convention-rollout policy aims to drive the
# exempt list toward zero by promoting each into a real script.
#
# Enforced by scripts/check_convention_gate_inventory.py (pre-push +
# CI). See docs/reference/conventions.md '17. Registering a new
# MANDATORY rule' for the procedure.

mandatory_rules:
  # ---------------------------------------------------------------
  # CLAUDE.md (root)
  # ---------------------------------------------------------------
  - id: claude-md::design-spec
    file: CLAUDE.md
    header: Design Spec
    exempt:
      reason: |
        Process rule: requires user approval before deviating from
        docs/design/. Not script-enforceable. Enforced by
        /pre-pr-review skill phases and code review.

  - id: claude-md::planning
    file: CLAUDE.md
    header: Planning
    exempt:
      reason: |
        Process rule: every implementation plan needs user accept/deny
        before coding. Not script-enforceable. Enforced by
        /pre-pr-review skill phases.

  - id: claude-md::web-dashboard-design-system
    file: CLAUDE.md
    header: Web Dashboard Design System
    gate: scripts/check_web_design_system.py

  - id: claude-md::regional-defaults
    file: CLAUDE.md
    header: Regional Defaults
    gate: scripts/check_backend_regional_defaults.py

  - id: claude-md::persistence-boundary
    file: CLAUDE.md
    header: Persistence Boundary
    gate: scripts/check_persistence_boundary.py
    # Sibling layer-discipline gate also enforces this MANDATORY:
    # scripts/check_no_api_dto_in_persistence_or_service.py (forbids
    # synthorg.api.dto_* imports in persistence/ and service/). The
    # inventory tracks one primary gate per (file, header); the
    # sibling lives in docs/reference/convention-gates.md alongside
    # the rest of the gate inventory.

  - id: claude-md::convention-rollout
    file: CLAUDE.md
    header: Convention Rollout
    gate: scripts/check_convention_gate_inventory.py

  - id: claude-md::license-compatibility
    file: CLAUDE.md
    header: License Compatibility
    gate: scripts/check_license_compat.py

  - id: claude-md::configuration-precedence
    file: CLAUDE.md
    header: Configuration Precedence
    gate: scripts/check_setting_to_startup_trace.py

  - id: claude-md::no-hardcoded-values
    file: CLAUDE.md
    header: No Hardcoded Values
    gate: scripts/check_no_magic_numbers.py

  - id: claude-md::doc-numeric-claims
    file: CLAUDE.md
    header: Doc Numeric Claims
    gate: scripts/check_doc_numeric_macros.py

  - id: claude-md::test-regression
    file: CLAUDE.md
    header: Test Regression
    gate: scripts/check_no_edit_baseline.sh

  - id: claude-md::post-implementation-pre-pr-review
    file: CLAUDE.md
    header: Post-Implementation + Pre-PR Review
    exempt:
      reason: |
        Workflow rule enforced by hookify (block-pr-create) and the
        /pre-pr-review + /aurelio-review-pr skills. The dev-time
        prevention lives in .claude/hookify.block-pr-create.md
        rather than scripts/.

  - id: claude-md::module-size-budget
    file: CLAUDE.md
    header: Module-Size Budget
    gate: scripts/check_module_size_budget.py
    # Sibling gates documented in docs/reference/convention-gates.md
    # but not independently mapped here (the inventory tracks one
    # primary gate per MANDATORY paragraph):
    #
    #   scripts/check_no_growth_in_god_modules.py
    #     - operational corollary of the size budget: every file in the
    #       explicit allowlist (now empty; core/enums.py was deleted)
    #       must net-shrink.
    #   scripts/check_no_central_junk_drawer.py
    #     - core/enums.py must not exist (dissolved into feature
    #       directories), and stays deleted.
    #   scripts/check_no_circular_imports.py
    #   scripts/check_module_depth.py
    #   scripts/check_protocol_documented.py
    #   scripts/check_no_module_level_io.py
    #   scripts/check_state_slice_immutability.py
    #   scripts/check_strategy_protocol_injection.py
    #   scripts/check_settings_namespace_complete.py
    #   scripts/check_feature_manifest.py
    #     - every slice-bearing directory under src/synthorg/ carries
    #       a feature.py manifest with FEATURE: FeatureModule.
    #   scripts/check_no_implicit_state_attribute.py
    #     - AppState.__slots__ must stay empty (thin facade); new
    #       application state goes through a feature slice or a
    #       primitive owner object.
    #   scripts/check_feature_index_freshness.py
    #     - data/feature_index.json + data/codebase_map.json are
    #       regenerated from the feature manifests on every commit.

  - id: claude-md::import-layering-architecture-drift
    file: CLAUDE.md
    header: Import Layering + Architecture Drift
    gate: .importlinter
    # Primary artifact: the declarative layering contracts in
    # .importlinter, enforced by `lint-imports` (pre-push + CI).
    # Sibling gates (one primary tracked per paragraph; the rest live
    # in docs/reference/convention-gates.md + import-layering.md):
    #   scripts/check_architecture_drift.py
    #     - fan-in / LCOM4 / budget-pressure drift vs the committed
    #       data/architecture_report.json baseline (ADR-0011).
    #   scripts/check_persistence_boundary.py     -- raw-SQL / driver boundary
    #   scripts/check_no_api_dto_in_persistence_or_service.py -- DTO leak
    #   scripts/check_dependency_inversion.py     -- concrete-class DI rule

  # ---------------------------------------------------------------
  # web/CLAUDE.md
  # ---------------------------------------------------------------
  - id: web-claude-md::zustand-store-error-handling
    file: web/CLAUDE.md
    header: Zustand Store Error Handling
    exempt:
      reason: |
        Code-pattern contract enforced by peer review. Stores wrap
        try/catch internally; callers must not. No AST/lint signal
        catches "caller wraps store mutation in try/catch" without
        a custom ESLint rule, which is not yet written.

  - id: web-claude-md::cursor-pagination
    file: web/CLAUDE.md
    header: Cursor pagination
    exempt:
      reason: |
        API-contract rule: list endpoints expose PaginationMeta;
        stores read nextCursor + hasMore. Enforced by the typed
        envelope in src/synthorg/api (no `total` field) and by the
        store-shape types. No standalone gate script.

  - id: web-claude-md::health-readiness-endpoints
    file: web/CLAUDE.md
    header: Health / readiness endpoints
    exempt:
      reason: |
        Two-state contract (200 ok / 503 unavailable) enforced at
        type level by the endpoint return signatures and at runtime
        by the API tests. No standalone gate script.

  - id: web-claude-md::msw-handlers
    file: web/CLAUDE.md
    header: MSW handlers
    gate: web/src/test-setup.tsx

  - id: web-claude-md::test-teardown
    file: web/CLAUDE.md
    header: Test teardown
    gate: web/src/test-setup.tsx

  - id: web-claude-md::active-handle-gate
    file: web/CLAUDE.md
    header: Active-handle gate
    gate: web/test-infra/active-handle-tracker.ts

  - id: web-claude-md::ws-wire-protocol
    file: web/CLAUDE.md
    header: WS wire protocol
    gate: scripts/check_ws_protocol_version_in_sync.py

  - id: web-claude-md::error-code-constants
    file: web/CLAUDE.md
    header: Error-code constants
    gate: scripts/check_error_codes_ts_in_sync.py

  - id: web-claude-md::generated-dto-types
    file: web/CLAUDE.md
    header: Generated DTO types
    gate: scripts/check_dto_types_ts_in_sync.py

  - id: web-claude-md::design-system
    file: web/CLAUDE.md
    header: Design System
    gate: scripts/check_web_design_system.py

  - id: web-claude-md::eslint
    file: web/CLAUDE.md
    header: ESLint
    gate: web/eslint.config.js

  # ---------------------------------------------------------------
  # docs/reference/web-zustand-stores.md
  #
  # Each MANDATORY here is a detailed expansion of the parent rule
  # in web/CLAUDE.md. The parent rule's gate / exemption applies;
  # this file is documentation, not an independent enforcement
  # surface.
  # ---------------------------------------------------------------
  - id: docs-reference-web-zustand-stores-md::mutation-action-pattern
    file: docs/reference/web-zustand-stores.md
    header: Mutation Action Pattern
    exempt:
      reason: |
        Detailed expansion of web/CLAUDE.md "Zustand Store Error
        Handling (MANDATORY)". Same enforcement chain (peer review).

  - id: docs-reference-web-zustand-stores-md::cursor-pagination
    file: docs/reference/web-zustand-stores.md
    header: Cursor Pagination
    exempt:
      reason: |
        Detailed expansion of web/CLAUDE.md "Cursor pagination
        (MANDATORY)". Same enforcement chain (typed envelope).

  - id: docs-reference-web-zustand-stores-md::health-readiness-endpoints
    file: docs/reference/web-zustand-stores.md
    header: Health / Readiness Endpoints
    exempt:
      reason: |
        Detailed expansion of web/CLAUDE.md "Health / readiness
        endpoints (MANDATORY)". Same enforcement chain (type
        system + API tests).

  - id: docs-reference-web-zustand-stores-md::msw-handlers
    file: docs/reference/web-zustand-stores.md
    header: MSW Handlers
    exempt:
      reason: |
        Detailed expansion of web/CLAUDE.md "MSW handlers
        (MANDATORY)". Same enforcement (web/src/test-setup.tsx
        runtime guard).

  - id: docs-reference-web-zustand-stores-md::test-teardown
    file: docs/reference/web-zustand-stores.md
    header: Test Teardown
    exempt:
      reason: |
        Detailed expansion of web/CLAUDE.md "Test teardown
        (MANDATORY)". Same enforcement (web/src/test-setup.tsx
        global afterEach).

  - id: docs-reference-web-zustand-stores-md::active-handle-gate
    file: docs/reference/web-zustand-stores.md
    header: Active-Handle Gate
    exempt:
      reason: |
        Detailed expansion of web/CLAUDE.md "Active-handle gate
        (MANDATORY)". Same enforcement (web/test-infra/active-handle-tracker.ts
        loaded as a unit-project setupFile).

  - id: docs-reference-web-zustand-stores-md::ws-wire-protocol
    file: docs/reference/web-zustand-stores.md
    header: WS Wire Protocol
    exempt:
      reason: |
        Detailed expansion of web/CLAUDE.md "WS wire protocol
        (MANDATORY)". Same enforcement chain.

  - id: docs-reference-configuration-precedence-md::kill-switch-idiom
    file: docs/reference/configuration-precedence.md
    header: Kill-Switch Idiom
    gate: scripts/check_long_running_loops_have_kill_switch.py

  # ---------------------------------------------------------------
  # docs/reference/errors.md
  # ---------------------------------------------------------------
  - id: docs-reference-errors-md::http-exception-handler-registration
    file: docs/reference/errors.md
    header: HTTP exception handler registration
    gate: scripts/check_no_controller_response_for_domain_errors.py

  - id: docs-reference-errors-md::error-code-constants-frontend-integration
    file: docs/reference/errors.md
    header: Error-code constants - frontend integration
    gate: scripts/check_error_codes_ts_in_sync.py
