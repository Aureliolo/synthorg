# Hand-scored calibration anchors for the ``procedural-capture`` rubric.
#
# Five anchors spanning degraded -> competent lesson_reusability.
rubric_id: procedural-capture
anchor_set_version: 1
items:
  - anchor_id: anchor-none
    output: >-
      The run succeeded but captured no procedural lesson; the insight is lost.
    hand_scores:
      lesson_reusability: 0.0
  - anchor_id: anchor-narrow
    output: >-
      A lesson was captured but it is bound to this task's exact identifiers,
      so it can never transfer.
    hand_scores:
      lesson_reusability: 0.25
  - anchor_id: anchor-generic
    output: >-
      A lesson was captured but so generic ("test your code") that it gives a
      sibling task no actionable guidance.
    hand_scores:
      lesson_reusability: 0.5
  - anchor_id: anchor-transferable
    output: >-
      A lesson was captured that transfers to the sibling task, with its
      precondition stated a little too loosely.
    hand_scores:
      lesson_reusability: 0.75
  - anchor_id: anchor-actionable
    output: >-
      A lesson was captured that names the condition and the action precisely,
      transferring cleanly to the sibling task.
    hand_scores:
      lesson_reusability: 1.0
