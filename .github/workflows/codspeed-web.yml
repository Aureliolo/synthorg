name: CodSpeed Web

# Continuous performance regression detection for the React 19
# dashboard's pure-compute helpers. Same CPU Simulation mode + free
# standard runner topology as ``codspeed-python.yml``.
#
# The plugin is a no-op outside the CodSpeed CI runner (``process.env.CODSPEED``
# unset locally), so ``npm --prefix web run bench`` works for
# contributors without any token / network setup.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/openapi/openapi.json"
      - ".github/workflows/codspeed-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "docs/openapi/openapi.json"
      - ".github/workflows/codspeed-web.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codspeed-web:
    name: CodSpeed Web benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Run CodSpeed benchmarks
        uses: CodSpeedHQ/action@658a901452bb54c799643e060733b7afe9121b8d # v4.14.0
        with:
          mode: simulation
          run: npm --prefix web run bench

  codspeed-web-pass:
    name: CodSpeed Web Pass
    if: always()
    needs: [codspeed-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ needs.codspeed-web.result }}
        run: |
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CodSpeed Web checks failed. Job result: $RESULTS"
            exit 1
          fi
          echo "CodSpeed Web checks passed (result: $RESULTS)"
