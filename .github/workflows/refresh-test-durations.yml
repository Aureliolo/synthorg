name: Refresh Test Durations

# Periodically regenerates ``.test_durations.unit`` and
# ``.test_durations.integration`` so pytest-split's shard balancer has
# real per-test runtime data. Without this, the durations files stay
# at ``{}`` and pytest-split count-partitions tests across shards,
# producing badly imbalanced wall-clock times (one shard 55%+ slower
# than another in observed runs). With real durations populated,
# pytest-split distributes by total wall time per group, making the
# slowest shard the gate.
#
# Runs weekly on Sunday at 04:00 UTC plus workflow_dispatch. Opens a
# signed PR against ``main`` via the synthorg-repo-bot App token --
# squash-merge the PR to land the refreshed files. Re-runs are cheap;
# a manual dispatch from Actions UI is the fastest way to bootstrap
# the files when they are empty (current state on this branch).

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-test-durations
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh durations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: apko-lock
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: synthorg
          POSTGRES_PASSWORD: synthorg-test
          POSTGRES_DB: synthorg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SYNTHORG_TEST_POSTGRES_HOST: localhost
      SYNTHORG_TEST_POSTGRES_PORT: "5432"
      SYNTHORG_TEST_POSTGRES_USER: synthorg
      SYNTHORG_TEST_POSTGRES_PASSWORD: synthorg-test
      SYNTHORG_TEST_POSTGRES_DB: synthorg
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@4f91a55be4084858815c0b35bb691a49e3166946
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-python-uv

      - name: Install postgresql-client-18 (for any test that shells out)
        uses: ./.github/actions/install-postgres-18-client

      # Mint a short-lived App installation token for synthorg-repo-bot.
      # Same pattern as apko-lock.yml: owner + repositories pin the
      # installation lookup so the token is bound to this single-repo
      # install. Permissions are exactly what is needed for the
      # createCommitOnBranch + gh pr create flow below.
      - name: Mint repo-bot App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APKO_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.APKO_BOT_APP_PRIVATE_KEY }}
          owner: Aureliolo
          repositories: synthorg
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Refresh unit-test durations
        run: |
          # --store-durations writes per-test wall-clock times to the
          # given path. --cov-fail-under=0 prevents the per-arm 80%
          # gate from triggering; pytest-cov defaults to applying
          # [tool.coverage.report] fail_under=80 at end-of-session
          # otherwise.
          uv run python -m pytest tests/ \
            -m unit \
            -n auto \
            --store-durations \
            --durations-path .test_durations.unit \
            --cov=synthorg \
            --cov-report= \
            --cov-fail-under=0

      - name: Refresh integration-test durations
        run: |
          uv run python -m pytest tests/ \
            -m integration \
            -n auto \
            --store-durations \
            --durations-path .test_durations.integration \
            --cov=synthorg \
            --cov-report= \
            --cov-fail-under=0

      - name: Detect duration-file changes
        id: diff
        run: |
          changed_files=$(git status --porcelain -- .test_durations.unit .test_durations.integration | awk '{ print $2 }')
          if [ -z "$changed_files" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'files<<DURATIONS_FILES_EOF'
              echo "$changed_files"
              echo 'DURATIONS_FILES_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      # Commit + push + open PR using only native tools (gh CLI + git).
      # Routes through GraphQL createCommitOnBranch so the resulting
      # commit is signed by the App and verifies as
      # `{verified: true, reason: "valid"}`. Same pattern as
      # apko-lock.yml so deviations are easy to spot in code review.
      - name: Open / update test-durations PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ci/refresh-test-durations
          BASE_SHA: ${{ github.sha }}
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
        run: |
          set -euo pipefail

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/$BRANCH" \
            -f "sha=$BASE_SHA"

          additions_file=$(mktemp)
          {
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              jq -nc --arg p "$path" --rawfile c "$path" \
                '{path: $p, contents: ($c | @base64)}'
            done <<< "$CHANGED_FILES"
          } | jq -s '.' > "$additions_file"

          query='mutation($branchName: String!, $repoWithOwner: String!, $expectedOid: GitObjectID!, $additions: [FileAddition!]!) {
            createCommitOnBranch(input: {
              branch: { repositoryNameWithOwner: $repoWithOwner, branchName: $branchName }
              message: { headline: "ci: refresh .test_durations.{unit,integration}" }
              fileChanges: { additions: $additions }
              expectedHeadOid: $expectedOid
            }) {
              commit { oid url }
            }
          }'
          body_file=$(mktemp)
          jq -n \
            --arg query "$query" \
            --arg branchName "$BRANCH" \
            --arg repoWithOwner "$GITHUB_REPOSITORY" \
            --arg expectedOid "$BASE_SHA" \
            --slurpfile additions "$additions_file" \
            '{
              query: $query,
              variables: {
                branchName: $branchName,
                repoWithOwner: $repoWithOwner,
                expectedOid: $expectedOid,
                additions: $additions[0]
              }
            }' > "$body_file"

          commit_response=$(gh api /graphql --input "$body_file")
          if jq -e '.errors != null or .data.createCommitOnBranch.commit.oid == null' >/dev/null <<<"$commit_response"; then
            echo "::error::createCommitOnBranch did not produce a commit; raw response follows" >&2
            jq '.' <<<"$commit_response" >&2
            exit 1
          fi
          new_sha=$(jq -r '.data.createCommitOnBranch.commit.oid' <<<"$commit_response")
          echo "Signed commit $new_sha pushed to $BRANCH"

          pr_create_output=$(mktemp)
          if ! gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "ci: refresh .test_durations.{unit,integration}" \
            --body "Automated refresh of pytest-split shard-balancing duration files.

          Without these files, pytest-split count-partitions tests across shards,
          producing badly imbalanced wall-clock times (one shard 55%+ slower than
          another in observed runs). This PR captures the latest per-test wall-clock
          timings from a clean CI run so the balancer can distribute by total wall
          time per group instead." \
            --label "type:ci" \
            > "$pr_create_output" 2>&1; then
            if grep -q "already exists" "$pr_create_output"; then
              cat "$pr_create_output"
              echo "PR already exists for $BRANCH -- branch updated, no new PR needed"
            else
              cat "$pr_create_output" >&2
              exit 1
            fi
          else
            cat "$pr_create_output"
          fi
