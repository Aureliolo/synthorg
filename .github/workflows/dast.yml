name: DAST

on:
  schedule:
    - cron: "0 5 * * 1"  # Weekly Monday 5am UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false  # Serialize: only one DAST scan at a time

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: "0.70.0"
  # renovate: datasource=github-releases depName=chainguard-dev/apko
  APKO_VERSION: "v1.2.13"
  # COMPOSE_FILE makes every `docker compose` invocation in this job pick
  # up both the base + DAST overlay automatically (colon separator on
  # Linux runners), so we don't repeat `-f docker/compose.yml -f
  # docker/compose.dast.yml` on every step. Workflow-scoped so the
  # build / start / exec / logs / down calls share the same view.
  COMPOSE_FILE: docker/compose.yml:docker/compose.dast.yml

jobs:
  zap-scan:
    name: ZAP API Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The ZAP action creates/updates a single GitHub issue per repo with scan
      # findings (not one per run). Removing issues:write would cause the action
      # to fail. The auto-created issue is updated in-place on subsequent runs.
      issues: write
      # build-apko-base uploads a Trivy SARIF for the locally-built base
      # image; this scope is required by that composite action.
      security-events: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@31a45a7083a7244c27b6f745dd79d35b526741fd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Create env file with generated secrets (compose requires
      # env_file: .env).
      #
      # POSTGRES_PASSWORD is unused under the DAST overlay
      # (compose.dast.yml swaps the backend onto SQLite + internal
      # bus, dropping the postgres + nats services), but
      # docker/.env.example still declares it with a `:?Set ...`
      # required-variable check, so we generate a value to keep
      # `docker compose config` happy at parse time.
      #
      # SYNTHORG_PAGINATION_CURSOR_SECRET is a hard-required boot
      # guard: the backend exits with RuntimeError when the env var
      # is unset, because an ephemeral per-process key silently
      # invalidates every outstanding cursor token across restarts
      # (see src/synthorg/api/app.py).  The same boot guard holds in
      # dev / pre-release / prod, so DAST mirrors prod and generates
      # a per-run value here.
      - name: Create env file
        run: |
          set -euo pipefail
          cp docker/.env.example docker/.env
          # Each generation runs in its own VAR=$(...) so a Python failure
          # surfaces immediately as a non-zero exit (set -e + pipefail)
          # rather than appending an empty value and surfacing later as a
          # confusing `compose config` parse error.
          JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
          SETTINGS_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')
          PAGINATION_CURSOR_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          POSTGRES_PW=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          # printf '%s\n' (not echo) so a generated value starting with
          # `-n` / `-e` is treated as data, not as a builtin flag.  Each
          # value goes through %s with no escape interpretation, so
          # backslashes from base64 / urlsafe_b64 are also preserved.
          {
            printf '%s\n' "SYNTHORG_JWT_SECRET=$JWT_SECRET"
            printf '%s\n' "SYNTHORG_SETTINGS_KEY=$SETTINGS_KEY"
            printf '%s\n' "SYNTHORG_PAGINATION_CURSOR_SECRET=$PAGINATION_CURSOR_SECRET"
            printf '%s\n' "POSTGRES_PASSWORD=$POSTGRES_PW"
          } >> docker/.env

      # Build the apko-composed Wolfi base image locally, mirroring CI's
      # backend-base build. The backend Dockerfile has no default for
      # `BASE_IMAGE` (PR #1465 / Scorecard Pinned-Dependencies), so the
      # DAST workflow must supply a pinned reference. Building the base
      # in-workflow yields a `sha-<short>` tag tied to the current commit
      # -- no floating registry tag is consulted.
      - name: Build apko base image
        id: base
        uses: ./.github/actions/build-apko-base
        with:
          image-name: backend
          apko-yaml: docker/backend/apko.yaml
          apko-version: ${{ env.APKO_VERSION }}
          trivy-version: ${{ env.TRIVY_VERSION }}

      # Build the backend application image. Compose passes the
      # workflow-built `BASE_IMAGE` through to the Dockerfile via the
      # backend.build.args mapping in docker/compose.yml. The DAST
      # overlay (compose.dast.yml) is a no-op at build time -- it only
      # patches runtime fields (depends_on, environment) -- but it is
      # picked up automatically via the workflow-scoped COMPOSE_FILE
      # env var (above) for symmetry with `up`, `exec`, `logs`, `down`.
      - name: Build backend image
        env:
          BASE_IMAGE: ghcr.io/aureliolo/synthorg-backend-base:${{ steps.base.outputs.tag }}
        run: docker compose build backend

      # Start backend only. The DAST overlay swaps the backend onto
      # SQLite + internal bus, so neither postgres nor nats start (no
      # dhi.io pull is performed -- DHI requires a Docker Hardened
      # Images subscription that the DAST workflow does not carry).
      # data-init still runs to chown the bind-mounted /data volume.
      - name: Start backend
        run: docker compose up -d backend

      - name: Wait for healthy
        run: |
          set -euo pipefail
          # Poll readyz for up to 60s. break-on-success + post-loop guard
          # makes the failure path explicit, instead of relying on `exit 0`
          # inside the loop body that a future refactor could move into a
          # function or subshell.
          healthy=false
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/v1/readyz > /dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" = "true" ]; then
            echo "Backend healthy"
            exit 0
          fi
          echo "::error::Backend failed to start within 60s"
          # Capture the whole compose project's diagnostic state so a
          # scheduled-run failure is triageable without rerun: ps shows
          # which deps started, which exited, and exit codes; logs (no
          # service arg) emits every service so a `data-init` chown
          # failure or stuck dependency surfaces alongside backend's
          # own output. Tail-bound to keep the artifact size sane.
          docker compose ps
          docker compose logs --tail=500
          exit 1

      # Generate a long-lived system-user JWT so ZAP can scan authenticated
      # endpoints.  Without this, every protected route returns 401/403 and
      # is effectively invisible to the scanner.
      #
      # Uses the same system-user identity (sub=system, iss=synthorg-cli,
      # aud=synthorg-backend) that the Go CLI uses.  The system user is
      # bootstrapped at backend startup and skips pwd_sig validation;
      # the JWT HMAC signature is the sole auth gate.
      # See: src/synthorg/api/auth/middleware.py _resolve_jwt_user()
      - name: Generate DAST JWT
        id: jwt
        run: |
          set -euo pipefail
          TOKEN=$(docker compose exec -T backend \
            python -c "
          import os, jwt, datetime, uuid
          secret = os.environ['SYNTHORG_JWT_SECRET']
          payload = {
              'sub': 'system',
              'iss': 'synthorg-cli',
              'aud': 'synthorg-backend',
              'role': 'system',
              'jti': uuid.uuid4().hex,
              'iat': datetime.datetime.now(datetime.timezone.utc),
              'exp': datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=2),
          }
          print(jwt.encode(payload, secret, algorithm='HS256'))
          ")
          if [ -z "$TOKEN" ]; then
            echo "::error::DAST JWT generation produced an empty token (docker compose exec or python failed)"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # -a enables alpha passive scan rules (release + beta loaded by default).
      # -T 20 caps ZAP startup + passive scanning at 20 minutes.
      # -J/-r produce machine-parseable and human-readable report artifacts.
      # -z passes performance tuning directly to ZAP:
      #   threadPerHost=5            (faster on localhost; default 2)
      #   maxRuleDurationInMins=5    (no single rule dominates scan time)
      #   maxScanDurationInMins=30   (hard cap on the active scan phase)
      # Rules file promotes critical findings to FAIL and suppresses validated
      # false positives; see docs/security.md "DAST Tuning" for rationale.
      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: "Bearer ${{ steps.jwt.outputs.token }}"
          ZAP_AUTH_HEADER_SITE: localhost
        with:
          target: http://localhost:3001/docs/openapi.json
          format: openapi
          fail_action: false
          cmd_options: >-
            -a -T 20
            -J report_json.json -r report_html.html
            -z "-config scanner.threadPerHost=5
                -config scanner.maxRuleDurationInMins=5
                -config scanner.maxScanDurationInMins=30"
          rules_file_name: .github/zap-rules.tsv

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-reports
          path: |
            report_json.json
            report_html.html
          if-no-files-found: warn
          retention-days: 30

      - name: Stop backend
        if: always()
        run: docker compose down

  report-failure:
    name: Open / update tracking issue on schedule failure
    needs: zap-scan
    # Only the schedule path gets the issue sink. Manual `workflow_dispatch`
    # failures from a debugging branch shouldn't open repo-wide CI-health
    # issues; the operator already sees the run output directly.
    if: >-
      always()
      && github.event_name == 'schedule'
      && needs.zap-scan.result != 'success'
      && needs.zap-scan.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/post-tracking-issue)
      issues: write     # gh issue create / comment / pin
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@31a45a7083a7244c27b6f745dd79d35b526741fd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Compose body
        id: body
        env:
          RESULT: ${{ needs.zap-scan.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo 'body<<TRACKING_ISSUE_BODY_EOF'
            cat <<EOF
          ZAP DAST scan workflow failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) with result \`$RESULT\`.

          Run: ${RUN_URL}

          Likely cause: backend image failed to boot, OpenAPI spec
          regression broke the scanner target, or ZAP itself errored.
          The scan-finding issue (created by the ZAP action) is separate;
          this tracking issue is for the workflow plumbing itself.
          EOF
            echo 'TRACKING_ISSUE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/post-tracking-issue
        with:
          title: 'DAST scan regression'
          labels: 'automation:ci-health,type:ci,prio:medium'
          body: ${{ steps.body.outputs.body }}
          pin: 'false'
          gh-token: ${{ github.token }}
