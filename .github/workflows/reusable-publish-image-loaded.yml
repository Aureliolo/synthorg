name: Reusable - Publish Loaded Image

# The build definition for the web image's publish, held in a trusted reusable
# workflow. The web image arrives as an apko-built multi-arch tarball rather
# than a Dockerfile build, so it loads the tarball into the local daemon and
# hands the already-tagged images to `publish-image-loaded`.
#
# See reusable-publish-apko-base.yml for why the indirection exists: it is the
# isolation SLSA Build L3 requires and that a directly-triggered workflow
# cannot provide. Pin a consumer to it with:
#
#   gh attestation verify oci://... -R Aureliolo/synthorg \
#     --signer-workflow Aureliolo/synthorg/.github/workflows/reusable-publish-image-loaded.yml

on:
  workflow_call:
    inputs:
      image-name:
        description: Image to publish.
        required: true
        type: string
      app-version:
        description: Version the manifest list is tagged with.
        required: true
        type: string
      tarball-artifact:
        description: Artifact holding the image tarball to load.
        required: true
        type: string
      tarball-name:
        description: Tarball filename inside the artifact.
        required: true
        type: string
      enable-arm64:
        description: Whether the manifest list carries an arm64 child.
        required: false
        default: true
        type: boolean
    outputs:
      digest:
        description: Digest of the published manifest list.
        value: ${{ jobs.publish.outputs.digest }}

permissions: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    # `publish-image-loaded`'s login / push / cosign / VEX-attest / provenance
    # / syft-SBOM steps each carry a bounded retry ladder. This must clear the
    # SUM of them (~39m composed worst case, more than the retag path since it
    # also signs and attests) plus the uv installer's own ladder ahead of them
    # (240s deadline), so a transient blip that trips several is retried, not
    # cancelled mid-retry. A cancellation there is not a benign timeout: it
    # can leave an image pushed but unsigned or unattested, which is the
    # outcome the ladders exist to prevent.
    timeout-minutes: 50
    environment: image-push
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      # `github.sha` only, with no pull-request fallback: publishing runs on
      # main and tag refs, never on a PR, and the attested build definition
      # must not be able to resolve to a pull-request head.
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The OpenVEX document this job is about to sign must be the one
      # `.github/vex/triage.yaml` renders to. The pre-push hook and the PR
      # gates both establish that, and neither runs here: this job runs on a
      # push to main, and an administrative merge bypasses required checks.
      # A signature outlives the review that should have preceded it, so on
      # this path the ledger is re-checked before anything is signed.
      #
      # `--no-project` rather than `uv sync`: the gate needs PyYAML and
      # nothing else, and syncing the whole dev graph into an image-publish
      # job would cost minutes to check one file pair.
      - name: Install uv
        uses: ./.github/actions/install-uv

      - name: Verify the VEX ledger matches what is committed
        env:
          # Pinned, not floating. This resolves inside the job that signs
          # images, so an unpinned install would let whatever the index
          # serves at publish time execute there. Held at the version
          # `uv.lock` resolves, so the ledger is parsed by the same library
          # the pre-push and CI gates parse it with.
          # renovate: datasource=pypi depName=pyyaml
          PYYAML_VERSION: "6.0.3"
        run: |
          uv run --no-project --python 3.14 --with "pyyaml==${PYYAML_VERSION}" \
            python scripts/check_vex_triage_sync.py

      - name: Download image tarball
        uses: ./.github/actions/download-artifact
        with:
          name: ${{ inputs.tarball-artifact }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The apko-built tarball's internal tags are already
      # `ghcr.io/aureliolo/synthorg-<name>:sha-<short>-<arch>` (set by the
      # `apko build` invocation in the build job), which is exactly what
      # `publish-image-loaded` expects after `docker load`. No re-tagging.
      - name: Load image
        env:
          TARBALL: ${{ inputs.tarball-name }}
        run: docker load -i "$TARBALL"

      - name: Publish image
        id: publish
        uses: ./.github/actions/publish-image-loaded
        with:
          image-name: ${{ inputs.image-name }}
          app-version: ${{ inputs.app-version }}
          enable-arm64: ${{ inputs.enable-arm64 }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
