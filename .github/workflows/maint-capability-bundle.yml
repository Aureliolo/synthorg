name: Maint - Capability Snapshot

on:
  schedule:
    # Monthly, offset from the weekly apko cron so the two are not
    # competing for the same `ci/*` branch machinery on the same morning.
    - cron: "0 7 3 * *"
  workflow_dispatch:

permissions: {}

# Serialize runs against the shared `ci/capability-bundle-update` branch.
# A concurrent cron + manual dispatch would race on the delete + recreate
# sequence in update-bundle, producing 422 "Reference already exists" or
# 404 "Reference does not exist" depending on interleaving.
# `cancel-in-progress: false` queues new runs behind any in-flight one
# rather than cancelling: cancelling mid-flight could leave the ref in a
# half-created state.
concurrency:
  group: capability-bundle-update
  cancel-in-progress: false

jobs:
  update-bundle:
    name: capability snapshot
    # The `main` branch policy on the environment gates the REF, not the
    # repository, so it is no fork gate: enabled on a fork this job fails
    # while minting the App token, whose `owner` / `repositories` name this
    # repository. Every release workflow carries the same guard.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    # Sized so the retry ladder below can always exhaust and report its own
    # named failure: a cold `setup-python-uv` spends up to 480s across its two
    # bounded installs, the refresh ladder up to its 900s deadline, and the
    # push flow the rest. A budget the reaper wins first would turn every
    # ladder exhaustion into an opaque cancelled job.
    timeout-minutes: 30
    # Environment `apko-lock` carries a `main`-only branch allowlist and the
    # `synthorg-repo-bot` App credentials (Contents:write + PRs:write +
    # Metadata:read, scoped to this repo). Reused rather than duplicated:
    # this cron performs the same operation, on the same `ci/*` branch
    # namespace, with the same bot and the same ref gate, so a second
    # environment would hold a second copy of one App's credentials without
    # narrowing any scope and would give the credentials two rotation sites
    # instead of one. The duplicate `RELEASE_BOT_APP_*` pair in the `release`
    # env is a different case: that env gates the release pipeline, a higher
    # trust level than a maintenance cron, so it keeps its own copy.
    # GITHUB_TOKEN is not used for PR creation because the repo-level
    # `can_approve_pull_request_reviews: false` setting blocks it.
    environment: apko-lock
    permissions:
      contents: read
      # contents:write + pull-requests:write are NOT granted to
      # GITHUB_TOKEN here. PR creation uses the repo-bot App installation
      # token minted below, which carries its own narrowly-scoped
      # permissions independent of GITHUB_TOKEN.
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Mint a short-lived App installation token for synthorg-repo-bot.
      # `owner` + `repositories` pin the installation lookup so the token
      # is bound to this single-repo install; without them the action walks
      # every installation the App is authorised for.
      - name: Mint repo-bot App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APKO_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.APKO_BOT_APP_PRIVATE_KEY }}
          # Both literal so the scope is statically verifiable as narrow.
          # This workflow is schedule-only + workflow_dispatch on the
          # `apko-lock` environment whose branch policy admits only main,
          # so the repo context is always `Aureliolo/synthorg`.
          owner: Aureliolo
          repositories: synthorg
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      - uses: ./.github/actions/setup-python-uv

      # Wrapped in the retry ladder rather than run bare: the script is a pure
      # fetch-and-rewrite, so re-running converges to the same file, and its
      # only common failure is a transient blip on one of the two upstream
      # feeds. Un-laddered, that blip fails the month's run and opens a
      # tracking issue about nothing.
      #
      # Sizing: the script bounds each fetch at 180s and reads two feeds, so an
      # attempt clears at 400s with room for the parse. Three attempts inside a
      # 900s deadline leaves the ladder able to exhaust and say so well inside
      # the job budget above.
      #
      # No --allow-partial: a snapshot missing one source ships an installation
      # that grades on half the evidence, which is worse than shipping last
      # month's complete one. A source being down fails the run deliberately,
      # and the tracking issue below says why.
      - name: Regenerate the capability snapshot
        env:
          RETRY_CMD_ATTEMPTS: "3"
          RETRY_CMD_ATTEMPT_TIMEOUT: "400"
          RETRY_CMD_DEADLINE: "900"
        run: |
          .github/scripts/retry_cmd.sh "capability snapshot refresh" \
            uv run python scripts/refresh_capability_bundle.py

      # The refresh script enforces a per-source floor; these tests enforce what
      # the RUNTIME needs of the file it will seed from (every registered source
      # covered, a cohort large enough to rank in, dates that still age). Run
      # here rather than left to the PR's own CI so a snapshot that would land
      # red names its cause in the tracking issue instead of sitting in an
      # unwatched red PR for a month.
      - name: Verify the regenerated snapshot
        run: |
          uv run python -m pytest \
            tests/unit/providers/capability_sources/test_bundle.py -m unit

      - name: Detect snapshot changes
        id: diff
        env:
          BUNDLE: src/synthorg/providers/capability_sources/bundled_scores.json
        run: |
          set -euo pipefail
          # `git status --porcelain` catches both tracked-modified and a
          # brand-new untracked snapshot (first-run case).
          if [ -z "$(git status --porcelain -- "$BUNDLE")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commit + push + open PR using only native tools (gh CLI + git).
      # `git push` with the App token produces an UNSIGNED commit; to keep
      # the signed-commit pattern used elsewhere in the repo, the commit
      # goes through the GraphQL `createCommitOnBranch` mutation, which
      # signs the resulting commit as the App.
      - name: Open / update capability-snapshot PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ci/capability-bundle-update
          BASE_SHA: ${{ github.sha }}
          BUNDLE: src/synthorg/providers/capability_sources/bundled_scores.json
        run: |
          set -euo pipefail

          # 1. Ensure the branch exists at BASE_SHA (delete + recreate so
          #    each run starts fresh; the previous snapshot is irrelevant
          #    once a new one is captured).
          #
          # Existence check uses `git/ref/heads/$BRANCH` (SINGULAR `ref`)
          # for exact lookup. The plural `git/refs/heads/...` endpoint is
          # the deprecated list/prefix-match form: it can return 200 with
          # an array (or another ref sharing the prefix) and silently
          # mis-detect existence, making the subsequent POST fail with
          # "Reference already exists" on rerun. DELETE + POST keep the
          # plural form because those are mutation endpoints, not lookups.
          # `gh api ... 2>/dev/null` collapses every failure to "absent":
          # a 401 blip or a 5xx would read as "no branch", the POST below
          # would then fail with "Reference already exists", and the run
          # would report a push conflict for what was a transient API
          # fault. Retry the lookup, keep its diagnostics, and treat ONLY a
          # 404 as absent.
          lookup_err=$(mktemp)
          if .github/scripts/gh_with_retry.sh "capability-bundle ref lookup" \
              gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" \
              >/dev/null 2>"$lookup_err"; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
          elif ! grep -q 'HTTP 404' "$lookup_err"; then
            echo "::error::ref lookup for $BRANCH failed for a reason other than absence"
            cat "$lookup_err" >&2
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/$BRANCH" \
            -f "sha=$BASE_SHA"

          # 2. Build the createCommitOnBranch fileChanges.additions[] entry.
          #    The snapshot is ~200 kB, so the additions array and the
          #    request body both go through temp files rather than argv:
          #    a base64 payload that size passed as a --argjson value
          #    blows past the runner's ARG_MAX.
          additions_file=$(mktemp)
          jq -nc --arg p "$BUNDLE" --rawfile c "$BUNDLE" \
            '[{path: $p, contents: ($c | @base64)}]' > "$additions_file"

          # 3. Sign-and-commit via GraphQL. expectedHeadOid pins us to the
          #    just-created branch tip so a concurrent push between step 1
          #    and step 3 surfaces as an error instead of a silent
          #    overwrite. `--slurpfile` reads the additions JSON from disk
          #    and binds it as a single-element array, hence `$additions[0]`.
          # shellcheck disable=SC2016  # $branchName etc. are GraphQL variables, not shell expansions
          query='mutation($branchName: String!, $repoWithOwner: String!, $expectedOid: GitObjectID!, $additions: [FileAddition!]!) {
            createCommitOnBranch(input: {
              branch: { repositoryNameWithOwner: $repoWithOwner, branchName: $branchName }
              message: { headline: "chore: refresh the bundled capability snapshot" }
              fileChanges: { additions: $additions }
              expectedHeadOid: $expectedOid
            }) {
              commit { oid url }
            }
          }'
          body_file=$(mktemp)
          jq -n \
            --arg query "$query" \
            --arg branchName "$BRANCH" \
            --arg repoWithOwner "$GITHUB_REPOSITORY" \
            --arg expectedOid "$BASE_SHA" \
            --slurpfile additions "$additions_file" \
            '{
              query: $query,
              variables: {
                branchName: $branchName,
                repoWithOwner: $repoWithOwner,
                expectedOid: $expectedOid,
                additions: $additions[0]
              }
            }' > "$body_file"

          # `gh api /graphql` exits 0 on HTTP 200 even when the JSON body
          # carries a top-level `errors[]`, so `set -e` does NOT catch
          # GraphQL-level failures (auth, permission denial, expectedHeadOid
          # mismatch). Without this check we would `gh pr create` against an
          # empty branch and ship a no-change PR.
          commit_response=$(gh api /graphql --input "$body_file")
          if jq -e '.errors != null or .data.createCommitOnBranch.commit.oid == null' >/dev/null <<<"$commit_response"; then
            echo "::error::createCommitOnBranch did not produce a commit; raw response follows" >&2
            jq '.' <<<"$commit_response" >&2
            exit 1
          fi
          new_sha=$(jq -r '.data.createCommitOnBranch.commit.oid' <<<"$commit_response")
          echo "Signed commit $new_sha pushed to $BRANCH"

          # 4. Open the PR (or no-op when one already exists for this
          #    branch: gh exits non-zero with "a pull request for branch X
          #    already exists" on stderr, which we accept).
          pr_create_output=$(mktemp)
          if ! gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: refresh the bundled capability snapshot" \
            --body "Automated monthly refresh of the capability snapshot via \`.github/workflows/maint-capability-bundle.yml\`.

          The snapshot is what grades models on an installation that has never fetched a
          source itself: no outbound network, or a first boot before the first refresh.
          Without it those installations fall back to the size-and-price heuristic, which
          is the proxy the evidence layer exists to replace.

          Review the diff for a source whose measurement count moved sharply: the
          regeneration refuses a source that produced implausibly few rows, so a large
          swing that still passed is a real change in what the source publishes." \
            --label "type:chore" --label "scope:small" \
            > "$pr_create_output" 2>&1; then
            if grep -q "already exists" "$pr_create_output"; then
              cat "$pr_create_output"
              echo "PR already exists for $BRANCH -- branch updated, no new PR needed"
            else
              cat "$pr_create_output" >&2
              exit 1
            fi
          else
            cat "$pr_create_output"
          fi

  report-failure:
    name: Open / update tracking issue on schedule failure
    needs: update-bundle
    # Only the schedule path gets the issue sink. Manual `workflow_dispatch`
    # failures from a debugging branch shouldn't open repo-wide CI-health
    # issues; the operator already sees the run output directly.
    #
    # `== 'failure'` and not the non-success complement: the body below
    # sends the reader to `--log-failed` for a failing step, which a
    # cancelled or timed-out run does not have. That outcome goes to
    # report-stalled.
    if: >-
      always()
      && github.event_name == 'schedule'
      && needs.update-bundle.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/post-tracking-issue)
      issues: write     # gh issue create / comment / pin
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compose body
        id: body
        env:
          RESULT: ${{ needs.update-bundle.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo 'body<<TRACKING_ISSUE_BODY_EOF'
            cat <<EOF
          The capability-snapshot refresh failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) with result \`$RESULT\`.

          Run: ${RUN_URL}

          Read the failing step's logs FIRST before assuming a cause:
          \`gh run view ${GITHUB_RUN_ID} --log-failed\`. Candidate causes,
          roughly by likelihood:
          - A source's feed changed shape and its parser now skips nearly
            every row. The script fails a source that produced implausibly
            few measurements rather than shipping a snapshot that looks
            healthy and grades nothing; fix the parser under
            \`providers/capability_sources/parsers/\`.
          - A source stopped publishing machine-readable results entirely,
            in which case the registry entry needs replacing rather than
            the parser fixing. Check the feed by hand before assuming a
            transient failure: a feed frozen months ago still returns
            HTTP 200 and still parses.
          - One source's feed was unreachable (HTTP 5xx, DNS, timeout). The
            refresh runs inside a bounded retry ladder, so this only
            surfaces once every attempt failed; the script then refuses to
            write a partial snapshot, because a single source down would
            otherwise ship an installation grading on half the evidence.
          - The verification step rejected the regenerated file: a source
            cleared the script's floor but the snapshot no longer satisfies
            what the runtime seeds from. The failing assertion names which.
          - The App-token + \`createCommitOnBranch\` + \`gh pr create\` push
            flow could not push (token mint failure, GraphQL permission
            denial, or \`apko-lock\` env branch-policy drift).

          While this stays red the shipped snapshot ages. An installation
          with no outbound network grades on it alone, so the practical
          effect is offline installations drifting further behind the
          models actually in use.
          EOF
            echo 'TRACKING_ISSUE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/post-tracking-issue
        with:
          title: 'Capability snapshot refresh regression'
          labels: 'automation:ci-health,type:ci,prio:medium'
          body: ${{ steps.body.outputs.body }}
          pin: 'false'
          gh-token: ${{ github.token }}

  report-stalled:
    name: Open / update tracking issue on an unfinished refresh
    needs: update-bundle
    # The complement of the three settled results, so a result GitHub adds
    # later still lands somewhere rather than falling through both sinks.
    if: >-
      always()
      && github.event_name == 'schedule'
      && needs.update-bundle.result != 'success'
      && needs.update-bundle.result != 'failure'
      && needs.update-bundle.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/report-stalled-issue)
      issues: write     # gh issue create / comment / reopen
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/report-stalled-issue
        with:
          title: 'Capability snapshot refresh not completing'
          labels: 'automation:ci-health,type:ci,prio:medium'
          subject: 'The monthly capability snapshot refresh'
          not-measured: 'no snapshot was captured and no source drift was detected'
          guidance: >-
            There is no failing step to read: check the run's step timings
            against the update job's 30-minute budget instead. The refresh
            ladder bounds each attempt, so a hung fetch should surface as a
            failure rather than a stall; a run that reaches here spent its
            time somewhere else, most likely a cold dependency install or
            the push flow. The shipped snapshot ages while this persists,
            exactly as it does when the job fails outright.
          result: ${{ needs.update-bundle.result }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          gh-token: ${{ github.token }}
