name: CLA

# Contributor License Agreement gate.
#
# Two jobs split by event type:
#
#   cla-check (pull_request_target):
#     READ-only path. Self-contained bash + gh api: fetches PR commit
#     authors, reads .github/cla-signatures.json from the
#     cla-signatures branch, subtracts the bot allowlist, and updates a
#     marker-based comment on the PR (PATCH if the marker exists, POST
#     when transitioning into the unsigned state). gh_api_retry wraps
#     every API call with bounded exponential-with-cap retry so
#     transient EPIPE / 5xx failures do not redden the gate; definitive
#     4xx (missing branch, revoked token) fails fast.
#
#   cla-sign (issue_comment matching the sign-text body):
#     WRITE path. Replaces the bundled action's commit step with a
#     custom Git Data API mint under the synthorg-repo-bot App token,
#     so the resulting commit on cla-signatures verifies as
#     {verified: true, reason: "valid"} attributed to the App's bot
#     identity. After the commit lands the job posts the confirmation
#     comment and re-runs the most recent cla-check run on the PR's
#     head SHA, mirroring the rerun behaviour the bundled action
#     provides on its issue_comment path.
#
# Why the split. The default branch-protection ruleset enforces
# required_signatures across ~ALL refs (no cla-signatures carve-out).
# All other automation in the repo already mints signed commits as
# synthorg-repo-bot via the Git Data API (release.yml,
# dev-release.yml, auto-rollover.yml, graduate.yml). Routing CLA
# writes through the same mechanism keeps the trusted-write surface
# uniform and lets the default ruleset stay at a clean ~ALL scope.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  # ── Read-only check + prompt-comment path ──
  cla-check:
    name: CLA Signature Check
    # The opener-side allowlist below is intentionally a strict subset
    # of Step 3's commit-author allowlist (which also includes
    # `github-actions[bot]`). The `if:` gate skips the job entirely
    # when the PR is opened by a known automation that never carries
    # human commits; Step 3 instead filters bot-authored commits out
    # of the unsigned diff for mixed-authorship PRs (e.g. a human PR
    # that picked up an auto-fix commit attributed to
    # `github-actions[bot]`). For those mixed cases the job MUST run,
    # so `github-actions[bot]` stays out of this gate by design.
    if: |
      github.event_name == 'pull_request_target'
        && github.event.pull_request.user.login != 'dependabot[bot]'
        && github.event.pull_request.user.login != 'renovate[bot]'
        && github.event.pull_request.user.login != 'synthorg-repo-bot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      # The read path never writes back; the write path lives in
      # cla-sign below, which mints via the App token, NOT GITHUB_TOKEN.
      contents: read
      pull-requests: write
    steps:
      - name: CLA signature check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # ── Helper: gh_api_retry ──
          # Wraps `gh api` with bounded exponential-with-cap retry on
          # transient failures (network errors, 5xx, EPIPE-class).
          # Definitive client errors (4xx) fail fast: retrying a missing
          # branch or revoked token wastes the retry budget.
          # Backoff: 15, 30, 60, 120, 120, 120, 120 = ~10 min over
          # 8 attempts (7 sleeps). Job timeout is 12 min for headroom.
          gh_api_retry() {
            local attempt=0
            local max_attempts=8
            local delay=15
            local rc
            while : ; do
              attempt=$((attempt + 1))
              if gh api "$@" 2>/tmp/gh-api-err; then
                return 0
              fi
              rc=$?
              if grep -qE 'HTTP 4(00|01|03|04|09|22)' /tmp/gh-api-err; then
                echo "::error::gh api definitive 4xx (no retry): $(cat /tmp/gh-api-err)" >&2
                return "$rc"
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::gh api failed after $attempt attempts: $(cat /tmp/gh-api-err)" >&2
                return "$rc"
              fi
              echo "::warning::gh api transient failure (attempt $attempt/$max_attempts), retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$((delay * 2))
              if [ "$delay" -gt 120 ]; then delay=120; fi
            done
          }

          # ── Step 1: Collect distinct PR commit authors. ──
          # Skip null .author entries (commits whose email did not map
          # to a GitHub identity); the unsigned diff requires a positive
          # identity.
          gh_api_retry --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" \
            --jq '.[].author.login | select(.)' \
            | sort -u > /tmp/pr-authors
          if [ ! -s /tmp/pr-authors ]; then
            echo "::error::No PR commit authors with linked GitHub accounts found. This usually means commit emails are not associated with the contributor's GitHub account; ensure each commit uses an email registered on github.com (Settings -> Emails) so the CLA gate can identify the signer."
            exit 1
          fi
          echo "PR commit authors:"
          cat /tmp/pr-authors

          # ── Step 2: Read manifest from the cla-signatures branch. ──
          gh_api_retry \
            "repos/$GITHUB_REPOSITORY/contents/.github/cla-signatures.json?ref=cla-signatures" \
            --jq '.content' \
            | base64 -d > /tmp/cla-current.json
          jq -r '.signedContributors[].name' /tmp/cla-current.json \
            | sort -u > /tmp/cla-signed

          # ── Step 3: Bot allowlist. ──
          # Bots whose commits bypass the CLA check: release automation
          # and dependency bumpers commit under these identities; the
          # human-contributor CLA obligation does not apply to them.
          # Stay in sync with two other places:
          #   (a) the if: gate at the top of this job (PR-opener check),
          #   (b) the cla-sign job's bot-allowlist block (Step 7).
          # Mismatch produces false negatives on mixed-authorship PRs.
          printf '%s\n' \
            'dependabot[bot]' \
            'renovate[bot]' \
            'synthorg-repo-bot[bot]' \
            'github-actions[bot]' \
            | sort -u > /tmp/cla-bot-allowlist

          # ── Step 4: Compute the unsigned set. ──
          # required = pr_authors - bot_allowlist
          # pending  = required   - signed
          comm -23 /tmp/pr-authors /tmp/cla-bot-allowlist > /tmp/cla-required
          comm -23 /tmp/cla-required /tmp/cla-signed > /tmp/cla-pending
          PENDING_COUNT=$(wc -l < /tmp/cla-pending | tr -d '[:space:]')
          PENDING_LIST=$(sed 's/^/@/' /tmp/cla-pending | paste -sd ', ')
          echo "Required signers (excluding bot allowlist):"
          cat /tmp/cla-required
          echo "Pending unsigned authors: $PENDING_COUNT"
          if [ "$PENDING_COUNT" -gt 0 ]; then
            echo "$PENDING_LIST"
          fi

          # ── Step 5: Idempotent comment update. ──
          # The HTML-comment marker hides from the rendered view but
          # lets us locate any prior cla-check comment on this PR.
          # PATCH if found; POST only when transitioning into the
          # unsigned state from a clean PR (no need to spam PRs that
          # never had an unsigned state).
          MARKER='<!-- synthorg-cla-check -->'
          # Build the comment body via printf so every physical line
          # stays inside the YAML literal block's indent (a column-0
          # continuation line would terminate the block prematurely).
          if [ "$PENDING_COUNT" -gt 0 ]; then
            body=$(printf '%s\n\n%s\n\n%s\n\n> %s\n\n%s' \
              "$MARKER" \
              "Thank you for your contribution. Before we can merge, the following contributor(s) need to sign the [Contributor License Agreement](https://github.com/${GITHUB_REPOSITORY}/blob/main/.github/CLA.md): ${PENDING_LIST}." \
              "**To sign**, reply to this comment with the following exact text:" \
              "I have read the CLA Document and I hereby sign the CLA" \
              "You only need to sign once -- it covers all future contributions.")
          else
            body=$(printf '%s\n\n%s' \
              "$MARKER" \
              "All contributors have signed the CLA. Thank you!")
          fi
          existing=$(gh_api_retry --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" \
            | head -n1)
          if [ -n "$existing" ]; then
            gh_api_retry --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -f body="$body" >/dev/null
            echo "Edited existing CLA-check comment $existing"
          elif [ "$PENDING_COUNT" -gt 0 ]; then
            gh_api_retry --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body" >/dev/null
            echo "Posted new CLA-check prompt comment"
          fi

          # ── Step 6: Exit code drives the gate. ──
          if [ "$PENDING_COUNT" -gt 0 ]; then
            echo "::error::CLA not signed by: $PENDING_LIST"
            exit 1
          fi
          echo "All contributors signed."

  # ── App-token mint write path ──
  cla-sign:
    name: CLA Signature Record
    if: |
      github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        && github.event.comment.user.login != 'dependabot[bot]'
        && github.event.comment.user.login != 'renovate[bot]'
        && github.event.comment.user.login != 'synthorg-repo-bot[bot]'
        && github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # release env scopes RELEASE_BOT_APP_* secrets to refs/heads/main.
    # issue_comment events have github.ref == refs/heads/main, so the
    # branch policy admits this job.
    environment: release
    permissions:
      contents: read       # checkout for release-runner-setup composite
      pull-requests: write # post the all-signed confirmation comment
      # actions: write on GITHUB_TOKEN so the post-record step can re-run
      # the failing cla-check run on the PR's head SHA, flipping the gate
      # green without waiting for a fresh push. Mirrors the rerun
      # behaviour the bundled action provides on its issue_comment path.
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          persist-credentials: false

      - name: Release runner setup
        id: setup
        uses: ./.github/actions/release-runner-setup
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}

      - name: Validate commenter and record signature
        env:
          # Two tokens, two scopes:
          #   GITHUB_TOKEN_RW: PR reads, comment posts, workflow re-run.
          #   APP_TOKEN: signed commit on cla-signatures via Git Data API.
          GITHUB_TOKEN_RW: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.setup.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENTER_LOGIN: ${{ github.event.comment.user.login }}
          COMMENTER_ID: ${{ github.event.comment.user.id }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail

          # ── Step 0: Defense-in-depth COMMENTER_LOGIN format guard ──
          # GitHub usernames are restricted to [a-zA-Z0-9-] (no leading
          # / trailing hyphen, max 39 chars). Validate up-front so the
          # value is provably safe before it flows into grep, jq --arg,
          # and the commit message body. Belt-and-braces: if a future
          # GitHub change ever loosens username syntax, this guard keeps
          # the workflow's invariants intact.
          if ! [[ "$COMMENTER_LOGIN" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]; then
            echo "::error::COMMENTER_LOGIN '$COMMENTER_LOGIN' does not match GitHub username grammar"
            exit 1
          fi

          # ── Step 1: Validate commenter is a PR contributor ──
          GH_TOKEN="$GITHUB_TOKEN_RW" \
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha' > /tmp/pr-head-sha
          PR_HEAD_SHA=$(cat /tmp/pr-head-sha)
          if [[ -z "$PR_HEAD_SHA" || ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Failed to extract a valid 40-hex PR head SHA (got: '$PR_HEAD_SHA')"
            exit 1
          fi
          echo "PR head SHA: $PR_HEAD_SHA"

          # Collect distinct PR commit authors (login). Some commits may
          # have a null .author (unmatched email) -- skip those; the
          # match below requires a positive identity.
          GH_TOKEN="$GITHUB_TOKEN_RW" \
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" \
              --jq '.[].author.login | select(.)' \
            | sort -u > /tmp/pr-authors
          if [ ! -s /tmp/pr-authors ]; then
            echo "::error::Failed to fetch PR commit authors (empty list); cannot validate commenter"
            exit 1
          fi
          echo "PR commit authors:"
          cat /tmp/pr-authors

          if ! grep -qx "$COMMENTER_LOGIN" /tmp/pr-authors; then
            echo "::error::Commenter '$COMMENTER_LOGIN' is not an author of any PR commit"
            exit 1
          fi

          # ── Steps 2-5: read-modify-write loop with retry on non-fast-forward ──
          # Two contributors signing simultaneously on different PRs will
          # race here: both read the same cla-signatures tip, both build
          # a commit with that tip as parent, and the second PATCH /git/refs
          # returns 422 (non-fast-forward). We don't want to lose that
          # signer's record; retry by re-reading the latest tip and rebuilding
          # the commit with the new parent. Idempotency on COMMENTER_ID
          # means a re-fetch that already includes our signature short-circuits
          # cleanly.
          MAX_ATTEMPTS=5
          attempt=0
          while : ; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$MAX_ATTEMPTS" ]; then
              echo "::error::Failed to PATCH cla-signatures ref after $MAX_ATTEMPTS attempts (concurrent writes?)"
              exit 1
            fi
            echo "── Attempt $attempt/$MAX_ATTEMPTS ──"

            # Step 2: Read current cla-signatures.json from cla-signatures branch.
            GH_TOKEN="$APP_TOKEN" \
              gh api "repos/$GITHUB_REPOSITORY/contents/.github/cla-signatures.json?ref=cla-signatures" \
                --jq '.content' \
              | base64 -d > /tmp/cla-current.json

            # Step 3: Idempotency -- if our signature already landed
            # (either we recorded it ourselves on a prior attempt, or a
            # concurrent CLA run inserted us between reads), exit success.
            if jq -e --argjson id "$COMMENTER_ID" \
                '.signedContributors | map(.id) | index($id)' \
                /tmp/cla-current.json > /dev/null; then
              echo "::notice::Commenter id $COMMENTER_ID already in signedContributors; nothing to record."
              echo "already_signed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Step 4: Build the new signatures file. Canonical 2-space
            # indent + trailing newline matches the manifest's existing
            # shape on the cla-signatures branch -- preserving the format
            # keeps the per-signature diff to a single appended array
            # element and avoids whole-file reformat noise.
            NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            jq --indent 2 \
              --arg name "$COMMENTER_LOGIN" \
              --argjson id "$COMMENTER_ID" \
              --argjson comment_id "$COMMENT_ID" \
              --arg created_at "$NOW" \
              --argjson repoId "$REPO_ID" \
              --argjson pr "$PR_NUMBER" \
              '.signedContributors += [{
                name: $name,
                id: $id,
                comment_id: $comment_id,
                created_at: $created_at,
                repoId: $repoId,
                pullRequestNo: $pr
              }]' \
              /tmp/cla-current.json > /tmp/cla-final.json
            printf '\n' >> /tmp/cla-final.json

            # Step 5: Mint blob → tree → commit → ref-PATCH.
            BLOB_CONTENT_B64=$(base64 -w0 < /tmp/cla-final.json)
            BLOB_SHA=$(jq -n \
                --arg content "$BLOB_CONTENT_B64" \
                '{content: $content, encoding: "base64"}' \
              | GH_TOKEN="$APP_TOKEN" \
                  gh api --method POST \
                    "repos/$GITHUB_REPOSITORY/git/blobs" \
                    --input - --jq '.sha')
            BRANCH_INFO=$(GH_TOKEN="$APP_TOKEN" \
              gh api "repos/$GITHUB_REPOSITORY/branches/cla-signatures")
            PARENT_SHA=$(jq -r '.commit.sha' <<< "$BRANCH_INFO")
            BASE_TREE_SHA=$(jq -r '.commit.commit.tree.sha' <<< "$BRANCH_INFO")
            NEW_TREE_SHA=$(jq -n \
                --arg base_tree "$BASE_TREE_SHA" \
                --arg blob "$BLOB_SHA" \
                '{
                  base_tree: $base_tree,
                  tree: [{
                    path: ".github/cla-signatures.json",
                    mode: "100644",
                    type: "blob",
                    sha: $blob
                  }]
                }' \
              | GH_TOKEN="$APP_TOKEN" \
                  gh api --method POST \
                    "repos/$GITHUB_REPOSITORY/git/trees" \
                    --input - --jq '.sha')
            COMMIT_MESSAGE="@$COMMENTER_LOGIN has signed the CLA in $GITHUB_REPOSITORY#$PR_NUMBER"
            NEW_COMMIT_SHA=$(jq -n \
                --arg msg "$COMMIT_MESSAGE" \
                --arg tree "$NEW_TREE_SHA" \
                --arg parent "$PARENT_SHA" \
                '{message: $msg, tree: $tree, parents: [$parent]}' \
              | GH_TOKEN="$APP_TOKEN" \
                  gh api --method POST \
                    "repos/$GITHUB_REPOSITORY/git/commits" \
                    --input - --jq '.sha')
            echo "Built commit $NEW_COMMIT_SHA on parent $PARENT_SHA"

            # Issue the ref PATCH. force=false (the default) makes a
            # non-fast-forward update return 422; capture the body so
            # we can distinguish "lost the race" from other failures.
            patch_body=$(jq -n --arg sha "$NEW_COMMIT_SHA" '{sha: $sha}')
            patch_status=$(printf '%s' "$patch_body" \
              | GH_TOKEN="$APP_TOKEN" \
                  gh api --method PATCH \
                    "repos/$GITHUB_REPOSITORY/git/refs/heads/cla-signatures" \
                    --input - >/tmp/patch-resp 2>/tmp/patch-err \
              && echo ok || echo fail)
            if [ "$patch_status" = "ok" ]; then
              echo "Updated cla-signatures ref to $NEW_COMMIT_SHA"
              break
            fi
            if grep -q "fast forward" /tmp/patch-err 2>/dev/null \
                || grep -q "Update is not a fast forward" /tmp/patch-err 2>/dev/null; then
              backoff=$((attempt * attempt))
              echo "::warning::Concurrent write detected on cla-signatures (attempt $attempt); retrying in ${backoff}s"
              sleep "$backoff"
              continue
            fi
            echo "::error::Unexpected gh api PATCH failure on cla-signatures ref:"
            cat /tmp/patch-err
            exit 1
          done

          # ── Step 6: Verify signature ──
          VERIFY=$(GH_TOKEN="$APP_TOKEN" \
            gh api "repos/$GITHUB_REPOSITORY/commits/$NEW_COMMIT_SHA" \
              --jq '.commit.verification')
          VERIFIED=$(jq -r '.verified' <<< "$VERIFY")
          REASON=$(jq -r '.reason' <<< "$VERIFY")
          if [[ "$VERIFIED" != "true" || "$REASON" != "valid" ]]; then
            echo "::error::Signature verification failed: verified=$VERIFIED reason=$REASON"
            exit 1
          fi
          echo "Signature verified: verified=$VERIFIED reason=$REASON"

          # ── Step 7: Compute pending unsigned PR authors ──
          # /tmp/cla-final.json holds the post-signature state for THIS
          # mint. Extract the set of signed logins, subtract from the PR
          # author set, then subtract the bot allowlist (these bots never
          # need a CLA -- their commits bypass the human-contributor
          # obligation).
          jq -r '.signedContributors[].name' /tmp/cla-final.json \
            | sort -u > /tmp/cla-signed
          # PR_AUTHORS already collected earlier in /tmp/pr-authors.
          # Bot allowlist must mirror cla-check's Step 3 list -- mismatch
          # produces false negatives on mixed-authorship PRs.
          printf '%s\n' \
            'dependabot[bot]' \
            'renovate[bot]' \
            'synthorg-repo-bot[bot]' \
            'github-actions[bot]' \
            | sort -u > /tmp/cla-bot-allowlist
          comm -23 /tmp/pr-authors /tmp/cla-bot-allowlist > /tmp/cla-required
          comm -23 /tmp/cla-required /tmp/cla-signed > /tmp/cla-pending
          PENDING_COUNT=$(wc -l < /tmp/cla-pending | tr -d '[:space:]')
          PENDING_LIST=$(sed 's/^/@/' /tmp/cla-pending | paste -sd ', ')
          echo "Required signers (excluding bot allowlist):"
          cat /tmp/cla-required
          echo "Pending unsigned authors after this mint: $PENDING_COUNT"
          if [ "$PENDING_COUNT" -gt 0 ]; then
            echo "$PENDING_LIST"
          fi

          # Outputs for downstream steps.
          {
            echo "commit_sha=$NEW_COMMIT_SHA"
            echo "pr_head_sha=$PR_HEAD_SHA"
            echo "already_signed=false"
            echo "pending_count=$PENDING_COUNT"
            echo "pending_list=$PENDING_LIST"
          } >> "$GITHUB_OUTPUT"
        id: record

      - name: Post signature confirmation comment
        if: steps.record.outputs.already_signed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENTER_LOGIN: ${{ github.event.comment.user.login }}
          PENDING_COUNT: ${{ steps.record.outputs.pending_count }}
          PENDING_LIST: ${{ steps.record.outputs.pending_list }}
        run: |
          set -euo pipefail
          # On a multi-author PR, recording one signature does not
          # necessarily satisfy the CLA gate. Pick the comment body
          # accordingly so the thread does not falsely declare the PR
          # signed while other authors are still unsigned.
          if [ "$PENDING_COUNT" -eq 0 ]; then
            body="All contributors have signed the CLA. Thank you!"
          else
            body="Recorded @${COMMENTER_LOGIN}'s CLA signature. Still waiting on ${PENDING_COUNT} contributor(s): ${PENDING_LIST}. Each remaining author needs to reply with the sign-text comment to complete the CLA gate."
          fi
          if ! gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body="$body"; then
            echo "::error::Failed to post CLA confirmation comment to PR #$PR_NUMBER"
            exit 1
          fi

      - name: Re-run the cla-check workflow on PR head SHA
        if: >-
          steps.record.outputs.already_signed == 'false'
          && steps.record.outputs.pending_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ steps.record.outputs.pr_head_sha }}
        run: |
          set -euo pipefail
          # Find the most recent cla-check run on the PR's head SHA so the
          # PR's CLA gate flips green without waiting for a fresh push.
          # Filter on event=pull_request_target so we don't accidentally
          # re-run the current issue_comment job.
          LAST_RUN=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/cla.yml/runs?head_sha=$PR_HEAD_SHA&event=pull_request_target&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$LAST_RUN" ]; then
            # Visible warning, not a quiet ::notice::: if the prior run is
            # missing, the PR's CLA gate will not auto-flip green and the
            # contributor will need a fresh push to re-trigger cla-check.
            echo "::warning::No prior cla-check run found for $PR_HEAD_SHA; PR gate will not auto-flip green until next push."
            exit 0
          fi
          echo "Re-running cla-check workflow run: $LAST_RUN"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$LAST_RUN/rerun"
