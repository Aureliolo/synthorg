name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          # LicenseRef-scancode-free-unknown: aiosqlite 0.21.0 -- MIT per classifiers, scancode misdetects
          # Python-2.0.1: editorconfig 0.17.1 (via jsbeautifier via litestar[standard])
          # MIT-0: cffi 2.0.0 -- permissive (MIT variant, no attribution required)
          # LicenseRef-scancode-free-unknown: aiosqlite 0.21.0, aiodocker 0.26.0,
          #   pycparser 3.0, sse-starlette 3.3.2 -- MIT per classifiers, scancode misdetects
          # LGPL-*: @img/sharp-libvips-* (Astro image optimization, build-time only)
          # BlueOak-1.0.0: lru-cache, sax (Astro transitive deps, permissive)
          # LicenseRef-scancode-protobuf: protobuf 5.29.6 (BSD-3-Clause AND scancode-protobuf, permissive)
          # ZPL-2.1: pytz 2026.1 (MIT AND ZPL-2.1, Zope Public License -- permissive)
          # Null: mem0ai, numpy, qdrant-client, posthog -- license metadata missing
          #   from lockfile but all are permissive (Apache-2.0 / BSD-3-Clause / MIT)
          # LicenseRef-scancode-google-patent-license-golang: golang.org/x/* packages
          #   (BSD-3-Clause AND google-patent-grant, standard Go stdlib-adjacent, permissive)
          # CC-BY-3.0, CC-BY-4.0: Creative Commons Attribution -- permissive, requires
          #   attribution only. Common in Go struct-tag and documentation-related packages.
          # OFL-1.1: SIL Open Font License -- standard font license used by
          #   @fontsource-variable/geist (Geist font). Permissive, requires
          #   attribution and no selling fonts standalone.
          allow-licenses: >-
            MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause,
            ISC, MPL-2.0, PSF-2.0, Unlicense, 0BSD,
            CC0-1.0, CC-BY-3.0, CC-BY-4.0,
            Python-2.0, Python-2.0.1,
            LicenseRef-scancode-free-unknown, LicenseRef-scancode-protobuf,
            LicenseRef-scancode-google-patent-license-golang,
            ZPL-2.1,
            LGPL-2.0-only, LGPL-2.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later,
            BlueOak-1.0.0,
            OFL-1.1
          # Packages with null/missing SPDX license metadata in lockfile.
          # Verified manually: mem0ai (Apache-2.0), numpy (BSD-3-Clause),
          # qdrant-client (Apache-2.0), posthog (MIT), aiohttp (Apache-2.0),
          # cyclonedx-python-lib (Apache-2.0), fsspec (BSD-3-Clause),
          # griffelib (ISC), grpcio (Apache-2.0).
          #
          # sharp platform binaries use compound AND licenses (e.g.
          # "Apache-2.0 AND LGPL-3.0-or-later") -- all constituents are
          # in the allowlist but the action doesn't split AND expressions.
          # CI-only transitive dep via wrangler, no licensing impact.
          #
          # charset-normalizer (LGPL-2.0-or-later AND LGPL-2.1-only AND
          # MIT AND MPL-1.1): compound AND license. All constituents are
          # permissive. Actual license is MIT. The action cannot split
          # compound AND expressions.
          #
          # wrapt (BSD-2-Clause AND BSD-3-Clause AND Python-2.0 AND Ruby):
          # compound AND license from vendored code metadata. Actual
          # license is BSD-2-Clause. The "Ruby" component is from vendored
          # code scan metadata, not a separate licensing concern.
          #
          # json-schema-typed (BSD-2-Clause AND JSON): transitive dep via
          # shadcn/radix. The "JSON" license has a non-standard "Good, not
          # Evil" clause. Dev-only type definition package, not bundled in
          # production output. The action cannot split compound AND licenses.
          #
          # victory-vendor (ISC AND JSON AND MIT): transitive dep via recharts.
          # GitHub's license scanner falsely detects "JSON" license. Actual
          # package.json declares "MIT AND ISC". Manual audit of all 13
          # vendored LICENSE files confirms ISC + BSD-3-Clause only, no JSON
          # license text present. Same false-positive pattern as json-schema-typed.
          #
          # Fine-tune optional dep group (torch, sentence-transformers) and
          # transitive CUDA/NVIDIA deps. Optional -- only installed via
          # synthorg[fine-tune-gpu] (default) or synthorg[fine-tune-cpu]. License
          # metadata missing from PyPI for NVIDIA CUDA packages (proprietary,
          # freely redistributable). torch is BSD-style. scikit-learn has compound
          # BSD-3-Clause AND scancode tag.
          #
          # pytest-codspeed: MIT upstream
          # (https://github.com/CodSpeedHQ/pytest-codspeed/blob/main/LICENSE)
          # but PyPI metadata is null. Verified manually. Test-only dependency
          # used by the Python perf-regression suite under tests/benchmarks/.
          allow-dependencies-licenses: >-
            pkg:pypi/mem0ai@1.0.9,
            pkg:pypi/numpy@2.4.4,
            pkg:pypi/qdrant-client@1.17.1,
            pkg:pypi/posthog@7.9.12,
            pkg:pypi/aiohttp@3.13.5,
            pkg:pypi/cyclonedx-python-lib@11.7.0,
            pkg:pypi/fsspec@2026.3.0,
            pkg:pypi/griffelib@2.0.2,
            pkg:pypi/grpcio@1.80.0,
            pkg:pypi/charset-normalizer@3.4.6,
            pkg:pypi/wrapt@2.1.2,
            pkg:pypi/pytest-codspeed@4.4.0,
            pkg:npm/@img/sharp-wasm32@0.33.5,
            pkg:npm/@img/sharp-win32-ia32@0.33.5,
            pkg:npm/@img/sharp-win32-x64@0.33.5,
            pkg:npm/json-schema-typed@8.0.2,
            pkg:npm/victory-vendor@37.3.6,
            pkg:pypi/scikit-learn@1.8.0,
            pkg:pypi/torch@2.11.0,
            pkg:pypi/cuda-bindings@13.2.0,
            pkg:pypi/cuda-pathfinder@1.5.0,
            pkg:pypi/cuda-toolkit@13.0.2,
            pkg:pypi/nvidia-cublas@13.1.0.3,
            pkg:pypi/nvidia-cuda-cupti@13.0.85,
            pkg:pypi/nvidia-cuda-nvrtc@13.0.88,
            pkg:pypi/nvidia-cuda-runtime@13.0.96,
            pkg:pypi/nvidia-cudnn-cu13@9.19.0.56,
            pkg:pypi/nvidia-cufft@12.0.0.61,
            pkg:pypi/nvidia-cufile@1.15.1.6,
            pkg:pypi/nvidia-curand@10.4.0.35,
            pkg:pypi/nvidia-cusolver@12.0.4.66,
            pkg:pypi/nvidia-cusparse@12.6.3.3,
            pkg:pypi/nvidia-cusparselt-cu13@0.8.0,
            pkg:pypi/nvidia-nccl-cu13@2.28.9,
            pkg:pypi/nvidia-nvjitlink@13.0.88,
            pkg:pypi/nvidia-nvshmem-cu13@3.4.5,
            pkg:pypi/nvidia-nvtx@13.0.85
          comment-summary-in-pr: always
