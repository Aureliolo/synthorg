name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "web/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - ".github/actions/build-apko-base/**"
      - ".github/actions/build-scan-image/**"
      - ".github/actions/cis-scan/**"
      - ".github/actions/publish-apko-base/**"
      - ".github/actions/publish-image/**"
      - ".github/actions/publish-image-loaded/**"
      - ".github/actions/setup-apko/**"
      - ".github/actions/setup-python-uv/**"
      - "scripts/cis-scan.sh"
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/export_openapi.py"
  workflow_dispatch:

permissions: {}

# PR runs cancel each other (we don't care about intermediate PR-build
# artifacts). Non-PR events key on the SHA: a main-push and a
# tag-push for the same commit (the release-please flow) share the
# group and queue serially -- the tag-push retag jobs require the
# main-push publish to have completed first. Successive main-pushes
# of different SHAs run in parallel because main-push only emits the
# unique `sha-<short>` tag (no shared mutable tags), so there is
# nothing for them to race on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: "0.71.0"
  # renovate: datasource=github-releases depName=chainguard-dev/apko
  APKO_VERSION: "v1.2.16"

jobs:
  # Detect which domains changed so docs-only PRs skip backend/sandbox builds
  changes:
    name: Detect Docker Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      sandbox: ${{ steps.filter.outputs.sandbox }}
      sidecar: ${{ steps.filter.outputs.sidecar }}
      fine-tune: ${{ steps.filter.outputs.fine-tune }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      # fetch-depth: 0. See ci.yml Detect Changes for full rationale:
      # paths-filter on push: events races on shallow checkouts.
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            backend:
              - 'docker/backend/**'
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.dockerignore'
              - '.github/workflows/docker.yml'
              - '.github/actions/build-apko-base/**'
              - '.github/actions/build-scan-image/**'
              - '.github/actions/cis-scan/**'
              - '.github/actions/publish-apko-base/**'
              - '.github/actions/publish-image/**'
              - '.github/actions/publish-image-loaded/**'
              - '.github/actions/setup-apko/**'
              - 'scripts/cis-scan.sh'
            sandbox:
              - 'docker/sandbox/**'
              - '.dockerignore'
              - '.github/workflows/docker.yml'
              - '.github/actions/build-apko-base/**'
              - '.github/actions/build-scan-image/**'
              - '.github/actions/cis-scan/**'
              - '.github/actions/publish-apko-base/**'
              - '.github/actions/publish-image/**'
              - '.github/actions/publish-image-loaded/**'
              - '.github/actions/setup-apko/**'
              - 'scripts/cis-scan.sh'
            sidecar:
              - 'docker/sidecar/**'
              - '.dockerignore'
              - '.github/workflows/docker.yml'
              - '.github/actions/build-apko-base/**'
              - '.github/actions/build-scan-image/**'
              - '.github/actions/cis-scan/**'
              - '.github/actions/publish-apko-base/**'
              - '.github/actions/publish-image/**'
              - '.github/actions/publish-image-loaded/**'
              - '.github/actions/setup-apko/**'
              - 'scripts/cis-scan.sh'
            fine-tune:
              - 'docker/fine-tune/**'
              - 'src/synthorg/memory/embedding/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.dockerignore'
              - '.github/workflows/docker.yml'
              - '.github/actions/build-apko-base/**'
              - '.github/actions/build-scan-image/**'
              - '.github/actions/cis-scan/**'
              - '.github/actions/publish-apko-base/**'
              - '.github/actions/publish-image/**'
              - '.github/actions/publish-image-loaded/**'
              - '.github/actions/setup-apko/**'
              - 'scripts/cis-scan.sh'
            web:
              - 'docker/web/**'
              - 'web/**'
              - 'docs/**'
              - 'mkdocs.yml'
              - 'scripts/export_openapi.py'
              - 'src/synthorg/api/**'
              - '.github/workflows/docker.yml'
              - '.github/actions/build-apko-base/**'
              - '.github/actions/cis-scan/**'
              - '.github/actions/publish-image-loaded/**'
              - '.github/actions/setup-apko/**'
              - '.github/actions/setup-python-uv/**'
              - 'scripts/cis-scan.sh'

  # Extract app version from pyproject.toml (single source of truth)
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      deployment_env: ${{ steps.deployment-env.outputs.deployment_env }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c "
          import tomllib
          import sys
          try:
              with open('pyproject.toml', 'rb') as f:
                  data = tomllib.load(f)
              print(data['tool']['commitizen']['version'])
          except (KeyError, FileNotFoundError) as e:
              print(f'::error::Failed to extract version: {e}', file=sys.stderr)
              sys.exit(1)
          ")
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "App version: ${VERSION}"

      # Resolve the deployment environment baked into backend images
      # built by this run. Ties into the existing version-label logic:
      # final release tags (e.g. v0.7.0) -> "prod"; every other tagged
      # pre-release form (-dev.N, -rc.N, -alpha.N, -beta.N) -> "pre-release";
      # everything else (main pushes, PR builds, workflow_dispatch manual
      # runs, and any local `docker build` without --build-arg) -> "dev".
      # The backend Dockerfile reads this as a build-arg and bakes it
      # into SYNTHORG_TELEMETRY_ENV_BAKED, which
      # synthorg.telemetry.collector._resolve_environment picks up as
      # the fallback tag when no operator override or CI auto-detection
      # applies.
      - name: Resolve baked deployment environment
        id: deployment-env
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            case "${GITHUB_REF}" in
              *-dev.*|*-rc.*|*-alpha.*|*-beta.*)
                ENV_TAG="pre-release"
                ;;
              *)
                ENV_TAG="prod"
                ;;
            esac
          else
            ENV_TAG="dev"
          fi
          echo "deployment_env=${ENV_TAG}" >> "$GITHUB_OUTPUT"
          echo "Deployment env (baked into backend image): ${ENV_TAG}"

  # =========================================================================
  # Compose file validation -- catches syntax errors early
  # =========================================================================
  validate-compose:
    name: Validate Compose Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate compose files
        run: |
          # Placeholder values for compose interpolation. The Dockerfile is
          # never built during `compose config`, so these values just need
          # to silence "variable not set" warnings; they are not consumed.
          {
            echo "POSTGRES_PASSWORD=ci-validation-dummy"
            echo "BASE_IMAGE=ci-validation-dummy:placeholder"
          } > docker/.env
          docker compose -f docker/compose.yml config --quiet
          docker compose -f docker/compose.yml -f docker/compose.distributed.yml --profile distributed config --quiet
          docker compose -f docker/compose.yml -f docker/compose.override.yml config --quiet

      - name: Report tmpfs allocations
        run: |
          echo "## tmpfs Allocations" >> "$GITHUB_STEP_SUMMARY"
          for f in docker/compose.yml docker/compose.distributed.yml docker/compose.override.yml; do
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'tmpfs:|^\s+- /.*size=' "$f" >> "$GITHUB_STEP_SUMMARY" || echo "_none_" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

  # =========================================================================
  # apko base images -- Wolfi-composed bases (all use build-apko-base action)
  # =========================================================================
  # The build-*-base jobs run on every event (PR, push, tag). They only need
  # `security-events: write` to upload Trivy SARIF results. The companion
  # build-*-base-publish jobs run on non-PR events and carry the elevated
  # permissions needed to push, sign, and attest the image.
  build-backend-base:
    name: Build Backend Base (apko)
    needs: [version, changes, validate-compose]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball-name: ${{ steps.build.outputs.tarball-name }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: build
        uses: ./.github/actions/build-apko-base
        with:
          image-name: backend
          apko-yaml: docker/backend/apko.yaml
          apko-version: ${{ env.APKO_VERSION }}
          trivy-version: ${{ env.TRIVY_VERSION }}

  build-backend-base-publish:
    name: Publish Backend Base (apko)
    needs: [version, build-backend-base]
    # Main-push only: tag-push runs the retag-* jobs instead, which
    # apply version tags to main-run's already-signed digest without
    # rebuilding. Restricting to `refs/heads/main` (rather than
    # `event_name != 'pull_request'`) blocks workflow_dispatch from
    # arbitrary feature branches from pushing/signing base images.
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.build-backend-base.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: image-push
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: publish
        uses: ./.github/actions/publish-apko-base
        with:
          image-name: backend
          tag: ${{ needs.build-backend-base.outputs.tag }}
          artifact-name: ${{ needs.build-backend-base.outputs.artifact-name }}
          tarball-name: ${{ needs.build-backend-base.outputs.tarball-name }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  build-sandbox-base:
    name: Build Sandbox Base (apko)
    needs: [version, changes, validate-compose]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.sandbox == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball-name: ${{ steps.build.outputs.tarball-name }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: build
        uses: ./.github/actions/build-apko-base
        with:
          image-name: sandbox
          apko-yaml: docker/sandbox/apko.yaml
          apko-version: ${{ env.APKO_VERSION }}
          trivy-version: ${{ env.TRIVY_VERSION }}

  build-sandbox-base-publish:
    name: Publish Sandbox Base (apko)
    needs: [version, build-sandbox-base]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.build-sandbox-base.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: image-push
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: publish
        uses: ./.github/actions/publish-apko-base
        with:
          image-name: sandbox
          tag: ${{ needs.build-sandbox-base.outputs.tag }}
          artifact-name: ${{ needs.build-sandbox-base.outputs.artifact-name }}
          tarball-name: ${{ needs.build-sandbox-base.outputs.tarball-name }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  build-sidecar-base:
    name: Build Sidecar Base (apko)
    needs: [version, changes, validate-compose]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.sidecar == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball-name: ${{ steps.build.outputs.tarball-name }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: build
        uses: ./.github/actions/build-apko-base
        with:
          image-name: sidecar
          apko-yaml: docker/sidecar/apko.yaml
          apko-version: ${{ env.APKO_VERSION }}
          trivy-version: ${{ env.TRIVY_VERSION }}

  build-sidecar-base-publish:
    name: Publish Sidecar Base (apko)
    needs: [version, build-sidecar-base]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.build-sidecar-base.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: image-push
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: publish
        uses: ./.github/actions/publish-apko-base
        with:
          image-name: sidecar
          tag: ${{ needs.build-sidecar-base.outputs.tag }}
          artifact-name: ${{ needs.build-sidecar-base.outputs.artifact-name }}
          tarball-name: ${{ needs.build-sidecar-base.outputs.tarball-name }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  build-fine-tune-base:
    name: Build Fine-Tune Base (apko)
    needs: [version, changes, validate-compose]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.fine-tune == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball-name: ${{ steps.build.outputs.tarball-name }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: build
        uses: ./.github/actions/build-apko-base
        with:
          image-name: fine-tune
          apko-yaml: docker/fine-tune/apko.yaml
          apko-version: ${{ env.APKO_VERSION }}
          trivy-version: ${{ env.TRIVY_VERSION }}

  build-fine-tune-base-publish:
    name: Publish Fine-Tune Base (apko)
    needs: [version, build-fine-tune-base]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.build-fine-tune-base.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: image-push
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: publish
        uses: ./.github/actions/publish-apko-base
        with:
          image-name: fine-tune
          tag: ${{ needs.build-fine-tune-base.outputs.tag }}
          artifact-name: ${{ needs.build-fine-tune-base.outputs.artifact-name }}
          tarball-name: ${{ needs.build-fine-tune-base.outputs.tarball-name }}
          architectures: "amd64"
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # Application images -- thin Dockerfile wrappers over apko bases
  # =========================================================================
  build-backend:
    name: Build Backend
    needs: [version, build-backend-base, build-backend-base-publish]
    # On PR events publish is always skipped (guarded to main), so the
    # app build falls back to the locally-loaded scan artifact. On any
    # non-PR event we require publish to have succeeded -- this makes
    # workflow_dispatch from a feature branch skip the app build entirely
    # instead of trying to pull a base tag that was never pushed to GHCR.
    # Tag pushes skip the build/publish path entirely; the retag-* jobs
    # apply version tags to main-run's already-signed digest.
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      needs.build-backend-base.result == 'success' &&
      (github.event_name == 'pull_request' || needs.build-backend-base-publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build and scan backend image
        id: build_scan
        uses: ./.github/actions/build-scan-image
        with:
          image-name: backend
          display-name: Backend
          dockerfile: docker/backend/Dockerfile
          app-version: ${{ needs.version.outputs.app_version }}
          base-image-repo: ghcr.io/aureliolo/synthorg-backend-base
          base-image-tag: ${{ needs.build-backend-base.outputs.tag }}
          base-image-digest: ${{ needs.build-backend-base-publish.outputs.digest }}
          base-image-artifact-name: ${{ needs.build-backend-base.outputs.artifact-name }}
          base-image-tarball-name: ${{ needs.build-backend-base.outputs.tarball-name }}
          trivy-version: ${{ env.TRIVY_VERSION }}
          # ``LOGFIRE_PROJECT_TOKEN`` is the GHA repo secret; the
          # Dockerfile's ``embed_logfire_token.py`` step writes it
          # into ``_embedded_token.py`` before ``uv sync`` packages
          # the venv, so published images carry the token while PR
          # / non-secret-bearing builds (e.g. forks) keep the
          # sentinel and run telemetry disabled-by-build.
          # Pull-request events deliberately receive an empty token:
          # unreviewed PR code paths must not have access to the
          # write-only project secret.
          extra-build-args: |
            DEPLOYMENT_ENV=${{ needs.version.outputs.deployment_env }}
            LOGFIRE_PROJECT_TOKEN=${{ github.event_name != 'pull_request' && secrets.LOGFIRE_PROJECT_TOKEN || '' }}

      # Smoke-test the just-built backend image. Runs on EVERY event
      # that builds the image (PR, push to main, v* tag pushes,
      # workflow_dispatch) -- intentionally NOT gated to PRs only.
      # Catches broken boot paths (404 on the wrong probe URL,
      # missing migration, entrypoint crash, etc.) before publish.
      #
      # Why every event, not just PRs:
      #   - PR path: fails the originating PR with a red ❌ on the
      #     commit row.
      #   - push to main: catches regressions in commits that did
      #     NOT come through PR CI -- auto-rollover empty commits
      #     (auto-rollover.yml), release-please bumps, hotfixes
      #     pushed via the CLI, etc. Without smoke here, those
      #     commits would let build-backend-publish push a broken
      #     image straight to GHCR.
      #   - tag push: same story for graduate.yml + manual tags.
      #   - workflow_dispatch: protects ad-hoc rebuilds.
      #
      # Earlier the smoke lived in finalize-release.yml and ran
      # only after a tag was already cut -- catching the same
      # regression after the entire Docker matrix + GoReleaser
      # signing had already run. Running here makes it the SOURCE
      # OF TRUTH gate; finalize-release no longer re-tests because
      # Docker images are content-addressed and pulling from GHCR
      # at release time can never produce different bytes than the
      # image just smoked here.
      #
      # The image is already loaded into the local Docker daemon
      # by build-scan-image (it builds with `outputs: type=docker,
      # dest=...` and re-loads); we run it in the same job, no
      # registry pull. Probes /api/v1/healthz with a 120s deadline.
      - name: Smoke-test backend image
        uses: ./.github/actions/smoke-test-backend-image
        with:
          image: ${{ steps.build_scan.outputs.ref_amd64 }}

  build-backend-publish:
    name: Publish Backend
    needs: [version, build-backend]
    if: >-
      !cancelled() &&
      needs.build-backend.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: image-push
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Publish backend image
        id: publish
        uses: ./.github/actions/publish-image
        with:
          image-name: backend
          app-version: ${{ needs.version.outputs.app_version }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # Web image -- melange-packaged assets + pure apko (no Dockerfile)
  # =========================================================================
  build-web-assets:
    name: Build Web Assets (melange)
    needs: [version, changes, validate-compose]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
          package-manager-cache: false

      - name: Set up Python + uv (OpenAPI export + docs build)
        uses: ./.github/actions/setup-python-uv

      - name: Export OpenAPI schema (required by frontend codegen)
        run: uv run python scripts/export_openapi.py

      # `npm ci` hits the npm registry for every transitive dep, and npm's
      # optional-dependency reify bug (npm/cli#4828) can silently drop a
      # platform native binding. The composite retries on registry blips and
      # verifies + repairs any missing native binding before the build runs.
      - name: Install frontend deps
        uses: ./.github/actions/install-js-deps
        with:
          working-directory: web
          npm-ci-args: --ignore-scripts

      - name: Build SPA
        working-directory: web
        run: npm run build

      # D2 does not publish checksums or signatures in its releases;
      # integrity relies on HTTPS transport from GitHub. Accepted tradeoff:
      # D2 is a docs-only diagramming tool (not a security scanner).
      # Version managed by Renovate (regex manager in renovate.json).
      - name: Install D2
        env:
          # renovate: datasource=github-releases depName=terrastruct/d2
          D2_VERSION: v0.7.1
        run: |
          curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz" -o /tmp/d2.tar.gz
          tar -xzf /tmp/d2.tar.gz -C /tmp
          sudo mv "/tmp/d2-${D2_VERSION}/bin/d2" /usr/local/bin/d2
          rm -rf /tmp/d2.tar.gz "/tmp/d2-${D2_VERSION}"

      - name: Build documentation
        env:
          PYTHONPATH: .
        run: uv run zensical build

      - name: Set up melange
        # ``setup-melange`` accepts a ``version:`` input that pins the
        # melange binary; the SHA pin on the action itself locks the
        # action's own code so neither layer can drift unexpectedly.
        # The action also installs bubblewrap on the runner, which
        # melange's default container runner needs to build apks.
        # Renovate watches the binary version via the comment marker
        # below; the action SHA is bumped via the standard
        # ``actions/*`` Renovate manager.
        uses: chainguard-dev/actions/setup-melange@3b7bbeebc3a5d2bc37aa008350202651c32a26e1 # v1.6.22
        with:
          # renovate: datasource=github-releases depName=chainguard-dev/melange
          version: v0.53.1

      - name: Generate melange signing key
        run: melange keygen

      # Each `melange build` pulls Wolfi apks from packages.wolfi.dev for
      # build/runtime deps; a single 5xx on that mirror fails the whole arch
      # leg. Retry per-arch so a transient mirror blip doesn't kill the run.
      # Build arches sequentially -- melange v0.49.0 bubblewrap runner has a
      # bind-mount race when building multiple arches in parallel, causing
      # web/dist/ to be invisible in one guest. TODO: revisit once
      # setup-melange pin advances past v1.6.15 / melange > 0.49.0 (upstream
      # has a bind-mount concurrency fix in flight). Parallel arch builds
      # would cut this step from ~6m to ~3m on the critical path.
      - name: Build web-assets apk (x86_64)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            printf 'version: %s\n' "$APP_VERSION" > /tmp/melange-vars.yaml
            melange build docker/web/melange.yaml \
              --arch x86_64 \
              --source-dir . \
              --signing-key melange.rsa \
              --out-dir packages/ \
              --vars-file /tmp/melange-vars.yaml

      - name: Build web-assets apk (aarch64)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            printf 'version: %s\n' "$APP_VERSION" > /tmp/melange-vars.yaml
            melange build docker/web/melange.yaml \
              --arch aarch64 \
              --source-dir . \
              --signing-key melange.rsa \
              --out-dir packages/ \
              --vars-file /tmp/melange-vars.yaml

      - name: Upload packages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-apk-packages
          path: |
            packages/
            melange.rsa.pub
          retention-days: 1

  build-web:
    name: Build Web (apko)
    needs: [version, build-web-assets]
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      needs.build-web-assets.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare work directory
        run: sudo mkdir -p /work && sudo chown "$(id -u):$(id -g)" /work

      - name: Download web-assets apk
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-apk-packages
          path: /work

      - name: Set up apko
        uses: ./.github/actions/setup-apko
        with:
          version: ${{ env.APKO_VERSION }}

      # Compute the short-SHA tag in a bash step so the substring expansion
      # `${GITHUB_SHA::7}` runs under bash. nick-fields/retry's `command:`
      # runs under `sh` by default, where that expansion is a syntax error.
      - name: Compute image tag
        id: web-image-ref
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # `apko build` pulls every package from the Wolfi mirror. Retry so a
      # mirror 5xx doesn't tank the whole web build.
      - name: Build web image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          TAG: ${{ steps.web-image-ref.outputs.tag }}
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            apko build docker/web/apko.yaml \
              "ghcr.io/aureliolo/synthorg-web:${TAG}" \
              web.tar

      - name: Load image for scanning
        run: |
          docker load -i web.tar
          docker tag "ghcr.io/aureliolo/synthorg-web:sha-${GITHUB_SHA::7}-amd64" "ghcr.io/aureliolo/synthorg-web:sha-${GITHUB_SHA::7}" 2>/dev/null || true

      - name: Compute scan image ref
        id: scan-ref
        run: echo "ref=ghcr.io/aureliolo/synthorg-web:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Report image size
        env:
          SCAN_REF: ${{ steps.scan-ref.outputs.ref }}
        run: scripts/report-image-size.sh "${SCAN_REF}" "Web"

      - name: Install Trivy
        run: |
          curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o "/tmp/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy_checksums.txt
          (cd /tmp && grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

      - name: Trivy scan
        env:
          SCAN_REF: ${{ steps.scan-ref.outputs.ref }}
        run: |
          trivy image "${SCAN_REF}" --format json --output trivy-web.json \
            --exit-code 0 --severity CRITICAL,HIGH --ignorefile .github/.trivyignore.yaml

      - name: Evaluate Trivy results
        run: scripts/evaluate-scan.sh --verbose trivy-web.json "Web"

      - name: Trivy SARIF scan (web)
        if: always()
        env:
          SCAN_REF: ${{ steps.scan-ref.outputs.ref }}
        run: |
          trivy image "${SCAN_REF}" --format sarif --output trivy-web.sarif \
            --exit-code 0 --severity CRITICAL,HIGH --ignorefile .github/.trivyignore.yaml

      - name: Upload SARIF to GitHub Security (web)
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

      - name: CIS Docker Benchmark (web)
        uses: ./.github/actions/cis-scan
        with:
          image-ref: ${{ steps.scan-ref.outputs.ref }}

      # Hand off the loaded multi-arch apko tarball to the publish-only job.
      # The publish job re-loads the tarball into its daemon rather than
      # rebuilding -- apko builds are deterministic, so this saves ~2min
      # and keeps the scanned bytes identical to the pushed bytes.
      - name: Upload web image tarball for publish job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-image-tarball
          path: web.tar
          # 7-day retention so the env-gated `build-web-publish` job can
          # still download after an approval delay.
          retention-days: 7

  build-web-publish:
    name: Publish Web (apko)
    needs: [version, build-web]
    if: >-
      !cancelled() &&
      needs.build-web.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: image-push
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download web image tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-image-tarball
          path: .

      # The apko-built `web.tar` is a multi-arch tarball whose internal
      # tags are `ghcr.io/aureliolo/synthorg-web:sha-<short>-amd64` and
      # `:sha-<short>-arm64` (set by the `apko build` invocation in
      # `build-web`). After `docker load` those are exactly the local
      # tags `publish-image-loaded` expects, so we can hand off
      # directly without any re-tagging.
      - name: Load image
        run: |
          docker load -i web.tar

      # Hand off to the shared publish path. Identical signing and
      # post-sign verification logic as the backend / sandbox / sidecar
      # / fine-tune images, so a future fix lands in one place instead
      # of two.
      - name: Publish image
        id: publish
        uses: ./.github/actions/publish-image-loaded
        with:
          image-name: web
          app-version: ${{ needs.version.outputs.app_version }}
          enable-arm64: "true"
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  build-sandbox:
    name: Build Sandbox
    needs: [version, build-sandbox-base, build-sandbox-base-publish]
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      needs.build-sandbox-base.result == 'success' &&
      (github.event_name == 'pull_request' || needs.build-sandbox-base-publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build and scan sandbox image
        uses: ./.github/actions/build-scan-image
        with:
          image-name: sandbox
          display-name: Sandbox
          dockerfile: docker/sandbox/Dockerfile
          app-version: ${{ needs.version.outputs.app_version }}
          base-image-repo: ghcr.io/aureliolo/synthorg-sandbox-base
          base-image-tag: ${{ needs.build-sandbox-base.outputs.tag }}
          base-image-digest: ${{ needs.build-sandbox-base-publish.outputs.digest }}
          base-image-artifact-name: ${{ needs.build-sandbox-base.outputs.artifact-name }}
          base-image-tarball-name: ${{ needs.build-sandbox-base.outputs.tarball-name }}
          trivy-version: ${{ env.TRIVY_VERSION }}

  build-sandbox-publish:
    name: Publish Sandbox
    needs: [version, build-sandbox]
    if: >-
      !cancelled() &&
      needs.build-sandbox.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: image-push
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Publish sandbox image
        id: publish
        uses: ./.github/actions/publish-image
        with:
          image-name: sandbox
          app-version: ${{ needs.version.outputs.app_version }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  build-sidecar:
    name: Build Sidecar
    needs: [version, build-sidecar-base, build-sidecar-base-publish]
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      needs.build-sidecar-base.result == 'success' &&
      (github.event_name == 'pull_request' || needs.build-sidecar-base-publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build and scan sidecar image
        uses: ./.github/actions/build-scan-image
        with:
          image-name: sidecar
          display-name: Sidecar
          dockerfile: docker/sidecar/Dockerfile
          app-version: ${{ needs.version.outputs.app_version }}
          base-image-repo: ghcr.io/aureliolo/synthorg-sidecar-base
          base-image-tag: ${{ needs.build-sidecar-base.outputs.tag }}
          base-image-digest: ${{ needs.build-sidecar-base-publish.outputs.digest }}
          base-image-artifact-name: ${{ needs.build-sidecar-base.outputs.artifact-name }}
          base-image-tarball-name: ${{ needs.build-sidecar-base.outputs.tarball-name }}
          trivy-version: ${{ env.TRIVY_VERSION }}

  build-sidecar-publish:
    name: Publish Sidecar
    needs: [version, build-sidecar]
    if: >-
      !cancelled() &&
      needs.build-sidecar.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: image-push
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Publish sidecar image
        id: publish
        uses: ./.github/actions/publish-image
        with:
          image-name: sidecar
          app-version: ${{ needs.version.outputs.app_version }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  # Fine-tune ships in two flavors. The matrix builds them in parallel:
  #   - gpu  -> ghcr.io/aureliolo/synthorg-fine-tune-gpu  (bundled CUDA, ~4 GB)
  #   - cpu  -> ghcr.io/aureliolo/synthorg-fine-tune-cpu  (CPU torch, ~1.7 GB)
  # The variant is driven by the FINE_TUNE_EXTRA build-arg; uv routes torch to
  # PyPI (CUDA) or pytorch.org/whl/cpu via [tool.uv.sources] in pyproject.toml.
  # Use a static job name. GitHub normally appends `(variant)` to each
  # matrix leg, so expanded jobs still read "Build Fine-Tune (gpu)" /
  # "(cpu)" in the UI. A `name:` that interpolates `${{ matrix.* }}`
  # leaves the raw template visible when a matrix is skipped *before*
  # expansion (the `if:` evaluates false), producing ugly check-run
  # entries like "Build Fine-Tune (${{ matrix.variant }})".
  build-fine-tune:
    name: Build Fine-Tune
    needs: [version, build-fine-tune-base, build-fine-tune-base-publish]
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      needs.build-fine-tune-base.result == 'success' &&
      (github.event_name == 'pull_request' || needs.build-fine-tune-base-publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gpu
            extra: fine-tune-gpu
          - variant: cpu
            extra: fine-tune-cpu
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build and scan fine-tune image
        uses: ./.github/actions/build-scan-image
        with:
          image-name: fine-tune-${{ matrix.variant }}
          display-name: "Fine-Tune (${{ matrix.variant }})"
          dockerfile: docker/fine-tune/Dockerfile
          app-version: ${{ needs.version.outputs.app_version }}
          base-image-repo: ghcr.io/aureliolo/synthorg-fine-tune-base
          base-image-tag: ${{ needs.build-fine-tune-base.outputs.tag }}
          base-image-digest: ${{ needs.build-fine-tune-base-publish.outputs.digest }}
          base-image-artifact-name: ${{ needs.build-fine-tune-base.outputs.artifact-name }}
          base-image-tarball-name: ${{ needs.build-fine-tune-base.outputs.tarball-name }}
          extra-build-args: |
            FINE_TUNE_EXTRA=${{ matrix.extra }}
          enable-arm64: "false"
          cache-scope: fine-tune-${{ matrix.variant }}
          free-disk-space: "true"
          trivy-version: ${{ env.TRIVY_VERSION }}

  build-fine-tune-publish:
    name: Publish Fine-Tune
    needs: [version, build-fine-tune]
    if: >-
      !cancelled() &&
      needs.build-fine-tune.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gpu
            extra: fine-tune-gpu
          - variant: cpu
            extra: fine-tune-cpu
    environment: image-push
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Fine-tune tarballs are large (~4 GB GPU, ~1.7 GB CPU). Reclaim
      # headroom on the runner before `docker load` doubles the disk
      # usage (archive + daemon copy).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Python
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune --all --force
          df -h /

      - name: Publish fine-tune image
        id: publish
        uses: ./.github/actions/publish-image
        with:
          image-name: fine-tune-${{ matrix.variant }}
          app-version: ${{ needs.version.outputs.app_version }}
          enable-arm64: "false"
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      # Matrix jobs can't expose per-variant outputs to `update-release` via
      # `needs.build-fine-tune-publish.outputs.digest` (only the last matrix
      # run wins). Write the digest to a file and upload it; update-release
      # reads both via the `fine-tune-*-digest` artifact pattern.
      - name: Write digest to file
        if: steps.publish.outputs.digest != ''
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf '%s' "$DIGEST" > "fine-tune-${{ matrix.variant }}.digest"

      - name: Upload digest artifact
        if: steps.publish.outputs.digest != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fine-tune-${{ matrix.variant }}-digest
          path: fine-tune-${{ matrix.variant }}.digest
          retention-days: 1

  # =========================================================================
  # Retag-only jobs -- fire on `push: tags: [v*]` instead of the full
  # build/scan/publish pipeline. Resolve main-run's already-signed
  # manifest list digest for each image from GHCR's `sha-<short>` tag,
  # then apply the version tags via `docker buildx imagetools create`
  # (registry-side; no image bytes move). cosign signs by digest, so the
  # main-run signature carries forward to every new tag ref by
  # construction. Halves CI minutes on releases and eliminates the
  # cross-run race that #1676 surfaced.
  #
  # Base images (`synthorg-{x}-base`) are intentionally NOT retagged on
  # tag-push: they're internal artifacts consumed only by app
  # Dockerfiles via `FROM ...@digest`, so version tags add no consumer
  # value.
  #
  # The per-SHA concurrency group at the top of this workflow queues
  # these jobs behind the main-push run for the same SHA. If main-run
  # failed, the publish-image-retag action's "resolve signed digest"
  # step 404s with an actionable error message.
  # =========================================================================
  retag-backend:
    name: Retag Backend
    needs: [version]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !cancelled() &&
      needs.version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: image-push
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.retag.outputs.digest }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: retag
        uses: ./.github/actions/publish-image-retag
        with:
          image-name: backend
          app-version: ${{ needs.version.outputs.app_version }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  retag-web:
    name: Retag Web
    needs: [version]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !cancelled() &&
      needs.version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: image-push
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.retag.outputs.digest }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: retag
        uses: ./.github/actions/publish-image-retag
        with:
          image-name: web
          app-version: ${{ needs.version.outputs.app_version }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  retag-sandbox:
    name: Retag Sandbox
    needs: [version]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !cancelled() &&
      needs.version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: image-push
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.retag.outputs.digest }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: retag
        uses: ./.github/actions/publish-image-retag
        with:
          image-name: sandbox
          app-version: ${{ needs.version.outputs.app_version }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  retag-sidecar:
    name: Retag Sidecar
    needs: [version]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !cancelled() &&
      needs.version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: image-push
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.retag.outputs.digest }}
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: retag
        uses: ./.github/actions/publish-image-retag
        with:
          image-name: sidecar
          app-version: ${{ needs.version.outputs.app_version }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  # Matrix mirrors `build-fine-tune-publish`: each variant is a separate
  # image repo (`synthorg-fine-tune-gpu`, `synthorg-fine-tune-cpu`) and
  # carries its own signed digest. GitHub Actions matrix jobs cannot
  # expose per-variant `outputs:` (only the last leg's outputs would
  # win), so per-variant digests reach `update-release` via the same
  # `fine-tune-{variant}-digest` artifact pattern the build-publish
  # path uses. `verify-signatures` and `update-release` reference this
  # job by `result` only; consumers needing a per-variant digest read
  # the artifact, not `needs.retag-fine-tune.outputs.*`.
  retag-fine-tune:
    name: Retag Fine-Tune
    needs: [version]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !cancelled() &&
      needs.version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gpu
          - variant: cpu
    environment: image-push
    permissions:
      contents: read
      packages: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The retag itself is registry-side (no bytes move), but the SBOM
      # step inside publish-image-retag runs syft against the image, which
      # pulls the ~4 GB GPU (~1.7 GB CPU) layers to local disk -- both the
      # docker-daemon save and the oci-registry cache. A stock runner's
      # ~14 GB free fills up and syft fails with "no space left on device",
      # so mirror the build path's reclaim before the composite action.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Python
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune --all --force
          df -h /

      - id: retag
        uses: ./.github/actions/publish-image-retag
        with:
          image-name: fine-tune-${{ matrix.variant }}
          app-version: ${{ needs.version.outputs.app_version }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write digest to file
        if: steps.retag.outputs.digest != ''
        env:
          DIGEST: ${{ steps.retag.outputs.digest }}
        run: printf '%s' "$DIGEST" > "fine-tune-${{ matrix.variant }}.digest"

      - name: Upload digest artifact
        if: steps.retag.outputs.digest != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fine-tune-${{ matrix.variant }}-digest
          path: fine-tune-${{ matrix.variant }}.digest
          retention-days: 1

  # Final cross-publish gate. After every publish job has finished
  # (which means in-step verification has already passed for each
  # image+tag locally), confirm one more time that NO concurrent run
  # has overwritten any of our tags between the in-step check and now.
  # The script also catches divergent digests across tags of the same
  # image -- the exact failure mode that left
  # `synthorg-sandbox:0.7.6-dev.9` unsigned despite a green CI run.
  # Run on every main + tag push (not PRs, which never publish).
  verify-signatures:
    name: Verify Image Signatures
    needs:
      - version
      - build-backend-base-publish
      - build-sandbox-base-publish
      - build-sidecar-base-publish
      - build-fine-tune-base-publish
      - build-backend-publish
      - build-web-publish
      - build-sandbox-publish
      - build-sidecar-publish
      - build-fine-tune-publish
      - retag-backend
      - retag-web
      - retag-sandbox
      - retag-sidecar
      - retag-fine-tune
    # Two event paths feed this gate:
    #   - main-push: build-*-publish succeeds, retag-* skipped.
    #   - tag-push: retag-* succeeds, build-*-publish skipped.
    # Either path emits the `pushed-tags-*` artifacts the script
    # consumes. Bases are only in the inventory on main-push (skipped
    # on tag-push by design); the script's per-image divergence check
    # works on whichever scope of tags shows up.
    if: >-
      github.event_name != 'pull_request' &&
      !cancelled() &&
      (
        (github.ref == 'refs/heads/main' &&
          needs.build-backend-publish.result == 'success' &&
          needs.build-web-publish.result == 'success' &&
          needs.build-sandbox-publish.result == 'success' &&
          needs.build-sidecar-publish.result == 'success' &&
          needs.build-fine-tune-publish.result == 'success') ||
        (startsWith(github.ref, 'refs/tags/v') &&
          needs.retag-backend.result == 'success' &&
          needs.retag-web.result == 'success' &&
          needs.retag-sandbox.result == 'success' &&
          needs.retag-sidecar.result == 'success' &&
          needs.retag-fine-tune.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `contents: read` covers checkout for the helper script, and
    # `packages: read` is what the workflow `GITHUB_TOKEN` needs to
    # mint a pull-scoped GHCR token. No write permissions: this job
    # only verifies, never pushes.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Aggregate the (image, tag) inventory directly from the artifacts
      # each publish job emits via its `Write pushed-tag inventory` /
      # `Upload pushed-tag inventory` steps. This avoids re-deriving the
      # metadata-action tag policy in two places (a previous version of
      # this job mirrored the rules locally and risked silent drift on
      # future tag-policy changes).
      - name: Download per-job pushed-tag inventories
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pushed-tags-*
          merge-multiple: true
          path: tag-inventories

      - name: Aggregate pushed-tag inventories
        id: inventory
        run: |
          set -euo pipefail
          if [ ! -d tag-inventories ] || [ -z "$(ls -A tag-inventories 2>/dev/null)" ]; then
            echo "::error::No pushed-tag inventory artifacts found -- the publish jobs did not emit any."
            exit 1
          fi
          cat tag-inventories/*.txt | sort -u > pushed-image-tags.txt
          if [ ! -s pushed-image-tags.txt ]; then
            echo "::error::Aggregated inventory is empty"
            exit 1
          fi
          echo "Pushed inventory:"
          cat pushed-image-tags.txt

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.6"

      - name: Verify cosign signatures for every pushed (image, tag)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Convert the inventory into one --image-tags arg per line so
          # the script can deduplicate tags within an image group.
          ARGS=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            ARGS+=("--image-tags" "$line")
          done < pushed-image-tags.txt
          python3 scripts/check_image_signatures.py "${ARGS[@]}"

  # Append container image references to the GitHub Release (version tags only).
  # On tag-push, retag-* jobs supply the per-image manifest list digest
  # (inherited from main-run's signed digest) and re-emit per-run SBOM
  # artifacts. Build-publish jobs are skipped on tag-push, so we depend
  # exclusively on the retag-* set here.
  update-release:
    name: Update Release Notes
    needs:
      - version
      - retag-backend
      - retag-web
      - retag-sandbox
      - retag-sidecar
      - retag-fine-tune
      - verify-signatures
    if: >-
      startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request' &&
      !cancelled() &&
      needs.retag-backend.result == 'success' &&
      needs.retag-web.result == 'success' &&
      needs.retag-sandbox.result == 'success' &&
      needs.retag-sidecar.result == 'success' &&
      needs.retag-fine-tune.result == 'success' &&
      needs.verify-signatures.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Uses `release-tags` (v*-only, no privileged secrets), not `release`
    # (main-only, holds the `synthorg-repo-bot` App credentials). This
    # job writes release notes via the ambient `GITHUB_TOKEN`, so it
    # does not need the App token.
    environment: release-tags
    permissions:
      contents: write
    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sboms

      - name: Download fine-tune digest artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fine-tune-*-digest
          merge-multiple: true
          path: fine-tune-digests

      - name: Read fine-tune digests
        id: ft-digests
        run: |
          set -euo pipefail
          gpu=$(cat fine-tune-digests/fine-tune-gpu.digest 2>/dev/null || echo "")
          cpu=$(cat fine-tune-digests/fine-tune-cpu.digest 2>/dev/null || echo "")
          if [ -z "$gpu" ] || [ -z "$cpu" ]; then
            echo "::error::Missing fine-tune digest artifact(s): gpu='$gpu' cpu='$cpu'"
            exit 1
          fi
          echo "gpu=${gpu}" >> "$GITHUB_OUTPUT"
          echo "cpu=${cpu}" >> "$GITHUB_OUTPUT"

      - name: Append container images to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BACKEND_DIGEST: ${{ needs.retag-backend.outputs.digest }}
          WEB_DIGEST: ${{ needs.retag-web.outputs.digest }}
          SANDBOX_DIGEST: ${{ needs.retag-sandbox.outputs.digest }}
          SIDECAR_DIGEST: ${{ needs.retag-sidecar.outputs.digest }}
          FINE_TUNE_GPU_DIGEST: ${{ steps.ft-digests.outputs.gpu }}
          FINE_TUNE_CPU_DIGEST: ${{ steps.ft-digests.outputs.cpu }}
        run: |
          set -euo pipefail

          # Validate required inputs
          if [ -z "$TAG" ] || [ -z "$BACKEND_DIGEST" ] || [ -z "$WEB_DIGEST" ] || [ -z "$SANDBOX_DIGEST" ] || [ -z "$SIDECAR_DIGEST" ]; then
            echo "::error::Missing required values: TAG='$TAG' BACKEND_DIGEST='$BACKEND_DIGEST' WEB_DIGEST='$WEB_DIGEST' SANDBOX_DIGEST='$SANDBOX_DIGEST' SIDECAR_DIGEST='$SIDECAR_DIGEST'"
            exit 1
          fi

          # Bounded retry -- Release Please may still be creating the release
          EXISTING=""
          FOUND=0
          for i in $(seq 1 6); do
            if EXISTING=$(gh release view "$TAG" --json body -q '.body // ""' 2>/dev/null); then
              FOUND=1
              break
            fi
            echo "Release '$TAG' not available yet (attempt $i/6), retrying in 10s..."
            sleep 10
          done
          if [ "$FOUND" -ne 1 ]; then
            # A dev pre-release can be swept by a concurrent stable
            # finalize-release cleanup before this slow retag+sign chain
            # reaches here. With nothing to attach to, skip rather than
            # red the run -- finalize-release.yml likewise skip-publishes a
            # tag with no draft. Only dev tags are swept; a missing release
            # for a real / rc / alpha / beta tag is a genuine error.
            case "$TAG" in
              *-dev.*)
                echo "::warning::Dev pre-release '$TAG' not found after 6 attempts -- likely swept by a concurrent stable finalize-release cleanup. Skipping release-notes update."
                exit 0
                ;;
              *)
                echo "::error::GitHub release '$TAG' not available after 6 attempts"
                exit 1
                ;;
            esac
          fi

          IMAGES=$(cat <<'BLOCK'

          ## Container Images

          All images are signed with [cosign](https://docs.sigstore.dev/cosign/overview/) (keyless via GitHub OIDC), attested with [SLSA Level 3](https://slsa.dev/spec/v1.0/levels) build provenance, and include CycloneDX SBOMs.

          ### Pull

          | Image | Command |
          |-------|---------|
          | Backend | `docker pull ghcr.io/aureliolo/synthorg-backend:VERSION_PH` |
          | Web | `docker pull ghcr.io/aureliolo/synthorg-web:VERSION_PH` |
          | Sandbox | `docker pull ghcr.io/aureliolo/synthorg-sandbox:VERSION_PH` |
          | Sidecar | `docker pull ghcr.io/aureliolo/synthorg-sidecar:VERSION_PH` |
          | Fine-Tune (GPU) | `docker pull ghcr.io/aureliolo/synthorg-fine-tune-gpu:VERSION_PH` |
          | Fine-Tune (CPU) | `docker pull ghcr.io/aureliolo/synthorg-fine-tune-cpu:VERSION_PH` |

          ### Digest Pins

          Pin to these digests in production for reproducible deployments:

          | Image | Digest |
          |-------|--------|
          | Backend | `BACKEND_DIGEST_PH` |
          | Web | `WEB_DIGEST_PH` |
          | Sandbox | `SANDBOX_DIGEST_PH` |
          | Sidecar | `SIDECAR_DIGEST_PH` |
          | Fine-Tune (GPU) | `FINE_TUNE_GPU_DIGEST_PH` |
          | Fine-Tune (CPU) | `FINE_TUNE_CPU_DIGEST_PH` |

          ### Supply Chain

          <details>
          <summary>Verify signatures (cosign)</summary>

          ```bash
          # Verify any image -- replace IMAGE and DIGEST:
          cosign verify ghcr.io/aureliolo/synthorg-IMAGE@DIGEST \
            --certificate-identity-regexp='github\.com/Aureliolo/synthorg' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com'
          ```
          </details>

          <details>
          <summary>Verify SLSA provenance (gh CLI)</summary>

          ```bash
          gh attestation verify oci://ghcr.io/aureliolo/synthorg-backend@BACKEND_DIGEST_PH -R Aureliolo/synthorg
          gh attestation verify oci://ghcr.io/aureliolo/synthorg-web@WEB_DIGEST_PH -R Aureliolo/synthorg
          gh attestation verify oci://ghcr.io/aureliolo/synthorg-sandbox@SANDBOX_DIGEST_PH -R Aureliolo/synthorg
          gh attestation verify oci://ghcr.io/aureliolo/synthorg-sidecar@SIDECAR_DIGEST_PH -R Aureliolo/synthorg
          gh attestation verify oci://ghcr.io/aureliolo/synthorg-fine-tune-gpu@FINE_TUNE_GPU_DIGEST_PH -R Aureliolo/synthorg
          gh attestation verify oci://ghcr.io/aureliolo/synthorg-fine-tune-cpu@FINE_TUNE_CPU_DIGEST_PH -R Aureliolo/synthorg
          ```
          </details>

          <details>
          <summary>SBOMs (CycloneDX JSON)</summary>

          Attached to this release as artifacts:
          \`sbom-backend.cdx.json\` | \`sbom-web.cdx.json\` | \`sbom-sandbox.cdx.json\` | \`sbom-sidecar.cdx.json\` | \`sbom-fine-tune-gpu.cdx.json\` | \`sbom-fine-tune-cpu.cdx.json\`
          </details>
          BLOCK
          )
          # Substitute placeholders (strip leading 'v' from tag for image tags)
          IMAGES=${IMAGES//VERSION_PH/${TAG#v}}
          IMAGES=${IMAGES//BACKEND_DIGEST_PH/$BACKEND_DIGEST}
          IMAGES=${IMAGES//WEB_DIGEST_PH/$WEB_DIGEST}
          IMAGES=${IMAGES//SANDBOX_DIGEST_PH/$SANDBOX_DIGEST}
          IMAGES=${IMAGES//SIDECAR_DIGEST_PH/$SIDECAR_DIGEST}
          IMAGES=${IMAGES//FINE_TUNE_GPU_DIGEST_PH/$FINE_TUNE_GPU_DIGEST}
          IMAGES=${IMAGES//FINE_TUNE_CPU_DIGEST_PH/$FINE_TUNE_CPU_DIGEST}

          # Upload container SBOMs to the draft release
          if ls sboms/sbom-*.cdx.json 1>/dev/null 2>&1; then
            gh release upload "$TAG" --clobber sboms/sbom-*.cdx.json
            echo "Container SBOMs uploaded to release."
          else
            echo "::warning::No SBOM files found in sboms/ directory"
          fi

          # Idempotent: strip existing Container Images section before appending.
          # Uses awk to delete only this section (up to the next ## heading), not to EOF.
          CLEANED=$(echo "$EXISTING" | awk '/^## Container Images$/{skip=1; next} /^## /{skip=0} !skip')
          gh release edit "$TAG" --notes "${CLEANED}${IMAGES}"
