name: Release runner setup
description: >-
  Shared setup for workflows that mint signed commits as `synthorg-repo-bot`.
  Primary callers are the release-pipeline workflows (release.yml,
  dev-release.yml, auto-rollover.yml, graduate.yml); cla.yml's signature-
  recording job uses the same composite to satisfy the default ruleset's
  required_signatures rule on the cla-signatures branch (see #1633).
  Asserts the triggering ref is refs/heads/main and mints a short-lived
  installation token for the `synthorg-repo-bot` GitHub App. The minted
  token is exposed on the `token` output so downstream steps can use it
  for API calls that produce signed commits AND fire downstream workflows;
  the two constraints PAT + GITHUB_TOKEN could not satisfy together. See
  docs/reference/github-environments.md#release_bot_app_ for provisioning.

  Callers MUST have checked out the repository before invoking this composite;
  the action.yml file needs to exist on the runner's disk. Every current
  caller already performs its own checkout (with per-workflow `fetch-depth`
  semantics), so this composite deliberately does not include one.

inputs:
  # IMPORTANT: input descriptions deliberately do NOT use ${{ ... }}
  # syntax, even for documentation examples. GitHub Actions evaluates
  # every expression in this file at template-load time; composite
  # actions cannot access the ``secrets`` context, so any stray
  # ``${{ secrets.X }}`` in a description (even as a usage hint)
  # fails the whole action with "Unrecognized named-value: 'secrets'"
  # and breaks every caller. See https://docs.github.com/en/actions/
  # sharing-automations/creating-actions/metadata-syntax-for-github-actions:
  # composite actions only see ``inputs``, ``steps``, ``env``,
  # ``github``, ``runner``, ``job``, and ``matrix`` contexts.
  client-id:
    description: "GitHub App Client ID (the Iv23... string shown on the App's settings page). Callers typically pass secrets.RELEASE_BOT_APP_CLIENT_ID (the secret lives on the release deployment environment). The older actions/create-github-app-token input `app-id` accepted the numeric App ID; v3.1 deprecated that in favour of `client-id`, so we pass `client-id` through directly."
    required: true
  app-private-key:
    description: "GitHub App private key in PEM format. Callers typically pass secrets.RELEASE_BOT_APP_PRIVATE_KEY."
    required: true
  validate-branch:
    description: "When 'true', assert $GITHUB_REF == 'refs/heads/main' before minting the token. Every current caller sets this implicitly to true; the input exists so a future workflow_dispatch-based caller can opt out."
    required: false
    default: "true"
  # Per-permission scope passthroughs to actions/create-github-app-token.
  # Each caller declares the narrowest scope its token use needs, rather than
  # the composite handing out the union. Empty default means "do not request
  # this permission" -- the action treats `permission-*: ''` as omitted, so
  # the minted token will not carry that scope. zizmor 1.25's `github-app`
  # audit requires at least one explicit `permission-*` input on every
  # `actions/create-github-app-token` callsite. Add more passthroughs here
  # (permission-issues, permission-statuses, etc.) when a future caller
  # needs them; only the three currently used across callers are exposed.
  permission-contents:
    description: "Contents scope for the minted token. One of 'read' / 'write' / '' (unset). 'write' is required to push tags, refs, blobs, trees, or commits via the App identity."
    required: false
    default: ""
  permission-pull-requests:
    description: "Pull-requests scope for the minted token. One of 'read' / 'write' / '' (unset). 'write' is required for gh pr create / gh pr merge / PR comment under the App identity."
    required: false
    default: ""
  permission-metadata:
    description: "Metadata scope for the minted token. One of 'read' / 'write' / '' (unset). 'read' is sufficient for read-only API surfaces like the rulesets endpoint."
    required: false
    default: ""

outputs:
  token:
    description: "Minted App installation token. Reference via steps.<id>.outputs.token in downstream steps."
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Validate trigger branch
      if: inputs.validate-branch == 'true'
      shell: bash
      run: |
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "::error::Release workflow must only run on refs/heads/main, got: $GITHUB_REF"
          exit 1
        fi

    # A missing RELEASE_BOT_APP_CLIENT_ID / RELEASE_BOT_APP_PRIVATE_KEY secret
    # fails this step fast with an informative error, so callers do not
    # need a separate preflight. App-token-authored API commits are
    # GitHub-signed (verify via `gh api .../commits/<sha> --jq
    # '.commit.verification'` -> expect `verified: true, reason: "valid"`)
    # AND trigger downstream workflows.
    - name: Mint release-bot App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        # Single-repo install -- the App must be installed on exactly
        # this repo. `owner` + `repositories` together pin the
        # installation lookup; without them the action walks every
        # installation the App is authorised for, which opens the door
        # to token minting for a forked install if one is ever created.
        # `repositories` is a literal value (not `${{ github.event.repository.name }}`)
        # so zizmor's `github-app` audit can statically verify the scope
        # is narrow; the dynamic expression would otherwise be flagged
        # as "token granted access to all repositories for this owner".
        # Every caller of this composite is fork-gated at the workflow
        # level, so this composite never executes outside synthorg.
        owner: ${{ github.repository_owner }}
        repositories: synthorg
        # Per-call scope passthrough: empty values mean the action skips
        # requesting that permission, so the minted token carries exactly
        # the union of what each caller declares.
        permission-contents: ${{ inputs.permission-contents }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-metadata: ${{ inputs.permission-metadata }}
