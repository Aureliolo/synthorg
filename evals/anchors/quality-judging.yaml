# Hand-scored calibration anchors for the ``quality-judging`` rubric.
#
# Five anchors spanning degraded -> competent appraisal_accuracy.
rubric_id: quality-judging
anchor_set_version: 1
items:
  - anchor_id: anchor-fooled
    output: >-
      The review praised the polish and signed off; the subtle flaw shipped
      unflagged.
    hand_scores:
      appraisal_accuracy: 0.0
  - anchor_id: anchor-vague
    output: >-
      The review raised a generic doubt but never located the actual flaw, so
      the verdict was right by accident, not analysis.
    hand_scores:
      appraisal_accuracy: 0.25
  - anchor_id: anchor-hedged
    output: >-
      The review found the flawed area but mis-characterised the cause, landing
      a borderline verdict.
    hand_scores:
      appraisal_accuracy: 0.5
  - anchor_id: anchor-accurate
    output: >-
      The review located the flaw and graded it correctly, with a minor
      over-statement of its severity.
    hand_scores:
      appraisal_accuracy: 0.75
  - anchor_id: anchor-precise
    output: >-
      The review pinpointed the flaw, explained its impact, and returned a
      verdict that tracked real quality despite the surface polish.
    hand_scores:
      appraisal_accuracy: 1.0
