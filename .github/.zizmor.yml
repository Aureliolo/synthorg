rules:
  # Daily Renovate updates are intentional -- see CLAUDE.md and renovate.json.
  # The project uses daily checks with grouped updates per domain to stay current.
  dependabot-cooldown:
    disable: true

  dangerous-triggers:
    ignore:
      # pull_request_target is required for CLA enforcement (needs write
      # access to commit signatures). Mitigated: the pull_request_target job
      # (cla-check) checks out nothing at all, and no untrusted input reaches
      # a run: step. The file's only checkout belongs to cla-sign, which
      # triggers on issue_comment and pins ref: main.
      - repo-cla.yml
