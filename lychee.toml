# Lychee link-checker config. One source of truth, consumed two ways:
#
#   - .github/workflows/lychee.yml (PR/push gate) and the local
#     pre-push hook in .pre-commit-config.yaml (id: lychee) run lychee
#     `--offline`: internal links only (relative + file://), so a
#     third-party host's downtime or expired certificate can never
#     block a merge or a push.
#   - .github/workflows/lychee-external.yml (weekly) runs online and
#     applies the strict network tuning below to remote links, filing
#     a tracking issue on rot instead of blocking.
#
# Ad-hoc local invocations should also pass `--config lychee.toml`.
#
# Strictness preset: STRICT. Every non-200 response counts as link rot.
# Per-host pacing keeps the strict run polite. These network settings
# apply to the weekly online run; the offline gate makes no network
# probes and ignores them.

# Local on-disk cache (.lycheecache, gitignored). Only repeated manual
# local online runs benefit from it: the offline gate makes no requests,
# and the weekly online workflow has no cache restore/save step, so the
# cache has no cross-run effect in CI.
cache = true
max_cache_age = "1d"

# Network. Strict tuning: max signal, low patience.
max_concurrency = 32
max_retries = 1
retry_wait_time = 1
timeout = 10

# Treat ONLY 200 OK as success. A non-OK response is a real link-rot
# signal worth surfacing in the weekly external report.
accept = ["200"]

# Mail links are not real HTTP targets and lychee SMTP probing is noisy
# on shared hosts. The schema spells this as `include_mail = false`,
# which is also the default; left explicit so the intent is locally
# inspectable.
include_mail = false

# Excludes apply to the weekly online run; the offline gate makes no
# network probes. Loopback + placeholder hosts referenced only as
# examples in docs, plus upstream hosts that reject lychee's HTTP client
# (anti-bot 403) or rate limit aggressively (429). These are NOT link
# rot -- the URLs are real and resolvable in a normal browser -- so
# excluding here keeps the weekly report from filing bogus issues.
exclude = [
    '^https?://localhost',
    '^https?://127\.0\.0\.1',
    '^https?://0\.0\.0\.0',
    '^https?://example\.com',
    '^https?://example\.org',
    '^https?://my-instance\.example\.com',
    # Anti-bot: returns 403 to lychee's UA; live URL works in a browser.
    '^https?://medium\.com/',
    '^https?://platform\.openai\.com/',
    # DeepSeek's login-gated developer console answers lychee's HEAD/UA with
    # 403 (a browser GET returns a 202 challenge); the console is real and
    # reachable for any signed-in user. Same anti-bot shape as the platforms
    # above.
    '^https?://platform\.deepseek\.com/',
    # Cloudflare dashboard requires login (always 403 to unauthenticated
    # HEAD probes); the URL is real and reachable for any logged-in user
    # following the fork-setup guide.
    '^https?://dash\.cloudflare\.com/',
    # Rate-limiter is unfriendly to one-shot HEAD probes; the docs are
    # always reachable through a browser. Lychee's per-host retry budget
    # is set to 1 by the strict preset, so a single 429 fails the run.
    '^https?://www\.gnu\.org/',
    # docs.sigstore.dev intermittently times out under the strict 10s
    # ceiling; the cosign documentation is canonical and live in a
    # browser, just slow to respond to lychee's HEAD probe.
    '^https?://docs\.sigstore\.dev/',
    # slsa.dev serves the canonical SLSA Level 3 badge (README header)
    # but intermittently exceeds the 10s probe budget; the badge image
    # loads fine in a browser. Same shape as docs.sigstore.dev above.
    '^https?://slsa\.dev/',
    # fast-check.dev (canonical fast-check homepage, linked from
    # docs/reference/claude-reference.md as the React property-testing
    # cross-language equivalent) intermittently fails the strict 10s
    # probe with a connection error; the URL is real and resolves in a
    # browser. Same shape as docs.sigstore.dev / slsa.dev above.
    '^https?://fast-check\.dev(/|$)',
    # Build-time artefacts referenced from docs/openapi/index.md. The
    # schema JSON and the Scalar reference HTML are generated by
    # `zensical build` (and exposed at runtime by Litestar at
    # /docs/openapi.json + /docs/api); they do not exist as files in
    # the source tree, so lychee resolves the relative links as missing
    # file:// URLs. The build pipeline + Litestar integration tests
    # already guard their correctness.
    '^file://.*docs/openapi/openapi\.json$',
    '^file://.*docs/openapi/reference\.html$',
]
