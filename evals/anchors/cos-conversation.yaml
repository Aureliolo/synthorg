# Hand-scored calibration anchors for the ``cos-conversation`` rubric.
#
# Five anchors spanning degraded -> competent proposal_clarity.
rubric_id: cos-conversation
anchor_set_version: 1
items:
  - anchor_id: anchor-misread
    output: >-
      The proposal misread the request, scoped the wrong work, and routed it to
      an unrelated role.
    hand_scores:
      proposal_clarity: 0.0
  - anchor_id: anchor-unclarified
    output: >-
      The proposal restated the ambiguity without resolving it and left routing
      to chance.
    hand_scores:
      proposal_clarity: 0.25
  - anchor_id: anchor-rough
    output: >-
      The proposal scoped roughly the right work and routed plausibly, but the
      narrative claimed more than the run actually did.
    hand_scores:
      proposal_clarity: 0.5
  - anchor_id: anchor-clear
    output: >-
      The proposal was clearly scoped and well routed, with the narrative
      slightly overstating one outcome.
    hand_scores:
      proposal_clarity: 0.75
  - anchor_id: anchor-crisp
    output: >-
      The proposal resolved the ambiguity into a crisp, correctly-scoped item,
      routed it to the right role, and narrated only what the record supports.
    hand_scores:
      proposal_clarity: 1.0
