version: "2"

run:
  go: "1.26"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - bodyclose
    - errname
    - errorlint
    - noctx
    - prealloc
    - unconvert
    - unparam
    # Structural-complexity checks that catch overgrown functions
    # and deep nested control flow.
    - gocyclo
    - funlen
    - gocognit
    - nestif
    - revive
  settings:
    gocyclo:
      min-complexity: 10
    funlen:
      lines: 80
      statements: 60
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: unused-parameter
        - name: unused-receiver
        - name: confusing-naming
        - name: cognitive-complexity
          arguments: [15]
  exclusions:
    # Absorb existing CLI complexity via path-scoped exclusions. The
    # complexity linters (gocyclo, funlen, gocognit, nestif, revive
    # cognitive-complexity / unused-receiver) catch shapes the existing
    # CLI carries. The rules still apply to any new package not listed
    # below. Table tests and OS-conditional branches in test files are
    # excluded from all five complexity rules: signal lives in
    # production code, not in test data enumeration.
    rules:
      - path: '_test\.go$'
        linters: [gocyclo, funlen, gocognit, nestif, revive]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
