name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Path filter: detect which domains changed ──
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      docker: ${{ steps.filter.outputs.docker }}
      doc_claims: ${{ steps.filter.outputs.doc_claims }}
      runtime_stats: ${{ steps.filter.outputs.runtime_stats }}
      # release-please PRs only touch CHANGELOG.md, version.txt, and
      # the manifest. There is no source code to test, so every heavy
      # job below short-circuits on this flag and ci-pass posts success
      # immediately.
      #
      # SECURITY: branch names alone are NOT sufficient -- on a
      # `pull_request` event from a fork, `github.head_ref` is the
      # source ref name, which is fully attacker-controlled. A fork PR
      # named `release-please--evil` would otherwise short-circuit CI
      # and post a green CI Pass with no real testing. We therefore
      # gate the pull_request arm on the PR author identity (set by
      # GitHub at PR creation, not bypassable via branch naming) and
      # only fall back to ref-name detection for push / dispatch
      # events, where pushing `refs/heads/release-please--*` already
      # requires push access to the upstream.
      is_release_please: ${{ (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'synthorg-repo-bot[bot]') || (github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/release-please--')) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              # WS_PROTOCOL_VERSION parity gate runs in Lint; it must
              # also fire on TS-only bumps so an out-of-sync constant
              # cannot land without the gate noticing.
              - 'web/src/utils/constants.ts'
            dashboard:
              - 'web/**'
              - 'src/synthorg/api/**'
              - 'src/synthorg/core/**'
              - 'scripts/export_openapi.py'
              - 'scripts/generate_dto_types_ts.py'
              - 'scripts/check_dto_types_ts_in_sync.py'
              - 'docs/openapi/openapi.json'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - 'web/src/api/types/openapi.gen.ts'
              - 'web/src/api/types/dtos.gen.ts'
              - 'web/src/api/types/enum-values.gen.ts'
            docker:
              - 'docker/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            # Files whose claims are guarded by the doc-drift gate. Docs-only
            # PRs that touch one of these (and nothing in `python:`) still need
            # the gate to run, otherwise a stale "100+" claim could ship.
            doc_claims:
              - 'docs/design/observability.md'
              - 'docs/design/agent-execution.md'
              - 'docs/research/control-plane-audit.md'
              - 'docs/research/acg-formalism-evaluation.md'
              - 'src/synthorg/observability/events/**'
              - 'scripts/check_doc_drift_counts.py'
            # Trigger the runtime_stats freshness gate when the YAML or
            # the gate / generator change. YAML-only edits would not
            # match the `python:` filter, so without this a manual seed
            # could land without the freshness check running.
            runtime_stats:
              - 'data/runtime_stats.yaml'
              - 'scripts/check_runtime_stats_freshness.py'
              - 'scripts/generate_runtime_stats.py'

  # ── Python: Lint ──
  lint:
    name: Lint
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Forbidden literals gate (src/synthorg)
        run: uv run python scripts/check_forbidden_literals.py

      - name: Persistence boundary gate (src/ + tests/)
        run: >-
          uv run python scripts/check_persistence_boundary.py
          --repo-root "${{ github.workspace }}"

      - name: Settings → startup wiring trace (ghost-wired settings gate)
        run: >-
          uv run python scripts/check_setting_to_startup_trace.py
          --repo-root "${{ github.workspace }}"

      - name: Dual-backend test parity gate (conformance + protocols)
        run: >-
          uv run python scripts/check_dual_backend_test_parity.py
          --repo-root "${{ github.workspace }}"

      - name: Cost-recording chokepoint gate
        run: uv run python scripts/check_provider_complete_chokepoint.py

      - name: Typed-boundary contract gate (RFC #1711)
        run: uv run python scripts/check_boundary_typed.py

      - name: WS_PROTOCOL_VERSION parity gate (Python <-> TypeScript)
        run: uv run python scripts/check_ws_protocol_version_in_sync.py

      - name: Dead API endpoints gate (frontend ↔ backend route parity)
        run: >-
          uv run python scripts/check_dead_api_endpoints.py
          --repo-root "${{ github.workspace }}"

      - name: Schema-drift gate (SQLite vs Postgres parity)
        run: uv run python scripts/check_schema_drift.py

      - name: Review-origin / issue-backref gate (src/ + tests/)
        run: uv run python scripts/check_no_review_origin_in_code.py

      - name: Migration-framing / phase-N gate (src/ + tests/)
        run: uv run python scripts/check_no_migration_framing.py

      - name: Long-running-loop kill-switch gate (src/synthorg)
        run: uv run python scripts/check_long_running_loops_have_kill_switch.py

  # ── Runtime Stats Freshness ──
  # Fails the build when data/runtime_stats.yaml has drifted (any
  # stats.<name>.raw differs from a freshly-fetched value) or when
  # last_generated_utc is older than the 14-day ceiling. Runs on python
  # OR runtime_stats so a YAML-only edit (e.g. a manual seed) still
  # triggers the gate.
  runtime-stats-freshness:
    name: Runtime Stats Freshness Gate
    needs: changes
    if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.runtime_stats == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Check runtime_stats freshness
        env:
          # `gh release list` / `gh api` calls inside the generator's
          # fetchers need an authenticated token; GITHUB_TOKEN is
          # sufficient for the public-repo metadata they read.
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_runtime_stats_freshness.py

  # ── Docs: Doc-claim drift gate ──
  # Runs on python OR doc_claims so a docs-only PR that bumps a guarded
  # claim (eg "100+ event constant modules") still triggers the gate.
  doc-drift:
    name: Doc Drift Gate
    needs: changes
    if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.doc_claims == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Doc count drift gate (event modules)
        run: uv run python scripts/check_doc_drift_counts.py

  # ── Schema: Drift Validation ──
  schema-validate:
    name: Schema Validation
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Enforce at most one new revision per PR
        if: github.event_name == 'pull_request'
        env:
          GH_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$GH_BASE_REF" --depth=1
          base_ref="origin/$GH_BASE_REF"
          mapfile -t new_revs < <(
            git diff --name-only --diff-filter=A "$base_ref"...HEAD -- \
              'src/synthorg/persistence/sqlite/revisions/*.sql' \
              'src/synthorg/persistence/postgres/revisions/*.sql'
          )
          sqlite_count=0
          postgres_count=0
          for rev in "${new_revs[@]}"; do
            case "$rev" in
              src/synthorg/persistence/sqlite/revisions/*.sql) ((sqlite_count++)) ;;
              src/synthorg/persistence/postgres/revisions/*.sql) ((postgres_count++)) ;;
            esac
          done
          if [ "$sqlite_count" -gt 1 ] || [ "$postgres_count" -gt 1 ]; then
            echo "::error::PR adds too many new revision files (sqlite=$sqlite_count, postgres=$postgres_count). Policy allows at most one per backend."
            printf '  - %s\n' "${new_revs[@]}" >&2
            echo "" >&2
            echo "Consolidate by deleting in-progress revisions and authoring a single new revision per backend." >&2
            exit 1
          fi
          echo "OK: PR adds sqlite=$sqlite_count, postgres=$postgres_count new revision(s) (limit 1 each)."

      - name: SQLite drift detection
        run: uv run python scripts/check_schema_drift_revisions.py --backend sqlite

  # ── Python: Type Check ──
  type-check:
    name: Type Check
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: mypy
        run: uv run mypy --num-workers=4 src/ tests/

  # ── Python: OpenAPI Liveness ──
  openapi-liveness:
    name: OpenAPI Liveness
    needs: changes
    if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Assert OpenAPI export is deterministic and complete
        run: uv run python scripts/check_openapi_liveness.py

  # ── Python: Test (Unit) ──
  # Fast-signal arm: -m unit, no Docker, no Postgres. Lands first (~3 min)
  # so a trivial unit break is red long before the integration / e2e
  # testcontainer tax is paid. Collects coverage only (no per-suite gate,
  # no Codecov upload); the 80% gate runs once on the combined aggregate
  # in test-coverage-aggregate.
  test-unit:
    name: Test Unit
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      COVERAGE_FILE: .coverage.unit
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      # --cov-fail-under=0 overrides pyproject's [tool.coverage.report]
      # fail_under=80, which pytest-cov otherwise applies at end-of-session
      # even with an empty --cov-report=. A single marker slice never reaches
      # 80% alone; the gate belongs solely to test-coverage-aggregate. Every
      # per-suite arm below carries the same override for the same reason.
      - name: Run unit tests
        run: |
          uv run python -m pytest tests/ \
            -m unit \
            -n auto \
            --cov=synthorg \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml=junit-unit.xml \
            --durations=20 \
            --durations-min=1.0

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-unit
          path: .coverage.unit*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-unit
          path: junit-unit.xml

  # ── Python: Test (Integration) ──
  test-integration:
    name: Test Integration
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COVERAGE_FILE: .coverage.integration
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      # The backup-conformance suite shells out to ``pg_dump`` and
      # ``pg_restore`` against a postgres:18-alpine testcontainer; both
      # tools must be the same major version or newer than the server.
      # The Ubuntu runner image ships an older postgresql-client by
      # default, and the ``/usr/bin/pg_restore`` shim from
      # ``postgresql-common`` does not always dispatch to the newest
      # installed client when reading a dump file (it fell back to v16
      # and rejected the 1.16 dump format produced by pg_dump 18).
      # Install postgresql-client-18 from the PGDG apt repo and prepend
      # ``/usr/lib/postgresql/18/bin`` to ``$GITHUB_PATH`` so the test
      # step calls v18 binaries directly without going through the
      # version-dispatch shim.
      - name: Install PostgreSQL 18 client (pg_dump / pg_restore)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: Postgres drift detection
        run: uv run python scripts/check_schema_drift_revisions.py --backend postgres

      - name: Run integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: |
          uv run python -m pytest tests/ \
            -m integration \
            -n auto \
            --cov=synthorg \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml=junit-integration.xml \
            --durations=20 \
            --durations-min=1.0

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-integration
          path: .coverage.integration*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-integration
          path: junit-integration.xml

  # ── Python: Test (E2E) ──
  test-e2e:
    name: Test E2E
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COVERAGE_FILE: .coverage.e2e
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      # E2E exercises the full system including the Postgres path, so it
      # needs the same v18 client setup as the integration arm. See the
      # integration job for the rationale on the PGDG client install.
      - name: Install PostgreSQL 18 client (pg_dump / pg_restore)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: Postgres drift detection
        run: uv run python scripts/check_schema_drift_revisions.py --backend postgres

      - name: Run e2e tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: |
          uv run python -m pytest tests/ \
            -m e2e \
            -n auto \
            --cov=synthorg \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml=junit-e2e.xml \
            --durations=20 \
            --durations-min=1.0

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-e2e
          path: .coverage.e2e*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-e2e
          path: junit-e2e.xml

  # ── Python: Test (Conformance, SQLite arm) ──
  # No-Docker SQLite-only slice of the dual-backend persistence
  # conformance suite, so the lowest-cost backend is always exercised
  # early even when the Postgres testcontainer infra is flaky. The
  # ``backend`` fixture is parametrised ["sqlite", "postgres"]; -k "not
  # postgres" deselects the postgres ids so the container fixture is
  # never triggered. The full dual-backend conformance still runs inside
  # test-integration via -m integration.
  test-conformance-sqlite:
    name: Test Conformance (SQLite)
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      COVERAGE_FILE: .coverage.conformance-sqlite
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Run SQLite conformance tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: |
          uv run python -m pytest tests/conformance/persistence \
            -m integration \
            -k "not postgres" \
            -n auto \
            --cov=synthorg \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml=junit-conformance-sqlite.xml \
            --durations=20 \
            --durations-min=1.0

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-conformance-sqlite
          path: .coverage.conformance-sqlite*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-conformance-sqlite
          path: junit-conformance-sqlite.xml

  # ── Python: Test Coverage Aggregate ──
  # The single, airtight 80% gate. Runs only when all four test arms
  # succeed (default needs semantics, no if: always()), so coverage is
  # never computed on partial data. Codecov stays best-effort and is
  # never the gate; ``coverage report --fail-under=80`` is.
  test-coverage-aggregate:
    name: Test Coverage Aggregate
    needs: [changes, test-unit, test-integration, test-e2e, test-conformance-sqlite]
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required for tokenless Codecov upload via use_oidc: true.
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: test-results-*
          merge-multiple: true
          path: test-results

      # Hard no-missed-coverage assertion. Every split arm MUST have
      # contributed a data file before the gate runs; a silently dropped
      # suite would shrink the report yet could still clear --fail-under
      # on the remaining suites (a false green). Fail loudly instead.
      - name: Assert all suites contributed coverage
        run: |
          set -euo pipefail
          missing=""
          for suite in unit integration e2e conformance-sqlite; do
            if ! compgen -G "coverage-data/.coverage.${suite}*" > /dev/null; then
              missing="${missing} ${suite}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Missing coverage data for suite(s):${missing}. Refusing to compute the 80% gate on partial data."
            ls -la coverage-data || true
            exit 1
          fi
          echo "All four suites contributed coverage data."

      - name: Combine coverage
        run: uv run coverage combine coverage-data

      - name: Enforce 80% aggregate coverage gate
        run: uv run coverage report --show-missing --fail-under=80

      - name: Generate combined coverage XML
        run: uv run coverage xml -o coverage.xml

      # Codecov upload is best-effort -- CI must not fail on Codecov
      # outages. The 80% enforcement above is Codecov-independent. This
      # is the ONLY Codecov coverage upload in the workflow: one combined
      # report, so the Codecov project view is never fragmented across
      # partial per-suite uploads. Tokenless OIDC (public repo).
      - name: Upload combined coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: test-results/junit-unit.xml,test-results/junit-integration.xml,test-results/junit-e2e.xml,test-results/junit-conformance-sqlite.xml
          fail_ci_if_error: false
          report_type: test_results
          use_oidc: true

      - name: Upload combined coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-combined
          path: |
            coverage.xml
            .coverage
          include-hidden-files: true

  # ── Python: Security Audit ──
  python-audit:
    name: Python Security Audit
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: pip-audit
        # Ignored vulnerabilities (revisit whenever upstream publishes a fix):
        # - GHSA-xqmj-j6mv-4862: litellm 1.83.0 is pinned by project decision;
        #   fix is in 1.83.7 but the pin is load-bearing for this repo.
        # - CVE-2026-3219: pip 26.0.1 vulnerability with no upstream fix
        #   version available yet. pip is a transitive of uv in this repo.
        # - PYSEC-2026-89 (CVE-2025-69534): markdown 3.10.2 (latest)
        #   HTMLParser AssertionError on malformed input. markdown is a
        #   mkdocs transitive dep used only at docs-build time on our own
        #   trusted documentation; the framework runtime never processes
        #   attacker-controlled Markdown, so the exposure surface is nil.
        # - PYSEC-2025-183 (CVE-2025-45768): pyjwt 2.12.1 (latest) weak
        #   encryption advisory is DISPUTED by the supplier because the
        #   key length is chosen by the caller; we provide strong keys
        #   at every JWT site, so the advisory is inapplicable here.
        run: |
          uv run pip-audit \
            --ignore-vuln GHSA-xqmj-j6mv-4862 \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln PYSEC-2026-89 \
            --ignore-vuln PYSEC-2025-183

  # ── Docker: Dockerfile Lint ──
  dockerfile-lint:
    name: Dockerfile Lint
    needs: changes
    if: (needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: docker/backend/Dockerfile

      - name: Lint sandbox Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: docker/sandbox/Dockerfile

  # ── Dashboard: Lint ──
  dashboard-lint:
    name: Dashboard Lint
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web

  # ── Dashboard: Type Check ──
  dashboard-type-check:
    name: Dashboard Type Check
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Python + uv (OpenAPI export)
        uses: ./.github/actions/setup-python-uv
      - name: Export OpenAPI schema for type codegen
        run: uv run python scripts/export_openapi.py
      - run: npm ci
        working-directory: web
      - run: npm run type-check
        working-directory: web

  # ── Dashboard: Test ──
  dashboard-test:
    name: Dashboard Test
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Python + uv (OpenAPI export)
        uses: ./.github/actions/setup-python-uv
      - name: Export OpenAPI schema for type codegen
        run: uv run python scripts/export_openapi.py
      - run: npm ci
        working-directory: web
      - name: Run Vitest (active-handle detection is part of the test run)
        working-directory: web
        env:
          # Disable colour output so the active-handle reporter's summary
          # lands as plain ASCII in CI logs (helpful for downstream
          # log-scrapers and the on-failure artifact upload).
          NO_COLOR: '1'
          # Pin the active-handle gate's mode explicitly so a shell
          # default of ACTIVE_HANDLE_MODE=log on the runner cannot
          # silently downgrade the gate from blocking to advisory.
          ACTIVE_HANDLE_MODE: 'fail'
        run: npm run test -- --coverage
      - name: Upload active-handle telemetry artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-active-handle-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/.test-tmp/handle-telemetry.json
          if-no-files-found: warn
          retention-days: 30

  # ── Dashboard: Build ──
  dashboard-build:
    name: Dashboard Build
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Python + uv (OpenAPI export)
        uses: ./.github/actions/setup-python-uv
      - name: Export OpenAPI schema for type codegen
        run: uv run python scripts/export_openapi.py
      - run: npm ci
        working-directory: web
      - name: DTO TypeScript drift gate (#1889)
        run: uv run python scripts/check_dto_types_ts_in_sync.py
      - name: Production build
        run: npm run build
        working-directory: web
      # Bundle-size budgets are enforced inside the same job to reuse
      # the just-built ``dist/`` artifact -- a separate job would have
      # to ``npm ci`` + ``npm run build`` again, doubling Vite's
      # cost (~2-3 min) per PR.
      - name: size-limit budget check
        run: npm run size
        working-directory: web

  # ── Dashboard: Security Audit ──
  dashboard-audit:
    name: Dashboard Security Audit
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: npm audit (critical + high)
        run: npm audit --audit-level=high
        working-directory: web

  # ── Dashboard: Storybook Build ──
  dashboard-storybook-build:
    name: Dashboard Storybook Build
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Run npm run storybook:build -- --disable-telemetry
        run: npm run storybook:build -- --disable-telemetry
        working-directory: web
        env:
          # Prevent OOM-induced crashes on CI runners with limited RAM.
          # --report-on-fatalerror captures Node.js-level crashes (OOM,
          # assertions) but NOT native addon SIGSEGV -- those need OS
          # core dumps. --report-directory ensures reports land in a
          # predictable location for artifact upload.
          NODE_OPTIONS: "--max-old-space-size=4096 --report-on-fatalerror --report-directory=."
      - name: Upload Node.js crash report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-crash-report
          path: web/report.*.json
          if-no-files-found: ignore

  # ── Branch-protection drift audit ──
  # Compares live rulesets against .github/branch_protection.yml. Runs on
  # push to main (informational) and workflow_dispatch. continue-on-error
  # for now so benign drift in the spec's initial capture does not block
  # every push; promote to blocking once the spec has survived 30 days
  # of zero-drift runs (tracked in #1555).
  #
  # Authentication: the GitHub rulesets REST API requires a token with
  # ``administration: read`` scope. GITHUB_TOKEN cannot be granted that
  # scope via workflow permissions, so the job mints a fresh
  # ``synthorg-repo-bot`` App installation token via the shared
  # ``release-runner-setup`` composite. The App's scope is already
  # Contents RW + PRs RW + Metadata R (see docs/reference/github-
  # environments.md); rulesets are accessible to any installation with
  # metadata read, which is sufficient for this read-only audit.
  branch-protection-audit:
    name: Branch-protection drift audit
    # Accept push-to-main (informational) AND workflow_dispatch from
    # main so the audit can be triggered ad-hoc from Actions -> "CI"
    # -> Run workflow. The ``release`` environment's branch policy
    # also restricts deploys to main, so allowing this job to attempt
    # a deploy from a non-main ref would surface a noisy "deployment
    # was rejected" annotation on every CI run dispatched against a
    # release-please branch (the standard nudge used by release.yml
    # to trigger CI on App-token-authored PRs). Gate at the if: check
    # so non-main dispatches simply skip this job.
    #
    # Fork gate: skip in forks. The audit needs the release-bot App
    # token (env-scoped secret on `release`) and a fork won't have it.
    # ci-preflight reports the missing setup separately.
    #
    # Precedence: `&&` binds tighter than `||`, so the inner
    # parentheses around `(push || dispatch)` are required to keep
    # the trigger-OR group intact under the outer fork-AND-main-AND.
    if: >-
      !github.event.repository.fork
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Release runner setup
        id: setup
        uses: ./.github/actions/release-runner-setup
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          # Read-only audit of the GitHub rulesets API; metadata:read is
          # the minimum scope sufficient for that surface.
          permission-metadata: read
      - name: Install yq
        run: |
          set -euo pipefail
          # yq (Mike Farah) -- Go binary, no runtime deps.  Retry on
          # transient GitHub-releases CDN flakes.
          sudo curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Audit
        id: audit
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
        run: bash scripts/audit_branch_protection.sh

      # The job-level `continue-on-error: true` above silences the audit
      # step's failure entirely during the #1555 stabilization window,
      # which means real drift could ship invisibly. Surface a warning
      # annotation when the audit detected drift; the warning shows up
      # in the run summary and check-run UI even though the job stays
      # green per #1555. Promote the job to blocking once #1555 closes
      # the 30-day zero-drift window.
      - name: Report drift outcome
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" = "failure" ]; then
            echo "::warning::Branch-protection drift detected -- see Audit step log. Job stays green via job-level continue-on-error during the #1555 stabilization window; promote to blocking once the spec has survived 30 days of zero-drift runs."
          fi

  # ── Gate: all required checks passed ──
  ci-pass:
    name: CI Pass
    if: always()
    needs: [changes, lint, doc-drift, runtime-stats-freshness, schema-validate, type-check, openapi-liveness, test-unit, test-integration, test-e2e, test-conformance-sqlite, test-coverage-aggregate, python-audit, dockerfile-lint, dashboard-lint, dashboard-type-check, dashboard-test, dashboard-build, dashboard-audit, dashboard-storybook-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          # Jobs that were skipped (not needed) count as passing.
          # Only "failure" is a real failure.
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.lint.result }}
            ${{ needs.doc-drift.result }}
            ${{ needs.runtime-stats-freshness.result }}
            ${{ needs.schema-validate.result }}
            ${{ needs.type-check.result }}
            ${{ needs.openapi-liveness.result }}
            ${{ needs.test-unit.result }}
            ${{ needs.test-integration.result }}
            ${{ needs.test-e2e.result }}
            ${{ needs.test-conformance-sqlite.result }}
            ${{ needs.test-coverage-aggregate.result }}
            ${{ needs.python-audit.result }}
            ${{ needs.dockerfile-lint.result }}
            ${{ needs.dashboard-lint.result }}
            ${{ needs.dashboard-type-check.result }}
            ${{ needs.dashboard-test.result }}
            ${{ needs.dashboard-build.result }}
            ${{ needs.dashboard-audit.result }}
            ${{ needs.dashboard-storybook-build.result }}
        run: |
          # Any "failure" or "cancelled" in the results means CI failed.
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed. Job results: $RESULTS"
            exit 1
          fi
          echo "All CI checks passed (some may have been skipped due to path filters)"
