name: Dev Release

# Create incremental pre-release builds on every push to main between stable
# releases. Computes a semver dev version (e.g. v0.4.7-dev.3) and creates a
# draft pre-release + tag. The tag triggers the existing Docker and CLI
# workflows which attach assets to the draft; finalize-release publishes it
# once both succeed -- the exact same pipeline as stable releases.

on:
  push:
    branches: [main]

permissions: {}

# Serialize dev-release jobs across main pushes -- each commit must mint
# its own per-SHA dev tag (v0.7.5-dev.N). Cancelling an in-flight run
# would lose that commit's tag entirely (gap in version sequence, broken
# per-commit traceability for downstream Docker / CLI / finalize-release).
concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  dev-release:
    name: Create Dev Pre-Release
    # Skip Release Please version-bump merges and our own auto-rollover
    # PR merges (those carry the trailer that produces the next release;
    # they are rapidly superseded by the actual `chore(main): release`
    # commit). Skip if a v* tag already points at this commit (the
    # stable release just landed). Skip in forks; the release-bot App
    # token isn't available off the upstream release environment. The
    # subject-prefix matches are anchored to avoid the false-positive
    # where any unrelated PR's body that mentions `Release-As:` in
    # prose / code blocks would silently leave a gap in the per-commit
    # dev-tag sequence. Feature PRs that carry an explicit
    # `Release-As:` trailer in the body still mint a dev tag for their
    # commit -- the cosmetic cost (one extra dev tag) is preferable to
    # the prior false-positive that swallowed every dev-tag for any PR
    # mentioning the trailer in prose.
    if: >-
      !github.event.repository.fork
      && !startsWith(github.event.head_commit.message, 'chore(main): release')
      && !startsWith(github.event.head_commit.message, 'chore: auto-rollover')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      # Full-history checkout: Compute dev version step below uses
      # `git tag --sort` + `git rev-list` to compute the dev build number.
      - uses: ./.github/actions/checkout
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Shared setup: validate ref is refs/heads/main and mint the
      # synthorg-repo-bot App installation token. The minted token
      # is needed so the tag-push step fires downstream Docker + CLI
      # workflows -- GITHUB_TOKEN-authored pushes are suppressed by
      # GitHub's anti-recursion rule, App tokens are not.
      - name: Release runner setup
        id: setup
        uses: ./.github/actions/release-runner-setup
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          # Dev-release pushes a v*-dev.N tag under the App identity so
          # downstream Docker + CLI workflows fire (GITHUB_TOKEN pushes
          # are suppressed by the anti-recursion rule).
          permission-contents: write

      - name: Check if commit already has a stable tag
        id: check-tag
        run: |
          # If this commit already has a stable v* tag, skip -- it is
          # a stable release and will be handled by Release Please.
          TAGS=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -n "$TAGS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit already tagged as stable release: $TAGS"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute dev version
        if: steps.check-tag.outputs.skip != 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Find last stable release tag (exclude dev tags)
          LAST_TAG=$(git tag --sort=-v:refname --list "v[0-9]*.[0-9]*.[0-9]*" | grep -vE '\-dev\.[0-9]+$' | head -1)
          LAST_TAG=${LAST_TAG:-""}
          if [ -z "$LAST_TAG" ]; then
            echo "::error::No stable release tag found"
            exit 1
          fi
          echo "Last stable tag: $LAST_TAG"

          # 2. Get next version from Release Please pending PR
          NEXT_VERSION=$(gh pr list --label "autorelease: pending" --state open --json title --jq '.[0].title // ""' | grep -oP '\d+\.\d+\.\d+' || true)
          if [ -z "$NEXT_VERSION" ]; then
            # Fallback: bump patch from last tag
            LAST_VERSION="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
            NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "No Release Please PR found, computed next version: $NEXT_VERSION"
          else
            echo "Next version from Release Please: $NEXT_VERSION"
          fi

          # 3. Count commits since last stable tag
          DEV_NUM=$(git rev-list "${LAST_TAG}..HEAD" --count)
          if [ "$DEV_NUM" -eq 0 ]; then
            echo "::notice::No commits since $LAST_TAG, skipping dev release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DEV_TAG="v${NEXT_VERSION}-dev.${DEV_NUM}"
          echo "Dev version: $DEV_TAG"
          echo "dev_tag=$DEV_TAG" >> "$GITHUB_OUTPUT"
          echo "dev_num=$DEV_NUM" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check if dev tag already exists
        if: steps.check-tag.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        id: tag-exists
        env:
          DEV_TAG: ${{ steps.version.outputs.dev_tag }}
        run: |
          if git rev-parse "$DEV_TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag $DEV_TAG already exists, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create dev tag and pre-release
        if: >-
          steps.check-tag.outputs.skip != 'true'
          && steps.version.outputs.skip != 'true'
          && steps.tag-exists.outputs.skip != 'true'
        env:
          # Use the App installation token minted above so the tag push
          # triggers downstream workflows (Docker, CLI). Tags created with
          # the default GITHUB_TOKEN do not fire push events for other
          # workflows -- a GitHub Actions anti-recursion safeguard that
          # does not apply to App tokens.
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          DEV_TAG: ${{ steps.version.outputs.dev_tag }}
          DEV_NUM: ${{ steps.version.outputs.dev_num }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"

          # Pull only the commit subject from the local checkout. Squash
          # merges set the subject to "<PR title> (#NNN)", so the PR
          # number is already present and auto-linked by GitHub. We
          # deliberately do NOT include the commit body: for squash
          # merges that body is the full PR description (tables,
          # nested markdown, hundreds of lines), which renders poorly
          # on the release page and buries what changed.
          # Variables are NOT interpolated into the gh --notes argument
          # directly: a backtick or `$()` in a commit subject would trigger
          # command substitution inside the double-quoted string. Build
          # the notes via printf into a tmpfile and pass --notes-file
          # instead.
          COMMIT_SUBJECT=$(git log -1 --format='%s' "$GITHUB_SHA")

          NOTES_FILE=$(mktemp /tmp/dev-release-notes.XXXXXX)
          trap 'rm -f "$NOTES_FILE"' EXIT
          {
            printf 'Dev build #%s toward v%s\n\n' "$DEV_NUM" "$NEXT_VERSION"
            printf '**Commit:** `%s`\n' "$SHORT_SHA"
            printf '**Subject:** %s\n\n' "$COMMIT_SUBJECT"
            printf '**Full pipeline:** Docker images, CLI binaries, cosign signatures, and SLSA provenance will be attached by downstream workflows.\n\n'
            printf '> This is a pre-release for testing. Use `synthorg config set channel dev` to opt in.\n'
          } > "$NOTES_FILE"

          # 1. Create the tag via API. The App installation token minted
          #    above carries the ``contents: write`` scope needed for
          #    /git/refs POST AND (unlike the ambient GITHUB_TOKEN)
          #    its ref-create fires downstream ``push`` workflow events,
          #    so the tag push triggers Docker + CLI.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$DEV_TAG" \
            -f sha="$GITHUB_SHA"

          # 2. Create a draft pre-release pointing at the tag. The draft
          #    follows the same lifecycle as stable releases: Docker + CLI
          #    workflows attach assets, then finalize-release publishes
          #    once both succeed.
          #
          #    On failure we deliberately do NOT delete the tag. Step 1
          #    already pushed the ref, which fired downstream `tags: v*`
          #    workflows (cli.yml, docker.yml). Deleting the ref now
          #    would race their actions/checkout step and 404 on
          #    `refs/tags/$DEV_TAG`, surfacing a false-positive red on
          #    main even when the squash content is clean (#1818). The
          #    orphan tag is harmless: the "Clean up old dev pre-
          #    releases" step below + finalize-release.yml's stable-
          #    release sweep garbage-collect it later, and finalize-
          #    release.yml correctly skip-publishes a tag with no draft.
          if ! gh release create "$DEV_TAG" \
            --draft \
            --prerelease \
            --title "$DEV_TAG" \
            --notes-file "$NOTES_FILE"; then
            echo "::error::Release creation failed for $DEV_TAG"
            echo "::warning::Tag preserved to avoid racing downstream workflows (#1818)"
            exit 1
          fi

      - name: Clean up old dev pre-releases
        if: >-
          steps.check-tag.outputs.skip != 'true'
          && steps.version.outputs.skip != 'true'
          && steps.tag-exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the 5 most recent dev pre-releases, delete the rest.
          # The "keep 5 newest" filter guarantees the JUST-MINTED tag is
          # never selected for deletion -- the deleted tags are 5+
          # revisions old, and their downstream Docker / CLI workflows
          # have long since completed. The race documented in #1818
          # requires deleting a tag whose downstream workflows are
          # still in flight, which this bulk-prune doesn't do.
          gh release list --limit 50 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | contains("-dev.")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r tag; do
              echo "Deleting old dev release: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true  # lint-allow: workflow-tag-lifecycle -- bulk-deletes 5+-revision-old dev tags whose downstream workflows have completed; not the just-minted tag (#1818)
            done

      # Regression guard for #1818. The dev tag was created near the
      # top of this job; if anything in the run between then and now
      # deleted it, downstream Docker / CLI workflows triggered by the
      # initial tag push are about to 404 on actions/checkout. Surface
      # the deletion as a hard job failure so the existing report-
      # failure job opens the dev-release-regression tracking issue
      # with the run URL, instead of debugging from downstream symptoms.
      - name: Verify minted tag survived the run
        # always() ensures this regression guard runs on the failure
        # paths -- which is precisely when tag loss is most likely
        # (release-create or cleanup step erroring out partway). Without
        # always(), the implicit success() condition would skip the
        # guard the moment any earlier step failed, defeating the
        # canary's purpose.
        if: >-
          always()
          && steps.check-tag.outputs.skip != 'true'
          && steps.version.outputs.skip != 'true'
          && steps.tag-exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_TAG: ${{ steps.version.outputs.dev_tag }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$DEV_TAG" \
               >/dev/null 2>&1; then
            echo "::error::Tag $DEV_TAG was deleted during this run -- downstream Docker/CLI workflows are about to 404 on actions/checkout. Investigate dev-release.yml."
            exit 1
          fi
          echo "Tag $DEV_TAG present at end-of-run."

  report-failure:
    name: Open / update tracking issue on dev-release failure
    needs: dev-release
    # Skip on forks (no App token to report with) and on the workflow's
    # own skip paths (not failures, just no work). `result == 'failure'`
    # excludes both `skipped` and `cancelled`.
    if: >-
      always()
      && !github.event.repository.fork
      && needs.dev-release.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read    # actions/checkout (to load .github/actions/post-tracking-issue)
      issues: write     # gh issue create / comment / pin
    steps:
      - uses: ./.github/actions/checkout
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Compose body
        id: body
        env:
          RESULT: ${{ needs.dev-release.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo 'body<<TRACKING_ISSUE_BODY_EOF'
            cat <<EOF
          \`dev-release\` workflow failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) with result \`$RESULT\` on $HEAD_SHA.

          Run: ${RUN_URL}

          Likely cause: dev-tag minting failure (App-token signing, tag
          conflict, or release.yml + dev-release.yml race), draft
          pre-release create / asset attach failure, or stale-release
          cleanup failure.

          When this stays red, per-commit dev tags stop appearing on
          main; downstream Docker / CLI artifacts then have no draft
          pre-release to attach to and finalize-release can never
          publish.
          EOF
            echo 'TRACKING_ISSUE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/post-tracking-issue
        with:
          title: 'dev-release regression'
          labels: 'automation:ci-health,type:ci,prio:high'
          body: ${{ steps.body.outputs.body }}
          pin: 'false'
          gh-token: ${{ github.token }}
