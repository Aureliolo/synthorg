    gate: .importlinter
    # Primary artifact: the declarative layering contracts in
    # .importlinter, enforced by `lint-imports` (pre-push + CI).
    # Sibling gates (one primary tracked per paragraph; the rest live
    # in docs/reference/convention-gates.md + import-layering.md):
    #   scripts/check_architecture_drift.py
    #     - fan-in / LCOM4 / budget-pressure drift vs the committed
    #       data/architecture_report.json baseline (ADR-0011).
    #   scripts/check_persistence_boundary.py     -- raw-SQL / driver boundary
    #   scripts/check_no_api_dto_in_persistence_or_service.py -- DTO leak
    #   scripts/check_dependency_inversion.py     -- concrete-class DI rule

  # ---------------------------------------------------------------
  # web/CLAUDE.md
