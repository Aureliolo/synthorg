name: Build and scan container image
description: >-
  Build a Dockerfile-based container image from a signed apko base for ONE
  architecture, scan it with Trivy (JSON + SARIF) at CRITICAL + HIGH, upload
  SARIF to GitHub Security, and execute the CIS Docker Benchmark. On non-PR
  events the build emits a docker-archive tarball (uploaded as an artifact)
  so the companion `publish-image` action can push the *exact scanned bytes*
  instead of rebuilding. Intended to be called from a job whose only
  permissions are `contents: read` + `security-events: write` -- no elevated
  registry perms.

  One architecture per invocation: the caller runs it once per arch on a
  runner native to that arch, so nothing here emulates.

inputs:
  image-name:
    description: >-
      Short image name suffix (e.g. backend, sandbox, sidecar,
      fine-tune-gpu, fine-tune-cpu). Combined with
      `ghcr.io/aureliolo/synthorg-` to form the registry ref and used as
      the suffix for Trivy report filenames and SARIF categories.
    required: true
  platform:
    description: >-
      The single architecture to build: `amd64` or `arm64`. Must match the
      runner the calling job selected; no binfmt handler is registered.
    required: false
    default: amd64
  display-name:
    description: "Human-readable name for log messages (e.g. 'Backend', 'Fine-Tune (gpu)')."
    required: true
  dockerfile:
    description: "Path to the Dockerfile (relative to repository root)."
    required: true
  context:
    description: "Docker build context path."
    required: false
    default: "."
  app-version:
    description: >-
      Application version from `needs.version.outputs.app_version`. Emitted
      as the `type=raw` tag on stable `v*` releases.
    required: true
  base-image-repo:
    description: >-
      Base image repository (e.g. ghcr.io/aureliolo/synthorg-backend-base).
      Combined with `base-image-digest` (preferred) or `base-image-tag` to
      form the `BASE_IMAGE` build-arg.
    required: true
  base-image-tag:
    description: "Base image tag from `needs.build-X-base.outputs.tag`."
    required: true
  base-image-digest:
    description: >-
      Base image digest from `needs.build-X-base-publish.outputs.digest`.
      Empty on pull-request events (no publish happens). When set, takes
      precedence over `base-image-tag` for the BASE_IMAGE build-arg.
    required: false
    default: ""
  base-image-artifact-name:
    description: >-
      Artifact name for the base tarball. Only consumed on the PR path to
      load the signed apko base without re-pulling from GHCR; callers on
      push/tag events may leave this empty since the base is referenced
      by digest instead.
    required: false
    default: ""
  base-image-tarball-name:
    description: >-
      Tarball filename inside the downloaded artifact. Same PR-path-only
      semantics as `base-image-artifact-name`.
    required: false
    default: ""
  extra-build-args:
    description: >-
      Additional Docker build args, one per line (e.g. DEPLOYMENT_ENV,
      FINE_TUNE_EXTRA). `BASE_IMAGE` is prepended automatically.
    required: false
    default: ""
  cache-scope:
    description: >-
      GHA cache scope suffix. Leave empty for non-matrix jobs. Fine-tune
      passes the variant name so GPU and CPU do not share a cache layer.
      The platform is appended automatically, so an amd64 and an arm64
      build of the same image never share a scope.
    required: false
    default: ""
  free-disk-space:
    description: >-
      Run aggressive disk cleanup before buildx setup. Required for
      fine-tune images (~4 GB GPU + ~1.7 GB CPU variants overflow the
      default `ubuntu-24.04` runner). Pass the literal string "true" to
      enable. WARNING: this wipes the entire pre-installed toolchain cache
      (`/opt/hostedtoolcache`, dotnet, swift, miniconda, ghcup, the Android
      SDK, etc.). A caller that sets this MUST NOT rely on any cached
      toolchain (a hostedtoolcache Python/Node/Java, etc.) in a later step
      of the same job; the system `/usr/bin` interpreters survive, the
      cached ones do not.
    required: false
    default: "false"
  trivy-version:
    description: "Trivy version, WITHOUT a leading `v` (e.g. `0.70.0`). The release download URL adds the `v` prefix; the tarball filename does not."
    required: true
  github-token:
    description: >-
      GITHUB_TOKEN for the artifact REST API, from the caller's
      `secrets.GITHUB_TOKEN`, which must also grant `actions: read`. Both are
      needed so a re-run can reach the base tarball an earlier attempt
      uploaded; the full reasoning and its security trade-off are in the header
      comment of `.github/workflows/build-images.yml`.
    required: true

outputs:
  ref:
    description: |
      Local docker image reference for the built architecture, loaded into
      the runner's Docker daemon.
        - PR events: `ghcr.io/<owner>/synthorg-<image-name>:sha-<short-sha>`
        - non-PR events: `ghcr.io/<owner>/synthorg-<image-name>:scan-<full-sha>-<platform>`
    value: ${{ steps.scan-ref.outputs.ref }}

runs:
  using: composite
  steps:
    # Fine-tune GPU image is ~4 GB (torch + CUDA wheels). The GHA
    # ubuntu-24.04 runner ships with ~14 GB free on /, which is not
    # enough headroom for buildx to assemble the layer tar + load it
    # into the daemon + run Trivy. Remove pre-installed toolchains we
    # do not use to reclaim ~25 GB.
    - name: Free disk space
      if: inputs.free-disk-space == 'true'
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo rm -rf /opt/hostedtoolcache /usr/share/swift /usr/share/miniconda
        sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
        sudo rm -rf /usr/local/lib/node_modules /usr/local/.ghcup
        sudo docker image prune --all --force
        df -h /

    # Without this the mismatch surfaces as an exec-format error on an
    # arbitrary RUN line deep inside the build.
    - name: Verify runner architecture matches requested platform
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        case "${PLATFORM}" in
          amd64|arm64) ;;
          *) echo "::error::platform must be amd64 or arm64, got '${PLATFORM}'"; exit 1 ;;
        esac
        runner_arch="$(dpkg --print-architecture)"
        if [ "${runner_arch}" != "${PLATFORM}" ]; then
          echo "::error::platform=${PLATFORM} but this runner is ${runner_arch}. Nothing here emulates; give the job a runs-on native to the requested platform (ubuntu-24.04 for amd64, ubuntu-24.04-arm for arm64)."
          exit 1
        fi

    # The `docker-container` driver boots BuildKit by pulling moby/buildkit
    # from Docker Hub, and setup-buildx-action does not retry that pull: a
    # sub-minute registry timeout fails the whole build job before the
    # Dockerfile is even read. Pre-pull through the retry-and-mirror ladder
    # and point the driver at the resulting local tag so the boot never
    # reaches Docker Hub itself. The `docker` driver used on PRs boots no
    # BuildKit container, so it needs neither the pull nor the driver-opt.
    - name: Pull BuildKit image
      if: github.event_name != 'pull_request'
      uses: ./.github/actions/docker-pull-resilient
      with:
        # renovate: datasource=docker depName=moby/buildkit
        image: moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
        local-tag: synthorg-buildkit:buildx-stable-1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      with:
        # `docker` driver is required for `load: true` on PR builds so
        # Trivy can scan a locally loaded image; `docker-container`
        # enables `type=gha` layer cache + `type=docker` archive output
        # for the tarball handoff on non-PR builds.
        driver: ${{ github.event_name == 'pull_request' && 'docker' || 'docker-container' }}
        # Condition is inverted relative to `driver` above so the non-empty
        # value sits on the truthy branch: `A && '' || B` would always yield
        # B, since `''` is falsy and GHA falls through to the `||` arm.
        driver-opts: ${{ github.event_name != 'pull_request' && 'image=synthorg-buildkit:buildx-stable-1' || '' }}
        # BuildKit resolves the `# syntax=` frontend and every `FROM` itself,
        # outside the `docker pull` the ladder wraps. This covers only the
        # docker.io refs (the frontend and the builder-stage bases); the
        # GHCR-hosted `BASE_IMAGE` final stage never touches it. Digest pins
        # on both keep either path safe. Ignored by the `docker` driver PR
        # builds use.
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
        cache-binary: false

    - name: Download base image artifact (PR only)
      if: github.event_name == 'pull_request'
      uses: ./.github/actions/download-artifact
      with:
        name: ${{ inputs.base-image-artifact-name }}
        path: /tmp
        github-token: ${{ inputs.github-token }}

    - name: Load base image (PR only)
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        BASE_IMAGE_REPO: ${{ inputs.base-image-repo }}
        BASE_TAG: ${{ inputs.base-image-tag }}
        BASE_TARBALL: ${{ inputs.base-image-tarball-name }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        docker load -i "/tmp/${BASE_TARBALL}"
        docker tag "${BASE_IMAGE_REPO}:${BASE_TAG}-${PLATFORM}" "${BASE_IMAGE_REPO}:${BASE_TAG}"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}
        tags: |
          type=raw,value=${{ inputs.app-version }},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev.') }}
          type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev.') }}
          type=raw,value=dev,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-dev.') }}
          type=sha,prefix=sha-

    # No `cache-to`: GitHub scopes the Actions cache by branch, so a PR may
    # read main's cache but anything it writes only itself can ever see.
    - name: Build image (PR, loaded for scan)
      id: build-pr
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: false
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BASE_IMAGE=${{ inputs.base-image-digest != '' && format('{0}@{1}', inputs.base-image-repo, inputs.base-image-digest) || format('{0}:{1}', inputs.base-image-repo, inputs.base-image-tag) }}
          ${{ inputs.extra-build-args }}
        cache-from: ${{ inputs.cache-scope != '' && format('type=gha,scope={0}-{1}', inputs.cache-scope, inputs.platform) || format('type=gha,scope={0}', inputs.platform) }}
        platforms: linux/${{ inputs.platform }}

    # Tarball so publish-image pushes the exact scanned bytes rather than
    # rebuilding; the publish job reassembles the manifest from both arches.
    - name: Build image tarball (non-PR)
      id: build
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        outputs: type=docker,dest=/tmp/scan-image-${{ inputs.image-name }}-${{ inputs.platform }}.tar
        tags: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}:scan-${{ github.sha }}-${{ inputs.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BASE_IMAGE=${{ inputs.base-image-digest != '' && format('{0}@{1}', inputs.base-image-repo, inputs.base-image-digest) || format('{0}:{1}', inputs.base-image-repo, inputs.base-image-tag) }}
          ${{ inputs.extra-build-args }}
        cache-from: ${{ inputs.cache-scope != '' && format('type=gha,scope={0}-{1}', inputs.cache-scope, inputs.platform) || format('type=gha,scope={0}', inputs.platform) }}
        cache-to: ${{ inputs.cache-scope != '' && format('type=gha,mode=max,scope={0}-{1}', inputs.cache-scope, inputs.platform) || format('type=gha,mode=max,scope={0}', inputs.platform) }}
        platforms: linux/${{ inputs.platform }}

    # `!cancelled()` not the success chain: every scan gate below keys off
    # this load, so it must be reached on its own merits.
    - name: Load image for scanning (non-PR)
      id: load
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        docker load -i "/tmp/scan-image-${IMAGE_NAME}-${PLATFORM}.tar"

    - name: Compute scan image ref
      id: scan-ref
      # Must not inherit a load failure; the gates below need this ref.
      if: ${{ !cancelled() }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        EVENT_NAME: ${{ github.event_name }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        SHORT_SHA="${GITHUB_SHA::7}"
        if [ "$EVENT_NAME" = "pull_request" ]; then
          echo "ref=ghcr.io/aureliolo/synthorg-${IMAGE_NAME}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
        else
          echo "ref=ghcr.io/aureliolo/synthorg-${IMAGE_NAME}:scan-${GITHUB_SHA}-${PLATFORM}" >> "$GITHUB_OUTPUT"
        fi

    - name: Report image size
      shell: bash
      env:
        SCAN_REF: ${{ steps.scan-ref.outputs.ref }}
        DISPLAY_NAME: ${{ inputs.display-name }}
        PLATFORM: ${{ inputs.platform }}
      run: scripts/report-image-size.sh "$SCAN_REF" "$DISPLAY_NAME ($PLATFORM)"

    # `trivy image` re-exports the image to a temp docker-archive first: a
    # third full copy that overflows the runner's ~14 GB root on fine-tune.
    # /mnt has ~70 GB.
    - name: Provision Trivy scratch on /mnt
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        sudo mkdir -p /mnt/trivy-tmp /mnt/trivy-cache
        sudo chown "$(id -u):$(id -g)" /mnt/trivy-tmp /mnt/trivy-cache
        df -h /mnt /

    - name: Install Trivy
      id: install-trivy
      if: ${{ !cancelled() }}
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy-version }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        case "${PLATFORM}" in
          amd64) asset="Linux-64bit" ;;
          arm64) asset="Linux-ARM64" ;;
          *) echo "::error::unsupported platform '${PLATFORM}'"; exit 1 ;;
        esac
        curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${asset}.tar.gz" -o "/tmp/trivy_${TRIVY_VERSION}_${asset}.tar.gz"
        curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors --retry-max-time 300 "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy_checksums.txt
        (cd /tmp && grep "trivy_${TRIVY_VERSION}_${asset}.tar.gz" trivy_checksums.txt | sha256sum -c -)
        tar -xzf "/tmp/trivy_${TRIVY_VERSION}_${asset}.tar.gz" -C /tmp trivy
        sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

    # Every gate below keys off the step that produced the image, not the
    # success chain, so a reporting failure cannot cost this image its
    # vulnerability gate.
    - name: Trivy scan
      if: ${{ !cancelled() && steps.install-trivy.outcome == 'success' && (steps.build-pr.outcome == 'success' || steps.load.outcome == 'success') }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        PLATFORM: ${{ inputs.platform }}
        SCAN_REF: ${{ steps.scan-ref.outputs.ref }}
        TMPDIR: /mnt/trivy-tmp
        TRIVY_CACHE_DIR: /mnt/trivy-cache
      run: |
        trivy image "${SCAN_REF}" --format json --output "trivy-${IMAGE_NAME}-${PLATFORM}.json" \
          --exit-code 0 --severity CRITICAL,HIGH --ignorefile .github/.trivyignore.yaml

    - name: Evaluate Trivy results
      if: ${{ !cancelled() && steps.install-trivy.outcome == 'success' && (steps.build-pr.outcome == 'success' || steps.load.outcome == 'success') }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        PLATFORM: ${{ inputs.platform }}
        DISPLAY_NAME: ${{ inputs.display-name }}
      run: scripts/evaluate-scan.sh --verbose "trivy-${IMAGE_NAME}-${PLATFORM}.json" "$DISPLAY_NAME ($PLATFORM)"

    # Platform in the name: both matrix legs upload from separate jobs in the
    # same run and a shared name would race.
    - name: Upload Trivy reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: trivy-${{ inputs.image-name }}-${{ inputs.platform }}-report
        path: trivy-${{ inputs.image-name }}-${{ inputs.platform }}.json
        retention-days: 30
        if-no-files-found: ignore

    # Not `always()`: after a failed build the `command not found` would land
    # below the real error and mask it.
    - name: Trivy SARIF scan
      if: ${{ !cancelled() && steps.install-trivy.outcome == 'success' && (steps.build-pr.outcome == 'success' || steps.load.outcome == 'success') }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        PLATFORM: ${{ inputs.platform }}
        SCAN_REF: ${{ steps.scan-ref.outputs.ref }}
        TMPDIR: /mnt/trivy-tmp
        TRIVY_CACHE_DIR: /mnt/trivy-cache
      run: |
        trivy image "${SCAN_REF}" --format sarif --output "trivy-${IMAGE_NAME}-${PLATFORM}.sarif" \
          --exit-code 0 --severity CRITICAL,HIGH --ignorefile .github/.trivyignore.yaml

    - name: Upload SARIF to GitHub Security
      if: ${{ !cancelled() && steps.install-trivy.outcome == 'success' && (steps.build-pr.outcome == 'success' || steps.load.outcome == 'success') }}
      # Cosmetic; `Evaluate Trivy results` above is the real gate.
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
      with:
        sarif_file: trivy-${{ inputs.image-name }}-${{ inputs.platform }}.sarif
        category: trivy-${{ inputs.image-name }}-${{ inputs.platform }}

    # No Trivy dependency: coupling two independent checks.
    - name: CIS Docker Benchmark
      if: ${{ !cancelled() && (steps.build-pr.outcome == 'success' || steps.load.outcome == 'success') }}
      uses: ./.github/actions/cis-scan
      with:
        image-ref: ${{ steps.scan-ref.outputs.ref }}

    # 7 days, not 1: an environment-gated `image-push` approval can sit for
    # days, and an expired tarball breaks the publish chain.
    - name: Upload image tarball (non-PR)
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: scan-image-${{ inputs.image-name }}-${{ inputs.platform }}
        path: /tmp/scan-image-${{ inputs.image-name }}-${{ inputs.platform }}.tar
        retention-days: 7
