# SynthOrg Go sanitiser models.
#
# Each row uses the `sanitizerModel` extensible predicate so CodeQL treats
# the modelled return value as a taint barrier (kind: "taint") rather than
# a value-preserving summary. This matches the documented MaD pattern for
# Go sanitisers
# (https://codeql.github.com/docs/codeql-language-guides/customizing-library-models-for-go/).
#
# Per-rule scoping: every row below targets go/path-injection. SynthOrg's CLI
# does not have any other path-bearing static-analysis surface that needs
# modelling.

extensions:
  # go/path-injection
  # config.SecurePath validates that a path is absolute and returns
  # filepath.Clean(path). The error return forces callers to handle invalid
  # input; the cleaned string is what flows into os.ReadFile / os.MkdirAll.
  - addsTo:
      pack: codeql/go-all
      extensible: sanitizerModel
    data:
      - ["github.com/Aureliolo/synthorg/cli/internal/config", "", "False", "SecurePath", "", "", "Argument[0]", "taint", "manual"]

  # go/path-injection
  # safeStateDir wraps config.SecurePath using state.DataDir; modelled
  # separately because the wrapping crosses a package boundary and CodeQL's
  # inter-procedural analysis can lose precision when a sanitiser is wrapped
  # in a (T, error)-returning helper. The function lives in cli/cmd, which is
  # a main-package alias rather than an importable Go package.
  - addsTo:
      pack: codeql/go-all
      extensible: sanitizerModel
    data:
      - ["github.com/Aureliolo/synthorg/cli/cmd", "", "False", "safeStateDir", "", "", "Argument[0]", "taint", "manual"]
