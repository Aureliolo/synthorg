name: Lighthouse CI

# Web Vitals + Lighthouse perf-score gates for both the React 19
# dashboard (run against the production-built ``vite preview``) and
# the Astro marketing site (run against the deployed pr-preview URL).
#
# The dashboard job is independent of the pr-preview deployment --
# it builds + serves locally inside the runner. The site job runs
# only after the ``Deploy Preview`` job in ``pages-preview.yml``
# succeeds, so the Cloudflare Pages URL is live.

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "site/**"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Dashboard: Lighthouse against vite preview ──
  #
  # The workflow's ``on.pull_request.paths`` is a UNION of
  # ``web/`` / ``site/`` / ``docs/`` / ``mkdocs.yml`` / the workflow
  # file. Any of those entries triggers the workflow, so this
  # dashboard job runs whenever the workflow does. If you need
  # finer-grained gating (e.g. dashboard-only when ``web/``
  # actually changed), add a ``dorny/paths-filter`` step to this
  # job; today the cost of running a full LHCI on every triggering
  # PR is acceptable.
  lighthouse-dashboard:
    name: Lighthouse Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python + uv (OpenAPI export)
        uses: ./.github/actions/setup-python-uv

      - name: Export OpenAPI schema for type codegen
        run: uv run python scripts/export_openapi.py

      - name: Install dashboard deps
        # Retry transient npm registry 5xx / network blips with
        # exponential backoff so a flaky registry doesn't fail
        # the gate.
        run: npm --prefix web ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=2000

      - name: Build dashboard (production)
        run: npm --prefix web run build

      - name: Lighthouse CI (dashboard)
        run: npm --prefix web run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # ── Marketing site: Lighthouse against pr-preview URL ──
  #
  # This job is a sibling of ``lighthouse-dashboard`` -- both fire
  # whenever the workflow's ``on.pull_request.paths`` matches. The
  # site path-filter step below narrows the heavy work (preview
  # poll + LHCI run) to PRs that actually touched the site
  # surface; ``lighthouse-pass`` reports success when the site
  # job is skipped on a web-only PR.
  lighthouse-site:
    name: Lighthouse Site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # ``pull-requests: read`` is required by
      # ``dorny/paths-filter@v4`` on ``pull_request`` events; without
      # it the action 403s when fetching the PR file list.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The workflow-level ``paths:`` filter is a UNION (web/ OR site/
      # OR docs/), so this job runs whenever ``codspeed-web`` /
      # ``codspeed-python`` need to. Without an inner filter the site
      # job would burn a full LHCI run on every web-only PR -- the
      # ``Wait for pr-preview`` step would then poll a URL that the
      # ``pages-preview`` workflow never deployed (its trigger is
      # ``site/**`` only) and time out at 5 minutes. Running this
      # filter here gates the heavy steps (``Wait for pr-preview``,
      # ``Install lhci``, ``Lighthouse CI (site)``) on whether the PR
      # actually touched the site surface; PR-number resolution still
      # runs unconditionally because it is cheap and only reads
      # ``github.event``.
      - name: Detect site-surface changes
        id: changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            site-surface:
              - 'site/**'
              - 'docs/**'
              - 'mkdocs.yml'
              - '.github/workflows/lighthouse.yml'
              - '.github/workflows/pages-preview.yml'

      - name: Resolve PR number
        id: pr
        env:
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -z "${PR_EVENT_NUMBER:-}" ]]; then
            echo "::warning::Skipping lighthouse-site: no PR number resolvable (likely workflow_dispatch on a branch). The marketing-site Lighthouse audit only runs against the deployed pr-preview URL."
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "pr_number=${PR_EVENT_NUMBER}" >>"$GITHUB_OUTPUT"
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Wait for pr-preview deployment to be live
        if: steps.pr.outputs.skip == 'false' && steps.changes.outputs.site-surface == 'true'
        env:
          PREVIEW_URL: "https://pr-${{ steps.pr.outputs.pr_number }}.synthorg-pr-preview.pages.dev"
        run: |
          set -euo pipefail
          echo "Waiting for ${PREVIEW_URL} to respond 200..."
          for i in $(seq 1 30); do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "${PREVIEW_URL}" || echo "000")
            if [[ "${STATUS}" == "200" ]]; then
              echo "pr-preview is live (HTTP 200)."
              exit 0
            fi
            echo "Attempt $i: HTTP ${STATUS}; waiting 10s..."
            sleep 10
          done
          echo "::error::pr-preview did not become healthy within 5 minutes."
          exit 1

      - name: Install lhci (reuse web's @lhci/cli)
        if: steps.pr.outputs.skip == 'false' && steps.changes.outputs.site-surface == 'true'
        # Retry transient npm registry 5xx / network blips with
        # exponential backoff.
        run: npm --prefix web ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=2000

      - name: Lighthouse CI (site)
        if: steps.pr.outputs.skip == 'false' && steps.changes.outputs.site-surface == 'true'
        env:
          LHCI_PR_PREVIEW_URL: "https://pr-${{ steps.pr.outputs.pr_number }}.synthorg-pr-preview.pages.dev"
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        working-directory: site
        run: npx --prefix ../web lhci autorun

      - name: Note skipped on web-only PR
        if: steps.changes.outputs.site-surface != 'true'
        run: |
          echo "::notice::Skipping lighthouse-site: PR did not touch the site surface (site/, docs/, mkdocs.yml, lighthouse.yml, pages-preview.yml)."

  # ── Aggregator gate ──
  lighthouse-pass:
    name: Lighthouse Pass
    if: always()
    needs: [lighthouse-dashboard, lighthouse-site]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          DASHBOARD_RESULT: ${{ needs.lighthouse-dashboard.result }}
          SITE_RESULT: ${{ needs.lighthouse-site.result }}
        run: |
          # Skipped jobs (path-filter said "no relevant change") count
          # as passing; only "failure" / "cancelled" propagate.
          for r in "${DASHBOARD_RESULT}" "${SITE_RESULT}"; do
            if [[ "${r}" == "failure" || "${r}" == "cancelled" ]]; then
              echo "Lighthouse checks failed. Results: dashboard=${DASHBOARD_RESULT}, site=${SITE_RESULT}"
              exit 1
            fi
          done
          echo "Lighthouse checks passed (results: dashboard=${DASHBOARD_RESULT}, site=${SITE_RESULT})"
