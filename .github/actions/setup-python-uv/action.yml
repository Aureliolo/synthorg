name: Setup Python with uv
description: Install uv, Python, and project dependencies

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.14"

runs:
  using: composite
  steps:
    # uv's dependency cache. Replaces astral-sh/setup-uv's bundled cache
    # handling: actions/cache treats a cache-service outage as a non-fatal
    # warning, so a restore/save blip never fails the job. Keyed on uv.lock
    # (the uv project's resolved graph), not the requirements glob setup-uv
    # defaulted to.
    - name: Restore uv cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    # uv puts a managed interpreter under its data dir, which the uv cache
    # above does not cover, so every job re-fetched the CPython standalone
    # tarball from Astral's CDN. Pinned to an explicit directory rather than
    # left at the platform default: the cache path has to be written as a
    # literal here, and a default that moves between uv releases would turn
    # into a permanent silent cache miss rather than a visible failure.
    #
    # Keyed on the interpreter's identity (platform + requested version) and
    # on the uv release that laid it out, so a uv upgrade that changed the
    # directory layout misses rather than restoring something uv cannot use.
    # No restore-keys: a partial match here would hand uv a tree for a
    # different Python, which is worse than the download it saves.
    - name: Restore managed Python
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/uv-python
        key: >-
          uv-python-${{ runner.os }}-${{ runner.arch }}-${{ inputs.python-version
          }}-${{ hashFiles('.github/actions/install-uv/action.yml') }}

    - uses: ./.github/actions/install-uv

    # Both installs are wrapped in retry_cmd.sh: a cold run (or evicted
    # uv cache) fetches the CPython standalone tarball and every dependency
    # from PyPI / Astral's index, and a transient CDN / index blip on any
    # of those would otherwise fail the step on a single attempt. This is
    # the Python analogue of go-mod-download-retry; both wrapped commands
    # are idempotent, so retry-everything is safe.
    #
    # Each carries a RETRY_CMD_DEADLINE so the ladder always reports its own
    # named failure before the enclosing job's timeout-minutes reaps the
    # runner. Attempts x per-attempt timeout plus backoff is the real worst
    # case, and an unbounded one is how a stalled download becomes an opaque
    # cancelled job with no diagnosis.
    #
    # Sizing rule: a deadline is only useful between two bounds. Below the
    # realistic healthy duration it kills work that was going to succeed;
    # above the enclosing job's timeout-minutes the reaper wins first and the
    # ladder never reports. The smallest job that installs Python budgets
    # 300s, so 240s is the ceiling worth setting, and each per-attempt timeout
    # is sized so a SECOND full attempt plus its backoff still fits inside it
    # -- a ladder whose retry cannot be reached is the very defect the
    # deadline exists to remove, and the helper refuses to start an attempt
    # the remaining budget cannot afford whole rather than running a stub of
    # one and reporting its 124.
    #
    # A per-attempt timeout has a second bound the rule above does not state,
    # and ``uv python install`` is where it bites: the fetch does not resume,
    # so a retry restarts the same 34 MiB from zero. Against a hard failure
    # (DNS, a 5xx) that is fine, because the attempt ends early and the retry
    # is the whole point. Against a runner whose throughput sits below what
    # the timeout implies, every attempt dies at the same place and the
    # ladder converts slow-but-progressing into a guaranteed failure -- three
    # attempts, 240s spent, nothing downloaded. The timeout therefore has to
    # clear the download at the WORST throughput worth completing, not the
    # healthy one: 180s puts that floor near 0.19 MB/s. The fast-fail case
    # the ladder exists to catch still gets its retry, and gets it whole: an
    # attempt that dies on DNS or a 5xx ends in seconds, so the second one
    # starts with the deadline almost untouched. An attempt that instead
    # spends the full 180s leaves no room for another, and the ladder says so
    # rather than restarting a non-resuming 34 MiB fetch it cannot finish.
    # The cache above is what keeps this path rare; the timeout is what keeps
    # it survivable when it is hit.
    #
    # ``uv sync`` sets no per-attempt timeout of its own, because a cold
    # cross-platform resolve has no honest fixed duration to pick. Its
    # deadline doubles as the bound, which does mean 240s is an accepted
    # UPPER LIMIT on a cold resolve, not an unbounded allowance: a sync still
    # running at 240s is failed deliberately. That is the right trade at this
    # budget -- a resolve that slow would exhaust the 300s job regardless, and
    # failing at the ladder names the cause instead of leaving a cancellation.
    #
    # The install directory is set per step rather than exported job-wide:
    # ``uv sync`` writes the interpreter's ABSOLUTE path into the project
    # venv's ``pyvenv.cfg``, so every later ``uv run`` in the job resolves it
    # through the venv and needs no variable of its own. Only the two steps
    # that place the interpreter and bind it have to agree on where it goes.
    - name: Install Python
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
        RETRY_CMD_ATTEMPT_TIMEOUT: "180"
        RETRY_CMD_DEADLINE: "240"
      run: |
        .github/scripts/retry_cmd.sh "uv python install" \
          uv python install "$PYTHON_VERSION"

    - name: Install dependencies
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
        RETRY_CMD_DEADLINE: "240"
      run: |
        .github/scripts/retry_cmd.sh "uv sync --frozen" \
          uv sync --frozen --python "$PYTHON_VERSION"
