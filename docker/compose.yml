# Named explicitly: Compose otherwise falls back to the basename of whatever
# directory it runs in, which namespaces every container and volume under a
# name that says nothing and that any other project in a like-named directory
# would share. The project name is the namespace `up`, `down` and `ps` act on.
name: synthorg

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Agent memory stores embeddings here, so the image needs the vector
    # extension; the pgvector variant supplies it without leaving the DHI
    # family's hardened posture for a community or hand-built image.
    # renovate: datasource=docker depName=dhi.io/pgvector
    image: dhi.io/pgvector:0.8-pg18-debian13@sha256:9387a618668fa8f90d0c9d3f4acaa5880f57caff2ab35809e1ea7d2375a17878
    ports:
      - "${POSTGRES_PORT:-3002}:5432"
    volumes:
      - synthorg-pgdata:/var/lib/postgresql/data
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: synthorg
      POSTGRES_USER: synthorg
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
      - /run/postgresql:noexec,nosuid,nodev,size=8m
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
          pids: 128
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "synthorg", "-d", "synthorg"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    logging: *logging

  # Fresh Docker named volumes are root-owned and every image here runs as a
  # non-root user that cannot self-chown, so ownership has to be set from
  # outside on first start.
  data-init:
    # renovate: datasource=docker depName=busybox
    image: busybox:1.38-musl@sha256:32b5cdad7cce41dfd53d0ae06baebcf8357a147ee7694dc706911c373bc30c37
    volumes:
      - synthorg-data:/data
      - synthorg-pgdata:/pgdata
      - synthorg-nats-data:/nats-data
    command: ["sh", "-c", "set -e; mkdir -p /data/logs /data/memory /data/tunnel; chown -R 65532:65532 /data; chown -R 70:70 /pgdata; chmod 0700 /pgdata; chown -R 65532:65532 /nats-data"]
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Sized to cap blast radius without throttling a first-run chown walk over
    # a large pre-existing volume.
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "1.0"
          pids: 64

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      # No default here on purpose: the backend Dockerfile treats a blank
      # BASE_IMAGE as a hard error rather than resolving a floating tag. CI
      # release builds pass a digest; the DAST workflow and local dev pass
      # `ghcr.io/aureliolo/synthorg-backend-base:main`.
      args:
        BASE_IMAGE: ${BASE_IMAGE}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - synthorg-data:/data
    depends_on:
      data-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # SYNTHORG_API_SERVER_HOST / _PORT below are settings the application
      # resolves, separate from the UVICORN_* image ENV that drives the actual
      # bind. They have to agree with it or the settings page reports a fiction
      # and the untrusted-proxy warning never fires.
      SYNTHORG_DATABASE_URL: "postgresql://synthorg:${POSTGRES_PASSWORD}@postgres:5432/synthorg"
      # Local docker-network postgres runs plaintext inside the bridge.
      # For production, override to `verify-full` with proper certs.
      SYNTHORG_POSTGRES_SSL_MODE: "disable"
      # Source cannot tell the process its own build identity:
      # `synthorg.__version__` is the last RELEASED version, so a pre-release
      # stack reports the previous release's number as its own. This file
      # builds from the worktree, so an unset tag reads as the source version,
      # which is then the true answer.
      SYNTHORG_IMAGE_TAG: "${SYNTHORG_IMAGE_TAG:-}"
      SYNTHORG_MEMORY_DIR: "/data/memory"
      SYNTHORG_PERSISTENCE_BACKEND: "postgres"
      SYNTHORG_BUS_BACKEND: "${SYNTHORG_BUS_BACKEND:-nats}"
      SYNTHORG_LOG_LEVEL: "${SYNTHORG_LOG_LEVEL:-info}"
      # From here to the cassette pair are the settings the product marks
      # compose_set: nothing inside the process can change them, so every
      # launcher has to pass every one or the label is a lie for this
      # deployment path. Held to the CLI's own template by
      # scripts/check_setting_compose_backed.py. What follows the pair is
      # ordinary env-layer seeding of live settings, which the gate ignores.
      SYNTHORG_API_SERVER_HOST: "0.0.0.0"
      SYNTHORG_API_SERVER_PORT: "3001"
      SYNTHORG_NATS_URL: "${SYNTHORG_NATS_URL:-nats://nats:4222}"
      SYNTHORG_LOG_DIR: "${SYNTHORG_LOG_DIR:-/data/logs}"
      SYNTHORG_TUNNEL_STATE_DIR: "/data/tunnel"
      SYNTHORG_API_API_PREFIX: "${SYNTHORG_API_API_PREFIX:-/api/v1}"
      SYNTHORG_API_SSL_CERTFILE: "${SYNTHORG_API_SSL_CERTFILE:-}"
      SYNTHORG_API_SSL_KEYFILE: "${SYNTHORG_API_SSL_KEYFILE:-}"
      SYNTHORG_API_SSL_CA_CERTS: "${SYNTHORG_API_SSL_CA_CERTS:-}"
      SYNTHORG_API_TRUSTED_PROXIES: "${SYNTHORG_API_TRUSTED_PROXIES:-[]}"
      SYNTHORG_API_CORS_ALLOWED_ORIGINS: "${SYNTHORG_API_CORS_ALLOWED_ORIGINS:-[]}"
      SYNTHORG_API_AUTH_EXCLUDE_PATHS: "${SYNTHORG_API_AUTH_EXCLUDE_PATHS:-}"
      SYNTHORG_API_RATE_LIMIT_EXCLUDE_PATHS: "${SYNTHORG_API_RATE_LIMIT_EXCLUDE_PATHS:-}"
      SYNTHORG_API_REQUEST_MAX_BODY_SIZE_BYTES: "${SYNTHORG_API_REQUEST_MAX_BODY_SIZE_BYTES:-10485760}"
      SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_FREETSA: "${SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_FREETSA:-https://freetsa.org/tsr}"
      SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_DIGICERT: "${SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_DIGICERT:-https://timestamp.digicert.com}"
      SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_SECTIGO: "${SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_SECTIGO:-https://timestamp.sectigo.com}"
      SYNTHORG_PROVIDERS_CASSETTE_MODE: "${SYNTHORG_PROVIDERS_CASSETTE_MODE:-off}"
      SYNTHORG_PROVIDERS_CASSETTE_PATH: "${SYNTHORG_PROVIDERS_CASSETTE_PATH:-}"
      # Blank falls through to the pinned default the image ships; the CLI
      # substitutes a digest-pinned ref here when the operator enables the
      # sandbox at init time.
      SYNTHORG_SANDBOX_IMAGE: "${SYNTHORG_SANDBOX_IMAGE:-}"
      SYNTHORG_SIDECAR_IMAGE: "${SYNTHORG_SIDECAR_IMAGE:-}"
      SYNTHORG_FINE_TUNE_IMAGE: "${SYNTHORG_FINE_TUNE_IMAGE:-}"
      SYNTHORG_OPENHANDS_IMAGE: "${SYNTHORG_OPENHANDS_IMAGE:-}"
      # The OpenHands loop container runs on the default bridge network, not
      # synthorg-net, so a compose service name does not resolve for it: the
      # loop gives its container a `host.docker.internal:host-gateway` alias
      # and these point at the published port instead. Derived from the values
      # the bind above uses, so a standard deployment needs no hand
      # configuration. The container appends `/mcp` to the MCP base itself.
      SYNTHORG_PROVIDERS_GATEWAY_BASE_URL: "${SYNTHORG_PROVIDERS_GATEWAY_BASE_URL:-http://host.docker.internal:${BACKEND_PORT:-3001}${SYNTHORG_API_API_PREFIX:-/api/v1}/gateway/v1}"
      SYNTHORG_TOOLS_CREDENTIALED_MCP_BASE_URL: "${SYNTHORG_TOOLS_CREDENTIALED_MCP_BASE_URL:-http://host.docker.internal:${BACKEND_PORT:-3001}${SYNTHORG_API_API_PREFIX:-/api/v1}/mcp-gateway}"
    # No `user:` here because the Dockerfile already sets USER 65532.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
    # Sized to the whole lifespan shutdown rather than to uvicorn's own
    # timeout. The contract, and the constants this is the sum of, are derived
    # in docs/design/deployment.md; they and this number move together.
    stop_grace_period: 120s
    stop_signal: SIGTERM
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
          pids: 256
    logging: *logging

  web:
    image: ghcr.io/aureliolo/synthorg-web:${SYNTHORG_IMAGE_TAG:-latest}
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    # No `user:` here because docker/web/apko.yaml already sets run-as 65532.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # The uid/gid on each mount is load-bearing: a tmpfs defaults to
      # root-owned, which Caddy (65532) cannot write, breaking autosave,
      # instance-UUID persistence, and the storage_clean lock dir under
      # /data/caddy, and dropping it back to read-only mode.
      - /tmp:noexec,nosuid,nodev,size=16m,uid=65532,gid=65532
      - /config/caddy:noexec,nosuid,nodev,size=8m,uid=65532,gid=65532
      - /data/caddy:noexec,nosuid,nodev,size=16m,uid=65532,gid=65532
    healthcheck:
      # wget is in the apko image solely for this probe, and 127.0.0.1 keeps
      # DNS out of the probe hot path.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 64
    logging: *logging

  # Config comes from a bind-mounted file because NATS has no --max_payload
  # CLI flag, so anything diverging from the defaults cannot be passed as an
  # argument. No healthcheck: the DHI image is distroless, and liveness
  # surfaces at the application layer instead (see below).
  nats:
    # renovate: datasource=docker depName=dhi.io/nats
    image: dhi.io/nats:2.14-debian13@sha256:6e380f3a2910ab38b7b9b018c6a8bfb7eda8fb86426b4c408e3eef044314a2a6
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "${NATS_CLIENT_PORT:-3003}:4222"
      # Uncomment to expose the NATS monitoring endpoint (/varz, /healthz,
      # server stats) to the host for debugging. It is UNAUTHENTICATED, so
      # leave it off by default; backend /api/v1/readyz is the supported
      # health path.
      # - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - synthorg-nats-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    depends_on:
      data-init:
        condition: service_completed_successfully
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=16m
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 64
    logging: *logging

  # No NATS health sidecar here on purpose: `NatsBus.health_check` does a live
  # PING/PONG that the backend reports at /api/v1/readyz, and nothing in
  # compose ever consumed the sidecar's `service_healthy` state, so it was a
  # container bought for a green dot in `docker ps`.

  # No fine-tune service here on purpose: the backend spawns an ephemeral
  # one-shot container per torch-bound stage over the Docker API and removes
  # it on exit.

networks:
  default:
    name: synthorg-net

volumes:
  synthorg-data:
  synthorg-pgdata:
  synthorg-nats-data:
