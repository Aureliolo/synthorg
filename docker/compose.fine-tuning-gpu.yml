# Overlay for the embedding fine-tuning sidecar, GPU variant.
#
# Merge this on top of docker/compose.yml to add the fine-tune
# service backed by the CUDA-bundled image (~4 GB download / ~7 GB on disk). Requires an
# NVIDIA GPU + driver on the host:
#
#   docker compose \
#     -f docker/compose.yml \
#     -f docker/compose.fine-tuning-gpu.yml \
#     up
#
# The CLI-generated compose.yml (written by `synthorg init`) uses a
# different wiring: it picks the variant based on `fine_tuning_variant`
# in config.json and pins the image via the sigstore-verified digest
# stored in `verified_digests`. This overlay is for users running
# `docker compose` directly without the CLI. The tag resolves from
# the `SYNTHORG_IMAGE_TAG` env var (default `latest`), mirroring how
# `synthorg-web` and `synthorg-backend` are wired in `compose.yml`;
# the release pipeline that publishes `synthorg-fine-tune-gpu` also
# tags `:latest` so the floating tag tracks the most recent build.
# Users who want digest pinning should use the CLI-generated compose.
#
# Runs as UID 10003 -- a dedicated non-root user for security
# isolation from sandbox (10001), sidecar (10002), and backend
# (65532). The shared /data volume is owned by 65532; group_add gives
# this container read access to group-readable files the backend
# writes.

services:
  fine-tune:
    image: ghcr.io/aureliolo/synthorg-fine-tune-gpu:${SYNTHORG_IMAGE_TAG:-latest}
    volumes:
      - synthorg-data:/data:ro
    depends_on:
      backend:
        # Gate the sidecar on the backend's image-level HEALTHCHECK
        # (python-urllib probe against /api/v1/readyz in
        # ``docker/backend/Dockerfile``) so fine-tune does not start
        # talking to a backend that is still running migrations or
        # wiring dependents.
        condition: service_healthy
    group_add:
      - "65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # Durable training output (checkpoints, exported models) is the
    # orchestrator's job: the CLI/backend that drives a real fine-tune
    # mounts a writable output target. /data here is read-only source
    # data, so a direct `docker compose` run must add its own output
    # volume to persist artefacts beyond container life.
    tmpfs:
      # read_only rootfs + /data mounted :ro leaves nowhere for the stdlib
      # tempfile / library scratch writes the training stages make. Give
      # them a writable /tmp so training does not fail on the locked rootfs.
      # No noexec: torch-inductor JIT caches and dlopens compiled kernels
      # from /tmp (default /tmp/torchinductor_*), so /tmp must allow exec.
      # mode=1777: a bare tmpfs defaults to 0755 root-owned, which a
      # non-root training user cannot write to; pin the sticky
      # world-writable mode a real /tmp uses so scratch writes succeed.
      - /tmp:nosuid,nodev,size=1g,mode=1777
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
          pids: 512
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
