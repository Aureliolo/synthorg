# Vale prose linter configuration.
#
# Enforces Google's documentation style + a British-English vocabulary on
# top-level READMEs, every CLAUDE.md tier, and docs/**/*.md. The rule
# ledger is this file: the disables below, the token masks above them,
# and the error-level block at the bottom are the whole definition of
# what the gate means.
#
# The binary's pin lives in scripts/install_cli_tools.sh (VALE_VERSION)
# and is installed once per machine by that script; the gitignored
# .vale/styles/Google/ package is populated lazily on the first pre-push
# in each worktree by scripts/vale-prepush.sh (the wrapper wired into
# the pre-push hook).
#
# TWO pins define this gate, not one. The binary decides how a rule is
# applied, so draining the corpus against a stale local binary proves
# nothing about CI: on an identical style package, 3.17.0 reported 137
# findings that 3.14.2 did not, because it changed how a heading and a
# sentence are segmented. `install_cli_tools.sh vale` is idempotent and
# upgrades in place; run it before trusting a clean local run.
#
# The Google package is pinned to a release URL rather than the bare
# name `Google`, which resolves to whatever the upstream releases feed
# serves today. The disable ledger below was reviewed rule by rule
# against this corpus, and the corpus was drained to zero against the
# rules that survived; an unpinned package silently redefines what the
# gate means. v0.7.0 demonstrated it, adding four rules (Anthropomorphism,
# ExcessiveClaims, Jargon and Timeless) plus WordListCase, the
# case-variant half of the WordList rule this file deliberately disables,
# for 820 findings in prose nobody had touched. Bumping the pin is a
# deliberate act: re-review the new rules against the ledger, then drain
# whatever survives.
#
# Every rule the ledger keeps is assigned `= error` below, because vale's
# exit code reflects ONLY error-severity alerts (`--no-exit` is documented
# as "Don't return a nonzero exit code on errors") and every rule the
# Google package ships is a warning or a suggestion. Left at their shipped
# severity the whole package prints and exits 0, so the drained corpus was
# held by hand rather than by the gate: one run reported 820 findings and
# still went green. MinAlertLevel is a reporting floor and does not affect
# the exit code, so it cannot substitute.
#
# British is MANDATORY per docs/reference/conventions.md and
# CLAUDE.md: the Vocab below adds British forms to every spelling
# exception list and lists American-only forms in reject.txt so
# Vale.Avoid flags them on new prose.

StylesPath = .vale/styles
# renovate: datasource=github-releases depName=errata-ai/Google
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip
MinAlertLevel = suggestion
# Two vocabularies. The SynthOrg one
# (`.vale/styles/config/vocabularies/SynthOrg/`) is the lowercase
# tech / proper-noun list shared with codespell via `ignore-words` in
# `.codespellrc`. The British one
# (`.vale/styles/config/vocabularies/British/`) carries British
# spellings (accept.txt, case-insensitive) and the matching American
# forms (reject.txt, drives Vale.Avoid).
Vocab = SynthOrg, British

[*.md]
BasedOnStyles = Vale, Google, SynthOrg

# Three masks, applied to body prose. The Markdown parser already skips
# fenced code blocks and inline code spans, but bare URLs and directives
# in prose leak through without these.
#
# Two constraints on any mask added here, both measured rather than
# assumed. TokenIgnores does NOT reach YAML frontmatter: a `title:` or
# `description:` value is linted unmasked, so a page whose body may carry
# a masked term must still keep that term out of its frontmatter (this
# one fails toward a reported finding, never toward a silent pass). And
# a pattern must not swallow Markdown structure: masking `1. ` un-makes
# every ordered list, masking the space after `##` un-makes the heading,
# and vale then scopes the surrounding prose as something it is not,
# which reports findings on lines that have nothing wrong with them.
#
# The first pattern masks URLs so Vale.Avoid does not read "optimization"
# inside a github.com path, and Vale.Spelling does not read URL path
# segments as misspelled words.
#
# The second pattern masks mkdocstrings `:::` directives (e.g.
# `::: synthorg.budget.optimizer`). These are CODE references --
# they must match the actual Python module name, which often uses
# American spelling (`optimizer`, `serializer`, ...) regardless of
# our British prose convention. Without this mask, Vale.Avoid would
# flag the directive token and force the module to be renamed just
# to satisfy a prose rule.
#
# The third pattern masks "best-effort". It is a fixed term with a precise
# meaning (the work is attempted, delivery is not promised, and a failure
# does not propagate to the caller), not a superlative, and no synonym
# carries all three halves. Google's own ExcessiveClaims rule carves out
# "best practices" on exactly this reasoning; the compound is 61 of the 122
# hits that rule produced here, and rewriting them would cost meaning to
# satisfy a rule aimed at marketing copy. Masked at the token level rather
# than by disabling the rule, so the genuine claims it catches still block.
#
TokenIgnores = (https?://[^\s)"]+), (:::\s+[\w.]+), ((?i)best-effort)

# Vale.Terms is the auto-generated rule that enforces the EXACT casing
# of accept.txt entries. Disabled because the SynthOrg vocab is
# lowercase by codespell convention -- with Vale.Terms enabled, every
# "SynthOrg" / "Pydantic" / "Litestar" in our prose would be flagged
# as the wrong case. Vale.Avoid (the auto-generated rule that flags
# reject.txt entries) stays enabled; it is what catches American
# spellings on new prose.
Vale.Terms = NO

# Google rule disables, one per line with the project-style reason. Each
# rule was reviewed against actual existing prose (README + every
# CLAUDE.md tier + docs/) before being disabled; the rest of Google's
# package is kept and the corpus is drained to zero against them.

# Why: project uses formal style without contractions ("do not", not
# "don't") so the codebase tone matches engineering writing rather than
# marketing copy. Google's rule actively wants contractions.
Google.Contractions = NO

# Why: project uses Title Case in headings consistently across README and
# every CLAUDE.md tier; Google's rule wants sentence case.
Google.Headings = NO

# Why: technical infrastructure prose legitimately uses passive voice
# ("is wired into", "are built", "the gate is run at pre-push"). Active
# voice is preferred when the actor matters, but the audit found no real
# value in flagging passive across our docs.
Google.Passive = NO

# Why: parenthetical clarifications are standard in technical
# documentation; the project uses them heavily and intentionally.
Google.Parens = NO

# Why: semicolons appear in compound technical prose throughout the
# project; not a docs-style concern at our level.
Google.Semicolons = NO

# Why: project uses "i.e." and "e.g." (clear, concise, established
# convention in our docs and CLAUDE.md tiers).
Google.Latin = NO

# Why: replaced by SynthOrg.HeadingPunctuation, which carries the same
# message, link and fix action. Upstream's token has a digit branch that
# matches the enumerator of a numbered heading (`## 1. Foo`), because
# vale segments a heading into sentences before matching and "1." is one
# of them. That flagged 99 numbered headings here, none of which end in
# a period. See .vale/styles/SynthOrg/HeadingPunctuation.yml.
Google.HeadingPunctuation = NO

# Why: the case-variant half of WordList, split out upstream in v0.7.0.
# The split severed the rule from the exemption WordList carries below,
# so it re-flagged the same 565 terms that rule exists to allow, and in
# both directions on one corpus ("admin" to "administrator", but also
# "application" to "app"). One upstream rule, one disposition.
Google.WordListCase = NO

# Why: project uses "will" for future-tense framing in roadmap, status,
# and rollout descriptions. Disallowing it would force present-tense
# rewrites of every forward-looking sentence.
Google.Will = NO

# Why: project routinely uses "we" as the collective project voice
# (README + design docs + ADRs). Removing it would force impersonal
# phrasing that doesn't match the documentation tone.
Google.We = NO

# Why: companion to Google.We above; first-person usage is part of the
# documentation voice.
Google.FirstPerson = NO

# Why: project uses "..." in some prose contexts (e.g. enumerating
# examples) where the ellipsis is the clearest expression.
Google.Ellipses = NO

# Why: docs use many domain-specific acronyms (LLM, REST, JWT, CRUD,
# MVCC, AST, SSRF, CSP, RAG, MTEB, RPC, SHA, DAG, RFC, MIT, LGPL, ...)
# plus emphasis-cased words (KEEP, PASS, NOT, INFO, MUST, AND) that
# Google's 3-5-uppercase pattern misclassifies as undefined acronyms.
# Maintaining an extended exceptions list for the rule would itself
# need a gate; we rely on context for first-use clarity instead.
Google.Acronyms = NO

# Why: Google's WordList is calibrated for consumer documentation
# (wants "command-line tool" instead of "CLI", "application" instead
# of "app", "administrator" instead of "admin", "regular expression"
# instead of "regex", "preceding" instead of "above"). These are wrong
# for developer-facing technical docs where CLI / app / admin / regex
# are standard parlance and shorter forms read better.
Google.WordList = NO

# Why: British convention allows a capital letter after a colon when
# the following text is a complete clause. Google's rule wants
# lowercase universally; fires on legitimate full-clause continuations
# throughout the docs.
Google.Colons = NO

# Why: project uses bare "30s" / "120s" / "503s" notation in code-
# and HTTP-context prose (timeouts, status codes); these are not
# scientific units and don't benefit from the SI-style space.
Google.Units = NO

# Why: British convention puts commas and periods outside quotation
# marks when they are not part of the quoted material (logical
# quoting). Google's rule wants American-style typesetter quoting
# (always inside); this conflicts with our British house style.
Google.Quotes = NO

# Why: Google's LyHyphens rule is calibrated for adverb + adjective
# compounds ("rapidly developing" not "rapidly-developing"), but
# misfires across our docs on legitimate hyphenated compound nouns
# and adjectives where the first element is a noun or non-ly
# adjective (early-return, supply-chain, anomaly-based, code-path).
# The false-positive rate is too high to triage line-by-line.
Google.LyHyphens = NO

# Every rule the ledger above keeps, raised to error so the gate can
# actually fail. See the header for why warning and suggestion levels
# are unenforceable. Adding a Google rule to this file means choosing a
# line here or a line above; leaving it out of both silently re-creates
# a rule that reports and never blocks.
Google.AMPM = error
Google.Anthropomorphism = error
Google.DateFormat = error
Google.EmDash = error
Google.ExcessiveClaims = error
Google.Exclamation = error
Google.Gender = error
Google.GenderBias = error
Google.Jargon = error
Google.OptionalPlurals = error
Google.Ordinal = error
Google.OxfordComma = error
Google.Periods = error
Google.Ranges = error
Google.Slang = error
Google.Spacing = error
Google.Spelling = error
Google.Timeless = error

# Project rules under .vale/styles/SynthOrg/ (tracked, unlike the synced
# Google package). Each declares `level: error` in its own file; the line
# here keeps one ledger to read rather than two.
SynthOrg.HeadingPunctuation = error
