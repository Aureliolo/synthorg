name: Release - Highlights (dry-run)

# Manual dry-run of the release-notes tagline + Highlights code path that
# lives inside release-cut.yml. Lets the repo owner exercise the Mistral
# integration against a real commit range WITHOUT waiting for a release and
# WITHOUT editing any real PR. Output lands in the run's step summary only.
#
# It also answers "which models can this key actually call", because a plan's
# model entitlement is not published anywhere and the API is the only place to
# ask. That is the question a `tier_not_allowed` failure raises.
#
# The prompt and the digest builder are the SAME files release-cut.yml uses
# (`.github/release-highlights-prompt.md`, `scripts/build_release_digest.py`),
# and `reasoning_effort` / `max_tokens` default to what release-cut.yml
# actually sends, so a bare dispatch is a rehearsal rather than a lookalike.
# The model is the one knob meant to be touched on every run.
#
# Scope discipline:
#   - workflow_dispatch only (no schedule, no push, no PR trigger).
#   - Gated to ``github.actor == github.repository_owner`` so additional
#     collaborators with ``write`` access cannot invoke it. Also makes
#     the workflow fork-friendly: it skips silently in any fork whose
#     owner isn't the user dispatching it.
#   - Declares only ``contents: read`` -- no ``pull-requests: write`` and
#     no App token, so it cannot mutate any repo state even if a bug or
#     malicious input tried to.
#   - References only the read-only ``MISTRAL_API_KEY`` secret. The App
#     token is intentionally not minted here -- this is a model-call smoke test.

on:
  workflow_dispatch:
    inputs:
      model:
        description: >-
          Mistral model to exercise. Defaults to the one release-cut.yml
          ships. Use the model list in the step summary to pick a
          candidate when the shipped one starts refusing.
        type: string
        required: false
        default: "mistral-medium-latest"
      base:
        description: >-
          Git ref to compare from. Blank uses the latest stable release,
          which is what release-cut.yml does.
        type: string
        required: false
        default: ""
      head:
        description: "Git ref to compare to."
        type: string
        required: false
        default: "main"
      changelog_sample:
        description: >-
          Optional literal digest to summarise instead of the commit range
          above. Interpreted as untrusted data and wrapped in an
          <untrusted-changelog> fence before the model sees it.
        type: string
        required: false
        default: ""
      reasoning_effort:
        description: >-
          Mistral reasoning_effort ("none", "low", "medium", "high").
          Defaults to "high" to match what release-cut.yml sends. Clear it
          (blank) for a no-reasoning control run, or when probing a
          candidate model: check the model list in the step summary first,
          since a model that does not support this field rejects any
          non-blank value with HTTP 422.
        type: string
        required: false
        default: "high"

permissions: {}

concurrency:
  group: test-highlights
  cancel-in-progress: false

jobs:
  run:
    name: Dry-run Mistral Highlights
    # Actor gate: workflow_dispatch on a public repo already requires
    # ``write`` access, but the extra explicit check forbids every
    # collaborator except the owner. Keeps the Mistral spend under a
    # single, auditable trigger surface.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: List models this key can call
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set -euo pipefail
          # `/v1/models` lists the whole catalogue regardless of plan, so the
          # id appearing here is necessary but not sufficient; a completion
          # is the only real entitlement test, and that is what the generate
          # step below performs for the selected model.
          # Deadlines, because a server that accepts the connection and then
          # stalls would otherwise spend the whole 10-minute job budget here
          # and the generate step below would never run.
          RESP=$(curl -sS --connect-timeout 15 --max-time 60 \
            -w '\n%{http_code}' \
            https://api.mistral.ai/v1/models \
            -H "Authorization: Bearer $MISTRAL_API_KEY") || {
              echo "::warning::could not reach the models endpoint"
              exit 0
            }
          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          {
            echo "## Chat models visible to this key"
            echo ""
            if [ "$CODE" != "200" ]; then
              echo "Models endpoint returned HTTP ${CODE}."
            else
              echo '| Model | Context |'
              echo '|---|---|'
              printf '%s' "$BODY" | jq -r '
                .data[]
                | select(.capabilities.completion_chat == true)
                | "| `\(.id)` | \(.max_context_length) |"' | sort
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build changelog digest
        env:
          GH_TOKEN: ${{ github.token }}
          SAMPLE: ${{ inputs.changelog_sample }}
          BASE_INPUT: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
        run: |
          set -euo pipefail
          # A ref reaches `gh api` in a URL path. The actor gate above already
          # limits this to the repository owner, so this is hygiene rather than
          # a control: it keeps a future loosening of that gate from turning
          # these inputs into a way to read other repositories.
          for ref in "$BASE_INPUT" "$HEAD_REF"; do
            case "$ref" in
              "" | *[!A-Za-z0-9._/-]*)
                if [ -n "$ref" ]; then
                  echo "::error::ref '${ref}' contains characters a git ref cannot hold"
                  exit 1
                fi
                ;;
            esac
          done

          if [ -n "${SAMPLE//[[:space:]]/}" ]; then
            # The sample is fenced by the same code path as a real digest, so
            # a hand-pasted payload rehearses the escape too.
            printf '%s' "$SAMPLE" \
              | python3 -c 'import sys; from scripts.build_release_digest import fence; sys.stdout.write(fence(sys.stdin.read()))' \
              > changelog-digest.txt
            echo "Using the supplied sample digest."
          else
            BASE="$BASE_INPUT"
            if [ -z "$BASE" ]; then
              BASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
            fi
            echo "Building digest for ${BASE}...${HEAD_REF}"
            # The script owns the untrusted-content fence and its closing-tag
            # escape, so this rehearses the real wrapper rather than a copy.
            gh api "repos/$GITHUB_REPOSITORY/compare/${BASE}...${HEAD_REF}" \
              | python3 scripts/build_release_digest.py > changelog-digest.txt
          fi

          echo "Digest length: $(wc -c < changelog-digest.txt) bytes"

      - name: Generate Highlights via Mistral
        id: highlights
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ inputs.model }}
          REASONING_EFFORT: ${{ inputs.reasoning_effort }}
        run: |
          set -euo pipefail
          # A thinking chunk eats into max_tokens before the final answer is
          # written, so a reasoning call needs more headroom than a plain
          # one or the answer can be truncated away entirely. "none" and
          # blank both mean no reasoning happens, so both stay at the lower
          # budget; keep this pairing in sync with release-cut.yml's own
          # max_tokens if either changes.
          MAX_TOKENS=4000
          case "$REASONING_EFFORT" in
            "" | none) ;;
            *) MAX_TOKENS=12000 ;;
          esac
          PAYLOAD=$(jq -n \
            --arg model "$MISTRAL_MODEL" \
            --arg reasoning "$REASONING_EFFORT" \
            --argjson max_tokens "$MAX_TOKENS" \
            --rawfile sys .github/release-highlights-prompt.md \
            --rawfile digest changelog-digest.txt \
            '{model: $model, temperature: 0.4, max_tokens: $max_tokens,
              messages: [{role: "system", content: $sys},
                         {role: "user", content: $digest}]}
             + (if $reasoning != "" then {reasoning_effort: $reasoning} else {} end)')

          # rc capture (missing here previously): a thinking chunk can push
          # generation past --max-time, and under `pipefail` an uncaught
          # curl failure kills the step with no diagnostic in the one tool
          # meant to diagnose exactly this.
          rc=0
          RESP=$(printf '%s' "$PAYLOAD" | curl -sS \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            -w '\n%{http_code}' \
            -X POST https://api.mistral.ai/v1/chat/completions \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @-) || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Mistral request failed (transport, curl exit ${rc})"
            exit 1
          fi
          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          if [ "$CODE" != "200" ]; then
            # Named error fields only: this log is public and the raw body is
            # a third party's text, not ours to republish wholesale.
            DETAIL=$(printf '%s' "$BODY" \
              | jq -r '[.type // .object, .code, .message] | map(select(. != null)) | join(" ")' 2>/dev/null \
              | head -c 200) || DETAIL=""
            echo "::error::Mistral returned HTTP ${CODE}: ${DETAIL:-no parsable error fields}"
            exit 1
          fi
          # reasoning_effort makes message.content a list of {type, ...}
          # chunks (thinking + text) instead of a plain string; without
          # reasoning it stays a plain string. Handle both.
          CONTENT=$(printf '%s' "$BODY" | jq -r '
            .choices[0].message.content as $c
            | if ($c | type) == "array"
              then [$c[] | select(.type == "text") | .text] | join("")
              else ($c // empty)
              end')
          THINKING_CHARS=$(printf '%s' "$BODY" | jq -r '
            [.choices[0].message.content // [] | .[]?
             | select(.type == "thinking") | .thinking[]? | .text // empty]
            | join("") | length')
          echo "thinking_chars=$THINKING_CHARS" >> "$GITHUB_OUTPUT"
          USAGE=$(printf '%s' "$BODY" | jq -r '.usage | "\(.prompt_tokens) in / \(.completion_tokens) out"')
          echo "usage=$USAGE" >> "$GITHUB_OUTPUT"
          # Randomised token (see release-cut.yml rationale): model output
          # derives from untrusted commit prose, so a fixed marker could be
          # smuggled in to truncate the heredoc value below, and the same
          # content could forge an `::error::`/`::warning::`/`::add-mask::`
          # workflow command in this public log. `::stop-commands::` before
          # the print and the matching `::<token>::` after close both; the
          # step summary renders client-side and cannot be fetched through
          # the API or a raw log dump, so this echo is deliberately the only
          # way to recover the raw content programmatically
          # (`gh run view --log`), which matters for comparing runs against
          # each other, not just reading one.
          DELIM="HIGHLIGHTS_RESPONSE_$(openssl rand -hex 12)"
          echo "::group::raw content"
          echo "::stop-commands::${DELIM}"
          printf '%s\n' "$CONTENT"
          echo "::${DELIM}::"
          echo "::endgroup::"
          {
            printf 'response<<%s\n' "$DELIM"
            printf '%s\n' "$CONTENT"
            printf '%s\n' "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Write Highlights to step summary
        env:
          RESPONSE: ${{ steps.highlights.outputs.response }}
          USAGE: ${{ steps.highlights.outputs.usage }}
          MISTRAL_MODEL: ${{ inputs.model }}
          REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          THINKING_CHARS: ${{ steps.highlights.outputs.thinking_chars }}
        run: |
          set -euo pipefail
          {
            echo "## Highlights dry-run"
            echo ""
            echo "**Model**: \`${MISTRAL_MODEL}\` via Mistral"
            echo "**Reasoning effort**: \`${REASONING_EFFORT:-<none>}\`"
            echo "**Tokens**: ${USAGE}"
            echo "**Thinking chars**: ${THINKING_CHARS:-0}"
            echo ""
            # Every kind of whitespace, not just spaces: a reply of newlines
            # or tabs passes a space-only test, and the `grep` below then
            # matches nothing and exits non-zero, which under `pipefail`
            # kills the step before it can print this fallback.
            if [ -z "${RESPONSE//[[:space:]]/}" ]; then
              echo "_No response returned. Check the preceding step's log._"
              exit 0
            fi
            echo "---"
            echo ""
            echo "Rendered as release-cut.yml would publish it, minus the sticky-marker wrapper:"
            echo ""
            echo "## Highlights"
            echo ""
            # First NON-BLANK line, matching release-cut.yml: reading line 1
            # alone lets one leading blank line publish the raw `TAGLINE:`
            # string as if it were prose.
            TAGLINE_LINE=$(printf '%s\n' "$RESPONSE" | grep -n -m1 '[^[:space:]]' | cut -d: -f1)
            TAGLINE=""
            HAS_MARKER=0
            if [ -n "$TAGLINE_LINE" ]; then
              # Whether the marker is THERE and what value it carries are two
              # questions. Answering only the second leaves a bare `TAGLINE:`
              # to fall through to the else-branch, which prints the response
              # whole and so publishes the raw marker as if it were prose.
              if printf '%s\n' "$RESPONSE" \
                | sed -n "${TAGLINE_LINE}p" \
                | grep -q '^[[:space:]]*TAGLINE:'; then
                HAS_MARKER=1
              fi
              TAGLINE=$(printf '%s\n' "$RESPONSE" \
                | sed -n "${TAGLINE_LINE}s/^[[:space:]]*TAGLINE:[[:space:]]*//p")
            fi
            # The marker line is dropped whenever it is present, with or
            # without a value; only the tagline's own rendering is conditional.
            BODY=$(printf '%s\n' "$RESPONSE")
            if [ "$HAS_MARKER" -eq 1 ]; then
              BODY=$(printf '%s\n' "$RESPONSE" | sed "${TAGLINE_LINE}d")
            fi
            echo "> _AI-generated summary (model: \`${MISTRAL_MODEL}\` via Mistral). Commit-based changelog below._"
            echo ""
            if [ -n "${TAGLINE//[[:space:]]/}" ]; then
              printf '_%s_\n\n' "$TAGLINE"
            else
              echo "_Model emitted no TAGLINE line._"
              echo ""
            fi
            printf '%s\n' "$BODY"
            echo ""
            echo "---"
            echo ""
            echo "_No PR was edited. This run is a pure model-call smoke test._"
          } >> "$GITHUB_STEP_SUMMARY"
