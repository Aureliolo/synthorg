name: CLI

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Gate: detect if CLI files changed (for tag-triggered runs, always true) ──
  cli-changes:
    name: Detect CLI Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.filter.outputs.cli || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      # fetch-depth: 0. See ci.yml Detect Changes for full rationale:
      # paths-filter on push: events races on shallow checkouts.
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          filters: |
            cli:
              - 'cli/**'

  # ── Lint ──
  cli-lint:
    name: CLI Lint
    needs: cli-changes
    if: needs.cli-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: cli/go.mod
          cache: false
      - uses: ./.github/actions/go-mod-download-retry
        with:
          working-directory: cli

      - name: go vet
        working-directory: cli
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.12.2
          working-directory: cli

  # ── Test (multi-platform) ──
  cli-test:
    name: CLI Test (${{ matrix.os }})
    needs: cli-changes
    if: needs.cli-changes.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: cli/go.mod
          cache: false
      - uses: ./.github/actions/go-mod-download-retry
        with:
          working-directory: cli

      - name: Run tests with race detector and coverage
        working-directory: cli
        shell: bash
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-coverage
          path: cli/coverage.out

  # ── Build (compile check for all targets) ──
  cli-build:
    name: CLI Build
    needs: cli-changes
    if: needs.cli-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: cli/go.mod
          cache: false
      - uses: ./.github/actions/go-mod-download-retry
        with:
          working-directory: cli

      - name: Build
        id: build
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          # On the linux/amd64 cell, build to a real path so the
          # smoke step below can execute it. All other matrix cells
          # cross-compile to /dev/null -- they are compile-only
          # checks; their binaries cannot be executed on this Linux
          # runner.
          if [ "${GOOS}" = "linux" ] && [ "${GOARCH}" = "amd64" ]; then
            mkdir -p /tmp/cli-smoke
            go build -ldflags="-s -w" -o /tmp/cli-smoke/synthorg ./main.go
            echo "binary=/tmp/cli-smoke/synthorg" >> "$GITHUB_OUTPUT"
          else
            go build -ldflags="-s -w" -o /dev/null ./main.go
          fi

      # Smoke-test only the linux/amd64 matrix cell -- it is the
      # only goos/goarch combination the runner can execute (cross-
      # compiled darwin / windows binaries cannot run on Linux).
      # The matrix gate is the ONLY scoping; the smoke runs on every
      # event that triggers cli-build (PR, push to main, v* tag
      # pushes, workflow_dispatch) -- intentionally NOT gated to
      # PRs only. Catches `unknown flag`, crashes on startup,
      # missing cgo deps, etc.
      #
      # Why every event, not just PRs:
      #   - PR path: fails the originating PR with a red ❌ on the
      #     commit row.
      #   - push to main: catches regressions in commits that did
      #     NOT come through PR CI -- auto-rollover empty commits,
      #     release-please bumps, hotfixes pushed via the CLI, etc.
      #     Without smoke here, those commits would let cli-release
      #     ship a broken binary straight to a release.
      #   - tag push: same for graduate.yml + manual tags. The
      #     cli-release job downstream runs GoReleaser; if the
      #     binary was broken, the GoReleaser archive ships broken.
      #   - workflow_dispatch: protects ad-hoc rebuilds.
      #
      # Earlier the smoke lived in finalize-release.yml and ran
      # only after a tag was already cut. Running here makes it the
      # SOURCE OF TRUTH gate; finalize-release no longer re-tests.
      - name: Smoke-test CLI binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: ./.github/actions/smoke-test-cli-binary
        with:
          binary-path: ${{ steps.build.outputs.binary }}

  # ── Bench regression (in-CI A/B compare) ──
  cli-bench:
    name: CLI Bench Regression
    needs: cli-changes
    if: needs.cli-changes.outputs.changed == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history so merge-base lookup against origin/main
          # resolves regardless of how far the PR diverged. A shallow
          # clone (e.g. ``--depth=50``) would silently fail to find
          # the merge-base for long-lived branches.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: cli/go.mod
          cache: false
      - uses: ./.github/actions/go-mod-download-retry
        with:
          working-directory: cli

      - name: Run CLI bench A/B (HEAD vs merge-base)
        env:
          BENCH_COUNT: 10
          THRESHOLD_PCT: 15
        run: bash scripts/check_cli_bench_regression.sh

  # ── Vulnerability check ──
  cli-vuln:
    name: CLI Vulnerability Check
    needs: cli-changes
    if: needs.cli-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: cli/go.mod
          cache: false
      - uses: ./.github/actions/go-mod-download-retry
        with:
          working-directory: cli

      # ``go install`` is a separate network fetch (govulncheck and its
      # transitive deps, NOT cli's module graph), so the cli prefetch
      # above does not cover it. Inline-retry with the same posture as
      # ``go-mod-download-retry`` for transient proxy.golang.org / GCS
      # blips that don't trigger Go's ``direct`` fallback.
      - name: Install govulncheck (with retry)
        shell: bash
        env:
          MAX_ATTEMPTS: "8"
          BASE_DELAY: "15"
          MAX_DELAY: "120"
        run: |
          set -euo pipefail
          attempt=0
          delay="$BASE_DELAY"
          while :; do
            attempt=$((attempt + 1))
            if go install golang.org/x/vuln/cmd/govulncheck@v1.3.0; then
              if [ "$attempt" -gt 1 ]; then
                echo "::notice::go install govulncheck succeeded on attempt $attempt"
              fi
              exit 0
            fi
            rc=$?
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::go install govulncheck failed after $attempt attempts" >&2
              exit "$rc"
            fi
            echo "::warning::go install govulncheck transient failure (attempt $attempt/$MAX_ATTEMPTS), retrying in ${delay}s" >&2
            sleep "$delay"
            delay=$((delay * 2))
            if [ "$delay" -gt "$MAX_DELAY" ]; then
              delay="$MAX_DELAY"
            fi
          done

      - name: Run govulncheck
        working-directory: cli
        run: govulncheck ./...

  # ── Fuzz (main only -- too slow for PRs) ──
  cli-fuzz:
    name: CLI Fuzz
    needs: cli-changes
    if: needs.cli-changes.outputs.changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - ./internal/compose/
          - ./internal/selfupdate/
          - ./internal/config/
          - ./internal/docker/
          - ./internal/verify/
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: cli/go.mod
          cache: false
      - uses: ./.github/actions/go-mod-download-retry
        with:
          working-directory: cli

      # Two steps: discovery and execution are split so compile errors
      # in fuzz targets fail the matrix cell loudly. The prior single
      # step had a job-level `continue-on-error: true` that silenced
      # both fuzzer-found crashes (intentional, advisory only) AND
      # `go test -list` compile failures (unintentional, real bugs).
      # Discovery runs without continue-on-error; execution keeps it.
      - name: List fuzz targets
        id: fuzz_list
        working-directory: cli
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          # go test -list exits non-zero on compile errors; let that
          # propagate so broken packages aren't silently skipped.
          LIST_OUTPUT=$(go test -list 'Fuzz.*' "$PKG" 2>&1) || {
            echo "::error::go test -list failed for $PKG (compile error?)"
            echo "$LIST_OUTPUT"
            exit 1
          }
          FUZZ_TARGETS=$(echo "$LIST_OUTPUT" | grep '^Fuzz' || true)
          # Multi-line GITHUB_OUTPUT requires a heredoc-style delimiter;
          # see https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
          {
            echo "targets<<TARGETS_EOF"
            echo "$FUZZ_TARGETS"
            echo "TARGETS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run fuzz tests (30s per target)
        id: fuzz_run
        if: steps.fuzz_list.outputs.targets != ''
        continue-on-error: true
        working-directory: cli
        env:
          # Pass via env (not direct ${{ }} interpolation) so multi-line
          # values survive without GitHub Actions expression-syntax
          # escaping pitfalls.
          FUZZ_TARGETS: ${{ steps.fuzz_list.outputs.targets }}
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          # Run each Fuzz* function in the package for 30s. go test
          # -fuzz only supports one fuzz target at a time, so iterate.
          while IFS= read -r target; do
            [ -z "$target" ] && continue
            echo "::group::Fuzzing $target"
            go test -fuzz="^${target}$" -fuzztime=30s "$PKG"
            echo "::endgroup::"
          done <<< "$FUZZ_TARGETS"

      - name: Report fuzz outcome
        if: always()
        env:
          FUZZ_OUTCOME: ${{ steps.fuzz_run.outcome }}
        run: |
          if [ "$FUZZ_OUTCOME" = "failure" ]; then
            echo "::warning::Fuzz target reported failures"
          fi

  # ── Gate: all CLI checks must pass ──
  cli-pass:
    name: CLI Pass
    if: always()
    needs: [cli-changes, cli-lint, cli-test, cli-build, cli-bench, cli-vuln, cli-fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: >-
            ${{ needs.cli-changes.result }}
            ${{ needs.cli-lint.result }}
            ${{ needs.cli-test.result }}
            ${{ needs.cli-build.result }}
            ${{ needs.cli-bench.result }}
            ${{ needs.cli-vuln.result }}
            ${{ needs.cli-fuzz.result }}
        run: |
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CLI checks failed. Job results: $RESULTS"
            exit 1
          fi
          # cli-fuzz uses step-level continue-on-error, so fuzz findings
          # don't fail the job -- only infra failures (checkout, setup-go)
          # propagate here. Fuzz warnings are emitted by the per-matrix
          # "Report fuzz outcome" step.
          echo "All CLI checks passed (some may have been skipped due to path filters)"

  # ── Release (GoReleaser + provenance, only on version tags) ──
  cli-release:
    name: CLI Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli-lint, cli-test, cli-build, cli-vuln]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Environment-gated: the `release-tags` env branch policy (`v*`) is a
    # structural ref gate for the GoReleaser push path. This env carries
    # no privileged secrets -- the `synthorg-repo-bot` App credentials
    # (`RELEASE_BOT_APP_CLIENT_ID` / `RELEASE_BOT_APP_PRIVATE_KEY`) live
    # on the main-only `release` env so a forged `v*` tag cannot unlock them.
    environment: release-tags
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: cli/go.mod
          # Disable caching in release job to prevent cache-poisoning (zizmor).
          cache: false
      - uses: ./.github/actions/go-mod-download-retry
        with:
          working-directory: cli

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Wait for GitHub Release to exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Waiting for release $TAG..."
          for i in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG found."
              exit 0
            fi
            echo "Attempt $i: release not found yet, waiting 10s..."
            sleep 10
          done
          echo "Release $TAG not found after 5 minutes -- proceeding, but the next upload step will fail if the draft release is missing."

      - name: Copy LICENSE into CLI module
        run: cp LICENSE cli/LICENSE

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.16.0
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate checksums file
        run: |
          if [ ! -f cli/dist/checksums.txt ] || [ ! -s cli/dist/checksums.txt ]; then
            echo "::error::cli/dist/checksums.txt is missing or empty -- GoReleaser may have failed"
            exit 1
          fi

      - name: Sign checksums with cosign (keyless)
        run: |
          cosign sign-blob --yes cli/dist/checksums.txt \
            --bundle cli/dist/checksums.txt.cosign.bundle

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # gh release upload finds draft releases (unlike GoReleaser's API).
          # --clobber overwrites if assets already exist (idempotent on re-run).
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            cli/dist/*.tar.gz cli/dist/*.zip \
            cli/dist/checksums.txt cli/dist/checksums.txt.cosign.bundle

      - name: Attest build provenance (SLSA Level 3)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          # subject-checksums treats the file as a manifest: attests every
          # binary archive listed inside it (the primary SLSA L3 attestations).
          subject-checksums: cli/dist/checksums.txt

      - name: Attest checksums file provenance
        id: attest-checksums
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          # subject-path attests the checksums.txt file itself; bundle-path
          # output is uploaded as .sigstore.json for OpenSSF Scorecard scoring.
          subject-path: cli/dist/checksums.txt

      - name: Upload provenance bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest-checksums.outputs.bundle-path }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$BUNDLE" ] || [ ! -f "$BUNDLE" ]; then
            echo "::error::Attestation bundle not found at '$BUNDLE'"
            exit 1
          fi
          cp "$BUNDLE" cli/dist/checksums.txt.sigstore.json

          # Extract DSSE envelope as .intoto.jsonl for OpenSSF Scorecard
          # provenance detection (Scorecard recognises .intoto.jsonl but
          # classifies .sigstore.json as a signature, not provenance).
          jq -e -c '.dsseEnvelope' "$BUNDLE" > cli/dist/checksums.txt.intoto.jsonl

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            cli/dist/checksums.txt.sigstore.json \
            cli/dist/checksums.txt.intoto.jsonl

      - name: Append CLI installation and checksums to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Download checksums from the release assets.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "checksums.txt" --dir /tmp

          # Extract per-platform checksums.
          get_checksum() { awk -v name="$1" '$2 == name { print $1 }' /tmp/checksums.txt; }
          CS_linux_amd64="$(get_checksum synthorg_linux_amd64.tar.gz)"
          CS_linux_arm64="$(get_checksum synthorg_linux_arm64.tar.gz)"
          CS_darwin_amd64="$(get_checksum synthorg_darwin_amd64.tar.gz)"
          CS_darwin_arm64="$(get_checksum synthorg_darwin_arm64.tar.gz)"
          CS_windows_amd64="$(get_checksum synthorg_windows_amd64.zip)"
          CS_windows_arm64="$(get_checksum synthorg_windows_arm64.zip)"

          # Build CLI section + hidden verification data for finalize-release.
          CLI_SECTION="$(cat <<NOTES

          ---

          ## CLI Installation

          **Linux / macOS:**
          \`\`\`bash
          curl -sSfL https://synthorg.io/get/install.sh | bash
          \`\`\`

          **Windows (PowerShell):**
          \`\`\`powershell
          irm https://synthorg.io/get/install.ps1 | iex
          \`\`\`

          > **Pin to this release:** set \`SYNTHORG_VERSION=${TAG}\` before running
          > (bash: \`export SYNTHORG_VERSION=${TAG}\` · PowerShell: \`\$env:SYNTHORG_VERSION='${TAG}'\`).
          >
          > **New to SynthOrg?** See the [Getting Started guide](https://synthorg.io/get/).

          <!-- CLI_VERIFICATION_DATA
          | Archive | SHA-256 |
          |---------|---------|
          | \`synthorg_linux_amd64.tar.gz\` | \`${CS_linux_amd64}\` |
          | \`synthorg_linux_arm64.tar.gz\` | \`${CS_linux_arm64}\` |
          | \`synthorg_darwin_amd64.tar.gz\` | \`${CS_darwin_amd64}\` |
          | \`synthorg_darwin_arm64.tar.gz\` | \`${CS_darwin_arm64}\` |
          | \`synthorg_windows_amd64.zip\` | \`${CS_windows_amd64}\` |
          | \`synthorg_windows_arm64.zip\` | \`${CS_windows_arm64}\` |

          \`\`\`bash
          gh attestation verify synthorg_linux_amd64.tar.gz -R Aureliolo/synthorg
          \`\`\`
          Replace the filename with any archive from this release.
          CLI_VERIFICATION_DATA -->

          <!-- CLI_COSIGN_DATA
          \`\`\`bash
          cosign verify-blob checksums.txt \\
            --bundle checksums.txt.cosign.bundle \\
            --certificate-identity-regexp='github\\.com/Aureliolo/synthorg' \\
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com'
          \`\`\`
          CLI_COSIGN_DATA -->

          <!-- CLI_SLSA_BUNDLE_DATA
          \`\`\`bash
          cosign verify-blob-attestation checksums.txt \\
            --bundle checksums.txt.sigstore.json \\
            --type slsaprovenance1 \\
            --certificate-identity-regexp='github\\.com/Aureliolo/synthorg' \\
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com'
          \`\`\`
          CLI_SLSA_BUNDLE_DATA -->
          NOTES
          )"

          # Idempotent: strip existing CLI Installation section (+ preceding ---) before appending.
          # Uses awk to buffer --- lines so the separator doesn't accumulate on re-runs.
          EXISTING_BODY="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
          CLEANED_BODY="$(printf '%s' "$EXISTING_BODY" | awk '
            /^---$/ { buf=$0; next }
            /^## CLI Installation$/ { buf=""; skip=1; next }
            { if(buf!="") print buf; buf="" }
            /^## / { skip=0 }
            !skip
          ')"
          FULL_BODY="${CLEANED_BODY}${CLI_SECTION}"

          tmpfile="$(mktemp)"
          trap 'rm -f "$tmpfile"' EXIT
          printf '%s' "$FULL_BODY" > "$tmpfile"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$tmpfile"

          echo "Release notes updated with install instructions, checksums, and provenance."
