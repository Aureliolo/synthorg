site_name: SynthOrg Documentation
site_description: Framework for building synthetic organizations, autonomous AI agents orchestrated as a virtual company
site_url: https://synthorg.io/docs
site_dir: _site/docs
repo_url: https://github.com/Aureliolo/synthorg
repo_name: Aureliolo/synthorg
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.expand
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font: false
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  # Preserve old URLs from before docs reshuffles. Each line maps an
  # old path to its current location. Keep entries minimal and remove
  # any once the corresponding inbound links are updated.
  - redirects:
      redirect_maps:
        'getting-started.md': 'getting_started.md'
        'decisions.md': 'architecture/decisions.md'
        'comparison.md': 'reference/comparison.md'
  # D2 rendering is handled via pymdownx.superfences custom_fences
  # (see d2_fence.py) because zensical does not run mkdocs plugin
  # lifecycle hooks. Keep the config here so d2_fence.py reads it.
  - d2:
      layout: dagre
      theme: 200
      dark_theme: -1
      sketch: false
      pad: 100
      cache: false
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false
            signature_crossrefs: true
            separate_signature: true
            line_length: 88
            extensions:
              - griffe_pydantic

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: d2
          class: d2
          validator: !!python/name:d2_fence.validator
          format: !!python/name:d2_fence.formatter
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

