name: Checkout (retry-wrapped)
description: |
  ``actions/checkout`` with explicit 3-attempt retry at the workflow
  layer. Works around the recurring ``fatal: could not read Username
  for 'https://github.com': terminal prompts disabled`` flake where
  ``actions/checkout``'s own three-try internal fetch path silently
  drops the includeIf-based git auth header on retries, surfacing
  every attempt as a credentials failure. We've observed this on
  every kind of fetch (auto merge-ref AND pinned head SHA) at a
  ~1.5% rate per job. Re-running by hand is wasted operator time;
  three workflow-level attempts with backoff turn the flake into a
  ~0.000003% residual probability while keeping the cost-on-success
  to exactly the same as ``actions/checkout`` (the second and third
  attempts are gated on the first failing).

  Defaults ``ref`` to the PR head SHA on pull_request events (falls
  back to ``github.sha`` for push / workflow_dispatch / workflow_run
  / schedule), bypassing the ``refs/pull/<N>/merge`` synthetic ref
  that ``actions/checkout`` fetches by default; that ref is computed
  asynchronously by GitHub and is its own source of flakes. Tests
  run against the PR head, not the as-merged commit; branch
  protection / merge queue are independent enforcement.

  References: actions/checkout#393, actions/checkout#518.

inputs:
  ref:
    description: |
      Git ref to check out. Defaults to PR head SHA on pull_request
      events, github.sha otherwise. Override to check out main, a
      release-please branch, etc.
    required: false
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  fetch-depth:
    description: Forwarded to actions/checkout. Defaults to 1 (shallow).
    required: false
    default: "1"
  persist-credentials:
    description: Forwarded to actions/checkout. Defaults to false.
    required: false
    default: "false"
  sparse-checkout:
    description: Forwarded to actions/checkout.
    required: false
    default: ""
  sparse-checkout-cone-mode:
    description: Forwarded to actions/checkout.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Checkout (attempt 1/3)
      id: attempt1
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      continue-on-error: true
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: ${{ inputs.persist-credentials }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}

    # Linear backoff between attempts. Short enough that a one-off
    # flake recovers fast; long enough that the underlying transient
    # (GitHub auth-service hiccup, runner-network blip, includeIf
    # config race) has cleared by the next try.
    - name: Backoff before attempt 2
      if: steps.attempt1.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::actions/checkout attempt 1 failed; waiting 5s before retry"
        sleep 5

    - name: Checkout (attempt 2/3)
      id: attempt2
      if: steps.attempt1.outcome == 'failure'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      continue-on-error: true
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: ${{ inputs.persist-credentials }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}

    - name: Backoff before attempt 3
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::actions/checkout attempt 2 failed; waiting 15s before final retry"
        sleep 15

    # No ``continue-on-error`` on the final attempt -- if all three
    # fail the workflow rightly aborts here with the underlying error
    # surfaced. Sidesteps the documented ``actions/checkout`` retry
    # auth-drop bug by giving each attempt a clean step boundary.
    - name: Checkout (attempt 3/3)
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: ${{ inputs.persist-credentials }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
