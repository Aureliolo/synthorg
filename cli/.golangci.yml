version: "2"

run:
  go: "1.26"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - bodyclose
    - errname
    - errorlint
    - noctx
    - prealloc
    - unconvert
    - unparam
    # Structural-complexity checks that catch overgrown functions
    # and deep nested control flow.
    - gocyclo
    - funlen
    - gocognit
    - nestif
    - revive
  settings:
    gocyclo:
      min-complexity: 10
    funlen:
      lines: 80
      statements: 60
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: unused-parameter
        - name: unused-receiver
        - name: confusing-naming
        - name: cognitive-complexity
          arguments: [15]
  exclusions:
    # Table tests and OS-conditional branches in test files are excluded
    # from all five complexity rules: the signal lives in production
    # code, not in test data enumeration. This matches the industry
    # standard (golangci-lint docs explicitly recommend this set; the
    # same exclusion is shipped by kubernetes, docker, prometheus,
    # hashicorp, etc.). Production code, in contrast, has zero
    # path-scoped exclusions.
    rules:
      - path: '_test\.go$'
        linters: [gocyclo, funlen, gocognit, nestif, revive]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
