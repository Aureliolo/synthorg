name: Sync Labels

on:
  # Manual-only. Edits to .github/labels.yml do NOT auto-sync; the
  # operator runs this workflow from Actions -> Sync Labels -> Run
  # workflow when they want the change to land. Keeps label
  # mutations explicit and reviewable instead of riding any merge
  # to main that touches the file.
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    # Bound the per-label gh_with_retry.sh ladders (~1m45s worst case
    # each): a healthy run upserts every label in well under a minute, so
    # 10 reaps a genuinely stuck label API rather than hanging on the
    # 6-hour default.
    timeout-minutes: 10
    permissions:
      # `contents: read` is the minimum the checkout needs to fetch the
      # ref under the deny-all top-level default (`permissions: {}`).
      contents: read
      # `issues: write` is the GitHub-side scope that covers
      # `gh label create / edit / delete` on the repository.
      # No `contents: write` is needed because we only mutate
      # label metadata, not files.
      issues: write
    steps:
      - uses: Aureliolo/synthorg/.github/actions/checkout@25921183f274c930bf473dc0339376bda0961eaf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Sync labels from .github/labels.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # `yq -o=j -I=0 '.[]'` emits one compact JSON object per label so a
          # while-read loop can iterate them. `gh label create --force` is
          # upsert: it creates if missing and updates color/description if
          # the label already exists. We never delete labels here -- humans
          # may have added repo-specific ones we shouldn't touch.
          yq -o=j -I=0 '.[]' .github/labels.yml | while IFS= read -r label_json; do
            name=$(printf '%s' "$label_json" | jq -r '.name')
            color=$(printf '%s' "$label_json" | jq -r '.color')
            description=$(printf '%s' "$label_json" | jq -r '.description // ""')

            echo "::group::sync $name"
            # --force makes this an idempotent upsert, so retrying a
            # transient label-API 5xx / timeout cannot double-create or
            # corrupt; gh_with_retry.sh fast-fails a definitive 4xx.
            .github/scripts/gh_with_retry.sh "label upsert $name" \
              gh label create "$name" \
              --color "$color" \
              --description "$description" \
              --force
            echo "::endgroup::"
          done
