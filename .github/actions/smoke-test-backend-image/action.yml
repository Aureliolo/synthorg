name: 'Smoke-test backend container image'
description: |
  Run a backend container image, verify it serves a 200 response on its
  API liveness endpoint, and fail if it took long enough to erode the
  health budget the image ships. Catches:
    - image builds green but crashes at startup (missing migration,
      env mismatch, library regression, broken entrypoint)
    - 404 on the wrong probe URL (e.g. `/healthz` vs the actual
      `/api/v1/healthz` mount point)
    - a cold boot that has grown toward the container's own
      HEALTHCHECK start period, which is the failure mode that makes a
      first `synthorg start` abort: compose gates `web` on the
      backend's health, so a boot that outlasts the budget takes the
      whole stack down with it

  This composite action is the single source of truth for the
  backend image smoke test. It runs at build time in `docker.yml`
  on every event that builds the backend image (PR, push to main,
  v* tag pushes, workflow_dispatch) so a broken image fails the
  originating commit with a red ❌ on the commit row, never the
  release-time finalize step after a tag has already been cut.

inputs:
  image:
    description: |
      Image reference to run. Must be loadable via `docker run`
      (either already in the local daemon from a preceding build, or
      pullable from a registry the runner has access to).
    required: true
  host-port:
    description: |
      Host port to bind on the runner for the probe. Independent of
      the in-container listen port: useful when smoke-testing more
      than one image in parallel on the same runner. default: 3001.
    required: false
    default: '3001'
  container-port:
    description: |
      Port the backend listens on inside the container. The synthorg
      backend (Litestar) listens on 3001 by default; override only if
      a future image changes its bound port. default: 3001.
    required: false
    default: '3001'
  path:
    description: 'HTTP path to probe. default: /api/v1/healthz (Litestar liveness, mounted under /api/v1).'
    required: false
    default: '/api/v1/healthz'
  dockerfile:
    description: |
      Dockerfile whose HEALTHCHECK `--start-period` defines the boot
      budget this run is measured against. Parsed rather than
      duplicated so the budget has exactly one definition and the two
      cannot drift apart.
    required: false
    default: 'docker/backend/Dockerfile'
  budget-fraction:
    description: |
      Percentage of the image's health start period the boot is
      allowed to consume before this step fails. The start period is
      sized with several multiples of headroom over the measured cold
      boot deliberately, so a boot spending a large share of it has
      already lost that headroom -- failing here is what turns "the
      budget still holds" into something CI checks rather than
      something a comment asserts. default: 25.
    required: false
    default: '25'
  deadline-seconds:
    description: |
      Explicit total deadline for the probe to return 200, overriding
      the value derived from `dockerfile` and `budget-fraction`. Leave
      empty (the default) so the deadline stays coupled to the shipped
      budget: a hardcoded number here can contradict the Dockerfile,
      and whichever is wrong, the operator learns it in production.
    required: false
    default: ''
  cpus:
    description: |
      CPU limit for the container, mirroring the `cpus` the generated
      compose file applies to the backend service. Without it the
      runner measures an unconstrained boot, and a regression that
      only bites under the shipped limit passes CI. default: 2.
    required: false
    default: '2'
  memory:
    description: 'Memory limit, mirroring the compose backend limit. default: 4g.'
    required: false
    default: '4g'
  attempt-timeout-seconds:
    description: |
      Per-attempt curl timeout. Without this, default curl behaviour
      can wait up to the OS TCP-connect timeout (~75s on Linux),
      which would let a single hung request blow past the deadline.
      Each attempt is bounded by this value. default: 5.
    required: false
    default: '5'

runs:
  using: 'composite'
  steps:
    - name: Derive the boot deadline from the image's health budget
      id: budget
      shell: bash
      env:
        DOCKERFILE: ${{ inputs.dockerfile }}
        BUDGET_FRACTION: ${{ inputs.budget-fraction }}
        DEADLINE_OVERRIDE: ${{ inputs.deadline-seconds }}
      run: |
        set -euo pipefail

        if [ ! -f "$DOCKERFILE" ]; then
          echo "::error::$DOCKERFILE not found; cannot determine the boot budget"
          exit 1
        fi
        # sed rather than grep -P: the pattern is simple enough not to
        # need PCRE, and this stays portable to a non-GNU grep.
        START_PERIOD=$(sed -n 's/.*--start-period=\([0-9][0-9]*\)s.*/\1/p' "$DOCKERFILE" | head -1)
        if [ -z "$START_PERIOD" ]; then
          echo "::error::no HEALTHCHECK --start-period=<N>s found in $DOCKERFILE"
          echo "::error::the boot guard is derived from it, so it cannot be dropped silently"
          exit 1
        fi

        if [ -n "$DEADLINE_OVERRIDE" ]; then
          DEADLINE="$DEADLINE_OVERRIDE"
          echo "Deadline ${DEADLINE}s (explicit override; health budget is ${START_PERIOD}s)"
        else
          DEADLINE=$((START_PERIOD * BUDGET_FRACTION / 100))
          echo "Health budget ${START_PERIOD}s (from $DOCKERFILE), boot deadline ${DEADLINE}s (${BUDGET_FRACTION}% of it)"
        fi
        if [ "$DEADLINE" -le 0 ]; then
          echo "::error::derived deadline is ${DEADLINE}s; check budget-fraction=${BUDGET_FRACTION}"
          exit 1
        fi
        echo "start-period=$START_PERIOD" >> "$GITHUB_OUTPUT"
        echo "deadline=$DEADLINE" >> "$GITHUB_OUTPUT"

    - name: Run image and probe liveness
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        HOST_PORT: ${{ inputs.host-port }}
        CONTAINER_PORT: ${{ inputs.container-port }}
        PROBE_PATH: ${{ inputs.path }}
        DEADLINE: ${{ steps.budget.outputs.deadline }}
        START_PERIOD: ${{ steps.budget.outputs.start-period }}
        CPUS: ${{ inputs.cpus }}
        MEMORY: ${{ inputs.memory }}
        ATTEMPT_TIMEOUT: ${{ inputs.attempt-timeout-seconds }}
      run: |
        set -euo pipefail

        echo "Starting container from $IMAGE (host:${HOST_PORT} -> container:${CONTAINER_PORT})"
        # The image's setup wizard falls back to ephemeral SQLite when
        # no DATABASE_URL is provided -- sufficient for a liveness
        # smoke without provisioning external state.
        #
        # --cpus / --memory mirror the limits the generated compose
        # file puts on the backend service. Boot here is CPU-bound
        # (interpreter start plus the import graph), so measuring it
        # unconstrained would measure a machine no user runs.
        #
        # SYNTHORG_PAGINATION_CURSOR_SECRET: final-tag images bake
        # DEPLOYMENT_ENV=prod, and the prod-strict guard in
        # synthorg.api.app refuses to start with an ephemeral cursor
        # secret. Pass a clearly-bogus stable value (>= 16 bytes) so
        # the smoke test exercises the same boot path as a properly
        # configured prod deployment without needing real secrets.
        #
        # NOTE: deliberately NO --rm. If the container crashes
        # immediately at startup, --rm would have docker remove it
        # before the trap's `docker logs` could read it, leaving no
        # forensic trail. We `docker rm -f` explicitly in the trap
        # AFTER the logs are dumped so the postmortem still works.
        CID=$(docker run -d -p "${HOST_PORT}:${CONTAINER_PORT}" \
          --cpus "$CPUS" --memory "$MEMORY" \
          -e SYNTHORG_PAGINATION_CURSOR_SECRET=smoke-test-not-a-real-cursor-secret \
          "$IMAGE")
        # Always dump the last 50 lines of container logs on exit so
        # flake postmortems have something to look at, then force-rm
        # the container so the runner does not leak it.
        trap 'docker logs "$CID" 2>&1 | tail -50; docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT

        PROBE_URL="http://localhost:${HOST_PORT}${PROBE_PATH}"
        echo "Polling $PROBE_URL (deadline ${DEADLINE}s, per-attempt timeout ${ATTEMPT_TIMEOUT}s)"

        # Each attempt records the HTTP status so the log shows WHY the
        # probe was still failing (boot time, 5xx, conn-refused);
        # `curl -sf` on its own silently exits 22 on any non-2xx.
        # `--max-time` bounds the total time of each attempt (connect +
        # transfer) so a single hung request cannot push past the
        # overall deadline. Without it, default curl waits ~75s on the
        # Linux TCP-connect timeout, which would burn most of the
        # deadline on the first stuck attempt alone.
        started=$SECONDS
        deadline=$((SECONDS + DEADLINE))
        while [ "$SECONDS" -lt "$deadline" ]; do
          attempt_code=$(curl -s -o /dev/null -w '%{http_code}' \
            --max-time "$ATTEMPT_TIMEOUT" \
            "$PROBE_URL" 2>/dev/null || echo "conn-refused")
          if [ "$attempt_code" = "200" ]; then
            boot=$((SECONDS - started))
            echo "$PROBE_URL returned 200 after ${boot}s" \
                 "($((boot * 100 / START_PERIOD))% of the ${START_PERIOD}s health budget)"
            exit 0
          fi
          echo "  attempt at $((SECONDS - started))s: ${attempt_code}"
          sleep 3
        done

        echo "::error::$PROBE_URL did not return 200 within ${DEADLINE}s."
        echo "::error::That is ${DEADLINE}s of the image's ${START_PERIOD}s HEALTHCHECK start period." \
             "Either the image no longer boots, or its cold boot has grown into the budget's headroom;" \
             "re-measure with scripts/measure_backend_boot.sh before changing either number."
        exit 1
