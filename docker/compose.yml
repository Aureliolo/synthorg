# Named explicitly: Compose otherwise falls back to the basename of whatever
# directory it runs in, which namespaces every container and volume under a
# name that says nothing and that any other project in a like-named directory
# would share. The project name is the namespace `up`, `down` and `ps` act on.
name: synthorg

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # pgvector variant of the same hardened Postgres image: agent memory
    # stores embeddings in this database, so the vector extension must be
    # present. Staying inside the DHI family keeps the hardened posture
    # (zero known CVEs, signed provenance, SBOM) rather than trading it
    # away for a community image or a hand-built one.
    # renovate: datasource=docker depName=dhi.io/pgvector
    image: dhi.io/pgvector:0.8-pg18-debian13@sha256:9387a618668fa8f90d0c9d3f4acaa5880f57caff2ab35809e1ea7d2375a17878
    ports:
      - "${POSTGRES_PORT:-3002}:5432"
    volumes:
      - synthorg-pgdata:/var/lib/postgresql/data
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: synthorg
      POSTGRES_USER: synthorg
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
      - /run/postgresql:noexec,nosuid,nodev,size=8m
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
          pids: 128
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "synthorg", "-d", "synthorg"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    logging: *logging

  # Init container: chown named volumes to the correct non-root UID per service.
  # Fresh Docker named volumes are root-owned; DHI images run as non-root and
  # cannot self-chown, so this one-shot container sets ownership on first start.
  #   /data      -> 65532 (backend)    /pgdata -> 70 (postgres)
  #   /nats-data -> 65532 (nats)
  data-init:
    # renovate: datasource=docker depName=busybox
    image: busybox:1.38-musl@sha256:32b5cdad7cce41dfd53d0ae06baebcf8357a147ee7694dc706911c373bc30c37
    volumes:
      - synthorg-data:/data
      - synthorg-pgdata:/pgdata
      - synthorg-nats-data:/nats-data
    command: ["sh", "-c", "set -e; mkdir -p /data/logs /data/memory /data/tunnel; chown -R 65532:65532 /data; chown -R 70:70 /pgdata; chmod 0700 /pgdata; chown -R 65532:65532 /nats-data"]
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # One-shot chown walk: a single busybox process, negligible memory.
    # Limits cap the blast radius without throttling first-run chowns over
    # a large pre-existing volume.
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "1.0"
          pids: 64

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      # BASE_IMAGE must come from the caller's environment (the
      # backend Dockerfile has no default and a blank value is a
      # hard error -- see docker/backend/Dockerfile for the
      # Pinned-Dependencies rationale). CI release builds set
      # this to a digest-pinned `synthorg-backend-base@sha256:...`;
      # the DAST workflow and local dev set it to a tag like
      # `ghcr.io/aureliolo/synthorg-backend-base:main`.
      args:
        BASE_IMAGE: ${BASE_IMAGE}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - synthorg-data:/data
    depends_on:
      data-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # UVICORN_HOST / UVICORN_PORT carry correct defaults from the image
      # ENV (see docker/backend/Dockerfile) and drive what uvicorn binds;
      # SYNTHORG_API_SERVER_HOST / _PORT below are the separate settings
      # the application resolves, and they have to agree with the bind or
      # the settings page reports a fiction and the untrusted-proxy
      # warning never fires.
      SYNTHORG_DATABASE_URL: "postgresql://synthorg:${POSTGRES_PASSWORD}@postgres:5432/synthorg"
      # Local docker-network postgres runs plaintext inside the bridge.
      # For production, override to `verify-full` with proper certs.
      SYNTHORG_POSTGRES_SSL_MODE: "disable"
      # The artefact this stack is running, which source cannot tell it:
      # `synthorg.__version__` is the last RELEASED version, so a pre-release
      # stack reports the previous release's number as its own. This file
      # builds the backend from the worktree, so an unset tag reads as the
      # source version, which is then the true answer.
      SYNTHORG_IMAGE_TAG: "${SYNTHORG_IMAGE_TAG:-}"
      SYNTHORG_MEMORY_DIR: "/data/memory"
      SYNTHORG_PERSISTENCE_BACKEND: "postgres"
      SYNTHORG_BUS_BACKEND: "${SYNTHORG_BUS_BACKEND:-nats}"
      SYNTHORG_LOG_LEVEL: "${SYNTHORG_LOG_LEVEL:-info}"
      # The next block is the settings the product marks compose_set: the
      # process is started with them and nothing inside can change them, so
      # this file has to pass every one or the label is a lie for this
      # deployment path. Kept in step with the CLI's own template by
      # scripts/check_setting_compose_backed.py. It ends at the cassette
      # pair below; what follows is ordinary env-layer seeding of live
      # settings, which the gate does not inspect.
      SYNTHORG_API_SERVER_HOST: "0.0.0.0"
      SYNTHORG_API_SERVER_PORT: "3001"
      SYNTHORG_NATS_URL: "${SYNTHORG_NATS_URL:-nats://nats:4222}"
      SYNTHORG_LOG_DIR: "${SYNTHORG_LOG_DIR:-/data/logs}"
      SYNTHORG_TUNNEL_STATE_DIR: "/data/tunnel"
      SYNTHORG_API_API_PREFIX: "${SYNTHORG_API_API_PREFIX:-/api/v1}"
      SYNTHORG_API_SSL_CERTFILE: "${SYNTHORG_API_SSL_CERTFILE:-}"
      SYNTHORG_API_SSL_KEYFILE: "${SYNTHORG_API_SSL_KEYFILE:-}"
      SYNTHORG_API_SSL_CA_CERTS: "${SYNTHORG_API_SSL_CA_CERTS:-}"
      SYNTHORG_API_TRUSTED_PROXIES: "${SYNTHORG_API_TRUSTED_PROXIES:-[]}"
      SYNTHORG_API_CORS_ALLOWED_ORIGINS: "${SYNTHORG_API_CORS_ALLOWED_ORIGINS:-[]}"
      SYNTHORG_API_AUTH_EXCLUDE_PATHS: "${SYNTHORG_API_AUTH_EXCLUDE_PATHS:-}"
      SYNTHORG_API_RATE_LIMIT_EXCLUDE_PATHS: "${SYNTHORG_API_RATE_LIMIT_EXCLUDE_PATHS:-}"
      SYNTHORG_API_REQUEST_MAX_BODY_SIZE_BYTES: "${SYNTHORG_API_REQUEST_MAX_BODY_SIZE_BYTES:-10485760}"
      SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_FREETSA: "${SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_FREETSA:-https://freetsa.org/tsr}"
      SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_DIGICERT: "${SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_DIGICERT:-https://timestamp.digicert.com}"
      SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_SECTIGO: "${SYNTHORG_OBSERVABILITY_TSA_ENDPOINT_SECTIGO:-https://timestamp.sectigo.com}"
      SYNTHORG_PROVIDERS_CASSETTE_MODE: "${SYNTHORG_PROVIDERS_CASSETTE_MODE:-off}"
      SYNTHORG_PROVIDERS_CASSETTE_PATH: "${SYNTHORG_PROVIDERS_CASSETTE_PATH:-}"
      # Blank falls through to the pinned default the image ships; the CLI
      # substitutes a digest-pinned ref here when the operator enables the
      # sandbox at init time.
      SYNTHORG_SANDBOX_IMAGE: "${SYNTHORG_SANDBOX_IMAGE:-}"
      SYNTHORG_SIDECAR_IMAGE: "${SYNTHORG_SIDECAR_IMAGE:-}"
      SYNTHORG_FINE_TUNE_IMAGE: "${SYNTHORG_FINE_TUNE_IMAGE:-}"
      SYNTHORG_OPENHANDS_IMAGE: "${SYNTHORG_OPENHANDS_IMAGE:-}"
      # The OpenHands loop container runs on the default bridge network, not
      # synthorg-net, so it reaches the API through the host rather than by
      # compose service name: the loop gives its container a
      # `host.docker.internal:host-gateway` alias and these two point at the
      # published port. Derived from the same values the bind above uses, so a
      # standard deployment needs no hand configuration. The container appends
      # `/mcp` to the MCP base itself.
      SYNTHORG_PROVIDERS_GATEWAY_BASE_URL: "${SYNTHORG_PROVIDERS_GATEWAY_BASE_URL:-http://host.docker.internal:${BACKEND_PORT:-3001}${SYNTHORG_API_API_PREFIX:-/api/v1}/gateway/v1}"
      SYNTHORG_TOOLS_CREDENTIALED_MCP_BASE_URL: "${SYNTHORG_TOOLS_CREDENTIALED_MCP_BASE_URL:-http://host.docker.internal:${BACKEND_PORT:-3001}${SYNTHORG_API_API_PREFIX:-/api/v1}/mcp-gateway}"
    # Image sets USER 65532 in the Dockerfile; no compose override
    # needed.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
    # The ordered teardown bounds itself to _TOTAL_SHUTDOWN_WINDOW_SECONDS
    # (75s, in api/lifecycle_runner_shutdown.py) and can overrun it by the
    # per-step floor it grants once that window is spent. Without this,
    # Docker's 10s default arrives mid-sequence and the steps that lose are
    # the ones at the end: the audit-chain flush and the persistence
    # disconnect. Move this and that constant together.
    stop_grace_period: 90s
    stop_signal: SIGTERM
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
          pids: 256
    logging: *logging

  web:
    image: ghcr.io/aureliolo/synthorg-web:${SYNTHORG_IMAGE_TAG:-latest}
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    # apko sets run-as: "65532" in docker/web/apko.yaml; no compose
    # override needed.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Caddy runs as uid 65532 from apko; tmpfs defaults to root-owned,
      # which breaks autosave, instance-UUID persistence, and the
      # storage_clean lock dir under /data/caddy. Pin the mount owner so
      # Caddy can write without falling back to read-only mode.
      - /tmp:noexec,nosuid,nodev,size=16m,uid=65532,gid=65532
      - /config/caddy:noexec,nosuid,nodev,size=8m,uid=65532,gid=65532
      - /data/caddy:noexec,nosuid,nodev,size=16m,uid=65532,gid=65532
    healthcheck:
      # Caddy serves a plain "ok" 200 at /healthz; wget is installed in
      # the apko image specifically for this probe. Target 127.0.0.1 to
      # avoid pulling in external DNS resolution.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 64
    logging: *logging

  # DHI NATS JetStream (distributed message bus + task queue).
  # DHI image is distroless (no shell/wget) -- healthcheck via sidecar.
  # Configuration via bind-mounted nats.conf -- NATS has no
  # --max_payload CLI flag, so non-default settings need a config file.
  nats:
    # renovate: datasource=docker depName=dhi.io/nats
    image: dhi.io/nats:2.14-debian13@sha256:6e380f3a2910ab38b7b9b018c6a8bfb7eda8fb86426b4c408e3eef044314a2a6
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "${NATS_CLIENT_PORT:-3003}:4222"
      # Uncomment to expose the NATS monitoring endpoint (/varz, /healthz,
      # server stats) to the host for debugging. It is UNAUTHENTICATED, so
      # leave it off by default; backend /api/v1/readyz is the supported
      # health path.
      # - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - synthorg-nats-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    depends_on:
      data-init:
        condition: service_completed_successfully
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=16m
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 64
    logging: *logging

  # NATS health is surfaced via the backend's /api/v1/readyz endpoint.
  # `NatsBus.health_check` performs a live PING/PONG round-trip, so
  # shipping a busybox sidecar purely to produce a green dot in
  # `docker ps` added a container for zero dependency value -- nothing
  # in compose ever consumed the sidecar's `service_healthy` state.

  # Fine-tuning (~4 GB GPU image / ~1.7 GB CPU-only) has no standing
  # service: the backend spawns an ephemeral one-shot container per
  # torch-bound pipeline stage via the Docker API and removes it on
  # exit. Enable by setting the image on the backend's environment:
  #   SYNTHORG_FINE_TUNE_IMAGE: ghcr.io/aureliolo/synthorg-fine-tune-gpu:<tag>
  # (or synthorg-fine-tune-cpu for hosts without an NVIDIA GPU). The
  # CLI-generated compose.yml writes a sigstore-verified digest-pinned
  # reference into this env var automatically when fine_tuning=true.

networks:
  default:
    name: synthorg-net

volumes:
  synthorg-data:
  synthorg-pgdata:
  synthorg-nats-data:
