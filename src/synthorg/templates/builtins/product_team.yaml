template:
  name: "Product Studio"
  description: >-
    A product organization where UX research gathers requirements before
    any build begins. Designers, engineers, QA, and a data analyst
    coordinate through structured meetings. Knowledge-heavy: discovery and
    decisions are grounded in the shared knowledge base.
  version: "1.2.0"
  min_agents: 9
  max_agents: 14
  tags:
    - "product"
    - "design-system"
    - "user-research"
    - "cross-functional"
    - "data-driven"
    - "knowledge-heavy"
  skill_patterns:
    - "inversion"
    - "pipeline"
    - "reviewer"
  extends: "startup"
  posture: "knowledge_heavy"

  variables:
    - name: "sprint_length"
      description: "Sprint duration in days"
      var_type: "int"
      default: 14
      hidden: true
    - name: "wip_limit"
      description: "Work-in-progress limit per column"
      var_type: "int"
      default: 3
      hidden: true

  company:
    type: "product_team"
    budget_monthly: {{ budget | default(500.0) }}

  communication: "event_driven"

  departments:
    # Executive leadership steers the product studio.
    - name: "executive"
      budget_percent: 10
      head_role: "CEO"
      reporting_lines:
        - subordinate: "CTO"
          supervisor: "CEO"
    # Override inherited departments
    - name: "product"
      budget_percent: 20
      head_role: "Product Manager"
    - name: "engineering"
      budget_percent: 30
      head_role: "Backend Developer"
      head_merge_id: "backend-senior"
      policies:
        review_requirements:
          min_reviewers: 1
      reporting_lines:
        - subordinate: "Backend Developer"
          subordinate_id: "backend-mid"
          supervisor: "Backend Developer"
          supervisor_id: "backend-senior"
        - subordinate: "Frontend Developer"
          supervisor: "Backend Developer"
          supervisor_id: "backend-senior"
        - subordinate: "Full-Stack Developer"
          supervisor: "Backend Developer"
          supervisor_id: "backend-senior"
    # New departments
    - name: "design"
      budget_percent: 15
      head_role: "UX Designer"
      policies:
        approval_chains:
          - action_type: "design_review"
            approvers:
              - "UX Designer"
      reporting_lines:
        - subordinate: "UX Researcher"
          supervisor: "UX Designer"
    - name: "quality_assurance"
      budget_percent: 15
      head_role: "QA Engineer"
      reporting_lines:
        - subordinate: "Automation Engineer"
          supervisor: "QA Engineer"
    - name: "data_analytics"
      budget_percent: 10
      head_role: "Data Analyst"

  agents:
    # Executive leadership: strategic, reasoning-heavy work -> top-tier models.
    - role: "CEO"
      department: "executive"
      model:
        priority: "quality"
        requires_reasoning: true
    - role: "CTO"
      department: "executive"
      model:
        priority: "quality"
        requires_reasoning: true
    # Claims the first Full-Stack Developer by role+department so the _remove
    # below takes the sibling rather than this one. Same values as the parent:
    # what the entry decides is which of the two survives.
    - role: "Full-Stack Developer"
      model:
        priority: "balanced"
      department: "engineering"
    # Remove second Full-Stack Developer (matched by role+department)
    - role: "Full-Stack Developer"
      department: "engineering"
      _remove: true
    # Product Manager inherited unchanged from startup
    # New agents
    - role: "Backend Developer"
      merge_id: "backend-senior"
      model:
        priority: "balanced"
      department: "engineering"
    - role: "Backend Developer"
      merge_id: "backend-mid"
      model:
        priority: "balanced"
      department: "engineering"
    - role: "Frontend Developer"
      model:
        priority: "balanced"
      department: "engineering"
    - role: "UX Designer"
      model:
        priority: "balanced"
      department: "design"
    - role: "UX Researcher"
      model:
        priority: "quality"
        requires_reasoning: true
      department: "design"
    - role: "QA Engineer"
      model:
        priority: "cost"
      department: "quality_assurance"
    - role: "Automation Engineer"
      model:
        priority: "cost"
      department: "quality_assurance"
    - role: "Data Analyst"
      model:
        priority: "quality"
      department: "data_analytics"

  workflow_config:
    kanban:
      wip_limits:
        - column: "in_progress"
          limit: {{ wip_limit | default(3) }}
        - column: "review"
          limit: 2
      enforce_wip: true
    sprint:
      duration_days: {{ sprint_length | default(14) }}

  workflow_handoffs:
    - from_department: "product"
      to_department: "design"
      trigger: "Product requirements defined and ready for design"
      artifacts:
        - "product_requirements"
        - "user_stories"
    - from_department: "design"
      to_department: "engineering"
      trigger: "Design specifications and mockups approved"
      artifacts:
        - "design_specs"
        - "mockups"
    - from_department: "engineering"
      to_department: "quality_assurance"
      trigger: "Feature implementation ready for testing"
      artifacts:
        - "pull_request"
        - "test_plan"
    - from_department: "quality_assurance"
      to_department: "product"
      trigger: "Testing complete with quality report for product review"
      artifacts:
        - "test_results"
        - "quality_report"
    - from_department: "data_analytics"
      to_department: "product"
      trigger: "Usage data analysis complete with insights"
      artifacts:
        - "analytics_report"
        - "recommendations"

  escalation_paths:
    - from_department: "engineering"
      to_department: "product"
      condition: "Technical constraint affecting product requirements"
      priority_boost: 1
    - from_department: "quality_assurance"
      to_department: "engineering"
      condition: "Critical defect requiring immediate engineering attention"
      priority_boost: 2
    - from_department: "quality_assurance"
      to_department: "product"
      condition: "Quality threshold not met, release decision needed"
      priority_boost: 1
