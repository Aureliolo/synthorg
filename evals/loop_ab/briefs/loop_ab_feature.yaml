# Workspace-graded A/B brief: COMPLEX tier (multi-file feature addition).
#
# The change spans three files and must keep existing behaviour intact while
# adding new behaviour, so it rewards planning ahead rather than editing the
# first file that looks relevant. This is the brief where a planning loop has a
# structural opportunity to beat a purely reactive one; whether it actually does
# is the question the scoreboard answers.
#
# Acceptance is inline against the package, and one check pins the pre-existing
# quantity() semantics so a loop cannot pass by redefining what it means.
brief_id: loop-ab-feature
schema_version: 1
kind: executable
title: "add stock reservations to the inventory package"
description: >-
  Read SPEC.md in this workspace and implement stock reservations across the
  inventory package: a Reservation model, reserve / release / available on
  Store, and the new name exported from the package root. Existing behaviour
  must keep working.
priority: high
estimated_complexity: 3
workspace:
  seed_dir: seeds/loop-ab-feature
expected_artifacts:
  - kind: file
    path: inventory/models.py
  - kind: file
    path: inventory/store.py
  - kind: file
    path: inventory/__init__.py
acceptance_criteria:
  - "Reservation is a frozen dataclass exported from the inventory package."
  - "reserve returns a Reservation and reduces availability without changing held quantity."
  - "reserve rejects a request exceeding availability with ValueError."
  - "release returns the quantity to availability and rejects an unknown ref with KeyError."
  - "Existing quantity() behaviour is unchanged."
limits:
  max_total_cost: 6.0
  max_wall_clock_seconds: 900
  # See loop_ab_bugfix.yaml: the ceiling is set so it never decides an outcome.
  max_turns: 200
checks:
  build:
    - cmd: ["{python}", "-c", "import inventory; assert hasattr(inventory, 'Reservation')"]
      timeout_seconds: 30
  hidden_tests:
    - cmd: ["{python}", "-c", "from inventory import Item, Store\ns = Store()\ns.add(Item(sku='a', quantity=10))\nr = s.reserve('a', 4)\nassert r.sku == 'a' and r.quantity == 4, r\nassert s.available('a') == 6, s.available('a')\nassert s.quantity('a') == 10, s.quantity('a')"]
      timeout_seconds: 30
    - cmd: ["{python}", "-c", "from inventory import Item, Store\ns = Store()\ns.add(Item(sku='a', quantity=5))\ntry:\n    s.reserve('a', 9)\nexcept ValueError:\n    pass\nelse:\n    raise AssertionError('over-reservation must raise ValueError')"]
      timeout_seconds: 30
    - cmd: ["{python}", "-c", "from inventory import Item, Store\ns = Store()\ns.add(Item(sku='a', quantity=10))\nr = s.reserve('a', 4)\ns.release(r.ref)\nassert s.available('a') == 10, s.available('a')"]
      timeout_seconds: 30
    - cmd: ["{python}", "-c", "from inventory import Item, Store\ns = Store()\ntry:\n    s.release('nope')\nexcept KeyError:\n    pass\nelse:\n    raise AssertionError('unknown ref must raise KeyError')"]
      timeout_seconds: 30
    - cmd: ["{python}", "-c", "from inventory import Item, Store\ns = Store()\ns.add(Item(sku='a', quantity=3))\nfirst = s.reserve('a', 1)\nsecond = s.reserve('a', 1)\nassert first.ref != second.ref, 'reservation refs must be unique'\nassert s.available('a') == 1, s.available('a')"]
      timeout_seconds: 30
    - cmd: ["{python}", "-c", "from inventory import Reservation\ntry:\n    Reservation(ref='r', sku='a', quantity=0)\nexcept ValueError:\n    pass\nelse:\n    raise AssertionError('quantity below 1 must raise ValueError')"]
      timeout_seconds: 30
    - cmd: ["{python}", "-c", "import dataclasses\nfrom inventory import Reservation\nassert dataclasses.is_dataclass(Reservation), 'Reservation must be a dataclass'\nr = Reservation(ref='r', sku='a', quantity=1)\ntry:\n    r.quantity = 2\nexcept dataclasses.FrozenInstanceError:\n    pass\nelse:\n    raise AssertionError('Reservation must be a frozen dataclass')"]
      timeout_seconds: 30
  lint:
    - cmd: ["{python}", "-c", "from inventory import Item, Store\ns = Store()\ns.add(Item(sku='a', quantity=2))\ns.add(Item(sku='a', quantity=3))\nassert s.quantity('a') == 5, 'existing quantity() accumulation must be preserved'\nassert s.quantity('unknown') == 0"]
      timeout_seconds: 30
