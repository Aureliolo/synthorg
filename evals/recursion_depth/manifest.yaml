# Recording matrix for the recursion-depth sweep.
#
# Repetitions are concentrated rather than uniform. Depths 1 and 2 are expected
# flat and are cheap; the transition ARIES reports sits at 3 to 4, which is
# where samples are worth paying for.
#
# The pairs are the vendor-agnostic placeholders used throughout this
# repository. A maintainer recording real numbers aliases them to real models in
# provider config, so the committed manifest never names a vendor.
#
# `independence` is checked against the declared FAMILIES at load, never against
# the provider: a manifest claiming cross_family whose pairs name one family, or
# name none at all, is refused, and a manifest whose reviewer and executor are
# the same pair is refused outright. Under same_family every artifact carries the
# caveat on its face. Family is declared rather than derived because an
# aggregating connection serves many families through one endpoint, so the
# provider answers a different question than the one decorrelation asks.
#
# Run `python scripts/record_recursion_depth.py` (the default, no --record) to
# print the matrix and the projected session count before anything is charged.
# Relative to THIS file, not to the repository root: the loader resolves it
# against the manifest's own directory, so the sweep reads the same
# specification whatever directory it was invoked from.
spec_dir: spec/sqlcsv
depths: [1, 2, 3, 4, 5, 6]
repetitions:
  1: 1
  2: 1
  3: 3
  4: 3
  5: 3
  6: 2
arms:
  - gated
  - ungated
executor:
  provider: example-provider
  model_id: example-capable-001
  capability: capable
  family: example-family-a
# The declared `family` travels with the placeholder, so the pair a company
# config aliases these to must actually belong to the family named here: the
# cross_family claim below is checked against these strings, and nothing
# downstream re-derives them from the model that answered.
# Declared, not looked up: the capability registry grades a pair from a
# catalogue that knows nothing about a placeholder id, and selection refuses an
# ungraded pair outright, so an undeclared reviewer would leave every review
# unstaffed and the gated arm would record escalations rather than verdicts.
# `family` is declared for the same reason and answers a different question:
# which organisation trained the model, which is what self-preference attaches
# to and what the provider cannot tell you.
reviewer:
  provider: example-provider
  model_id: example-expert-001
  capability: expert
  family: example-family-b
independence: cross_family
# The same number in BOTH arms. Repair only in the gated arm would let it win
# by spending more attempts rather than by catching anything, so the ungated arm
# spends the identical budget blindly.
merge_attempts: 3
# A BASE budget, not a ceiling, and it is the shipped loop's own semantics
# rather than a looseness introduced here: a run that used a tool in the budget
# it just spent earns another budget of the same size, up to
# `engine.max_turn_extensions` times, so the effective cap is this number times
# one plus that allowance. Measuring the product means inheriting that, so the
# bound that actually stops a unit running away is the token ceiling below, and
# it is set with that job in mind. A live run put 52 turns and 1.58M tokens
# into one leaf that delivered nothing.
unit_max_turns: 40
unit_cost_ceiling: 5.0
# Roughly what `unit_cost_ceiling` buys at mid-tier per-token pricing, so the
# two bounds mean about the same thing wherever both can fire. Where only one
# can, this is the one: a flat-rate connection attributes 0.0 to every call.
#
# Sized so the guard stops only a runaway, never productive work, because a
# ceiling that truncates decides the measurement instead of bounding it. Units
# are largest at the shallowest cap, where no recursion is allowed and one leaf
# carries a whole subsystem: at cap 1 a leaf wrote 51 tests, passed 50 and was
# cut off at 605,581 tokens, so its requirements left both numerator and
# denominator over a budget rather than over the work. Read off that curve,
# "shallow trees lose work" would have been an artefact of this number.
# The cost is bounded and accepted: a dead unit now burns more before it is
# stopped, and this sits just under what the runaway above reached. Truncation
# is the commoner failure by far, and unlike a runaway it is invisible in the
# result: the unit reports its own tests failing, which reads as work that did
# not land rather than work that was cut off.
unit_token_ceiling: 1500000
# Aborts rather than overruns. A depth sweep's session count is a product of
# branching factors the manifest cannot predict, and the cost of being wrong
# about it is spend rather than a wrong answer.
max_sessions: 3000
# What the plan projection assumes one planning session splits into. Used ONLY
# to print the bill before a run; nothing in the run reads it, and the tree the
# planner actually produces is whatever it produces.
#
# Rounded DOWN from a real cap-3 tree, which held 85 leaves and 25 nodes that
# planned, so it fits a branching of about 4.4. Down rather than to nearest
# because the figure is a FLOOR and it is the input to choosing max_sessions: a
# floor that reads too low kills a paid run part-way, which is exactly what
# happened when the previous projection printed 42 for the whole matrix against
# a real ~158 per cell.
projected_branching: 4
