name: Warm tree-sitter parser cache
description: |
  Pre-download the tree-sitter-language-pack parser tarball before pytest
  fixtures touch ``get_language``. The ``tree_sitter_language_pack`` Rust
  binding fetches platform-specific parsers from a GitHub releases asset
  on first call, and a transient 502 from the releases CDN otherwise
  surfaces deep inside a pytest fixture as ``_native.Error: Download
  error`` and fails the knowledge test shard. This action warms the cache
  in a separate step whose only job is downloading the tarball, so the
  same 502 retries cleanly here instead of poisoning a multi-minute test
  run.

  The binding performs the fetch internally, so the project's curl
  download-retry flags cannot be threaded into it. ``retry_cmd.sh``
  wraps an arbitrary command rather than a curl invocation, so this step
  gets the house ladder anyway: 5 attempts, 15s doubling to a 120s cap,
  each attempt bounded so a stalled connection becomes a retryable exit
  instead of sitting until the runner is reaped. This is the fetch class
  that helper documents itself for -- an idempotent network download
  whose non-zero exits are either a CDN blip or a deterministic error
  that fails again anyway.

  The deadline sits below the tightest job that uses this action (the
  unit shards, budgeted 10 minutes), so an outage fails loud with the
  ladder's own message while leaving the shard time to run.

runs:
  using: composite
  steps:
    - name: Pre-download tree-sitter parsers (bounded retry)
      shell: bash
      env:
        RETRY_CMD_DEADLINE: "240"
        RETRY_CMD_ATTEMPT_TIMEOUT: "60"
      run: |
        set -euo pipefail
        .github/scripts/retry_cmd.sh "tree-sitter parser download" \
          uv run python -c "from tree_sitter_language_pack import get_language; get_language('python')"
