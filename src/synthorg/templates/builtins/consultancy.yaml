template:
  name: "Consultancy"
  description: >-
    A client-facing advisory firm. Senior-heavy and supervised: a
    Software Architect and senior advisors produce recommendations,
    reviews, and technical guidance under client oversight, with a
    Project Manager owning the client relationship. Advisory rather than a
    full delivery line, so it stays small and senior. Group chat and
    proposals are pre-enabled for stakeholder collaboration.
  version: "1.0.0"
  min_agents: 4
  max_agents: 6
  tags:
    - "consulting"
    - "client-facing"
    - "advisory"
    - "senior-heavy"
    - "supervised"
  skill_patterns:
    - "generator"
    - "reviewer"
    - "inversion"
  posture: "supervised_client_facing"

  variables:
    - name: "company_name"
      description: "Name of your consultancy"
      default: "Consultancy"
    - name: "budget"
      description: "Monthly budget in the company's configured currency"
      var_type: "float"
      default: 60.0
    - name: "wip_limit"
      description: "Work-in-progress limit per column"
      var_type: "int"
      default: 2

  company:
    type: "consultancy"
    budget_monthly: {{ budget | default(60.0) }}
    autonomy:
      level: "supervised"

  departments:
    - name: "consulting"
      budget_percent: 65
      head_role: "Software Architect"
      reporting_lines:
        - subordinate: "Backend Developer"
          subordinate_id: "advisor-1"
          supervisor: "Software Architect"
        - subordinate: "Backend Developer"
          subordinate_id: "advisor-2"
          supervisor: "Software Architect"
    - name: "operations"
      budget_percent: 35
      head_role: "Project Manager"
      reporting_lines:
        - subordinate: "Technical Writer"
          supervisor: "Project Manager"

  agents:
    - role: "Software Architect"
      level: "principal"
      model:
        priority: "quality"
        min_context: 100000
        requires_reasoning: true
      personality_preset: "systems_thinker"
      department: "consulting"
    - role: "Backend Developer"
      merge_id: "advisor-1"
      level: "senior"
      model:
        priority: "quality"
        requires_reasoning: true
      personality_preset: "pragmatic_builder"
      department: "consulting"
    - role: "Backend Developer"
      merge_id: "advisor-2"
      level: "senior"
      model:
        priority: "quality"
        requires_tools: true
      personality_preset: "code_craftsman"
      department: "consulting"
    - role: "Project Manager"
      level: "senior"
      model:
        priority: "speed"
      personality_preset: "client_advisor"
      department: "operations"
    - role: "Technical Writer"
      level: "mid"
      model:
        priority: "quality"
      personality_preset: "technical_communicator"
      department: "operations"

  workflow: "kanban"
  communication: "hierarchical"

  workflow_config:
    kanban:
      wip_limits:
        - column: "in_progress"
          limit: {{ wip_limit | default(2) }}
        - column: "review"
          limit: 2
      enforce_wip: true
    sprint:
      ceremony_policy:
        strategy: "calendar"
        velocity_calculator: "calendar"

  workflow_handoffs:
    - from_department: "consulting"
      to_department: "operations"
      trigger: "Recommendation ready for client review and scheduling"
      artifacts:
        - "advisory_report"
        - "documentation"
    - from_department: "operations"
      to_department: "consulting"
      trigger: "Client feedback requiring revised guidance"
      artifacts:
        - "change_request"
        - "requirements"

  escalation_paths:
    - from_department: "operations"
      to_department: "consulting"
      condition: "Technical blocker impeding client advisory timeline"
      priority_boost: 2
    - from_department: "consulting"
      to_department: "operations"
      condition: "Scope change requiring client communication"
      priority_boost: 1
