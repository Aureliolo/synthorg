name: Retag published container image
description: >-
  Apply release version tags to an image previously published and signed
  by the main-push run of the same SHA. Resolves the signed manifest
  list digest from GHCR's `sha-<short>` tag, applies each metadata-
  action tag to that exact digest via `docker buildx imagetools create`
  (registry-side; no image bytes move), regenerates the CycloneDX SBOM
  against the digest, and emits the per-image `pushed-tags-<image>.txt`
  inventory artifact for the workflow-level `verify-signatures` job.

  Why this exists: the tag-push run of `docker.yml` previously rebuilt
  every image and signed its own slightly-different manifest list bytes,
  racing main-push on the shared `sha-<short>` tag. Since cosign signs
  by digest -- not by tag -- a signature attached to
  `synthorg-<name>@sha256:abc` remains valid for any tag pointing to
  that digest. Resolving once and applying the version tags to that
  same digest carries the existing main-run signature forward to every
  new tag ref by construction. No re-signing, no re-attesting, no race.

  Caller responsibilities:
    - `packages: write` permission on the calling job (covers GHCR
      login + tag application). NO `id-token: write` and NO
      `attestations: write` -- the retag flow neither signs nor
      attests; both already happened in main-run.
    - Run on `runs-on: ubuntu-latest` (Docker buildx is available by
      default; no extra setup needed).
    - The main-push run for the same SHA must have completed
      successfully and pushed `ghcr.io/aureliolo/synthorg-${image-name}:sha-<short>`
      under a cosign signature. The workflow's per-SHA concurrency
      group queues this action behind main-run.

inputs:
  image-name:
    description: "Short image name suffix (e.g. backend, sandbox, sidecar, web, fine-tune-gpu, fine-tune-cpu)."
    required: true
  app-version:
    description: "Application version for the `type=raw` tag on stable `v*` releases."
    required: true
  ghcr-token:
    description: "GITHUB_TOKEN for GHCR login -- must come from the caller's `secrets.GITHUB_TOKEN`."
    required: true

outputs:
  digest:
    description: "Signed multi-arch manifest digest (sha256:...) inherited from the main-run publish."
    value: ${{ steps.resolve.outputs.digest }}
  pushed_tags:
    description: "Newline-separated list of tags applied in this invocation."
    value: ${{ steps.retag.outputs.pushed_tags }}

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.ghcr-token }}

    # Mirror the tag policy from publish-image-loaded so the version
    # tags applied here line up with the policy main-run would have
    # used. Drift between the two metadata-action invocations would
    # surface as a missing tag on the release.
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
      with:
        images: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}
        tags: |
          type=raw,value=${{ inputs.app-version }},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev.') }}
          type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev.') }}
          type=raw,value=dev,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-dev.') }}
          type=sha,prefix=sha-

    # Resolve `sha-<short>` to its manifest list digest. This is the
    # digest cosign signed in main-run; every tag we apply below points
    # at this exact digest, so the existing signature carries over.
    # If main-run did not push this image (or pushed but failed before
    # signing), the inspect call 404s and we fail loudly.
    - name: Resolve main-run signed digest
      id: resolve
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        set -euo pipefail
        REPO="ghcr.io/aureliolo/synthorg-${IMAGE_NAME}"
        SHORT_SHA="${GITHUB_SHA::7}"
        RETRY="${GITHUB_WORKSPACE}/.github/scripts/docker_push_with_retry.sh"

        # Inspect stdout carries the digest, so we cannot merge stderr
        # (Docker emits deprecation warnings on stderr that would
        # corrupt the regex check below). Capture stderr to a tmpfile
        # and inspect it ONLY on failure to decide retry vs fail-fast.
        # Transient GHCR 5xx -> retry with backoff; a true 404 (image
        # not published by main-run) fails immediately.
        #
        # Source the canonical TRANSIENT_RE from docker_push_with_retry.sh
        # and strip the patterns the inspect path cannot benefit from:
        #   - `manifest unknown`: legitimate 404 we MUST fail-fast on
        #     (the "main-push did not publish this image" signal below).
        #   - `blob upload invalid`: write-side error that
        #     `imagetools inspect` cannot produce.
        # `unknown blob` / `blob unknown` stay in: unlikely from a read,
        # but the rare cross-arch race the helper covers can also surface
        # here, and re-reading is idempotent.
        TRANSIENT_RE="$(bash "$RETRY" --print-transient-re \
          | sed -E 's/\|manifest unknown//; s/\|blob upload invalid//')"
        ERR_FILE="$(mktemp /tmp/docker-inspect-err.XXXXXX)"
        trap 'rm -f "$ERR_FILE"' EXIT
        ATTEMPTS=4
        BACKOFF=15
        DIGEST=""
        for ((i = 1; i <= ATTEMPTS; i++)); do
          rc=0
          # Use `cmd || rc=$?` so set -e does not abort and so rc reflects the
          # wrapped command's actual exit code. The `if cmd; then ... fi; rc=$?`
          # idiom would always capture 0 here -- a failed `if cmd` clears $?
          # to 0 once the if-statement completes (same trap the helper has to
          # avoid in docker_push_with_retry.sh).
          DIGEST="$(docker buildx imagetools inspect "${REPO}:sha-${SHORT_SHA}" --format '{{.Manifest.Digest}}' 2>"$ERR_FILE")" || rc=$?
          if [ "$rc" -eq 0 ]; then
            cat "$ERR_FILE" >&2
            break
          fi
          ERR="$(cat "$ERR_FILE")"
          IS_TRANSIENT=false
          if printf '%s' "$ERR" | grep -qiE "$TRANSIENT_RE"; then
            IS_TRANSIENT=true
          fi

          # Mid-loop transient: sleep and retry.
          if [ "$IS_TRANSIENT" = "true" ] && [ "$i" -lt "$ATTEMPTS" ]; then
            printf '%s\n' "$ERR" >&2
            echo "::warning::imagetools inspect ${REPO}:sha-${SHORT_SHA} hit transient registry error (attempt ${i}/${ATTEMPTS}, rc=${rc}); sleeping ${BACKOFF}s before retry" >&2
            sleep "$BACKOFF"
            BACKOFF=$((BACKOFF * 2))
            continue
          fi

          # Otherwise we're done. Surface stderr first; then the annotation
          # differentiates transient-retries-exhausted from a genuine
          # non-transient failure so the operator knows which recovery path
          # to take.
          printf '%s\n' "$ERR" >&2
          if [ "$IS_TRANSIENT" = "true" ]; then
            # i == ATTEMPTS and ERR matched TRANSIENT_RE -- the error pattern
            # was transient but persisted through the full backoff window
            # (15s + 30s + 60s = ~1m45s). GHCR is likely in a longer outage;
            # waiting and re-running the job is the correct response.
            echo "::error::imagetools inspect ${REPO}:sha-${SHORT_SHA} failed (exit ${rc}) -- transient retries exhausted after ${ATTEMPTS} attempts. The error pattern matched TRANSIENT_RE but persisted through the full backoff window; GHCR may be in a longer outage. Check https://www.githubstatus.com/ and re-run this retag job once recovered."
          else
            # Genuine non-transient: no amount of retries would have helped.
            echo "::error::imagetools inspect ${REPO}:sha-${SHORT_SHA} failed (exit ${rc}) with non-transient error. Most common cause: the main-push run of docker.yml for SHA ${SHORT_SHA} did not publish this image (look for 'manifest unknown' / 404 in the stderr above; re-run main-push, then re-run this retag job). For other causes (auth, registry config, TLS verification, ...) inspect the stderr above."
          fi
          exit "$rc"
        done

        if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::imagetools inspect returned an unexpected digest: ${DIGEST}"
          exit 1
        fi
        echo "Resolved ${REPO}:sha-${SHORT_SHA} -> ${DIGEST}"
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

    # Apply every metadata-action tag to the resolved digest in a
    # single `imagetools create` invocation. `imagetools create`
    # accepts multiple `-t` flags and writes the manifest list once
    # per call; batching means one registry round-trip per image
    # instead of one per tag (six tags drop from six API calls to
    # one). Source pinned by `@digest` keeps the operation idempotent
    # on re-runs.
    - name: Apply version tags to signed digest
      id: retag
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        SIGNED_DIGEST: ${{ steps.resolve.outputs.digest }}
        META_TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        set -euo pipefail
        REPO="ghcr.io/aureliolo/synthorg-${IMAGE_NAME}"
        RETRY="${GITHUB_WORKSPACE}/.github/scripts/docker_push_with_retry.sh"
        PUSHED_TAGS=()
        CREATE_ARGS=()
        while IFS= read -r full_tag; do
          [ -z "${full_tag}" ] && continue
          # metadata-action emits fully-qualified refs (repo:tag);
          # strip the repo prefix to get the bare tag.
          t="${full_tag#${REPO}:}"
          CREATE_ARGS+=("-t" "${REPO}:${t}")
          PUSHED_TAGS+=("${t}")
        done <<< "${META_TAGS}"

        if [ "${#PUSHED_TAGS[@]}" -eq 0 ]; then
          echo "::error::metadata-action emitted no tags -- nothing to retag"
          exit 1
        fi

        # Retry transient GHCR 5xx during the manifest-list write. Source
        # is digest-pinned so re-runs produce byte-identical results.
        bash "$RETRY" "docker buildx imagetools create ${REPO} (${#PUSHED_TAGS[@]} tags)" \
          docker buildx imagetools create "${CREATE_ARGS[@]}" "${REPO}@${SIGNED_DIGEST}"
        for t in "${PUSHED_TAGS[@]}"; do
          echo "✓ ${REPO}:${t} -> ${SIGNED_DIGEST}"
        done

        # Newline-separated multiline output, mirroring
        # publish-image-loaded so the inventory writer below and the
        # workflow-level verify-signatures gate consume the same shape.
        {
          printf 'pushed_tags<<__SYNTHORG_TAG_EOF__\n'
          printf '%s\n' "${PUSHED_TAGS[@]}"
          printf '__SYNTHORG_TAG_EOF__\n'
        } >> "$GITHUB_OUTPUT"

    # Regenerate the CycloneDX SBOM against the signed digest.
    # anchore/sbom-action operates on the registry image manifest, so
    # the same digest produces the same SBOM bytes every run -- but
    # `update-release` consumes the artifact from THIS workflow run
    # (cross-run artifact downloads are not supported by
    # actions/download-artifact), so we re-emit it here on tag-push.
    - name: Generate SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: ghcr.io/aureliolo/synthorg-${{ inputs.image-name }}@${{ steps.resolve.outputs.digest }}
        format: cyclonedx-json
        output-file: sbom-${{ inputs.image-name }}.cdx.json

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sbom-${{ inputs.image-name }}
        path: sbom-${{ inputs.image-name }}.cdx.json
        retention-days: 30

    # Same artifact name + format as publish-image-loaded so the
    # workflow-level verify-signatures aggregator works regardless of
    # which path produced the inventory.
    - name: Write pushed-tag inventory
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        PUSHED_TAGS: ${{ steps.retag.outputs.pushed_tags }}
      run: |
        set -euo pipefail
        OUT="pushed-tags-${IMAGE_NAME}.txt"
        : > "$OUT"
        while IFS= read -r t; do
          [ -z "${t}" ] && continue
          printf '%s:%s\n' "${IMAGE_NAME}" "${t}" >> "$OUT"
        done <<< "${PUSHED_TAGS}"
        echo "wrote $(wc -l < "$OUT") tag entries to ${OUT}"

    - name: Upload pushed-tag inventory
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pushed-tags-${{ inputs.image-name }}
        path: pushed-tags-${{ inputs.image-name }}.txt
        retention-days: 7
