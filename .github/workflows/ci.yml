name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Path filter: detect which domains changed ──
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      docker: ${{ steps.filter.outputs.docker }}
      doc_claims: ${{ steps.filter.outputs.doc_claims }}
      # release-please PRs only touch CHANGELOG.md, version.txt, and
      # the manifest. There is no source code to test, so every heavy
      # job below short-circuits on this flag and ci-pass posts success
      # immediately.
      #
      # SECURITY: branch names alone are NOT sufficient -- on a
      # `pull_request` event from a fork, `github.head_ref` is the
      # source ref name, which is fully attacker-controlled. A fork PR
      # named `release-please--evil` would otherwise short-circuit CI
      # and post a green CI Pass with no real testing. We therefore
      # gate the pull_request arm on the PR author identity (set by
      # GitHub at PR creation, not bypassable via branch naming) and
      # only fall back to ref-name detection for push / dispatch
      # events, where pushing `refs/heads/release-please--*` already
      # requires push access to the upstream.
      is_release_please: ${{ (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'synthorg-repo-bot[bot]') || (github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/release-please--')) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - 'atlas.hcl'
            dashboard:
              - 'web/**'
              - 'src/synthorg/api/schemas/**'
              - 'scripts/export_openapi.py'
              - 'docs/openapi/openapi.json'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              # The async-leak ceiling is consumed by the dashboard-test
              # job; bumps must re-run the gate so the new ceiling is
              # validated before merge.
              - '.github/ci/*.max'
            docker:
              - 'docker/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            # Files whose claims are guarded by the doc-drift gate. Docs-only
            # PRs that touch one of these (and nothing in `python:`) still need
            # the gate to run, otherwise a stale "100+" claim could ship.
            doc_claims:
              - 'docs/design/observability.md'
              - 'docs/design/agent-execution.md'
              - 'docs/research/control-plane-audit.md'
              - 'docs/research/acg-formalism-evaluation.md'
              - 'src/synthorg/observability/events/**'
              - 'scripts/check_doc_drift_counts.py'

  # ── Python: Lint ──
  lint:
    name: Lint
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Forbidden literals gate (src/synthorg)
        run: uv run python scripts/check_forbidden_literals.py

      - name: Persistence boundary gate (src/ + tests/)
        run: >-
          uv run python scripts/check_persistence_boundary.py
          --repo-root "${{ github.workspace }}"

      - name: Settings → startup wiring trace (ghost-wired settings gate)
        run: >-
          uv run python scripts/check_setting_to_startup_trace.py
          --repo-root "${{ github.workspace }}"

      - name: Dual-backend test parity gate (conformance + protocols)
        run: >-
          uv run python scripts/check_dual_backend_test_parity.py
          --repo-root "${{ github.workspace }}"

      - name: Cost-recording chokepoint gate
        run: uv run python scripts/check_provider_complete_chokepoint.py

      - name: Typed-boundary contract gate (RFC #1711)
        run: uv run python scripts/check_boundary_typed.py

      - name: Dead API endpoints gate (frontend ↔ backend route parity)
        run: >-
          uv run python scripts/check_dead_api_endpoints.py
          --repo-root "${{ github.workspace }}"

      - name: Schema-drift gate (SQLite vs Postgres parity)
        run: uv run python scripts/check_schema_drift.py

      - name: Review-origin / issue-backref gate (src/ + tests/)
        run: uv run python scripts/check_no_review_origin_in_code.py

      - name: Migration-framing / phase-N gate (src/ + tests/)
        run: uv run python scripts/check_no_migration_framing.py

  # ── Docs: Doc-claim drift gate ──
  # Runs on python OR doc_claims so a docs-only PR that bumps a guarded
  # claim (eg "100+ event constant modules") still triggers the gate.
  doc-drift:
    name: Doc Drift Gate
    needs: changes
    if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.doc_claims == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Doc count drift gate (event modules)
        run: uv run python scripts/check_doc_drift_counts.py

  # ── Schema: Migration Validation ──
  schema-validate:
    name: Schema Validation
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: atlas
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0.3
        with:
          cloud-token: ${{ secrets.ATLAS_TOKEN }}

      - name: Validate migration checksums
        run: atlas migrate validate --dir "file://src/synthorg/persistence/sqlite/revisions" --dev-url "sqlite://file?mode=memory"

      - name: Enforce at most one new migration per PR
        if: github.event_name == 'pull_request'
        env:
          GH_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$GH_BASE_REF" --depth=1
          base_ref="origin/$GH_BASE_REF"
          mapfile -t new_migs < <(
            git diff --name-only --diff-filter=A "$base_ref"...HEAD -- \
              'src/synthorg/persistence/sqlite/revisions/*.sql'
          )
          count=${#new_migs[@]}
          if [ "$count" -gt 1 ]; then
            echo "::error::PR adds $count new Atlas migration files; policy allows at most 1."
            printf '  - %s\n' "${new_migs[@]}" >&2
            echo "" >&2
            echo "Consolidate into a single migration: delete all in-progress migrations" >&2
            echo "and regenerate with 'atlas migrate diff --env sqlite <name>'." >&2
            exit 1
          fi
          echo "OK: PR adds $count new migration(s) (limit 1)."

      - name: Drift detection
        run: |
          diff_output=$(atlas schema diff --env ci \
            --from "file://src/synthorg/persistence/sqlite/revisions" \
            --to "file://src/synthorg/persistence/sqlite/schema.sql")
          if echo "$diff_output" | grep -qv "Schemas are synced"; then
            echo "::error::Schema drift detected between revisions and schema.sql"
            echo "$diff_output"
            exit 1
          fi
          echo "$diff_output"
        # NOTE: atlas migrate lint (policy checks) requires Atlas Pro.
        # Add --env ci lint step here when Pro auth is available.

  # ── Python: Type Check ──
  type-check:
    name: Type Check
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: mypy
        run: uv run mypy src/ tests/

  # ── Python: OpenAPI Liveness ──
  openapi-liveness:
    name: OpenAPI Liveness
    needs: changes
    if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: Assert OpenAPI export is deterministic and complete
        run: uv run python scripts/check_openapi_liveness.py

  # ── Python: Test ──
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required for tokenless Codecov upload via use_oidc: true.
      id-token: write
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}

      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0.3

      - name: Run tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: |
          uv run python -m pytest tests/ \
            -n auto \
            --cov=synthorg \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            --junitxml=junit.xml \
            --durations=20 \
            --durations-min=1.0

      # Codecov upload is best-effort -- CI should not fail on Codecov outages.
      # Coverage enforcement is handled by --cov-fail-under. Uses tokenless
      # OIDC upload for this public repo so no protected secrets are needed.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: junit.xml
          fail_ci_if_error: false
          report_type: test_results
          use_oidc: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit.xml

  # ── Python: Security Audit ──
  python-audit:
    name: Python Security Audit
    needs: changes
    if: (needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv

      - name: pip-audit
        # Ignored vulnerabilities (revisit whenever upstream publishes a fix):
        # - GHSA-xqmj-j6mv-4862: litellm 1.83.0 is pinned by project decision;
        #   fix is in 1.83.7 but the pin is load-bearing for this repo.
        # - CVE-2026-3219: pip 26.0.1 vulnerability with no upstream fix
        #   version available yet. pip is a transitive of uv in this repo.
        run: |
          uv run pip-audit \
            --ignore-vuln GHSA-xqmj-j6mv-4862 \
            --ignore-vuln CVE-2026-3219

  # ── Docker: Dockerfile Lint ──
  dockerfile-lint:
    name: Dockerfile Lint
    needs: changes
    if: (needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: docker/backend/Dockerfile

      - name: Lint sandbox Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: docker/sandbox/Dockerfile

  # ── Dashboard: Lint ──
  dashboard-lint:
    name: Dashboard Lint
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web

  # ── Dashboard: Type Check ──
  dashboard-type-check:
    name: Dashboard Type Check
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Python + uv (OpenAPI export)
        uses: ./.github/actions/setup-python-uv
      - name: Export OpenAPI schema for type codegen
        run: uv run python scripts/export_openapi.py
      - run: npm ci
        working-directory: web
      - run: npm run type-check
        working-directory: web

  # ── Dashboard: Test ──
  dashboard-test:
    name: Dashboard Test
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Python + uv (OpenAPI export)
        uses: ./.github/actions/setup-python-uv
      - name: Export OpenAPI schema for type codegen
        run: uv run python scripts/export_openapi.py
      - run: npm ci
        working-directory: web
      - name: Run Vitest + gate on async-leak baseline
        working-directory: web
        env:
          # Disable color output so the `Leaks N leaks` summary line emitted
          # by Vitest's BaseReporter is plain ASCII. Without this, the line
          # carries ANSI escapes (`\x1b[2m Leaks \x1b[22m ...`) that broke
          # the legacy regex silently -- `grep -oE 'Leaks +[0-9]+ leaks'`
          # never matched, the `|| echo 0` branch fired, and the gate
          # always reported 0 leaks regardless of reality. Vitest honors
          # `NO_COLOR` via chalk.
          NO_COLOR: '1'
          # Structural ceiling: post-M4 leak count measured 2026-04-20 is
          # 49 locally. CI previously measured ~64 on ubuntu-latest against
          # the 50-leak local floor (platform-level event-loop timing); M4
          # shaves off one of those so the CI baseline drops to ~63. The
          # ceiling was 66 -- the expected CI baseline plus a 3-leak
          # run-to-run variance buffer. The structural 49-leak local
          # floor comes from MSW 2.x's own CookieStore (tough-cookie),
          # the MSW XHR interceptor's `queueMicrotask` dispatch, and the
          # axios response interceptor chain -- none reachable from
          # `test-setup.tsx`. Further reduction requires replacing MSW's
          # matching layer (out of scope per PR #1462's typed handlers +
          # Storybook integration; follow-up tracked by #1468). See
          # docs/design/web-http-adapter.md for the full investigation
          # including the 2026-04-20 M1/M4/Option C research round.
          #
          # 2026-04-21 (PR #1500, WEB-1): raised 66 -> 72. WEB-1 adds
          # per-store WS payload sanitizers (``sanitizeApproval`` /
          # ``sanitizeMeeting`` / ``sanitizeTask``) and strict shape
          # guards validating enum membership on every incoming WS
          # payload. The new code paths are purely synchronous (no new
          # timers, no new fire-and-forget ``create_task`` equivalents,
          # no new MSW requests) but exercise existing MSW-mocked
          # fetches through more store callsites, so the structural MSW
          # interceptor + axios response-chain microtask leaks get hit
          # ~6-8 more times on ubuntu-latest. Local measurement moved
          # 53 -> 57 (+4); CI moved 63 -> 69-71 (+6-8). 72 = 69-71
          # observed CI baseline for this PR + the same 3-leak variance
          # buffer. Lower again once #1468 replaces MSW's matching
          # layer; do not raise further without the same kind of
          # documented per-PR justification.
          #
          # 2026-04-22 (PR #1506, WEB-2): raised 72 -> 80. WEB-2 adds
          # fast-check property tests to nine component/hook suites
          # (``breadcrumbs`` / ``error-banner`` / ``list-header`` /
          # ``pagination`` / ``progress-indicator`` / ``search-filter-sort``
          # / ``use-list-pagination`` / ``use-list-shortcuts`` /
          # ``use-unsaved-changes-guard``) with numRuns capped at 15-20
          # per property. Each property mount exercises the same MSW-
          # intercepted render paths that existed before, so the
          # structural XHR interceptor + axios response-chain leaks get
          # hit a few more times. Observed CI: 63 -> 76 (+13 raw
          # including the now-fixed ShortcutRegistry infinite-loop that
          # tripped tough-cookie / microtask leaks in the cheatsheet
          # test worker before it was killed by the CI timeout). Stable
          # CI baseline for this PR is 76; 80 = 76 + a 4-leak run-to-run
          # variance buffer (same class of buffer we've used on earlier
          # raises, rounded up to the next integer boundary given the
          # wider surface-area change in this PR).
          # Lower again once #1468 replaces MSW's matching layer.
          # The ceiling lives in ``.github/ci/web-async-leaks.max`` so
          # raises show up in PR diffs instead of being buried in the
          # workflow YAML.  The single-line file is read below.
        run: |
          set -o pipefail
          # The step runs with ``working-directory: web``; the ceiling
          # file lives at the repo root, so reference it via
          # ``$GITHUB_WORKSPACE`` instead of a relative path.
          MAX_ASYNC_LEAKS=$(grep -v '^#' "$GITHUB_WORKSPACE/.github/ci/web-async-leaks.max" | head -1 | tr -d '[:space:]')
          if ! [[ "$MAX_ASYNC_LEAKS" =~ ^[0-9]+$ ]]; then
            echo "::error::.github/ci/web-async-leaks.max is not a positive integer: '$MAX_ASYNC_LEAKS'"
            exit 1
          fi
          # Sanity-clamp the ceiling so an accidental extra zero (or a
          # wholesale wipe to zero) doesn't green-light a regression or
          # block CI forever.  The 1..1000 range covers every historical
          # value plus meaningful headroom; anything outside signals a
          # typo that should be reviewed, not auto-accepted.
          if (( MAX_ASYNC_LEAKS < 1 || MAX_ASYNC_LEAKS > 1000 )); then
            echo "::error::Async-leak ceiling '$MAX_ASYNC_LEAKS' is outside the sanity range [1, 1000]. Fix .github/ci/web-async-leaks.max or widen the bounds deliberately in ci.yml."
            exit 1
          fi
          echo "Async-leak ceiling: $MAX_ASYNC_LEAKS (from .github/ci/web-async-leaks.max)"
          # Disable errexit around the test pipeline so a Vitest failure
          # doesn't abort the step before we can read ${PIPESTATUS[0]}
          # (GitHub Actions runs `run:` blocks with `bash -e`).
          set +e
          npm run test -- --coverage --detect-async-leaks 2>&1 | tee vitest-output.log
          tests_exit=${PIPESTATUS[0]}
          set -e
          if [ "$tests_exit" -ne 0 ]; then
            echo "::error::Vitest exited with $tests_exit -- see suite failures above."
            exit "$tests_exit"
          fi
          # Strict parser: fail if Vitest did not emit a `Leaks N leaks`
          # line at all (format drift or --detect-async-leaks not applied)
          # rather than silently passing with a default of 0.
          #
          # Vitest's `BaseReporter` writes the leak summary line after
          # the test run finishes but BEFORE the v8 coverage table, and
          # the coverage table comfortably exceeds 200 lines -- so a
          # naive `tail -n 200` cuts the summary off. Anchor the match
          # to the whole line instead: a test's `console.log('Reporter:
          # Leaks 50 leaks detected')` (or any substring containing the
          # phrase) will not satisfy the gate, and `tail -1` picks the
          # final match -- defensive guard against any rare case where
          # grep returns multiple anchored lines (e.g. Vitest reruns
          # emitting two summary blocks); the last line is the reporter's
          # authoritative total. The count is extracted with a bash
          # regex capture group so extra digits elsewhere on the line
          # cannot bleed in.
          leaks_line=$(grep -E '^[[:space:]]*Leaks +[0-9]+ leaks[[:space:]]*$' vitest-output.log | tail -1 || true)
          if [ -z "$leaks_line" ]; then
            echo "::error::Could not locate 'Leaks N leaks' line in Vitest output tail."
            echo "::error::Either --detect-async-leaks was not applied, or Vitest changed its output format."
            exit 1
          fi
          if [[ "$leaks_line" =~ Leaks[[:space:]]+([0-9]+)[[:space:]]+leaks ]]; then
            leaks="${BASH_REMATCH[1]}"
          else
            echo "::error::Failed to extract leak count from line: $leaks_line"
            exit 1
          fi
          echo "Detected $leaks async leaks (ceiling: $MAX_ASYNC_LEAKS)."
          if [ "$leaks" -gt "$MAX_ASYNC_LEAKS" ]; then
            echo "::error::Async-leak count $leaks exceeds ceiling $MAX_ASYNC_LEAKS. See issue #1466 and docs/design/web-http-adapter.md."
            exit 1
          fi

  # ── Dashboard: Build ──
  dashboard-build:
    name: Dashboard Build
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Python + uv (OpenAPI export)
        uses: ./.github/actions/setup-python-uv
      - name: Export OpenAPI schema for type codegen
        run: uv run python scripts/export_openapi.py
      - run: npm ci
        working-directory: web
      - name: Production build
        run: npm run build
        working-directory: web
      # Bundle-size budgets are enforced inside the same job to reuse
      # the just-built ``dist/`` artifact -- a separate job would have
      # to ``npm ci`` + ``npm run build`` again, doubling Vite's
      # cost (~2-3 min) per PR.
      - name: size-limit budget check
        run: npm run size
        working-directory: web

  # ── Dashboard: Security Audit ──
  dashboard-audit:
    name: Dashboard Security Audit
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: npm audit (critical + high)
        run: npm audit --audit-level=high
        working-directory: web

  # ── Dashboard: Storybook Build ──
  dashboard-storybook-build:
    name: Dashboard Storybook Build
    needs: changes
    if: (needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.is_release_please != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Run npm run storybook:build -- --disable-telemetry
        run: npm run storybook:build -- --disable-telemetry
        working-directory: web
        env:
          # Prevent OOM-induced crashes on CI runners with limited RAM.
          # --report-on-fatalerror captures Node.js-level crashes (OOM,
          # assertions) but NOT native addon SIGSEGV -- those need OS
          # core dumps. --report-directory ensures reports land in a
          # predictable location for artifact upload.
          NODE_OPTIONS: "--max-old-space-size=4096 --report-on-fatalerror --report-directory=."
      - name: Upload Node.js crash report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-crash-report
          path: web/report.*.json
          if-no-files-found: ignore

  # ── Branch-protection drift audit ──
  # Compares live rulesets against .github/branch_protection.yml. Runs on
  # push to main (informational) and workflow_dispatch. continue-on-error
  # for now so benign drift in the spec's initial capture does not block
  # every push; promote to blocking once the spec has survived 30 days
  # of zero-drift runs (tracked in #1555).
  #
  # Authentication: the GitHub rulesets REST API requires a token with
  # ``administration: read`` scope. GITHUB_TOKEN cannot be granted that
  # scope via workflow permissions, so the job mints a fresh
  # ``synthorg-repo-bot`` App installation token via the shared
  # ``release-runner-setup`` composite. The App's scope is already
  # Contents RW + PRs RW + Metadata R (see docs/reference/github-
  # environments.md); rulesets are accessible to any installation with
  # metadata read, which is sufficient for this read-only audit.
  branch-protection-audit:
    name: Branch-protection drift audit
    # Accept push-to-main (informational) AND workflow_dispatch from
    # main so the audit can be triggered ad-hoc from Actions -> "CI"
    # -> Run workflow. The ``release`` environment's branch policy
    # also restricts deploys to main, so allowing this job to attempt
    # a deploy from a non-main ref would surface a noisy "deployment
    # was rejected" annotation on every CI run dispatched against a
    # release-please branch (the standard nudge used by release.yml
    # to trigger CI on App-token-authored PRs). Gate at the if: check
    # so non-main dispatches simply skip this job.
    #
    # Fork gate: skip in forks. The audit needs the release-bot App
    # token (env-scoped secret on `release`) and a fork won't have it.
    # ci-preflight reports the missing setup separately.
    #
    # Precedence: `&&` binds tighter than `||`, so the inner
    # parentheses around `(push || dispatch)` are required to keep
    # the trigger-OR group intact under the outer fork-AND-main-AND.
    if: >-
      !github.event.repository.fork
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Release runner setup
        id: setup
        uses: ./.github/actions/release-runner-setup
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
      - name: Install yq
        run: |
          set -euo pipefail
          # yq (Mike Farah) -- Go binary, no runtime deps.  Retry on
          # transient GitHub-releases CDN flakes.
          sudo curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Audit
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
        run: bash scripts/audit_branch_protection.sh

  # ── Gate: all required checks passed ──
  ci-pass:
    name: CI Pass
    if: always()
    needs: [changes, lint, doc-drift, schema-validate, type-check, openapi-liveness, test, python-audit, dockerfile-lint, dashboard-lint, dashboard-type-check, dashboard-test, dashboard-build, dashboard-audit, dashboard-storybook-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          # Jobs that were skipped (not needed) count as passing.
          # Only "failure" is a real failure.
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.lint.result }}
            ${{ needs.doc-drift.result }}
            ${{ needs.schema-validate.result }}
            ${{ needs.type-check.result }}
            ${{ needs.openapi-liveness.result }}
            ${{ needs.test.result }}
            ${{ needs.python-audit.result }}
            ${{ needs.dockerfile-lint.result }}
            ${{ needs.dashboard-lint.result }}
            ${{ needs.dashboard-type-check.result }}
            ${{ needs.dashboard-test.result }}
            ${{ needs.dashboard-build.result }}
            ${{ needs.dashboard-audit.result }}
            ${{ needs.dashboard-storybook-build.result }}
        run: |
          # Any "failure" or "cancelled" in the results means CI failed.
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed. Job results: $RESULTS"
            exit 1
          fi
          echo "All CI checks passed (some may have been skipped due to path filters)"
